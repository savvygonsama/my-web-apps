<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동차강판 부품 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 스틸 계열 앱(코일센터 시뮬레이터)과 같은 결: 모서리를 자른 면, 청회색 바탕, 감청색 강조 */
  :root{
    --bg:#E3E9EF;
    --f1:#F4F7F9; --f2:#E6ECF1; --f3:#D3DDE6; --edge:#BCC8D4;
    --ink:#16202B; --ink-2:#4A5866; --ink-3:#7D8B9A;
    --blue:#1F5C99; --blue-l:#4C8AC4; --deep:#243342;
    --red:#B8463C; --ok:#2E7D53; --amber:#9A6B22; --teal:#1A7B83; --slate:#56677A; --green:#3E7A3A;
    --cut:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:16px;
    font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 90px}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
  h1{font-size:clamp(24px,5.5vw,32px);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1;
     background:linear-gradient(112deg,#3E7FBF 0 34%,#1F5C99 34% 62%,#123F6E 62% 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .progress{font-size:13px;color:var(--ink-2);background:var(--f1);border:1px solid var(--edge);padding:6px 12px;--cut:8px;white-space:nowrap}
  .progress b{color:var(--blue);font-family:"IBM Plex Mono",monospace}

  nav.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
  nav.tools a{background:var(--f1);border:1px solid var(--edge);padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink-2);--cut:8px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
  nav.tools a:hover,nav.tools a.on{background:var(--deep);color:#fff;border-color:var(--deep)}

  .crumbbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--edge);margin-bottom:16px}
  .back{background:var(--blue);color:#fff;font-weight:700;padding:9px 15px;--cut:8px;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
  .back:hover{filter:brightness(1.1)}
  .back[hidden]{display:none}
  .crumbs{font-size:13.5px;color:var(--ink-3);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .crumbs a{color:var(--ink-2);font-weight:600}
  .crumbs a:hover{color:var(--blue);text-decoration:underline}
  .crumbs .sep{margin:0 6px;color:var(--edge)}
  .crumbs .here{color:var(--ink);font-weight:700}

  h2.title{font-size:clamp(22px,5vw,28px);letter-spacing:-.025em;margin:0 0 10px;line-height:1.2}
  .en{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--ink-3);margin:0 0 10px}
  .desc{color:var(--ink-2);margin:0 0 14px;font-size:15.5px}
  .why{background:var(--f1);border-left:4px solid var(--blue);padding:12px 16px;margin:0 0 18px;font-size:15px}
  .why b{display:block;font-size:12px;color:var(--blue);letter-spacing:.04em;margin-bottom:2px}

  /* 이미지 + 핀 */
  .figs{display:grid;gap:12px;margin:0 0 6px}
  .fig{position:relative;background:#fff;border:1px solid var(--edge);max-width:720px;width:100%;margin:0 auto}
  .fig img{display:block;width:100%;height:auto}
  .fig svg.areas{position:absolute;inset:0;width:100%;height:100%}
  .fig svg.areas polygon{fill:transparent;stroke:transparent;cursor:pointer;transition:fill .12s}
  .fig svg.areas a:hover polygon,.fig svg.areas a:focus polygon{fill:rgba(31,92,153,.16);stroke:rgba(31,92,153,.6);stroke-width:.35}
  .fig.hero{max-width:none;border:0;background:transparent}
  body.home .crumbbar{display:none}
  .pin{position:absolute;transform:translate(-16px,-50%);display:inline-flex;align-items:center;gap:6px;
       background:rgba(22,32,43,.9);color:#fff;font-size:12.5px;font-weight:700;padding:4px 9px 4px 4px;min-height:32px;
       white-space:nowrap;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
  .pin i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--deep);
       font-family:"IBM Plex Mono",monospace;font-size:12px;flex:none}
  .pin.rt{flex-direction:row-reverse;padding:4px 4px 4px 9px;transform:translate(calc(-100% + 16px),-50%)}
  .pin:hover,.pin:focus{background:var(--blue);z-index:2}
  .pin.seen i{background:#BFE3CC;color:#1F5F40}
  .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--deep);color:#fff;
       font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;margin-right:6px;vertical-align:1px}
  .credit{font-size:11px;color:var(--ink-3);margin:0 0 16px}
  /* 부품 말풍선 */
  .figs.bubbling .pin:not(.act){opacity:.35}
  .pin.act{background:var(--red);z-index:3}
  .pin.act i{background:#fff;color:var(--red)}
  .bub{position:absolute;z-index:6;width:250px;background:#fff;border:1px solid var(--edge);border-radius:12px;
       box-shadow:0 10px 30px rgba(22,32,43,.28);padding:12px 14px 10px;font-size:14px;line-height:1.45;
       animation:bubIn .22s cubic-bezier(.2,.8,.3,1.2) both}
  .bub::before{content:"";position:absolute;width:12px;height:12px;background:#fff;border:1px solid var(--edge);
       transform:rotate(45deg);top:var(--ay,20px)}
  .bub.r::before{left:-7px;border-right:0;border-top:0}
  .bub.l::before{right:-7px;border-left:0;border-bottom:0}
  .bub.b::before{left:var(--ax,20px);top:-7px;border-right:0;border-bottom:0}
  .bub.t::before{left:var(--ax,20px);top:auto;bottom:-7px;border-left:0;border-top:0}
  @keyframes bubIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .bub .bx{position:absolute;right:6px;top:4px;font-size:18px;color:var(--ink-3);width:30px;height:30px}
  .bub .bk{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:1px 7px;border-radius:4px;margin-bottom:3px}
  .bub .bn{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em;padding-right:22px;margin-bottom:6px}
  .bub dl{display:grid;grid-template-columns:38px 1fr;gap:5px 8px;margin:0;border-top:1px solid var(--f3);padding-top:7px}
  .bub dt{font-size:12px;font-weight:700;color:var(--ink-3);padding-top:1px}
  .bub dd{margin:0;font-weight:600}
  .bub dd small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
  .bub .bnote{font-size:11.5px;color:var(--ink-3);margin-top:6px}
  .bub .more{display:block;text-align:right;font-size:12.5px;font-weight:700;color:var(--blue);margin-top:6px}
  .ibub{position:relative;margin:2px 0 8px;width:auto;animation:bubIn .22s ease both}
  .ibub::before{display:none}
  .prow.act{border-color:var(--red);background:#fff}
  /* 화면 전환용 잔상 */
  .ghost{position:fixed;z-index:4;pointer-events:none;margin:0;overflow:visible}
  @media(max-width:560px){ .bub{width:210px;font-size:13.5px} }
  /* 부품 카드 위 그림: 그 부품 쪽으로 확대 */
  .pfig{position:relative;background:#fff;border:1px solid var(--edge);overflow:hidden;margin:4px auto 6px;max-width:620px}
  .pfig .zin{transition:transform .35s ease}
  .pfig .zin img{display:block;width:100%;height:auto}
  .pfig.zoom .zin{transform:scale(var(--z,1.9))}
  .pfig .dot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
       background:rgba(22,32,43,.55);color:#fff;font:600 11px "IBM Plex Mono",monospace;transition:opacity .2s}
  .pfig .dot:hover{background:var(--blue)}
  .pfig.zoom .dot{opacity:0;pointer-events:none}
  .pfig .me{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
       border:4px solid var(--red);background:transparent;box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;pointer-events:none}
  .pfig .me::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--red);animation:ping 1.6s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .pfig .ztog{position:absolute;right:8px;bottom:8px;background:rgba(22,32,43,.85);color:#fff;font-size:12.5px;font-weight:700;
       padding:7px 12px;border-radius:16px;min-height:34px}
  .pfig .ztog:hover{background:var(--blue)}
  /* 위치 추적 줄: 상위 단계 그림을 작게 이어 붙인다 */
  .trail{display:flex;align-items:center;gap:4px;margin:0 0 14px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
  .trail .tr{flex:1 1 0;min-width:104px;max-width:190px;display:block;background:#fff;border:1px solid var(--edge);padding:4px 4px 6px;border-radius:6px}
  .trail .tr:hover{border-color:var(--blue-l)}
  .trail .tr .ti{position:relative}
  .trail .tr img{display:block;width:100%;height:auto;border-radius:3px}
  .trail .tr .ring{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;
       border:3px solid var(--red);box-shadow:0 0 0 1.5px #fff,inset 0 0 0 1.5px #fff}
  .trail .tr .tl{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.3}
  .trail .tr .tl b{display:block;font-size:13px;color:var(--ink)}
  .trail .ar{flex:none;color:var(--ink-3);font-weight:700}
  .trail .now{flex:0 1 auto;min-width:84px;max-width:150px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;
       background:var(--deep);color:#C8D8E8;border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.3}
  .trail .now b{display:block;color:#fff;font-size:13.5px;margin-top:2px}
  .pcap{font-size:12px;color:var(--ink-3);margin:0 auto 14px;max-width:620px}

  /* 하위 분류 타일 */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--f1);border:1px solid var(--edge);padding:16px 18px 14px;display:block;min-height:120px;transition:transform .08s}
  .tile:hover{background:#fff;border-color:var(--blue-l);transform:translateY(-1px)}
  .tile .tn{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .tile .te{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.05em}
  .tile .td{font-size:14px;color:var(--ink-2);margin-top:6px}
  .tile .tc{font-size:12px;color:var(--ink-3);margin-top:8px}
  .tile .tc b{color:var(--blue)}
  .tile.big{border-top:4px solid var(--blue)}

  /* 필터 칩 */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{background:var(--f1);border:1px solid var(--edge);padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:36px;--cut:6px}
  .chip.on{background:var(--deep);border-color:var(--deep);color:#fff}

  /* 부품 목록 */
  h3.sub{font-size:14px;letter-spacing:.02em;color:var(--ink-2);margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--edge)}
  .plist{display:grid;gap:8px}
  .prow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--f1);border:1px solid var(--edge);padding:11px 14px;min-height:56px;--cut:8px}
  .prow:hover{background:#fff;border-color:var(--blue-l)}
  .prow .ck{width:22px;height:22px;border:2px solid var(--edge);display:grid;place-items:center;font-size:13px;color:#fff}
  .prow.seen .ck{background:var(--ok);border-color:var(--ok)}
  .prow .pn{font-weight:700;font-size:15.5px;line-height:1.3}
  .prow .pa{font-size:12.5px;color:var(--ink-3)}
  .prow .ps{font-size:13px;color:var(--ink-2);margin-top:2px}
  .prow.dim{opacity:.62}

  .kind{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;color:#fff;--cut:5px;white-space:nowrap}
  .k-외판{background:var(--blue)} .k-내판{background:var(--teal)} .k-골격{background:var(--slate)}
  .k-보강{background:var(--red)} .k-섀시{background:var(--green)} .k-기타{background:var(--amber)}

  /* 부품 카드 */
  .pcard{background:#fff;border:1px solid var(--edge);padding:20px 20px 16px;margin-bottom:14px}
  .facts{display:grid;grid-template-columns:88px 1fr;gap:0;margin:6px 0 12px;border-top:1px solid var(--f3)}
  .facts dt,.facts dd{margin:0;padding:10px 0;border-bottom:1px solid var(--f3)}
  .facts dt{font-size:13px;font-weight:700;color:var(--ink-3)}
  .facts dd{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
  .facts dd.whyline{font-size:15px;font-weight:500;color:var(--ink-2);line-height:1.6}
  .facts dd .mono{font-size:17px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;background:var(--f2);color:var(--ink-2);--cut:5px}
  .badge.c-상,.badge.c-중상{background:#D7E6DC;color:#1F5F40}
  .badge.c-중{background:#E8E3D2;color:#6C5413}
  .badge.c-중하,.badge.c-하{background:#F0DCDA;color:#8F332A}
  .badge.draft{background:#FFF1C9;color:#7A5A00}

  .tabs{display:flex;gap:2px;margin:0;border-bottom:2px solid var(--deep)}
  .tabs button{padding:10px 16px;font-weight:700;font-size:14.5px;color:var(--ink-2);background:var(--f2);min-height:44px}
  .tabs button.on{background:var(--deep);color:#fff}
  .tabpane{background:var(--f1);border:1px solid var(--edge);border-top:0;padding:16px 18px;margin-bottom:16px;font-size:15px}
  .tabpane h4{margin:14px 0 6px;font-size:13px;color:var(--ink-3);letter-spacing:.02em}
  .tabpane h4:first-child{margin-top:0}
  .tabpane p{margin:0 0 6px}
  .std{border:1px solid var(--edge);background:#fff;padding:10px 12px;margin-bottom:8px;font-size:14px}
  .std .sl{font-weight:700;margin-bottom:4px}
  .std .sr{display:grid;grid-template-columns:70px 1fr;gap:4px;color:var(--ink-2)}
  .std .sr span:nth-child(odd){font-size:12px;color:var(--ink-3);font-weight:700;padding-top:2px}
  .qa{background:#fff;border:1px solid var(--edge);padding:12px 14px;margin-bottom:10px}
  .qa .q{font-weight:700}
  .qa .q::before{content:"Q. ";color:var(--blue)}
  .qa .a{color:var(--ink-2);margin-top:4px}
  .qa .a::before{content:"A. ";color:var(--ok);font-weight:700}
  .talk{background:var(--deep);color:#fff;padding:12px 16px;font-weight:600;--cut:8px}
  .talk::before{content:"상담 한 줄  ";color:#9EC3EA;font-size:12px;font-weight:700}
  .blank{color:var(--ink-3);font-style:italic}
  .sales{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--f3)}
  .sales div{padding:9px 0;border-bottom:1px solid var(--f3)}
  .sales div:nth-child(odd){font-size:13px;font-weight:700;color:var(--ink-3)}

  .pager{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
  .pager a,.btn{background:var(--f1);border:1px solid var(--edge);padding:10px 14px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;--cut:8px;max-width:48%}
  .pager a:hover,.btn:hover{background:#fff;border-color:var(--blue-l)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.primary:hover{background:var(--blue-l)}
  .coursebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--deep);color:#fff;padding:10px 14px;margin-bottom:14px;--cut:8px;flex-wrap:wrap}
  .coursebar .bar{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.2)}
  .coursebar .bar i{display:block;height:100%;background:#7FB3E6}
  .coursebar .btn:not(.primary){color:var(--ink)}

  /* 검색 */
  .searchbox{display:flex;gap:8px;margin:0 0 16px}
  .searchbox input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--edge);background:#fff;min-height:48px;outline:none}
  .searchbox input:focus{border-color:var(--blue)}
  .path{font-size:12px;color:var(--ink-3)}

  /* 퀴즈 */
  .quiz .qn{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
  .quiz .qt{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px;line-height:1.4}
  .opts{display:grid;gap:8px}
  .opt{text-align:left;background:var(--f1);border:2px solid var(--edge);padding:12px 14px;font-size:15.5px;font-weight:600;min-height:52px}
  .opt:hover:not([disabled]){border-color:var(--blue-l);background:#fff}
  .opt.right{border-color:var(--ok);background:#E3F1E8}
  .opt.wrong{border-color:var(--red);background:#F7E4E2}
  .opt[disabled]{cursor:default}
  .explain{margin-top:12px;background:#fff;border-left:4px solid var(--ok);padding:10px 14px;font-size:14.5px}
  .score{font-size:42px;font-weight:700;font-family:"IBM Plex Mono",monospace;color:var(--blue);letter-spacing:-.03em}

  /* 용어 */
  .gl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;border-top:1px solid var(--edge)}
  .gl dt,.gl dd{margin:0;padding:10px 0;border-bottom:1px solid var(--edge)}
  .gl dt{font-weight:700;padding-right:12px}
  .gl dd{color:var(--ink-2);font-size:15px}
  .glbtn{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);border-bottom:1px dashed var(--blue-l)}

  .note{background:var(--f1);border:1px solid var(--edge);padding:14px 18px;margin-bottom:12px;font-size:14.5px;color:var(--ink-2)}
  .note h3{margin:0 0 6px;color:var(--ink);font-size:16px}
  .note ul{margin:4px 0 0;padding-left:20px}

  footer.draft{position:fixed;left:0;right:0;bottom:0;background:#FFF1C9;color:#6B4F00;font-size:12.5px;text-align:center;padding:7px 12px;border-top:1px solid #E8D290;z-index:6}
  @media(max-width:560px){
    .facts{grid-template-columns:72px 1fr}
    .sales{grid-template-columns:96px 1fr}
    .gl{grid-template-columns:1fr}
    .gl dt{border-bottom:0;padding-bottom:0}
    .prow{grid-template-columns:24px 1fr}
    .prow .kindcell{display:none}
    .tabs button{padding:10px 11px;font-size:13.5px}
    .crumbs{white-space:normal;line-height:1.5}
    .pin,.pin.rt{padding:4px;min-height:0;transform:translate(-50%,-50%)}
    .pin span{display:none}
    .pin i{width:26px;height:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="kicker">Auto Steel Map · <span id="edition"></span></p>
      <h1>자동차강판 부품 지도</h1>
    </div>
    <div class="progress cut" id="progress"></div>
  </header>
  <nav class="tools" id="tools">
    <a class="cut" href="#/" data-r="home">처음으로</a>
    <a class="cut" href="#/s/" data-r="s">부품 검색</a>

<script>
/* 이 판의 차종. "ice" 내연차, 나중에 "ev" 전기차판을 붙일 수 있게 데이터는 둘 다 들고 있다 */
const MODE = "ice", MODE_NAME = { ice:"내연차편", ev:"전기차편" }[MODE];
const ALL_PARTS = PARTS;
(function(){
"use strict";
const $ = s => document.querySelector(s);
/* 이 판에서 보일 부품만 남긴다 */
const PARTS = ALL_PARTS.filter(p => !p.v || p.v === MODE);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PMAP = {}; PARTS.forEach(p => PMAP[p.id] = p);
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;   // 움직임 줄이기 설정이면 애니메이션 생략
const COURSE_V = COURSE.filter(id => PMAP[id]);

/* 진도 저장 — 저장이 막힌 환경에서도 화면은 그대로 동작 */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const SEEN_KEY = "autoSteelMap.seen.v1";
let seen = new Set(store.get(SEEN_KEY, []).filter(id => PMAP[id]));
function markSeen(id){ if(!seen.has(id)){ seen.add(id); store.set(SEEN_KEY, [...seen]); } }

/* 트리 도우미 */
function nodeChain(id){ const out = []; let n = id; while(n){ out.unshift(n); n = TREE[n].parent; } return out; }
function partsUnder(id){
  const t = TREE[id]; if(!t) return [];
  if(t.kids) return t.kids.flatMap(partsUnder);
  return PARTS.filter(p => p.g === id);
}
function subName(p){ const t = TREE[p.g]; const s = (t.subs || []).find(x => x[0] === p.s); return s ? s[1] : ""; }
function pathText(p){ return nodeChain(p.g).slice(1).map(n => TREE[n].name).concat(subName(p)).filter(Boolean).join(" › "); }
/* 분류 이름·설명을 이 판 기준으로 바꾸고, 보일 부품이 없는 분류는 뺀다 */
Object.values(TREE).forEach(t => {
  ["name","desc","why"].forEach(f => { const by = t[f + "By"]; if(by && by[MODE]) t[f] = by[MODE]; });
});
Object.keys(TREE).forEach(id => {
  const t = TREE[id];
  if(t.kids) t.kids = t.kids.filter(k => (!TREE[k].v || TREE[k].v === MODE) && partsUnder(k).length);
});
/* 두께: 앞쪽 숫자 범위 바로 뒤에만 mm를 붙인다 (예: "1.2~2.1 (냉연), …" → "1.2~2.1 mm (냉연), …") */
const thick = t => /mm/.test(t) ? t : String(t).replace(/^([\d.]+(?:~[\d.]+)?)/, "$1 mm");
function summary(p){ return [p.b + (p.c && p.c !== "—" ? " " + p.c : ""), p.gr, thick(p.t)].join(" · "); }

/* 화면 위쪽 공통 */
function setProgress(){
  $("#progress").innerHTML = `본 부품 <b>${seen.size}</b> / ${PARTS.length}`;
}
function setCrumbs(items, backHref){
  // items: [[label, href|null], ...]
  $("#crumbs").innerHTML = items.map((it, i) => i === items.length - 1
      ? `<span class="here">${esc(it[0])}</span>`
      : `<a href="${it[1]}">${esc(it[0])}</a><span class="sep">›</span>`).join("");
  const b = $("#back");
  if(backHref){ b.hidden = false; b.href = backHref; } else { b.hidden = true; }
}
function setTool(r){ document.querySelectorAll("#tools a").forEach(a => a.classList.toggle("on", a.dataset.r === r)); }
function nodeCrumbs(id){ return nodeChain(id).map(n => [TREE[n].name, "#/n/" + n]); }

/* ---------- 분류 화면 ---------- */
let filt = { kind:"전체", hideNonSheet:false };
/* 그림 위 핀 번호 — 목록·타일의 번호와 짝을 이룬다 */
const pinOk = to => (TREE[to] && (TREE[to].parent === undefined || nodeChain(to).every(n => !TREE[n].parent || TREE[TREE[n].parent].kids.includes(n)))) || PMAP[to];
function imgsOf(id){
  return (IMGS[id] || []).filter(im => IMG_SRC[im.file] && (!im.v || im.v === MODE))
    .map(im => ({ file:im.file, pins:im.pins.filter(pn => pinOk(pn[0])), areas:(im.areas || []).filter(a => pinOk(a[0])) }));
}
function pinNums(id){
  const m = {}; let n = 0;
  imgsOf(id).forEach(im => im.pins.forEach(pn => { if(!(pn[0] in m)) m[pn[0]] = ++n; }));
  return m;
}
function figHTML(id, hero){
  const ims = imgsOf(id);
  if(!ims.length) return "";
  const nums = pinNums(id);
  const hrefOf = to => TREE[to] ? "#/n/" + to : "#/n/" + PMAP[to].g + "/" + to;
  const areas = im => !im.areas || !im.areas.length ? "" :
    `<svg class="areas" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">` +
    im.areas.map(([to, pts]) => `<a data-go="${hrefOf(to)}" tabindex="0"><polygon points="${pts}"/></a>`).join("") + `</svg>`;
  const one = im => `<div class="fig ${hero ? "hero" : ""}"><img src="${IMG_SRC[im.file]}" alt="${esc(TREE[id].name)} 그림" loading="lazy">` + areas(im) +
    im.pins.map(([to, x, y, lb, dir]) => {
      const href = hrefOf(to);
      const full = TREE[to] ? TREE[to].name : PMAP[to].n;
      return `<a class="pin ${(dir ? dir === "l" : x > 58) ? "rt" : ""} ${seen.has(to) ? "seen" : ""}" href="${href}" ${PMAP[to] ? `data-part="${to}"` : ""} title="${esc(full)}" style="left:${x}%;top:${y}%"><i>${nums[to]}</i><span>${esc(lb || full)}</span></a>`;
    }).join("") + `</div>`;
  return `<div class="figs">${ims.map(one).join("")}</div>` + (hero ? "" : `<p class="credit">${esc(IMG_CREDIT)}</p>`);
}
function partRow(p, num){
  const nonSheet = p.sh === "하";
  return `<a class="prow cut ${seen.has(p.id) ? "seen" : ""} ${nonSheet ? "dim" : ""}" href="#/n/${p.g}/${p.id}" data-row="${p.id}">
    <span class="ck">${seen.has(p.id) ? "✓" : ""}</span>
    <span><div class="pn">${num ? `<span class="num">${num}</span>` : ""}${esc(p.n)}</div>
      <div class="ps">${esc(summary(p))}</div>
      ${p.al ? `<div class="pa">${esc(p.al)}</div>` : ""}</span>
    <span class="kindcell"><span class="kind cut k-${p.k}">${p.k}</span>${nonSheet ? `<div class="pa" style="text-align:right">판재 비중 낮음</div>` : ""}</span>
  </a>`;
}
function renderNode(id, pid, course){
  const t = TREE[id]; if(!t || !pinOk(id)) return renderNode("root");
  setTool(course != null ? "c" : id === "root" ? "home" : "");
  setCrumbs(course != null ? [["자동차", "#/"], ["5분 기본 코스", null]] : nodeCrumbs(id), course != null ? "#/" : t.parent ? "#/n/" + t.parent : null);
  document.body.classList.toggle("home", id === "root");
  /* 첫 화면은 설명 없이 차 그림만. 부위를 누르면 아래 단계로 들어간다 */
  if(id === "root" && imgsOf(id).length){
    $("#view").innerHTML = figHTML(id, true);
    /* 부위(다각형)를 누르면 그 분류로 */
    $("#view").querySelectorAll("[data-go]").forEach(a => {
      const go = () => { location.hash = a.dataset.go; };
      a.addEventListener("click", go);
      a.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
    });
    return;
  }
  const chain = nodeChain(id);
  let h = "";
  if(course != null){
    const last = course === COURSE_V.length - 1;
    h += `<div class="coursebar cut"><b>5분 기본 코스 ${course + 1} / ${COURSE_V.length}</b>
      <div class="bar"><i style="width:${(course + 1) / COURSE_V.length * 100}%"></i></div>
      ${course > 0 ? `<a class="btn cut" style="max-width:none" href="#/c/${course - 1}">← 이전</a>` : ""}
      ${last ? `<a class="btn primary cut" style="max-width:none" href="#/quiz">확인 문제 →</a>` : `<a class="btn primary cut" style="max-width:none" href="#/c/${course + 1}">다음 부품 →</a>`}</div>`;
  }
  /* 그림이 주인공: 제목 바로 아래에 큰 그림, 설명은 그 아래 */
  h += trailHTML(chain, chain.length - 1) + `<h2 class="title">${esc(t.name)} <span class="en" style="display:inline;margin:0">${esc(t.en || "")}</span></h2>`;
  h += figHTML(id);
  h += `<p class="desc">${esc(t.desc)}</p>`;
  if(t.why) h += `<div class="why"><b>이 그룹은 왜 이 소재인가</b>${esc(t.why)}</div>`;
  const nums = pinNums(id), numTag = k => nums[k] ? `<span class="num">${nums[k]}</span>` : "";
  if(t.kids){
    h += `<div class="tiles">` + t.kids.map(k => {
      const c = TREE[k], ps = partsUnder(k), sn = ps.filter(p => seen.has(p.id)).length;
      return `<a class="tile cut ${id === "root" ? "big" : ""}" href="#/n/${k}">
        <div class="tn">${numTag(k)}${esc(c.name)}</div><div class="te">${esc(c.en || "")}</div>
        <div class="td">${esc(c.desc)}</div>
        <div class="tc">부품 ${ps.length}개 · 본 것 <b>${sn}</b></div></a>`;
    }).join("") + `</div>`;
    if(id === "root"){
      h += `<div class="tiles">
        <a class="tile cut" href="#/c/0"><div class="tn">5분 기본 코스</div><div class="td">대표 부품 ${COURSE_V.length}개를 순서대로 훑습니다. 처음이라면 여기부터.</div></a>
        <a class="tile cut" href="#/s/"><div class="tn">부품 검색</div><div class="td">상담 직전에 부품명으로 바로 찾기. 현장 통칭으로도 찾아집니다.</div></a>
        <a class="tile cut" href="#/quiz"><div class="tn">확인 문제 3개</div><div class="td">본 내용을 떠올려 보는 짧은 문제. 매번 새로 나옵니다.</div></a>
      </div>`;
    }
  } else {
    const ps = partsUnder(id);
    const kinds = ["전체", ...new Set(ps.map(p => p.k))];
    if(!kinds.includes(filt.kind)) filt.kind = "전체";
    h += `<div class="chips">` + kinds.map(k => `<button class="chip cut ${filt.kind === k ? "on" : ""}" data-kind="${k}">${k}</button>`).join("")
       + (ps.some(p => p.sh === "하") ? `<button class="chip cut ${filt.hideNonSheet ? "on" : ""}" data-hide="1">판재 비중 낮은 부품 숨기기</button>` : "")
       + `</div>`;
    const shown = ps.filter(p => (filt.kind === "전체" || p.k === filt.kind) && !(filt.hideNonSheet && p.sh === "하"));
    (t.subs || [["", ""]]).forEach(([sk, sn]) => {
      const list = shown.filter(p => p.s === sk);
      if(!list.length) return;
      h += `<h3 class="sub">${esc(sn)} <span class="mono" style="color:var(--ink-3);font-weight:400">${list.length}</span></h3>
            <div class="plist">${list.map(p => partRow(p, nums[p.id])).join("")}</div>`;
    });
    if(!shown.length) h += `<p class="desc">조건에 맞는 부품이 없습니다.</p>`;
  }
  $("#view").innerHTML = h;
  $("#view").querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { filt.kind = b.dataset.kind; renderNode(id, null, course); });
  $("#view").querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { filt.hideNonSheet = !filt.hideNonSheet; renderNode(id, null, course); });
  /* 코스에서는 주소를 바꾸지 않고 그 자리에서 말풍선만 연다 */
  if(course != null) $("#view").querySelectorAll("[data-part],[data-row]").forEach(a => a.onclick = e => { e.preventDefault(); openBubble(a.dataset.part || a.dataset.row, true); });
  cur.node = id; cur.part = null;
  if(pid){
    openBubble(pid, false);
    /* 화면 전환이 끝난 뒤 말풍선이 보이게 내려 준다 */
    setTimeout(() => {
      const b = document.querySelector(".bub"); if(!b || cur.part !== pid) return;
      const r = b.getBoundingClientRect();
      if(r.top < 70 || r.bottom > innerHeight - 50) window.scrollBy({ top:r.top - Math.max(80, (innerHeight - r.height) / 2), behavior:"smooth" });
    }, calm ? 0 : 520);
  }
}

/* ---------- 부품 말풍선 ----------
   그림 속 그 부품 핀 옆에 펴진다. 핀이 없으면 목록 줄 바로 아래에 펴진다 */
const cur = { node:null, part:null };
function specOf(p){
  const ss = p.cls.map(k => CLS[k] && CLS[k].s).filter(Boolean);
  return ss.slice(0, 2).join(" 또는 ");
}
function bubbleHTML(p, note, inline){
  const coat = p.c && p.c !== "—" ? " " + p.c : "";
  return `<div class="bub ${inline ? "ibub" : ""}" role="dialog" aria-label="${esc(p.n)}">
    <button class="bx" aria-label="닫기">×</button>
    <span class="bk k-${p.k}">${p.k}</span>
    <b class="bn">${esc(p.n)}</b>
    <dl><dt>품종</dt><dd>${esc(p.b + coat)}</dd>
        <dt>규격</dt><dd>${esc(specOf(p))}<small>${esc(p.gr)}</small></dd>
        <dt>두께</dt><dd>${esc(thick(p.t))}</dd></dl>
    ${note ? `<div class="bnote">${esc(note)}</div>` : ""}
    <a class="more" href="#/d/${p.id}">자세히 ›</a></div>`;
}
function closeBubble(){
  document.querySelectorAll(".bub").forEach(b => b.remove());
  document.querySelectorAll(".pin.act,.prow.act").forEach(x => x.classList.remove("act"));
  document.querySelectorAll(".figs.bubbling").forEach(x => x.classList.remove("bubbling"));
  cur.part = null;
}
function openBubble(pid, scroll){
  closeBubble();
  const p = PMAP[pid]; if(!p) return;
  const alias = FOCUS_ALIAS[pid], target = alias ? alias[0] : pid;
  markSeen(pid); setProgress();
  cur.part = pid;
  const row = document.querySelector(`[data-row="${pid}"]`);
  if(row){ row.classList.add("act"); row.classList.add("seen"); row.querySelector(".ck").textContent = "✓"; }
  const pin = document.querySelector(`.pin[data-part="${target}"]`);
  if(!pin){
    if(row){ row.insertAdjacentHTML("afterend", bubbleHTML(p, alias && alias[1], true)); bindBub(); if(scroll) row.scrollIntoView({ block:"center", behavior:"smooth" }); }
    return;
  }
  pin.classList.add("act", "seen");
  const fig = pin.closest(".fig"); fig.closest(".figs").classList.add("bubbling");
  fig.insertAdjacentHTML("beforeend", bubbleHTML(p, alias && alias[1], false));
  const b = fig.querySelector(".bub");
  const fw = fig.clientWidth, fh = fig.clientHeight, bw = b.offsetWidth, bh = b.offsetHeight;
  const px = parseFloat(pin.style.left) / 100 * fw, py = parseFloat(pin.style.top) / 100 * fh;
  let side = px > fw / 2 ? "l" : "r", left = side === "r" ? px + 20 : px - 20 - bw, top = py - 26;
  if(left < 4 || left + bw > fw - 4){
    /* 옆에 자리가 없으면(휴대폰) 핀 아래나 위로 */
    left = Math.max(4, Math.min(fw - bw - 4, px - bw / 2));
    if(py + 22 + bh <= fh + 60){ side = "b"; top = py + 22; } else { side = "t"; top = py - 22 - bh; }
    b.style.setProperty("--ax", Math.max(12, Math.min(bw - 24, px - left - 6)) + "px");
  } else {
    top = Math.max(-10, Math.min(fh - bh + 10, top));
    b.style.setProperty("--ay", Math.max(10, Math.min(bh - 22, py - top - 6)) + "px");
  }
  b.classList.add(side);
  b.style.left = left + "px"; b.style.top = top + "px";
  b.style.transformOrigin = side === "r" ? "0 30px" : side === "l" ? "100% 30px" : side === "b" ? "50% 0" : "50% 100%";
  bindBub();
  if(scroll){
    const r = b.getBoundingClientRect(), pr = pin.getBoundingClientRect();
    if(pr.top < 60 || r.bottom > innerHeight - 40) pin.scrollIntoView({ block:"center", behavior:"smooth" });
  }
}
function bindBub(){
  document.querySelectorAll(".bub .bx").forEach(x => x.onclick = e => {
    e.preventDefault();
    if(location.hash.startsWith("#/n/") && cur.node) history.replaceState(null, "", "#/n/" + cur.node);
    closeBubble();
  });
}
document.addEventListener("click", e => {
  if(!cur.part || e.target.closest(".bub,.pin,.prow")) return;
  if(location.hash.startsWith("#/n/") && cur.node) history.replaceState(null, "", "#/n/" + cur.node);
  closeBubble();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && cur.part){ if(cur.node && location.hash.startsWith("#/n/")) history.replaceState(null, "", "#/n/" + cur.node); closeBubble(); } });

/* ---------- 위치 추적 줄 ----------
   path: 자동차부터 지금 보는 것까지의 id 목록 (분류들 + 마지막에 부품 id 가능)
   upto: 그림으로 보여 줄 상위 단계 수 (마지막 단계는 본문 큰 그림이 맡는다)
   각 단계 그림에서, 경로상 그 뒤에 오는 것 중 핀이 있는 가장 가까운 것에 고리를 친다 */
function trailHTML(path, upto, nowLabel){
  const name = id => TREE[id] ? TREE[id].name : PMAP[id] ? PMAP[id].n : "";
  const cells = [];
  path.slice(0, upto).forEach((n, i) => {
    const rest = path.slice(i + 1);
    let hit = null;
    for(const r of rest){
      for(const im of imgsOf(n)){ const pn = im.pins.find(x => x[0] === r); if(pn){ hit = { im, r, x:pn[1], y:pn[2] }; break; } }
      if(hit) break;
    }
    if(!hit) return;   // 그림이 없는 단계(예: 시트·파워트레인 묶음)는 건너뛴다
    cells.push(`<a class="tr" href="#/n/${n}" title="${esc(name(n))}로 가기">
      <div class="ti"><img src="${IMG_SRC[hit.im.file]}" alt=""><span class="ring" style="left:${hit.x}%;top:${hit.y}%"></span></div>
      <div class="tl">${esc(name(n))}<b>${esc(name(hit.r))}</b></div></a>`);
  });
  if(cells.length && nowLabel) cells.push(`<div class="now">지금 보는 것<b>${esc(nowLabel)}</b></div>`);
  return cells.length ? `<nav class="trail" aria-label="차에서의 위치">${cells.join(`<span class="ar">›</span>`)}</nav>` : "";
}

/* ---------- 부품 카드 ---------- */
/* 이 부품이 핀으로 찍힌 그림을 찾는다. 자기 분류의 그림을 먼저 본다 */
function focusOf(p){
  const alias = FOCUS_ALIAS[p.id], target = alias ? alias[0] : p.id;
  const order = [p.g, ...Object.keys(IMGS).filter(k => k !== p.g)];
  for(const node of order){
    for(const im of imgsOf(node)){
      const pin = im.pins.find(pn => pn[0] === target);
      if(pin) return { node, im, x:pin[1], y:pin[2], note: alias ? alias[1] : "" };
    }
  }
  return null;
}
let zoomed = true;
function partFigHTML(p){
  const f = focusOf(p); if(!f) return "";
  const nums = pinNums(f.node);
  const others = f.im.pins.filter(pn => pn[0] !== (FOCUS_ALIAS[p.id] || [p.id])[0] && PMAP[pn[0]])

const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sheetParts = () => PARTS.filter(p => p.sh !== "하");
const label = p => `${p.b}${p.c && p.c !== "—" ? " " + p.c : ""} · ${p.gr}`;
const famKey = p => p.cls[0];
const TEMPLATES = [
  { q:"핫스탬핑(1500급)이 주로 쓰이는 부품은?", ok:p => p.cls[0] === "PHS" },
  { q:"열연 산세(PO)를 주로 쓰는 부품은?", ok:p => p.c.indexOf("PO") === 0 },
  { q:"외관 품질 때문에 BH강을 주로 쓰는 부품은?", ok:p => p.cls[0] === "BH" },
  { q:"무방향성 전기강판이 쓰이는 부품은?", ok:p => p.cls.indexOf("NOES") >= 0 },
  { q:"판재가 아닌(주조·단조·선재) 부품은?", ok:p => p.cls.some(c => c === "CAST" || c === "FORGE" || c === "SPRING"), pool:() => PARTS }
];
function makeQuiz(){
  const qs = [];
  // 유형 A: 부품 → 소재 (2문항)
  shuffle(sheetParts()).slice(0, 2).forEach(p => {
    // 오답은 같은 규격 계열이 아니고, 소재 기반이나 표면처리도 달라야 헷갈림 없이 하나만 정답이 된다
    const wrong = shuffle(sheetParts().filter(x => famKey(x) !== famKey(p) && (x.b !== p.b || x.c !== p.c)));
    const opts = [p], used = new Set([label(p)]);
    for(const w of wrong){ if(opts.length >= 4) break; if(!used.has(label(w))){ used.add(label(w)); opts.push(w); } }
    qs.push({ text:`'${p.n}'에 주로 쓰는 소재는?`, opts:shuffle(opts).map(o => ({ t:label(o), right:o === p })), part:p });
  });
  // 유형 B: 소재 → 부품 (1문항)
  const tpl = shuffle(TEMPLATES).find(t => (t.pool ? t.pool() : sheetParts()).some(t.ok));
  const pool = tpl.pool ? tpl.pool() : sheetParts();
  const ans = shuffle(pool.filter(tpl.ok))[0];
  const wrong = shuffle(sheetParts().filter(x => !tpl.ok(x))).slice(0, 3);
  qs.push({ text:tpl.q, opts:shuffle([ans, ...wrong]).map(o => ({ t:o.n, right:o === ans })), part:ans });
  return qs;
}

  setTool("quiz");

  const Q = quiz.qs[quiz.i];

/* ---------- 길잡이 + 화면 전환 ----------
   들어갈 때: 이전 화면이 누른 지점으로 확대되며 사라지고, 새 화면이 그 지점에서 커지며 나온다
   나올 때: 지금 화면이 들어왔던 지점으로 줄어들며 물러나고, 상위 화면이 다시 다가온다 */
function parse(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [r, ...rest] = h.split("/");
  return { r, a:rest[0] || "", b:rest[1] || "", arg:rest.join("/") };
}
function keyOf(q){ return q.r === "n" ? "n/" + (q.a || "root") : q.r === "" ? "n/root" : q.r + "/" + q.a; }
function depthOf(q){
  if(q.r === "n" || q.r === "") return TREE[q.a || "root"] ? nodeChain(q.a || "root").length : 1;
  if(q.r === "d" && PMAP[q.a]) return nodeChain(PMAP[q.a].g).length + 1;
  return null;   // 검색·코스·문제 등은 옆으로 넘기기
}
function draw(q){
  window.scrollTo(0, 0);
  document.body.classList.remove("home");
  cur.node = null; cur.part = null;
  if(q.r === "n") renderNode(q.a || "root", q.b || null);
  else if(q.r === "d") renderPart(q.a);
  else if(q.r === "c") renderCourse(+q.a || 0);
  else if(q.r === "s") renderSearch(q.arg);
  else if(q.r === "quiz") renderQuiz();
  else if(q.r === "gloss") renderGloss();
  else if(q.r === "about") renderAbout();
  else renderNode("root");
}
let lastPoint = null, curQ = null;
const enterPoint = {};
document.addEventListener("pointerdown", e => { lastPoint = { x:e.clientX, y:e.clientY }; }, true);
function route(){
  let q = parse();
  if(q.r === "p"){   // 예전 부품 주소는 그 분류 그림 + 말풍선으로
    const p = PMAP[q.a];
    history.replaceState(null, "", p ? "#/n/" + p.g + "/" + p.id : "#/");
    q = parse();
  }
  /* 같은 분류 안에서 말풍선만 바뀌면 화면은 그대로 두고 말풍선만 */
  if(curQ && q.r === "n" && curQ.r === "n" && (q.a || "root") === (curQ.a || "root") && cur.node){
    curQ = q;
    if(q.b) openBubble(q.b, true); else closeBubble();
    return;
  }
  const view = $("#view"), d0 = curQ ? depthOf(curQ) : null, d1 = depthOf(q);
  const k0 = curQ ? keyOf(curQ) : null, k1 = keyOf(q);
  let ghost = null, r0 = null;
  document.querySelectorAll(".ghost").forEach(g => g.remove());
  if(curQ && !calm){
    r0 = view.getBoundingClientRect();
    ghost = view.cloneNode(true); ghost.removeAttribute("id"); ghost.classList.add("ghost");
    Object.assign(ghost.style, { left:r0.left + "px", top:r0.top + "px", width:r0.width + "px" });
  }
  const dir = d0 == null || d1 == null || d0 === d1 ? "side" : d1 > d0 ? "in" : "out";
  if(dir === "in" && lastPoint) enterPoint[k1] = lastPoint;
  curQ = q;
  draw(q);
  if(!ghost) return;
  document.body.appendChild(ghost);
  const r1 = view.getBoundingClientRect();
  const pt = dir === "in" ? (lastPoint || { x:innerWidth / 2, y:innerHeight / 3 })
           : dir === "out" ? (enterPoint[k0] || { x:innerWidth / 2, y:innerHeight / 3 }) : null;
  const T = 560, ease = "cubic-bezier(.22,.7,.2,1)";
  let a0, a1;
  if(dir === "in"){
    ghost.style.transformOrigin = (pt.x - r0.left) + "px " + (pt.y - r0.top) + "px";
    view.style.transformOrigin = (pt.x - r1.left) + "px " + (pt.y - r1.top) + "px";
    a0 = ghost.animate([{ transform:"scale(1)", opacity:1, filter:"blur(0)" }, { transform:"scale(2.8)", opacity:0, filter:"blur(3px)" }], { duration:T, easing:"ease-in", fill:"forwards" });
    a1 = view.animate([{ transform:"scale(.3)", opacity:0 }, { transform:"scale(1)", opacity:1 }], { duration:T, easing:ease });
  } else if(dir === "out"){
    ghost.style.transformOrigin = (pt.x - r0.left) + "px " + (pt.y - r0.top) + "px";
    view.style.transformOrigin = (pt.x - r1.left) + "px " + (pt.y - r1.top) + "px";
    a0 = ghost.animate([{ transform:"scale(1)", opacity:1 }, { transform:"scale(.3)", opacity:0 }], { duration:T, easing:ease, fill:"forwards" });
    a1 = view.animate([{ transform:"scale(2.2)", opacity:0, filter:"blur(3px)" }, { transform:"scale(1)", opacity:1, filter:"blur(0)" }], { duration:T, easing:ease });
  } else {
    a0 = ghost.animate([{ transform:"translateX(0)", opacity:1 }, { transform:"translateX(-60px)", opacity:0 }], { duration:360, easing:"ease-in", fill:"forwards" });
    a1 = view.animate([{ transform:"translateX(60px)", opacity:0 }, { transform:"translateX(0)", opacity:1 }], { duration:360, easing:ease });
  }
  a0.onfinish = () => ghost.remove();
  a1.onfinish = () => { view.style.transformOrigin = ""; };
}
let lastPart = null;
window.addEventListener("hashchange", () => {
  // 다른 부품 상세로 넘어가면 탭은 '규격·근거'부터
  const m = location.hash.match(/^#\/d\/(.+)$/);
  const key = m ? m[0] : null;
  if(key !== lastPart){ tab = "std"; lastPart = key; }
  route();
});
$("#edition").textContent = MODE_NAME;
document.title = "자동차부품지도 · " + MODE_NAME;
setProgress(); route();
})();
</script>

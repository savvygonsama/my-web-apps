}
function speedBar(id){
  return '<span class="speedbar" id="'+id+'">속도 '+[0.6,0.75,0.9,1.0].map(r=>
    '<button data-r="'+r+'" class="'+(Math.abs(S.cfg.rate-r)<0.01?"on":"")+'">'+r+'x</button>').join("")+'</span>';
}
function bindSpeed(id){
  document.querySelectorAll("#"+id+" button").forEach(b=> b.onclick = ()=>{
    S.cfg.rate = +b.dataset.r; save();
    document.querySelectorAll("#"+id+" button").forEach(x=>x.classList.toggle("on", x===b));

/* --- step 4 : 쉐도잉 (핵심) --- */
function stepShadow(d){
  const i = cur.line, l = d.lines[i];
  const reps = cur.reps[i]||0, target = S.cfg.reps;
  const chunks = chunksOf(l);
  let h = '<div class="row" style="margin:10px 0 0"><span class="sub">문장 '+(i+1)+' / '+d.lines.length+'</span>';
  h += '<span style="flex:1"></span>'+speedBar("shSpeed")+'</div>';
  h += '<div class="shadowbox">';
  h +=   '<div class="who '+(l.s==="B"?"b":"")+'">'+(l.s==="B"?esc(d.names.B):esc(d.names.A))+'</div>';
  h +=   '<div class="bigzh">'+esc(l.zh)+'</div>';
  h +=   '<div class="bigpy py">'+pyHTML(l.py)+'</div>';
  if(chunks.length>1){
    h += '<div class="sub" style="font-size:12px;margin-top:6px">덩어리로 끊어 읽기 — 각 줄을 눌러 따라 하세요</div>';
    h += '<div class="chunks">'+chunks.map((c,ci)=>'<div class="chunk" data-c="'+ci+'"><span class="zh">'+esc(c.zh)+'</span>'+pyBox(c.py)+'</div>').join("")+'</div>';
  }
  h +=   '<div class="bigko">'+esc(l.ko)+'</div>';
  h +=   '<div class="rule"></div>';
  h +=   '<div class="row"><button class="btn" id="pLine">듣기 ▶</button>'+
         '<button class="btn ghost sm" id="pSlow">천천히 0.6x</button>'+
         '<button class="btn '+(autoTok?"blue":"ghost")+' sm" id="pAuto">'+(autoTok?"■ 자동 정지":"자동 진행 ▶▶")+'</button>'+
         '<span style="flex:1"></span><span class="counter" id="dots">'+
         Array.from({length:target},(_,k)=>'<span class="dot '+(k<reps?"on":"")+'"></span>').join("")+'</span></div>';
  if(l.notes && l.notes.length){
    h += '<div class="notes"><div class="sub" style="font-size:12px;margin-bottom:4px">표현 노트</div>';
    l.notes.forEach(n=>{
      h += '<div class="note"><b>'+esc(n.t)+'</b><span class="np">'+pyHTML(n.p||"")+'</span><span class="k">'+esc(kLabel(n.k))+'</span> — '+esc(n.m)+
           (n.tip?'<span class="tip">'+esc(n.tip)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="row"><button class="btn ghost" id="sPrev">← 앞 문장</button>'+
       '<button class="btn" id="sNext">다음 문장 →</button>'+
       '<span class="sub" style="font-size:12px">스페이스바=듣기, Enter=다음</span></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("shSpeed"); bindBlur(); bindPyClick();

  const play = (rate)=>{ stopSpeak(); bumpRep(i); speak(l.zh, l.s, rate||S.cfg.rate); };
  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.6);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c].zh, l.s, Math.min(S.cfg.rate,0.75));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = zh => Math.max(1100, cLen(zh) * 420);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.zh, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.zh));
    });
  })(0);
}
function kLabel(k){
  return ({word:"단어", expr:"표현", grammar:"문법", measure:"양사", pron:"발음", culture:"문화", idiom:"관용"})[k] || k;
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.zh, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

/* --- step 5 : 역할극 + 말해보기 --- */

  const saved = S.out[d.id] || [];
  let h = '<div class="card"><b>역할극 — 내 대사를 내가 말하기</b>'+
    '<div class="sub" style="margin:4px 0 8px">상대 대사는 앱이 읽어 줍니다. 내 대사 차례에는 화면이 파랗게 바뀌고 잠시 멈춥니다. 그때 소리 내어 말하세요.</div>'+
    '<div class="row"><span class="sub">내 역할</span>'+
    '<button class="btn '+(me==="A"?"blue":"ghost")+' sm rrole" data-r="A">A · '+esc(d.names.A)+'</button>'+
    '<button class="btn '+(me==="B"?"blue":"ghost")+' sm rrole" data-r="B">B · '+esc(d.names.B)+'</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="rpStart">역할극 시작 ▶</button>'+
    '<button class="btn ghost sm" id="rpStop">정지 ■</button>'+
    '<button class="btn ghost sm" id="rpHide">내 대사 '+(cur.showKo?"가리기":"가린 채 보기")+'</button></div>'+
    '<div class="rule"></div><div id="rpList">'+
    d.lines.map((l,i)=>'<div class="rp '+(l.s===me?"mine":"")+'" data-i="'+i+'"><div class="sp">'+l.s+'</div>'+
      '<div><span class="zh'+(l.s===me?" blurme":"")+'">'+esc(l.zh)+'</span>'+pyBox(l.py)+
      '<span class="ko">'+esc(l.ko)+'</span></div></div>').join("")+'</div></div>';
  h += '<div class="card"><b>내 말로 말해 보기</b>'+
    '<div class="sub" style="margin:4px 0 0">각 질문에 <b>30초씩 소리 내어</b> 답하세요. 말한 뒤 기억나는 문장을 한 줄만 적어 두면 다음에 비교할 수 있습니다.</div><div class="rule"></div>';
  d.out.forEach((q,i)=>{
    h += '<div class="qbox"><div class="q">'+esc(q.q)+'</div>'+
         '<div class="hint">쓸 표현 — <b>'+esc(q.hint)+'</b></div>'+
         '<div class="row" style="margin:6px 0"><button class="btn ghost sm timer" data-i="'+i+'">30초 타이머</button>'+
         '<span class="sub" id="tm'+i+'"></span></div>'+
         '<textarea data-i="'+i+'" placeholder="말한 내용 중 한 문장만 적어 두세요 (선택)">'+esc(saved[i]||"")+'</textarea></div>';
  });
  h += '</div>';
  $("#stepbody").innerHTML = h; bindBlur(); bindPyClick();

  document.querySelectorAll(".rrole").forEach(b=> b.onclick = ()=>{
    S.cfg.myRole = b.dataset.r; save(); stopSpeak(); stepOutput(d); });
  $("#rpHide").onclick = ()=>{ document.querySelectorAll("#rpList .blurme").forEach(x=>x.classList.toggle("show")); };
  $("#rpStop").onclick = ()=> stopSpeak();
  $("#rpStart").onclick = ()=> runRolePlay(d, me, other);
  document.querySelectorAll("#rpList .rp").forEach(el=> el.onclick = ()=>{
    stopSpeak(); const i=+el.dataset.i; speak(d.lines[i].zh, d.lines[i].s, S.cfg.rate); });
  document.querySelectorAll("#stepbody textarea").forEach(t=> t.onchange = ()=>{
    const arr = S.out[d.id] || []; arr[+t.dataset.i]=t.value; S.out[d.id]=arr; save();
  });
  document.querySelectorAll(".timer").forEach(b=> b.onclick = ()=>{
    let s=30; const out=$("#tm"+b.dataset.i);
    clearInterval(b._t); out.textContent="00:30 — 지금 말하세요";
    b._t = setInterval(()=>{ s--; out.textContent = s>0 ? "00:"+pad(s) : "끝 — 잘했습니다"; if(s<=0) clearInterval(b._t); }, 1000);
  });
}
function runRolePlay(d, me, other){
  const token = {}; rpTok = token;
  let i = 0;
  const mark = (idx)=>{
    document.querySelectorAll("#rpList .rp").forEach(e=>e.classList.remove("now"));
    const el = document.querySelector('#rpList .rp[data-i="'+idx+'"]');
    if(el){ el.classList.add("now"); el.scrollIntoView({block:"center", behavior:"smooth"}); }
  };
  (function step(){
    if(rpTok!==token) return;
    if(i>=d.lines.length){ rpTok=null; toast("역할극 끝 — 수고하셨습니다"); return; }
    const l = d.lines[i]; mark(i);
    if(l.s===other){
      speak(l.zh, l.s, S.cfg.rate, ()=>{ i++; setTimeout(step, 300); });
    } else {
      const wait = Math.max(1600, cLen(l.zh)*520);
      setTimeout(()=>{ if(rpTok!==token) return; i++; step(); }, wait);
    }
  })();
}

/* ---------- 기록 ---------- */

       '<div><b>'+info.total+'</b><span>학습일</span></div><div><b>'+info.mins+'</b><span>총 분</span></div>'+
       '<div><b>'+info.lines+'</b><span>누적 문장</span></div></div>';
  h += '<div class="rule"></div><div class="sub" style="font-size:12px">최근 4주</div><div class="cal">';

  for(let i=27;i>=0;i--){ const x=new Date(dd); x.setDate(dd.getDate()-i); arr.push(x); }

    h += '<div class="histrow"><b>'+k.slice(5)+'</b><span style="flex:1" class="hz">'+(d?esc(d.title):"—")+'</span>'+
         '<span class="sub">'+r.min+'분 · '+r.lines+'문장</span></div>'; });
  h += '</div>';
  h += '<div class="card"><b>데이터 백업</b><div class="sub" style="margin:4px 0 10px">이 앱은 브라우저 안에 기록을 저장합니다. '+
       '브라우저 데이터를 지우면 사라지므로, 가끔 백업 파일을 내려받아 두세요.</div>'+

       '<div id="bkOut"></div></div>';
  h += '<div class="card"><b>기록 초기화</b><div class="sub" style="margin:4px 0 8px">모든 학습 기록과 추가한 회차가 지워집니다. 되돌릴 수 없습니다.</div>'+
       '<button class="btn ghost sm" id="reset" style="color:var(--accent);border-color:var(--accent)">전체 초기화</button></div>';
  $("#view-log").innerHTML = h;
  $("#reset").onclick = ()=>{
    if(confirm("모든 기록을 지웁니다. 계속할까요?")){
      S.prog={}; S.log={}; S.star={}; S.out={}; S.custom=[]; S.spot=null; save(); rebuild(); toast("초기화했습니다"); go("home");
    }
  };

/* 파일로 저장할 수 없는 화면(공유 페이지 등)에서는 내용을 직접 복사하게 한다 */
function showBackupText(json){
  const box = $("#bkOut"); if(!box) return;
  box.innerHTML = '<div class="sub" style="margin:10px 0 6px">이 화면에서는 파일로 바로 저장할 수 없습니다. '+
    '아래 내용을 <b>전체 복사</b>해서 메모장에 붙여넣고 <b>.json</b>으로 저장해 두세요.</div>'+
    '<textarea id="bkTa" style="min-height:120px;font-size:12px"></textarea>'+
    '<div class="row" style="margin-top:6px"><button class="btn ghost sm" id="bkCopy">전체 복사</button>'+
    '<button class="btn ghost sm" id="bkClose">닫기</button></div>';
  $("#bkTa").value = json;
  $("#bkCopy").onclick = ()=>{
    const t = $("#bkTa"); t.focus(); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject())
      .then(()=> toast("복사했습니다"), ()=> toast("Ctrl+C로 복사하세요"));
  };
  $("#bkClose").onclick = ()=>{ box.innerHTML = ""; };
}
function exportData(){
  const json = JSON.stringify({v:1, prog:S.prog, log:S.log, star:S.star, out:S.out, custom:S.custom, cfg:S.cfg}, null, 1);
  const name = "chaguan-backup-"+today()+".json";
  const embedded = (window.top !== window.self) || !!window.claude;
  if(embedded){ showBackupText(json); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast("백업 파일을 내려받았습니다");
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(o.prog) S.prog=o.prog; if(o.log) S.log=o.log; if(o.star) S.star=o.star;
      if(o.out) S.out=o.out; if(o.custom) S.custom=o.custom; if(o.cfg) S.cfg=Object.assign(S.cfg,o.cfg);
      save(); rebuild(); applyLook(); toast("백업을 불러왔습니다"); render();
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };
  r.readAsText(f);
}

/* ---------- 단어장 ---------- */
let bankQ = "", bankTab = "all";
function bankRows(){
  const rows=[];
  CONTENT.forEach(d=>{
    (d.vocab||[]).forEach(v=> rows.push({type:"w", day:d.day, zh:v.w, py:v.p, ko:v.m, ex:"", exKo:"", lv:v.lv||""}));
    (d.keys||[]).forEach(k=> rows.push({type:"k", day:d.day, zh:k.zh, py:k.py, ko:k.ko, ex:k.ex||"", exKo:k.exKo||"", lv:""}));
  });
  return rows;
}
function renderBank(){
  const all = bankRows();
  const q = bankQ.trim().toLowerCase();
  const rows = all.filter(r=>{
    if(bankTab==="w" && r.type!=="w") return false;
    if(bankTab==="k" && r.type!=="k") return false;
    if(bankTab==="star" && !S.star[r.zh]) return false;
    return !q || (r.zh+r.py+r.ko+r.ex).toLowerCase().includes(q);
  });
  let h = '<div class="hd" style="margin-top:20px"><small>Word bank</small>단어장 <span class="sub" style="font-size:13px">('+all.length+'개)</span></div>';
  h += '<div class="card"><div class="row" style="margin-bottom:10px">'+
       '<input type="text" id="bq" placeholder="한자·병음·뜻으로 검색" value="'+esc(bankQ)+'" style="flex:1;min-width:160px">'+
       '<button class="btn ghost sm bt '+(bankTab==="all"?"blue":"")+'" data-t="all">전체</button>'+
       '<button class="btn ghost sm bt '+(bankTab==="w"?"blue":"")+'" data-t="w">단어</button>'+
       '<button class="btn ghost sm bt '+(bankTab==="k"?"blue":"")+'" data-t="k">표현</button>'+
       '<button class="btn ghost sm bt '+(bankTab==="star"?"blue":"")+'" data-t="star">★ 표시</button>'+
       '<button class="btn sm" id="bDrill">랜덤 10개 훈련</button></div><div id="bankList">';
  if(!rows.length) h += '<div class="sub">해당하는 항목이 없습니다.</div>';
  rows.forEach(r=>{
    const on = S.star[r.zh] ? "on":"";
    h += '<div class="bankrow"><span class="star '+on+'" data-k="'+esc(r.zh)+'">★</span>'+
         '<b>'+esc(r.zh)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.zh)+'">▶</button> '+
         '<span class="sub" style="font-size:11px">DAY '+r.day+(r.lv?' · '+esc(r.lv):'')+'</span>'+
         pyBox(r.py)+'<div class="m">'+esc(r.ko)+'</div>'+
         (r.ex?'<div class="ex">'+esc(r.ex)+'</div><div class="m" style="font-size:12px">'+esc(r.exKo)+'</div>':'')+'</div>';
  });
  h += '</div></div>';
  $("#view-bank").innerHTML = h;
  bindPlay(); bindPyClick();
  $("#bq").oninput = e=>{ bankQ=e.target.value; const p=e.target.selectionStart; renderBank();
    const el=$("#bq"); el.focus(); el.setSelectionRange(p,p); };
  document.querySelectorAll(".bt").forEach(b=> b.onclick = ()=>{ bankTab=b.dataset.t; renderBank(); });
  $("#bDrill").onclick = ()=> drill(rows);
  document.querySelectorAll(".star").forEach(s=> s.onclick = ()=>{
    const k=s.dataset.k; if(S.star[k]) delete S.star[k]; else S.star[k]=1; save(); s.classList.toggle("on"); });
}
function drill(rows){
  if(!rows.length){ toast("훈련할 항목이 없습니다"); return; }
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 한국어를 보고 먼저 말하기</div><div class="card">'+
    '<div class="sub" style="margin-bottom:8px">뜻만 보고 중국어를 소리 내어 말한 뒤, 가려진 한자를 눌러 확인하세요.</div><div class="rule"></div>';
  pick.forEach(r=>{
    h += '<div class="keyrow"><div class="k"><b class="blurme">'+esc(r.zh)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.zh)+'">▶</button>'+
         '<span class="py blurme">'+pyHTML(r.py)+'</span></div>'+
         '<div class="m">'+esc(r.ko)+'</div></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 단어장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

const GEN_PROMPT =
`아래 형식에 맞춰 중국어 일상회화 쉐도잉 1회차를 JSON 배열로 만들어 줘.

[학습자]
- 한국인 직장인. 중국어 말하기는 중상급(HSK 5~6 수준). 기본 회화는 되지만 **어른스러운 구어와 관용 표현**이 부족함.
- 목표는 시사·비즈니스 용어가 아니라 **성인의 일상 회화**. 사교·부탁·거절·하소연·협상처럼
  실제 관계 속에서 오가는 말을 늘리는 것.

[조건]
- 두 사람(A/B)이 한 장면에서 나누는 자연스러운 대화 20줄(A/B 번갈아).
- 한 줄은 한자 15~28자. 짧은 초급 문장을 쓰지 말 것.
- 어휘 난이도는 HSK 5~6 중심. 회차마다 성어·관용어를 2~4개, 구어체 표현(别提了/可不是嘛/要我说 등)을 넉넉히 섞을 것.
- 반드시 넣을 문법: 가능보어(V得住/V不了/推不掉), 把자문, 连…都…, A是A可是…, A归A,
  越…越…, 能…则…, 非得…才…, 总不能…吧, 说是这么说 같은 **구어 골격**.
- 소재: (여기에 장면을 적으세요 — 예: 이사 집 보기, 아이 담임과 상담, 중고차 흥정, 회사 동료의 부탁 거절,
  이웃과의 소음 문제, 오랜만에 만난 친구, 명절 친척 모임)
- notes에는 단어 뜻만 쓰지 말고, **비슷한 말과의 차이·언제 쓰면 실례가 되는지·확장형**을 적을 것.
- 병음(py)은 성조 부호를 정확히 넣고, 一/不 성조 변화도 반영할 것(예: yí ge, yìdiǎnr, búcuò).
  儿化는 붙여 쓸 것(diǎnr, xìnr). 병음 음절 수는 한자 수와 일치해야 한다(儿화 제외).
- ck는 끊어 읽기 덩어리다. 한 줄을 2~4덩어리로 나누고, 각 덩어리의 [한자, 병음] 쌍으로 적을 것.
  덩어리를 모두 이으면 원문과 정확히 같아야 한다.
- notes의 k 값은 word / expr / grammar / measure / pron / culture / idiom 중 하나.
- 지어낸 통계·인용은 쓰지 말 것. 일상 장면의 사실적인 대화만.
- 출력은 JSON 배열 하나만. 설명 문장 없이.

[형식]
[{
 "id":"c2d1","day":8,"cat":"장면분류","level":"HSK 5~6",
 "title":"中文标题","titlePy":"zhōngwén biāotí","titleKo":"한국어 제목 — 부제",
 "names":{"A":"이름 (역할)","B":"이름 (역할)"},
 "brief":["한국어 배경설명 1","2","3","4"],
 "vocab":[{"w":"单词","p":"dāncí","m":"뜻","lv":"HSK5"}],
 "lines":[
   {"s":"A","zh":"중국어 문장","py":"pīnyīn","ko":"한국어 번역",
    "ck":[["앞 덩어리","pīnyīn"],["뒤 덩어리","pīnyīn"]],
    "notes":[{"t":"표현","p":"pīnyīn","k":"grammar","m":"뜻","tip":"쓰임·주의점"}]}
 ],
 "keys":[{"zh":"표현","py":"pīnyīn","ko":"뜻","ex":"예문","exPy":"pīnyīn","exKo":"예문 뜻"}],
 "out":[{"q":"한국어 질문","hint":"써야 할 중국어 표현"}]
}]`;
function renderAdd(){
  let h = '<div class="hd" style="margin-top:20px"><small>Add content</small>새 회화 추가</div>';
  h += '<div class="card"><b>1단계 — 프롬프트 복사</b><div class="sub" style="margin:4px 0 8px">아래 내용을 복사해서 Claude에게 붙여넣고, 원하는 장면을 적으세요.</div>'+
       '<pre class="prompt" id="pmt">'+esc(GEN_PROMPT)+'</pre>'+
       '<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="copyP">프롬프트 복사</button></div></div>';
  h += '<div class="card"><b>2단계 — 받은 JSON 붙여넣기</b><div class="sub" style="margin:4px 0 8px">Claude가 준 JSON을 그대로 붙여넣고 추가를 누르면 커리큘럼 맨 뒤에 붙습니다.</div>'+

       '<span class="sub" id="addMsg"></span></div></div>';

    h += '<div class="card"><b>내가 추가한 회차 ('+S.custom.length+')</b><div class="rule"></div>';
    S.custom.forEach((c,i)=>{ h += '<div class="histrow"><b>'+c.day+'</b><span style="flex:1" class="hz">'+esc(c.title||"(제목 없음)")+'</span>'+
      '<button class="btn ghost sm delc" data-i="'+i+'">삭제</button></div>'; });
    h += '</div>';
  }
  $("#view-add").innerHTML = h;
  $("#copyP").onclick = ()=>{ navigator.clipboard.writeText(GEN_PROMPT).then(()=>toast("복사했습니다"),()=>{

    toast("직접 복사하세요 (Ctrl+C)"); }); };
  $("#addJ").onclick = ()=>{
    const raw = $("#jin").value.trim(); if(!raw) return;
    try{
      let o = JSON.parse(raw); if(!Array.isArray(o)) o=[o];
      const bad = o.find(x=> !x.id || !Array.isArray(x.lines) || !x.lines.length);
      if(bad) throw new Error("형식");
      o.forEach(x=>{
        x.cat=x.cat||"기타"; x.brief=x.brief||[]; x.keys=x.keys||[]; x.out=x.out||[]; x.vocab=x.vocab||[];
        x.names=x.names||{A:"A",B:"B"}; x.titleKo=x.titleKo||""; x.titlePy=x.titlePy||"";
        x.day = x.day || (CONTENT.length+1);
        if(CONTENT.some(c=>c.id===x.id)) x.id = x.id+"-"+Math.random().toString(36).slice(2,6);

    }catch(err){ $("#addMsg").textContent = "JSON 형식이 맞지 않습니다. 대괄호 [ ] 로 시작하는지 확인하세요."; }
  };
  document.querySelectorAll(".delc").forEach(b=> b.onclick = ()=>{
    S.custom.splice(+b.dataset.i,1); save(); rebuild(); renderAdd(); });
}

/* ---------- 설정 ---------- */
function applyLook(){
  const r = document.documentElement;
  let t = S.cfg.theme;
  if(t!=="dark" && t!=="light")
    t = (function(){ var h = r.getAttribute("data-theme"); if(h==="dark"||h==="light") return h;
      return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; })();
  r.setAttribute("data-theme", t);
  r.setAttribute("data-py", S.cfg.py||"on");
  r.setAttribute("data-tone", S.cfg.tone||"on");
  r.setAttribute("data-han", S.cfg.han||"kai");
}

/* ---------- 시작 ---------- */
/* 설정 화면을 없앴으므로, 예전에 저장해 둔 화면 설정에 갇히지 않도록 되돌린다.
   화면 밝기는 휴대폰 설정을 따라가고, 병음·성조 색·서체는 기본값으로 연다. */
if(S.cfg.theme!=="auto" || S.cfg.py!=="on" || S.cfg.tone!=="on" || S.cfg.han!=="kai"){
  S.cfg.theme="auto"; S.cfg.py="on"; S.cfg.tone="on"; S.cfg.han="kai"; save();
}

/* ═══════════ 앱으로 설치하기 ═══════════
   링크를 카카오톡·팀즈로 보내면 대개 그 앱 안의 브라우저로 열린다.
   거기서는 설치도 소리도 되지 않으므로, 그 경우를 가장 먼저 잡아 크롬·사파리로 넘긴다. */
(function(){
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    /* 열 때는 새 본문을 먼저 받으므로 대개 여기까지 오지 않는다.
       느린 곳에서 저장본으로 먼저 열렸을 때만 뒤늦게 도착한다. */
    navigator.serviceWorker.addEventListener("message", e=>{
      if(!e.data || e.data.type!=="update-ready") return;
      pendingUpdate = true;
      if(cur.view==="session" || cur.view==="add") toast("새 회차가 도착했습니다. 이 훈련을 마치면 반영됩니다.");
      applyUpdate();
    });
    /* 설치한 앱은 한 번 열어 두면 다시 불러와도 화면을 새로 받지 않는다.
       그래서 앱을 앞으로 불러올 때마다 새것이 있는지 확인한다. */
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState !== "visible") return;
      applyUpdate();
      if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type:"check-update"});
    });
  }

  const UA = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(UA);
  const isMobile = isIOS || isAndroid;
  /* 앱 안 브라우저 — 카카오톡·팀즈·네이버·라인·밴드·페북·인스타 */
  const inApp = /KAKAOTALK|Teams|MSTeams|NAVER|Line\/|band|DaumApps|Instagram|FB_IAB|FBAN|FBAV|everytime/i.test(UA);
  /* 아이폰은 사파리로, 안드로이드는 크롬으로 넘긴다.
     그 기기에 처음부터 깔려 있는 브라우저라야 아무도 무엇을 설치하지 않는다. */
  const TARGET = isIOS ? "사파리" : "크롬";
  const TO = isIOS ? "사파리로" : "크롬으로";

  function openOutside(){
    const url = location.href;
    /* 카카오톡은 바깥 브라우저로 넘기는 자기 방식이 있다.
       기기의 기본 브라우저가 열리므로 아이폰이면 사파리, 안드로이드면 크롬이다. */
    if(/KAKAOTALK/i.test(UA)){
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      return;
    }
    if(isIOS){
      /* 사파리로 넘기는 전용 방식. 막히면 주소만 복사해 준다. */
      location.href = url.replace(/^https:/, "x-safari-https:").replace(/^http:/, "x-safari-http:");
      setTimeout(()=>{ if(!document.hidden) copyLink(); }, 1200);
      return;
    }
    if(isAndroid){
      location.href = "intent://" + url.replace(/^https?:\/\//, "") +
        "#Intent;scheme=" + location.protocol.replace(":", "") +
        ";package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      return;
    }
    window.open(url, "_blank");
  }

  /* 마지막 수단 — 주소를 복사해 주고 붙여 넣으라고 알린다. */
  function copyLink(){
    const url = location.href;
    const done = ()=> toast("주소를 복사했습니다. " + TARGET + "에 붙여 넣어 주세요.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, done);
    }else{
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }

  if(inApp && isMobile){
    const box = $("#openChrome");
    box.hidden = false;
    $("#ocApp").textContent = /KAKAOTALK/i.test(UA) ? "지금은 카카오톡 안에서 열려 있습니다."
                                                    : "지금은 다른 앱 안에서 열려 있습니다.";
    $("#ocMsg").textContent = "여기서는 중국어 발음이 나오지 않고 설치도 되지 않습니다. " +
                              TO + " 열면 소리가 납니다.";
    $("#ocGo").textContent = TO + " 열기";
    $("#ocGo").onclick = openOutside;
    $("#ocCopy").onclick = copyLink;
    $("#ocClose").onclick = ()=>{ box.hidden = true; };
  }

  const btn = $("#installBtn"), note = $("#installNote");
  const title = $("#installTitle"), steps = $("#installSteps"), nowBtn = $("#installNow");

  /* 이미 홈 화면 아이콘으로 열렸으면 설치를 권할 이유가 없다 */
  if(window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return;

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred = e;
    if(!note.hidden) open();     /* 안내가 떠 있는 중에 신호가 오면 버튼과 문구를 함께 고친다 */
  });
  window.addEventListener("appinstalled", ()=>{ btn.hidden = true; hide(); });

  /* 브라우저가 설치 안내를 스스로 띄우지 않는 경우가 많아, 버튼은 늘 보이게 둔다 */
  btn.hidden = false;

  function hide(){ note.hidden = true; }

  function build(){
    if(inApp){
      title.textContent = "📲 먼저 브라우저로 열어 주세요";
      return "<p><b>지금 카카오톡·팀즈 같은 앱 안에서 열려 있습니다.</b> 여기서는 설치가 되지 않습니다.</p>" +
             "<ol>" +
               "<li>화면 <b>오른쪽 위 메뉴</b>(⋯ 또는 ⋮)를 누릅니다</li>" +
               "<li><b>「다른 브라우저로 열기」</b>를 고릅니다" +
                 (isIOS ? " — 아이폰은 <b>Safari</b>" : isAndroid ? " — 안드로이드는 <b>Chrome</b>" : "") + "</li>" +
               "<li>열린 화면에서 이 안내가 다시 나오면 그대로 따라 하시면 됩니다</li>" +
             "</ol>";
    }
    if(isIOS){
      title.textContent = "📲 홈 화면에 추가하기";
      return "<p><b>아이폰 · 아이패드 (Safari)</b></p>" +
             "<ol>" +
               "<li>화면 <b>아래쪽 공유 버튼</b>(□ 위에 화살표)을 누릅니다</li>" +
               "<li>목록을 내려 <b>「홈 화면에 추가」</b>를 고릅니다</li>" +
               "<li>오른쪽 위 <b>「추가」</b>를 누르면 끝입니다</li>" +
             "</ol>";
    }
    if(isAndroid){
      title.textContent = "📲 앱으로 설치하기";
      /* 크롬이 설치 신호를 준 경우에만 버튼을 안내한다. 없는 버튼을 누르라고 하면 그대로 막힌다. */
      return "<p><b>안드로이드 (Chrome)</b></p>" +
             "<ol>" +
               (deferred
                 ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>"
                 : "<li>화면 <b>오른쪽 위 메뉴(⋮)</b>를 누릅니다</li>" +
                   "<li><b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 고릅니다</li>") +
             "</ol>";
    }
    title.textContent = "📲 앱으로 설치하기";
    return "<p><b>컴퓨터 (Chrome · Edge)</b></p>" +
           "<ol>" +
             (deferred ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>" : "") +
             "<li>주소창 오른쪽 끝의 <b>설치 아이콘</b>을 누릅니다</li>" +
             "<li>없으면 메뉴 → <b>「앱 설치」</b></li>" +
           "</ol>";
  }

  function open(){
    steps.innerHTML = build() +
      "<p>설치하면 아이콘을 눌러 주소창 없이 앱처럼 열리고, 인터넷이 끊겨도 계속 쓸 수 있습니다. 지금까지의 기록은 그대로 남습니다.</p>";
    nowBtn.hidden = !deferred;
    note.hidden = false;
  }

  /* 처음 연 사람에게는 한 번 저절로 띄운다. 닫으면 다시 띄우지 않는다. */
  const SEEN = "chaguan-install-seen";
  let seen = false;
  try{ seen = localStorage.getItem(SEEN) === "1"; }catch(e){}
  if(!seen && isMobile && $("#openChrome").hidden)
    setTimeout(()=>{ if(note.hidden) open(); }, 1200);

  btn.onclick = open;

  nowBtn.onclick = async ()=>{
    if(!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    nowBtn.hidden = true;
    if(outcome === "accepted"){ btn.hidden = true; hide(); }
  };

  $("#installNoteClose").onclick = ()=>{
    hide();
    try{ localStorage.setItem(SEEN, "1"); }catch(e){}
  };
})();
</script>

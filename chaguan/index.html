<title>茶馆 CHÁGUǍN</title>
<style>
:root{
  --paper:#f7f5ef; --card:#fffdf9; --line:#e0d9c9; --ink:#1d1c19; --sub:#6f6a5f;
  --accent:#2f5d8c; --accent-soft:#dde7f0; --red:#b0462f; --red-soft:#f2e0da;
  --ok:#2f6b4f; --radius:14px;
  --t1:#c0392b; --t2:#b9770e; --t3:#2e7d5b; --t4:#3a5fa8; --t0:#8c857a;
  --han:"KaiTi","楷体","STKaiti","Kaiti SC","Microsoft YaHei","맑은 고딕",serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",Roboto,sans-serif;
  --pyf:"Segoe UI","Lucida Sans Unicode",Tahoma,sans-serif;
}
html[data-han="hei"]{ --han:"Microsoft YaHei","微软雅黑","PingFang SC","Malgun Gothic",sans-serif; }
html[data-theme="dark"]{
  --paper:#16181a; --card:#1d2023; --line:#2f343a; --ink:#e9e6de; --sub:#9a948a;
  --accent:#8fbde0; --accent-soft:#1f2d38; --red:#e0836b; --red-soft:#37231e;
  --ok:#6fbf94;
  --t1:#ef7d70; --t2:#e0ac54; --t3:#63c79b; --t4:#89aaf0; --t0:#9a948a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}

.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--han);font-size:22px;letter-spacing:.10em;font-weight:600}
.brand em{font-family:var(--pyf);font-style:normal;font-size:13px;letter-spacing:.18em;color:var(--accent);margin-left:7px}
.brand i{display:block;font-family:var(--sans);font-style:normal;font-size:11px;
  letter-spacing:.02em;color:var(--sub);margin-top:1px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;padding:6px 11px;border-radius:999px;
  cursor:pointer;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.hd{font-family:var(--han);font-size:23px;margin:26px 0 2px;line-height:1.3}
.hd small{display:block;font-family:var(--serif);font-size:11.5px;color:var(--sub);
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--sub);font-size:13.5px}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.87}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--accent);color:#fff}
html[data-theme="dark"] .btn.blue{color:#12171c}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.r{background:var(--red-soft);color:var(--red)}
.muted{color:var(--sub)}

/* ---- 한자 / 병음 ---- */
.hz{font-family:var(--han)}
.py{font-family:var(--pyf);letter-spacing:.01em}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t0{color:var(--t0)}
html[data-tone="off"] .t1,html[data-tone="off"] .t2,html[data-tone="off"] .t3,
html[data-tone="off"] .t4,html[data-tone="off"] .t0{color:inherit}
html[data-py="blur"] .py{filter:blur(4px);cursor:pointer}
html[data-py="blur"] .py.show{filter:none}
html[data-py="off"] .py{display:none}

.today{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.today h2{font-family:var(--han);font-size:30px;margin:8px 0 2px;line-height:1.25;letter-spacing:.03em}
.today .tpy{font-family:var(--pyf);font-size:13.5px;color:var(--sub)}
.today .kotitle{color:var(--sub);font-size:14px;margin:6px 0 14px}
.streak{display:flex;gap:18px;margin:14px 0 0;flex-wrap:wrap}
.streak div{text-align:center}
.streak b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.streak span{font-size:11.5px;color:var(--sub)}
.dlist{display:grid;gap:8px;margin-top:10px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.ditem:hover{border-color:var(--accent)}
.ditem .num{font-family:var(--serif);font-size:16px;width:26px;color:var(--sub);flex:none}
.ditem .t{flex:1;min-width:0}
.ditem .t b{display:block;font-size:17px;font-weight:600;font-family:var(--han);letter-spacing:.02em}
.ditem .t span{font-size:12px;color:var(--sub)}
.ditem .done{color:var(--ok);font-size:12px;font-weight:700;flex:none}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.past{background:var(--ok)}
.sesshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.clock{font-family:var(--serif);font-size:19px;margin-left:auto;letter-spacing:.04em}
.clock.over{color:var(--red)}
.stepname{font-size:13px;font-weight:700}
.stepname em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}

.brief li{margin:7px 0}
.brief b{color:var(--accent)}
.vrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.vrow:last-child{border:none}
.vrow .w{flex:none;min-width:150px}
.vrow .w b{font-family:var(--han);font-size:21px;letter-spacing:.02em}
.vrow .w .py{display:block;font-size:12px}
.vrow .m{font-size:13.5px;flex:1;min-width:120px}
.vrow .lv{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 7px;flex:none}
.keyrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.keyrow:last-child{border:none}
.keyrow .k{flex:none;min-width:170px}
.keyrow .k b{font-family:var(--han);font-size:20px}
.keyrow .k .py{display:block;font-size:12px}
.keyrow .m{font-size:13.5px;color:var(--sub);flex:1;min-width:140px}
.keyrow .ex{display:block;font-family:var(--han);font-size:16px;color:var(--ink);margin-top:3px}
.keyrow .exko{display:block;font-size:12px;color:var(--sub)}

.sline{display:flex;gap:10px;padding:8px 10px;border-radius:9px;margin:2px 0;cursor:pointer}
.sline.now{background:var(--accent-soft)}
.sline .sp{font-family:var(--serif);font-weight:700;flex:none;width:20px;color:var(--accent)}
.sline.b .sp{color:var(--red)}
.sline .zh{font-family:var(--han);font-size:20px;line-height:1.5;letter-spacing:.02em}
.sline .py{display:block;font-size:12px;margin-top:1px}
.sline .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}

.shadowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:12px 0}
.who{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.who.b{color:var(--red)}
.bigzh{font-family:var(--han);font-size:clamp(26px,6.4vw,40px);line-height:1.45;margin:10px 0 2px;letter-spacing:.03em}
.bigpy{font-family:var(--pyf);font-size:clamp(14px,3vw,17px);margin-bottom:6px}
.chunks{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px}
.chunk{padding:7px 12px;border-left:3px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.chunk:hover{background:var(--paper)}
.chunk.on{border-left-color:var(--accent);background:var(--accent-soft)}
.chunk .zh{font-family:var(--han);font-size:clamp(20px,4.4vw,25px);letter-spacing:.03em}
.chunk .py{display:block;font-size:12.5px}
.bigko{font-size:14px;color:var(--sub);margin-top:8px}
.blurme{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.blurme.show{filter:none;cursor:auto}
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.note{margin:9px 0;font-size:13.5px}
.note b{font-family:var(--han);font-size:18px}
.note .np{font-family:var(--pyf);font-size:12px;color:var(--sub);margin-left:5px}
.note .k{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);margin-left:6px;font-weight:700;vertical-align:2px}
.note .tip{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.counter{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.speedbar{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.speedbar button{border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer}
.speedbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.asr{margin-top:10px;font-size:14px}
.asr .w{padding:1px 3px;border-radius:3px;font-family:var(--han);font-size:20px}
.asr .w.bad{background:var(--red-soft);color:var(--red)}
.asr .w.good{color:var(--ok)}
.score{font-family:var(--serif);font-size:17px}

.qbox{margin:16px 0}
.qbox .q{font-size:15px;margin-bottom:2px;font-weight:600}
.qbox .hint{font-size:12.5px;color:var(--sub)}
.qbox .hint b{font-family:var(--han);font-size:16px;color:var(--ink);font-weight:400}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;max-width:100%}

.rp{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin:6px 0;align-items:flex-start}
.rp.mine{background:var(--accent-soft);border:1px dashed var(--accent)}
.rp.now{outline:2px solid var(--accent)}
.rp .sp{font-weight:700;flex:none;width:22px;color:var(--sub)}
.rp .zh{font-family:var(--han);font-size:19px}
.rp .py{display:block;font-size:11.5px}
.rp .ko{display:block;font-size:12px;color:var(--sub)}

.copy{display:flex;gap:14px;align-items:flex-start;border-color:var(--red)}
.copy .seal{flex:none;width:54px;height:54px;border:2px solid var(--red);color:var(--red);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-family:var(--han);font-size:21px;letter-spacing:.02em}
.copy .ct b{font-family:var(--pyf);letter-spacing:.06em;font-size:15px}
.copy .ct .r{color:var(--red);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:10.5px;color:var(--sub)}
.cal div.done{background:var(--accent);color:#fff;font-weight:700}
.histrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.histrow b{font-family:var(--serif);font-size:15px}
.bankrow{padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow b{font-family:var(--han);font-size:21px}
.bankrow .m{font-size:13px;color:var(--sub)}
.bankrow .ex{font-family:var(--han);font-size:16px;color:var(--sub)}
.star{cursor:pointer;float:right;font-size:15px;opacity:.28}
.star.on{opacity:1}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px;z-index:30;display:none}
.footbar.on{display:block}
.footin{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.credit{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:11.5px;color:var(--sub);
  letter-spacing:.02em;text-align:center;opacity:.8}
.credit b{font-family:var(--serif);font-weight:600;letter-spacing:.06em}
@media(max-width:560px){
  .vrow,.keyrow{flex-direction:column;gap:2px}
  .vrow .w,.keyrow .k{min-width:0}
  .brand i{display:none}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181a; --card:#1d2023; --line:#2f343a; --ink:#e9e6de; --sub:#9a948a;
    --accent:#8fbde0; --accent-soft:#1f2d38; --red:#e0836b; --red-soft:#37231e;
    --ok:#6fbf94;
    --t1:#ef7d70; --t2:#e0ac54; --t3:#63c79b; --t4:#89aaf0; --t0:#9a948a;
  }
  :root:not([data-theme="light"]) .btn.blue{color:#12171c}
}
@media (prefers-reduced-motion: reduce){
  .view{animation:none}
  .blurme,.btn{transition:none}
}
</style>
<div class="topbar"><div class="topin">
  <div class="brand">茶馆<em>CHÁGUǍN</em><i>데일리 중국어 쉐도잉 · 하루 20분</i></div>
  <nav class="tabs" id="tabs">
    <button data-view="home" class="on">홈</button>
    <button data-view="log">기록</button>
    <button data-view="bank">단어장</button>
    <button data-view="add">자료 추가</button>

  </nav>
</div></div>

<div class="wrap">
  <section id="view-home" class="view on"></section>
  <section id="view-session" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-bank" class="view"></section>
  <section id="view-add" class="view"></section>

</div>

{
 id:"c1d1", day:1, cat:"회식·술자리", level:"HSK 5~6",

 names:{A:"志勋 (한국 측)", B:"老周 (중국 측 거래처)"},
 brief:[
  "중국에서 <b>饭局(fànjú)</b>은 단순한 식사가 아니라 관계를 만드는 자리입니다. 계산을 서로 하겠다고 다투는 것은 실랑이가 아니라 <b>예의의 절차</b>입니다. 한 번에 물러서면 오히려 성의가 없어 보입니다.",
  "핵심은 <b>见外(jiànwài, 남처럼 굴다)</b>와 <b>做东(zuòdōng, 내가 자리를 내다)</b> 두 단어입니다. 「您太见外了」로 상대의 호의를 받아치고, 「改天我做东」으로 다음을 기약하면 대화가 완성됩니다.",
  "술은 거절하는 것이 아니라 <b>조절</b>하는 것입니다. 「我酒量一般，悠着点儿(살살 하겠습니다)」처럼 말하면 분위기를 깨지 않으면서 빠져나올 수 있습니다.",

  {w:"见外",p:"jiànwài",m:"남처럼 굴다, 서먹하게 대하다",lv:"HSK6"},

  {w:"一言为定",p:"yì yán wéi dìng",m:"약속한 겁니다 (성어)",lv:"성어"},
  {w:"酒量",p:"jiǔliàng",m:"주량",lv:"HSK5"},
  {w:"悠着点儿",p:"yōu zhe diǎnr",m:"살살 하다, 무리하지 않다",lv:"구어"},
  {w:"讲究",p:"jiǎngjiu",m:"따지다, 중시하다",lv:"HSK5"},
  {w:"下馆子",p:"xià guǎnzi",m:"외식하다",lv:"구어"},
  {w:"自在",p:"zìzai",m:"편안하다, 홀가분하다",lv:"HSK5"},
  {w:"心疼",p:"xīnténg",m:"아깝다, 안쓰럽다",lv:"HSK5"}
 ],
 lines:[
  {s:"B",zh:"来来来，别客气，今天这顿说什么也得我来。",py:"Lái lái lái, bié kèqi, jīntiān zhè dùn shuō shénme yě děi wǒ lái.",

   ck:[["来来来，别客气","lái lái lái, bié kèqi"],["今天这顿","jīntiān zhè dùn"],["说什么也得我来","shuō shénme yě děi wǒ lái"]],
   notes:[{t:"说什么也得…",p:"shuō shénme yě děi…",k:"expr",m:"무슨 일이 있어도 ~해야 한다",tip:"무조건이라는 뜻의 구어 골격입니다. 说什么也不能答应 = 절대 승낙할 수 없다."},
          {t:"顿",p:"dùn",k:"measure",m:"끼니를 세는 양사",tip:"一顿饭 / 三顿 / 请你吃顿饭. 식사에는 次가 아니라 顿을 씁니다."}]},
  {s:"A",zh:"老周，您太见外了，上回就是您结的账。",py:"Lǎo Zhōu, nín tài jiànwài le, shàng huí jiùshì nín jié de zhàng.",
   ko:"저우 선생님, 너무 남처럼 대하시네요, 지난번에도 선생님이 계산하셨잖아요.",
   ck:[["老周，您太见外了","Lǎo Zhōu, nín tài jiànwài le"],["上回就是您结的账","shàng huí jiùshì nín jié de zhàng"]],
   notes:[{t:"见外",p:"jiànwài",k:"expr",m:"남처럼 굴다",tip:"상대의 지나친 배려를 부드럽게 막는 말입니다. 你太见外了 한마디면 [우리 사이에 뭘] 이라는 뜻이 됩니다."},
          {t:"是…的",p:"shì…de",k:"grammar",m:"이미 일어난 일의 주체·시간·방법을 강조",tip:"就是您结的账 = 계산한 사람은 다름 아닌 당신이었다. 结账을 떼어 结的账으로 쓰는 점에 주의하세요."}]},
  {s:"B",zh:"那不一样，上回是公事，今天纯粹是朋友聚聚。",py:"Nà bù yíyàng, shàng huí shì gōngshì, jīntiān chúncuì shì péngyou jùju.",
   ko:"그건 다르죠, 지난번은 업무였고 오늘은 순전히 친구끼리 모이는 겁니다.",
   ck:[["那不一样","nà bù yíyàng"],["上回是公事","shàng huí shì gōngshì"],["今天纯粹是朋友聚聚","jīntiān chúncuì shì péngyou jùju"]],
   notes:[{t:"纯粹",p:"chúncuì",k:"word",m:"순전히, 오로지",tip:"부사로 쓰면 只是보다 단호합니다. 纯粹是浪费时间 = 순전히 시간 낭비다."},
          {t:"聚聚",p:"jùju",k:"grammar",m:"모이다 (동사 중첩)",tip:"聚会를 가볍게 만든 형태. 找机会聚聚 = 기회 봐서 한번 모이자."}]},
  {s:"A",zh:"那我也不跟您争了，改天我在首尔做东。",py:"Nà wǒ yě bù gēn nín zhēng le, gǎitiān wǒ zài Shǒu'ěr zuòdōng.",
   ko:"그럼 더 다투지 않겠습니다, 다음에 서울에서 제가 대접하죠.",
   ck:[["那我也不跟您争了","nà wǒ yě bù gēn nín zhēng le"],["改天我在首尔做东","gǎitiān wǒ zài Shǒu'ěr zuòdōng"]],
   notes:[{t:"做东",p:"zuòdōng",k:"culture",m:"주인 노릇을 하다, 한턱내다",tip:"请客보다 격이 있습니다. 계산 다툼을 마무리하는 정답에 가까운 문장입니다."},
          {t:"跟…争",p:"gēn…zhēng",k:"grammar",m:"~와 다투다",tip:"跟你争什么 = 뭘 다투겠어요. 물러설 때 쓰는 표현입니다."}]},
  {s:"B",zh:"一言为定。来，先走一个，祝合作顺利。",py:"Yì yán wéi dìng. Lái, xiān zǒu yí ge, zhù hézuò shùnlì.",
   ko:"약속한 겁니다. 자, 먼저 한 잔 하시죠, 협력이 순조롭기를.",
   ck:[["一言为定","yì yán wéi dìng"],["来，先走一个","lái, xiān zǒu yí ge"],["祝合作顺利","zhù hézuò shùnlì"]],
   notes:[{t:"一言为定",p:"yì yán wéi dìng",k:"idiom",m:"한 말은 그대로다, 약속한 겁니다",tip:"약속을 못 박는 성어. 회의·상담 마무리에도 그대로 씁니다."},
          {t:"走一个",p:"zǒu yí ge",k:"culture",m:"한 잔 하다",tip:"술자리 전용 구어입니다. 咱们走一个 = 우리 한 잔 합시다."}]},
  {s:"A",zh:"干杯。不过我酒量实在一般，一会儿得悠着点儿。",py:"Gānbēi. Búguò wǒ jiǔliàng shízài yìbān, yíhuìr děi yōu zhe diǎnr.",
   ko:"건배. 그런데 제가 주량이 정말 별로라, 이따 좀 살살 해야 합니다.",
   ck:[["干杯","gānbēi"],["不过我酒量实在一般","búguò wǒ jiǔliàng shízài yìbān"],["一会儿得悠着点儿","yíhuìr děi yōu zhe diǎnr"]],
   notes:[{t:"悠着点儿",p:"yōu zhe diǎnr",k:"expr",m:"살살 하다, 정도껏 하다",tip:"술·일·운동 모두에 씁니다. 悠着点儿，别累着 = 무리하지 마세요. 거절하지 않으면서 빠져나오는 최고의 표현입니다."},
          {t:"实在",p:"shízài",k:"word",m:"정말이지, 참으로",tip:"真的보다 무게가 있습니다. 实在不好意思 / 实在没办法."}]},
  {s:"B",zh:"理解，能喝多少喝多少，咱们重在气氛。",py:"Lǐjiě, néng hē duōshao hē duōshao, zánmen zhòng zài qìfēn.",
   ko:"이해합니다, 마실 수 있는 만큼만 하시고, 우리는 분위기가 중요하니까요.",
   ck:[["理解","lǐjiě"],["能喝多少喝多少","néng hē duōshao hē duōshao"],["咱们重在气氛","zánmen zhòng zài qìfēn"]],
   notes:[{t:"能…多少…多少",p:"néng…duōshao…duōshao",k:"grammar",m:"~할 수 있는 만큼 ~하다",tip:"같은 의문사를 두 번 써서 [되는 만큼]을 만듭니다. 能做多少做多少 = 할 수 있는 만큼만 하세요."},
          {t:"咱们",p:"zánmen",k:"word",m:"우리 (듣는 사람 포함)",tip:"我们은 상대를 뺄 수도 있지만 咱们은 반드시 포함합니다. 북방에서 특히 친근하게 들립니다."}]},
  {s:"A",zh:"这道菜叫什么？我在韩国还真没见过。",py:"Zhè dào cài jiào shénme? Wǒ zài Hánguó hái zhēn méi jiàn guo.",
   ko:"이 요리는 뭐라고 하나요? 한국에선 정말 못 봤어요.",
   ck:[["这道菜叫什么","zhè dào cài jiào shénme"],["我在韩国还真没见过","wǒ zài Hánguó hái zhēn méi jiàn guo"]],
   notes:[{t:"道",p:"dào",k:"measure",m:"요리를 세는 양사",tip:"一道菜 / 四道凉菜. 个를 쓰면 바로 초급으로 들립니다."},
          {t:"还真",p:"hái zhēn",k:"expr",m:"정말이지, 의외로",tip:"예상과 달랐음을 나타냅니다. 这个还真好吃 = 이거 의외로 맛있네요."}]},
  {s:"B",zh:"这叫毛血旺，看着吓人，其实一点儿也不腻。",py:"Zhè jiào máoxuèwàng, kàn zhe xiàrén, qíshí yìdiǎnr yě bú nì.",
   ko:"이건 마오쉐왕이라고 해요, 보기엔 무섭지만 사실 전혀 느끼하지 않습니다.",
   ck:[["这叫毛血旺","zhè jiào máoxuèwàng"],["看着吓人","kàn zhe xiàrén"],["其实一点儿也不腻","qíshí yìdiǎnr yě bú nì"]],
   notes:[{t:"看着…其实…",p:"kàn zhe…qíshí…",k:"grammar",m:"보기엔 ~하지만 사실은 ~",tip:"겉과 속을 대비하는 골격. 看着简单，其实很难 = 쉬워 보여도 사실 어렵다."},
          {t:"腻",p:"nì",k:"word",m:"느끼하다 / 물리다",tip:"음식뿐 아니라 사람에게도 씁니다. 听腻了 = 듣기 질렸다."}]},
  {s:"A",zh:"那我尝尝。麻是麻，可是越吃越上瘾。",py:"Nà wǒ chángchang. Má shì má, kěshì yuè chī yuè shàngyǐn.",
   ko:"그럼 먹어 볼게요. 얼얼하긴 얼얼한데, 먹을수록 중독되네요.",
   ck:[["那我尝尝","nà wǒ chángchang"],["麻是麻","má shì má"],["可是越吃越上瘾","kěshì yuè chī yuè shàngyǐn"]],
   notes:[{t:"A是A，可是…",p:"A shì A, kěshì…",k:"grammar",m:"~하긴 ~한데, 다만",tip:"상대 말을 일단 인정하고 뒤집는 고급 골격입니다. 贵是贵，可是质量好 = 비싸긴 비싼데 품질이 좋다."},
          {t:"越…越…",p:"yuè…yuè…",k:"grammar",m:"~할수록 ~하다",tip:"越说越激动 / 越想越气. 두 동사 앞에 각각 越를 놓습니다."}]},
  {s:"B",zh:"就是这个道理，川菜讲究的就是个层次。",py:"Jiùshì zhège dàoli, chuāncài jiǎngjiu de jiùshì ge céngcì.",
   ko:"바로 그겁니다, 쓰촨 요리가 따지는 게 바로 그 층층이 쌓인 맛이죠.",
   ck:[["就是这个道理","jiùshì zhège dàoli"],["川菜讲究的就是个层次","chuāncài jiǎngjiu de jiùshì ge céngcì"]],
   notes:[{t:"讲究",p:"jiǎngjiu",k:"word",m:"따지다, 중시하다 / 격식",tip:"명사로도 씁니다. 这里面有讲究 = 여기엔 나름의 법도가 있다."},
          {t:"…的就是个…",p:"…de jiùshì ge…",k:"grammar",m:"~하는 건 바로 ~다",tip:"강조 구문에 个를 넣는 것이 구어체의 맛입니다. 图的就是个方便."}]},
  {s:"A",zh:"说到吃，我发现你们这边下馆子特别频繁。",py:"Shuō dào chī, wǒ fāxiàn nǐmen zhèbiān xià guǎnzi tèbié pínfán.",
   ko:"먹는 얘기가 나와서 말인데, 여기는 외식이 유난히 잦더군요.",
   ck:[["说到吃","shuō dào chī"],["我发现你们这边","wǒ fāxiàn nǐmen zhèbiān"],["下馆子特别频繁","xià guǎnzi tèbié pínfán"]],
   notes:[{t:"说到…",p:"shuō dào…",k:"expr",m:"~얘기가 나왔으니 말인데",tip:"화제를 자연스럽게 옮기는 다리입니다. 说到这个，我想起一件事."},
          {t:"下馆子",p:"xià guǎnzi",k:"expr",m:"외식하다",tip:"在外面吃饭의 구어체. 馆子는 식당의 옛 구어입니다."}]},
  {s:"B",zh:"可不是嘛，家里做一顿又累又麻烦，还不如出来。",py:"Kě bú shì ma, jiā li zuò yí dùn yòu lèi yòu máfan, hái bùrú chūlái.",
   ko:"그러니까요, 집에서 한 끼 하려면 힘들고 번거로워서 나오는 게 낫죠.",
   ck:[["可不是嘛","kě bú shì ma"],["家里做一顿又累又麻烦","jiā li zuò yí dùn yòu lèi yòu máfan"],["还不如出来","hái bùrú chūlái"]],
   notes:[{t:"可不是嘛",p:"kě bú shì ma",k:"expr",m:"그러니까요, 내 말이 그 말입니다",tip:"강한 맞장구. 是的만 반복하는 습관을 이걸로 바꾸면 대화가 살아납니다."},
          {t:"还不如",p:"hái bùrú",k:"grammar",m:"차라리 ~하는 편이 낫다",tip:"与其…还不如… 형태로도 씁니다. 与其等他，还不如自己去."}]},
  {s:"A",zh:"也是。不过在家吃，图的是个自在。",py:"Yě shì. Búguò zài jiā chī, tú de shì ge zìzai.",
   ko:"그렇긴 하죠. 그래도 집에서 먹는 건 편한 맛에 먹는 거고요.",
   ck:[["也是","yě shì"],["不过在家吃","búguò zài jiā chī"],["图的是个自在","tú de shì ge zìzai"]],
   notes:[{t:"图的是…",p:"tú de shì…",k:"expr",m:"~을 노리는 것이다, ~때문이다",tip:"图는 [바라다]. 图的就是个便宜 / 图省事. 동기를 설명하는 세련된 표현입니다."},
          {t:"自在",p:"zìzai",k:"word",m:"홀가분하다, 마음 편하다",tip:"舒服가 몸이라면 自在는 마음입니다. 一个人待着挺自在."}]},
  {s:"B",zh:"那倒是。哎，你这筷子使得可比我还溜。",py:"Nà dào shì. Āi, nǐ zhè kuàizi shǐ de kě bǐ wǒ hái liū.",
   ko:"그건 그렇네요. 아니, 젓가락질이 저보다 더 능숙하신데요.",
   ck:[["那倒是","nà dào shì"],["哎，你这筷子使得","āi, nǐ zhè kuàizi shǐ de"],["可比我还溜","kě bǐ wǒ hái liū"]],
   notes:[{t:"那倒是",p:"nà dào shì",k:"expr",m:"그건 그렇네요",tip:"상대 말을 일부 인정할 때. 倒가 [의외로 그렇다]는 뉘앙스를 만듭니다."},
          {t:"溜",p:"liū",k:"word",m:"능숙하다, 매끄럽다 (구어)",tip:"说得真溜 = 정말 유창하다. 熟练의 구어체 칭찬입니다."}]},
  {s:"A",zh:"您就别拿我开玩笑了，我这是练出来的。",py:"Nín jiù bié ná wǒ kāi wánxiào le, wǒ zhè shì liàn chūlái de.",
   ko:"놀리지 마세요, 이건 연습해서 된 겁니다.",
   ck:[["您就别拿我开玩笑了","nín jiù bié ná wǒ kāi wánxiào le"],["我这是练出来的","wǒ zhè shì liàn chūlái de"]],
   notes:[{t:"拿…开玩笑",p:"ná…kāi wánxiào",k:"expr",m:"~를 놀리다",tip:"别拿我开玩笑 = 놀리지 마세요. 拿는 [~를 가지고]라는 뜻의 개사입니다."},
          {t:"练出来的",p:"liàn chūlái de",k:"grammar",m:"연습해서 만들어진 것",tip:"[동사+出来] = 없던 것이 생겨나다. 想出来 / 看出来 / 做出来."}]},
  {s:"B",zh:"服务员，把这几个菜打个包，剩下的别浪费。",py:"Fúwùyuán, bǎ zhè jǐ ge cài dǎ ge bāo, shèngxià de bié làngfèi.",
   ko:"저기요, 이 요리들 포장해 주세요, 남은 건 낭비하지 말고요.",
   ck:[["服务员","fúwùyuán"],["把这几个菜打个包","bǎ zhè jǐ ge cài dǎ ge bāo"],["剩下的别浪费","shèngxià de bié làngfèi"]],
   notes:[{t:"把…打个包",p:"bǎ…dǎ ge bāo",k:"grammar",m:"~를 포장하다",tip:"把자문은 [대상을 어떻게 처리한다]를 말할 때 씁니다. 打包 사이에 个를 넣으면 한결 가벼워집니다."},
          {t:"剩下的",p:"shèngxià de",k:"grammar",m:"남은 것",tip:"[동사+的] = ~한 것. 剩下的明天吃 = 남은 건 내일 먹자."}]},
  {s:"A",zh:"对，光看着满桌子剩菜就心疼。",py:"Duì, guāng kàn zhe mǎn zhuōzi shèngcài jiù xīnténg.",
   ko:"맞아요, 상 가득 남은 음식만 봐도 아깝습니다.",
   ck:[["对，光看着","duì, guāng kàn zhe"],["满桌子剩菜就心疼","mǎn zhuōzi shèngcài jiù xīnténg"]],
   notes:[{t:"光…就…",p:"guāng…jiù…",k:"grammar",m:"~만 해도 ~하다",tip:"光听就够了 = 듣기만 해도 충분하다. 只보다 구어적이고 강조가 셉니다."},
          {t:"心疼",p:"xīnténg",k:"word",m:"아깝다 / 안쓰럽다",tip:"돈·물건에는 [아깝다], 사람에게는 [안쓰럽다]. 我心疼你 = 네가 안쓰럽다."}]},
  {s:"B",zh:"那今天就到这儿，改天咱们再好好聊。",py:"Nà jīntiān jiù dào zhèr, gǎitiān zánmen zài hǎohāo liáo.",
   ko:"그럼 오늘은 여기까지 하고, 다음에 또 제대로 얘기하죠.",
   ck:[["那今天就到这儿","nà jīntiān jiù dào zhèr"],["改天咱们再好好聊","gǎitiān zánmen zài hǎohāo liáo"]],
   notes:[{t:"就到这儿",p:"jiù dào zhèr",k:"expr",m:"여기까지 하죠",tip:"모임·회의를 닫는 정형 문장입니다. 今天就到这儿吧."},
          {t:"好好",p:"hǎohāo",k:"pron",m:"제대로, 잘",tip:"구어에서는 뒤 글자가 1성으로 바뀌어 hǎohāo(r)로 들립니다. 好好休息 / 好好想想."}]},
  {s:"A",zh:"好，那我先谢过了，回头我请您尝尝韩餐。",py:"Hǎo, nà wǒ xiān xiè guo le, huítóu wǒ qǐng nín chángchang Háncān.",
   ko:"네, 미리 감사드립니다, 다음에 한식 대접하겠습니다.",
   ck:[["好，那我先谢过了","hǎo, nà wǒ xiān xiè guo le"],["回头我请您尝尝韩餐","huítóu wǒ qǐng nín chángchang Háncān"]],
   notes:[{t:"谢过了",p:"xiè guo le",k:"expr",m:"미리 감사드립니다",tip:"谢谢보다 격식이 있고 남자다운 어감입니다. 先谢过了 형태로 자주 씁니다."},
          {t:"回头",p:"huítóu",k:"word",m:"이따가, 나중에",tip:"回头再说 / 回头联系. 시간적으로 가까운 미래를 가리키는 구어입니다."}]}
 ],
 keys:[
  {zh:"说什么也得…",py:"shuō shénme yě děi…",ko:"무슨 일이 있어도 ~해야 한다",ex:"这顿说什么也得我请。",exPy:"Zhè dùn shuō shénme yě děi wǒ qǐng.",exKo:"이번 자리는 무슨 일이 있어도 제가 삽니다."},

 brief:[
  "기사에게 <b>돌아가는 것 아니냐</b>고 묻는 것은 사실상 의심을 표현하는 것입니다. 중국어에서는 이럴 때 직접 따지지 않고 <b>사실 확인의 형식</b>을 빌립니다 — 「是不是往东偏得有点儿远了？」",
  "상대가 이유를 설명하면 <b>是我多心了(제가 괜히 의심했네요)</b>로 물러서는 것이 정석입니다. 이 한마디가 분위기를 되돌립니다. 상대는 <b>哪儿的话(무슨 말씀을요)</b>로 받습니다.",
  "기사와의 잡담은 <b>일 → 건강 → 위로</b> 순서로 흘러갑니다. 이때 쓰이는 <b>忙归忙(바쁜 건 바쁜 거고) · 身体是本钱(몸이 밑천이다)</b> 같은 표현은 회사 대화에도 그대로 옮겨 쓸 수 있습니다.",
  "이 회차의 문법 축은 <b>只要…就… / A归A / 扛得住 / 不等于</b>입니다. 특히 <b>V得住·V不住</b>는 체력·상황을 말할 때 원어민이 즐겨 쓰는 형식입니다."

 brief:[
  "중국어에서 부탁은 <b>본론을 바로 꺼내지 않습니다.</b> 먼저 「有件事想请你帮个忙，不知道方不方便」처럼 <b>상대가 거절할 여지</b>를 만들어 두고 시작합니다. 이 예열이 없으면 부담을 떠넘기는 말이 됩니다.",
  "부탁받은 쪽은 <b>不好说 / 不归我管 / 不敢保证</b>으로 기대치를 낮춥니다. 이건 거절이 아니라 <b>안전장치</b>입니다. 이 말을 거절로 오해하면 대화가 끊깁니다.",
  "핵심 개념은 <b>人情(rénqíng)</b>입니다. 「人情用一次少一次」— 부탁은 쓸수록 줄어드는 자산이라는 감각이 깔려 있습니다. 그래서 부탁 전에 망설이고(犹豫), 부탁 후에 갚습니다(下次换我).",
  "<b>走后门(연줄로 처리하다)</b>은 부정적인 말입니다. 그래서 A는 먼저 「我不是让你走后门」이라고 선을 긋습니다. 이 한마디가 부탁의 격을 지켜 줍니다."
 ],
 vocab:[
  {w:"帮个忙",p:"bāng ge máng",m:"도움을 좀 주다",lv:"HSK4"},
  {w:"不好说",p:"bù hǎo shuō",m:"뭐라 말하기 어렵다",lv:"구어"},
  {w:"不归我管",p:"bù guī wǒ guǎn",m:"내 소관이 아니다",lv:"구어"},
  {w:"走后门",p:"zǒu hòumén",m:"연줄로 처리하다",lv:"관용"},
  {w:"打听",p:"dǎting",m:"알아보다, 수소문하다",lv:"HSK5"},
  {w:"名额",p:"míng'é",m:"정원, 자리",lv:"HSK6"},
  {w:"保证",p:"bǎozhèng",m:"보장하다",lv:"HSK4"},
  {w:"简历",p:"jiǎnlì",m:"이력서",lv:"HSK5"},
  {w:"期望",p:"qīwàng",m:"기대",lv:"HSK5"},
  {w:"准信儿",p:"zhǔnxìnr",m:"확실한 소식",lv:"구어"},
  {w:"人情",p:"rénqíng",m:"인정, 신세",lv:"HSK6"},
  {w:"开口",p:"kāikǒu",m:"말을 꺼내다",lv:"HSK5"}
 ],
 lines:[
  {s:"A",zh:"小美，有件事想请你帮个忙，不知道方不方便。",py:"Xiǎo Měi, yǒu jiàn shì xiǎng qǐng nǐ bāng ge máng, bù zhīdào fāng bu fāngbiàn.",
   ko:"샤오메이, 부탁할 일이 하나 있는데 괜찮을지 모르겠네요.",
   ck:[["小美，有件事","Xiǎo Měi, yǒu jiàn shì"],["想请你帮个忙","xiǎng qǐng nǐ bāng ge máng"],["不知道方不方便","bù zhīdào fāng bu fāngbiàn"]],
   notes:[{t:"不知道方不方便",p:"bù zhīdào fāng bu fāngbiàn",k:"expr",m:"괜찮으실지 모르겠습니다",tip:"부탁의 문을 여는 정형 문장. 상대에게 물러설 자리를 먼저 만들어 줍니다."},
          {t:"帮个忙",p:"bāng ge máng",k:"grammar",m:"도움을 좀 주다",tip:"帮忙 사이에 个를 끼워 넣어 가볍게 만듭니다. 帮我个忙 형태도 자주 씁니다."}]},
  {s:"B",zh:"你说，能帮的我肯定帮。",py:"Nǐ shuō, néng bāng de wǒ kěndìng bāng.",
   ko:"말해 보세요, 도울 수 있는 거면 당연히 돕죠.",
   ck:[["你说","nǐ shuō"],["能帮的我肯定帮","néng bāng de wǒ kěndìng bāng"]],
   notes:[{t:"能…的…",p:"néng…de…",k:"grammar",m:"~할 수 있는 것은",tip:"[동사+的]로 명사 자리를 채우는 구어 형식. 能改的都改了."}]},
  {s:"A",zh:"我表弟下个月来这边找工作，想问问你们公司招不招人。",py:"Wǒ biǎodì xià ge yuè lái zhèbiān zhǎo gōngzuò, xiǎng wènwen nǐmen gōngsī zhāo bu zhāo rén.",
   ko:"사촌 동생이 다음 달에 여기로 일자리를 구하러 오는데, 회사에서 사람 뽑는지 여쭤보고 싶어서요.",
   ck:[["我表弟下个月来这边找工作","wǒ biǎodì xià ge yuè lái zhèbiān zhǎo gōngzuò"],["想问问你们公司","xiǎng wènwen nǐmen gōngsī"],["招不招人","zhāo bu zhāo rén"]],
   notes:[{t:"招人",p:"zhāo rén",k:"word",m:"사람을 채용하다",tip:"招聘의 구어체. 我们在招人 = 우리 채용 중이에요."},
          {t:"表弟",p:"biǎodì",k:"culture",m:"외사촌·고종사촌 동생",tip:"친가 쪽은 堂, 외가·고모 쪽은 表. 중국어는 친척 호칭이 매우 세분화되어 있습니다."}]},
  {s:"B",zh:"这个我还真不好说，人事那边不归我管。",py:"Zhège wǒ hái zhēn bù hǎo shuō, rénshì nàbiān bù guī wǒ guǎn.",
   ko:"이건 정말 뭐라 말하기 어려워요, 인사 쪽은 제 소관이 아니라서요.",
   ck:[["这个我还真不好说","zhège wǒ hái zhēn bù hǎo shuō"],["人事那边不归我管","rénshì nàbiān bù guī wǒ guǎn"]],
   notes:[{t:"不好说",p:"bù hǎo shuō",k:"expr",m:"뭐라 말하기 어렵다",tip:"모른다는 뜻이 아니라 [단정할 수 없다]입니다. 회사 대화의 필수 완충어."},
          {t:"不归我管",p:"bù guī wǒ guǎn",k:"expr",m:"제 담당이 아닙니다",tip:"归 = ~에 속하다. 这事儿归他管 = 그건 그분 담당입니다."}]},
  {s:"A",zh:"我不是让你走后门，就是想打听打听有没有名额。",py:"Wǒ bú shì ràng nǐ zǒu hòumén, jiùshì xiǎng dǎting dǎting yǒu méiyǒu míng'é.",
   ko:"연줄을 대 달라는 게 아니라, 자리가 있는지만 좀 알아봐 달라는 겁니다.",
   ck:[["我不是让你走后门","wǒ bú shì ràng nǐ zǒu hòumén"],["就是想打听打听","jiùshì xiǎng dǎting dǎting"],["有没有名额","yǒu méiyǒu míng'é"]],
   notes:[{t:"走后门",p:"zǒu hòumén",k:"culture",m:"뒷문으로 들어가다, 연줄을 쓰다",tip:"부정적인 뉘앙스입니다. 먼저 선을 그으면 부탁이 훨씬 깔끔해집니다."},
          {t:"不是…就是…",p:"bú shì…jiùshì…",k:"grammar",m:"~가 아니라 그저 ~일 뿐이다",tip:"오해를 막고 의도를 좁히는 골격입니다."}]},
  {s:"B",zh:"那我可以帮你问，不过话说在前头，成不成我不敢保证。",py:"Nà wǒ kěyǐ bāng nǐ wèn, búguò huà shuō zài qiántou, chéng bu chéng wǒ bù gǎn bǎozhèng.",
   ko:"그럼 물어봐 줄 수는 있어요, 다만 미리 말해 두는데 될지 안 될지는 장담 못 합니다.",
   ck:[["那我可以帮你问","nà wǒ kěyǐ bāng nǐ wèn"],["不过话说在前头","búguò huà shuō zài qiántou"],["成不成我不敢保证","chéng bu chéng wǒ bù gǎn bǎozhèng"]],
   notes:[{t:"话说在前头",p:"huà shuō zài qiántou",k:"expr",m:"미리 말해 두겠습니다",tip:"조건이나 한계를 먼저 못 박는 표현. 계약·협상에서도 그대로 씁니다."},
          {t:"成不成",p:"chéng bu chéng",k:"grammar",m:"될지 안 될지",tip:"成 = 성사되다. 这事儿成了 = 그 일 성사됐어요."}]},
  {s:"A",zh:"那是自然，能问一句我就已经很感激了。",py:"Nà shì zìrán, néng wèn yí jù wǒ jiù yǐjīng hěn gǎnjī le.",
   ko:"당연하죠, 한마디 물어봐 주시는 것만으로도 정말 감사합니다.",
   ck:[["那是自然","nà shì zìrán"],["能问一句","néng wèn yí jù"],["我就已经很感激了","wǒ jiù yǐjīng hěn gǎnjī le"]],
   notes:[{t:"那是自然",p:"nà shì zìrán",k:"expr",m:"그야 당연하죠",tip:"当然보다 격식 있고 어른스럽게 들립니다."}]},
  {s:"B",zh:"他什么专业？我们这儿技术岗多，文科的机会少。",py:"Tā shénme zhuānyè? Wǒmen zhèr jìshù gǎng duō, wénkē de jīhuì shǎo.",
   ko:"전공이 뭐예요? 우리 쪽은 기술직이 많고 문과는 기회가 적어요.",
   ck:[["他什么专业","tā shénme zhuānyè"],["我们这儿技术岗多","wǒmen zhèr jìshù gǎng duō"],["文科的机会少","wénkē de jīhuì shǎo"]],
   notes:[{t:"岗",p:"gǎng",k:"word",m:"직무, 자리",tip:"岗位의 줄임. 技术岗 / 管理岗 / 在岗(재직 중)."}]},
  {s:"A",zh:"学机械的，做过两年设备维护，动手能力还行。",py:"Xué jīxiè de, zuò guo liǎng nián shèbèi wéihù, dòngshǒu nénglì hái xíng.",
   ko:"기계 전공이고, 설비 유지보수를 2년 했어요, 손재주는 괜찮은 편입니다.",
   ck:[["学机械的","xué jīxiè de"],["做过两年设备维护","zuò guo liǎng nián shèbèi wéihù"],["动手能力还行","dòngshǒu nénglì hái xíng"]],
   notes:[{t:"学…的",p:"xué…de",k:"grammar",m:"~를 전공한 사람",tip:"你是学什么的? = 전공이 뭐예요? 자기소개의 기본 문형입니다."},
          {t:"动手能力",p:"dòngshǒu nénglì",k:"word",m:"실무·손으로 하는 능력",tip:"채용 이야기에서 자주 나오는 평가어입니다."}]},
  {s:"B",zh:"那还有点儿希望，你把简历发我，我转给同事看看。",py:"Nà hái yǒudiǎnr xīwàng, nǐ bǎ jiǎnlì fā wǒ, wǒ zhuǎn gěi tóngshì kànkan.",
   ko:"그럼 좀 가능성이 있겠네요, 이력서 보내 주시면 동료에게 전달해 볼게요.",
   ck:[["那还有点儿希望","nà hái yǒudiǎnr xīwàng"],["你把简历发我","nǐ bǎ jiǎnlì fā wǒ"],["我转给同事看看","wǒ zhuǎn gěi tóngshì kànkan"]],
   notes:[{t:"转给",p:"zhuǎn gěi",k:"word",m:"~에게 전달하다",tip:"메일·메시지에 그대로 씁니다. 我转给你 = 제가 전달해 드릴게요."}]},
  {s:"A",zh:"太感谢了，晚上我就发过去。",py:"Tài gǎnxiè le, wǎnshang wǒ jiù fā guòqù.",
   ko:"정말 감사합니다, 저녁에 바로 보내겠습니다.",
   ck:[["太感谢了","tài gǎnxiè le"],["晚上我就发过去","wǎnshang wǒ jiù fā guòqù"]],
   notes:[{t:"发过去",p:"fā guòqù",k:"grammar",m:"보내다 (상대 쪽으로)",tip:"방향보어 过去/过来가 시점을 정합니다. 发过来 = 이쪽으로 보내 주세요."}]},
  {s:"B",zh:"别客气。不过有句话我得提醒你。",py:"Bié kèqi. Búguò yǒu jù huà wǒ děi tíxǐng nǐ.",
   ko:"별말씀을요. 그런데 한마디 일러 둘 게 있어요.",
   ck:[["别客气","bié kèqi"],["不过有句话我得提醒你","búguò yǒu jù huà wǒ děi tíxǐng nǐ"]],
   notes:[{t:"有句话…",p:"yǒu jù huà…",k:"expr",m:"할 말이 하나 있는데",tip:"충고를 꺼내는 예열 문장입니다. 有句话不知当讲不当讲 형태도 유명합니다."}]},
  {s:"A",zh:"您说，我听着呢。",py:"Nín shuō, wǒ tīng zhe ne.",
   ko:"말씀하세요, 듣고 있습니다.",
   ck:[["您说","nín shuō"],["我听着呢","wǒ tīng zhe ne"]],
   notes:[{t:"…着呢",p:"zhe ne",k:"grammar",m:"~하고 있어요",tip:"진행을 강조하는 구어. 我等着呢 / 忙着呢."}]},
  {s:"B",zh:"这种事别抱太大期望，免得他白高兴一场。",py:"Zhè zhǒng shì bié bào tài dà qīwàng, miǎnde tā bái gāoxìng yì chǎng.",
   ko:"이런 일은 기대를 너무 크게 하지 마세요, 괜히 헛물켜지 않게요.",
   ck:[["这种事别抱太大期望","zhè zhǒng shì bié bào tài dà qīwàng"],["免得他白高兴一场","miǎnde tā bái gāoxìng yì chǎng"]],
   notes:[{t:"抱期望",p:"bào qīwàng",k:"word",m:"기대를 품다",tip:"别抱太大期望 = 너무 기대하지 마세요. 抱希望도 같습니다."},
          {t:"白高兴一场",p:"bái gāoxìng yì chǎng",k:"expr",m:"괜히 좋아하다 말다",tip:"白 = 헛되이, 一场 = 한바탕. 白忙一场도 같은 구조입니다."}]},
  {s:"A",zh:"有道理，我先不跟他说，等有准信儿再讲。",py:"Yǒu dàoli, wǒ xiān bù gēn tā shuō, děng yǒu zhǔnxìnr zài jiǎng.",
   ko:"일리 있네요, 일단 말 안 하고 확실한 소식이 오면 얘기하겠습니다.",
   ck:[["有道理","yǒu dàoli"],["我先不跟他说","wǒ xiān bù gēn tā shuō"],["等有准信儿再讲","děng yǒu zhǔnxìnr zài jiǎng"]],
   notes:[{t:"等…再…",p:"děng…zài…",k:"grammar",m:"~한 뒤에 ~하다",tip:"等他回来再说 = 그가 오면 그때 얘기하죠. 순서를 정하는 기본 골격입니다."},
          {t:"准信儿",p:"zhǔnxìnr",k:"word",m:"확실한 소식",tip:"有准信儿了吗? = 확실한 소식 나왔나요? 업무에서도 그대로 씁니다."}]},
  {s:"B",zh:"这样最稳妥。人情这东西，用一次少一次。",py:"Zhèyàng zuì wěntuǒ. Rénqíng zhè dōngxi, yòng yí cì shǎo yí cì.",
   ko:"그게 제일 안전하죠. 인정이란 게 한 번 쓰면 한 번 줄어드니까요.",
   ck:[["这样最稳妥","zhèyàng zuì wěntuǒ"],["人情这东西","rénqíng zhè dōngxi"],["用一次少一次","yòng yí cì shǎo yí cì"]],
   notes:[{t:"稳妥",p:"wěntuǒ",k:"word",m:"안전하고 확실하다",tip:"这么办比较稳妥 = 이렇게 하는 편이 안전합니다."},
          {t:"用一次少一次",p:"yòng yí cì shǎo yí cì",k:"culture",m:"쓸수록 줄어든다",tip:"인정·기회를 아껴 쓰라는 중국식 감각. 见一次少一次(만날 날이 줄어든다)도 자주 씁니다."}]},
  {s:"A",zh:"这话在理，所以我才犹豫了好几天才开口。",py:"Zhè huà zài lǐ, suǒyǐ wǒ cái yóuyù le hǎo jǐ tiān cái kāikǒu.",
   ko:"맞는 말씀이라, 그래서 며칠을 망설이다 겨우 말을 꺼낸 겁니다.",
   ck:[["这话在理","zhè huà zài lǐ"],["所以我才犹豫了好几天","suǒyǐ wǒ cái yóuyù le hǎo jǐ tiān"],["才开口","cái kāikǒu"]],
   notes:[{t:"开口",p:"kāikǒu",k:"expr",m:"말을 꺼내다",tip:"不好意思开口 = 말을 꺼내기가 민망하다. 부탁의 어려움을 표현하는 핵심어입니다."},
          {t:"好几天",p:"hǎo jǐ tiān",k:"grammar",m:"며칠씩이나",tip:"好+수량 = 꽤 많은. 好几次 / 好多人."}]},
  {s:"B",zh:"咱俩之间用不着这么见外，有事直说就行。",py:"Zán liǎ zhījiān yòng bu zháo zhème jiànwài, yǒu shì zhí shuō jiù xíng.",
   ko:"우리 사이에 그렇게 격식 차릴 필요 없어요, 일 있으면 바로 말하면 됩니다.",
   ck:[["咱俩之间","zán liǎ zhījiān"],["用不着这么见外","yòng bu zháo zhème jiànwài"],["有事直说就行","yǒu shì zhí shuō jiù xíng"]],
   notes:[{t:"用不着",p:"yòng bu zháo",k:"grammar",m:"~할 필요 없다",tip:"不用보다 강한 어감. 用不着你操心 = 네가 걱정할 필요 없어."},
          {t:"咱俩",p:"zán liǎ",k:"word",m:"우리 둘",tip:"咱们两个의 축약. 친밀함을 드러내는 북방 구어입니다."}]},
  {s:"A",zh:"那我记下了。以后你有用得着我的地方，尽管开口。",py:"Nà wǒ jì xià le. Yǐhòu nǐ yǒu yòng de zháo wǒ de dìfang, jǐnguǎn kāikǒu.",
   ko:"새겨 두겠습니다. 앞으로 제가 쓸모 있을 일이 있으면 언제든 말씀하세요.",
   ck:[["那我记下了","nà wǒ jì xià le"],["以后你有用得着我的地方","yǐhòu nǐ yǒu yòng de zháo wǒ de dìfang"],["尽管开口","jǐnguǎn kāikǒu"]],
   notes:[{t:"用得着",p:"yòng de zháo",k:"grammar",m:"쓸모가 있다, 필요하다",tip:"用不着의 반대. 有用得着我的地方 = 제가 도움이 될 일이 있으면."},
          {t:"尽管",p:"jǐnguǎn",k:"grammar",m:"얼마든지, 마음껏",tip:"尽管说 / 尽管用. 뒤에 동사를 놓아 [부담 갖지 말고]를 나타냅니다."}]},

{
 id:"c1d7", day:7, cat:"클레임·협상", level:"HSK 5~6",

 names:{A:"志勋 (투숙객)", B:"大堂经理 (호텔 지배인)"},
 brief:[
  "중국어 클레임의 원칙은 <b>사실 → 영향 → 요구</b> 순서입니다. 감정을 앞세우면 상대가 방어에 들어가고, 사실부터 깔면 상대가 해결책을 내놓습니다.",
  "호텔·서비스 측의 사과 표현은 정해져 있습니다. <b>失职(직무를 다하지 못했다) · 做得不到位(미흡했다) · 给您添麻烦了</b>. 이 말이 나오면 사과가 공식화된 것이고, 다음은 보상 협의입니다.",
  "제안이 과할 때는 받지 않는 편이 낫습니다. <b>升级就不必了，我只想要…</b>처럼 <b>진짜 원하는 것 하나</b>로 좁히면 협상이 빨라집니다.",
  "마무리는 <b>我也不是要为难谁(누굴 곤란하게 하려는 게 아닙니다)</b>가 좋습니다. 요구는 관철하면서 관계는 남기는, 가장 어른스러운 문장입니다."
 ],

/* ---------- 병음: 음절 분리 + 성조 색 ---------- */
const TONE_MAP = {
  "ā":["a",1],"á":["a",2],"ǎ":["a",3],"à":["a",4],
  "ē":["e",1],"é":["e",2],"ě":["e",3],"è":["e",4],
  "ī":["i",1],"í":["i",2],"ǐ":["i",3],"ì":["i",4],
  "ō":["o",1],"ó":["o",2],"ǒ":["o",3],"ò":["o",4],
  "ū":["u",1],"ú":["u",2],"ǔ":["u",3],"ù":["u",4],
  "ǖ":["ü",1],"ǘ":["ü",2],"ǚ":["ü",3],"ǜ":["ü",4],
  "ń":["n",2],"ň":["n",3],"ǹ":["n",4]
};
const INITIALS = ["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w"];
const FINALS = ["iang","iong","uang","ueng","üan","uai","uan","ian","iao","ing","ong","eng","ang",
  "van","iu","ie","ia","in","un","ün","vn","ua","uo","ui","ue","üe","ve","ai","ei","ao","ou","an","en","er","ng",
  "a","o","e","i","u","ü","v"];
function plainOf(tok){
  let plain="", tones=[];
  for(const ch of tok){
    const m = TONE_MAP[ch.toLowerCase()];
    if(m){ plain += (ch===ch.toLowerCase()? m[0] : m[0].toUpperCase()); tones.push([plain.length-1, m[1]]); }
    else plain += ch;
  }
  return {plain, tones};
}
function splitSyllables(tok){
  const {plain, tones} = plainOf(tok);
  const low = plain.toLowerCase();
  if(!/^[a-zü]+$/.test(low)) return [{text:tok, tone:-1}];
  if(!tones.length && /[A-Z]/.test(tok)) return [{text:tok, tone:-1}];
  const cuts=[]; let i=0, guard=0;
  while(i<low.length && guard++<40){
    let st=i;
    for(const ini of INITIALS){ if(low.startsWith(ini,i)){ i+=ini.length; break; } }
    let matched=false;
    for(const f of FINALS){ if(low.startsWith(f,i)){ i+=f.length; matched=true; break; } }
    if(!matched){ i=st+1; }
    if(low[i]==="r" && i===low.length-1) i++;
    if(i<=st){ i=st+1; }
    cuts.push([st,i]);
  }
  if(!cuts.length) return [{text:tok, tone:-1}];
  return cuts.map(([a,b])=>{
    let tone = 0;
    tones.forEach(([idx,t])=>{ if(idx>=a && idx<b) tone=t; });
    return {text: tok.slice(a,b), tone};
  });
}
function pyHTML(s){
  if(!s) return "";
  return String(s).split(/(\s+|[,.;:?!'’，。？！、…]+)/).map(tok=>{
    if(!tok) return "";
    if(/^(\s+|[,.;:?!'’，。？！、…]+)$/.test(tok)) return esc(tok);
    return splitSyllables(tok).map(sy=>
      sy.tone<0 ? esc(sy.text) : '<span class="t'+sy.tone+'">'+esc(sy.text)+'</span>').join("");
  }).join("");
}
function pyBox(s, cls){ return '<span class="py '+(cls||"")+'">'+pyHTML(s)+'</span>'; }

/* ---------- 음성 (TTS) ---------- */
let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^zh(-|_|$)/i.test(v.lang) || /chinese|中文|普通话|mandarin/i.test(v.name));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); if(cur.view==="settings") render(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const cn = VOICES.filter(x=>/zh-CN|zh_CN/i.test(x.lang));
    const pool = cn.length? cn : VOICES;
    const f = pool.filter(x=>/xiaoxiao|huihui|yaoyao|female|xiaoyi|xiaochen|晓/i.test(x.name));
    const m = pool.filter(x=>/yunxi|kangkang|male|yunyang|yunjian|云/i.test(x.name));
    v = who==="B" ? (m[0]||pool[1]||pool[0]) : (f[0]||pool[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null, rpTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; rpTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="zh-CN";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.06;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].zh, items[i].s, rate, ()=>{ i++; setTimeout(step, 280); });
  })();
}

function chunksOf(l){
  if(Array.isArray(l.ck) && l.ck.length) return l.ck.map(c=>({zh:c[0], py:c[1]}));
  return [{zh:l.zh, py:l.py}];
}

/* ---------- 발음 체크 (음성인식) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function normChars(s){ return (String(s).match(/[一-鿿A-Za-z0-9]/g)||[]); }
function compareSpoken(target, said){
  const t = normChars(target), h = normChars(said);
  const pool = h.slice();
  const marks = t.map(w=>{ const i = pool.indexOf(w); if(i>=0){ pool.splice(i,1); return {w, ok:true}; } return {w, ok:false}; });
  const hit = marks.filter(m=>m.ok).length;
  return { marks, score: t.length ? Math.round(hit/t.length*100) : 0 };
}

function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};
}

    h += '<div class="ditem" data-id="'+x.id+'"><div class="num">'+x.day+'</div><div class="t"><b>'+esc(x.title)+'</b>'+

         (isDone(x.id)?'<div class="done">완료</div>':'<div class="sub" style="font-size:12px">'+x.lines.length+'문장</div>')+'</div>';
  });
  h += '</div>';
  h += '<div class="card sub">한 세션은 <b>20분</b>입니다 — 복습 2분 · 단어 3분 · 통듣기 3분 · 쉐도잉 10분 · 역할극 2분. '+
       '시간이 없으면 <b>쉐도잉 단계만</b> 해도 효과의 대부분이 나옵니다. 난이도는 <b>HSK 5~6</b> 기준입니다.</div>';
  h += '<div class="card copy"><div class="seal">茶馆</div><div class="ct">'+
       '<b>茶馆 CHÁGUǍN — 데일리 중국어 쉐도잉</b><br>'+

       '<div class="sub" style="margin-top:6px">이 앱의 기획·구성과 모든 콘텐츠(대화문·병음·번역·표현 노트·커리큘럼)의 저작권은 '+
       '<b>곤사마</b>에게 있습니다. 개인 학습 목적으로는 자유롭게 쓰시되, 무단 복제·배포·상업적 이용은 금합니다.</div></div></div>';

/* ---------- 세션 ---------- */
function renderSession(){
  const d = dayById(cur.dayId); if(!d){ go("home"); return; }
  const st = STEPS[cur.step];
  let h = "";
  h += '<div class="steps">'+STEPS.map((s,i)=>'<div class="'+(i<cur.step?"past":i===cur.step?"on":"")+'"></div>').join("")+'</div>';
  h += '<div class="sesshead"><span class="tag r">DAY '+d.day+'</span><span class="stepname">'+(cur.step+1)+'. '+st.n+'<em>권장 '+st.m+'분 · '+st.d+'</em></span>';
  h += '<span class="clock" id="clock">00:00</span></div>';
  h += '<div id="stepbody"></div>';
  $("#view-session").innerHTML = h;
  updClock();
  ({review:stepReview, words:stepWords, listen:stepListen, shadow:stepShadow, output:stepOutput})[st.k](d);
  renderFoot(d);
  bindPyClick();
}
function renderFoot(d){
  const last = cur.step===STEPS.length-1;
  let h = '<button class="btn ghost sm" id="fPrev">← 이전</button>';
  h += '<span class="sub" style="font-size:12px">'+(cur.step+1)+'/'+STEPS.length+'</span>';
  h += '<span style="flex:1"></span>';
  h += '<button class="btn ghost sm" id="fHome">나가기</button>';
  h += '<button class="btn '+(last?"blue":"")+'" id="fNext">'+(last?"훈련 완료 ✓":"다음 단계 →")+'</button>';
  $("#footin").innerHTML = h;
  $("#fPrev").onclick = ()=>{ if(cur.step>0){ stopSpeak(); cur.step--; renderSession(); } };
  $("#fHome").onclick = ()=>{ saveProgress(); go("home"); };
  $("#fNext").onclick = ()=>{
    stopSpeak();
    if(cur.step<STEPS.length-1){ cur.step++; renderSession(); }
    else finishSession(d);
  };
  $("#fPrev").disabled = cur.step===0;
}
function saveProgress(){
  if(!cur.dayId) return;
  const p = S.prog[cur.dayId] || {};
  p.reps = cur.reps; p.stepIdx = cur.step;
  S.prog[cur.dayId] = p; save();
}
function finishSession(d){
  const p = S.prog[d.id] || {}; p.reps=cur.reps; p.done=true; p.doneAt=today(); S.prog[d.id]=p;
  const t = today(); const prev = S.log[t] || {min:0, lines:0};
  const repLines = Object.keys(cur.reps).filter(k=>cur.reps[k]>0).length;
  S.log[t] = { dayId:d.id, min: prev.min + Math.max(1, elapsedMin()), lines: prev.lines + repLines, ts: Date.now() };
  save(); endSession();
  const info = streakInfo();
  $("#view-session").innerHTML =
    '<div class="hd" style="margin-top:30px"><small>Session complete</small>오늘 훈련 완료</div>'+
    '<div class="card"><div class="hz" style="font-size:26px">'+esc(d.title)+'</div>'+
    '<div class="sub" style="margin:6px 0 14px">'+esc(d.titleKo)+'</div>'+
    '<div class="streak"><div><b>'+elapsedMin()+'</b><span>오늘 분</span></div><div><b>'+repLines+'</b><span>따라 읽은 문장</span></div>'+
    '<div><b>'+info.streak+'</b><span>연속일</span></div></div>'+
    '<div class="rule"></div><div class="sub">내일 첫 단계에서 오늘 표현 8개를 다시 물어봅니다. 그때 <b>병음을 보지 말고</b> 소리부터 내 보세요.</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="cHome">홈으로</button>'+
    '<button class="btn ghost" id="cBank">단어장에서 복습</button></div></div>';
  $("#footbar").classList.remove("on");
  $("#cHome").onclick=()=>go("home"); $("#cBank").onclick=()=>go("bank");
}

/* --- step 1 : 복습 --- */
function stepReview(d){
  const p = prevOf(d.id);
  let h = "";
  if(!p){
    h = '<div class="card"><b>첫 회차입니다.</b><div class="sub" style="margin-top:6px">복습할 이전 회차가 없으니 바로 다음 단계로 넘어가세요. '+
        '내일부터 이 자리에서 전날 표현을 물어봅니다.</div></div>';
  } else {
    h = '<div class="card"><div class="sub">DAY '+p.day+' · '+esc(p.title)+' — '+esc(p.titleKo)+'</div>'+
        '<div style="margin:10px 0 4px;font-size:13.5px">한자를 보고 <b>먼저 소리 내어</b> 읽은 뒤, 가려진 뜻을 눌러 확인하세요.</div><div class="rule"></div>';
    p.keys.forEach(k=>{
      h += '<div class="keyrow"><div class="k"><b>'+esc(k.zh)+'</b> <button class="btn ghost sm rv" data-t="'+esc(k.zh)+'">▶</button>'+pyBox(k.py)+'</div>'+
           '<div class="m"><span class="blurme">'+esc(k.ko)+'</span>'+
           '<span class="ex blurme">'+esc(k.ex)+'</span><span class="exko blurme">'+esc(k.exKo||"")+'</span></div></div>';
    });
    h += '</div>';
  }
  $("#stepbody").innerHTML = h;
  bindBlur(); bindPlay();
}
function bindBlur(){
  document.querySelectorAll(".blurme").forEach(el=>{ if(el._bb) return; el._bb=1;
    el.addEventListener("click", ()=> el.classList.toggle("show")); });
}
function bindPlay(){
  document.querySelectorAll(".rv").forEach(b=> b.onclick = e=>{ e.stopPropagation(); speak(b.dataset.t, "A", S.cfg.rate); });
}

/* --- step 2 : 단어·표현 --- */
function stepWords(d){
  let h = '<div class="card"><span class="tag">'+esc(d.cat)+'</span>'+
    '<div class="hz" style="font-size:26px;margin:8px 0 2px">'+esc(d.title)+'</div>'+
    '<div class="tpy py">'+pyHTML(d.titlePy)+'</div>'+
    '<div class="sub">'+esc(d.titleKo)+'</div><div class="rule"></div><ul class="brief">'+
    d.brief.map(b=>'<li>'+b+'</li>').join("")+'</ul></div>';
  if(d.vocab && d.vocab.length){
    h += '<div class="card"><b>오늘의 단어 '+d.vocab.length+'개</b>'+
         '<div class="sub" style="margin:4px 0 8px">지금은 눈으로만 훑으세요. 외우는 건 쉐도잉에서 저절로 됩니다. ▶를 누르면 발음이 나옵니다.</div><div class="rule"></div>';
    d.vocab.forEach(v=>{
      h += '<div class="vrow"><div class="w"><b>'+esc(v.w)+'</b> <button class="btn ghost sm rv" data-t="'+esc(v.w)+'">▶</button>'+pyBox(v.p)+'</div>'+
           '<div class="m">'+esc(v.m)+'</div><div class="lv">'+esc(v.lv||"")+'</div></div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><b>오늘의 핵심 표현 '+d.keys.length+'개</b><div class="rule"></div>';
  d.keys.forEach(k=>{
    h += '<div class="keyrow"><div class="k"><b>'+esc(k.zh)+'</b> <button class="btn ghost sm rv" data-t="'+esc(k.zh)+'">▶</button>'+pyBox(k.py)+'</div>'+
         '<div class="m">'+esc(k.ko)+'<span class="ex">'+esc(k.ex)+'</span>'+pyBox(k.exPy)+'<span class="exko">'+esc(k.exKo||"")+'</span></div></div>';
  });

/* --- step 3 : 통으로 듣기 --- */
function stepListen(d){
  let h = '<div class="card"><div class="row" style="margin-bottom:6px">'+
    '<button class="btn" id="playAll">전체 재생 ▶</button>'+
    '<button class="btn ghost sm" id="stopAll">정지 ■</button>'+

    '<div class="rule"></div><div id="script">'+d.lines.map((l,i)=>lineHTML(l,i)).join("")+'</div></div>';

  };

    stopSpeak(); const i=+el.dataset.i; speak(d.lines[i].zh, d.lines[i].s, S.cfg.rate);
  });
}
function lineHTML(l,i){
  return '<div class="sline '+(l.s==="B"?"b":"")+'" data-i="'+i+'"><div class="sp">'+l.s+'</div>'+
    '<div><span class="zh">'+esc(l.zh)+'</span>'+pyBox(l.py)+

}
function speedBar(id){
  return '<span class="speedbar" id="'+id+'">속도 '+[0.6,0.75,0.9,1.0].map(r=>
    '<button data-r="'+r+'" class="'+(Math.abs(S.cfg.rate-r)<0.01?"on":"")+'">'+r+'x</button>').join("")+'</span>';
}
function bindSpeed(id){
  document.querySelectorAll("#"+id+" button").forEach(b=> b.onclick = ()=>{
    S.cfg.rate = +b.dataset.r; save();
    document.querySelectorAll("#"+id+" button").forEach(x=>x.classList.toggle("on", x===b));
  });
}

/* --- step 4 : 쉐도잉 (핵심) --- */
function stepShadow(d){
  const i = cur.line, l = d.lines[i];
  const reps = cur.reps[i]||0, target = S.cfg.reps;
  const chunks = chunksOf(l);
  let h = '<div class="row" style="margin:10px 0 0"><span class="sub">문장 '+(i+1)+' / '+d.lines.length+'</span>';
  h += '<span style="flex:1"></span>'+speedBar("shSpeed")+'</div>';
  h += '<div class="shadowbox">';
  h +=   '<div class="who '+(l.s==="B"?"b":"")+'">'+(l.s==="B"?esc(d.names.B):esc(d.names.A))+'</div>';
  h +=   '<div class="bigzh">'+esc(l.zh)+'</div>';
  h +=   '<div class="bigpy py">'+pyHTML(l.py)+'</div>';
  if(chunks.length>1){
    h += '<div class="sub" style="font-size:12px;margin-top:6px">덩어리로 끊어 읽기 — 각 줄을 눌러 따라 하세요</div>';
    h += '<div class="chunks">'+chunks.map((c,ci)=>'<div class="chunk" data-c="'+ci+'"><span class="zh">'+esc(c.zh)+'</span>'+pyBox(c.py)+'</div>').join("")+'</div>';
  }
  h +=   '<div class="bigko blurme'+(cur.showKo?" show":"")+'">'+esc(l.ko)+'</div>';
  h +=   '<div class="rule"></div>';
  h +=   '<div class="row"><button class="btn" id="pLine">듣기 ▶</button>'+
         '<button class="btn ghost sm" id="pSlow">천천히 0.6x</button>'+
         '<button class="btn '+(autoTok?"blue":"ghost")+' sm" id="pAuto">'+(autoTok?"■ 자동 정지":"자동 진행 ▶▶")+'</button>'+
         (SR?'<button class="btn ghost sm" id="pAsr">🎤 발음 체크</button>':'')+
         '<span style="flex:1"></span><span class="counter" id="dots">'+
         Array.from({length:target},(_,k)=>'<span class="dot '+(k<reps?"on":"")+'"></span>').join("")+'</span></div>';
  h +=   '<div id="asrOut"></div>';
  if(l.notes && l.notes.length){
    h += '<div class="notes"><div class="sub" style="font-size:12px;margin-bottom:4px">표현 노트</div>';
    l.notes.forEach(n=>{
      h += '<div class="note"><b>'+esc(n.t)+'</b><span class="np">'+pyHTML(n.p||"")+'</span><span class="k">'+esc(kLabel(n.k))+'</span> — '+esc(n.m)+
           (n.tip?'<span class="tip">'+esc(n.tip)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="row"><button class="btn ghost" id="sPrev">← 앞 문장</button>'+
       '<button class="btn" id="sNext">다음 문장 →</button>'+
       '<span class="sub" style="font-size:12px">스페이스바=듣기, Enter=다음</span></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("shSpeed"); bindBlur(); bindPyClick();

  const play = (rate)=>{ stopSpeak(); bumpRep(i); speak(l.zh, l.s, rate||S.cfg.rate); };
  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.6);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c].zh, l.s, Math.min(S.cfg.rate,0.75));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
  if(SR) $("#pAsr").onclick = ()=> runAsr(l.zh);
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = zh => Math.max(1100, cLen(zh) * 420);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.zh, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.zh));
    });
  })(0);
}
function kLabel(k){
  return ({word:"단어", expr:"표현", grammar:"문법", measure:"양사", pron:"발음", culture:"문화", idiom:"관용"})[k] || k;
}
function runAsr(target){
  const box = $("#asrOut");
  let rec;
  try{ rec = new SR(); }catch(e){ box.innerHTML='<div class="sub">이 브라우저에서는 발음 체크를 쓸 수 없습니다.</div>'; return; }
  rec.lang="zh-CN"; rec.interimResults=false; rec.maxAlternatives=1;
  box.innerHTML = '<div class="asr sub">🎤 듣고 있습니다… 문장을 소리 내어 읽으세요.</div>';
  rec.onresult = e=>{
    const said = e.results[0][0].transcript;
    const r = compareSpoken(target, said);
    box.innerHTML = '<div class="asr"><span class="score">'+r.score+'점</span> <span class="sub">— 인식된 문장: '+esc(said)+'</span><div style="margin-top:6px">'+
      r.marks.map(m=>'<span class="w '+(m.ok?"good":"bad")+'">'+esc(m.w)+'</span>').join("")+'</div>'+
      '<div class="sub" style="font-size:12px;margin-top:4px">빨간 글자는 전달되지 않은 부분입니다. 그 글자만 천천히 다시 읽어 보세요. '+
      '※ 성조까지 채점하지는 못합니다. 성조는 앱 발음을 따라 하며 귀로 잡으세요.</div></div>';
  };
  rec.onerror = ev=>{ box.innerHTML='<div class="asr sub">인식 실패('+esc(ev.error)+'). 마이크 권한과 인터넷 연결을 확인하세요.</div>'; };
  try{ rec.start(); }catch(e){ box.innerHTML='<div class="asr sub">마이크를 시작할 수 없습니다.</div>'; }
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.zh, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

/* --- step 5 : 역할극 + 말해보기 --- */
function stepOutput(d){
  const me = S.cfg.myRole || "A";
  const other = me==="A" ? "B" : "A";
  const saved = S.out[d.id] || [];
  let h = '<div class="card"><b>역할극 — 내 대사를 내가 말하기</b>'+
    '<div class="sub" style="margin:4px 0 8px">상대 대사는 앱이 읽어 줍니다. 내 대사 차례에는 화면이 파랗게 바뀌고 잠시 멈춥니다. 그때 소리 내어 말하세요.</div>'+
    '<div class="row"><span class="sub">내 역할</span>'+
    '<button class="btn '+(me==="A"?"blue":"ghost")+' sm rrole" data-r="A">A · '+esc(d.names.A)+'</button>'+
    '<button class="btn '+(me==="B"?"blue":"ghost")+' sm rrole" data-r="B">B · '+esc(d.names.B)+'</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="rpStart">역할극 시작 ▶</button>'+
    '<button class="btn ghost sm" id="rpStop">정지 ■</button>'+
    '<button class="btn ghost sm" id="rpHide">내 대사 '+(cur.showKo?"가리기":"가린 채 보기")+'</button></div>'+
    '<div class="rule"></div><div id="rpList">'+
    d.lines.map((l,i)=>'<div class="rp '+(l.s===me?"mine":"")+'" data-i="'+i+'"><div class="sp">'+l.s+'</div>'+
      '<div><span class="zh'+(l.s===me?" blurme":"")+'">'+esc(l.zh)+'</span>'+pyBox(l.py)+
      '<span class="ko">'+esc(l.ko)+'</span></div></div>').join("")+'</div></div>';
  h += '<div class="card"><b>내 말로 말해 보기</b>'+

function runRolePlay(d, me, other){
  const token = {}; rpTok = token;
  let i = 0;
  const mark = (idx)=>{
    document.querySelectorAll("#rpList .rp").forEach(e=>e.classList.remove("now"));
    const el = document.querySelector('#rpList .rp[data-i="'+idx+'"]');
    if(el){ el.classList.add("now"); el.scrollIntoView({block:"center", behavior:"smooth"}); }
  };
  (function step(){
    if(rpTok!==token) return;
    if(i>=d.lines.length){ rpTok=null; toast("역할극 끝 — 수고하셨습니다"); return; }
    const l = d.lines[i]; mark(i);
    if(l.s===other){
      speak(l.zh, l.s, S.cfg.rate, ()=>{ i++; setTimeout(step, 300); });
    } else {
      const wait = Math.max(1600, cLen(l.zh)*520);
      setTimeout(()=>{ if(rpTok!==token) return; i++; step(); }, wait);
    }
  })();
}

function showBackupText(json){
  const box = $("#bkOut"); if(!box) return;

    '<button class="btn ghost sm" id="bkClose">닫기</button></div>';
  $("#bkTa").value = json;

  };

function exportData(){
  const json = JSON.stringify({v:1, prog:S.prog, log:S.log, star:S.star, out:S.out, custom:S.custom, cfg:S.cfg}, null, 1);
  const name = "chaguan-backup-"+today()+".json";
  const embedded = (window.top !== window.self) || !!window.claude;
  if(embedded){ showBackupText(json); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast("백업 파일을 내려받았습니다");
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(o.prog) S.prog=o.prog; if(o.log) S.log=o.log; if(o.star) S.star=o.star;
      if(o.out) S.out=o.out; if(o.custom) S.custom=o.custom; if(o.cfg) S.cfg=Object.assign(S.cfg,o.cfg);
      save(); rebuild(); applyLook(); toast("백업을 불러왔습니다"); render();
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };
  r.readAsText(f);
}

function drill(rows){
  if(!rows.length){ toast("훈련할 항목이 없습니다"); return; }
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 한국어를 보고 먼저 말하기</div><div class="card">'+

  pick.forEach(r=>{
    h += '<div class="keyrow"><div class="k"><b class="blurme">'+esc(r.zh)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.zh)+'">▶</button>'+
         '<span class="py blurme">'+pyHTML(r.py)+'</span></div>'+
         '<div class="m">'+esc(r.ko)+'</div></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 단어장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

const GEN_PROMPT =
`아래 형식에 맞춰 중국어 일상회화 쉐도잉 1회차를 JSON 배열로 만들어 줘.

[학습자]
- 한국인 직장인. 중국어 말하기는 중상급(HSK 5~6 수준). 기본 회화는 되지만 **어른스러운 구어와 관용 표현**이 부족함.
- 목표는 시사·비즈니스 용어가 아니라 **성인의 일상 회화**. 사교·부탁·거절·하소연·협상처럼
  실제 관계 속에서 오가는 말을 늘리는 것.

[조건]
- 두 사람(A/B)이 한 장면에서 나누는 자연스러운 대화 20줄(A/B 번갈아).
- 한 줄은 한자 15~28자. 짧은 초급 문장을 쓰지 말 것.
- 어휘 난이도는 HSK 5~6 중심. 회차마다 성어·관용어를 2~4개, 구어체 표현(别提了/可不是嘛/要我说 등)을 넉넉히 섞을 것.
- 반드시 넣을 문법: 가능보어(V得住/V不了/推不掉), 把자문, 连…都…, A是A可是…, A归A,
  越…越…, 能…则…, 非得…才…, 总不能…吧, 说是这么说 같은 **구어 골격**.
- 소재: (여기에 장면을 적으세요 — 예: 이사 집 보기, 아이 담임과 상담, 중고차 흥정, 회사 동료의 부탁 거절,
  이웃과의 소음 문제, 오랜만에 만난 친구, 명절 친척 모임)
- notes에는 단어 뜻만 쓰지 말고, **비슷한 말과의 차이·언제 쓰면 실례가 되는지·확장형**을 적을 것.
- 병음(py)은 성조 부호를 정확히 넣고, 一/不 성조 변화도 반영할 것(예: yí ge, yìdiǎnr, búcuò).
  儿化는 붙여 쓸 것(diǎnr, xìnr). 병음 음절 수는 한자 수와 일치해야 한다(儿화 제외).
- ck는 끊어 읽기 덩어리다. 한 줄을 2~4덩어리로 나누고, 각 덩어리의 [한자, 병음] 쌍으로 적을 것.
  덩어리를 모두 이으면 원문과 정확히 같아야 한다.
- notes의 k 값은 word / expr / grammar / measure / pron / culture / idiom 중 하나.
- 지어낸 통계·인용은 쓰지 말 것. 일상 장면의 사실적인 대화만.
- 출력은 JSON 배열 하나만. 설명 문장 없이.

[형식]
[{
 "id":"c2d1","day":8,"cat":"장면분류","level":"HSK 5~6",
 "title":"中文标题","titlePy":"zhōngwén biāotí","titleKo":"한국어 제목 — 부제",

    "ck":[["앞 덩어리","pīnyīn"],["뒤 덩어리","pīnyīn"]],
    "notes":[{"t":"표현","p":"pīnyīn","k":"grammar","m":"뜻","tip":"쓰임·주의점"}]}
 ],

    '<div class="row" style="margin-bottom:8px">A(첫 번째 화자) <select id="vA">'+vopt("A")+'</select><button class="btn ghost sm rv" data-t="你好，这是A的声音。">시험 재생</button></div>'+
    '<div class="row">B(두 번째 화자) <select id="vB">'+vopt("B")+'</select><button class="btn ghost sm" id="tB">시험 재생</button></div>'+
    (VOICES.length?'':'<div class="sub" style="margin-top:8px;color:var(--red)">중국어 음성을 찾지 못했습니다. 브라우저를 새로고침하거나 Chrome·Edge에서 열어 보세요.</div>')+'</div>';
  h += '<div class="card"><b>병음 표시</b><div class="sub" style="margin:4px 0 8px">실력이 붙으면 <b>가리기</b>로 바꾸세요. 눌러야 보이므로 한자와 소리를 먼저 떠올리게 됩니다.</div>'+
    '<div class="row">'+
    ["on","blur","off"].map(v=>'<button class="btn '+(S.cfg.py===v?"blue":"ghost")+' sm pyb" data-v="'+v+'">'+
      ({on:"항상 보기",blur:"가리기(눌러서 확인)",off:"완전히 숨기기"})[v]+'</button>').join("")+'</div></div>';
  h += '<div class="card"><b>성조 색</b><div class="sub" style="margin:4px 0 8px">병음에 성조별 색을 입힙니다 — '+
    '<span class="t1">1성</span> · <span class="t2">2성</span> · <span class="t3">3성</span> · <span class="t4">4성</span> · <span class="t0">경성</span></div>'+
    '<div class="row">'+["on","off"].map(v=>'<button class="btn '+(S.cfg.tone===v?"blue":"ghost")+' sm tnb" data-v="'+v+'">'+
      (v==="on"?"색 입히기":"색 없이")+'</button>').join("")+'</div></div>';
  h += '<div class="card"><b>한자 서체</b><div class="sub" style="margin:4px 0 8px">楷体(해서)는 붓글씨에 가까워 획을 익히기 좋고, 黑体(고딕)는 화면에서 또렷합니다.</div>'+
    '<div class="row">'+[["kai","楷体 (해서)"],["hei","黑体 (고딕)"]].map(v=>'<button class="btn '+(S.cfg.han===v[0]?"blue":"ghost")+' sm hnb" data-v="'+v[0]+'">'+v[1]+'</button>').join("")+'</div></div>';
  h += '<div class="card"><b>훈련 설정</b><div class="rule"></div>'+
    '<div class="row" style="margin-bottom:10px">기본 속도 '+speedBar("stSpeed")+'</div>'+
    '<div class="row" style="margin-bottom:10px">문장당 반복 목표 <select id="rp">'+[2,3,5].map(n=>'<option'+(S.cfg.reps===n?" selected":"")+'>'+n+'</option>').join("")+'</select> 회</div>'+
    '<div class="row"><label><input type="checkbox" id="ko"'+(S.cfg.showKo?" checked":"")+'> 한국어 번역을 처음부터 보이기</label></div></div>';
  h += '<div class="card"><b>화면</b><div class="row" style="margin-top:8px"><button class="btn ghost sm" id="th">'+
    (S.cfg.theme==="dark"?"밝은 화면으로":"어두운 화면으로")+'</button></div></div>';
  h += '<div class="card"><b>기록 초기화</b><div class="sub" style="margin:4px 0 8px">모든 학습 기록과 추가한 회차가 지워집니다. 되돌릴 수 없습니다.</div>'+
    '<button class="btn ghost sm" id="reset" style="color:var(--red);border-color:var(--red)">전체 초기화</button></div>';
  h += '<div class="card sub" style="font-size:12.5px"><b>이 앱에 대해</b><br>茶馆 CHÁGUǍN · 데일리 중국어 쉐도잉<br>'+
    '<b>© 2026 곤사마 (Gonsama). All rights reserved.</b><br><br>인터넷 없이 열리지만, '+
    '음성은 컴퓨터에 설치된 중국어 음성을 사용합니다(고품질 온라인 음성은 인터넷이 있을 때 더 잘 나옵니다). '+
    '발음 체크는 Chrome·Edge에서 마이크 권한과 인터넷이 있을 때 동작하며, 글자 인식만 대조할 뿐 성조는 채점하지 못합니다.</div>';
  $("#view-settings").innerHTML = h;
  bindSpeed("stSpeed"); bindPlay();
  $("#vA").onchange = e=>{ S.cfg.voiceA=e.target.value; save(); };
  $("#vB").onchange = e=>{ S.cfg.voiceB=e.target.value; save(); };
  $("#tB").onclick = ()=> speak("你好，这是B的声音。", "B", S.cfg.rate);
  document.querySelectorAll(".pyb").forEach(b=> b.onclick = ()=>{ S.cfg.py=b.dataset.v; save(); applyLook(); renderSettings(); });
  document.querySelectorAll(".tnb").forEach(b=> b.onclick = ()=>{ S.cfg.tone=b.dataset.v; save(); applyLook(); renderSettings(); });
  document.querySelectorAll(".hnb").forEach(b=> b.onclick = ()=>{ S.cfg.han=b.dataset.v; save(); applyLook(); renderSettings(); });
  $("#rp").onchange = e=>{ S.cfg.reps=+e.target.value; save(); };
  $("#ko").onchange = e=>{ S.cfg.showKo=e.target.checked; save(); };
  $("#th").onclick = ()=>{ S.cfg.theme = S.cfg.theme==="dark"?"light":"dark"; save(); applyLook(); renderSettings(); };
  $("#reset").onclick = ()=>{
    if(confirm("모든 기록을 지웁니다. 계속할까요?")){
      S.prog={}; S.log={}; S.star={}; S.out={}; S.custom=[]; save(); rebuild(); toast("초기화했습니다"); go("home");
    }
  };
}
function applyLook(){
  const r = document.documentElement;
  let t = S.cfg.theme;
  if(t!=="dark" && t!=="light")
    t = (function(){ var h = r.getAttribute("data-theme"); if(h==="dark"||h==="light") return h;
      return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; })();
  r.setAttribute("data-theme", t);
  r.setAttribute("data-py", S.cfg.py||"on");
  r.setAttribute("data-tone", S.cfg.tone||"on");
  r.setAttribute("data-han", S.cfg.han||"kai");
}

/* ---------- 시작 ---------- */
applyLook();
render();
</script>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>茶馆 CHÁGUǍN</title>
<style>
:root{
  --paper:#f7f5ef; --card:#fffdf9; --line:#e0d9c9; --ink:#1d1c19; --sub:#6f6a5f;
  --accent:#2f5d8c; --accent-soft:#dde7f0; --red:#b0462f; --red-soft:#f2e0da;
  --ok:#2f6b4f; --radius:14px;
  --t1:#c0392b; --t2:#b9770e; --t3:#2e7d5b; --t4:#3a5fa8; --t0:#8c857a;
  --han:"KaiTi","楷体","STKaiti","Kaiti SC","Microsoft YaHei","맑은 고딕",serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",Roboto,sans-serif;
  --pyf:"Segoe UI","Lucida Sans Unicode",Tahoma,sans-serif;
}
html[data-han="hei"]{ --han:"Microsoft YaHei","微软雅黑","PingFang SC","Malgun Gothic",sans-serif; }
html[data-theme="dark"]{
  --paper:#16181a; --card:#1d2023; --line:#2f343a; --ink:#e9e6de; --sub:#9a948a;
  --accent:#8fbde0; --accent-soft:#1f2d38; --red:#e0836b; --red-soft:#37231e;
  --ok:#6fbf94;
  --t1:#ef7d70; --t2:#e0ac54; --t3:#63c79b; --t4:#89aaf0; --t0:#9a948a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}

.byline{background:var(--paper);border-bottom:1px solid var(--line)}
.bylinein{max-width:860px;margin:0 auto;padding:9px 16px 8px;font-size:12.5px;font-weight:700;
  line-height:1.7;color:var(--accent);letter-spacing:.01em}
.bylinein .c{letter-spacing:.16em;margin-right:8px}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--han);font-size:22px;letter-spacing:.10em;font-weight:600}
.brand em{font-family:var(--pyf);font-style:normal;font-size:13px;letter-spacing:.18em;color:var(--accent);margin-left:7px}
.brand i{display:block;font-family:var(--sans);font-style:normal;font-size:11px;
  letter-spacing:.02em;color:var(--sub);margin-top:1px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;padding:6px 11px;border-radius:999px;
  cursor:pointer;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.hd{font-family:var(--han);font-size:23px;margin:26px 0 2px;line-height:1.3}
.hd small{display:block;font-family:var(--serif);font-size:11.5px;color:var(--sub);
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--sub);font-size:13.5px}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.87}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--accent);color:#fff}
html[data-theme="dark"] .btn.blue{color:#12171c}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.r{background:var(--red-soft);color:var(--red)}
.muted{color:var(--sub)}

/* ---- 한자 / 병음 ---- */
.hz{font-family:var(--han)}
.py{font-family:var(--pyf);letter-spacing:.01em}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t0{color:var(--t0)}
html[data-tone="off"] .t1,html[data-tone="off"] .t2,html[data-tone="off"] .t3,
html[data-tone="off"] .t4,html[data-tone="off"] .t0{color:inherit}
html[data-py="blur"] .py{filter:blur(4px);cursor:pointer}
html[data-py="blur"] .py.show{filter:none}
html[data-py="off"] .py{display:none}

.today{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.today h2{font-family:var(--han);font-size:30px;margin:8px 0 2px;line-height:1.25;letter-spacing:.03em}
.today .tpy{font-family:var(--pyf);font-size:13.5px;color:var(--sub)}
.today .kotitle{color:var(--sub);font-size:14px;margin:6px 0 14px}
.streak{display:flex;gap:18px;margin:14px 0 0;flex-wrap:wrap}
.streak div{text-align:center}
.streak b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.streak span{font-size:11.5px;color:var(--sub)}
.dlist{display:grid;gap:8px;margin-top:10px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.ditem:hover{border-color:var(--accent)}
.ditem .num{font-family:var(--serif);font-size:16px;width:26px;color:var(--sub);flex:none}
.ditem .t{flex:1;min-width:0}
.ditem .t b{display:block;font-size:17px;font-weight:600;font-family:var(--han);letter-spacing:.02em}
.ditem .t span{font-size:12px;color:var(--sub)}
.ditem .done{color:var(--ok);font-size:12px;font-weight:700;flex:none}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.past{background:var(--ok)}
.sesshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.clock{font-family:var(--serif);font-size:19px;margin-left:auto;letter-spacing:.04em}
.clock.over{color:var(--red)}
.stepname{font-size:13px;font-weight:700}
.stepname em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}

.brief li{margin:7px 0}
.brief b{color:var(--accent)}
.vrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.vrow:last-child{border:none}
.vrow .w{flex:none;min-width:150px}
.vrow .w b{font-family:var(--han);font-size:21px;letter-spacing:.02em}
.vrow .w .py{display:block;font-size:12px}
.vrow .m{font-size:13.5px;flex:1;min-width:120px}
.vrow .lv{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 7px;flex:none}
.keyrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.keyrow:last-child{border:none}
.keyrow .k{flex:none;min-width:170px}
.keyrow .k b{font-family:var(--han);font-size:20px}
.keyrow .k .py{display:block;font-size:12px}
.keyrow .m{font-size:13.5px;color:var(--sub);flex:1;min-width:140px}
.keyrow .ex{display:block;font-family:var(--han);font-size:16px;color:var(--ink);margin-top:3px}
.keyrow .exko{display:block;font-size:12px;color:var(--sub)}

.sline{display:flex;gap:10px;padding:8px 10px;border-radius:9px;margin:2px 0;cursor:pointer}
.sline.now{background:var(--accent-soft)}
.sline .sp{font-family:var(--serif);font-weight:700;flex:none;width:20px;color:var(--accent)}
.sline.b .sp{color:var(--red)}
.sline .zh{font-family:var(--han);font-size:20px;line-height:1.5;letter-spacing:.02em}
.sline .py{display:block;font-size:12px;margin-top:1px}
.sline .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}

.shadowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:12px 0}
.who{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.who.b{color:var(--red)}
.bigzh{font-family:var(--han);font-size:clamp(26px,6.4vw,40px);line-height:1.45;margin:10px 0 2px;letter-spacing:.03em}
.bigpy{font-family:var(--pyf);font-size:clamp(14px,3vw,17px);margin-bottom:6px}
.chunks{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px}
.chunk{padding:7px 12px;border-left:3px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.chunk:hover{background:var(--paper)}
.chunk.on{border-left-color:var(--accent);background:var(--accent-soft)}
.chunk .zh{font-family:var(--han);font-size:clamp(20px,4.4vw,25px);letter-spacing:.03em}
.chunk .py{display:block;font-size:12.5px}
.bigko{font-size:14px;color:var(--sub);margin-top:8px}
.blurme{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.blurme.show{filter:none;cursor:auto}
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.note{margin:9px 0;font-size:13.5px}
.note b{font-family:var(--han);font-size:18px}
.note .np{font-family:var(--pyf);font-size:12px;color:var(--sub);margin-left:5px}
.note .k{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);margin-left:6px;font-weight:700;vertical-align:2px}
.note .tip{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.counter{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.speedbar{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.speedbar button{border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer}
.speedbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.qbox{margin:16px 0}
.qbox .q{font-size:15px;margin-bottom:2px;font-weight:600}
.qbox .hint{font-size:12.5px;color:var(--sub)}
.qbox .hint b{font-family:var(--han);font-size:16px;color:var(--ink);font-weight:400}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;max-width:100%}

.rp{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin:6px 0;align-items:flex-start}
.rp.mine{background:var(--accent-soft);border:1px dashed var(--accent)}
.rp.now{outline:2px solid var(--accent)}
.rp .sp{font-weight:700;flex:none;width:22px;color:var(--sub)}
.rp .zh{font-family:var(--han);font-size:19px}
.rp .py{display:block;font-size:11.5px}
.rp .ko{display:block;font-size:12px;color:var(--sub)}

.copy{display:flex;gap:14px;align-items:flex-start;border-color:var(--red)}
.copy .seal{flex:none;width:54px;height:54px;border:2px solid var(--red);color:var(--red);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-family:var(--han);font-size:21px;letter-spacing:.02em}
.copy .ct b{font-family:var(--pyf);letter-spacing:.06em;font-size:15px}
.copy .ct .r{color:var(--red);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:10.5px;color:var(--sub)}
.cal div.done{background:var(--accent);color:#fff;font-weight:700}
.histrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.histrow b{font-family:var(--serif);font-size:15px}
.bankrow{padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow b{font-family:var(--han);font-size:21px}
.bankrow .m{font-size:13px;color:var(--sub)}
.bankrow .ex{font-family:var(--han);font-size:16px;color:var(--sub)}
.star{cursor:pointer;float:right;font-size:15px;opacity:.28}
.star.on{opacity:1}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px;z-index:30;display:none}
.footbar.on{display:block}
.footin{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.credit{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:11.5px;color:var(--sub);
  letter-spacing:.02em;text-align:center;opacity:.8}
.credit b{font-family:var(--serif);font-weight:600;letter-spacing:.06em}
@media(max-width:560px){
  .vrow,.keyrow{flex-direction:column;gap:2px}
  .vrow .w,.keyrow .k{min-width:0}
  .brand i{display:none}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181a; --card:#1d2023; --line:#2f343a; --ink:#e9e6de; --sub:#9a948a;
    --accent:#8fbde0; --accent-soft:#1f2d38; --red:#e0836b; --red-soft:#37231e;
    --ok:#6fbf94;
    --t1:#ef7d70; --t2:#e0ac54; --t3:#63c79b; --t4:#89aaf0; --t0:#9a948a;
  }
  :root:not([data-theme="light"]) .btn.blue{color:#12171c}
}
@media (prefers-reduced-motion: reduce){
  .view{animation:none}
  .blurme,.btn{transition:none}
}

/* ---- 앱으로 설치하기 ---- */
.instbtn{background:var(--accent);color:var(--paper);border:none;padding:6px 12px;
  border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.instbtn[hidden]{display:none}
@media(max-width:560px){ .instbtn{margin-left:auto} }

#openChrome{position:fixed;inset:auto 12px 12px;max-width:520px;margin:0 auto;z-index:60;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--accent);color:var(--paper);border-radius:14px;padding:16px 18px;
  box-shadow:0 12px 40px -8px rgba(0,0,0,.45)}
#openChrome[hidden]{display:none}   /* display:flex가 hidden 속성을 이기므로 명시한다 */
#openChrome .oc-body{flex:1 1 240px;font-size:13.5px;line-height:1.7}
#openChrome .oc-body b{display:block;font-size:15px;margin-bottom:3px}
#openChrome .oc-body span{opacity:.9}
#openChrome button{border:none;border-radius:9px;padding:10px 16px;cursor:pointer;
  font-weight:700;font-size:14px;background:var(--paper);color:var(--accent)}
#openChrome button.ghost{background:transparent;color:inherit;font-weight:400;opacity:.85;padding:10px 8px}

#installNote{position:fixed;inset:auto 16px 16px;max-width:460px;margin:0 auto;z-index:50;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:0 12px 40px -8px rgba(0,0,0,.4)}
#installNote h5{margin:0 0 10px;font-size:15px}
#installNote p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.8}
#installNote ol{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--sub);line-height:1.95}
#installNote ol li{margin-bottom:3px}
#installNote b{color:var(--ink)}
#installNote button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13.5px}
#installNote .inst-btns{display:flex;gap:8px;flex-wrap:wrap}
#installNote #installNow{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
</style>

<script>
const CONTENT_BUILTIN = [
{
 id:"c1d1", day:1, cat:"회식·술자리", level:"HSK 5~6",
 title:"饭局", titlePy:"fànjú", titleKo:"술자리 — 권하고, 사양하고, 계산을 다투기",
 names:{A:"志勋 (한국 측)", B:"老周 (중국 측 거래처)"},
 brief:[
  "중국에서 <b>饭局(fànjú)</b>은 단순한 식사가 아니라 관계를 만드는 자리입니다. 계산을 서로 하겠다고 다투는 것은 실랑이가 아니라 <b>예의의 절차</b>입니다. 한 번에 물러서면 오히려 성의가 없어 보입니다.",
  "핵심은 <b>见外(jiànwài, 남처럼 굴다)</b>와 <b>做东(zuòdōng, 내가 자리를 내다)</b> 두 단어입니다. 「您太见外了」로 상대의 호의를 받아치고, 「改天我做东」으로 다음을 기약하면 대화가 완성됩니다.",
  "술은 거절하는 것이 아니라 <b>조절</b>하는 것입니다. 「我酒量一般，悠着点儿(살살 하겠습니다)」처럼 말하면 분위기를 깨지 않으면서 빠져나올 수 있습니다.",
  "이 회차에는 <b>说什么也得… / 可不是嘛 / 还不如 / 图的是… / 光…就…</b> 같은 구어 골격이 들어 있습니다. 단어를 늘리는 것보다 이 골격을 통째로 입에 붙이는 편이 훨씬 빠릅니다."

 lines:[
  {s:"B",zh:"来来来，别客气，今天这顿说什么也得我来。",py:"Lái lái lái, bié kèqi, jīntiān zhè dùn shuō shénme yě děi wǒ lái.",
   ko:"자자, 사양 마세요, 오늘 이 자리는 무슨 일이 있어도 제가 냅니다.",
   ck:[["来来来，别客气","lái lái lái, bié kèqi"],["今天这顿","jīntiān zhè dùn"],["说什么也得我来","shuō shénme yě děi wǒ lái"]],
   notes:[{t:"说什么也得…",p:"shuō shénme yě děi…",k:"expr",m:"무슨 일이 있어도 ~해야 한다",tip:"무조건이라는 뜻의 구어 골격입니다. 说什么也不能答应 = 절대 승낙할 수 없다."},
          {t:"顿",p:"dùn",k:"measure",m:"끼니를 세는 양사",tip:"一顿饭 / 三顿 / 请你吃顿饭. 식사에는 次가 아니라 顿을 씁니다."}]},
  {s:"A",zh:"老周，您太见外了，上回就是您结的账。",py:"Lǎo Zhōu, nín tài jiànwài le, shàng huí jiùshì nín jié de zhàng.",
   ko:"저우 선생님, 너무 남처럼 대하시네요, 지난번에도 선생님이 계산하셨잖아요.",
   ck:[["老周，您太见外了","Lǎo Zhōu, nín tài jiànwài le"],["上回就是您结的账","shàng huí jiùshì nín jié de zhàng"]],
   notes:[{t:"见外",p:"jiànwài",k:"expr",m:"남처럼 굴다",tip:"상대의 지나친 배려를 부드럽게 막는 말입니다. 你太见外了 한마디면 [우리 사이에 뭘] 이라는 뜻이 됩니다."},
          {t:"是…的",p:"shì…de",k:"grammar",m:"이미 일어난 일의 주체·시간·방법을 강조",tip:"就是您结的账 = 계산한 사람은 다름 아닌 당신이었다. 结账을 떼어 结的账으로 쓰는 점에 주의하세요."}]},
  {s:"B",zh:"那不一样，上回是公事，今天纯粹是朋友聚聚。",py:"Nà bù yíyàng, shàng huí shì gōngshì, jīntiān chúncuì shì péngyou jùju.",
   ko:"그건 다르죠, 지난번은 업무였고 오늘은 순전히 친구끼리 모이는 겁니다.",
   ck:[["那不一样","nà bù yíyàng"],["上回是公事","shàng huí shì gōngshì"],["今天纯粹是朋友聚聚","jīntiān chúncuì shì péngyou jùju"]],
   notes:[{t:"纯粹",p:"chúncuì",k:"word",m:"순전히, 오로지",tip:"부사로 쓰면 只是보다 단호합니다. 纯粹是浪费时间 = 순전히 시간 낭비다."},
          {t:"聚聚",p:"jùju",k:"grammar",m:"모이다 (동사 중첩)",tip:"聚会를 가볍게 만든 형태. 找机会聚聚 = 기회 봐서 한번 모이자."}]},
  {s:"A",zh:"那我也不跟您争了，改天我在首尔做东。",py:"Nà wǒ yě bù gēn nín zhēng le, gǎitiān wǒ zài Shǒu'ěr zuòdōng.",
   ko:"그럼 더 다투지 않겠습니다, 다음에 서울에서 제가 대접하죠.",
   ck:[["那我也不跟您争了","nà wǒ yě bù gēn nín zhēng le"],["改天我在首尔做东","gǎitiān wǒ zài Shǒu'ěr zuòdōng"]],
   notes:[{t:"做东",p:"zuòdōng",k:"culture",m:"주인 노릇을 하다, 한턱내다",tip:"请客보다 격이 있습니다. 계산 다툼을 마무리하는 정답에 가까운 문장입니다."},

  {s:"B",zh:"一言为定。来，先走一个，祝合作顺利。",py:"Yì yán wéi dìng. Lái, xiān zǒu yí ge, zhù hézuò shùnlì.",

          {t:"走一个",p:"zǒu yí ge",k:"culture",m:"한 잔 하다",tip:"술자리 전용 구어입니다. 咱们走一个 = 우리 한 잔 합시다."}]},
  {s:"A",zh:"干杯。不过我酒量实在一般，一会儿得悠着点儿。",py:"Gānbēi. Búguò wǒ jiǔliàng shízài yìbān, yíhuìr děi yōu zhe diǎnr.",

          {t:"实在",p:"shízài",k:"word",m:"정말이지, 참으로",tip:"真的보다 무게가 있습니다. 实在不好意思 / 实在没办法."}]},
  {s:"B",zh:"理解，能喝多少喝多少，咱们重在气氛。",py:"Lǐjiě, néng hē duōshao hē duōshao, zánmen zhòng zài qìfēn.",

   ck:[["理解","lǐjiě"],["能喝多少喝多少","néng hē duōshao hē duōshao"],["咱们重在气氛","zánmen zhòng zài qìfēn"]],
   notes:[{t:"能…多少…多少",p:"néng…duōshao…duōshao",k:"grammar",m:"~할 수 있는 만큼 ~하다",tip:"같은 의문사를 두 번 써서 [되는 만큼]을 만듭니다. 能做多少做多少 = 할 수 있는 만큼만 하세요."},

  {s:"A",zh:"这道菜叫什么？我在韩国还真没见过。",py:"Zhè dào cài jiào shénme? Wǒ zài Hánguó hái zhēn méi jiàn guo.",

  {s:"B",zh:"这叫毛血旺，看着吓人，其实一点儿也不腻。",py:"Zhè jiào máoxuèwàng, kàn zhe xiàrén, qíshí yìdiǎnr yě bú nì.",

  {s:"A",zh:"那我尝尝。麻是麻，可是越吃越上瘾。",py:"Nà wǒ chángchang. Má shì má, kěshì yuè chī yuè shàngyǐn.",

          {t:"…的就是个…",p:"…de jiùshì ge…",k:"grammar",m:"~하는 건 바로 ~다",tip:"강조 구문에 个를 넣는 것이 구어체의 맛입니다. 图的就是个方便."}]},

          {t:"下馆子",p:"xià guǎnzi",k:"expr",m:"외식하다",tip:"在外面吃饭의 구어체. 馆子는 식당의 옛 구어입니다."}]},
  {s:"B",zh:"可不是嘛，家里做一顿又累又麻烦，还不如出来。",py:"Kě bú shì ma, jiā li zuò yí dùn yòu lèi yòu máfan, hái bùrú chūlái.",

 brief:[
  "기사에게 <b>돌아가는 것 아니냐</b>고 묻는 것은 사실상 의심을 표현하는 것입니다. 중국어에서는 이럴 때 직접 따지지 않고 <b>사실 확인의 형식</b>을 빌립니다 — 「是不是往东偏得有点儿远了？」",
  "상대가 이유를 설명하면 <b>是我多心了(제가 괜히 의심했네요)</b>로 물러서는 것이 정석입니다. 이 한마디가 분위기를 되돌립니다. 상대는 <b>哪儿的话(무슨 말씀을요)</b>로 받습니다.",
  "기사와의 잡담은 <b>일 → 건강 → 위로</b> 순서로 흘러갑니다. 이때 쓰이는 <b>忙归忙(바쁜 건 바쁜 거고) · 身体是本钱(몸이 밑천이다)</b> 같은 표현은 회사 대화에도 그대로 옮겨 쓸 수 있습니다.",
  "이 회차의 문법 축은 <b>只要…就… / A归A / 扛得住 / 不等于</b>입니다. 특히 <b>V得住·V不住</b>는 체력·상황을 말할 때 원어민이 즐겨 쓰는 형식입니다."

 brief:[
  "검진 상담에서 가장 많이 듣는 말이 <b>够不上…(아직 ~할 정도는 아니다)</b>입니다. 「够不上吃药」는 [약을 먹을 단계까지는 아니다]라는 뜻으로, 안심과 경고를 동시에 담습니다.",
  "직장인의 최대 변수는 <b>应酬(yìngchou, 접대 자리)</b>입니다. 「推不掉(거절할 수 없다)」와 「能少则少(가능한 한 줄이다)」를 짝으로 알아 두면 이 주제를 끝까지 끌고 갈 수 있습니다.",
  "중국 의사·어른들은 습관 이야기를 할 때 속담을 즐겨 씁니다. <b>三天打鱼两天晒网</b>은 [작심삼일], <b>风雨无阻</b>는 [비가 오나 눈이 오나]입니다.",
  "이 회차의 문법 축은 <b>能…则… / 非得…才… / 比…重要得多 / 把…压下去</b>입니다. 수치와 변화를 말하는 문형이라 업무 보고에도 그대로 쓸 수 있습니다."

 brief:[
  "중국어에서 부탁은 <b>본론을 바로 꺼내지 않습니다.</b> 먼저 「有件事想请你帮个忙，不知道方不方便」처럼 <b>상대가 거절할 여지</b>를 만들어 두고 시작합니다. 이 예열이 없으면 부담을 떠넘기는 말이 됩니다.",
  "부탁받은 쪽은 <b>不好说 / 不归我管 / 不敢保证</b>으로 기대치를 낮춥니다. 이건 거절이 아니라 <b>안전장치</b>입니다. 이 말을 거절로 오해하면 대화가 끊깁니다.",
  "핵심 개념은 <b>人情(rénqíng)</b>입니다. 「人情用一次少一次」— 부탁은 쓸수록 줄어드는 자산이라는 감각이 깔려 있습니다. 그래서 부탁 전에 망설이고(犹豫), 부탁 후에 갚습니다(下次换我).",
  "<b>走后门(연줄로 처리하다)</b>은 부정적인 말입니다. 그래서 A는 먼저 「我不是让你走后门」이라고 선을 긋습니다. 이 한마디가 부탁의 격을 지켜 줍니다."
 ],

 brief:[
  "중국어 클레임의 원칙은 <b>사실 → 영향 → 요구</b> 순서입니다. 감정을 앞세우면 상대가 방어에 들어가고, 사실부터 깔면 상대가 해결책을 내놓습니다.",

  "마무리는 <b>我也不是要为难谁(누굴 곤란하게 하려는 게 아닙니다)</b>가 좋습니다. 요구는 관철하면서 관계는 남기는, 가장 어른스러운 문장입니다."

 title:"楼上的动静", titlePy:"lóushàng de dòngjing", titleKo:"위층의 소음 — 얼굴 붉히지 않고 항의하기",
 names:{A:"小林 (아래층)", B:"张姐 (위층 이웃)"},
 brief:[
  "층간 소음은 옳고 그름을 가리는 문제가 아니라 <b>관계를 남기면서 요구를 관철하는</b> 문제입니다. 중국에서도 여기서 말을 잘못 꺼내면 그날로 원수가 됩니다. 그래서 첫 문장이 거의 전부입니다.",
  "핵심 장치는 <b>부정 + 재규정</b>입니다. 「不是嫌，就是…(싫다는 게 아니라 다만 ~)」처럼 상대가 들을 비난을 먼저 지워 놓고 요구를 꺼냅니다. 그다음 <b>将心比心(입장을 바꿔 생각하다)</b>으로 같은 편에 서 버립니다.",
  "중국인이 이런 자리에서 자주 쓰는 말이 <b>抬头不见低头见</b>입니다. 「고개를 들어도 숙여도 마주치는 사이」라는 뜻으로, 오래 볼 사이니 좋게 끝내자는 신호입니다. <b>得饶人处且饶人</b>도 같은 자리에서 나옵니다.",
  "이 회차에는 가능보어가 특히 많이 들어 있습니다. <b>睡不着 · 坐不住 · 拦不住 · 受得了</b>. 「할 수 있다/없다」를 조동사가 아니라 동사 뒤에 붙여 말하는 이 감각이 붙으면 회화가 단번에 어른스러워집니다."

          {t:"拦不住",p:"lán bu zhù",k:"grammar",m:"말릴 수 없다",tip:"V不住는 '붙잡아 두지 못한다'는 계열입니다. 坐不住 / 记不住 / 忍不住."}]},
  {s:"A",zh:"我理解，将心比心，我也带过孩子，可总不能天天到半夜吧。",py:"Wǒ lǐjiě, jiāng xīn bǐ xīn, wǒ yě dài guo háizi, kě zǒng bù néng tiāntiān dào bànyè ba.",
   ko:"이해해요, 저도 애 키워 봤으니 입장 바꿔 생각하죠. 그래도 매일 한밤중까지는 좀 그렇잖아요.",
   ck:[["我理解，将心比心","Wǒ lǐjiě, jiāng xīn bǐ xīn"],["我也带过孩子","wǒ yě dài guo háizi"],["可总不能天天到半夜吧","kě zǒng bù néng tiāntiān dào bànyè ba"]],
   notes:[{t:"将心比心",p:"jiāng xīn bǐ xīn",k:"idiom",m:"입장을 바꿔 생각하다",tip:"이 말 한마디로 '나는 당신 편'이라는 신호가 됩니다. 항의를 부드럽게 만드는 성어입니다."},
          {t:"总不能…吧",p:"zǒng bù néng…ba",k:"expr",m:"설마 ~할 수는 없잖아요",tip:"직접 요구하지 않고 상대가 스스로 결론 내게 만드는 골격입니다. 아주 자주 씁니다."}]},
  {s:"B",zh:"那你说怎么办？我总不能把孩子绑起来吧，他也不是故意的。",py:"Nà nǐ shuō zěnme bàn? Wǒ zǒng bù néng bǎ háizi bǎng qǐlái ba, tā yě bú shì gùyì de.",
   ko:"그럼 어쩌라고? 애를 묶어 둘 수도 없잖아, 일부러 그러는 것도 아니고.",
   ck:[["那你说怎么办","Nà nǐ shuō zěnme bàn"],["我总不能把孩子绑起来吧","wǒ zǒng bù néng bǎ háizi bǎng qǐlái ba"],["他也不是故意的","tā yě bú shì gùyì de"]],
   notes:[{t:"把…绑起来",p:"bǎ…bǎng qǐlái",k:"grammar",m:"~을 묶어 놓다",tip:"把자문 + 방향보어 起来. 把书收起来 / 把窗户关起来처럼 처리 결과를 말합니다."},
          {t:"不是故意的",p:"bú shì gùyì de",k:"expr",m:"일부러 그런 게 아니다",tip:"변명의 정형구입니다. 我不是故意的는 사과할 때도 그대로 씁니다."}]},
  {s:"A",zh:"我不是来吵架的，就是想商量个办法，咱们楼上楼下抬头不见低头见。",py:"Wǒ bú shì lái chǎojià de, jiùshì xiǎng shāngliang ge bànfǎ, zánmen lóushàng lóuxià táitóu bú jiàn dītóu jiàn.",
   ko:"싸우러 온 게 아니라 방법을 좀 의논하고 싶어서요. 위아래층이라 늘 마주칠 사이잖아요.",
   ck:[["我不是来吵架的","Wǒ bú shì lái chǎojià de"],["就是想商量个办法","jiùshì xiǎng shāngliang ge bànfǎ"],["咱们楼上楼下抬头不见低头见","zánmen lóushàng lóuxià táitóu bú jiàn dītóu jiàn"]],
   notes:[{t:"抬头不见低头见",p:"táitóu bú jiàn dītóu jiàn",k:"idiom",m:"고개를 들어도 숙여도 마주치는 사이다",tip:"이웃·같은 부서 사람에게 쓰는 화해의 신호입니다. '오래 볼 사이니 좋게 가자'는 뜻."},
          {t:"商量个办法",p:"shāngliang ge bànfǎ",k:"expr",m:"방법을 좀 의논하다",tip:"동사 뒤 个는 어투를 가볍게 만듭니다. 说个话 / 见个面처럼."}]},
  {s:"B",zh:"这话在理。要我说，铺个地垫应该能管点用，就是有点费钱。",py:"Zhè huà zài lǐ. Yào wǒ shuō, pū ge dìdiàn yīnggāi néng guǎn diǎn yòng, jiùshì yǒudiǎn fèi qián.",
   ko:"그 말은 맞네. 내 생각엔 매트를 깔면 좀 효과가 있을 것 같은데, 돈이 좀 든다는 게 문제지.",
   ck:[["这话在理","Zhè huà zài lǐ"],["要我说，铺个地垫应该能管点用","Yào wǒ shuō, pū ge dìdiàn yīnggāi néng guǎn diǎn yòng"],["就是有点费钱","jiùshì yǒudiǎn fèi qián"]],
   notes:[{t:"要我说",p:"yào wǒ shuō",k:"expr",m:"내 생각을 말하자면",tip:"我觉得보다 구어적이고 사람 냄새가 납니다. 문장 맨 앞에 던지세요."},
          {t:"管用",p:"guǎnyòng",k:"word",m:"효과가 있다, 먹히다",tip:"有效보다 훨씬 입말입니다. 这药挺管用 / 说了也不管用."},
          {t:"就是…",p:"jiùshì…",k:"expr",m:"다만 ~이라는 게 문제다",tip:"칭찬 뒤에 붙는 단서. 挺好的，就是贵了点."}]},
  {s:"A",zh:"费钱归费钱，可比起天天为这事儿闹别扭，还是值的。",py:"Fèi qián guī fèi qián, kě bǐqǐ tiāntiān wèi zhè shìr nào bièniu, háishi zhí de.",
   ko:"돈이 드는 건 드는 거지만, 매일 이 일로 서먹해지는 것보다야 그게 낫죠.",
   ck:[["费钱归费钱","Fèi qián guī fèi qián"],["可比起天天为这事儿闹别扭","kě bǐqǐ tiāntiān wèi zhè shìr nào bièniu"],["还是值的","háishi zhí de"]],
   notes:[{t:"A归A",p:"A guī A",k:"grammar",m:"A는 A대로 인정하되, 그것과 별개로",tip:"이 회차의 필수 골격입니다. 说归说，做归做 = 말은 말이고 행동은 행동이다."},
          {t:"闹别扭",p:"nào bièniu",k:"word",m:"틀어지다, 삐치다",tip:"싸움까지는 아니고 서먹해진 상태입니다. 两个人闹别扭好几天了."}]},
  {s:"B",zh:"说得也是。那这样，我明天就去买，晚上再让他早点写完作业。",py:"Shuō de yě shì. Nà zhèyàng, wǒ míngtiān jiù qù mǎi, wǎnshang zài ràng tā zǎodiǎn xiě wán zuòyè.",
   ko:"그 말도 맞네. 그럼 이렇게 하자, 내일 사러 갈게. 저녁엔 애한테 숙제 좀 일찍 끝내라고 하고.",
   ck:[["说得也是","Shuō de yě shì"],["那这样，我明天就去买","Nà zhèyàng, wǒ míngtiān jiù qù mǎi"],["晚上再让他早点写完作业","wǎnshang zài ràng tā zǎodiǎn xiě wán zuòyè"]],
   notes:[{t:"那这样",p:"nà zhèyàng",k:"expr",m:"그럼 이렇게 하죠",tip:"합의안을 꺼내기 직전의 신호탄입니다. 협상 대화에서 매우 자주 나옵니다."},
          {t:"写完",p:"xiě wán",k:"grammar",m:"다 쓰다 (결과보어)",tip:"完은 '끝까지'를 뜻합니다. 吃完 / 看完 / 说完. 写好와는 뉘앙스가 다릅니다."}]},
  {s:"A",zh:"那太好了。其实也不用完全没声音，过了十点小声点就行。",py:"Nà tài hǎo le. Qíshí yě búyòng wánquán méi shēngyīn, guò le shí diǎn xiǎoshēng diǎn jiù xíng.",
   ko:"정말 감사해요. 사실 완전히 조용할 필요는 없고, 열 시 넘어서만 좀 작게 해 주시면 돼요.",
   ck:[["那太好了","Nà tài hǎo le"],["其实也不用完全没声音","Qíshí yě búyòng wánquán méi shēngyīn"],["过了十点小声点就行","guò le shí diǎn xiǎoshēng diǎn jiù xíng"]],
   notes:[{t:"…就行",p:"…jiù xíng",k:"expr",m:"~해 주시기만 하면 됩니다",tip:"요구의 문턱을 낮춰 상대가 받아들이기 쉽게 만듭니다. 打个电话就行."},
          {t:"不用",p:"búyòng",k:"word",m:"~할 필요 없다",tip:"不要(하지 마라)와 다릅니다. 不用客气 / 不用等我."}]},
  {s:"B",zh:"你这么一说我心里舒服多了，我还以为你要去物业投诉呢。",py:"Nǐ zhème yì shuō wǒ xīnli shūfu duō le, wǒ hái yǐwéi nǐ yào qù wùyè tóusù ne.",
   ko:"그렇게 말해 주니 마음이 한결 편하네. 난 또 관리실에 민원 넣으러 가는 줄 알았지.",
   ck:[["你这么一说我心里舒服多了","Nǐ zhème yì shuō wǒ xīnli shūfu duō le"],["我还以为你要去物业投诉呢","wǒ hái yǐwéi nǐ yào qù wùyè tóusù ne"]],
   notes:[{t:"还以为",p:"hái yǐwéi",k:"expr",m:"~인 줄로만 알았다 (사실은 아니었다)",tip:"以为는 언제나 '틀린 짐작'입니다. 还를 붙이면 안도의 어감이 얹힙니다."},
          {t:"这么一说",p:"zhème yì shuō",k:"grammar",m:"그렇게 말하고 나니",tip:"이 골격은 대화의 분위기가 바뀌는 지점에 놓입니다. 你这么一说我就明白了."}]},
  {s:"A",zh:"投诉多难看啊，能私下说开则私下说开，何必闹到那一步。",py:"Tóusù duō nánkàn a, néng sīxià shuō kāi zé sīxià shuō kāi, hébì nào dào nà yí bù.",
   ko:"민원은 모양새가 안 좋잖아요. 조용히 풀 수 있으면 조용히 푸는 게 낫지, 굳이 거기까지 갈 필요 있나요.",
   ck:[["投诉多难看啊","Tóusù duō nánkàn a"],["能私下说开则私下说开","néng sīxià shuō kāi zé sīxià shuō kāi"],["何必闹到那一步","hébì nào dào nà yí bù"]],
   notes:[{t:"能…则…",p:"néng…zé…",k:"grammar",m:"~할 수 있으면 ~하는 게 낫다",tip:"문어에서 온 골격이라 말에 무게가 실립니다. 能省则省 = 아낄 수 있으면 아낀다."},
          {t:"何必",p:"hébì",k:"word",m:"굳이 ~할 필요가 있나",tip:"반문으로 상대를 설득합니다. 何必这么客气 / 何必跟他计较."},
          {t:"说开",p:"shuō kāi",k:"word",m:"터놓고 말해 오해를 풀다",tip:"说清楚가 사실 정리라면 说开는 감정까지 푸는 것입니다."}]},
  {s:"B",zh:"就是。有的邻居一上来就砸门，那谁受得了，火气全上来了。",py:"Jiùshì. Yǒude línjū yí shànglái jiù zá mén, nà shéi shòu de liǎo, huǒqì quán shànglái le.",
   ko:"그러게. 어떤 이웃은 다짜고짜 문을 두드리는데, 그걸 누가 견뎌. 화가 확 치밀지.",
   ck:[["就是","Jiùshì"],["有的邻居一上来就砸门","Yǒude línjū yí shànglái jiù zá mén"],["那谁受得了，火气全上来了","nà shéi shòu de liǎo, huǒqì quán shànglái le"]],
   notes:[{t:"受得了",p:"shòu de liǎo",k:"grammar",m:"견뎌 낼 수 있다",tip:"가능보어의 긍정형입니다. 부정형 受不了가 훨씬 자주 쓰이니 짝으로 외우세요."},
          {t:"火气上来了",p:"huǒqì shànglái le",k:"expr",m:"화가 치밀어 올랐다",tip:"生气보다 몸의 반응에 가깝습니다. 压住火气 = 화를 눌러 참다."}]},
  {s:"A",zh:"可不是嘛。人越吵越僵，最后连招呼都不打了，多别扭。",py:"Kě bú shì ma. Rén yuè chǎo yuè jiāng, zuìhòu lián zhāohu dōu bù dǎ le, duō bièniu.",
   ko:"그러니까요. 싸울수록 더 굳어지고, 나중엔 인사도 안 하게 되니 얼마나 불편해요.",
   ck:[["可不是嘛","Kě bú shì ma"],["人越吵越僵","Rén yuè chǎo yuè jiāng"],["最后连招呼都不打了，多别扭","zuìhòu lián zhāohu dōu bù dǎ le, duō bièniu"]],
   notes:[{t:"可不是嘛",p:"kě bú shì ma",k:"expr",m:"그러니까요, 내 말이요",tip:"강한 맞장구입니다. 是啊보다 훨씬 생생하니 통째로 익혀 두세요."},
          {t:"越…越…",p:"yuè…yuè…",k:"grammar",m:"~할수록 더 ~하다",tip:"越说越气 / 越想越不对劲. 감정이 커지는 장면에 특히 잘 붙습니다."},
          {t:"连…都…",p:"lián…dōu…",k:"grammar",m:"~조차도 ~하다",tip:"극단적인 예를 들어 강조합니다. 连饭都没吃 = 밥조차 못 먹었다."}]},
  {s:"B",zh:"对，得饶人处且饶人。以后我们注意，你也别老憋着，直接说。",py:"Duì, dé ráo rén chù qiě ráo rén. Yǐhòu wǒmen zhùyì, nǐ yě bié lǎo biē zhe, zhíjiē shuō.",
   ko:"맞아, 봐줄 수 있을 땐 봐주는 거지. 앞으로 우리도 조심할 테니, 너도 혼자 참지 말고 바로 말해.",
   ck:[["对，得饶人处且饶人","Duì, dé ráo rén chù qiě ráo rén"],["以后我们注意","Yǐhòu wǒmen zhùyì"],["你也别老憋着，直接说","nǐ yě bié lǎo biē zhe, zhíjiē shuō"]],
   notes:[{t:"得饶人处且饶人",p:"dé ráo rén chù qiě ráo rén",k:"idiom",m:"봐줄 수 있는 자리에서는 봐줘라",tip:"갈등을 끝낼 때 어른들이 쓰는 말입니다. 이 한마디로 상황이 정리됩니다."},
          {t:"别老…",p:"bié lǎo…",k:"expr",m:"자꾸 ~하지 마라",tip:"老는 '늘, 자꾸'입니다. 别老加班 / 别老看手机."},
          {t:"憋着",p:"biē zhe",k:"word",m:"참고 담아 두다",tip:"憋는 숨을 참는다는 뜻에서 왔습니다. 有话别憋着 = 할 말 있으면 담아 두지 마라."}]},
  {s:"A",zh:"那说定了。要是哪天实在忍无可忍，我就上来敲门找您喝茶。",py:"Nà shuōdìng le. Yàoshi nǎ tiān shízài rěn wú kě rěn, wǒ jiù shànglái qiāo mén zhǎo nín hē chá.",
   ko:"그럼 그렇게 하기로 해요. 언젠가 정말 못 참겠으면 올라와서 문 두드리고 차 한잔 하자고 할게요.",
   ck:[["那说定了","Nà shuōdìng le"],["要是哪天实在忍无可忍","Yàoshi nǎ tiān shízài rěn wú kě rěn"],["我就上来敲门找您喝茶","wǒ jiù shànglái qiāo mén zhǎo nín hē chá"]],
   notes:[{t:"说定了",p:"shuōdìng le",k:"expr",m:"그렇게 하기로 정했다",tip:"一言为定보다 가볍고 일상적입니다. 那就说定了！"},
          {t:"忍无可忍",p:"rěn wú kě rěn",k:"idiom",m:"참을 만큼 참아 더는 못 참다",tip:"무겁게 들리는 성어라, 여기서는 농담으로 눌러 쓰는 것이 재치입니다."}]},
  {s:"B",zh:"行，喝茶随时欢迎，敲门也随时欢迎，就别带着火气来就行。",py:"Xíng, hē chá suíshí huānyíng, qiāo mén yě suíshí huānyíng, jiù bié dài zhe huǒqì lái jiù xíng.",
   ko:"좋아, 차 마시러도 언제든 환영이고 문 두드리는 것도 언제든 환영이야. 화만 안 안고 오면 돼.",
   ck:[["行，喝茶随时欢迎","Xíng, hē chá suíshí huānyíng"],["敲门也随时欢迎","qiāo mén yě suíshí huānyíng"],["就别带着火气来就行","jiù bié dài zhe huǒqì lái jiù xíng"]],
   notes:[{t:"带着…来",p:"dài zhe…lái",k:"grammar",m:"~을 지닌 채로 오다",tip:"着는 상태의 지속입니다. 带着问题来 / 笑着说."}]},
  {s:"A",zh:"一言为定。其实今天要不是您这么通情达理，我还真不敢上来。",py:"Yì yán wéi dìng. Qíshí jīntiān yàobúshì nín zhème tōng qíng dá lǐ, wǒ hái zhēn bù gǎn shànglái.",
   ko:"약속한 겁니다. 사실 오늘 언니가 이렇게 이해심이 없었으면 저도 못 올라왔을 거예요.",
   ck:[["一言为定","Yì yán wéi dìng"],["其实今天要不是您这么通情达理","Qíshí jīntiān yàobúshì nín zhème tōng qíng dá lǐ"],["我还真不敢上来","wǒ hái zhēn bù gǎn shànglái"]],
   notes:[{t:"要不是…",p:"yàobúshì…",k:"grammar",m:"~이 아니었더라면",tip:"가정법입니다. 뒤에는 보통 就나 还真이 옵니다. 要不是你提醒，我就忘了."},
          {t:"通情达理",p:"tōng qíng dá lǐ",k:"idiom",m:"사리에 밝고 이해심이 있다",tip:"상대를 높이는 칭찬 성어입니다. 대화를 좋게 닫을 때 씁니다."}]},
  {s:"B",zh:"客气什么，远亲不如近邻，往后有事儿你尽管言语一声。",py:"Kèqi shénme, yuǎnqīn bùrú jìnlín, wǎnghòu yǒu shìr nǐ jǐnguǎn yányu yì shēng.",
   ko:"뭘 그런 걸로. 먼 친척보다 가까운 이웃이라잖아. 앞으로 무슨 일 있으면 얼마든지 말해.",
   ck:[["客气什么","Kèqi shénme"],["远亲不如近邻","yuǎnqīn bùrú jìnlín"],["往后有事儿你尽管言语一声","wǎnghòu yǒu shìr nǐ jǐnguǎn yányu yì shēng"]],

 brief:[
  "중국에서 <b>随礼(suílǐ)</b>, 즉 부조는 액수 문제로 보이지만 실제로는 <b>관계의 등급을 숫자로 표시하는 일</b>입니다. 그래서 얼마를 낼지 정하는 것이 곧 '우리가 어느 정도 사이인가'를 정하는 것이 됩니다.",
  "판단의 기본 원칙은 <b>礼尚往来(오간 만큼 돌려준다)</b>입니다. 상대가 내게 얼마를 했는지가 첫 번째 기준이고, 그런 이력이 없으면 <b>随大流(대세를 따르다)</b>로 주변 동료들의 액수에 맞춥니다.",
  "여기서 중국인들이 경계하는 것이 <b>打肿脸充胖子</b>입니다. 얼굴을 부어오르게 때려 뚱뚱한 척한다는 뜻으로, 형편에 안 맞는 허세를 가리킵니다. 형편이 어려우면 액수 대신 <b>몸으로 때우는(人到礼到)</b> 방법이 있습니다.",
  "이 회차의 구어 골격은 <b>说A也不A · 越…越… · 话是这么说 · 非得…才… · 不在A，在B</b>입니다. 특히 「话是这么说，可…」는 상대 말을 받아 반박으로 넘어가는 다리라서, 회의에서도 그대로 쓸 수 있습니다."

  "보증금 반환은 중국에서도 세입자가 가장 자주 손해를 보는 자리입니다. 집주인은 대개 <b>먼저 흠을 잡고</b> 시작하기 때문에, 대응의 순서는 감정이 아니라 <b>증거 → 기준 → 절충</b>이어야 합니다.",

  "두 번째가 <b>正常磨损(정상 마모)</b>이라는 개념입니다. 사람이 살면 닳는 것이 당연하므로 그 부분까지 물어 주지는 않는다는 것이 상식적인 기준입니다. 여기서 <b>A归A</b> 골격이 위력을 발휘합니다.",
  "다만 끝을 이기는 것으로 닫으면 안 됩니다. 중국에서는 <b>各让一步(서로 한 발씩 양보)</b>로 마무리하고 <b>有言在先(미리 말해 두다)</b>으로 뒷말을 막습니다. 돈은 받되 사람은 남기는 것이 이 회차의 기술입니다."

 ],
 lines:[
  {s:"A",zh:"王姐，房子我今天就搬空了，押金什么时候能退给我？",py:"Wáng jiě, fángzi wǒ jīntiān jiù bān kōng le, yājīn shénme shíhou néng tuì gěi wǒ?",
   ko:"왕 언니, 집은 오늘 다 비웠어요. 보증금은 언제 돌려받을 수 있을까요?",
   ck:[["王姐，房子我今天就搬空了","Wáng jiě, fángzi wǒ jīntiān jiù bān kōng le"],["押金什么时候能退给我","yājīn shénme shíhou néng tuì gěi wǒ"]],
   notes:[{t:"搬空",p:"bān kōng",k:"grammar",m:"(짐을 옮겨) 텅 비우다",tip:"결과보어 空. 吃空 / 搬空 / 掏空처럼 '비게 만들다'를 나타냅니다."},
          {t:"退",p:"tuì",k:"word",m:"돌려주다, 반환하다",tip:"退押金 / 退货 / 退款. 돈이 되돌아오는 모든 장면에 씁니다."}]},
  {s:"B",zh:"别急，我得先看看房子，墙上那几个洞总得补吧。",py:"Bié jí, wǒ děi xiān kànkan fángzi, qiáng shàng nà jǐ ge dòng zǒng děi bǔ ba.",
   ko:"서두르지 마요, 집부터 좀 봐야지. 벽에 난 그 구멍들은 메워야 하지 않겠어요?",
   ck:[["别急，我得先看看房子","Bié jí, wǒ děi xiān kànkan fángzi"],["墙上那几个洞总得补吧","qiáng shàng nà jǐ ge dòng zǒng děi bǔ ba"]],
   notes:[{t:"总得…吧",p:"zǒng děi…ba",k:"expr",m:"아무래도 ~해야 하지 않겠어요",tip:"总不能…吧의 짝입니다. 이쪽은 요구를 부드럽게 밀어 넣습니다."}]},
  {s:"A",zh:"那几个洞是我进来之前就有的，当时拍了照，还发您微信了。",py:"Nà jǐ ge dòng shì wǒ jìnlái zhīqián jiù yǒu de, dāngshí pāi le zhào, hái fā nín Wēixìn le.",
   ko:"그 구멍들은 제가 들어오기 전부터 있던 거예요. 그때 사진 찍어서 위챗으로 보내 드렸잖아요.",
   ck:[["那几个洞是我进来之前就有的","Nà jǐ ge dòng shì wǒ jìnlái zhīqián jiù yǒu de"],["当时拍了照","dāngshí pāi le zhào"],["还发您微信了","hái fā nín Wēixìn le"]],
   notes:[{t:"是…的",p:"shì…de",k:"grammar",m:"(시점·주체를) 강조하는 구문",tip:"是我进来之前就有的 = 내가 들어오기 '전부터' 있었던 것이다. 책임 소재를 가릴 때 필수입니다."},
          {t:"当时",p:"dāngshí",k:"word",m:"그때, 그 당시",tip:"那会儿보다 격식 있게 들립니다. 증거를 말할 때 잘 어울립니다."}]},
  {s:"B",zh:"有这事儿？我一时想不起来了，你把照片再发我一遍。",py:"Yǒu zhè shìr? Wǒ yìshí xiǎng bu qǐlái le, nǐ bǎ zhàopiàn zài fā wǒ yí biàn.",
   ko:"그런 일이 있었나? 지금 당장은 기억이 안 나네. 사진 다시 한 번 보내 봐요.",
   ck:[["有这事儿","Yǒu zhè shìr"],["我一时想不起来了","Wǒ yìshí xiǎng bu qǐlái le"],["你把照片再发我一遍","nǐ bǎ zhàopiàn zài fā wǒ yí biàn"]],
   notes:[{t:"想不起来",p:"xiǎng bu qǐlái",k:"grammar",m:"떠올리지 못하다",tip:"가능보어. 记不住(외우지 못함)와 다릅니다. 이쪽은 '알던 것이 안 떠오름'입니다."},
          {t:"把…发我一遍",p:"bǎ…fā wǒ yí biàn",k:"grammar",m:"~을 나에게 한 번 더 보내다",tip:"把자문 + 동량보어 一遍. 再…一遍은 '다시 한 번'입니다."}]},
  {s:"A",zh:"已经发过去了。合同上白纸黑字写着，原有损坏不算我的。",py:"Yǐjīng fā guòqù le. Hétong shàng bái zhǐ hēi zì xiě zhe, yuányǒu sǔnhuài bú suàn wǒ de.",
   ko:"이미 보냈어요. 계약서에 분명히 적혀 있잖아요, 원래 있던 파손은 제 책임이 아니라고요.",
   ck:[["已经发过去了","Yǐjīng fā guòqù le"],["合同上白纸黑字写着","Hétong shàng bái zhǐ hēi zì xiě zhe"],["原有损坏不算我的","yuányǒu sǔnhuài bú suàn wǒ de"]],
   notes:[{t:"白纸黑字",p:"bái zhǐ hēi zì",k:"idiom",m:"흰 종이에 검은 글씨, 문서로 분명히",tip:"구두 약속과 대비해 문서를 들이밀 때 씁니다. 白纸黑字写着呢！"},
          {t:"不算我的",p:"bú suàn wǒ de",k:"expr",m:"내 책임으로 치지 않는다",tip:"算은 '~으로 친다'입니다. 这不算加班 / 算你的."}]},
  {s:"B",zh:"行行行，这个不算你的。可地板那道划痕，你总不能也赖我吧。",py:"Xíng xíng xíng, zhège bú suàn nǐ de. Kě dìbǎn nà dào huáhén, nǐ zǒng bù néng yě lài wǒ ba.",
   ko:"알았어 알았어, 그건 당신 책임 아니야. 그런데 바닥의 그 긁힌 자국은 설마 나한테 미루진 않겠지?",
   ck:[["行行行，这个不算你的","Xíng xíng xíng, zhège bú suàn nǐ de"],["可地板那道划痕","Kě dìbǎn nà dào huáhén"],["你总不能也赖我吧","nǐ zǒng bù néng yě lài wǒ ba"]],
   notes:[{t:"赖",p:"lài",k:"word",m:"(책임을) 뒤집어씌우다",tip:"赖我 / 赖账(빚을 떼먹다). 구어에서 자주 나오는 강한 단어입니다."},
          {t:"道",p:"dào",k:"measure",m:"줄·금을 세는 양사",tip:"一道划痕 / 一道疤 / 一道菜. 길게 난 자국에는 道를 씁니다."}]},
  {s:"A",zh:"划痕我认。不过那是正常使用的磨损，按理不该全扣我的。",py:"Huáhén wǒ rèn. Búguò nà shì zhèngcháng shǐyòng de mósǔn, ànlǐ bù gāi quán kòu wǒ de.",
   ko:"긁힌 건 제가 인정해요. 다만 정상적으로 쓰다 생긴 마모니까, 원칙대로면 다 떼면 안 되죠.",
   ck:[["划痕我认","Huáhén wǒ rèn"],["不过那是正常使用的磨损","Búguò nà shì zhèngcháng shǐyòng de mósǔn"],["按理不该全扣我的","ànlǐ bù gāi quán kòu wǒ de"]],
   notes:[{t:"认",p:"rèn",k:"word",m:"(잘못을) 인정하다",tip:"这个我认 = 그건 내가 인정한다. 인정할 것만 딱 잘라 인정하면 나머지 주장이 강해집니다."},
          {t:"按理",p:"ànlǐ",k:"word",m:"이치대로라면, 원칙대로면",tip:"按理说로도 씁니다. 按理说他早该到了."}]},
  {s:"B",zh:"正常磨损归正常磨损，可修一下也得花钱，这钱谁出？",py:"Zhèngcháng mósǔn guī zhèngcháng mósǔn, kě xiū yíxià yě děi huā qián, zhè qián shéi chū?",
   ko:"정상 마모는 정상 마모고, 그래도 고치려면 돈이 드는데 그 돈은 누가 내요?",
   ck:[["正常磨损归正常磨损","Zhèngcháng mósǔn guī zhèngcháng mósǔn"],["可修一下也得花钱","kě xiū yíxià yě děi huā qián"],["这钱谁出","zhè qián shéi chū"]],
   notes:[{t:"A归A",p:"A guī A",k:"grammar",m:"A는 A대로 인정하되, 그것과 별개로",tip:"8일차에도 나온 골격입니다. 상대의 논리를 인정하면서 무력화합니다."},
          {t:"出钱",p:"chū qián",k:"expr",m:"돈을 대다, 비용을 부담하다",tip:"谁出钱？ / 我出一半. 出는 '내놓다'입니다."}]},
  {s:"A",zh:"咱们各让一步。修划痕的钱我出一半，剩下的您担着，行吗？",py:"Zánmen gè ràng yí bù. Xiū huáhén de qián wǒ chū yíbàn, shèngxià de nín dān zhe, xíng ma?",
   ko:"서로 한 발씩 양보하죠. 긁힌 데 고치는 돈은 제가 절반 내고, 나머지는 언니가 부담하시는 걸로, 어때요?",
   ck:[["咱们各让一步","Zánmen gè ràng yí bù"],["修划痕的钱我出一半","Xiū huáhén de qián wǒ chū yíbàn"],["剩下的您担着，行吗","shèngxià de nín dān zhe, xíng ma"]],
   notes:[{t:"各让一步",p:"gè ràng yí bù",k:"expr",m:"서로 한 발씩 양보하다",tip:"협상을 닫는 정석 표현입니다. 各让一步，这事就过去了."},
          {t:"担着",p:"dān zhe",k:"word",m:"떠맡다, 부담하다",tip:"担责任 / 担风险. 着가 붙으면 '계속 지고 있다'는 상태가 됩니다."}]},
  {s:"B",zh:"你倒是会算账。不过话说回来，你这租客确实比上一个省心。",py:"Nǐ dàoshi huì suànzhàng. Búguò huà shuō huí lái, nǐ zhè zūkè quèshí bǐ shàng yí ge shěngxīn.",
   ko:"셈은 참 잘하네. 그건 그렇고, 당신은 지난번 세입자보다 확실히 손이 덜 가긴 했어.",
   ck:[["你倒是会算账","Nǐ dàoshi huì suànzhàng"],["不过话说回来","Búguò huà shuō huí lái"],["你这租客确实比上一个省心","nǐ zhè zūkè quèshí bǐ shàng yí ge shěngxīn"]],
   notes:[{t:"倒是",p:"dàoshi",k:"word",m:"의외로, 오히려 (가벼운 반전)",tip:"你倒是挺会说 = 말은 참 잘하네. 칭찬과 핀잔 사이를 오갑니다."},
          {t:"话说回来",p:"huà shuō huí lái",k:"expr",m:"그건 그렇고, 다시 말하자면",tip:"자기 말을 스스로 뒤집어 균형을 잡는 전환어입니다. 대화를 부드럽게 만듭니다."},
          {t:"省心",p:"shěngxīn",k:"word",m:"신경 쓸 일이 없어 편하다",tip:"这孩子省心 / 让人不省心. 사람에 대한 평가로 자주 씁니다."}]},
  {s:"A",zh:"那您就痛快点，别让我跑三趟才拿到自己的钱。",py:"Nà nín jiù tòngkuai diǎn, bié ràng wǒ pǎo sān tàng cái ná dào zìjǐ de qián.",
   ko:"그럼 시원하게 해 주세요. 제 돈 받자고 세 번씩 오가게 만들지 마시고요.",
   ck:[["那您就痛快点","Nà nín jiù tòngkuai diǎn"],["别让我跑三趟才拿到自己的钱","bié ràng wǒ pǎo sān tàng cái ná dào zìjǐ de qián"]],
   notes:[{t:"痛快点",p:"tòngkuai diǎn",k:"expr",m:"시원시원하게 좀 해라",tip:"你痛快点儿！= 질질 끌지 마. 협상 마무리를 재촉할 때 씁니다."},
          {t:"趟",p:"tàng",k:"measure",m:"오가는 횟수를 세는 양사",tip:"跑一趟 / 白跑一趟(헛걸음하다). 왕복에는 次가 아니라 趟입니다."}]},
  {s:"B",zh:"我什么时候拖过你？水电燃气结清了没有，这个总得算吧。",py:"Wǒ shénme shíhou tuō guo nǐ? Shuǐ diàn ránqì jiéqīng le méiyǒu, zhège zǒng děi suàn ba.",
   ko:"내가 언제 당신 걸 질질 끈 적 있어? 수도·전기·가스는 정산했나? 그건 따져 봐야지.",
   ck:[["我什么时候拖过你","Wǒ shénme shíhou tuō guo nǐ"],["水电燃气结清了没有","Shuǐ diàn ránqì jiéqīng le méiyǒu"],["这个总得算吧","zhège zǒng děi suàn ba"]],
   notes:[{t:"我什么时候…过？",p:"wǒ shénme shíhou…guo?",k:"grammar",m:"내가 언제 ~한 적 있냐?",tip:"의문사로 강하게 부정하는 반문입니다. 我什么时候骗过你？"},
          {t:"结清",p:"jiéqīng",k:"word",m:"정산해 깨끗이 마무리하다",tip:"结清账 / 结清费用. 清이 '남김없이'를 뜻합니다."}]},
  {s:"A",zh:"昨天全交完了，单子我都留着呢，一张都没少。",py:"Zuótiān quán jiāo wán le, dānzi wǒ dōu liú zhe ne, yì zhāng dōu méi shǎo.",
   ko:"어제 전부 냈어요. 영수증도 다 갖고 있고요, 한 장도 빠짐없이요.",
   ck:[["昨天全交完了","Zuótiān quán jiāo wán le"],["单子我都留着呢","dānzi wǒ dōu liú zhe ne"],["一张都没少","yì zhāng dōu méi shǎo"]],
   notes:[{t:"一…都没…",p:"yì…dōu méi…",k:"grammar",m:"하나도 ~하지 않았다",tip:"连…都…의 강조형입니다. 一分都没花 / 一句都没说."},
          {t:"…呢",p:"…ne",k:"expr",m:"(상태를 강조하는) 어기조사",tip:"我留着呢 = 잘 갖고 있다니까요. 상대의 의심을 눌러 줍니다."}]},
  {s:"B",zh:"那还行。这样吧，扣两百修地板，剩下的今天就转给你。",py:"Nà hái xíng. Zhèyàng ba, kòu liǎngbǎi xiū dìbǎn, shèngxià de jīntiān jiù zhuǎn gěi nǐ.",
   ko:"그럼 됐네. 이렇게 하자, 바닥 수리비로 이백 떼고 나머지는 오늘 바로 보내 줄게.",
   ck:[["那还行","Nà hái xíng"],["这样吧，扣两百修地板","Zhèyàng ba, kòu liǎngbǎi xiū dìbǎn"],["剩下的今天就转给你","shèngxià de jīntiān jiù zhuǎn gěi nǐ"]],
   notes:[{t:"这样吧",p:"zhèyàng ba",k:"expr",m:"이렇게 합시다",tip:"절충안을 꺼내는 신호입니다. 那这样吧와 함께 협상의 필수 표현입니다."},
          {t:"转",p:"zhuǎn",k:"word",m:"송금하다, 이체하다",tip:"微信转账 / 转给你. 요즘 중국에서 가장 자주 쓰는 결제 동사입니다."}]},
  {s:"A",zh:"两百有点多吧。我问过师傅，那种划痕补一下也就一百出头。",py:"Liǎngbǎi yǒudiǎn duō ba. Wǒ wèn guo shīfu, nà zhǒng huáhén bǔ yíxià yě jiù yìbǎi chūtóu.",
   ko:"이백은 좀 많은데요. 기사님한테 물어보니 그 정도 긁힘은 손보는 데 백 남짓이면 된대요.",
   ck:[["两百有点多吧","Liǎngbǎi yǒudiǎn duō ba"],["我问过师傅","Wǒ wèn guo shīfu"],["那种划痕补一下也就一百出头","nà zhǒng huáhén bǔ yíxià yě jiù yìbǎi chūtóu"]],
   notes:[{t:"出头",p:"chūtóu",k:"word",m:"~ 남짓, 조금 넘음",tip:"三十出头 = 서른 남짓. 나이와 금액에 두루 씁니다."},
          {t:"也就",p:"yě jiù",k:"expr",m:"기껏해야, 겨우",tip:"也就一百 = 많아야 백. 액수를 깎을 때 아주 유용합니다."}]},
  {s:"B",zh:"你还真去打听了。行，一百五，这回我可一分没多要。",py:"Nǐ hái zhēn qù dǎting le. Xíng, yìbǎi wǔ, zhè huí wǒ kě yì fēn méi duō yào.",
   ko:"진짜로 알아봤네. 좋아, 백오십. 이번엔 한 푼도 더 안 받았어.",
   ck:[["你还真去打听了","Nǐ hái zhēn qù dǎting le"],["行，一百五","Xíng, yìbǎi wǔ"],["这回我可一分没多要","zhè huí wǒ kě yì fēn méi duō yào"]],
   notes:[{t:"还真",p:"hái zhēn",k:"expr",m:"정말로 (뜻밖이라는 어감)",tip:"你还真去了 = 진짜로 갔네. 감탄과 놀람이 섞입니다."},
          {t:"一分没多要",p:"yì fēn méi duō yào",k:"expr",m:"한 푼도 더 받지 않았다",tip:"分은 가장 작은 화폐 단위입니다. 一分钱都没花처럼 강조에 씁니다."}]},
  {s:"A",zh:"那就这么定了。您现在转，我这边确认收到就把钥匙给您。",py:"Nà jiù zhème dìng le. Nín xiànzài zhuǎn, wǒ zhèbiān quèrèn shōu dào jiù bǎ yàoshi gěi nín.",
   ko:"그럼 그렇게 하기로 해요. 지금 보내 주시면 제가 확인하는 대로 열쇠 드릴게요.",
   ck:[["那就这么定了","Nà jiù zhème dìng le"],["您现在转","Nín xiànzài zhuǎn"],["我这边确认收到就把钥匙给您","wǒ zhèbiān quèrèn shōu dào jiù bǎ yàoshi gěi nín"]],
   notes:[{t:"这边",p:"zhèbiān",k:"word",m:"저희 쪽, 이쪽",tip:"我这边 / 你那边. 사람 대신 '쪽'으로 말하면 사무적이고 부드럽습니다."},
          {t:"把钥匙给您",p:"bǎ yàoshi gěi nín",k:"grammar",m:"열쇠를 당신께 드리다",tip:"把자문의 기본형입니다. 목적어를 앞으로 빼 처리 결과를 강조합니다."}]},

 brief:[
  "빌려준 돈 이야기를 꺼내는 일은 중국어에서도 가장 말 꺼내기 어려운 자리입니다. 핵심은 <b>돈을 요구하기 전에 관계를 먼저 확인해 두는 것</b>입니다. 순서가 바뀌면 상대는 방어부터 하게 됩니다.",
  "그래서 먼저 쓰는 말이 <b>不是催你(재촉하는 게 아니다)</b>와 <b>心里有个数(대략만 알면 된다)</b>입니다. 요구를 「정보 요청」으로 낮춰 던지면 상대가 물러설 자리가 생깁니다.",
  "빌린 쪽이 쓰는 말도 정해져 있습니다. <b>手头紧(주머니 사정이 빠듯하다)</b>, <b>张不开嘴(말을 꺼내지 못하다)</b>, <b>过意不去(미안해서 편치 않다)</b>. 이런 말이 나오면 상대가 도망치는 것이 아니라 부끄러워하고 있다는 신호입니다.",
  "마무리는 <b>날짜를 받되 여지를 남기는 것</b>입니다. 定个日子로 못을 박고, 周转不开就说一声으로 퇴로를 열어 둡니다. 돈은 받되 사람은 남기는 것 — 이 회차에서 익힐 기술입니다."

 brief:[
  "명절에 친척이 던지는 질문에는 정해진 차례가 있습니다. <b>일 → 월급 → 결혼 → 집</b>. 악의가 아니라 관심의 표현 방식이지만, 받는 쪽에는 심문처럼 느껴집니다. 이 회차는 그 네 관문을 웃으며 통과하는 연습입니다.",
  "핵심은 <b>정면으로 답하지 않되 무시하지도 않는 것</b>입니다. 중국어에는 이럴 때 쓰는 완충어가 잘 발달해 있습니다 — <b>这个真不好说(그건 말하기 참 곤란해요)</b>, <b>够花(쓸 만큼은 돼요)</b>, <b>急也急不来(서둘러 되는 일이 아니에요)</b>.",
  "여기서 가능보어가 무기가 됩니다. <b>饿不着(굶지는 않아요)</b>, <b>富不了(부자는 못 되고요)</b>처럼 긍정과 부정을 나란히 놓으면, 숫자를 말하지 않고도 대답한 셈이 됩니다.",
  "마지막은 <b>관계를 다시 여는 것</b>으로 닫습니다. 어른이 물러서 주면 <b>您这么说我反而不好意思了</b>로 받고, 차를 따르며 화제를 바꿉니다. 이기지 않고 빠져나오는 것이 이 자리의 예의입니다."
 ],
 vocab:[
  {w:"一年到头",p:"yì nián dào tóu",m:"일 년 내내",lv:"성어"},
  {w:"景气",p:"jǐngqì",m:"경기, 경기가 좋음",lv:"HSK6"},
  {w:"稳得住",p:"wěn de zhù",m:"버텨 낼 수 있다",lv:"구어"},
  {w:"够花",p:"gòu huā",m:"쓰기에 충분하다",lv:"구어"},
  {w:"出头",p:"chūtóu",m:"(나이·수량이) 남짓",lv:"구어"},
  {w:"将就",p:"jiāngjiu",m:"아쉬운 대로 맞추다",lv:"HSK6"},
  {w:"念叨",p:"niàndao",m:"노상 입에 올리다",lv:"구어"},
  {w:"缘分",p:"yuánfèn",m:"인연",lv:"HSK5"},
  {w:"凑合",p:"còuhe",m:"아쉬운 대로 때우다",lv:"구어"},
  {w:"首付",p:"shǒufù",m:"(집값의) 계약금",lv:"구어"},
  {w:"硬撑",p:"yìng chēng",m:"억지로 버티다",lv:"구어"},
  {w:"往心里去",p:"wǎng xīnlǐ qù",m:"마음에 담아 두다",lv:"구어"}
 ],
 lines:[
  {s:"A",zh:"小许回来啦，快坐快坐，这一年到头也见不着你几回。",py:"Xiǎo Xǔ huílái la, kuài zuò kuài zuò, zhè yì nián dào tóu yě jiàn bu zháo nǐ jǐ huí.",
   ko:"샤오쉬 왔구나, 어서 앉아 앉아. 일 년 내내 너 몇 번 보지도 못하네.",
   ck:[["小许回来啦","Xiǎo Xǔ huílái la"],["快坐快坐","kuài zuò kuài zuò"],["这一年到头也见不着你几回","zhè yì nián dào tóu yě jiàn bu zháo nǐ jǐ huí"]],
   notes:[{t:"一年到头",p:"yì nián dào tóu",k:"idiom",m:"일 년 내내",tip:"一이 1성 앞이라 yì로 바뀝니다. 一年到头忙个不停 처럼 씁니다."},
          {t:"见不着",p:"jiàn bu zháo",k:"grammar",m:"만날 수가 없다 (가능보어 부정)",tip:"着는 zháo로 읽습니다. 找不着 / 睡不着와 같은 계열입니다."}]},
  {s:"B",zh:"二姨好，路上堵了三个多小时，再晚点儿今晚就到不了了。",py:"Èr yí hǎo, lù shàng dǔ le sān ge duō xiǎoshí, zài wǎn diǎnr jīnwǎn jiù dào bù liǎo le.",
   ko:"이모 안녕하세요. 오는 길에 세 시간 넘게 막혔어요. 조금만 더 늦었으면 오늘 밤엔 못 왔을 거예요.",
   ck:[["二姨好","Èr yí hǎo"],["路上堵了三个多小时","lù shàng dǔ le sān ge duō xiǎoshí"],["再晚点儿今晚就到不了了","zài wǎn diǎnr jīnwǎn jiù dào bù liǎo le"]],
   notes:[{t:"到不了",p:"dào bù liǎo",k:"grammar",m:"도착할 수 없다 (가능보어 부정)",tip:"了를 liǎo로 읽습니다. 받침처럼 붙는 le와 소리가 달라 헷갈리는 자리입니다."},
          {t:"晚点儿",p:"wǎn diǎnr",k:"pron",m:"조금 늦게",tip:"儿화는 앞 음절에 붙여 한 덩어리로 읽습니다. diǎn+er가 아니라 diǎnr입니다."}]},
  {s:"A",zh:"路上辛苦了。工作还是那家公司吧？听说今年不太景气啊。",py:"Lù shàng xīnkǔ le. Gōngzuò háishi nà jiā gōngsī ba? Tīngshuō jīnnián bú tài jǐngqì a.",
   ko:"오느라 고생했다. 일은 아직 그 회사지? 올해는 경기가 별로라던데.",
   ck:[["路上辛苦了","Lù shàng xīnkǔ le"],["工作还是那家公司吧","Gōngzuò háishi nà jiā gōngsī ba"],["听说今年不太景气啊","Tīngshuō jīnnián bú tài jǐngqì a"]],
   notes:[{t:"还是…吧",p:"háishi… ba",k:"grammar",m:"아직 ~이지? (확인하는 물음)",tip:"还是가 「여전히」로 쓰인 자리입니다. 선택의 「아니면」과 헷갈리지 마세요."},
          {t:"不太",p:"bú tài",k:"pron",m:"그다지 ~하지 않다",tip:"不는 4성 앞에서 bú로 바뀝니다. 不太 / 不对 / 不是 모두 같은 규칙입니다."}]},
  {s:"B",zh:"还是那家，行业是不好过，不过我们部门还算稳得住。",py:"Háishi nà jiā, hángyè shì bù hǎo guò, búguò wǒmen bùmén hái suàn wěn de zhù.",
   ko:"아직 그 회사예요. 업계가 힘든 건 맞는데, 저희 부서는 그런대로 버티고 있어요.",
   ck:[["还是那家","Háishi nà jiā"],["行业是不好过","hángyè shì bù hǎo guò"],["不过我们部门还算稳得住","búguò wǒmen bùmén hái suàn wěn de zhù"]],
   notes:[{t:"稳得住",p:"wěn de zhù",k:"grammar",m:"버텨 낼 수 있다 (가능보어 긍정)",tip:"부정은 稳不住입니다. 撑得住 / 扛得住와 함께 한 묶음으로 외우세요."},
          {t:"行",p:"háng",k:"pron",m:"업종·분야를 뜻할 때는 háng",tip:"行业 háng yè / 这一行 zhè yì háng. 「가다」의 xíng과 구별해야 합니다."}]},
  {s:"A",zh:"稳就好。工资涨了没有？你们那行听说一年能挣不少呢。",py:"Wěn jiù hǎo. Gōngzī zhǎng le méiyǒu? Nǐmen nà háng tīngshuō yì nián néng zhèng bù shǎo ne.",
   ko:"버티면 됐지. 월급은 올랐니? 너희 업계는 일 년에 꽤 번다던데.",
   ck:[["稳就好","Wěn jiù hǎo"],["工资涨了没有","Gōngzī zhǎng le méiyǒu"],["你们那行听说一年能挣不少呢","Nǐmen nà háng tīngshuō yì nián néng zhèng bù shǎo ne"]],
   notes:[{t:"挣",p:"zhèng",k:"pron",m:"(돈을) 벌다",tip:"挣钱은 zhèng qián입니다. 挣扎(zhēngzhá, 발버둥치다)의 zhēng과 읽기가 다릅니다."},
          {t:"…了没有",p:"… le méiyǒu",k:"grammar",m:"~했니 안 했니",tip:"완료를 묻는 정반의문문입니다. 涨了没有 / 吃了没有."}]},
  {s:"B",zh:"二姨，这个真不好说，反正够花，饿不着也富不了。",py:"Èr yí, zhège zhēn bù hǎo shuō, fǎnzhèng gòu huā, è bu zháo yě fù bu liǎo.",
   ko:"이모, 그건 참 말씀드리기 곤란해요. 아무튼 쓸 만큼은 되고요, 굶지도 않지만 부자도 못 됩니다.",
   ck:[["二姨，这个真不好说","Èr yí, zhège zhēn bù hǎo shuō"],["反正够花","fǎnzhèng gòu huā"],["饿不着也富不了","è bu zháo yě fù bu liǎo"]],
   notes:[{t:"不好说",p:"bù hǎo shuō",k:"expr",m:"말하기 곤란하다",tip:"「모른다」가 아니라 「밝히기 곤란하다」입니다. 액수를 피하는 가장 점잖은 말입니다."},
          {t:"饿不着也富不了",p:"è bu zháo yě fù bu liǎo",k:"grammar",m:"굶지도 않고 부자도 못 된다",tip:"가능보어 긍정·부정을 나란히 놓아 숫자 없이 답하는 기술입니다. 통째로 외워 두세요."}]},
  {s:"A",zh:"也是。那个人的事儿呢？你都三十出头了，总不能一直拖着吧。",py:"Yě shì. Nàge rén de shìr ne? Nǐ dōu sānshí chūtóu le, zǒng bù néng yìzhí tuō zhe ba.",
   ko:"그렇지. 그럼 사람 문제는? 너도 서른 넘었는데 계속 미룰 수만은 없잖니.",
   ck:[["也是","Yě shì"],["那个人的事儿呢","Nàge rén de shìr ne"],["你都三十出头了","Nǐ dōu sānshí chūtóu le"],["总不能一直拖着吧","zǒng bù néng yìzhí tuō zhe ba"]],
   notes:[{t:"总不能…吧",p:"zǒng bù néng… ba",k:"grammar",m:"설마 계속 ~할 수는 없잖아",tip:"반박을 미리 막으며 압박하는 골격입니다. 总不能让他一个人去吧."},
          {t:"出头",p:"chūtóu",k:"word",m:"(나이·수량이) 남짓",tip:"三十出头 = 서른 남짓. 三十多보다 「이제 막 넘었다」는 느낌이 강합니다."}]},
  {s:"B",zh:"二姨，这事儿急也急不来，遇不上合适的，将就更麻烦。",py:"Èr yí, zhè shìr jí yě jí bù lái, yù bu shàng héshì de, jiāngjiu gèng máfan.",
   ko:"이모, 이건 서둘러서 되는 일이 아니에요. 맞는 사람을 못 만나는데 억지로 맞추면 더 골치예요.",
   ck:[["二姨，这事儿急也急不来","Èr yí, zhè shìr jí yě jí bù lái"],["遇不上合适的","yù bu shàng héshì de"],["将就更麻烦","jiāngjiu gèng máfan"]],
   notes:[{t:"急不来",p:"jí bù lái",k:"grammar",m:"서둘러서 될 일이 아니다",tip:"가능보어 부정입니다. 强求不来 / 学不来도 같은 방식으로 씁니다."},
          {t:"将就",p:"jiāngjiu",k:"word",m:"아쉬운 대로 맞추다",tip:"凑合와 거의 같지만 将就가 조금 더 참는 쪽입니다. 두 번째 글자는 경성입니다."}]},
  {s:"A",zh:"话是这么说，可你妈这两年头发都白了，天天念叨这个。",py:"Huà shì zhème shuō, kě nǐ mā zhè liǎng nián tóufa dōu bái le, tiāntiān niàndao zhège.",
   ko:"말이야 그렇지. 그런데 네 엄마는 요 몇 년 머리가 다 셌고, 날마다 이 얘기만 한단다.",
   ck:[["话是这么说","Huà shì zhème shuō"],["可你妈这两年头发都白了","kě nǐ mā zhè liǎng nián tóufa dōu bái le"],["天天念叨这个","tiāntiān niàndao zhège"]],
   notes:[{t:"话是这么说",p:"huà shì zhème shuō",k:"expr",m:"말은 그렇지만",tip:"说是这么说와 같은 자리에 씁니다. 뒤에 반드시 반전이 옵니다."},
          {t:"念叨",p:"niàndao",k:"word",m:"노상 입에 올리다",tip:"잔소리보다 「그리워하며 자꾸 말한다」는 정이 섞입니다. 她天天念叨你."}]},
  {s:"B",zh:"我知道她着急，可这种事催是催不出来的，缘分得等。",py:"Wǒ zhīdào tā zháojí, kě zhè zhǒng shì cuī shì cuī bù chūlái de, yuánfèn děi děng.",
   ko:"엄마가 조급한 건 알아요. 그래도 이런 건 재촉한다고 나오는 게 아니잖아요, 인연은 기다려야죠.",
   ck:[["我知道她着急","Wǒ zhīdào tā zháojí"],["可这种事催是催不出来的","kě zhè zhǒng shì cuī shì cuī bù chūlái de"],["缘分得等","yuánfèn děi děng"]],
   notes:[{t:"V是V不出来的",p:"V shì V bù chūlái de",k:"grammar",m:"~한다고 나오는 게 아니다",tip:"같은 동사를 앞뒤에 놓아 「해 봐야 소용없다」를 만듭니다. 想是想不明白的."},
          {t:"着急",p:"zháojí",k:"pron",m:"조급해하다",tip:"着는 여기서 zháo입니다. 着手(zhuóshǒu), 穿着(chuānzhuó)와 읽기가 다릅니다."}]},
  {s:"A",zh:"你们年轻人啊，条件是条件，可是人这一辈子总得有个伴儿。",py:"Nǐmen niánqīngrén a, tiáojiàn shì tiáojiàn, kěshì rén zhè yíbèizi zǒng děi yǒu ge bànr.",
   ko:"너희 젊은 사람들은 참. 조건은 조건이지만, 사람이 한평생 짝은 있어야 하잖니.",
   ck:[["你们年轻人啊","Nǐmen niánqīngrén a"],["条件是条件","tiáojiàn shì tiáojiàn"],["可是人这一辈子总得有个伴儿","kěshì rén zhè yíbèizi zǒng děi yǒu ge bànr"]],
   notes:[{t:"A是A，可是…",p:"A shì A, kěshì…",k:"grammar",m:"A이긴 A인데, 다만",tip:"상대 말을 일단 통째로 인정하고 뒤집는 골격입니다. 贵是贵，可是值."},
          {t:"一辈子",p:"yíbèizi",k:"pron",m:"한평생",tip:"一이 4성 앞이라 yí로 바뀝니다. 一辈子 / 一半 / 一定 모두 같습니다."}]},
  {s:"B",zh:"有伴儿是好，可是凑合来的伴儿，往后麻烦更多，您说是不是？",py:"Yǒu bànr shì hǎo, kěshì còuhe lái de bànr, wǎnghòu máfan gèng duō, nín shuō shì bu shì?",
   ko:"짝이 있으면 좋죠. 그런데 억지로 맞춘 짝은 나중에 더 골치예요. 그렇지 않나요?",
   ck:[["有伴儿是好","Yǒu bànr shì hǎo"],["可是凑合来的伴儿","kěshì còuhe lái de bànr"],["往后麻烦更多","wǎnghòu máfan gèng duō"],["您说是不是","nín shuō shì bu shì"]],
   notes:[{t:"凑合",p:"còuhe",k:"word",m:"아쉬운 대로 때우다",tip:"凑合着用 = 그럭저럭 쓰다. 사람에게 쓰면 「아쉬운 대로 만난다」는 뜻이 됩니다."},
          {t:"您说是不是",p:"nín shuō shì bu shì",k:"expr",m:"그렇지 않나요",tip:"반박을 동의 요청으로 바꿔 어른 앞에서도 각이 서지 않게 합니다."}]},
  {s:"A",zh:"你这孩子嘴上厉害。房子呢？听你妈说你还在租房子住？",py:"Nǐ zhè háizi zuǐ shàng lìhai. Fángzi ne? Tīng nǐ mā shuō nǐ hái zài zū fángzi zhù?",
   ko:"얘는 말솜씨가 보통이 아니네. 집은? 네 엄마 말로는 아직 세 들어 산다던데?",
   ck:[["你这孩子嘴上厉害","Nǐ zhè háizi zuǐ shàng lìhai"],["房子呢","Fángzi ne"],["听你妈说你还在租房子住","Tīng nǐ mā shuō nǐ hái zài zū fángzi zhù"]],
   notes:[{t:"嘴上厉害",p:"zuǐ shàng lìhai",k:"expr",m:"말솜씨가 만만치 않다",tip:"칭찬 반 핀잔 반입니다. 어른이 젊은 사람에게 쓰면 애정이 섞입니다."},
          {t:"听…说",p:"tīng… shuō",k:"grammar",m:"~에게 듣기로는",tip:"정보의 출처를 밝혀 책임을 덜어 놓는 화법입니다."}]},
  {s:"B",zh:"租着呢。买房这事非得攒够首付才能谈，急也没用。",py:"Zū zhe ne. Mǎi fáng zhè shì fēiděi zǎn gòu shǒufù cái néng tán, jí yě méi yòng.",
   ko:"세 들어 살아요. 집 사는 건 계약금을 다 모아야 얘기가 되는 거라, 서둘러도 소용없어요.",
   ck:[["租着呢","Zū zhe ne"],["买房这事非得攒够首付才能谈","Mǎi fáng zhè shì fēiděi zǎn gòu shǒufù cái néng tán"],["急也没用","jí yě méi yòng"]],
   notes:[{t:"非得…才…",p:"fēiděi… cái…",k:"grammar",m:"반드시 ~해야만 비로소 ~하다",tip:"조건이 절대적임을 못 박습니다. 非得你去才行 = 네가 가야만 된다."},
          {t:"攒",p:"zǎn",k:"word",m:"(돈을) 모으다",tip:"攒钱 / 攒够. 存钱이 「예금하다」라면 攒钱은 「조금씩 모으다」입니다."}]},
  {s:"A",zh:"你二姨夫说，实在不行家里先给你凑一部分，你别硬撑。",py:"Nǐ èryífu shuō, shízài bù xíng jiā lǐ xiān gěi nǐ còu yí bùfen, nǐ bié yìng chēng.",
   ko:"네 이모부가 그러는데, 정 안 되면 집에서 먼저 얼마간 보태 준다더라. 억지로 버티지 마라.",
   ck:[["你二姨夫说","Nǐ èryífu shuō"],["实在不行家里先给你凑一部分","shízài bù xíng jiā lǐ xiān gěi nǐ còu yí bùfen"],["你别硬撑","nǐ bié yìng chēng"]],

 brief:[
  "동료가 일을 넘길 때 중국어로 「안 됩니다」를 곧바로 말하면 관계가 상합니다. 실무의 순서는 <b>먼저 조건을 깔고, 그다음 못 하는 이유를 사실로 대고, 마지막에 대안을 내미는 것</b>입니다.",
  "그래서 첫마디가 <b>先说好(미리 말해 두자면)</b>입니다. 듣기 전에 조건을 깔아 두면 나중에 거절해도 말을 바꾼 것이 되지 않습니다. 여기에 <b>腾不出人</b>, <b>排满了</b> 같은 사실 진술을 붙입니다.",
  "이 회차의 뼈대는 <b>가능보어</b>입니다. 推不掉 · 办不到 · 交不上去 · 催不动 · 赖不掉. 「능력이 없다」가 아니라 <b>상황이 허락하지 않는다</b>고 말하는 방식이라, 거절이 인신공격으로 들리지 않습니다.",
  "닫는 방식도 정해져 있습니다. <b>A归A(그건 그거고)</b>로 사안과 관계를 분리하고, 대안을 내놓은 뒤 <b>说定了</b>로 매듭짓습니다. 거절했는데도 상대가 빈손으로 돌아가지 않게 하는 것 — 이것이 이 회차의 기술입니다."

   ck:[["赵哥，活儿归活儿","Zhào gē, huór guī huór"],["可我要是接了","kě wǒ yàoshi jiē le"],["报表那头就交不上去了","bàobiǎo nà tóu jiù jiāo bù shàngqù le"]],
   notes:[{t:"A归A",p:"A guī A",k:"grammar",m:"A는 A대로 (사안과 감정을 갈라 놓기)",tip:"工作归工作，感情归感情. 거절할 때 관계를 지키는 핵심 골격입니다."},
          {t:"交不上去",p:"jiāo bù shàngqù",k:"grammar",m:"(윗선에) 제출하지 못하다",tip:"가능보어에 방향보어가 겹쳤습니다. 上去는 위로 올린다는 방향을 나타냅니다."}]},
  {s:"A",zh:"那你先紧着报表，核对的事你晚两天动手也来得及。",py:"Nà nǐ xiān jǐn zhe bàobiǎo, héduì de shì nǐ wǎn liǎng tiān dòngshǒu yě láidejí.",
   ko:"그럼 보고서를 먼저 챙겨. 대조는 이틀 늦게 손대도 시간 안에 되잖아.",
   ck:[["那你先紧着报表","Nà nǐ xiān jǐn zhe bàobiǎo"],["核对的事你晚两天动手","héduì de shì nǐ wǎn liǎng tiān dòngshǒu"],["也来得及","yě láidejí"]],
   notes:[{t:"紧着",p:"jǐn zhe",k:"word",m:"~을 우선으로 하다",tip:"紧着重要的先做 = 급한 것부터 먼저 하다. 북방 구어에서 특히 자주 씁니다."},
          {t:"来得及",p:"láidejí",k:"grammar",m:"시간 안에 된다 (가능보어 긍정)",tip:"부정은 来不及입니다. 짝으로 외워 두면 일정 이야기가 편해집니다."}]},
  {s:"B",zh:"话是这样，可两头都占着，最后哪头都做不漂亮。",py:"Huà shì zhèyàng, kě liǎng tóu dōu zhàn zhe, zuìhòu nǎ tóu dōu zuò bù piàoliang.",
   ko:"말씀은 그런데요, 양쪽을 다 쥐고 있으면 결국 어느 쪽도 깔끔하게 못 해냅니다.",
   ck:[["话是这样","Huà shì zhèyàng"],["可两头都占着","kě liǎng tóu dōu zhàn zhe"],["最后哪头都做不漂亮","zuìhòu nǎ tóu dōu zuò bù piàoliang"]],
   notes:[{t:"两头",p:"liǎng tóu",k:"word",m:"양쪽, 양다리",tip:"两头忙 / 两头顾. 두 곳을 동시에 감당한다는 뜻입니다."},
          {t:"做不漂亮",p:"zuò bù piàoliang",k:"grammar",m:"깔끔하게 해내지 못하다",tip:"漂亮이 「보기 좋게 잘」이라는 부사처럼 쓰였습니다. 打得漂亮 = 멋지게 해냈다."}]},
  {s:"A",zh:"你这人就是较真。别人早就接了，谁像你想这么多。",py:"Nǐ zhè rén jiù shì jiàozhēn. Biéren zǎo jiù jiē le, shéi xiàng nǐ xiǎng zhème duō.",
   ko:"자네는 참 곧이곧대로야. 남들 같으면 진작 받았지, 누가 자네처럼 이렇게 재나.",
   ck:[["你这人就是较真","Nǐ zhè rén jiù shì jiàozhēn"],["别人早就接了","Biéren zǎo jiù jiē le"],["谁像你想这么多","shéi xiàng nǐ xiǎng zhème duō"]],
   notes:[{t:"较真",p:"jiàozhēn",k:"word",m:"지나치게 따지다",tip:"핀잔이지만 「원칙적이다」는 인정도 섞입니다. 别跟他较真 = 그와 따지지 마라."},
          {t:"谁像你…",p:"shéi xiàng nǐ…",k:"expr",m:"누가 너처럼 ~하냐",tip:"반문으로 가볍게 나무라는 구어입니다. 실제로 답을 원하는 물음이 아닙니다."}]},
  {s:"B",zh:"我不是较真，是不想答应了办不到，那才是真耽误您。",py:"Wǒ bú shì jiàozhēn, shì bù xiǎng dāying le bàn bu dào, nà cái shì zhēn dānwu nín.",
   ko:"따지는 게 아니라, 승낙해 놓고 못 해내기 싫어서예요. 그게 정말로 형님을 그르치는 거죠.",
   ck:[["我不是较真","Wǒ bú shì jiàozhēn"],["是不想答应了办不到","shì bù xiǎng dāying le bàn bu dào"],["那才是真耽误您","nà cái shì zhēn dānwu nín"]],
   notes:[{t:"办不到",p:"bàn bu dào",k:"grammar",m:"해낼 수 없다 (가능보어 부정)",tip:"做不到와 같지만 办이 「일을 처리하다」라 실무에 더 어울립니다."},
          {t:"耽误",p:"dānwu",k:"word",m:"지장을 주다, 그르치다",tip:"耽误时间 / 耽误事. 거절의 이유로 쓰면 「당신을 위해서」라는 명분이 섭니다."}]},
  {s:"A",zh:"行行行，我不为难你。那你说说，这活儿能给谁？",py:"Xíng xíng xíng, wǒ bù wéinán nǐ. Nà nǐ shuōshuo, zhè huór néng gěi shéi?",
   ko:"알았어 알았어, 곤란하게 안 할게. 그럼 말해 봐, 이 일은 누구한테 주면 되겠나?",
   ck:[["行行行，我不为难你","Xíng xíng xíng, wǒ bù wéinán nǐ"],["那你说说","Nà nǐ shuōshuo"],["这活儿能给谁","zhè huór néng gěi shéi"]],
   notes:[{t:"为难",p:"wéinán",k:"word",m:"곤란하게 하다",tip:"我不为难你 = 억지로 시키지 않겠다. 형용사로 쓰면 「난처하다」입니다."},
          {t:"说说",p:"shuōshuo",k:"grammar",m:"동사 중첩 — 좀 말해 봐",tip:"명령을 부드럽게 만듭니다. 두 번째 음절은 경성으로 흘립니다."}]},
  {s:"B",zh:"小李上个月刚做过一版，他手里那套模板现成的，比我快。",py:"Xiǎo Lǐ shàng ge yuè gāng zuò guo yì bǎn, tā shǒu lǐ nà tào múbǎn xiànchéng de, bǐ wǒ kuài.",
   ko:"샤오리가 지난달에 한 판 막 해 봤어요. 그쪽에 양식이 이미 있어서 저보다 빠릅니다.",
   ck:[["小李上个月刚做过一版","Xiǎo Lǐ shàng ge yuè gāng zuò guo yì bǎn"],["他手里那套模板现成的","tā shǒu lǐ nà tào múbǎn xiànchéng de"],["比我快","bǐ wǒ kuài"]],
   notes:[{t:"现成的",p:"xiànchéng de",k:"expr",m:"이미 만들어져 있는 것",tip:"现成的答案 / 现成的模板. 새로 만들 필요가 없다는 뜻입니다."},
          {t:"一版",p:"yì bǎn",k:"measure",m:"(문서·판본) 한 판",tip:"版은 판본을 세는 양사입니다. 3성 앞이라 一은 yì로 읽습니다."}]},
  {s:"A",zh:"小李那人你也知道，答应得快，交东西慢，我催不动。",py:"Xiǎo Lǐ nà rén nǐ yě zhīdào, dāying de kuài, jiāo dōngxi màn, wǒ cuī bu dòng.",
   ko:"샤오리 성격은 자네도 알잖아. 대답은 빠른데 물건은 늦어. 내가 재촉해도 안 움직여.",
   ck:[["小李那人你也知道","Xiǎo Lǐ nà rén nǐ yě zhīdào"],["答应得快，交东西慢","dāying de kuài, jiāo dōngxi màn"],["我催不动","wǒ cuī bu dòng"]],
   notes:[{t:"催不动",p:"cuī bu dòng",k:"grammar",m:"재촉해도 움직이지 않는다",tip:"가능보어 부정입니다. 推不动 / 拉不动처럼 「힘이 먹히지 않는다」를 나타냅니다."},
          {t:"答应得快",p:"dāying de kuài",k:"grammar",m:"승낙은 빠르다 (정도보어)",tip:"동사 + 得 + 형용사로 「어떻게 하는가」를 말합니다. 走得慢 / 说得好."}]},
  {s:"B",zh:"那您把话说在前头，定个交付日子，写在群里，他就赖不掉了。",py:"Nà nín bǎ huà shuō zài qiántou, dìng ge jiāofù rìzi, xiě zài qún lǐ, tā jiù lài bu diào le.",
   ko:"그럼 미리 못을 박으세요. 납기 날짜를 정해서 단톡방에 적어 두면 발뺌하지 못합니다.",
   ck:[["那您把话说在前头","Nà nín bǎ huà shuō zài qiántou"],["定个交付日子","dìng ge jiāofù rìzi"],["写在群里","xiě zài qún lǐ"],["他就赖不掉了","tā jiù lài bu diào le"]],
   notes:[{t:"把话说在前头",p:"bǎ huà shuō zài qiántou",k:"grammar",m:"미리 못 박아 두다 (把자문)",tip:"把자문은 대상을 어디에 어떻게 두는지를 말합니다. 여기서는 「말을 앞에 놓아 둔다」입니다."},
          {t:"赖不掉",p:"lài bu diào",k:"grammar",m:"발뺌할 수 없다",tip:"赖는 「생떼를 쓰다·발뺌하다」입니다. 掉는 「떨쳐 버림」을 나타냅니다."}]},
  {s:"A",zh:"这倒是个办法。你这脑子，怪不得领导什么都愿意交给你。",py:"Zhè dào shì ge bànfǎ. Nǐ zhè nǎozi, guàibude lǐngdǎo shénme dōu yuànyì jiāo gěi nǐ.",
   ko:"그거 방법이네. 자네 머리 좋구먼. 어쩐지 팀장이 뭐든 자네한테 맡기려 하더라니.",
   ck:[["这倒是个办法","Zhè dào shì ge bànfǎ"],["你这脑子","Nǐ zhè nǎozi"],["怪不得领导什么都愿意交给你","guàibude lǐngdǎo shénme dōu yuànyì jiāo gěi nǐ"]],
   notes:[{t:"怪不得",p:"guàibude",k:"expr",m:"어쩐지, 그럴 만도 하다",tip:"원인을 알고 납득했을 때 씁니다. 怪不得他今天这么高兴."},
          {t:"倒是",p:"dào shì",k:"word",m:"오히려, 과연",tip:"예상 밖의 인정에 씁니다. 你倒是说说看 처럼 재촉에도 쓰입니다."}]},
  {s:"B",zh:"您可别捧我，交给我我也得挑着接，不然一样交不出活。",py:"Nín kě bié pěng wǒ, jiāo gěi wǒ wǒ yě děi tiāo zhe jiē, bùrán yíyàng jiāo bu chū huó.",
   ko:"치켜세우지 마세요. 저한테 맡겨도 골라서 받아야지, 안 그러면 마찬가지로 결과물을 못 냅니다.",
   ck:[["您可别捧我","Nín kě bié pěng wǒ"],["交给我我也得挑着接","jiāo gěi wǒ wǒ yě děi tiāo zhe jiē"],["不然一样交不出活","bùrán yíyàng jiāo bu chū huó"]],
   notes:[{t:"捧",p:"pěng",k:"word",m:"치켜세우다",tip:"두 손으로 받쳐 든다는 뜻에서 왔습니다. 别捧我了 = 그만 띄우세요."},
          {t:"挑着接",p:"tiāo zhe jiē",k:"grammar",m:"골라서 받다",tip:"동사 + 着 + 동사로 「~한 상태로 ~하다」를 만듭니다. 笑着说 / 站着吃."}]},
  {s:"A",zh:"明白。那这次就算了，下回有轻省的我第一个想着你。",py:"Míngbai. Nà zhè cì jiù suàn le, xià huí yǒu qīngsheng de wǒ dì yī ge xiǎng zhe nǐ.",
   ko:"알겠네. 그럼 이번은 됐고, 다음에 수월한 게 있으면 제일 먼저 자네를 떠올리지.",
   ck:[["明白","Míngbai"],["那这次就算了","Nà zhè cì jiù suàn le"],["下回有轻省的我第一个想着你","xià huí yǒu qīngsheng de wǒ dì yī ge xiǎng zhe nǐ"]],
   notes:[{t:"就算了",p:"jiù suàn le",k:"expr",m:"그럼 됐다, 없던 일로 하자",tip:"포기와 양보를 함께 담습니다. 算了 하나만으로도 씁니다."},
          {t:"第一个",p:"dì yī ge",k:"pron",m:"첫 번째",tip:"서수의 一은 성조가 바뀌지 않습니다. 第一 / 一月은 언제나 yī입니다."}]},
  {s:"B",zh:"那说定了。报表这两天出完，下周我主动找您问问进度。",py:"Nà shuō dìng le. Bàobiǎo zhè liǎng tiān chū wán, xià zhōu wǒ zhǔdòng zhǎo nín wènwen jìndù.",
   ko:"그럼 그렇게 정한 걸로요. 보고서는 이틀 안에 끝내고, 다음 주에 제가 먼저 진행 상황을 여쭤볼게요.",
   ck:[["那说定了","Nà shuō dìng le"],["报表这两天出完","Bàobiǎo zhè liǎng tiān chū wán"],["下周我主动找您问问进度","xià zhōu wǒ zhǔdòng zhǎo nín wènwen jìndù"]],
   notes:[{t:"说定了",p:"shuō dìng le",k:"expr",m:"그렇게 정했습니다",tip:"구두 합의를 매듭짓는 말입니다. 一言为定도 같은 자리에 씁니다."},
          {t:"主动",p:"zhǔdòng",k:"word",m:"자발적으로, 먼저 나서서",tip:"거절한 뒤에 이 말을 붙이면 관계가 상하지 않습니다. 我主动联系您."}]},
  {s:"A",zh:"那敢情好。其实我也不是非得今天定，就是心里没底。",py:"Nà gǎnqing hǎo. Qíshí wǒ yě bú shì fēiděi jīntiān dìng, jiù shì xīnlǐ méi dǐ.",
   ko:"그럼 더할 나위 없지. 사실 나도 꼭 오늘 정해야 하는 건 아니고, 그냥 마음이 안 놓여서 그랬어.",
   ck:[["那敢情好","Nà gǎnqing hǎo"],["其实我也不是非得今天定","Qíshí wǒ yě bú shì fēiděi jīntiān dìng"],["就是心里没底","jiù shì xīnlǐ méi dǐ"]],
   notes:[{t:"敢情",p:"gǎnqing",k:"word",m:"그거 참 잘됐다 (북방 구어)",tip:"那敢情好 = 그렇다면 더할 나위 없다. 뜻밖의 좋은 소식에 씁니다."},
          {t:"心里没底",p:"xīnlǐ méi dǐ",k:"expr",m:"확신이 서지 않다",tip:"心里有底의 반대입니다. 11일차의 心里有个数와 짝으로 외우세요."}]},
  {s:"B",zh:"早说啊。您把事说清楚，我推不掉的自然会接，藏着反而难办。",py:"Zǎo shuō a. Nín bǎ shì shuō qīngchu, wǒ tuī bu diào de zìrán huì jiē, cáng zhe fǎn'ér nán bàn.",
   ko:"진작 말씀하시지. 사정을 분명히 말해 주시면 제가 못 미룰 일은 당연히 받습니다. 감추면 오히려 처리가 어려워져요.",
   ck:[["早说啊","Zǎo shuō a"],["您把事说清楚","Nín bǎ shì shuō qīngchu"],["我推不掉的自然会接","wǒ tuī bu diào de zìrán huì jiē"],["藏着反而难办","cáng zhe fǎn'ér nán bàn"]],
   notes:[{t:"推不掉",p:"tuī bu diào",k:"grammar",m:"떠밀어 낼 수 없다, 거절할 수 없다",tip:"이 회차의 제목이기도 합니다. 推得掉 / 推不掉로 짝을 이룹니다."},
          {t:"把事说清楚",p:"bǎ shì shuō qīngchu",k:"grammar",m:"일을 분명하게 말하다 (把자문)",tip:"清楚가 결과보어로 붙어 「분명해지도록」을 나타냅니다. 说清楚 / 想清楚."}]}

{
 id:"c2d7", day:14, cat:"직장·오해", level:"HSK 5~6",
 title:"背后的话", titlePy:"bèihòu de huà", titleKo:"뒤에서 도는 말 — 오해를 키우지 않고 푸는 법",
 names:{A:"老孙 (뒷말을 전해 들은 쪽)", B:"小郑 (지목된 쪽)"},
 brief:[
  "직장에서 오해는 대개 <b>말이 옮겨지는 과정</b>에서 생깁니다. 원래 한 말과 전해진 말이 다른데, 당사자는 그 차이를 모른 채 서로를 판단합니다. 그래서 첫 단추는 <b>当面问(면전에서 직접 묻기)</b>입니다.",
  "묻는 쪽의 기술은 <b>비난이 아니라 확인으로 던지는 것</b>입니다. 我听说…, 传到我耳朵里… 처럼 출처를 밝히면 상대가 방어하지 않고 사실부터 말하게 됩니다.",
  "받는 쪽의 기술은 <b>원문을 복원하고, 자기 몫만 인정하는 것</b>입니다. 我原话是…로 사실을 되돌리고, 상대가 상한 부분에는 这点我认으로 좁게 사과합니다. 전부 부인해도, 전부 사과해도 관계는 회복되지 않습니다.",
  "닫을 때는 <b>공개적으로 되짚지 않습니다</b>. 当众翻旧账(여러 사람 앞에서 지난 일 들추기)은 오히려 둘 사이에 일이 있다는 것을 알리는 셈이 됩니다. 조용히 바로잡고 <b>이 자리에서 끝낸다</b>고 선언하는 것이 이 회차의 마무리입니다."
 ],

 title:"离职那天", titlePy:"lízhí nà tiān", titleKo:"퇴사하는 날 — 문을 닫지 않고 떠나기",
 names:{A:"小何 (떠나는 쪽)", B:"陈总 (직속 상사)"},
 brief:[
  "중국 직장에서 퇴사 통보는 <b>결정을 전하는 자리이지 상의하는 자리가 아닙니다</b>. 그래서 흔들리지 않는 말투로 짧게 알리되, 상대의 체면을 세워 주는 순서를 지킵니다 — 시간을 청하고, 결정을 말하고, 이유를 사람 탓으로 돌리지 않습니다.",
  "이유를 말할 때 가장 중요한 것은 <b>跟人没关系(사람 때문이 아니다)</b>입니다. 돈이나 상사 때문이라고 하면 남는 사람들이 상하고, 나중에 돌아올 문도 닫힙니다. 방향이 맞았다는 식으로 <b>더 다투지 않아도 되는 이유</b>를 고릅니다.",
  "상사 쪽의 말도 정해져 있습니다. <b>想清楚就好</b>로 결정을 존중하고, <b>说在前头</b>로 마지막 조언을 답니다. 잘 보내 주는 것이 곧 남은 사람들에게 보내는 메시지이기 때문입니다.",
  "마무리는 <b>인수인계</b>입니다. 走得干净(깔끔하게 떠나다), 不留尾巴(뒤끝을 남기지 않다)가 이 자리의 핵심어입니다. 중국에서 업계는 좁고, <b>圈子就这么大</b>라는 말 그대로 언젠가 다시 마주칩니다."

  {s:"B",zh:"想清楚就好。是待遇的事，还是这边让你憋屈了？",py:"Xiǎng qīngchu jiù hǎo. Shì dàiyù de shì, háishi zhèbiān ràng nǐ biēqu le?",
   ko:"충분히 생각했으면 됐네. 대우 문제인가, 아니면 여기서 답답한 일이 있었나?",
   ck:[["想清楚就好","Xiǎng qīngchu jiù hǎo"],["是待遇的事","Shì dàiyù de shì"],["还是这边让你憋屈了","háishi zhèbiān ràng nǐ biēqu le"]],
   notes:[{t:"想清楚",p:"xiǎng qīngchu",k:"grammar",m:"분명해지도록 생각하다 (결과보어 清楚)",tip:"결정을 존중하는 첫마디로 자주 쓰입니다. 你想清楚了就行."},
          {t:"憋屈",p:"biēqu",k:"word",m:"억울하고 답답하다",tip:"생각을 못 펴고 눌린 상태입니다. 14일차의 憋와 같은 글자에서 왔습니다."}]},
  {s:"A",zh:"都不是。是那边给的方向更对我路子，跟人没关系。",py:"Dōu bú shì. Shì nàbiān gěi de fāngxiàng gèng duì wǒ lùzi, gēn rén méi guānxi.",
   ko:"둘 다 아닙니다. 그쪽이 준 방향이 제 길에 더 맞아서예요. 사람 때문은 아닙니다.",
   ck:[["都不是","Dōu bú shì"],["是那边给的方向更对我路子","Shì nàbiān gěi de fāngxiàng gèng duì wǒ lùzi"],["跟人没关系","gēn rén méi guānxi"]],
   notes:[{t:"对路子",p:"duì lùzi",k:"expr",m:"(방향·방식이) 맞다",tip:"对我的路子 = 내 길에 맞다. 사람이 아니라 방향을 이유로 대는 안전한 표현입니다."},
          {t:"跟人没关系",p:"gēn rén méi guānxi",k:"expr",m:"사람 때문이 아니다",tip:"퇴사 사유를 말할 때 반드시 붙이는 한마디입니다. 남는 사람들의 체면을 지켜 줍니다."}]},
  {s:"B",zh:"这话我信。你这人有什么说什么，藏不住事。",py:"Zhè huà wǒ xìn. Nǐ zhè rén yǒu shénme shuō shénme, cáng bu zhù shì.",
   ko:"그 말은 믿네. 자네는 있는 대로 말하는 사람이라 뭘 숨기질 못하지.",
   ck:[["这话我信","Zhè huà wǒ xìn"],["你这人有什么说什么","Nǐ zhè rén yǒu shénme shuō shénme"],["藏不住事","cáng bu zhù shì"]],
   notes:[{t:"有什么说什么",p:"yǒu shénme shuō shénme",k:"grammar",m:"있는 대로 다 말하다",tip:"같은 의문사를 앞뒤에 놓는 호응 구문입니다. 想吃什么吃什么."},
          {t:"藏不住",p:"cáng bu zhù",k:"grammar",m:"숨기지 못하다 (가능보어 부정)",tip:"藏得住 / 藏不住. 사람의 성격을 말할 때 즐겨 씁니다."}]},
  {s:"A",zh:"这三年我学的东西，比之前五年加起来都多，这话不是客套。",py:"Zhè sān nián wǒ xué de dōngxi, bǐ zhīqián wǔ nián jiā qǐlái dōu duō, zhè huà bú shì kètào.",
   ko:"여기서 3년 동안 배운 게 그 전 5년을 합친 것보다 많습니다. 빈말이 아니고요.",
   ck:[["这三年我学的东西","Zhè sān nián wǒ xué de dōngxi"],["比之前五年加起来都多","bǐ zhīqián wǔ nián jiā qǐlái dōu duō"],["这话不是客套","zhè huà bú shì kètào"]],
   notes:[{t:"加起来",p:"jiā qǐlái",k:"grammar",m:"합쳐서 (방향보어 起来)",tip:"起来가 「모아 올리다」의 뜻으로 쓰였습니다. 算起来 / 看起来와 같은 계열입니다."},
          {t:"客套",p:"kètào",k:"word",m:"빈말, 겉치레 인사",tip:"不是客套 = 인사치레가 아니다. 진심임을 못 박는 한마디입니다."}]},
  {s:"B",zh:"那我就受着。不过有句话我得说在前头，你别嫌我啰嗦。",py:"Nà wǒ jiù shòu zhe. Búguò yǒu jù huà wǒ děi shuō zài qiántou, nǐ bié xián wǒ luōsuo.",
   ko:"그럼 그 말은 받겠네. 그런데 미리 해 둘 말이 하나 있는데, 잔소리라고 여기지는 말게.",
   ck:[["那我就受着","Nà wǒ jiù shòu zhe"],["不过有句话我得说在前头","Búguò yǒu jù huà wǒ děi shuō zài qiántou"],["你别嫌我啰嗦","nǐ bié xián wǒ luōsuo"]],
   notes:[{t:"说在前头",p:"shuō zài qiántou",k:"expr",m:"미리 말해 두다",tip:"13일차의 把话说在前头와 같은 자리입니다. 조언과 경고 양쪽에 씁니다."},
          {t:"嫌",p:"xián",k:"word",m:"싫어하다, 흠으로 여기다",tip:"嫌麻烦 / 嫌贵 / 嫌我啰嗦. 「~라고 여겨 꺼리다」라는 뜻입니다."}]},
  {s:"A",zh:"您说，我听着呢。这种话往后想听都没地方听了。",py:"Nín shuō, wǒ tīng zhe ne. Zhè zhǒng huà wǎnghòu xiǎng tīng dōu méi dìfang tīng le.",
   ko:"말씀하세요, 듣고 있습니다. 이런 말은 앞으로 듣고 싶어도 들을 데가 없어요.",
   ck:[["您说，我听着呢","Nín shuō, wǒ tīng zhe ne"],["这种话往后想听都没地方听了","Zhè zhǒng huà wǎnghòu xiǎng tīng dōu méi dìfang tīng le"]],
   notes:[{t:"听着呢",p:"tīng zhe ne",k:"grammar",m:"듣고 있습니다 (지속상 着 + 呢)",tip:"着와 呢가 함께 오면 「지금 그러고 있는 중」이 또렷해집니다."},
          {t:"想…都没地方…",p:"xiǎng… dōu méi dìfang…",k:"grammar",m:"~하고 싶어도 ~할 데가 없다",tip:"아쉬움을 담은 과장 표현입니다. 想买都没地方买."}]},
  {s:"B",zh:"新地方头三个月别急着表现，先把人和事摸清楚。",py:"Xīn dìfang tóu sān ge yuè bié jí zhe biǎoxiàn, xiān bǎ rén hé shì mō qīngchu.",
   ko:"새 직장에서 첫 석 달은 성과를 보이려 서두르지 말게. 사람과 일을 먼저 파악해.",
   ck:[["新地方头三个月别急着表现","Xīn dìfang tóu sān ge yuè bié jí zhe biǎoxiàn"],["先把人和事摸清楚","xiān bǎ rén hé shì mō qīngchu"]],
   notes:[{t:"头三个月",p:"tóu sān ge yuè",k:"expr",m:"첫 석 달",tip:"头 + 수량은 「처음 ~」입니다. 头一次 / 头两年."},
          {t:"把…摸清楚",p:"bǎ… mō qīngchu",k:"grammar",m:"~을 더듬어 파악하다 (把자문)",tip:"摸는 손으로 더듬는다는 뜻에서 「탐색하다」로 확장됐습니다. 摸底 / 摸清情况."}]},
  {s:"A",zh:"这我记下了。以前我就吃过这个亏，上来就把话说满。",py:"Zhè wǒ jì xià le. Yǐqián wǒ jiù chī guo zhège kuī, shàng lái jiù bǎ huà shuō mǎn.",
   ko:"적어 두겠습니다. 예전에 그걸로 손해를 봤어요. 시작부터 말을 꽉 채워 버려서요.",
   ck:[["这我记下了","Zhè wǒ jì xià le"],["以前我就吃过这个亏","Yǐqián wǒ jiù chī guo zhège kuī"],["上来就把话说满","shàng lái jiù bǎ huà shuō mǎn"]],
   notes:[{t:"吃亏",p:"chī kuī",k:"expr",m:"손해를 보다",tip:"吃过这个亏 = 이걸로 데어 봤다. 경험에서 얻은 교훈을 말할 때 씁니다."},
          {t:"把话说满",p:"bǎ huà shuō mǎn",k:"grammar",m:"말을 꽉 채워 여지를 없애다 (把자문)",tip:"别把话说满 = 단언하지 마라. 여지를 남기라는 실무 조언의 정석입니다."}]},
  {s:"B",zh:"记住就好。还有，交接你别糊弄，走得干净以后才好见面。",py:"Jì zhù jiù hǎo. Háiyǒu, jiāojiē nǐ bié hùnong, zǒu de gānjìng yǐhòu cái hǎo jiànmiàn.",
   ko:"기억하면 됐네. 그리고 인수인계는 대충 넘기지 말게. 깔끔하게 떠나야 나중에 얼굴 보기 좋지.",
   ck:[["记住就好","Jì zhù jiù hǎo"],["还有，交接你别糊弄","Háiyǒu, jiāojiē nǐ bié hùnong"],["走得干净以后才好见面","zǒu de gānjìng yǐhòu cái hǎo jiànmiàn"]],
   notes:[{t:"糊弄",p:"hùnong",k:"word",m:"대충 얼버무려 넘기다",tip:"일과 사람 양쪽에 씁니다. 别糊弄我 = 나를 속이려 들지 마라."},
          {t:"走得干净",p:"zǒu de gānjìng",k:"expr",m:"깔끔하게 떠나다",tip:"정도보어입니다. 뒷말이 남지 않게 마무리한다는 뜻입니다."}]},
  {s:"A",zh:"交接清单我列好了，下周一开始带人，保证不留尾巴。",py:"Jiāojiē qīngdān wǒ liè hǎo le, xià zhōuyī kāishǐ dài rén, bǎozhèng bù liú wěiba.",
   ko:"인수인계 목록은 다 작성했습니다. 다음 주 월요일부터 사람을 붙여 가르치고요, 뒤끝은 남기지 않겠습니다.",
   ck:[["交接清单我列好了","Jiāojiē qīngdān wǒ liè hǎo le"],["下周一开始带人","xià zhōuyī kāishǐ dài rén"],["保证不留尾巴","bǎozhèng bù liú wěiba"]],
   notes:[{t:"带人",p:"dài rén",k:"expr",m:"사람을 데리고 가르치다",tip:"带新人 = 신입을 붙여 키우다. 教보다 실무적인 말입니다."},
          {t:"留尾巴",p:"liú wěiba",k:"expr",m:"뒤끝·미결 사항을 남기다",tip:"꼬리를 남긴다는 비유입니다. 别留尾巴 = 매듭을 다 지어라."}]},
  {s:"B",zh:"这才像你。说实话，你走了我这边一时半会儿还真补不上。",py:"Zhè cái xiàng nǐ. Shuō shíhuà, nǐ zǒu le wǒ zhèbiān yìshíbànhuìr hái zhēn bǔ bu shàng.",
   ko:"그래야 자네답지. 솔직히 자네가 가면 우리 쪽은 당분간 정말 메우기 어려워.",
   ck:[["这才像你","Zhè cái xiàng nǐ"],["说实话","Shuō shíhuà"],["你走了我这边一时半会儿还真补不上","nǐ zǒu le wǒ zhèbiān yìshíbànhuìr hái zhēn bǔ bu shàng"]],
   notes:[{t:"一时半会儿",p:"yìshíbànhuìr",k:"expr",m:"당분간, 금방은",tip:"부정문과 짝을 이룹니다. 一时半会儿好不了 = 금방은 낫지 않는다."},
          {t:"补不上",p:"bǔ bu shàng",k:"grammar",m:"메울 수 없다 (가능보어 부정)",tip:"빈자리를 채운다는 뜻입니다. 补得上 / 补不上."}]},
  {s:"A",zh:"您这么说我更不好意思了。有需要您随时找我，别客气。",py:"Nín zhème shuō wǒ gèng bù hǎoyìsi le. Yǒu xūyào nín suíshí zhǎo wǒ, bié kèqi.",
   ko:"그렇게 말씀하시니 더 송구합니다. 필요하시면 언제든 연락 주세요, 사양하지 마시고요.",
   ck:[["您这么说我更不好意思了","Nín zhème shuō wǒ gèng bù hǎoyìsi le"],["有需要您随时找我","Yǒu xūyào nín suíshí zhǎo wǒ"],["别客气","bié kèqi"]],
   notes:[{t:"随时",p:"suíshí",k:"word",m:"언제든지",tip:"随时联系 / 随时可以. 시점을 열어 두는 말이라 이별 인사에 잘 어울립니다."},
          {t:"别客气",p:"bié kèqi",k:"culture",m:"사양하지 마세요",tip:"감사에 답하는 말로만 알기 쉽지만, 이렇게 「부담 갖지 말라」는 뜻으로도 씁니다."}]},
  {s:"B",zh:"这话我记着。圈子就这么大，说不定哪天又转回来了。",py:"Zhè huà wǒ jì zhe. Quānzi jiù zhème dà, shuōbudìng nǎ tiān yòu zhuǎn huílái le.",
   ko:"그 말 새겨 두지. 업계가 이렇게 좁으니, 어느 날 다시 돌아올지도 모르는 일이고.",
   ck:[["这话我记着","Zhè huà wǒ jì zhe"],["圈子就这么大","Quānzi jiù zhème dà"],["说不定哪天又转回来了","shuōbudìng nǎ tiān yòu zhuǎn huílái le"]],
   notes:[{t:"圈子就这么大",p:"quānzi jiù zhème dà",k:"expr",m:"업계가 이렇게 좁다",tip:"함부로 관계를 끊지 말라는 뜻으로 씁니다. 중국 직장 대화의 단골 문장입니다."},
          {t:"说不定",p:"shuōbudìng",k:"word",m:"어쩌면, 모르는 일이다",tip:"也许보다 구어적입니다. 뒤에 절이 통째로 옵니다."}]},
  {s:"A",zh:"那我可就当您留了门。真回来您可别嫌我脸皮厚。",py:"Nà wǒ kě jiù dàng nín liú le mén. Zhēn huílái nín kě bié xián wǒ liǎnpí hòu.",
   ko:"그럼 문을 열어 두신 걸로 알겠습니다. 정말 돌아오면 낯 두껍다고 하지 마세요.",
   ck:[["那我可就当您留了门","Nà wǒ kě jiù dàng nín liú le mén"],["真回来您可别嫌我脸皮厚","Zhēn huílái nín kě bié xián wǒ liǎnpí hòu"]],
   notes:[{t:"当…",p:"dàng…",k:"grammar",m:"~인 셈 치다",tip:"当은 dàng으로 읽습니다. 就当没听见 = 못 들은 셈 치다."},
          {t:"脸皮厚",p:"liǎnpí hòu",k:"expr",m:"낯이 두껍다",tip:"농담으로 자기를 낮출 때 쓰면 분위기가 부드러워집니다. 我脸皮厚，你别介意."}]},
  {s:"B",zh:"门一直开着。最后一句：走可以，别把人情走断了。",py:"Mén yìzhí kāi zhe. Zuìhòu yí jù: zǒu kěyǐ, bié bǎ rénqíng zǒu duàn le.",
   ko:"문은 늘 열려 있네. 마지막으로 한마디, 떠나는 건 괜찮지만 인연까지 끊고 가지는 말게.",
   ck:[["门一直开着","Mén yìzhí kāi zhe"],["最后一句：走可以","Zuìhòu yí jù: zǒu kěyǐ"],["别把人情走断了","bié bǎ rénqíng zǒu duàn le"]],
   notes:[{t:"把…走断了",p:"bǎ… zǒu duàn le",k:"grammar",m:"~을 끊어 버리다 (把자문 + 결과보어)",tip:"断이 결과보어로 붙어 「끊어진 상태로 만들다」가 됩니다. 把关系搞僵了와 같은 구조입니다."},
          {t:"人情",p:"rénqíng",k:"culture",m:"사람 사이에 오간 정과 신세",tip:"중국의 인간관계를 이해하는 핵심어입니다. 欠人情 = 신세를 지다."}]},
  {s:"A",zh:"记住了。人情这东西，走的时候最容易断，我不让它断。",py:"Jì zhù le. Rénqíng zhè dōngxi, zǒu de shíhou zuì róngyì duàn, wǒ bú ràng tā duàn.",
   ko:"기억하겠습니다. 인연이란 게 떠날 때 가장 끊어지기 쉬운데, 저는 끊기지 않게 하겠습니다.",
   ck:[["记住了","Jì zhù le"],["人情这东西，走的时候最容易断","Rénqíng zhè dōngxi, zǒu de shíhou zuì róngyì duàn"],["我不让它断","wǒ bú ràng tā duàn"]],
   notes:[{t:"…这东西",p:"… zhè dōngxi",k:"grammar",m:"~라는 것은",tip:"추상적인 것을 손에 잡히는 물건처럼 말해 친근하게 만듭니다. 感情这东西."},
          {t:"不让它断",p:"bú ràng tā duàn",k:"grammar",m:"끊어지게 두지 않겠다",tip:"让 + 대상 + 동사의 사역입니다. 앞에 부정을 붙이면 「그렇게 되게 두지 않겠다」입니다."}]},
  {s:"B",zh:"那就这样。下周办完手续，我叫上老几位，给你送个行。",py:"Nà jiù zhèyàng. Xià zhōu bàn wán shǒuxù, wǒ jiào shàng lǎo jǐ wèi, gěi nǐ sòng ge xíng.",
   ko:"그럼 그렇게 하지. 다음 주에 절차 끝나면 예전 사람들 몇 불러서 송별회 해 주겠네.",
   ck:[["那就这样","Nà jiù zhèyàng"],["下周办完手续","Xià zhōu bàn wán shǒuxù"],["我叫上老几位，给你送个行","wǒ jiào shàng lǎo jǐ wèi, gěi nǐ sòng ge xíng"]],
   notes:[{t:"叫上",p:"jiào shàng",k:"grammar",m:"(사람을) 불러 함께 데려가다",tip:"上이 「합류시킴」을 나타냅니다. 叫上他一起去."},
          {t:"送个行",p:"sòng ge xíng",k:"expr",m:"송별을 해 주다",tip:"送行 사이에 个를 끼워 가볍게 만들었습니다. 送行은 sòngxíng으로 읽습니다."}]}
 ],

/* ---------- 병음: 음절 분리 + 성조 색 ---------- */
const TONE_MAP = {
  "ā":["a",1],"á":["a",2],"ǎ":["a",3],"à":["a",4],
  "ē":["e",1],"é":["e",2],"ě":["e",3],"è":["e",4],
  "ī":["i",1],"í":["i",2],"ǐ":["i",3],"ì":["i",4],
  "ō":["o",1],"ó":["o",2],"ǒ":["o",3],"ò":["o",4],
  "ū":["u",1],"ú":["u",2],"ǔ":["u",3],"ù":["u",4],
  "ǖ":["ü",1],"ǘ":["ü",2],"ǚ":["ü",3],"ǜ":["ü",4],
  "ń":["n",2],"ň":["n",3],"ǹ":["n",4]
};
const INITIALS = ["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w"];
const FINALS = ["iang","iong","uang","ueng","üan","uai","uan","ian","iao","ing","ong","eng","ang",
  "van","iu","ie","ia","in","un","ün","vn","ua","uo","ui","ue","üe","ve","ai","ei","ao","ou","an","en","er","ng",
  "a","o","e","i","u","ü","v"];
function plainOf(tok){
  let plain="", tones=[];
  for(const ch of tok){
    const m = TONE_MAP[ch.toLowerCase()];
    if(m){ plain += (ch===ch.toLowerCase()? m[0] : m[0].toUpperCase()); tones.push([plain.length-1, m[1]]); }
    else plain += ch;
  }
  return {plain, tones};
}
function splitSyllables(tok){
  const {plain, tones} = plainOf(tok);
  const low = plain.toLowerCase();
  if(!/^[a-zü]+$/.test(low)) return [{text:tok, tone:-1}];
  if(!tones.length && /[A-Z]/.test(tok)) return [{text:tok, tone:-1}];
  const cuts=[]; let i=0, guard=0;
  while(i<low.length && guard++<40){
    let st=i;
    for(const ini of INITIALS){ if(low.startsWith(ini,i)){ i+=ini.length; break; } }
    let matched=false;
    for(const f of FINALS){ if(low.startsWith(f,i)){ i+=f.length; matched=true; break; } }
    if(!matched){ i=st+1; }
    if(low[i]==="r" && i===low.length-1) i++;
    if(i<=st){ i=st+1; }
    cuts.push([st,i]);
  }
  if(!cuts.length) return [{text:tok, tone:-1}];
  return cuts.map(([a,b])=>{
    let tone = 0;
    tones.forEach(([idx,t])=>{ if(idx>=a && idx<b) tone=t; });
    return {text: tok.slice(a,b), tone};
  });
}
function pyHTML(s){
  if(!s) return "";
  return String(s).split(/(\s+|[,.;:?!'’，。？！、…]+)/).map(tok=>{
    if(!tok) return "";
    if(/^(\s+|[,.;:?!'’，。？！、…]+)$/.test(tok)) return esc(tok);
    return splitSyllables(tok).map(sy=>
      sy.tone<0 ? esc(sy.text) : '<span class="t'+sy.tone+'">'+esc(sy.text)+'</span>').join("");
  }).join("");
}
function pyBox(s, cls){ return '<span class="py '+(cls||"")+'">'+pyHTML(s)+'</span>'; }

/* ---------- 음성 (TTS) ---------- */
let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^zh(-|_|$)/i.test(v.lang) || /chinese|中文|普通话|mandarin/i.test(v.name));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const cn = VOICES.filter(x=>/zh-CN|zh_CN/i.test(x.lang));
    const pool = cn.length? cn : VOICES;
    const f = pool.filter(x=>/xiaoxiao|huihui|yaoyao|female|xiaoyi|xiaochen|晓/i.test(x.name));
    const m = pool.filter(x=>/yunxi|kangkang|male|yunyang|yunjian|云/i.test(x.name));
    v = who==="B" ? (m[0]||pool[1]||pool[0]) : (f[0]||pool[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null, rpTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; rpTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="zh-CN";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.06;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].zh, items[i].s, rate, ()=>{ i++; setTimeout(step, 280); });
  })();
}

/* ---------- 새 회차 자동 반영 ----------
   서비스워커가 새 본문을 받아 두면 여기에 표시해 둔다. 훈련 중이거나
   자료를 붙여넣는 중에 화면을 새로 고치면 하던 것이 날아가므로,
   그 두 자리에서만 기다렸다가 빠져나오는 순간 알아서 갈아 끼운다. */
let pendingUpdate = false;
function applyUpdate(){
  if(!pendingUpdate) return;
  if(cur.view==="session" || cur.view==="add") return;
  pendingUpdate = false;
  location.reload();
}

function startSession(id, resume){
  stopSpeak();
  const sp = (resume && S.spot && S.spot.dayId===id) ? S.spot : null;
  cur.dayId=id; cur.showKo=S.cfg.showKo;
  cur.step = sp ? Math.max(0, Math.min(sp.step, STEPS.length-1)) : 0;
  cur.line = sp ? Math.max(0, sp.line||0) : 0;
  const dd = dayById(id); if(dd) cur.line = Math.min(cur.line, dd.lines.length-1);
  cur.reps = (S.prog[id]&&S.prog[id].reps) ? S.prog[id].reps : {};
  cur.t0 = Date.now();
  clearInterval(cur.tick); cur.tick = setInterval(updClock, 1000);
  go("session");
}
function elapsedMin(){ return Math.max(0, Math.round((Date.now()-cur.t0)/60000)); }
function updClock(){
  const el = $("#clock"); if(!el) return;
  const s = Math.floor((Date.now()-cur.t0)/1000);
  el.textContent = pad(Math.floor(s/60))+":"+pad(s%60);
  el.classList.toggle("over", s>SESS_MIN*60);
}
function endSession(){ clearInterval(cur.tick); stopSpeak(); }

  cur.view=v;

  $("#view-"+v).classList.add("on");
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.view===v));
  window.scrollTo(0,0);

function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};
}

  h += '<div id="stepbody"></div>';
  $("#view-session").innerHTML = h;
  updClock();
  ({listen:stepListen, shadow:stepShadow, output:stepOutput})[st.k](d);
  renderFoot(d);
  bindPyClick();
}
function renderFoot(d){
  const last = cur.step===STEPS.length-1;
  let h = '<button class="btn ghost sm" id="fPrev" title="이전 단계">←</button>';
  h += '<span class="sub" style="font-size:12px">'+(cur.step+1)+'/'+STEPS.length+'</span>';
  h += '<span style="flex:1"></span>';
  h += '<button class="btn ghost sm" id="fSave">📌 여기까지 저장</button>';
  h += '<button class="btn '+(last?"blue":"")+'" id="fNext">'+(last?"훈련 완료 ✓":"다음 →")+'</button>';
  $("#footin").innerHTML = h;
  $("#fPrev").onclick = ()=>{ if(cur.step>0){ stopSpeak(); cur.step--; renderSession(); } };
  $("#fSave").onclick = saveAndExit;
  $("#fNext").onclick = ()=>{
    stopSpeak();
    if(cur.step<STEPS.length-1){ cur.step++; renderSession(); }
    else finishSession(d);
  };
  $("#fPrev").disabled = cur.step===0;
}
/* ---------- 여기까지 하고 저장 ----------
   20분을 한 자리에서 다 내지 못하는 날이 많다. 어디까지 했는지 적어 두고,
   다음에 열면 홈의 「이어서 하기」로 그 단계, 그 문장에서 다시 시작한다.
   따라 읽을 때마다(bumpRep) 불리므로 자리는 늘 최신이다. */
function saveProgress(){
  if(!cur.dayId) return false;
  const p = S.prog[cur.dayId] || {};
  p.reps = cur.reps; p.stepIdx = cur.step;
  S.prog[cur.dayId] = p;
  /* 한 번 끝낸 회차를 다시 볼 때도 자리는 남긴다.
     복습하다 멈추는 일이 오히려 더 잦다. */
  S.spot = { dayId:cur.dayId, step:cur.step, line:cur.line, at:Date.now() };
  save();
  return true;
}
function saveAndExit(){
  /* 저장했다고 말만 하고 안 남으면 다음에 열었을 때 사람만 헛걸음한다.
     실제로 적혔는지 읽어 보고 나서 알린다. */
  const kept = saveProgress() && store.get("spot", null);
  toast(kept ? "여기까지 저장했습니다. 다음에 열면 이어집니다."
             : "저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.");
  go("home");
}
/* 버튼을 누르지 않고 그냥 화면을 덮거나 앱을 내려도 자리를 잃지 않게 한다 */
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && cur.view==="session") saveProgress(); });
window.addEventListener("pagehide", ()=>{ if(cur.view==="session") saveProgress(); });
function finishSession(d){
  const p = S.prog[d.id] || {}; p.reps=cur.reps; p.done=true; p.doneAt=today(); S.prog[d.id]=p;
  /* 끝낸 회차의 자리만 지운다. 다른 회차에 멈춰 둔 자리는 그대로 둔다. */
  if(S.spot && S.spot.dayId===d.id) S.spot=null;
  const t = today(); const prev = S.log[t] || {min:0, lines:0};
  const repLines = Object.keys(cur.reps).filter(k=>cur.reps[k]>0).length;
  S.log[t] = { dayId:d.id, min: prev.min + Math.max(1, elapsedMin()), lines: prev.lines + repLines, ts: Date.now() };
  save(); endSession();
  const info = streakInfo();
  $("#view-session").innerHTML =
    '<div class="hd" style="margin-top:30px"><small>Session complete</small>오늘 훈련 완료</div>'+
    '<div class="card"><div class="hz" style="font-size:26px">'+esc(d.title)+'</div>'+
    '<div class="sub" style="margin:6px 0 14px">'+esc(d.titleKo)+'</div>'+
    '<div class="streak"><div><b>'+elapsedMin()+'</b><span>오늘 분</span></div><div><b>'+repLines+'</b><span>따라 읽은 문장</span></div>'+
    '<div><b>'+info.streak+'</b><span>연속일</span></div></div>'+
    '<div class="rule"></div><div class="sub">내일 첫 단계에서 오늘 표현 8개를 다시 물어봅니다. 그때 <b>병음을 보지 말고</b> 소리부터 내 보세요.</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="cHome">홈으로</button>'+
    '<button class="btn ghost" id="cBank">단어장에서 복습</button></div></div>';
  $("#footbar").classList.remove("on");
  $("#cHome").onclick=()=>go("home"); $("#cBank").onclick=()=>go("bank");
}

/* --- step 1 : 복습 --- */
function bindBlur(){
  document.querySelectorAll(".blurme").forEach(el=>{ if(el._bb) return; el._bb=1;
    el.addEventListener("click", ()=> el.classList.toggle("show")); });
}
function bindPlay(){
  document.querySelectorAll(".rv").forEach(b=> b.onclick = e=>{ e.stopPropagation(); speak(b.dataset.t, "A", S.cfg.rate); });
}

/* --- step 2 : 단어·표현 --- */
/* --- step 3 : 통으로 듣기 --- */
function stepListen(d){
  let h = '<div class="card"><div class="row" style="margin-bottom:6px">'+
    '<button class="btn" id="playAll">전체 재생 ▶</button>'+
    '<button class="btn ghost sm" id="stopAll">정지 ■</button>'+

    speedBar("lsSpeed")+'</div>'+
    '<div class="sub">문장을 누르면 그 줄만 다시 들을 수 있습니다. 지금은 <b>따라 읽지 말고</b> 흐름과 성조만 잡으세요.</div>'+
    '<div class="rule"></div><div id="script">'+d.lines.map((l,i)=>lineHTML(l,i)).join("")+'</div></div>';

  $("#koTog").onclick = ()=>{ cur.showKo=!cur.showKo; stepListen(d); };
  $("#stopAll").onclick = ()=> stopSpeak();
  $("#playAll").onclick = ()=>{
    speakSeq(d.lines, S.cfg.rate, i=>{
      document.querySelectorAll("#script .sline").forEach(e=>e.classList.remove("now"));
      const el = document.querySelector('#script .sline[data-i="'+i+'"]');
      if(el){ el.classList.add("now"); el.scrollIntoView({block:"center", behavior:"smooth"}); }

  });
}
function lineHTML(l,i){
  return '<div class="sline '+(l.s==="B"?"b":"")+'" data-i="'+i+'"><div class="sp">'+l.s+'</div>'+
    '<div><span class="zh">'+esc(l.zh)+'</span>'+pyBox(l.py)+

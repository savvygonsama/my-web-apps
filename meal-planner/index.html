<title>이번 주 식탁</title>

<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --surface-3:#EAEFED;
  --ink:#14211E; --ink-2:#4A5C58; --ink-3:#7F908C;
  --line:#DBE3E0; --line-2:#C3CFCB;
  --accent:#0D6B5C; --on-accent:#FFFFFF; --accent-soft:#DBEDE7;
  --warm:#A8501C; --warm-soft:#F5E5D9;
  --mb:#B8860B; --ml:#2E8B78; --md:#3D5DA6; --ms:#8E5AA6; --mn:#5F7079;
  --shadow:0 1px 2px rgba(20,33,30,.05), 0 8px 24px -12px rgba(20,33,30,.18);
  --radius:10px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono","D2Coding",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#18201E; --surface-2:#1D2724; --surface-3:#232E2B;
    --ink:#E7EDEA; --ink-2:#A5B4B0; --ink-3:#7C8D89;
    --line:#2A3532; --line-2:#3B4945;
    --accent:#4FC7AC; --on-accent:#07201B; --accent-soft:#16332C;
    --warm:#E09A69; --warm-soft:#32241B;
    --mb:#DDB652; --ml:#5FC0A9; --md:#849FE2; --ms:#C08ED4; --mn:#93A5AE;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18201E; --surface-2:#1D2724; --surface-3:#232E2B;
  --ink:#E7EDEA; --ink-2:#A5B4B0; --ink-3:#7C8D89;
  --line:#2A3532; --line-2:#3B4945;
  --accent:#4FC7AC; --on-accent:#07201B; --accent-soft:#16332C;
  --warm:#E09A69; --warm-soft:#32241B;
  --mb:#DDB652; --ml:#5FC0A9; --md:#849FE2; --ms:#C08ED4; --mn:#93A5AE;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; font-size:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

.wrap{max-width:1280px; margin:0 auto; padding:22px 20px 64px}

/* ---------- header ---------- */
.top{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px;
  padding-bottom:16px; margin-bottom:22px; border-bottom:1px solid var(--line-2);
}
.brand h1{
  margin:0; font-size:29px; font-weight:800; letter-spacing:-.035em; line-height:1.1;
}
.brand p{margin:5px 0 0; color:var(--ink-2); font-size:13.5px}
.top-actions{display:flex; flex-wrap:wrap; gap:8px; margin-left:auto}

.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:9px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px;
  transition:background .12s, border-color .12s, transform .06s;
}
.btn:hover{background:var(--surface-3); border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-main{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-main:hover{background:var(--accent); border-color:var(--accent); filter:brightness(1.08)}
.btn-sm{padding:5px 10px; font-size:12.5px; font-weight:600}

/* ---------- layout ---------- */
.cols{display:grid; grid-template-columns:296px minmax(0,1fr); gap:26px; align-items:start}

/* ---------- filter rail ---------- */
.rail{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); position:sticky; top:16px;
  max-height:calc(100vh - 32px); overflow:auto;
}
.rail-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--surface); z-index:2;
}
.rail-head strong{font-size:15px; letter-spacing:-.02em}
.rail-body{padding:6px 16px 18px}

.grp{padding:14px 0; border-bottom:1px dashed var(--line)}
.grp:last-child{border-bottom:0}
.grp-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:9px}
.grp-name{
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3);
}
.grp-hint{font-size:11.5px; color:var(--ink-3); margin:-4px 0 9px; line-height:1.45}
.grp-clear{
  background:none; border:0; padding:0; cursor:pointer; font-size:11.5px; color:var(--accent);
  font-weight:600; text-decoration:underline; text-underline-offset:2px;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-2);
  padding:5px 10px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
  transition:background .12s, color .12s, border-color .12s;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip[aria-pressed="true"]{
  background:var(--accent); border-color:var(--accent); color:var(--on-accent);
}
.chip-w[aria-pressed="true"]{background:var(--warm); border-color:var(--warm); color:#fff}
.chip.ex[aria-pressed="true"]{
  background:var(--warm-soft); border-color:var(--warm); color:var(--warm);
  text-decoration:line-through; text-decoration-thickness:1.5px;
}
.chip.ex[aria-pressed="true"]::after{content:" ✕"; font-size:10px; text-decoration:none}

.modesw{display:flex; border:1px solid var(--line-2); border-radius:6px; overflow:hidden}
.modesw button{
  border:0; background:var(--surface-2); color:var(--ink-3); cursor:pointer;
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.02em; padding:3px 7px;
}
.modesw button + button{border-left:1px solid var(--line-2)}
.modesw button.on{background:var(--accent); color:var(--on-accent)}
.modesw button.on[data-mv="ex"]{background:var(--warm); color:#fff}

/* ---------- match bar ---------- */
.matchbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--accent-soft); border:1px solid var(--line);
  border-radius:var(--radius); padding:11px 14px; margin-bottom:16px;
}
.matchbar .n{font-family:var(--mono); font-weight:700; font-size:19px; letter-spacing:-.02em}
.matchbar p{margin:0; font-size:13.5px; color:var(--ink-2)}
.matchbar.warn{background:var(--warm-soft)}
.matchbar.warn .n{color:var(--warm)}

/* ---------- plan ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; margin-bottom:22px;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:13px 16px; border-bottom:1px solid var(--line); background:var(--surface-2);
}
.panel-head h2{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.02em}
.panel-head .sub{font-size:12.5px; color:var(--ink-3); font-family:var(--mono)}
.panel-head .note{
  margin-left:6px; font-size:12px; font-weight:600; color:var(--accent);
  letter-spacing:0; vertical-align:1px;
}

.scroller{overflow-x:auto}
.plan{width:100%; border-collapse:collapse; min-width:940px}
.plan th, .plan td{border:1px solid var(--line); padding:0; vertical-align:top}
.plan thead th{
  background:var(--surface-2); padding:9px 10px; text-align:center;
  font-size:13px; font-weight:700; letter-spacing:.01em; color:var(--ink-2);
}
.plan thead th.today{color:var(--accent)}
.plan thead th .dnum{display:block; font-family:var(--mono); font-size:11px; color:var(--ink-3); font-weight:600}
.rowlab{
  width:74px; background:var(--surface-2); text-align:center; vertical-align:middle;
  font-size:13px; font-weight:700; padding:8px 4px;
}
.rowlab span{display:block; border-left:3px solid var(--mc); padding-left:6px; text-align:left}

.cell{position:relative; width:calc((100% - 74px)/7)}
.cellbox{
  display:flex; flex-direction:column; gap:1px; min-height:76px;
  border-left:3px solid var(--mc); padding:5px 5px 5px 4px;
}
.cellempty{
  flex:1; width:100%; text-align:left; background:transparent; border:0; cursor:pointer;
  color:var(--ink-3); font-size:13px; font-weight:500; padding:5px; border-radius:6px;
}
.cellempty:hover{background:var(--surface-3); color:var(--ink-2)}
.item{
  display:block; width:100%; text-align:left; background:transparent; border:0;
  cursor:pointer; padding:4px 5px; border-radius:6px; transition:background .12s;
}
.item:hover{background:var(--surface-3)}
.item .role{
  display:inline-block; font-family:var(--mono); font-size:9.5px; font-weight:700;
  letter-spacing:.04em; padding:0 4px; border-radius:3px; margin-right:4px;
  vertical-align:1px; background:var(--surface-3); border:1px solid var(--line); color:var(--ink-3);
}
.item .role.r-국{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.item .role.r-메인{background:var(--warm-soft); border-color:var(--warm); color:var(--warm)}
.item .nm{font-size:13px; font-weight:650; line-height:1.35; letter-spacing:-.01em; word-break:keep-all}
.item .nm.custom{color:var(--warm)}
.item .tm{margin-left:4px; font-family:var(--mono); font-size:10px; color:var(--ink-3)}
.nutr{display:flex; gap:3px; padding:4px 5px 1px; flex-wrap:nowrap}
.nutr span{
  font-family:var(--mono); font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:3px;
  border:1px solid var(--line); color:var(--ink-3); background:var(--surface-2);
  white-space:nowrap; opacity:.55;
}
.nutr span.ok{opacity:1}
.nutr span.ok{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.additem{
  align-self:flex-start; background:transparent; border:0; cursor:pointer; padding:2px 5px;
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--ink-3); border-radius:4px;
}
.additem:hover{background:var(--surface-3); color:var(--accent)}

.cell .reroll{
  position:absolute; top:5px; right:5px; opacity:0; transition:opacity .12s;
  border:1px solid var(--line-2); background:var(--surface); border-radius:6px;
  width:24px; height:24px; line-height:1; cursor:pointer; font-size:13px; padding:0;
  display:flex; align-items:center; justify-content:center; color:var(--ink-2);
}
.cell:hover .reroll, .reroll:focus-visible{opacity:1}
.cell .reroll:hover{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

/* ---------- shopping ---------- */
.shop-body{padding:6px 16px 18px}
.shop-list{list-style:none; margin:0; padding:0; columns:3; column-gap:26px}
.shop-list li{break-inside:avoid; padding:3px 0}
.shop-list label{display:flex; gap:8px; align-items:baseline; cursor:pointer; font-size:13.5px}
.shop-list input{margin:0; accent-color:var(--accent); transform:translateY(1px)}
.shop-list .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.shop-list label.done span.nm{text-decoration:line-through; color:var(--ink-3)}
.empty-note{padding:18px 16px; color:var(--ink-3); font-size:13.5px}

/* ---------- picker dialog ---------- */
dialog{
  border:1px solid var(--line-2); border-radius:12px; background:var(--surface); color:var(--ink);
  padding:0; width:min(560px, calc(100vw - 28px)); max-height:min(680px, calc(100vh - 60px));
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45); overflow:hidden;
}
dialog::backdrop{background:rgba(10,20,18,.45)}
.dlg{display:flex; flex-direction:column; max-height:inherit}
.dlg-head{padding:14px 16px 12px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.dlg-head h3{margin:0 0 2px; font-size:16px; letter-spacing:-.02em}
.dlg-head p{margin:0; font-size:12.5px; color:var(--ink-3)}
.dlg-tools{display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line)}
.dlg-tools input{
  flex:1; min-width:0; padding:8px 11px; border-radius:8px; font-size:14px;
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); font-family:inherit;
}
.dlg-list{overflow:auto; padding:8px 10px 12px; flex:1}
.opt{
  display:block; width:100%; text-align:left; background:transparent; border:0;
  border-radius:8px; padding:8px 10px; cursor:pointer;
}
.opt:hover{background:var(--surface-3)}
.opt .nm{display:block; font-size:14px; font-weight:650; letter-spacing:-.01em}
.opt .mt{display:block; margin-top:2px; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.opt-head{
  padding:12px 10px 5px; font-family:var(--mono); font-size:10.5px; font-weight:700;
  letter-spacing:.12em; color:var(--ink-3); border-bottom:1px solid var(--line); margin-bottom:4px;
}
.dlg-foot{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--surface-2)}
.dlg-foot .btn{flex:1}

/* 요리 카드 */
.rc-art{background:var(--surface-2); border-bottom:1px solid var(--line); padding:10px 0 4px; text-align:center}
.rc-art svg{width:min(260px,70%); height:auto; display:inline-block}
.rc-scroll{overflow:auto; flex:1; padding:0 18px 6px}
.rc-head{padding:14px 0 10px; border-bottom:1px solid var(--line)}
.rc-head h3{margin:0; font-size:20px; font-weight:800; letter-spacing:-.03em}
.rc-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.rc-tags span{
  font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.04em;
  background:var(--surface-3); border:1px solid var(--line); color:var(--ink-2);
  padding:2px 7px; border-radius:5px;
}
.rc-tags span.hi{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.rc-sect{padding:14px 0 4px}
.rc-sect h4{
  margin:0 0 7px; font-family:var(--mono); font-size:10.5px; font-weight:700;
  letter-spacing:.14em; color:var(--ink-3);
}
.rc-sect p{margin:0; font-size:14px; color:var(--ink-2); line-height:1.65}
.rc-steps{margin:0; padding:0; list-style:none; counter-reset:st}
.rc-steps li{
  counter-increment:st; position:relative; padding:0 0 12px 30px; font-size:14.5px; line-height:1.6;
}
.rc-steps li::before{
  content:counter(st); position:absolute; left:0; top:2px;
  width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--on-accent);
  font-family:var(--mono); font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.rc-steps li:last-child{padding-bottom:2px}

.opt{display:flex; gap:10px; align-items:center}
.opt .thumb{flex:0 0 42px; width:42px; line-height:0}
.opt .thumb svg{width:42px; height:auto}
.opt .txt{min-width:0}

.tip{margin:0 0 18px; font-size:12.5px; color:var(--ink-3)}
.mobile-only{display:none}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,12px);
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:0 10px 30px -10px rgba(0,0,0,.5);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:99;
  max-width:calc(100vw - 32px); text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .rail{position:static; max-height:none}
  .mobile-only{display:block}
  .shop-list{columns:2}
}
@media (max-width:560px){
  .wrap{padding:16px 13px 48px}
  .brand h1{font-size:24px}
  .shop-list{columns:1}
  .top-actions{margin-left:0; width:100%}
  .top-actions .btn{flex:1}
}

/* ---------- print ---------- */
@media print{
  :root{--bg:#fff; --surface:#fff; --surface-2:#fff; --surface-3:#fff;
        --ink:#000; --ink-2:#333; --ink-3:#555; --line:#999; --line-2:#666; --shadow:none}
  body{background:#fff}
  .wrap{max-width:none; padding:0}
  .rail, .top-actions, .reroll, .matchbar, .tip, .toast, .panel-head .btn{display:none !important}
  .cols{display:block}
  .panel{border-color:#999; box-shadow:none; break-inside:avoid}
  .plan{min-width:0; font-size:11px}
  .cellbtn{min-height:56px}
  .shop-list{columns:4}
}
</style>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>이번 주 식탁</h1>
      <p>조건을 고르면 그 조건에 맞는 요리로 일주일 식단표를 짜 드립니다.</p>
    </div>
    <div class="top-actions">
      <button class="btn btn-main" id="gen">일주일 자동 짜기</button>
      <button class="btn" id="clear">표 비우기</button>
      <button class="btn" id="print">인쇄</button>
    </div>
  </header>

  <div class="cols">

    <!-- ============ 조건 ============ -->
    <aside class="rail" aria-label="조건 고르기">
      <div class="rail-head">
        <strong>조건 고르기</strong>
        <button class="grp-clear" id="resetAll">전부 초기화</button>
      </div>
      <div class="rail-body" id="filters"></div>
    </aside>

    <!-- ============ 결과 ============ -->
    <main>
      <div class="matchbar" id="matchbar">
        <span class="n" id="matchNum">0</span>
        <p id="matchTxt">조건에 맞는 요리</p>
      </div>

      <p class="tip mobile-only">표는 옆으로 밀어서 볼 수 있어요.</p>

      <section class="panel">
        <div class="panel-head">
          <h2>주간 식단표 <span class="note" id="planNote"></span></h2>
          <span class="sub" id="planSum">비어 있음</span>
        </div>
        <div class="scroller">
          <table class="plan">
            <thead><tr id="planHead"></tr></thead>
            <tbody id="planBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>장보기 목록</h2>
          <button class="btn btn-sm" id="copyShop">목록 복사</button>
        </div>
        <div class="shop-body" id="shopBody"></div>
      </section>

      <p class="tip">요리 이름을 누르면 완성 그림과 만드는 법이 나옵니다. “+ 추가”로 한 칸에 요리를 더 넣거나 원하는 메뉴를 직접 적을 수도 있어요. 한상차림에서 칸 아래 <b>단·채·밥</b>은 그 상에 단백질·채소·탄수화물이 들어 있는지 알려 줍니다. 고른 조건과 식단표는 이 브라우저에 자동으로 저장됩니다.</p>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>
</div>

<dialog id="recipe">
  <div class="dlg">
    <div class="rc-art" id="rcArt"></div>
    <div class="rc-scroll">
      <div class="rc-head">
        <h3 id="rcName"></h3>
        <div class="rc-tags" id="rcTags"></div>
      </div>
      <div class="rc-sect">
        <h4>재료</h4>
        <p id="rcIng"></p>
      </div>
      <div class="rc-sect">
        <h4>만드는 법</h4>
        <ol class="rc-steps" id="rcSteps"></ol>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn" id="rcSwap">다른 요리로 바꾸기</button>
      <button class="btn btn-main" id="rcClose">닫기</button>
    </div>
  </div>
</dialog>

<dialog id="picker">
  <div class="dlg">
    <div class="dlg-head">
      <h3 id="dlgTitle">요리 고르기</h3>
      <p id="dlgSub"></p>
    </div>
    <div class="dlg-tools">
      <input id="dlgSearch" type="text" placeholder="요리 이름 검색 · 없으면 직접 입력" autocomplete="off">
      <button class="btn btn-sm" id="dlgAdd">직접 넣기</button>
    </div>
    <div class="dlg-list" id="dlgList"></div>
    <div class="dlg-foot">
      <button class="btn" id="dlgEmpty">이 칸 비우기</button>
      <button class="btn" id="dlgClose">닫기</button>
    </div>
  </div>
</dialog>

<script>

"코다리조림":["코다리를 씻어 지느러미를 자른다.","냄비에 무를 깔고 코다리를 올린 뒤 간장 양념과 물을 붓는다.","20분 조리다가 대파를 올려 5분 더 조린다."],
"갈치조림":["갈치를 토막 내고 비늘을 긁어낸다.","냄비 바닥에 무와 감자를 깔고 갈치를 올린다.","양념과 물을 붓고 25분 조린다. 중간에 국물을 끼얹는다."],
"오징어볶음":["오징어를 손질해 칼집을 넣고 한입 크기로 자른다.","센 불에 채소를 먼저 볶는다.","오징어와 고추장 양념을 넣고 3분만 빠르게 볶는다."],
"낙지볶음":["낙지를 밀가루로 주물러 씻는다.","양파·대파를 볶다가 고춧가루 양념을 넣는다.","낙지를 넣고 센 불에 3분 볶은 뒤 미나리를 올린다."],
"해물파전":["부침가루에 물과 달걀을 섞어 반죽한다.","팬에 기름을 넉넉히 두르고 쪽파를 가지런히 깐다.","반죽을 붓고 해물을 올려 양면을 노릇하게 부친다."],
"애호박전":["애호박을 0.5cm 두께로 썰어 소금을 살짝 뿌린다.","부침가루를 묻히고 달걀물을 입힌다.","약불에서 양면을 노릇하게 부친다."],
"동그랑땡":["다진 고기·으깬 두부·다진 채소를 소금 간해 치댄다.","동글납작하게 빚어 달걀물을 입힌다.","약불에서 양면을 천천히 부친다."],
"계란말이":["달걀을 풀어 소금 간하고 다진 당근·대파를 섞는다.","약불 팬에 얇게 부어 반쯤 익으면 한쪽부터 말아 준다.","남은 달걀물을 부어 가며 3~4번 반복해 만다."],
"계란찜":["달걀 3개에 물 반 컵을 섞어 체에 거른다.","뚝배기에 부어 약불에서 저어 가며 익힌다.","반쯤 굳으면 뚜껑을 덮고 5분 더 익힌 뒤 대파·참기름을 올린다."],
"두부조림":["두부를 도톰하게 썰어 물기를 닦고 노릇하게 지진다.","간장·고춧가루·마늘 양념과 물을 붓는다.","약불에서 10분 조리며 국물을 끼얹는다."],
"두부부침과 양념장":["두부를 1cm 두께로 썰어 키친타월로 물기를 뺀다.","기름 두른 팬에 양면을 노릇하게 지진다.","간장·쪽파·참기름을 섞은 양념장을 곁들인다."],
"감자조림":["감자를 한입 크기로 썰어 물에 헹군다.","기름에 볶다가 간장과 물을 붓는다.","국물이 졸아들 때까지 조린 뒤 물엿과 깨를 넣는다."],
"멸치볶음":["잔멸치를 기름 없이 팬에 볶아 비린내를 날린다.","간장·물엿 양념을 넣고 재빨리 볶는다.","불을 끄고 견과류와 깨를 섞는다."],
"시금치나물":["끓는 소금물에 시금치를 30초만 데친다.","찬물에 헹궈 물기를 꼭 짠다.","마늘·참기름·소금·깨로 조물조물 무친다."],
"콩나물무침":["콩나물을 뚜껑 덮고 5분 삶아 찬물에 헹군다.","물기를 뺀다.","마늘·참기름·소금·쪽파로 무친다."],
"오이무침":["오이를 얇게 썰어 소금에 10분 절인 뒤 물기를 짠다.","고춧가루·식초·설탕을 섞는다.","오이와 버무리고 깨를 뿌린다."],
"무생채":["무를 곱게 채 썬다.","고춧가루를 먼저 넣어 색을 입힌다.","식초·설탕·소금으로 간해 버무린다."],

"애호박볶음":["애호박을 반달 모양으로 썬다.","기름에 양파를 볶다가 애호박을 넣는다.","소금으로 간하고 참기름을 둘러 마무리한다."],
"비빔밥":["나물을 각각 데쳐 무치고 달걀 프라이를 준비한다.","그릇에 밥을 담고 나물을 색깔별로 돌려 담는다.","고추장과 참기름을 올려 비벼 먹는다."],
"김밥":["밥에 참기름과 소금을 섞어 한 김 식힌다.","김 위에 밥을 얇게 펴고 속재료를 가지런히 올린다.","단단히 말아 겉에 참기름을 바르고 한입 크기로 썬다."],
"김치볶음밥":["김치를 잘게 썰어 기름에 볶는다.","밥을 넣고 눌러 가며 볶는다.","참기름을 두르고 달걀 프라이와 김가루를 올린다."],
"비빔국수":["고추장·식초·설탕으로 양념장을 만든다.","소면을 3분 삶아 찬물에 여러 번 헹군다.","면에 양념장을 넣어 비비고 오이와 삶은달걀을 올린다."],
"열무국수":["열무김치와 국물을 준비한다.","소면을 삶아 찬물에 헹궈 물기를 뺀다.","면에 열무김치를 올리고 국물을 부은 뒤 오이와 깨를 얹는다."],
"물냉면":["냉면육수를 살얼음이 낄 정도로 차갑게 둔다.","면을 표시된 시간만큼 삶아 찬물에 비벼 헹군다.","그릇에 면을 담고 육수를 부은 뒤 고명을 올린다."],
"떡볶이":["물에 고추장·설탕·간장을 풀어 끓인다.","떡과 양배추를 넣고 10분 끓인다.","국물이 걸쭉해지면 대파와 삶은달걀을 올린다."],
"오뎅탕":["무와 다시마를 넣고 15분 끓여 육수를 낸다.","어묵을 꼬치에 꿰어 넣는다.","간장으로 간하고 대파를 올려 5분 더 끓인다."],
"골뱅이소면무침":["골뱅이를 건져 한입 크기로 썬다.","고추장·식초·설탕 양념에 오이·양파와 함께 버무린다.","삶아 헹군 소면을 곁들여 낸다."],
"황태채무침":["황태채를 물에 살짝 적셨다 물기를 꼭 짠다.","고추장·마요네즈·물엿을 섞는다.","황태채와 버무려 깨를 뿌린다."],
"소고기채소죽":["쌀을 30분 불려 참기름에 볶는다.","다진 소고기와 채소를 넣고 함께 볶는다.","물을 6배 붓고 저어 가며 20분 끓인 뒤 소금으로 약하게 간한다."],
"전복죽":["전복을 솔로 씻어 내장을 따로 떼 둔다.","참기름에 불린 쌀과 전복을 볶고 내장을 으깨 넣는다.","물을 붓고 저어 가며 25분 끓인다."],
"단호박죽":["단호박을 껍질째 쪄서 속을 파낸다.","으깨어 물과 함께 끓인다.","찹쌀가루를 물에 풀어 넣고 저어 가며 걸쭉하게 만든다."],
"잡채":["당면을 뜨거운 물에 20분 불려 삶는다.","채소를 각각 볶아 따로 둔다.","당면을 간장 양념에 볶고 채소와 함께 버무린다."],
"연두부와 간장":["연두부를 그릇에 통째로 담는다.","간장·참기름·쪽파를 섞는다.","양념장을 끼얹어 낸다."],
"찐만두":["찜기에 물을 끓이고 젖은 면포를 깐다.","냉동만두를 붙지 않게 올린다.","센 불에서 10분 찐다. 간장·식초를 곁들인다."],
"들깨미역국":["불린 미역을 들기름에 볶는다.","물을 붓고 15분 끓인다.","들깨가루를 풀어 넣고 국간장으로 간해 5분 더 끓인다."],

"연어덮밥":["생연어를 도톰하게 썬다.","밥에 밥을 깔고 아보카도를 올린다.","연어를 얹고 간장·와사비·쪽파를 곁들인다."],
"소고기덮밥":["양파를 채 썰어 간장·맛술·설탕 국물에 넣고 끓인다.","얇은 소고기를 넣어 익힌다.","밥 위에 국물째 올린다."],
"닭고기달걀덮밥":["닭다리살과 양파를 간장 국물에 넣고 5분 끓인다.","달걀을 풀어 반만 저어 넣고 뚜껑을 덮는다.","반숙일 때 불을 끄고 밥 위에 올린다."],
"돈가스덮밥":["돈가스를 튀겨 먹기 좋게 썬다.","간장 국물에 양파를 끓이고 돈가스를 올린다.","달걀을 풀어 넣고 반숙으로 익혀 밥에 올린다."],
"연어구이":["연어에 소금·후추를 뿌려 10분 둔다.","껍질 쪽부터 센 불에 3분 굽는다.","뒤집어 버터를 넣고 약불에 3분 더 굽고 레몬을 짠다."],
"미소된장국":["물을 끓여 두부와 미역을 넣는다.","불을 줄이고 미소된장을 체에 걸러 푼다.","끓기 직전에 불을 끄고 쪽파를 올린다."],
"차완무시":["달걀 1개에 육수 3배를 섞어 체에 거른다.","그릇에 새우·표고·은행을 담고 달걀물을 붓는다.","김 오른 찜기에 약불로 12분 찐다."],
"닭가라아게":["닭다리살을 간장·생강·마늘에 20분 재운다.","감자전분을 두툼하게 묻힌다.","170도 기름에 2번 튀기거나 에어프라이어 200도 15분 굽는다."],
"데리야키 치킨":["닭다리살을 껍질부터 노릇하게 굽는다.","간장·맛술·설탕을 넣고 조린다.","소스가 윤기 나게 졸면 썰어 쪽파를 뿌린다."],
"야키소바":["돼지고기와 양배추를 센 불에 볶는다.","면을 넣고 물을 조금 부어 풀어 준다.","우스터소스로 간하고 숙주를 넣어 재빨리 볶는다."],
"우동":["가쓰오 육수를 끓인다.","어묵과 유부를 넣고 5분 끓인다.","우동면을 넣어 2분 데우고 쪽파를 올린다."],
"오코노미야키":["양배추를 잘게 썰어 부침가루·달걀과 섞는다.","팬에 두툼하게 올리고 오징어를 얹어 약불에 굽는다.","뒤집어 8분 더 굽고 소스와 가쓰오부시를 뿌린다."],
"간장라멘":["육수에 간장 양념을 풀어 끓인다.","생라면을 삶아 건져 그릇에 담는다.","육수를 붓고 차슈·달걀·숙주·쪽파를 올린다."],
"가지 미소구이":["가지를 반으로 갈라 칼집을 낸다.","미소된장과 맛술을 섞어 단면에 바른다.","200도 오븐에 15분 굽고 깨를 뿌린다."],

"마파두부":["두부를 깍둑 썰어 소금물에 살짝 데친다.","다진 고기를 볶다가 두반장을 넣고 볶는다.","물을 붓고 두부를 넣어 끓인 뒤 전분물로 걸쭉하게 만든다."],
"토마토달걀볶음":["달걀을 풀어 반숙으로 볶아 따로 덜어 둔다.","토마토를 넣고 즙이 나올 때까지 볶는다.","달걀을 다시 넣고 설탕·소금으로 간해 살짝 볶는다."],
"새우볶음밥":["팬을 세게 달궈 달걀을 먼저 볶는다.","새우와 대파를 넣고 볶는다.","밥과 완두콩을 넣어 고슬하게 볶고 소금으로 간한다."],
"짜장면":["춘장을 기름에 5분 볶아 쓴맛을 뺀다.","돼지고기·양파·감자를 볶다가 볶은 춘장을 넣는다.","물을 붓고 끓인 뒤 전분물로 농도를 맞춰 면에 붓는다."],
"짬뽕":["돼지고기와 채소를 센 불에 볶는다.","고춧가루를 넣어 고추기름을 내고 육수를 붓는다.","해물을 넣고 5분 끓여 삶은 면에 붓는다."],
"탕수육":["돼지 등심을 전분물에 버무려 10분 둔다.","170도에서 튀기고 190도에서 한 번 더 튀긴다.","물·식초·설탕·간장을 끓여 전분물로 걸쭉하게 만들어 곁들인다."],
"깐풍기":["닭을 튀겨 낸다.","건고추와 마늘을 볶아 향을 낸다.","간장·식초·설탕 소스를 넣고 튀긴 닭을 버무린다."],
"유린기":["닭다리살을 튀겨 한입 크기로 썬다.","간장·식초·설탕에 다진 채소를 섞어 소스를 만든다.","양상추를 깔고 닭을 올린 뒤 소스를 끼얹는다."],
"어향가지볶음":["가지를 길게 썰어 기름에 살짝 튀기듯 볶는다.","마늘·대파를 볶다가 두반장을 넣는다.","가지를 넣고 전분물로 농도를 맞춰 버무린다."],
"청경채 마늘볶음":["청경채를 반으로 갈라 깨끗이 씻는다.","기름에 마늘을 볶아 향을 낸다.","청경채를 넣고 센 불에 2분 볶은 뒤 간장·참기름으로 마무리한다."],
"군만두":["팬에 기름을 얇게 두르고 만두를 올린다.","물 3큰술을 붓고 뚜껑을 덮어 5분 익힌다.","뚜껑을 열고 물기를 날리며 바닥을 바삭하게 굽는다."],
"꿔바로우":["등심을 넓게 저며 전분 반죽에 재운다.","170도에서 튀기고 한 번 더 바삭하게 튀긴다.","설탕·식초 소스를 끓여 튀긴 고기와 당근을 버무린다."],

"토마토 스파게티":["면을 소금 넣은 물에 8분 삶는다.","마늘과 양파를 볶다가 토마토소스를 넣고 끓인다.","면과 면수를 넣어 버무리고 바질을 올린다."],
"크림 파스타":["베이컨을 바삭하게 볶는다.","양송이를 넣고 볶다가 생크림을 붓고 졸인다.","삶은 면을 넣어 버무리고 파르메산을 뿌린다."],
"알리오 올리오":["올리브유에 편 썬 마늘을 약불로 천천히 볶는다.","페퍼론치노를 넣고 면수를 한 국자 넣어 유화시킨다.","삶은 면을 넣어 재빨리 버무리고 파슬리를 뿌린다."],
"봉골레 파스타":["바지락을 소금물에 30분 해감한다.","마늘을 볶다가 바지락과 화이트와인을 넣고 뚜껑을 덮는다.","입이 벌어지면 삶은 면과 면수를 넣어 버무린다."],
"소고기 스테이크":["고기를 30분 실온에 두고 굵은소금·후추를 뿌린다.","센 불 팬에서 한 면 2분씩 굽는다.","버터·마늘·로즈마리를 넣어 끼얹고 5분 쉬게 둔 뒤 썬다."],
"연어 스테이크":["연어에 소금·후추를 뿌린다.","껍질 쪽부터 4분, 뒤집어 3분 굽는다.","아스파라거스를 함께 굽고 레몬을 짠다."],
"로스트 치킨":["닭에 소금·후추·올리브유를 골고루 바른다.","감자·당근·로즈마리와 함께 팬에 담는다.","200도 오븐에서 50분 굽고 중간에 육즙을 끼얹는다."],
"햄버그 스테이크":["다진 고기에 볶은 양파·빵가루를 섞어 치댄다.","타원형으로 빚어 가운데를 눌러 준다.","팬에 양면을 굽고 뚜껑을 덮어 속까지 익힌 뒤 소스를 끼얹는다."],
"라자냐":["다진 고기와 토마토소스로 미트소스를 만든다.","면·미트소스·베샤멜·치즈를 번갈아 층층이 쌓는다.","180도 오븐에서 30분 굽는다."],
"감자 그라탕":["감자를 얇게 썰어 생크림·소금·넛맥과 버무린다.","버터 바른 그릇에 겹쳐 담는다.","치즈를 올려 190도에서 35분 굽는다."],
"버섯 리조또":["양파와 버섯을 버터에 볶는다.","쌀을 넣고 볶다가 육수를 조금씩 부어 저어 가며 익힌다.","20분 뒤 생크림과 파르메산을 넣어 마무리한다."],
"미네스트로네":["채소를 모두 깍둑 썬다.","올리브유에 양파·당근·셀러리를 볶는다.","토마토와 물을 붓고 20분 끓인 뒤 강낭콩을 넣는다."],
"단호박 수프":["단호박을 쪄서 껍질을 벗긴다.","버터에 양파를 볶고 단호박과 우유를 넣어 끓인다.","블렌더로 곱게 갈고 생크림을 조금 올린다."],
"비프 스튜":["사태를 큼직하게 썰어 겉면을 센 불에 굽는다.","양파·토마토페이스트·레드와인을 넣고 졸인다.","물을 붓고 1시간 끓이다 감자·당근을 넣어 20분 더 끓인다."],
"오믈렛":["달걀을 곱게 풀어 소금 간한다.","버터 두른 팬에 부어 젓가락으로 저으며 반숙으로 만든다.","치즈와 채소를 올리고 반으로 접는다."],
"스크램블에그와 토스트":["달걀에 우유를 조금 섞어 푼다.","약불에서 천천히 저어 촉촉하게 익힌다.","구운 식빵에 올리고 후추를 뿌린다."],
"아보카도 토스트":["빵을 바삭하게 굽는다.","아보카도를 으깨 레몬·소금과 섞는다.","빵에 펴 바르고 방울토마토와 올리브유를 올린다."],
"프렌치 토스트":["달걀·우유·설탕을 섞어 식빵을 적신다.","버터 두른 팬에 약불로 양면을 굽는다.","메이플시럽을 뿌린다."],
"팬케이크":["믹스에 달걀과 우유를 넣어 덩어리 없이 섞는다.","약불 팬에 한 국자씩 부어 기포가 올라오면 뒤집는다.","버터와 메이플시럽을 곁들인다."],
"그릭요거트 볼":["그릇에 그릭요거트를 담는다.","바나나와 블루베리를 올린다.","그래놀라를 뿌리고 꿀을 두른다."],
"시저 샐러드":["로메인을 씻어 물기를 완전히 뺀다.","드레싱과 가볍게 버무린다.","크루통·파르메산·방울토마토를 올린다."],
"닭가슴살 샐러드":["닭가슴살에 소금·후추를 뿌려 굽고 한 김 식혀 썬다.","채소를 씻어 물기를 뺀다.","올리브유와 발사믹을 섞어 뿌린다."],
"BLT 샌드위치":["베이컨을 바삭하게 굽는다.","식빵을 굽고 마요네즈를 바른다.","양상추·토마토·베이컨을 올려 덮고 반으로 자른다."],

"팟타이":["쌀국수를 미지근한 물에 30분 불린다.","달걀과 새우를 볶고 불린 면을 넣는다.","타마린드소스로 볶고 숙주와 땅콩을 올린다."],

"나시고랭":["닭고기와 양파를 볶는다.","밥을 넣고 케찹마니스로 볶아 색을 낸다.","달걀 프라이를 올리고 고추를 곁들인다."],

"그린 커리":["코코넛밀크 윗부분으로 커리 페이스트를 볶는다.","닭고기를 넣고 볶다가 남은 코코넛밀크를 붓는다.","가지를 넣고 10분 끓인 뒤 바질을 올린다."],
"월남쌈":["채소를 가늘게 채 썬다.","라이스페이퍼를 따뜻한 물에 3초 적신다.","채소를 올려 말고 땅콩소스에 찍어 먹는다."],

"반미 샌드위치":["무·당근을 식초·설탕에 30분 절인다.","바게트를 갈라 마요네즈를 바른다.","고기·절임채소·고수를 채운다."],

"탄두리 치킨":["닭다리에 칼집을 내고 요거트·커리가루·레몬에 1시간 재운다.","에어프라이어 190도에서 20분 굽는다.","뒤집어 10분 더 굽는다."],
"채소 커리":["감자와 콜리플라워를 한입 크기로 썬다.","양파를 볶고 커리가루를 넣어 향을 낸다.","토마토·코코넛밀크를 붓고 채소가 무를 때까지 20분 끓인다."],

"과카몰리와 나초":["아보카도를 포크로 굵게 으깬다.","라임즙·소금·다진 양파·토마토를 섞는다.","나초칩과 함께 낸다."],

"후무스와 피타":["삶은 병아리콩과 타히니·레몬·마늘을 믹서에 넣는다.","물을 조금씩 넣으며 곱게 간다.","올리브유를 두르고 데운 피타빵과 낸다."],

"찐 고구마":["고구마를 깨끗이 씻는다.","찜기에 넣고 김이 오른 뒤 25분 찐다.","젓가락이 쑥 들어가면 다 된 것이다."],
"삶은 달걀":["냄비에 달걀이 잠기도록 물을 붓고 소금을 넣는다.","끓기 시작하면 반숙 7분, 완숙 12분 삶는다.","찬물에 담가 식히면 껍질이 잘 벗겨진다."],
"제철 과일 플레이트":["과일을 흐르는 물에 씻는다.","한입 크기로 썬다.","접시에 색깔이 섞이도록 담는다."],

"곤약 비빔면":["곤약면을 끓는 물에 1분 데쳐 찬물에 헹군다.","고추장·식초·설탕으로 양념장을 만든다.","면과 버무리고 오이·삶은달걀을 올린다."],

"호떡":["호떡믹스를 반죽해 30분 부풀린다.","반죽을 떼어 흑설탕과 땅콩 분태를 넣고 오므린다.","기름 두른 팬에 눌러 가며 양면을 노릇하게 굽는다."],
"고구마 맛탕":["고구마를 한입 크기로 썰어 찬물에 헹군다.","기름에 노릇하게 튀기듯 굽는다.","설탕과 물엿을 끓여 시럽을 만들고 버무린 뒤 깨를 뿌린다."],
"군고구마":["고구마를 씻어 물기를 닦는다.","에어프라이어 180도에서 20분 굽는다.","뒤집어 15분 더 굽는다. 젓가락이 쑥 들어가면 완성."],
"찐 옥수수":["옥수수 껍질을 벗기고 씻는다.","냄비에 잠기도록 물을 붓고 소금과 설탕을 넣는다.","뚜껑을 덮고 25분 삶은 뒤 불을 끄고 5분 더 둔다."],

"감자 버터구이":["알감자를 씻어 껍질째 반으로 자른다.","소금을 뿌려 에어프라이어 190도에서 15분 굽는다.","뜨거울 때 버터를 올려 녹이고 파슬리를 뿌린다."],
"감자튀김":["에어프라이어를 200도로 예열한다.","냉동 감자를 겹치지 않게 펴 담는다.","12분 굽고 중간에 한 번 흔들어 준 뒤 소금을 뿌린다."],
"떡꼬치":["떡을 끓는 물에 30초 데쳐 말랑하게 만든다.","꼬치에 네 개씩 꿴다.","기름에 겉을 굽고 고추장·케첩·물엿 소스를 발라 한 번 더 굽는다."],
"감자전":["감자를 강판에 갈아 체에 밭쳐 물기를 뺀다.","가라앉은 전분을 다시 섞고 소금으로 간한다.","기름 넉넉한 팬에 얇게 펴 양면을 바삭하게 부친다."],
"김치전":["김치를 잘게 썰고 김칫국물을 조금 남긴다.","부침가루·물·달걀을 섞어 반죽한다.","기름 두른 팬에 얇게 펴 양면을 바삭하게 부친다."],
"부추전":["부추를 5cm 길이로 자른다.","부침가루와 물을 1:1로 섞어 부추와 버무린다.","기름 두른 팬에 얇게 펴고 청양고추를 올려 양면을 부친다."],
"찐빵":["찜기에 물을 올려 김을 낸다.","젖은 면포를 깔고 찐빵을 올린다.","센 불에서 12분 찐다. 겉이 촉촉해지면 완성."],
"계란빵":["핫케이크 가루에 우유·달걀 1개·설탕을 섞어 반죽한다.","버터 바른 틀에 반죽을 반쯤 붓고 달걀을 하나씩 깨 넣는다.","180도 오븐에서 20분 굽는다."],
"팥죽":["팥을 씻어 한 번 끓인 물은 버리고 새 물에 40분 삶는다.","팥이 무르면 주걱으로 으깨며 끓인다.","찹쌀가루를 물에 풀어 넣고 저어 가며 걸쭉하게 만든 뒤 소금으로 간한다."],
"누룽지":["냄비에 누룽지와 물을 4배로 붓는다.","중불에서 10분 끓인다.","누룽지가 퍼지면 불을 끈다. 취향에 따라 소금을 아주 조금 넣는다."],
"유부초밥":["밥에 동봉된 배합초를 섞어 한 김 식힌다.","다진 당근·단무지와 깨를 섞는다.","유부의 물기를 살짝 짜고 밥을 채워 모양을 잡는다."],
"주먹밥":["밥에 참기름·소금·깨를 섞는다.","김가루를 넣고 고루 버무린다.","한입 크기로 동그랗게 꼭꼭 뭉친다."],
"견과 강정":["견과류를 마른 팬에 약불로 볶아 고소하게 만든다.","다른 팬에 설탕과 물엿을 녹여 시럽을 낸다.","견과를 넣어 재빨리 버무리고 종이 위에 펴서 식힌다."],
"육포":["육포를 먹기 좋은 크기로 찢는다.","마른 팬에 살짝 데우면 더 부드럽다.","그대로 낸다."],

"라면":["물 550ml를 끓인다.","면과 스프를 넣고 4분 끓인다.","달걀을 풀어 넣고 대파·청양고추를 올려 30초 더 끓인다."],
"짜장라면":["물을 끓여 면을 4분 삶는다.","물을 8큰술만 남기고 따라 버린다.","분말스프를 넣고 비빈 뒤 오이채와 달걀 프라이를 올린다."],
"만둣국":["육수를 끓인다.","냉동만두를 넣고 떠오를 때까지 5분 끓인다.","달걀을 풀어 넣고 국간장으로 간한 뒤 김가루와 대파를 올린다."],
"수제비":["밀가루에 물을 넣어 반죽해 30분 냉장고에 둔다.","멸치·다시마 육수에 감자를 넣고 끓인다.","반죽을 얇게 떼어 넣고 애호박과 함께 10분 더 끓인다."],
"칼국수":["바지락을 소금물에 해감한다.","다시마 육수에 감자와 바지락을 넣고 끓인다.","면을 넣고 5분 끓인 뒤 애호박과 대파를 넣는다."],

function ingColor(name){
  for(const [re, c] of ING_COLORS){ if(re.test(name)) return c; }
  return "#BFAE8E";
}
function hashOf(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngOf(seed){
  let s = seed || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}
function dishArt(d){
  const W = 260, H = 172, cx = 130, cy = 98;
  const txt = d.n + " " + d.i.join(" ");
  const soup = d.w.includes("끓이기") || /국|탕|찌개|죽|수프|스튜|커리|라멘/.test(d.n);
  const noodle = /면|국수|파스타|스파게티|우동|라멘|당면|소면|냉면/.test(txt);
  const hot = !d.w.includes("안 익힘");
  const cols = d.i.map(ingColor);
  const rnd = rngOf(hashOf(d.n));
  let broth = "#E0D2AF";
  if(/단호박|호박죽|토마토/.test(d.n)) broth = "#DC9A44";
  else if(/김치|고추장|고춧가루|칠리|짬뽕|육개장/.test(txt)) broth = "#C6553C";
  else if(/된장|미소|청국장|간장|춘장|커리|스튜|짜장/.test(txt)) broth = "#A87F4C";
  else if(/생크림|우유|코코넛|크림/.test(txt)) broth = "#EDDFC2";

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(d.n) + ' 그림">';
  s += '<ellipse cx="' + cx + '" cy="' + (cy + 50) + '" rx="72" ry="8" fill="rgba(0,0,0,.10)"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="62" fill="var(--surface-3)" stroke="var(--line-2)" stroke-width="1.5"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="49" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>';

  if(soup){
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="46" fill="' + broth + '" opacity=".85"/>';
    for(let i = 0; i < 9; i++){
      const a = rnd() * Math.PI * 2, rr = 7 + rnd() * 30;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * .82;
      const c = cols[Math.floor(rnd() * cols.length)];
      s += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="' + (5 + rnd() * 5).toFixed(1) +
           '" ry="' + (4 + rnd() * 4).toFixed(1) + '" fill="' + c + '" opacity=".95"/>';
    }
  }else{
    for(let i = 0; i < 14; i++){
      const a = rnd() * Math.PI * 2, rr = rnd() * 32;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * .72;
      const c = cols[i % cols.length];
      const w = 9 + rnd() * 11, h = 6 + rnd() * 7;
      s += '<rect x="' + (x - w / 2).toFixed(1) + '" y="' + (y - h / 2).toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="' + h.toFixed(1) + '" rx="' + (h / 2).toFixed(1) + '" fill="' + c +
           '" transform="rotate(' + (rnd() * 180 - 90).toFixed(0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
    }
  }

  if(noodle){
    for(let i = 0; i < 5; i++){
      const y0 = cy - 22 + i * 11 + rnd() * 3;
      s += '<path d="M' + (cx - 38) + ' ' + y0.toFixed(1) + ' q 19 ' + (9 - rnd() * 18).toFixed(1) +
           ' 38 0 q 19 ' + (9 - rnd() * 18).toFixed(1) + ' 38 0" fill="none" stroke="#E8DCBE" stroke-width="4" stroke-linecap="round" opacity=".92"/>';
    }
  }

  s += '<circle cx="' + (cx - 18) + '" cy="' + (cy - 19) + '" r="3" fill="#6FA35F" opacity=".9"/>';
  s += '<circle cx="' + (cx + 14) + '" cy="' + (cy + 16) + '" r="2.5" fill="#6FA35F" opacity=".9"/>';

  if(hot){
    for(let i = 0; i < 3; i++){
      const x = cx - 24 + i * 24;
      s += '<path d="M' + x + ' 30 q 6 -6 0 -12 q -6 -6 0 -12" fill="none" stroke="var(--ink-3)" ' +
           'stroke-width="2.2" stroke-linecap="round" opacity=".38"/>';
    }
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="49" fill="none" stroke="var(--line)" stroke-width="1"/>';
  return s + '</svg>';
}

/* ======================= 조건 정의 ======================= */
const MEALS = ["아침","점심","저녁","간식","야식"];
const BIG_MEALS = ["아침","점심","저녁"];
const MEAL_COLOR = {"아침":"var(--mb)","점심":"var(--ml)","저녁":"var(--md)","간식":"var(--ms)","야식":"var(--mn)"};
const DAYS = ["월","화","수","목","금","토","일"];
const ROLE_ORDER = ["국","메인","반찬","한그릇","간식"];

const GROUPS = [
  {key:"m", name:"끼니", hint:"고른 끼니만 표에 줄로 나옵니다.", mode:"multi", opts:MEALS},
  {key:"set", name:"차림 방식", mode:"single",
   hint:"한상차림은 국·메인·반찬을 한 번에 뽑고 영양이 고루 담겼는지 표시해 줍니다. 간식·야식 줄은 늘 한 가지만 나옵니다.",
   opts:[{v:"free",l:"상관없음"},{v:"table",l:"한상차림"},{v:"bowl",l:"한 그릇"}]},
  {key:"t", name:"조리 시간", hint:"하나만 고를 수 있어요.", mode:"single",
   opts:[{v:10,l:"10분 이내"},{v:20,l:"20분 이내"},{v:30,l:"30분 이내"},{v:60,l:"1시간 이내"},{v:0,l:"제한 없음"}]},
  {key:"c", name:"나라", mode:"multi", canEx:true,
   opts:["한식","일식","중식","양식","동남아","인도","멕시코","지중해"]},
  {key:"d", name:"고기·채식", mode:"multi", canEx:true,
   opts:["육류","해산물","채식","비건","고단백","저탄수","저염"]},
  {key:"a", name:"연령대", hint:"고른 연령 모두가 함께 먹기 좋은 요리만 나옵니다.", mode:"multi", opts:A_ALL},
  {key:"s", name:"상황", mode:"multi", canEx:true,
   opts:["일상","다이어트","손님상","도시락","야근·간편","술안주","명절","회복식","운동 후"]},
  {key:"w", name:"조리 방법", mode:"multi", canEx:true, warm:true,
   opts:["끓이기","볶기","굽기","부치기","찌기","조림","튀기기","무침·생채","오븐","에어프라이어","안 익힘"]},
  {key:"ing", name:"못 먹는 재료", mode:"multi", exOnly:true,

   opts:Object.keys(ING_EX)}

/* ======================= 상태 ======================= */
const KEY = "weekly-table-v2";
const blankF  = () => ({m:["아침","점심","저녁"], set:"free", t:0, c:[], d:[], a:[], s:[], w:[]});
const blankFx = () => ({c:[], d:[], s:[], w:[], ing:[]});
const blankMode = () => ({c:"in", d:"in", s:"in", w:"in"});

let state = {
  f:blankF(),      // 고른 것
  fx:blankFx(),    // 뺀 것
  mode:blankMode(),// 조건별 고르기/빼기
  plan:{},         // "0|아침" -> [{t:'d'|'c', n:"이름"}]
  checked:[]
};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!o) return;
    state.f    = Object.assign(blankF(), o.f || {});
    state.fx   = Object.assign(blankFx(), o.fx || {});
    state.mode = Object.assign(blankMode(), o.mode || {});
    state.checked = Array.isArray(o.checked) ? o.checked : [];
    state.plan = {};
    Object.entries(o.plan || {}).forEach(([k, v]) => {
      state.plan[k] = Array.isArray(v) ? v : [v];   // 예전 저장본도 읽히게
    });
  }catch(e){}
}

/* ======================= 조건 맞추기 ======================= */
function selOf(key){
  const ex = (key === "ing") || state.mode[key] === "ex";
  return {ex, list: ex ? (state.fx[key] || []) : (state.f[key] || [])};
}
function checkGroup(sel, hit){
  if(!sel.list.length) return true;
  return sel.ex ? !hit : hit;
}
function fits(dish, opts){
  const f = state.f, o = opts || {};
  if(o.meal && !dish.m.includes(o.meal)) return false;
  if(o.role && dish.g !== o.role) return false;
  if(f.t && dish.t > f.t) return false;

  const sc = selOf("c"); if(!checkGroup(sc, sc.list.includes(dish.c))) return false;
  const sd = selOf("d"); if(!checkGroup(sd, sd.list.some(x => dish.d.includes(x)))) return false;
  const ss = selOf("s"); if(!checkGroup(ss, ss.list.some(x => dish.s.includes(x)))) return false;
  const sw = selOf("w"); if(!checkGroup(sw, sw.list.some(x => dish.w.includes(x)))) return false;

  if(f.a.length && !f.a.every(x => dish.a.includes(x))) return false;   // 연령은 모두 충족

  const bad = state.fx.ing || [];
  if(bad.length){
    const txt = dish.n + " " + dish.i.join(" ");
    if(bad.some(k => ING_EX[k] && ING_EX[k].test(txt))) return false;
  }
  return true;
}
const poolAll  = () => DISHES.filter(d => fits(d, {}));
const poolMeal = (meal) => DISHES.filter(d => fits(d, {meal}));
const poolRole = (meal, role) => DISHES.filter(d => fits(d, {meal, role}));
const byName   = (n) => DISHES.find(d => d.n === n);
const isBig    = (meal) => BIG_MEALS.includes(meal);

/* 자동으로 뽑을 때 쓰는 후보 (한 가지만 뽑는 경우) */
function mainPool(meal){
  const p = poolMeal(meal);
  if(state.f.set === "bowl" && isBig(meal)){
    const b = p.filter(d => d.g === "한그릇");
    if(b.length) return b;
  }
  const m = p.filter(d => d.g !== "반찬");
  return m.length ? m : p;
}

/* ======================= 조건 화면 ======================= */
function buildFilters(){
  const host = document.getElementById("filters");
  host.innerHTML = "";
  GROUPS.forEach(g => {
    const box = document.createElement("div");
    box.className = "grp";

    const top = document.createElement("div");
    top.className = "grp-top";
    top.innerHTML = '<span class="grp-name">' + g.name + '</span>';

    if(g.canEx){
      const sw = document.createElement("div");
      sw.className = "modesw";
      [["in","고르기"],["ex","빼기"]].forEach(([v, l]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = l;
        b.dataset.mg = g.key; b.dataset.mv = v;
        b.onclick = () => { state.mode[g.key] = v; sync(); };
        sw.appendChild(b);
      });
      top.appendChild(sw);
    }else if(g.mode === "multi"){
      const c = document.createElement("button");
      c.className = "grp-clear"; c.textContent = (g.key === "m") ? "전체" : "지우기";
      c.onclick = () => {
        if(g.key === "m") state.f.m = MEALS.slice();
        else if(g.exOnly) state.fx[g.key] = [];
        else state.f[g.key] = [];
        sync();
      };
      top.appendChild(c);
    }
    box.appendChild(top);

    if(g.hint){
      const h = document.createElement("p");
      h.className = "grp-hint"; h.textContent = g.hint;
      box.appendChild(h);
    }

    const chips = document.createElement("div");
    chips.className = "chips";
    g.opts.forEach(raw => {
      const v = (typeof raw === "object") ? raw.v : raw;
      const l = (typeof raw === "object") ? raw.l : raw;
      const b = document.createElement("button");
      b.className = "chip" + (g.warm ? " chip-w" : "");
      b.type = "button"; b.textContent = l;
      b.dataset.g = g.key; b.dataset.v = String(v);
      b.onclick = () => {
        if(g.mode === "single"){ state.f[g.key] = v; sync(); return; }
        const ex = g.exOnly || state.mode[g.key] === "ex";
        const arr = ex ? state.fx[g.key] : state.f[g.key];
        const i = arr.indexOf(v);
        if(i > -1){
          if(g.key === "m" && arr.length === 1) return;   // 끼니는 최소 하나
          arr.splice(i, 1);
        }else arr.push(v);
        sync();
      };
      chips.appendChild(b);
    });
    box.appendChild(chips);
    host.appendChild(box);
  });
}

function paintFilters(){
  document.querySelectorAll(".modesw button").forEach(b => {
    b.classList.toggle("on", state.mode[b.dataset.mg] === b.dataset.mv);
  });
  document.querySelectorAll(".chip").forEach(b => {
    const k = b.dataset.g, v = b.dataset.v;
    const g = GROUPS.find(x => x.key === k);
    const ex = g.exOnly || state.mode[k] === "ex";
    const cur = ex ? state.fx[k] : state.f[k];
    const on = Array.isArray(cur) ? cur.includes(v) : String(cur) === v;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.classList.toggle("ex", !!ex);
  });
}

/* ======================= 매칭 개수 ======================= */
function paintMatch(){
  const n = poolAll().length;
  const bar = document.getElementById("matchbar");
  document.getElementById("matchNum").textContent = n;

  let txt = "가지 요리가 조건에 맞습니다.";
  let warn = false;

  if(n === 0){
    txt = "맞는 요리가 없어요. 조리 시간을 늘리거나 뺀 조건을 줄여 보세요.";
    warn = true;
  }else if(state.f.set === "table"){
    const big = state.f.m.filter(isBig);
    const lack = [];
    ["국","메인","반찬"].forEach(r => {
      const c = big.length ? Math.max(...big.map(m => poolRole(m, r).length)) : 0;
      if(c === 0) lack.push(r);
    });
    if(big.length && lack.length){
      txt = "가지가 맞지만 " + lack.join("·") + " 후보가 없어 그 자리는 비워집니다.";
      warn = true;
    }else{
      txt = "가지 요리가 맞습니다. 한상차림은 국·메인·반찬을 함께 뽑습니다.";
    }
  }else{
    const thin = state.f.m.filter(m => mainPool(m).length < 4);
    if(thin.length){
      txt = "가지가 맞습니다. 다만 " + thin.join("·") + " 후보가 적어 같은 메뉴가 반복될 수 있어요.";
      warn = true;
    }
  }
  document.getElementById("matchTxt").textContent = txt;
  bar.classList.toggle("warn", warn);
}

/* ======================= 영양 체크 ======================= */
const VEG_RE = /채소|시금치|콩나물|오이|무|배추|양배추|브로콜리|당근|호박|가지|버섯|파프리카|양상추|나물|샐러드|토마토|아욱|열무|숙주|청경채|미역|부추|깻잎|감자|고구마/;
const CARB_RE = /밥|쌀|면|국수|파스타|스파게티|빵|떡|또띠아|당면|우동|라면|피타|바게트|감자|고구마|오트밀|그래놀라/;
function nutrOf(items){
  const ds = items.map(v => v.t === "d" && byName(v.n)).filter(Boolean);
  const txt = ds.map(d => d.n + " " + d.i.join(" ")).join(" ");
  return {
    p: ds.some(d => d.d.some(x => ["육류","해산물","고단백"].includes(x))),
    v: ds.some(d => d.g === "반찬" || d.d.some(x => ["채식","비건"].includes(x))) || VEG_RE.test(txt),
    c: state.f.set === "table" || CARB_RE.test(txt)
  };
}

/* ======================= 식단표 ======================= */
function rows(){ return MEALS.filter(m => state.f.m.includes(m)); }
function cellLimit(meal){ return (state.f.set === "table" && isBig(meal)) ? 4 : 3; }

function paintPlan(){
  const head = document.getElementById("planHead");
  const body = document.getElementById("planBody");

  head.innerHTML = '<th class="rowlab"></th>' + DAYS.map((d, i) =>
    '<th class="' + (i === todayIdx ? 'today' : '') + '">' + d +

          b.className = "item";

          b.innerHTML = '<span class="role r-' + role + '">' + role + '</span>' +
            '<span class="nm' + (d ? "" : " custom") + '">' + esc(v.n) + '</span>' +

          b.title = d ? "눌러서 만드는 법 보기" : "눌러서 고치기";

  Object.values(state.plan).forEach(arr => arr.forEach(v => {

    : state.f.set === "bowl" ? "그 자체로 한 끼가 되는 요리"
    : "";
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickFrom(pool, used, prefer){
  if(!pool || !pool.length) return null;
  let cand = pool.filter(d => !used.has(d.n));
  if(!cand.length){ cand = pool.slice(); used.clear(); }
  if(prefer){
    const pc = cand.filter(prefer);
    if(pc.length) cand = pc;
  }
  const d = cand[Math.floor(Math.random() * cand.length)];
  used.add(d.n);
  return d;
}
const hasProtein = (d) => d.d.some(x => ["육류","해산물","고단백"].includes(x));
const isVeggie   = (d) => d.d.some(x => ["채식","비건"].includes(x));

/* 한 칸 채우기 */
function fillCell(meal, used){
  const out = [];
  if(state.f.set === "table" && isBig(meal)){
    const soup = pickFrom(poolRole(meal, "국"), used.국);
    const main = pickFrom(poolRole(meal, "메인"), used.메인, hasProtein)
              || pickFrom(poolRole(meal, "한그릇"), used.메인, hasProtein);
    const side = pickFrom(poolRole(meal, "반찬"), used.반찬, isVeggie);
    [soup, main, side].forEach(d => { if(d) out.push({t:"d", n:d.n}); });
    if(!out.length){
      const any = pickFrom(mainPool(meal), used.메인);
      if(any) out.push({t:"d", n:any.n});
    }
  }else{
    const d = pickFrom(mainPool(meal), used.메인);
    if(d) out.push({t:"d", n:d.n});
  }
  return out;
}
const freshUsed = () => ({국:new Set(), 메인:new Set(), 반찬:new Set()});

function rollCell(di, meal){
  const out = fillCell(meal, freshUsed());
  if(!out.length){ toast(meal + "에 맞는 요리가 없어요. 조건을 조금 풀어 주세요."); return; }
  state.plan[di + "|" + meal] = out;
  sync();
}

function generate(){
  const ms = rows();
  if(!ms.some(m => mainPool(m).length)){
    toast("조건에 맞는 요리가 없어요. 조리 시간을 늘리거나 뺀 조건을 줄여 보세요.");
    return;
  }
  state.plan = {};
  ms.forEach(meal => {
    const used = freshUsed();
    DAYS.forEach((_, di) => {
      const out = fillCell(meal, used);
      if(out.length) state.plan[di + "|" + meal] = out;
    });
  });
  state.checked = [];
  sync();
  toast("일주일 식단표를 새로 짰어요.");
}

/* ======================= 장보기 목록 ======================= */
function shopMap(){
  const map = new Map();
  Object.values(state.plan).forEach(arr => arr.forEach(v => {
    if(v.t !== "d") return;
    const d = byName(v.n);
    if(!d) return;
    d.i.forEach(ing => map.set(ing, (map.get(ing) || 0) + 1));
  }));
  if(state.f.set === "table" && Object.keys(state.plan).length) map.set("쌀", map.get("쌀") || 1);
  return map;
}
function paintShop(){
  const host = document.getElementById("shopBody");
  const map = shopMap();
  if(!map.size){
    host.innerHTML = '<p class="empty-note">식단표를 채우면 필요한 재료가 여기에 모입니다.</p>';
    return;
  }
  const items = [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));
  const ul = document.createElement("ul");
  ul.className = "shop-list";
  items.forEach(([nm, cnt]) => {
    const li = document.createElement("li");
    const lab = document.createElement("label");
    const done = state.checked.includes(nm);
    if(done) lab.classList.add("done");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = done;
    cb.onchange = () => {
      if(cb.checked){ if(!state.checked.includes(nm)) state.checked.push(nm); }
      else state.checked = state.checked.filter(x => x !== nm);
      save(); paintShop();
    };
    const span = document.createElement("span");
    span.className = "nm"; span.textContent = nm;
    const c = document.createElement("span");
    c.className = "cnt"; c.textContent = cnt > 1 ? (cnt + "회") : "";
    lab.append(cb, span, c);
    li.appendChild(lab);
    ul.appendChild(li);
  });
  host.innerHTML = "";
  host.appendChild(ul);
}

/* ======================= 요리 고르기 창 ======================= */
let target = null;            // {di, meal, idx}  idx -1 이면 새로 넣기
const dlg = document.getElementById("picker");

function openPicker(di, meal, idx){
  target = {di, meal, idx:(idx === undefined ? -1 : idx)};
  document.getElementById("dlgTitle").textContent = DAYS[di] + "요일 " + meal;
  const pool = poolMeal(meal);
  document.getElementById("dlgSub").textContent =
    (target.idx >= 0 ? "이 자리를 바꿉니다 · " : "이 칸에 더합니다 · ") +
    "조건에 맞는 " + meal + " 요리 " + pool.length + "가지";
  document.getElementById("dlgEmpty").textContent = target.idx >= 0 ? "이 요리 빼기" : "이 칸 비우기";
  document.getElementById("dlgSearch").value = "";
  paintOptions("");
  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
  setTimeout(() => document.getElementById("dlgSearch").focus(), 30);
}

function putDish(name, isCustom){
  const id = target.di + "|" + target.meal;
  const arr = state.plan[id] || [];
  const item = {t:isCustom ? "c" : "d", n:name};
  if(target.idx >= 0 && arr[target.idx]) arr[target.idx] = item;
  else{
    if(arr.length >= cellLimit(target.meal)){ toast("이 칸에는 " + cellLimit(target.meal) + "가지까지 담을 수 있어요."); return; }
    arr.push(item);
  }
  state.plan[id] = arr;
  closeDlg(); sync();
}

function paintOptions(q){
  const list = document.getElementById("dlgList");
  let pool = poolMeal(target.meal);
  if(q) pool = DISHES.filter(d => d.n.includes(q) || d.c.includes(q));
  list.innerHTML = "";
  if(!pool.length){
    list.innerHTML = '<p class="empty-note">맞는 요리가 없습니다. 위 칸에 직접 적고 “직접 넣기”를 눌러 주세요.</p>';
    return;
  }
  const put = (d) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="thumb">' + dishArt(d) + '</span><span class="txt">' +
      '<span class="nm">' + esc(d.n) + '</span><span class="mt">' +
      d.c + " · " + d.t + "분 · " + d.w.join("/") + " · " + d.d.join("/") + '</span></span>';
    b.onclick = () => putDish(d.n, false);
    list.appendChild(b);
  };
  ROLE_ORDER.forEach(role => {
    const grp = pool.filter(d => d.g === role);
    if(!grp.length) return;
    const h = document.createElement("div");
    h.className = "opt-head"; h.textContent = role;
    list.appendChild(h);
    grp.forEach(put);
  });
}

function closeDlg(){ if(dlg.open) dlg.close(); else dlg.removeAttribute("open"); }

document.getElementById("dlgSearch").addEventListener("input", e => paintOptions(e.target.value.trim()));
document.getElementById("dlgAdd").onclick = () => {
  const v = document.getElementById("dlgSearch").value.trim();
  if(!v){ document.getElementById("dlgSearch").focus(); return; }
  putDish(v, true);
};
document.getElementById("dlgEmpty").onclick = () => {
  const id = target.di + "|" + target.meal;
  const arr = state.plan[id] || [];
  if(target.idx >= 0){
    arr.splice(target.idx, 1);
    if(arr.length) state.plan[id] = arr; else delete state.plan[id];
  }else delete state.plan[id];
  closeDlg(); sync();
};
document.getElementById("dlgClose").onclick = closeDlg;

/* ======================= 요리 카드(만드는 법) ======================= */
const rdlg = document.getElementById("recipe");

function openRecipe(di, meal, idx){
  const arr = state.plan[di + "|" + meal] || [];
  const val = arr[idx];
  const d = val && val.t === "d" && byName(val.n);
  if(!d){ openPicker(di, meal, idx); return; }
  target = {di, meal, idx};

  document.getElementById("rcArt").innerHTML = dishArt(d);
  document.getElementById("rcName").textContent = d.n;

  const tags = document.getElementById("rcTags");
  tags.innerHTML = "";
  const add = (t, hi) => {
    const s = document.createElement("span");
    if(hi) s.className = "hi";
    s.textContent = t; tags.appendChild(s);
  };
  add(DAYS[di] + "요일 " + meal, true);
  add(d.g, true);
  add(d.c); add(d.t + "분");
  d.w.forEach(x => add(x)); d.d.forEach(x => add(x));

  document.getElementById("rcIng").textContent = d.i.join(" · ");

  const ol = document.getElementById("rcSteps");
  ol.innerHTML = "";
  (d.r.length ? d.r : ["조리법이 아직 준비되지 않은 요리예요."]).forEach(t => {
    const li = document.createElement("li");
    li.textContent = t; ol.appendChild(li);
  });

  document.querySelector(".rc-scroll").scrollTop = 0;
  if(typeof rdlg.showModal === "function") rdlg.showModal(); else rdlg.setAttribute("open","");
}
function closeRecipe(){ if(rdlg.open) rdlg.close(); else rdlg.removeAttribute("open"); }
document.getElementById("rcClose").onclick = closeRecipe;
document.getElementById("rcSwap").onclick = () => {
  const t = target;
  closeRecipe();
  openPicker(t.di, t.meal, t.idx);
};

/* ======================= 버튼 ======================= */
document.getElementById("gen").onclick = generate;

let armed = false, armTimer = null;
const clearBtn = document.getElementById("clear");
clearBtn.onclick = () => {
  if(!Object.keys(state.plan).length){ toast("표가 이미 비어 있어요."); return; }
  if(!armed){
    armed = true; clearBtn.textContent = "한 번 더 누르면 비워져요";
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { armed = false; clearBtn.textContent = "표 비우기"; }, 4000);
    return;
  }
  clearTimeout(armTimer); armed = false; clearBtn.textContent = "표 비우기";
  state.plan = {}; state.checked = []; sync(); toast("식단표를 비웠어요.");
};

document.getElementById("print").onclick = () => {
  try{ window.print(); }
  catch(e){ toast("인쇄창이 안 열리면 Ctrl+P 를 눌러 주세요."); }
};
document.getElementById("resetAll").onclick = () => {
  state.f = blankF(); state.fx = blankFx(); state.mode = blankMode();
  sync(); toast("조건을 처음 상태로 되돌렸어요.");
};
document.getElementById("copyShop").onclick = async () => {
  const map = shopMap();
  if(!map.size){ toast("아직 담긴 재료가 없어요."); return; }
  const txt = [...map.keys()].map(x => "· " + x).join("\n");
  const btn = document.getElementById("copyShop");
  let ok = false;
  try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){ ok = false; }
  btn.textContent = ok ? "복사했어요" : "복사가 안 돼요";
  if(!ok) toast("복사가 막혀 있어요. 목록을 드래그해서 직접 복사해 주세요.");
  setTimeout(() => { btn.textContent = "목록 복사"; }, 1800);
};

/* ======================= 공통 ======================= */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3200);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function sync(){ paintFilters(); paintMatch(); paintPlan(); paintShop(); save(); }

load();
buildFilters();
sync();
</script>

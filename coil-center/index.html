<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코일센터 경영 시뮬레이터</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --ink:#2e2a24; --dim:#7b7268; --line:#e2dbcf;
    --accent:#c8622e; --accent2:#3f7d68; --warn:#b8443a; --good:#3f7d68;
    --chip:#efe9dd; --shadow:0 2px 0 #e2dbcf, 0 8px 24px rgba(60,50,35,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 64px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
  h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13px;margin:0 0 20px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .grid{display:grid;gap:14px}
  @media(min-width:820px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} }

  /* 상단 스테이터스 */
  .hud{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:8px 12px;min-width:104px;flex:1 1 auto}
  .stat .k{font-size:11px;color:var(--dim);letter-spacing:.02em}
  .stat .v{font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .v.neg{color:var(--warn)} .v.pos{color:var(--good)}

  .phase{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
  .ph-BUST{background:#f2dedc;color:#a13a30}
  .ph-NORMAL{background:#e7e2d6;color:#6b6357}
  .ph-BOOM{background:#dbeade;color:#2f6b55}

  /* 캐릭터 말풍선 */
  .say{display:flex;gap:11px;align-items:flex-start;margin:0 0 12px}
  .face{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:grid;place-items:center;
    font-size:19px;background:var(--chip);border:1px solid var(--line)}
  .bubble{background:var(--chip);border:1px solid var(--line);border-radius:4px 13px 13px 13px;
    padding:9px 13px;font-size:14px;max-width:640px}
  .bubble .who{font-size:11px;color:var(--dim);display:block;margin-bottom:1px}

  /* 컨트롤 */
  label.row{display:block;margin:14px 0 0}
  .row .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
  .row .lab b{font-size:15px;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent);height:22px}
  .hint{font-size:12px;color:var(--dim);margin-top:3px}

  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:9px 15px;transition:.12s}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;
    padding:13px 26px;font-size:16px;box-shadow:0 3px 0 #a04d22}
  .primary:hover{box-shadow:0 4px 0 #a04d22}
  .choice{display:flex;gap:8px;flex-wrap:wrap}
  .choice button.on{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500;font-size:11px}
  tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}

  .bars{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .bar{display:grid;grid-template-columns:64px 1fr 74px;gap:9px;align-items:center;font-size:12px}
  .track{height:16px;background:var(--chip);border-radius:5px;overflow:hidden;position:relative}
  .fill{height:100%;background:var(--accent2);border-radius:5px}
  .fill.over{background:var(--warn)}
  .cap{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
  .bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}

  .note{background:#fdf6e7;border:1px solid #ecdfbe;border-radius:10px;padding:10px 13px;
    font-size:13px;margin:10px 0}
  .note.bad{background:#fbeceb;border-color:#efcfcc}
  .note.good{background:#e9f2ec;border-color:#cfe2d6}

  dialog{border:none;border-radius:16px;padding:0;max-width:660px;width:calc(100% - 32px);
    background:var(--panel);color:var(--ink);box-shadow:0 24px 70px rgba(50,40,25,.3)}
  dialog::backdrop{background:rgba(46,42,36,.42)}
  .dlg{padding:20px}
  .dlg h2{font-size:18px}
  .ok{text-align:right;margin-top:16px}

  .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .center{text-align:center}
  .muted{color:var(--dim)}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);
    border-radius:99px;padding:1px 9px;font-size:11px;color:var(--dim);margin-right:4px}

  /* ---- 새 화면 ---- */
  .topbar{display:flex;justify-content:space-between;align-items:center;
    margin:0 0 12px;font-size:15px}
  .topbar b{font-size:17px;letter-spacing:-.02em}
  .goal{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
  .goal .gnum{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;
    place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:14px}
  .goal b{display:block;font-size:15px}
  .goal span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
  table.perf th{font-size:11px}
  table.perf td:first-child{font-weight:600}
  table.perf tr.hq td{background:#f6f1e6}
  td.pos,.v.pos{color:var(--good)} td.neg,.v.neg{color:var(--warn)}
  .deck .dec{border-top:1px solid var(--line);padding:16px 0 4px}
  .deck .dec:first-of-type{border-top:none}
  .dhead{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
  .dhead b{font-size:15px;letter-spacing:-.01em}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opts button{flex:1 1 180px;text-align:left;padding:11px 14px;border-radius:11px;line-height:1.4}
  .opts button b{display:block;font-size:14px;font-weight:600}
  .opts button span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .opts button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .opts button.on b{font-weight:700}
  .opts button.on span{color:#dbece4}
  .dec.done .dhead b{color:var(--dim)}
  .fb{border-top:1px solid var(--line);padding:11px 0;font-size:14px}
  .fb:first-of-type{border-top:none}
  .fbc{font-size:14px;margin-top:2px}
  .fbm{font-size:13px;color:var(--dim);margin-top:3px}
  details.fold{padding:12px 16px}
  details.fold summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--dim)}
  details.fold[open] summary{margin-bottom:6px}
  .goalres{margin:0 0 18px}
  .goalres .gv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin:3px 0 6px}
</style>
<div class="wrap" id="app"></div>
<style>
  /* 공장 조감도 — 아이소메트릭. 면 색은 전부 인라인으로 칠하고
     여기서는 글자와 몇 가지 선만 잡는다. */
  .plant{width:100%;height:auto;display:block;border-radius:10px}
  .plant .sea{fill:#cfdee6}
  .plant .ground{fill:#ece5d7}
  .plant .zone{fill:#fffdf8;stroke:#ded6c7;stroke-width:1.5}
  .plant .coil{fill:#9aa4ad;stroke:#78828b;stroke-width:1.5}
  .plant .coil.bad{fill:#c98a80;stroke:#a9645a}
  .plant .coil.fgc{fill:#7fa892;stroke:#5f8874}
  .plant .ship{fill:#6f8794}
  .plant .line{fill:#f4efe3;stroke:#d9d0be;stroke-width:1.5}
  .plant .truck{fill:#b5814f}
  .plant .wheel{fill:#4a423a}
  .plant .slot{fill:none;stroke:#cfc6b4;stroke-width:1.6;stroke-dasharray:5 4}
  .plant .rail{stroke:#c9bfa9;stroke-width:1.6}
  .plant .hook{stroke:#7b7268;stroke-width:1.2}
  .plant .utilbg{fill:#ddd4c2}
  .plant .util{fill:#3f7d68}
  .plant .util.hot{fill:#c8622e}
  .plant .cap{font:700 11px ui-sans-serif,system-ui;fill:#4d463d;text-anchor:middle}
  .plant .lbl{font:700 13px ui-sans-serif,system-ui;fill:#3c352d}
  .plant .lbl.end{text-anchor:end}
  .plant .lbl.dim,.plant .tiny.dim{fill:#8d8579}
  .plant .lbl.warn,.plant .tiny.warn{fill:#b8443a}
  .plant .tiny{font:500 11px ui-sans-serif,system-ui;fill:#6b6357}
  .plant .tiny.mid{text-anchor:middle}
  .plant .tiny.b{font-weight:700}
</style>
<style>
  dialog.deck{max-width:560px}
  .dlgtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .optlist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .optlist button{text-align:left;padding:13px 16px;border-radius:12px;line-height:1.45}
  .optlist button b{display:block;font-size:15px}
  .optlist button span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .optlist button:hover{border-color:var(--accent2);background:#f4f9f6}
  .verdict{text-align:center;padding:22px 8px 6px}
  .vlabel{font-size:12px;color:var(--dim);letter-spacing:.06em}
  .vchoice{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0 12px;color:var(--accent)}
  .vmsg{font-size:15px;line-height:1.6;margin:0 auto 14px;max-width:420px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .chip{display:inline-block;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;
    font-variant-numeric:tabular-nums}
  .chip.up{background:#e2efe6;color:#2f6b55}
  .chip.down{background:#f7e2e0;color:#a5382e}

  /* 스테이터스 창 — 회사 / 지난달 실적 / 이달 말 잔액 세 줄 */
  .bandlab{font-size:11px;color:var(--dim);letter-spacing:.04em;margin:0 0 5px 2px;font-weight:700}
  .bandlab span{font-weight:400;letter-spacing:0}
  .hud.tight .stat{min-width:78px;padding:7px 10px}
  .hud.tight .stat .v{font-size:15px}
  .stat.lead{background:var(--chip)}
</style>
<script>
/* ============================================================
   코일센터 경영 시뮬레이터 · 경제 엔진
   설계 근거: _workspace/20260912_01/output/4-economy-engine.md (v3)
   1턴 = 1개월. 통화 USD, 물량 톤.
   ============================================================ */

/* ---------- 설정 ---------- */

const CFG = {
  // 판매 유형별 마진·수율 (v3 §1-2)
  COIL_MARGIN: 10,                                    // 전 유형 공통
  PROC_MARGIN: { C2C: 0, SLIT: 30, LEVEL: 30, TRAP: 45, DIE: 75 },
  YIELD:       { C2C: 1.00, SLIT: 0.98, LEVEL: 0.98, TRAP: 0.98, DIE: 0.85 },
  VAR_COST:    { C2C: 3, SLIT: 12, LEVEL: 12, TRAP: 25, DIE: 25 }, // 처리톤당

  // 라인 (v3 §2-1)
  LINE: {
    SLIT:  { cap: 8333, capex: 2_000_000, procs: ['SLIT'],          label: '슬리터' },
    LEVEL: { cap: 4167, capex: 2_000_000, procs: ['LEVEL'],         label: '레벨러' },
    BLANK: { cap: 2000, capex: 5_000_000, procs: ['TRAP', 'DIE'],   label: '블랭킹' },
  },
  MAX_LINES: 3,                    // 공장동 1개 수용 한도. 4라인째는 신규 인프라 $16M

  /* ---- 투자비 ----
     자본금 $25M으로 시작해 $22M을 설립에 쓴다. 남는 현금은 $3M뿐이다.
       토지        $4M  (비상각)
       공장동     $12M  (20년)
       사무동      $2M  (20년)
       설비 2라인  $4M  (10년)
     이 얇은 현금이 이 게임의 출발점이다. 소재 한 배가 $10M을 넘으니
     첫 발주부터 은행을 끼지 않으면 배를 띄울 수가 없다. */
  INFRA_TOTAL: 18_000_000,         // 토지 4 + 공장동 12 + 사무동 2
  LAND: 4_000_000,                 // 비상각
  BUILDING: 14_000_000,            // 공장동 12 + 사무동 2, 20년 = 240개월
  BUILDING_LIFE_M: 240,
  MACHINE_LIFE_M: 120,             // 10년 정액 (확정)
  START_EQUITY: 25_000_000,        // 납입자본금
  /* ---- 본사 지급보증 여신한도 ----
     자본금 $25M짜리 회사에 $50M 한도는 커 보이지만, 이 장사의 운전자금이 원래 그렇다.
     월 25,000톤을 사오면 매달 $22M이 나간다. 소재값은 도착 한 달 뒤에 내고
     판매대금은 두 달 뒤에 받으니, 그 시차만큼이 늘 은행에 물려 있다.
     거기에 개업 후 다섯 달은 매출이 0인 채로 고정비만 나간다.
     실제로 해외 코일센터가 본사 지급보증을 끼고 출발하는 이유가 이것이다.
     재고와 매출채권이 쌓이면 그걸 담보로 한도가 더 붙는다(BORROW_BASE_RATE). */
  CREDIT_LINE_BASE: 80_000_000,
  /* 여신한도는 최근 매출의 이 개월치까지 따라 올라간다. 단 본사를 설득해야 한다 —
     신뢰가 CREDIT_TRUST_FLOOR 이하면 한 푼도 못 올리고, CREDIT_TRUST_FULL이면 전부 받는다. */
  CREDIT_MONTHS_OF_SALES: 3.5,
  CREDIT_TRUST_FLOOR: 40,
  CREDIT_TRUST_FULL: 85,

  // 소재·시장 [가정]
  P_M_BASE: 750,
  SCRAP_RATE: 0.275,
  /* 현물은 프리미엄이 아니라 디스카운트다 (실무자 확인).
     현물로 돌리는 물건은 대개 진짜 범용 일반재라 실수요 대비 마진을 못 붙인다.
     현물의 상방은 "마진을 더 받는 것"이 아니라 "시세가 오르면 재고 평가가 뜨는 것" 하나뿐이고,
     하방은 평가손·보관비·열화·정체·사이즈 미스매치 네 가지다. */
  SPOT_MARGIN_ADJ: -6,           // [가정·확인필요] 톤당. 실수요 대비 못 받는 마진
  PM_SIGMA: 0.025,               // 월 변동성. 시나리오 사이클이 주인공이고 잡음은 거들기만 한다
  PM_JUMP_PROB: 0.04,
  PM_JUMP_SIZE: 0.18,
  /* 리드타임 분해 (실무자 확인): 주문접수 후 제조 2개월 + 해송 1개월 = 3개월.
     3개월치 안전재고라는 업계 통설은 여기서 나온다. */
  LEAD_TURNS: 3,
  /* L/C 유산스 90일은 B/L(선적) 기준이다. 선적하고 한 달 배를 타고 오니
     도착 시점엔 이미 두 달이 지나 있다. 결제는 도착 한 달 뒤다.
     이걸 도착 기준 90일로 잡으면 본사가 두 달치를 공짜로 대주는 게 되어
     코일센터가 현금이 넘치는 이상한 회사가 된다. */
  DPO_TURNS: 1,
  /* Net 60. 예전에는 여기에 지연 한 달을 더해 3턴으로 잡았는데, 연체는 아래
     DELAY_RATE로 이미 따로 굴리고 있어 이중 계산이었다. 소재값은 도착 한 달 뒤에
     나가고 판매대금은 두 달 뒤에 들어온다 — 그 한 달이 이 회사의 운전자금이다. */
  DSO_TURNS: 2,
  BUY_MAX_MULT: 1.25,              // 계획 발주량의 상한 (월 소비량 대비)
  /* 카드로 "넉넉히 시킨다"를 골라도 한 달에 이 배수를 넘겨 살 수는 없다.
     실제로도 코일센터는 한 달치씩 산다. 한 달에 두세 달치를 몰아 사면
     그 대금이 다섯 달 뒤 한 달에 통째로 청구돼 회사가 그 달에 죽는다.
     카드는 이 띠 안에서 0.7배와 1.35배 사이를 움직인다. */
  BUY_HARD_MAX: 1.35,
  /* 재고 상한. 리드타임 위에 이 개월치를 더한 선을 넘으면 더 시키지 않는다.
     카드에서 매달 "넉넉히 시킨다"를 골라도 여기서 멈춘다 — 창고도 은행도
     무한하지 않다. 이 선이 없으면 발주 카드 하나로 회사가 죽는다. */
  STOCK_CEIL: 1.6,
  TARGET_DIO_DAYS: 52.5,

  /* ---- 강종 (실무자 확인) — 이 게임의 진짜 축 ----
     코일센터 물량의 70% 이상이 자동차강판이다. 곁가지가 아니라 본체다.
     자동차강판 밖의 강종은 가격 경쟁이 너무 심해서 모사(철강사)가 그 가격을 못 맞춘다.
     코일센터는 어디서 사 오든 중간 마진만 붙이면 그만이지만, 모사는 그걸 할 수가 없다.

     그래서 갈라진다:
       자동차강판 = 모사 소재 = 본사 연결기여 발생 = 제조공기 길다 = 자금 더 묶인다
       일반재     = 3자 소재  = 본사 연결기여 0    = 회전 빠르다  = 단독 손익엔 도움
     코일센터 사장이 자금 회전을 위해 일반재를 늘리면 본사 실적은 한 푼도 안 늘어난다.
     이게 "혼자만 이겼습니다" 등급이 나오는 자리다. */
  GRADE: {
    COMMON:  { pmMult: 1.00, marginAdd:  0, leadAdd: 0, hqSupplied: false, label: '일반재' },
    PREMIUM: { pmMult: 1.18, marginAdd:  0, leadAdd: 1, hqSupplied: true,  label: '자동차강판' },
  },

const PROC_LIST = ['C2C', 'SLIT', 'LEVEL', 'TRAP', 'DIE'];

/* ---------- 난수 (시드 고정 가능) ---------- */

function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function rng() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function gauss(rng) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ---------- 톤당 손익 (v3 §1) ---------- */

// 상정 실효소재원가 = P_m × [ 1/y_a − (1/y_a − 1) × r_a ]
function effectiveMaterialCost(pm, y, scrapRate) {
  const inv = 1 / y;
  return pm * (inv - (inv - 1) * scrapRate);
}

// 판가 = 상정 실효소재원가 + 코일마진 + 가공마진
function unitPrice(proc, pmRef, assumedYield, assumedScrapRate, opts = {}) {
  const base = proc === 'C2C'
    ? pmRef
    : effectiveMaterialCost(pmRef, assumedYield, assumedScrapRate);
  return base
    + CFG.COIL_MARGIN
    + CFG.PROC_MARGIN[proc]
    + (opts.gradeMargin || 0)
    - (opts.discount || 0)
    + (opts.spotAdj || 0);
}

// 수율 차익 = P_m × (1 − r) × ( 1/y_a − 1/y_r )   ← 플레이어 실력이 돈이 되는 유일한 레버
function yieldGainPerTon(pm, scrapRate, assumedYield, actualYield) {
  return pm * (1 - scrapRate) * (1 / assumedYield - 1 / actualYield);
}

/* ---------- 이번 달 슬리팅 배분 ----------
   코일센터에서만 나오는 결정이다. 원코일 폭은 정해져 있고, 고객이 달라는 폭은 제각각이다.
   몇 조각으로 어떻게 나누느냐에 따라 잔폭(트림)이 달라지고, 그게 그대로 수율이 된다.
   같은 판가, 같은 소재값인데 여기서 이익이 갈린다. */
const COIL_WIDTH = 1219;   // 열연 표준 폭 (mm)

function trimOptions(rng) {
  // 이번 달 고객이 달라는 폭 세 가지 [가정]
  const menu = [
    [340, 285, 190], [420, 300, 215], [365, 250, 160],
    [480, 320, 175], [395, 275, 230], [310, 265, 205],
  ];
  const w = menu[Math.floor(rng() * menu.length)];
  const combos = [];
  for (let a = 0; a <= 3; a++) for (let b = 0; b <= 4; b++) for (let c = 0; c <= 6; c++) {
    if (a + b + c === 0) continue;
    const used = a * w[0] + b * w[1] + c * w[2];
    if (used > COIL_WIDTH) continue;
    combos.push({ a, b, c, used, yield: used / COIL_WIDTH });
  }
  combos.sort((x, y) => y.yield - x.yield);
  // 제일 좋은 것, 중간, 나쁜 것 — 셋을 보여준다
  const best = combos[0];
  const mid = combos.find(c => c.yield < best.yield - 0.03) || combos[1];
  const bad = combos.find(c => c.yield < (mid ? mid.yield : 1) - 0.05) || combos[combos.length - 1];
  const pick = [best, mid, bad].filter(Boolean);
  return { widths: w, options: pick.map(o => ({
    cuts: [o.a, o.b, o.c], used: o.used, trim: COIL_WIDTH - o.used, yield: o.yield })) };
}

// 지금이 4년 중 어느 장면인가
function chapterOf(turn) {
  for (const c of CFG.SCENARIO) if (turn <= c.to) return c;
  return CFG.SCENARIO[CFG.SCENARIO.length - 1];
}

/* 재고를 나이별로 갈라 본다. 톤수만 보면 장기재고가 안 보인다.
   같은 18,000톤이라도 전부 한 달짜리인 것과 절반이 열 달짜리인 것은 다른 회사다. */
function inventoryAging(state) {
  const buckets = [
    { label: '1개월 이내', max: 1, qty: 0, cost: 0 },
    { label: '1~3개월',   max: 3, qty: 0, cost: 0 },
    { label: '3~6개월',   max: 6, qty: 0, cost: 0 },
    { label: '6개월 이상', max: 999, qty: 0, cost: 0 },
  ];
  for (const pool of [state.invRaw, state.invFg]) for (const l of pool) {
    const age = state.turn - (l.arrivalTurn ?? l.madeTurn ?? state.turn);
    const b = buckets.find(x => age <= x.max) || buckets[3];
    b.qty += l.qty; b.cost += l.qty * l.unitCost;
  }
  return buckets;
}

/* 장기재고 — 들어온 지 석 달이 넘은 물건. 열화가 시작되는 경계와 같은 선이다.
   총재고만 보면 안 보인다. 이 숫자가 늘면 회사가 물건을 못 팔고 있다는 뜻이다. */
function longInventoryTons(state) {
  let t = 0;
  for (const pool of [state.invRaw, state.invFg]) for (const l of pool) {
    const age = state.turn - (l.arrivalTurn ?? l.madeTurn ?? state.turn);
    if (age > CFG.DEGRADE_FREE_TURNS) t += l.qty;
  }
  return t;
}

// 받을 돈과, 그중 약속한 날을 넘긴 돈
function receivables(state) {
  let total = 0, late = 0;
  for (const a of state.ar) { total += a.amount; if (a.late) late += a.amount; }
  return { total, late };
}

function capacityOf(state) {
  const cap = { SLIT: 0, LEVEL: 0, BLANK: 0 };
  for (const l of state.lines) cap[l.type] += l.cap;
  return cap;
}

/* 기저 수요 (실무자 확인) — 연 25만톤 코일센터.
     가공  슬리터 연 10만톤 + 레벨러 연 5만톤 = 연 15만톤 (설비 캐파가 상한)
     통코일 연 10만톤 — 라인을 안 쓰므로 캐파 상한이 없다
   통코일이 판매의 40%다. 마진은 톤당 $10뿐이라 얇지만, 가공을 안 하니
   변동비도 $3뿐이고 수율 손실이 없다. 대신 소재는 똑같이 사와야 하므로
   자금은 가공품과 똑같이 묶인다 — 물량의 절반이 여기 있다는 사실이
   이 회사의 운전자금 규모를 정한다.
   이 값이 게임의 생명선이다. 너무 크면 증설이 무조건 정답이 되어 게임이 죽고,
   너무 작으면 첫 판부터 재고가 쌓여 초보가 무조건 부도난다. */
const DEMAND_BASE = { C2C: 9800, SLIT: 10600, LEVEL: 5300, TRAP: 1500, DIE: 1500 };

/* 설비가 없으면 그 수요는 애초에 우리 앞에 오지 않는다.
   블랭킹 라인이 없는 코일센터에 블랭킹 내시를 줄 리가 없다.
   이걸 구분하지 않으면 못 만드는 물량까지 "못 쳐낸 내시"로 잡혀 수행률이 눌린다.
   반대로 라인을 넣는 순간 없던 시장이 열린다 — 증설의 진짜 보상이 이것이다. */
function procAvailable(state, proc) {
  if (proc === 'C2C') return true;                       // 통코일 장사는 라인이 필요 없다
  if (proc === 'SLIT' || proc === 'LEVEL') return state.lines.some(l => l.type === proc);
  return state.lines.some(l => l.type === 'BLANK');      // TRAP / DIE
}

function marketDemand(state) {
  const p = CFG.PHASE[state.market.phase];
  const trustCoef = 0.5 + state.trust / 200;
  const out = {};
  for (const k of PROC_LIST) {
    out[k] = procAvailable(state, k)
      ? Math.round(DEMAND_BASE[k] * p.mkt * (state.myShare / 0.10) * trustCoef) : 0;
  }
  return out;
}

/* 내시(內示) — 자동차강판의 월별 확정 물량.
   실무자 확인: 자동차강판은 물량이 매번 안정적이고 내시량을 미리 받아서 예측이 쉽다.
   그래서 이 게임에서 자동차강판 수요는 몇 달 앞까지 플레이어에게 공개된다.
   3개월(미착 포함)이라는 얇은 재고로 회사가 돌아가는 진짜 이유가 이것이다 —
   물량의 70%가 예측이 아니라 확정이면 안전재고를 두껍게 들 필요가 없다.
   반대로 일반재 수요는 그 달이 되어야 알 수 있고, 남는 캐파는 그걸로 메워야 한다. */
/* 본사도 바보가 아니다. 코일센터가 못 소화할 물량을 내시로 주지 않는다.
   그래서 내시량은 그 시점의 캐파에 묶인다 — 이게 증설의 진짜 보상이다.
   라인을 늘리면 내시가 따라 늘고, 안 늘리면 시장이 아무리 커도 내시는 캐파에서 멈춘다.
   다만 이미 나간 내시는 그대로이므로, 증설 효과가 물량으로 돌아오는 데 몇 달이 걸린다. */
function nasiCeiling(state) {
  const c = capacityOf(state);
  const m = CFG.NASI_CAP_MULT;
  return {
    C2C:   Infinity,                                   // 통코일은 라인을 안 쓴다
    SLIT:  c.SLIT * m,
    LEVEL: c.LEVEL * m,
    TRAP:  (c.BLANK / 2) * m,
    DIE:   (c.BLANK / 2) * m,
  };
}

function makeNasi(state, turn, rng) {
  const p = CFG.PHASE[state.market.phase];
  const trustCoef = 0.5 + state.trust / 200;
  const ceil = nasiCeiling(state);
  const tons = {}, potential = {};
  for (const k of PROC_LIST) {
    if (!procAvailable(state, k)) { tons[k] = 0; potential[k] = 0; continue; }
    const v = DEMAND_BASE[k] * CFG.PREMIUM_DEMAND_SHARE * p.mkt
            * (state.myShare / 0.10) * trustCoef * (1 + CFG.DEMAND_NOISE_AUTO * gauss(rng));
    potential[k] = Math.max(0, Math.round(v));          // 본사가 주고 싶어 하는 양
    tons[k] = Math.max(0, Math.round(Math.min(v, ceil[k])));  // 우리 캐파가 받을 수 있는 양
  }
  // 둘의 차이가 곧 "지금 증설하면 더 받을 수 있는 물량"이다. 이게 증설 신호다.
  return { turn, tons, potential };
}

/* 유통향에는 "시장 수요"라는 게 따로 없다. 본사가 푼 물량이 곧 팔 수 있는 물량이고,
   그것도 전체 판매의 15%까지다. 그래서 여기서는 손에 쥔 일반재를 그대로 내놓고,
   실제 제동은 아래 commonBudget이 건다. */
function commonDemandNow(state) {
  const out = {};
  for (const k of PROC_LIST) {
    out[k] = state.invFg
      .filter(l => l.proc === k && l.gr !== 'PREMIUM')
      .reduce((a, l) => a + l.qty, 0);
  }
  return out;
}

function inventoryTons(state, dt) {
  const f = l => (dt ? l.dt === dt : true);
  return state.invRaw.filter(f).reduce((a, l) => a + l.qty, 0)
       + state.invFg.filter(f).reduce((a, l) => a + l.qty, 0);
}
function openPoTons(state, dt) {
  return state.poOpen.filter(p => !dt || p.dt === dt).reduce((a, p) => a + p.qty, 0);
}
// 현물 노출액: 소재가 하락 시 그대로 손실이 되는 금액 (v3 §3-2)
function spotExposure(state) {
  return (inventoryTons(state, 'SPOT') + openPoTons(state, 'SPOT')) * state.market.pm;
}

function effectiveYield(base, morale) {
  return base - Math.max(0, 70 - morale) * 0.0004;
}

/* ---------- FIFO 출고 ---------- */

// FIRM/SPOT × 일반재/고급강 조합별로 쪼개서 돌려준다.
// 태그가 여기서 끊기면 α 슬라이더가 죽고, 강종이 끊기면 고급강이 공짜가 된다.
const TAG_KEYS = ['FIRM|COMMON', 'FIRM|PREMIUM', 'SPOT|COMMON', 'SPOT|PREMIUM'];
function lotKey(lot) {
  const dt = lot.dt === 'SPOT' ? 'SPOT' : 'FIRM';
  const gr = lot.gr === 'PREMIUM' ? 'PREMIUM' : 'COMMON';
  return `${dt}|${gr}`;
}
function drawFifo(pool, qty, filter) {
  let need = qty, cost = 0, taken = 0;
  const byTag = {};
  for (const k of TAG_KEYS) byTag[k] = { qty: 0, cost: 0 };
  const lots = filter ? pool.filter(filter) : pool;
  for (const lot of lots) {
    if (need <= 1e-9) break;
    const t = Math.min(lot.qty, need);
    const c = t * lot.unitCost;
    cost += c; taken += t; lot.qty -= t; need -= t;
    const k = lotKey(lot);
    byTag[k].qty += t; byTag[k].cost += c;
  }
  for (let i = pool.length - 1; i >= 0; i--) if (pool[i].qty <= 1e-9) pool.splice(i, 1);
  return { taken, cost, byTag };
}

function mergeDraw(a, b) {
  const out = {};
  for (const k of TAG_KEYS) out[k] = { qty: a.byTag[k].qty + b.byTag[k].qty, cost: a.byTag[k].cost + b.byTag[k].cost };
  return out;
}

/* ============================================================
   턴 결산 (v3 §5-2, 19단계)
   decision = {
     buy:  { totalTon, alpha },
     run:  { SLIT, LEVEL, TRAP, DIE },       // 투입톤
     sell: { C2C, SLIT, LEVEL, TRAP, DIE },  // 판매 희망톤
     invest: { addLine, salesEffort, yieldProgram },
     options: { overtime, discount }
   }
   ============================================================ */

function resolveTurn(state, decision) {
  const s = structuredClone(state);
  const rng = makeRng(s.rng + s.turn * 7919);
  s.rng = Math.floor(rng() * 1e9);

  const d = {
    buy:     { totalTon: 0, alpha: 0.7, beta: 0, hqSpotTon: 0, ...(decision.buy || {}) },
    run:     { SLIT: 0, LEVEL: 0, TRAP: 0, DIE: 0, ...(decision.run || {}) },
    sell:    { C2C: 0, SLIT: 0, LEVEL: 0, TRAP: 0, DIE: 0, ...(decision.sell || {}) },
    invest:  { addLine: null, newBuilding: false, salesEffort: 0, yieldProgram: 0, ...(decision.invest || {}) },
    options: { overtime: false, discount: 0, trimYield: 0, ...(decision.options || {}) },
  };

  const log = [];
  const flags = [];

  /* STEP 0·1은 턴 끝으로 옮겼다 (아래 STEP 20).
     사장은 이번 달 시황과 시세를 보고 결정한다. 결정한 뒤에 시황이 바뀌면
     "불황이니 본사 지시를 받겠다"고 누른 결재가 통상 달에 떨어지는 일이 생긴다.
     그건 게임이 아니라 함정이다. */
  const pm = s.market.pm;
  const scrapPrice = pm * s.market.scrapRate;
  const hqPerTon = pm * s.market.hqRate;

  /* STEP 2. 수요 갱신 — 영업 투자는 3턴 뒤에 효과 */
  {
    s.effortQueue = s.effortQueue.filter(e => { e.turnsLeft--; return true; });
    let gain = 0;
    s.effortQueue = s.effortQueue.filter(e => {
      if (e.turnsLeft <= 0) { gain += e.amount / 100_000 * CFG.SALES_EFFORT_GAIN; return false; }
      return true;
    });
    // 신뢰 효과는 비례식으로 건다. 절대값에 더하면 한두 턴 만에 시장이 사라진다.
    s.myShare *= 1 + (s.trust - 60) * CFG.TRUST_SHARE_COEF;
    s.myShare += gain;
    s.myShare = Math.max(0.02, Math.min(0.60, s.myShare));
    if (gain > 0) log.push(`영업 투자 효과가 나타났습니다. 점유율 +${(gain * 100).toFixed(2)}%p`);
  }
  /* 이번 달 자동차강판 물량은 이미 몇 달 전에 내시로 받아둔 확정 물량이다.
     일반재 물량은 지금 처음 드러난다. 남는 캐파를 그걸로 메울지가 이 게임의 결정이다. */
  let nasiNow = s.nasi.find(n => n.turn === s.turn);
  if (!nasiNow) nasiNow = makeNasi(s, s.turn, rng);
  s.nasi = s.nasi.filter(n => n.turn > s.turn);
  while (s.nasi.length < CFG.NASI_LEAD) {
    const t = s.turn + s.nasi.length + 1;
    s.nasi.push(makeNasi(s, t, rng));
  }
  const demandAuto = nasiNow.tons;
  const demandCommon = commonDemandNow(s);
  const demand = {};
  for (const k of PROC_LIST) demand[k] = demandAuto[k] + demandCommon[k];

  /* STEP 3. 설비 증설 */
  if (d.invest.addLine) {
    const t = d.invest.addLine;
    if (s.lines.length >= CFG.MAX_LINES && !d.invest.newBuilding) {
      flags.push('공장동은 3라인까지만 수용합니다. 4라인째는 신규 인프라 $16M이 필요합니다.');
    } else {
      // 4라인째는 공장동을 하나 더 지어야 한다. 설비값보다 건물값이 훨씬 크다.
      if (s.lines.length >= CFG.MAX_LINES) {
        s.cash -= CFG.INFRA_TOTAL;
        s.fa.land += CFG.LAND;
        s.fa.buildingNbv += CFG.BUILDING;
        s.buildings = (s.buildings || 1) + 1;
        log.push(`공장동을 한 동 더 지었습니다. 인프라 $${(CFG.INFRA_TOTAL / 1e6).toFixed(0)}M — 설비값의 8배입니다.`);
      }
      /* 설비는 돈을 낸다고 그 달에 도는 게 아니다. 발주·제작·선적·설치·시운전에 넉 달.
         호황을 보고 지르면 도착했을 때 호황이 끝나 있다. 이게 증설 타이밍의 전부다. */
      const capex = CFG.LINE[t].capex;
      s.cash -= capex;
      s.buildQueue = s.buildQueue || [];
      s.buildQueue.push({ type: t, capex, readyTurn: s.turn + CFG.INSTALL_TURNS });
      log.push(`${CFG.LINE[t].label} 1기를 발주했습니다. $${(capex / 1e6).toFixed(1)}M · ` +
               `${CFG.INSTALL_TURNS}개월 뒤인 ${s.turn + CFG.INSTALL_TURNS}월부터 돕니다.`);
    }
  }
  if (d.invest.salesEffort > 0) {
    s.cash -= d.invest.salesEffort;
    s.effortQueue.push({ amount: d.invest.salesEffort, turnsLeft: CFG.SALES_EFFORT_LAG });
  }
  let yieldBonus = 0;
  if (d.invest.yieldProgram > 0) {
    s.cash -= d.invest.yieldProgram;
    yieldBonus = Math.min(0.02, d.invest.yieldProgram / 100_000 * 0.004);
  }

  /* STEP 4. 발주 입고 (입고와 지급은 분리 — 90일 시차가 이 게임의 긴장감) */
  {
    const arrived = s.poOpen.filter(p => p.etaTurn <= s.turn);
    s.poOpen = s.poOpen.filter(p => p.etaTurn > s.turn);
    for (const p of arrived) {
      s.invRaw.push({ qty: p.qty, unitCost: p.unitPriceFixed, arrivalTurn: s.turn, dt: p.dt, gr: p.gr || 'COMMON' });
      s.ap.push({ amount: p.qty * p.unitPriceFixed, dueTurn: s.turn + CFG.DPO_TURNS });
    }
    if (arrived.length) log.push(`소재 ${Math.round(arrived.reduce((a, p) => a + p.qty, 0)).toLocaleString()}톤이 입고되었습니다.`);
  }

  /* STEP 5. 신규 발주 (가격은 발주 시점 확정 — 미착분도 가격 리스크 보유)
     고급강은 소재가가 비싸고 제조공기가 2개월 더 걸린다. 주문하는 순간 5개월을 기다려야 한다. */
  const cap0 = capacityOf(s);
  let lcFee = 0, hqSpotOffer = 0;
  if (d.buy.totalTon > 0) {
    const beta = Math.max(0, Math.min(1, d.buy.beta || 0));
    const alpha = Math.max(0, Math.min(1, d.buy.alpha));
    for (const gr of ['COMMON', 'PREMIUM']) {
      const g = CFG.GRADE[gr];
      const gTon = d.buy.totalTon * (gr === 'PREMIUM' ? beta : 1 - beta);
      if (gTon <= 0.01) continue;
      const price = pm * g.pmMult;
      // 자동차강판은 고객 전용 규격이라 현물로 쟁여둘 수가 없다. 전량 실수요다.
      // 그래서 α(실수요 비율)는 일반재 안에서만 의미를 갖는다.
      const aEff = gr === 'PREMIUM' ? 1 : alpha;
      for (const [qty, dt] of [[gTon * aEff, 'FIRM'], [gTon * (1 - aEff), 'SPOT']]) {
        if (qty <= 0.01) continue;
        s.poOpen.push({
          qty, unitPriceFixed: price, dt, gr,
          etaTurn: s.turn + CFG.LEAD_TURNS + g.leadAdd,
        });
      }
      lcFee += gTon * price * CFG.LC_FEE_RATE;
    }
  }

  /* STEP 5b. 불황기 본사 지시 스팟 — 싸게 주는 대신 재고 리스크는 전부 이쪽이 진다 */
  let hqSpotTon = 0;
  if (CFG.HQ_SPOT.phases.includes(s.market.phase)) {
    const capTon = (cap0.SLIT + cap0.LEVEL + cap0.BLANK) * CFG.HQ_SPOT.capShareOfCap;
    hqSpotOffer = capTon;
    hqSpotTon = Math.max(0, Math.min(d.buy.hqSpotTon || 0, capTon));
    if (hqSpotTon > 0.01) {
      const price = pm * (1 - CFG.HQ_SPOT.discount);
      s.poOpen.push({ qty: hqSpotTon, unitPriceFixed: price, dt: 'SPOT', gr: 'COMMON',
                      src: 'HQ', etaTurn: s.turn + CFG.LEAD_TURNS });
      lcFee += hqSpotTon * price * CFG.LC_FEE_RATE;
      s.trust += 1;
      s.hqSpotCredit = (s.hqSpotCredit || 0) + hqSpotTon;   // 본사가 민 물량은 팔 권한도 같이 준다
      log.push(`본사 지시 유통향 스팟 ${Math.round(hqSpotTon).toLocaleString()}톤을 시세보다 ${(CFG.HQ_SPOT.discount * 100).toFixed(0)}% 싸게 받았습니다.`);
    } else if (hqSpotOffer > 0) {
      s.trust -= CFG.HQ_SPOT.refuseTrustCost;
      flags.push('본사 가동 물량 지시를 받지 않았습니다. 본사와의 관계가 상합니다.');
    }
  }

  /* STEP 5b. 창고 정체 — 재고가 야드를 넘치면 동선이 막혀 가동이 떨어지고 외부창고비가 붙는다 */
  const stockNow = inventoryTons(s);
  const whCap = CFG.WAREHOUSE_CAP_BASE;
  const overTons = Math.max(0, stockNow - whCap);
  let congestionPenalty = 0;
  if (overTons > 0) {
    congestionPenalty = CFG.WAREHOUSE_OVER_CAP_PENALTY;
    flags.push(`재고가 야드 한도를 ${Math.round(overTons).toLocaleString()}톤 넘겼습니다. 동선이 막혀 가동이 떨어집니다.`);
  }

  /* STEP 6. 캐파 검증 */
  const cap = capacityOf(s);
  const mult = (d.options.overtime ? CFG.OT_CAP_MULT : 1) * (1 - congestionPenalty);
  const used = { SLIT: d.run.SLIT, LEVEL: d.run.LEVEL, BLANK: d.run.TRAP + d.run.DIE };
  for (const k of ['SLIT', 'LEVEL', 'BLANK']) {
    const limit = cap[k] * mult;
    if (used[k] > limit + 1e-6) {
      const ratio = limit / used[k];
      if (k === 'BLANK') { d.run.TRAP *= ratio; d.run.DIE *= ratio; }
      else d.run[k] *= ratio;
      flags.push(`${CFG.LINE[k].label} 캐파를 넘겨 가동을 ${Math.round((1 - ratio) * 100)}% 줄였습니다.`);
    }
  }
  if (d.options.overtime) s.morale -= 5;

  /* STEP 7. 소재 출고 (FIFO, FIRM/SPOT 태그 승계) */
  const needTon = d.run.SLIT + d.run.LEVEL + d.run.TRAP + d.run.DIE + d.sell.C2C;
  const rawAvail = s.invRaw.reduce((a, l) => a + l.qty, 0);
  let shortRatio = 1;
  if (needTon > rawAvail + 1e-6) {
    shortRatio = rawAvail / Math.max(needTon, 1e-9);
    for (const k of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) d.run[k] *= shortRatio;
    d.sell.C2C *= shortRatio;
    flags.push(rawAvail < 1 && s.turn <= CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd
      ? '첫 배가 아직 도착하지 않았습니다. 라인은 아직 돌지 않습니다.'
      : '소재가 부족해 가동을 줄였습니다.');
  }

  /* STEP 8. 생산 */
  let scrapTon = 0;
  const produced = {};
  for (const proc of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) {
    const input = d.run[proc];
    if (input <= 0.01) continue;
    /* 슬리팅은 이번 달 배분이 수율을 정한다. 상정 수율(고객과 약속한 98%)보다
       잘 자르면 그 차익이 우리 몫이고, 못 자르면 우리가 문다. */
    const yBase = (proc === 'SLIT' && d.options.trimYield)
      ? d.options.trimYield + yieldBonus
      : CFG.YIELD[proc] + yieldBonus;
    const yEff = Math.min(0.995, effectiveYield(yBase, s.morale));
    // 생산은 수주 잔고에 맞춰 짠다. 창고 앞줄에 있는 코일부터 무작정 태우면
    // 고급강이 2개월 늦게 들어오는 탓에 어떤 달은 고급강만, 어떤 달은 일반재만 나온다.
    // 생산 배분은 창고에 있는 소재의 강종 구성을 따른다
    const rawP = s.invRaw.filter(l => l.gr === 'PREMIUM').reduce((a, l) => a + l.qty, 0);
    const rawAll = s.invRaw.reduce((a, l) => a + l.qty, 0);
    const autoShare = rawAll > 0 ? rawP / rawAll : 1;
    const byTag = mergeDraw(
      drawFifo(s.invRaw, input * (1 - autoShare), l => l.gr !== 'PREMIUM'),
      drawFifo(s.invRaw, input * autoShare, l => l.gr === 'PREMIUM'));
    let taken = TAG_KEYS.reduce((a, k) => a + byTag[k].qty, 0);
    if (taken < input - 1e-6) {   // 한쪽 강종이 바닥나면 남은 강종으로 채운다
      const fill = drawFifo(s.invRaw, input - taken);
      for (const k of TAG_KEYS) { byTag[k].qty += fill.byTag[k].qty; byTag[k].cost += fill.byTag[k].cost; }
      taken = TAG_KEYS.reduce((a, k) => a + byTag[k].qty, 0);
    }
    if (taken <= 1e-9) continue;
    scrapTon += taken * (1 - yEff);
    // 태그·강종별로 제품 lot을 따로 만든다. 섞으면 가격 리스크와 강종 마진 귀속이 틀어진다.
    for (const k of TAG_KEYS) {
      const b = byTag[k];
      if (b.qty <= 1e-9) continue;
      const [tag, gr] = k.split('|');
      const out = b.qty * yEff;
      s.invFg.push({
        proc, qty: out, unitCost: b.cost / out, dt: tag, gr, madeTurn: s.turn,
        ya: CFG.YIELD[proc], ra: s.market.scrapRate, yActual: yEff,
      });
    }
    produced[proc] = (produced[proc] || 0) + taken * yEff;
  }
  /* STEP 8b. 코일 투 코일 (라인 미사용, 수율 100%) */
  if (d.sell.C2C > 0.01) {
    const { taken, byTag } = drawFifo(s.invRaw, d.sell.C2C);
    if (taken > 1e-9) {
      for (const k of TAG_KEYS) {
        const b = byTag[k];
        if (b.qty <= 1e-9) continue;
        const [tag, gr] = k.split('|');
        s.invFg.push({ proc: 'C2C', qty: b.qty, unitCost: b.cost / b.qty, dt: tag, gr, madeTurn: s.turn, ya: 1, ra: 0, yActual: 1 });
      }
      produced.C2C = taken;
    }
  }

  /* STEP 9~10. 판가 산출 및 판매 */
  let revenue = 0, cogs = 0, yieldGainTotal = 0, shippedTotal = 0;
  const shortageEvents = [];
  const shipped = {};
  // 본사가 코일센터를 볼 때 제일 먼저 보는 숫자: 내시 물량을 얼마나 쳐냈는가
  let autoShippedTurn = 0, commonShippedTurn = 0;
  const autoDemandTurn = PROC_LIST.reduce((a, k) => a + demandAuto[k], 0);

  /* 유통향 15% 상한을 걸려면 이번 달 실수요 출하량을 먼저 알아야 한다.
     그래서 한 번 훑어서 실수요분을 잡고, 거기에 비례해 유통 예산을 배분한다. */
  const plan = {};
  let autoPlan = 0;
  for (const proc of PROC_LIST) {
    const wantAll = Math.min(d.sell[proc] || 0, demand[proc] || 0);
    const prAvail = s.invFg.filter(l => l.proc === proc && l.gr === 'PREMIUM')
                           .reduce((a, l) => a + l.qty, 0);
    const wantP = Math.max(0, Math.min(demandAuto[proc], prAvail, wantAll));
    plan[proc] = { wantAll, prAvail, wantP };
    autoPlan += wantP;
  }
  const capShare = CFG.COMMON_SALES_CAP;
  /* 유통향(일반재)은 출처가 어디든 전체 판매의 15%까지만 나간다.
     본사가 불황기에 밀어넣은 물량이든 우리가 3자에서 싸게 사 온 물량이든 똑같다.
     예전에는 "본사가 푼 양"으로 한 번 더 조였는데, 그러면 3자 소재로 산 일반재는
     팔 데가 아예 없어 창고에서 죽는다. 그건 전략이 아니라 함정이다.
     한도를 넘겨 사 온 일반재는 그대로 남아 늙고, 녹슬고, 반값에 나간다 —
     그게 과다 매입의 대가지 '판매 금지'가 대가는 아니다. */
  const commonBudget = autoPlan * capShare / (1 - capShare);
  const commonDemandTotal = PROC_LIST.reduce((a, k) => a + demandCommon[k], 0);

  for (const proc of PROC_LIST) {
    const wantAll = plan[proc].wantAll;
    if (wantAll <= 0.01) { shipped[proc] = 0; continue; }

    /* 고급강 수요는 따로 있고, 없는 물건은 팔 수 없다.
       고급강을 안 들이면 그 22%는 그냥 경쟁사로 간다 — 약속을 깬 게 아니니 결품이 아니다.
       대신 고급강을 수요 이상으로 사 오면 창고에 눕고, 5개월치 자금이 거기 묶인다.
       결품 페널티는 일반재 쪽에서만 문다. */
    /* 내시는 약속이다. 확정 물량을 먼저 채우고, 남는 것만 유통으로 돌린다.
       비례 배분을 하면 자동차 고객에게 갈 물건이 유통으로 새어 나가고,
       사장이 "본사 물량부터 채우겠다"는 당연한 선택을 할 수 없게 된다.
       그리고 유통으로 돌릴 수 있는 양은 본사 정책상 전체의 15%까지다. */
    const wantP = plan[proc].wantP;
    const share = commonDemandTotal > 0 ? demandCommon[proc] / commonDemandTotal : 0;
    const wantC = Math.min(demandCommon[proc], wantAll - wantP, commonBudget * share);
    const wantBy = { PREMIUM: wantP, COMMON: Math.max(0, wantC) };
    const want = wantBy.PREMIUM + wantBy.COMMON;
    if (want <= 0.01) { shipped[proc] = 0; continue; }

    let lineRevenue = 0, lineCogs = 0, ship = 0;
    for (const gr of ['PREMIUM', 'COMMON']) {
      const pool = s.invFg.filter(l => l.proc === proc && (l.gr || 'COMMON') === gr);
      const avail = pool.reduce((a, l) => a + l.qty, 0);
      let need = Math.min(wantBy[gr], avail);
      if (need <= 1e-9) continue;
      ship += need;

      // lot을 하나씩 출고하며 태그별로 판가를 따로 매긴다.
      // FIRM은 매입가 연동이라 스프레드가 고정된다. SPOT은 당월 시세로 팔되 마진 자체가 얇다.
      if (gr === 'PREMIUM') autoShippedTurn += need; else commonShippedTurn += need;
      for (const lot of pool) {
        if (need <= 1e-9) break;
        const t = Math.min(lot.qty, need);
        const isSpot = lot.dt === 'SPOT';
        const pmRef = isSpot ? pm * CFG.GRADE[gr].pmMult : lot.unitCost * CFG.YIELD[proc];
        const price = unitPrice(proc, pmRef, lot.ya, lot.ra, {
          discount: d.options.discount,
          gradeMargin: CFG.GRADE[gr].marginAdd,
          spotAdj: isSpot ? CFG.SPOT_MARGIN_ADJ : 0,
        });
        lineRevenue += t * price;
        lineCogs += t * lot.unitCost;
        if (proc !== 'C2C') yieldGainTotal += yieldGainPerTon(pmRef, lot.ra, lot.ya, lot.yActual) * t;
        lot.qty -= t; need -= t;
      }
    }
    for (let i = s.invFg.length - 1; i >= 0; i--) if (s.invFg[i].qty <= 1e-9) s.invFg.splice(i, 1);
    if (ship <= 1e-9) { shipped[proc] = 0; continue; }

    revenue += lineRevenue;
    cogs += lineCogs;
    s.ar.push({ amount: lineRevenue, dueTurn: s.turn + CFG.DSO_TURNS });
    shipped[proc] = ship;
    shippedTotal += ship;

    // 결품은 신뢰를 깎는 정도가 아니다. 실무자 확인: 결품을 내면 그 고객은 영영 끝이다.
    // 그래서 점유율을 영구히 깎는다. 이게 3개월 안전재고를 드는 이유다.
    const shortRate = (want - ship) / Math.max(want, 1);
    if (shortRate > 0.05 && s.turn > CFG.LEAD_TURNS) {
      const lost = CFG.SHORTAGE_SHARE_LOSS * Math.min(1, shortRate * 2);
      s.myShare *= 1 - lost;
      // 잃은 고객은 점유율에서 이미 영구히 뺐다. 평판 타격까지 영구로 두면 이중 계산이다.
      s.trust -= Math.min(3, shortRate * 8);
      shortageEvents.push(proc);
      flags.push(`${proc} 결품 ${Math.round(want - ship)}톤. 그 고객은 돌아오지 않습니다. 점유율 ${(lost * 100).toFixed(1)}% 영구 상실.`);
    }
  }

  // 판 만큼 크레딧에서 깎는다. 본사가 푼 물량을 다 소진하면 유통 판매도 끝난다
  s.hqSpotCredit = Math.max(0, (s.hqSpotCredit || 0) - commonShippedTurn);
  const commonShareOfSales = shippedTotal > 0 ? commonShippedTurn / shippedTotal : 0;

  /* STEP 12. 스크랩 매각 */
  const scrapRevenue = scrapTon * scrapPrice;
  if (scrapRevenue > 0) s.ar.push({ amount: scrapRevenue, dueTurn: s.turn + 1 });

  /* STEP 12b. 재고 열화 — 오래 안고 있으면 녹·백청·스크래치로 상품성을 잃는다.
     현물을 "가격 오를 때까지 들고 있자"는 전략의 진짜 대가가 여기 있다. */
  let degradeLoss = 0, degradeTon = 0;
  for (const pool of [s.invRaw, s.invFg]) {
    for (const lot of pool) {
      const age = s.turn - (lot.arrivalTurn ?? lot.madeTurn ?? s.turn);
      if (age <= CFG.DEGRADE_FREE_TURNS) continue;
      const lossRate = age >= CFG.DEGRADE_DEAD_TURNS
        ? 1.0                                   // 불용재고. 스크랩으로 처분
        : CFG.DEGRADE_RATE * (age - CFG.DEGRADE_FREE_TURNS);
      const lost = lot.qty * Math.min(1, lossRate);
      if (lost <= 1e-9) continue;
      degradeTon += lost;
      degradeLoss += lost * Math.max(0, lot.unitCost - scrapPrice); // 스크랩값은 건진다
      lot.qty -= lost;
    }
  }
  for (const pool of [s.invRaw, s.invFg])
    for (let i = pool.length - 1; i >= 0; i--) if (pool[i].qty <= 1e-9) pool.splice(i, 1);
  if (degradeTon > 1) {
    s.ar.push({ amount: degradeTon * scrapPrice, dueTurn: s.turn + 1 });
    log.push(`오래된 재고 ${Math.round(degradeTon).toLocaleString()}톤이 상품성을 잃어 스크랩 처분했습니다. 손실 $${Math.round(degradeLoss).toLocaleString()}`);
  }

  /* STEP 12c. 현물 사이즈 미스매치 — 물건은 멀쩡한데 그 폭·두께가 아무에게도 안 맞는 경우.
     실무자 확인: "아예 그 사이즈가 안 팔려서 반값 이하로 팔아야 하는 리스크".
     실수요(FIRM)는 고객이 정해져 있으니 이 리스크가 없다. 현물만 문다. */
  let dumpLoss = 0, dumpTon = 0;
  for (const pool of [s.invRaw, s.invFg]) {
    for (const lot of pool) {
      if (lot.dt !== 'SPOT' || lot.qty <= 1e-9) continue;
      const age = s.turn - (lot.arrivalTurn ?? lot.madeTurn ?? s.turn);
      if (age < CFG.DUMP_AGE_TURNS) continue;
      if (rng() >= CFG.DUMP_PROB) continue;
      const recover = lot.unitCost * CFG.DUMP_PRICE_RATE;
      dumpTon += lot.qty;
      dumpLoss += lot.qty * (lot.unitCost - recover);
      s.ar.push({ amount: lot.qty * recover, dueTurn: s.turn + 1 });
      lot.qty = 0;
    }
  }
  for (const pool of [s.invRaw, s.invFg])
    for (let i = pool.length - 1; i >= 0; i--) if (pool[i].qty <= 1e-9) pool.splice(i, 1);
  if (dumpTon > 1) {
    flags.push(`현물 ${Math.round(dumpTon).toLocaleString()}톤이 사이즈가 안 맞아 반값 이하로 넘겼습니다. 손실 $${Math.round(dumpLoss).toLocaleString()}`);
  }

  /* STEP 13. 재고 저가법 평가 — SPOT에만 적용. FIRM은 절대 인식하지 않음 */
  let valuationLoss = 0;
  for (const lot of s.invRaw) {
    if (lot.dt !== 'SPOT') continue;
    if (pm < lot.unitCost) { valuationLoss += lot.qty * (lot.unitCost - pm); lot.unitCost = pm; }
  }
  for (const lot of s.invFg) {
    if (lot.dt !== 'SPOT') continue;
    const mark = pm / CFG.YIELD[lot.proc];
    if (mark < lot.unitCost) { valuationLoss += lot.qty * (lot.unitCost - mark); lot.unitCost = mark; }
  }
  // 미착 발주도 노출된다. 발주 시점에 가격이 확정되므로(A-6), 배가 오기 전에 시세가 빠지면
  // 그 손실은 이미 우리 것이다. 이걸 빼면 현물이 프리미엄만 받는 무적 전략이 된다.
  for (const po of s.poOpen) {
    if (po.dt !== 'SPOT') continue;
    if (pm < po.unitPriceFixed) {
      valuationLoss += po.qty * (po.unitPriceFixed - pm);
      po.unitPriceFixed = pm;
    }
  }
  if (valuationLoss > 0) log.push(`현물 재고에서 평가손 $${Math.round(valuationLoss).toLocaleString()}이 발생했습니다.`);

  /* STEP 14. 비용 */
  const extraLines = Math.max(0, s.lines.length - 2);
  const fixedCost = CFG.FC_BASE + extraLines * CFG.FC_PER_EXTRA_LINE + (d.options.overtime ? CFG.OT_COST : 0);
  let varCost = 0;
  for (const proc of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) varCost += d.run[proc] * CFG.VAR_COST[proc];
  varCost += (produced.C2C || 0) * CFG.VAR_COST.C2C;
  // 재고 보유 비용: 보관·보험·핸들링과 초과분 외부창고비만 여기서 받는다.
  // 묶인 자본의 금리 부담은 아래 interest(차입 이자)가 이미 받고 있다. 여기서 또 받으면 이중이다.
  const stockEnd = inventoryTons(s);
  const carryCost = stockEnd * CFG.CARRY_COST_PER_TON
                  + overTons * CFG.WAREHOUSE_OVER_COST;
  varCost += carryCost;
  const depreciation = (s.buildings || 1) * CFG.BUILDING / CFG.BUILDING_LIFE_M + s.fa.machineCost / CFG.MACHINE_LIFE_M;
  const interest = s.debt.principal * CFG.DEBT_RATE_MONTHLY;

  /* STEP 15. 채권 회수 */
  let cashIn = 0, badDebt = 0;
  const arKeep = [];
  for (const a of s.ar) {
    if (a.dueTurn > s.turn) { arKeep.push(a); continue; }
    // 약속한 날에 안 들어온 돈. 한 번 밀리면 그 채권은 계속 '지연'으로 남는다.
    // 화면 맨 위에 이 금액이 뜨는 이유가 있다 — 매출채권 전체보다 이쪽이 먼저 아프다.
    if (rng() < CFG.DELAY_RATE) {
      a.dueTurn += 1; a.late = (a.late || 0) + 1; arKeep.push(a);
    }
    else cashIn += a.amount;
  }
  s.ar = arKeep;

  /* STEP 15b. 대손 — 자동차 고객사가 아니라 가전·건설 쪽에서 몇 년에 한 번 크게 온다.
     매달 0.05%씩 떼이는 회사는 없다. 안 터지다가 어느 달 갑자기 온다. */
  if (rng() < CFG.BAD_DEBT_PROB) {
    const want = CFG.BAD_DEBT_MIN + rng() * (CFG.BAD_DEBT_MAX - CFG.BAD_DEBT_MIN);
    let need = Math.min(want, s.ar.reduce((a, x) => a + x.amount, 0));
    if (need > 1) {
      badDebt = need;
      // 오래된 채권부터 턴다 — 못 받고 있던 그 돈이 결국 못 받는 돈이 된다.
      s.ar.sort((a, b) => a.dueTurn - b.dueTurn);
      for (const a of s.ar) {
        if (need <= 1e-9) break;
        const t = Math.min(a.amount, need);
        a.amount -= t; need -= t;
      }
      s.ar = s.ar.filter(a => a.amount > 1e-9);
      s.trust -= 2;
      flags.push(`가전·건설 쪽 고객사 한 곳이 부도났습니다. 받을 돈 $${Math.round(badDebt).toLocaleString()}을 털었습니다.`);
    }
  }

  /* STEP 16. 채무 지급 */
  let cashOut = 0;
  const apKeep = [];
  for (const p of s.ap) { if (p.dueTurn <= s.turn) cashOut += p.amount; else apKeep.push(p); }
  s.ap = apKeep;

  /* STEP 16b. 차입 한도는 담보를 따라 움직인다.
     운전자본 대출은 자본금이 아니라 재고와 매출채권에 붙는다.
     그래서 장사가 커지면 한도도 같이 커지고, 재고를 털면 한도도 같이 줄어든다.
     불황에 재고가 빠지는 순간 은행 한도까지 같이 빠지는 게 진짜 무서운 지점이다. */
  {
    const base = inventoryTons(s) * pm + s.ar.reduce((a, x) => a + x.amount, 0);
    /* 장사가 커지면 본사에 얘기해 여신을 키운다 (실무자 확인).
       다만 본사가 자동으로 올려주지는 않는다 — 설득해야 한다.
       그 설득력이 곧 본사 신뢰다. 내시를 꼬박꼬박 쳐내고 불황기에 본사 물량을
       받아준 법인은 한도를 키워 받고, 결품 내고 본사 지시를 거절한 법인은
       장사가 아무리 커져도 기본 한도에 묶인다.
       성장이 곧 자금 압박인데, 그 압박을 풀 열쇠를 평소에 쌓아 두는 구조다. */
    const recent = s.history.slice(-3);
    const rev3 = recent.length ? recent.reduce((a, h) => a + h.revenue, 0) / recent.length : 0;
    const persuade = Math.max(0, Math.min(1, (s.trust - CFG.CREDIT_TRUST_FLOOR)
                                            / (CFG.CREDIT_TRUST_FULL - CFG.CREDIT_TRUST_FLOOR)));
    s.debt.limit = Math.max(CFG.CREDIT_LINE_BASE, base * CFG.BORROW_BASE_RATE,
                            rev3 * CFG.CREDIT_MONTHS_OF_SALES * persuade);
  }

  /* STEP 17. 현금 정산 및 부도 판정 */
  s.cash += cashIn - cashOut - fixedCost - varCost - interest - lcFee;
  if (s.cash < 0) {
    const need = -s.cash;
    if (s.debt.principal + need <= s.debt.limit) {
      s.debt.principal += need; s.cash = 0;
      flags.push(`자금이 모자라 $${Math.round(need).toLocaleString()}을 차입했습니다.`);
    } else {
      s.over = true; s.overReason = 'INSOLVENT';
    }
  }
  /* 여윳돈이 생기면 먼저 빚부터 갚는다.
     이게 없으면 통장에 현금을 쌓아 둔 채로 그 돈에 이자를 무는 회사가 된다.
     한 달 고정비 정도만 남기고 나머지는 상환한다 — 실제 운전자금 대출이 그렇게 돌아간다. */
  else if (s.cash > CFG.FC_BASE && s.debt.principal > 0) {
    const pay = Math.min(s.cash - CFG.FC_BASE, s.debt.principal);
    s.cash -= pay; s.debt.principal -= pay;
  }

  /* STEP 18. 재무제표 */
  const gp = revenue + scrapRevenue - cogs - valuationLoss - degradeLoss - dumpLoss;
  const ebitda = gp - fixedCost - varCost;
  const op = ebitda - depreciation;
  const np = op - interest - badDebt;
  s.fa.buildingNbv = Math.max(0, s.fa.buildingNbv - (s.buildings || 1) * CFG.BUILDING / CFG.BUILDING_LIFE_M);
  s.fa.machineAccDep += s.fa.machineCost / CFG.MACHINE_LIFE_M;
  s.equity += np;

  /* STEP 19. 본사 연결 기여
     모사가 공급할 수 있는 건 자동차강판뿐이다. 일반재는 가격 경쟁이 심해 모사가 못 맞추고,
     코일센터는 3자 소재를 사서 마진만 붙이면 된다 — 그 톤수는 본사에 한 푼도 안 간다.
     코일센터 단독 손익과 본사 실적이 갈라지는 자리가 정확히 여기다. */
  const materialTons = d.buy.totalTon * Math.max(0, Math.min(1, d.buy.beta || 0)) + hqSpotTon;
  const hqMargin = hqPerTon * materialTons;
  const consolidated = op + hqMargin;
  s.hq.cumMaterialTons += materialTons;
  s.hq.cumHqMargin += hqMargin;
  s.hq.cumConsolidated += consolidated;
  // 램프업 구간은 분모에서 뺀다. 배가 아직 안 왔는데 못 쳤다고 탓할 수는 없다.
  if (s.turn > CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd) s.hq.cumAutoDemand = (s.hq.cumAutoDemand || 0) + autoDemandTurn;
  s.hq.cumAutoShipped = (s.hq.cumAutoShipped || 0) + autoShippedTurn;

  /* 비재무 갱신 — 설계서는 "3턴 연속 적자"일 때만 사기를 깎는다. 회복 경로도 둔다. */
  s.lossStreak = op < 0 ? (s.lossStreak || 0) + 1 : 0;
  if (s.lossStreak >= 3) s.morale -= 3;
  else if (op > 0) s.morale += 1;
  // 약속을 지킨 달은 평판이 회복된다. 바닥에 있을수록 빨리 올라온다 (평균 회귀).
  if (shippedTotal > 0 && shortageEvents.length === 0) s.trust += s.trust < 60 ? 2 : 1;
  s.morale = Math.max(0, Math.min(100, s.morale));
  s.trust = Math.max(0, Math.min(100, s.trust));
  if (s.morale < 30) { flags.push('직원들이 떠나고 있습니다.'); }

  const report = {
    turn: s.turn, phase: s.market.phase, pm, hqPerTon,
    revenue, gp, ebitda, op, np, hqMargin, consolidated,
    fixedCost, varCost, depreciation, interest, valuationLoss, badDebt,
    scrapTon, scrapRevenue, yieldGain: yieldGainTotal,
    degradeLoss, degradeTon, dumpLoss, dumpTon, carryCost, overTons, shortageEvents,
    hqSpotOffer, hqSpotTon,
    shipped, produced, demand, demandAuto, demandCommon, nasi: s.nasi.map(n => ({ turn: n.turn, tons: { ...n.tons }, potential: { ...(n.potential || n.tons) } })), nasiPotential: nasiNow.potential || nasiNow.tons, commonShareOfSales, hqSpotCredit: s.hqSpotCredit, cashIn, cashOut,
    spotExposure: spotExposure(s),
    invTons: inventoryTons(s),
    // 화면 맨 위 스테이터스가 읽는 값들. 판매량은 이번 달 실적,
    // 재고·채권은 이번 달을 닫은 시점의 잔액이다.
    invLong: longInventoryTons(s),
    ar: receivables(s).total,
    arLate: receivables(s).late,
    shippedTotal,
    shippedC2C: shipped.C2C || 0,
    shippedProc: (shipped.SLIT || 0) + (shipped.LEVEL || 0) + (shipped.TRAP || 0) + (shipped.DIE || 0),
    log, flags,
  };
  s.history.push(report);

  /* STEP 20. 다음 달 시황과 시세를 정한다.
     이 상태로 화면이 그려지고, 사장은 그걸 보고 다음 결재를 한다. */
  {
    const nextTurn = s.turn + 1;
    const cur = chapterOf(s.turn), nxt = chapterOf(nextTurn);
    if (nxt.phase !== s.market.phase) {
      report.phaseChange = `${nxt.label}. ${nxt.brief}`;
    } else if (nxt.label !== cur.label) {
      report.phaseChange = `${nxt.label}. ${nxt.brief}`;
    }
    s.market.phase = nxt.phase;
    const ph = CFG.PHASE[nxt.phase];
    s.market.hqRate = ph.hqLo + rng() * (ph.hqHi - ph.hqLo);

    let np = s.market.pm * (1 + (nxt.drift ?? ph.drift) + CFG.PM_SIGMA * gauss(rng));
    if (rng() < CFG.PM_JUMP_PROB) np *= 1 + (rng() < 0.5 ? -CFG.PM_JUMP_SIZE : CFG.PM_JUMP_SIZE);
    s.market.pm = Math.max(400, Math.min(1400, np));   // 750 기준 로그 대칭
    s.market.scrapRate = CFG.SCRAP_RATE;
  }

  /* STEP 21. 설치 중인 설비가 다 됐는가.
     설비는 주문한다고 바로 돌지 않는다. 넉 달 걸린다.
     호황을 보고 지르면 도착했을 때 호황이 끝나 있다. */
  s.buildQueue = (s.buildQueue || []).filter(b => {
    if (b.readyTurn > s.turn + 1) return true;
    s.lines.push({ id: `L${s.lines.length + 1}`, type: b.type,
                   cap: CFG.LINE[b.type].cap, capex: b.capex });
    s.fa.machineCost += b.capex;
    report.lineReady = `${CFG.LINE[b.type].label} 설치가 끝났습니다. 다음 달부터 돕니다.`;
    return false;
  });

  s.turn += 1;
  if (s.turn > CFG.TOTAL_TURNS && !s.over) { s.over = true; s.overReason = 'COMPLETE'; }
  if (s.equity < 0 && !s.over) { s.over = true; s.overReason = 'CAPITAL_ERODED'; }

  return { state: s, report };
}

/* ---------- 등급 판정 (v3 §8-7) ---------- */

/* 본사는 코일센터를 이 순서로 본다 (실무자 확인):
     1순위 — 본사 정책을 얼마나 따랐는가. 즉 본사가 최우선시하는 자동차강판 실수요 판매를
             얼마나 수행해서 본사 판매량과 이익에 기여했는가.
     2순위 — 그러고 나서 법인 자체의 이익과 건전성.
   그래서 이 등급은 가중합이 아니라 사전식(lexicographic)이다. 수행률이 먼저 읽히고,
   법인 손익은 같은 수행률 안에서만 등급을 가른다.
   "본사는 이겼습니다"가 "혼자만 이겼습니다"보다 위에 있는 이유가 이것이다. */
/* 4년 성적표.
   본사는 코일센터를 두 가지로 본다.
     1) 본사(P사)의 판매량과 영업이익에 얼마나 기여했나
     2) 코일센터 자체가 얼마나 벌었나
   둘은 저절로 같이 가지 않는다. 자금 회전을 위해 3자 소재를 늘리면 법인은
   숨통이 트이지만 본사 몫은 한 푼도 안 늘고, 본사 물량을 다 받아주면
   본사는 웃지만 법인 창고에 재고가 눕는다. 그 줄타기가 등급으로 나온다. */
function grade(state) {
  const soloOp = state.history.reduce((a, h) => a + h.op, 0);
  const hqProfit = state.hq.cumHqMargin;
  const hqTons = state.hq.cumMaterialTons;
  const soldTons = state.history.reduce((a, h) => a + (h.shippedTotal || 0), 0);
  const hqT = CFG.HQ_PROFIT_TARGET, soT = CFG.SOLO_OP_TARGET;
  const hqOk = hqProfit >= hqT, soloOk = soloOp >= soT;
  const base = { soloOp, hqProfit, hqTons, soldTons, hqTarget: hqT, soloTarget: soT,
                 consol: soloOp + hqProfit };

  if (state.overReason !== 'COMPLETE' || state.equity <= 0) {
    return { ...base, grade: 'F', title: '버티지 못했습니다',
      desc: state.overReason === 'COMPLETE'
        ? '자본이 잠식되었습니다. 기여를 따지기 전에 회사가 남아 있어야 합니다.'
        : '자금이 끊겼습니다. 본사도 법인도 남은 것이 없습니다.' };
  }
  if (hqOk && soloOk) {
    return { ...base, grade: 'S', title: '둘 다 이겼습니다',
      desc: '본사 판매와 영업이익에 제대로 기여하면서 코일센터도 키웠습니다. 드문 결말입니다.' };
  }
  if (hqOk) {
    return { ...base, grade: 'A', title: '본사는 이겼습니다',
      desc: '본사 소재를 많이 받아 P사 실적에 크게 기여했습니다. 다만 코일센터 자체 이익은 목표에 못 미쳤습니다 — 센터장이 욕먹으며 본사 실적을 만든 경우이고, 현실에서 가장 흔한 결말입니다.' };
  }
  if (soloOk) {
    return { ...base, grade: 'C', title: '혼자만 이겼습니다',
      desc: '코일센터 손익은 지켰습니다. 그런데 본사가 우리를 통해 번 돈은 목표에 못 미칩니다. 본사가 이 법인을 왜 세웠는지를 생각하면 좋은 성적표가 아닙니다.' };
  }
  if (hqProfit >= hqT * 0.75 || soloOp >= soT * 0.75) {
    return { ...base, grade: 'B', title: '무난했습니다',
      desc: '크게 잘못한 것은 없습니다. 다만 본사 기여도 법인 이익도 목표선을 넘지는 못했습니다.' };
  }
  return { ...base, grade: 'D', title: '둘 다 놓쳤습니다',
    desc: '본사 기여도 코일센터 이익도 목표에 한참 못 미칩니다.' };
}

/* 부임은 2026년 1월. 해가 바뀌면 다시 1월부터 센다. */
function ym(turn) {
  const i = turn - 1;
  return { y: CFG.START_YEAR + Math.floor(i / 12), m: (i % 12) + 1, yi: Math.floor(i / 12) };
}
function ymLabel(turn) { const d = ym(turn); return `${d.y}년 ${d.m}월`; }

<script>
/* ============================================================
   코일센터 경영 시뮬레이터 · 화면
   엔진(손익 계산) 위에 얹는 껍데기. 규칙은 여기서 만들지 않는다.

   화면은 넷뿐이다.
     소개   이 게임이 무엇이고 무엇이 잘하는 경영인가
     부임   넘겨받는 회사의 장부
     결재   이번 달 지표와 결정 — 한 화면에서 전부
     결산   결정의 결과와 그 달 손익
   결정 채널은 하나다. 팝업으로 고르고 다시 다른 화면에서 또 고르게 하지 않는다.
   ============================================================ */

const $ = s => document.querySelector(s);
const app = $('#app');
const fmt = n => Math.round(n).toLocaleString('en-US');
const money = n => (n < 0 ? '−$' : '$') + fmt(Math.abs(n));
const M = n => (n < 0 ? '−$' : '$') + (Math.abs(n) / 1e6).toFixed(1) + 'M';
const K = n => (n < 0 ? '−' : '') + fmt(Math.abs(n) / 1000);        // 천불
const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '');
const dK = n => Math.abs(n) < 500 ? '0' : sign(n) + fmt(Math.abs(n) / 1000);
const dPct = (a, b) => (!b || !isFinite(a / b)) ? '−' : sign(a / b - 1) + (Math.abs(a / b - 1) * 100).toFixed(1) + '%';
const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';

const CAST = {
  seo:  { face: '📋', name: '서 대리', role: '구매' },
  jung: { face: '📞', name: '정 과장', role: '영업' },
  gu:   { face: '🔧', name: '구 공장장', role: '생산' },
  han:  { face: '🧮', name: '한 대리', role: '경리' },

};
const COUNTRIES = {
  MX: { name: '멕시코', emoji: '🇲🇽' }, IN: { name: '인도', emoji: '🇮🇳' },
  VN: { name: '베트남', emoji: '🇻🇳' }, ID: { name: '인도네시아', emoji: '🇮🇩' },
  TH: { name: '태국', emoji: '🇹🇭' },   PL: { name: '폴란드', emoji: '🇵🇱' },
};
const START = { country: 'MX', name: '멕시코 코일센터', lines: ['SLIT', 'LEVEL'], equity: CFG.START_EQUITY };

let G = null;

/* ============================================================
   공장 조감도 — 아이소메트릭
   격자 좌표 (x, y, z)를 화면 좌표로 옮겨 그린다. x는 오른쪽 아래로,
   y는 왼쪽 아래로, z는 위로 간다. 그래서 보는 사람 쪽을 향한 면은
   언제나 x+w 면과 y+d 면이고, 나머지 두 면은 뒤로 숨는다.
   ============================================================ */
const U = 16;                                   // 격자 한 칸 (px)
const IX = (x, y) => (x - y) * 0.866 * U;
const IY = (x, y, z = 0) => ((x + y) * 0.5 - z) * U;
const PT = (x, y, z = 0) => `${IX(x, y).toFixed(1)},${IY(x, y, z).toFixed(1)}`;

// 면마다 밝기를 달리해야 입체로 읽힌다
function dim(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.round(Math.min(255, v * f)).toString(16).padStart(2, '0')).join('');
}

// 직육면체 — 윗면 + 앞면 두 장
function cube(x, y, w, d, h, color, z = 0, op) {
  const o = op == null ? '' : ` opacity="${op}"`;
  return `<polygon points="${PT(x,y,z+h)} ${PT(x+w,y,z+h)} ${PT(x+w,y+d,z+h)} ${PT(x,y+d,z+h)}" fill="${color}"${o}/>`
       + `<polygon points="${PT(x,y+d,z+h)} ${PT(x+w,y+d,z+h)} ${PT(x+w,y+d,z)} ${PT(x,y+d,z)}" fill="${dim(color,.80)}"${o}/>`
       + `<polygon points="${PT(x+w,y,z+h)} ${PT(x+w,y+d,z+h)} ${PT(x+w,y+d,z)} ${PT(x+w,y,z)}" fill="${dim(color,.62)}"${o}/>`;
}
// 바닥면 한 장
function pad(x, y, w, d, fill, stroke, z = 0, cls) {
  return `<polygon points="${PT(x,y,z)} ${PT(x+w,y,z)} ${PT(x+w,y+d,z)} ${PT(x,y+d,z)}"`
       + ` fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="1.4"` : ''}${cls ? ` class="${cls}"` : ''}/>`;
}
// 코일 — 참고 그림처럼 단면이 보이게 원으로 그린다
function coilP(x, y, z, r, color) {
  return `<circle cx="${IX(x,y).toFixed(1)}" cy="${IY(x,y,z).toFixed(1)}" r="${r}"`
       + ` fill="${color}" stroke="${dim(color,.66)}" stroke-width="1.3"/>`
       + `<circle cx="${IX(x,y).toFixed(1)}" cy="${IY(x,y,z).toFixed(1)}" r="${(r*.33).toFixed(1)}" fill="#fdfbf6"/>`;
}
// 팔레트에 쌓은 가공 판재
function stackP(x, y, c) {
  return cube(x, y, 2.1, 1.6, 0.22, '#b5814f')
       + cube(x + 0.1, y + 0.1, 1.9, 1.4, 0.5, c, 0.22);
}
function txt(x, y, z, s, cls) {
  return `<text x="${IX(x,y).toFixed(1)}" y="${IY(x,y,z).toFixed(1)}" class="${cls}">${s}</text>`;
}

/* ---- 설비 세 종류. 베이 한 칸(4.2 × 2.6)에 들어간다 ----
   왼쪽에서 원코일이 들어가 오른쪽으로 제품이 나오는 배치로 통일한다.
   그래야 공장동 안을 훑었을 때 흐름이 한눈에 읽힌다. */
function mSlitter(x, y) {
  return cube(x, y, 3.9, 2.4, 0.28, '#e0b64a')                    // 노란 데크
       + coilP(x + 0.6, y + 1.2, 1.15, 9.5, '#9aa4ad')            // 입측 원코일
       + cube(x + 1.6, y + 0.35, 1.0, 1.7, 1.45, '#3f6f9e', 0.28) // 슬리터 본체
       + cube(x + 1.74, y + 0.5, 0.2, 1.4, 1.0, '#d5dde3', 0.5)   // 칼날부
       + coilP(x + 3.3, y + 0.8, 1.05, 6, '#aeb7bf')              // 출측 소폭 코일
       + coilP(x + 3.3, y + 1.7, 1.05, 6, '#aeb7bf');
}
function mLeveler(x, y) {
  return cube(x, y, 3.9, 2.4, 0.28, '#d8cfbc')
       + coilP(x + 0.6, y + 1.2, 1.12, 9, '#9aa4ad')
       + cube(x + 1.5, y + 0.4, 1.4, 1.6, 1.15, '#4f8f6f', 0.28)  // 롤러 하우징
       + stackP(x + 3.0, y + 0.5, '#e6edf1');                     // 나온 평판
}
function mBlank(x, y) {
  return cube(x, y, 3.9, 2.4, 0.28, '#d8cfbc')
       + coilP(x + 0.55, y + 1.2, 1.1, 8.5, '#9aa4ad')
       + cube(x + 1.5, y + 0.3, 0.3, 1.8, 2.3, '#cfc8ba', 0.28)   // 프레스 기둥
       + cube(x + 2.35, y + 0.3, 0.3, 1.8, 2.3, '#cfc8ba', 0.28)
       + cube(x + 1.45, y + 0.3, 1.25, 1.8, 0.45, '#b8443a', 2.1) // 상부 프레스
       + cube(x + 1.5, y + 0.55, 1.15, 1.3, 0.28, '#b8443a', 0.28)
       + stackP(x + 3.05, y + 0.55, '#e6edf1');
}
const MACHINE = { SLIT: mSlitter, LEVEL: mLeveler, BLANK: mBlank };

/* ---- 공장동 ----
   뒤쪽 두 벽만 세우고 앞은 터놓는다. 앞에도 벽을 세우면 안이 안 보인다.
   지붕은 참고 그림처럼 유리로 덮어 설비가 비쳐 보이게 한다. */
function hallShell(w, d, wh, rh) {
  const glass = '#bcd4e0';
  return `
    ${pad(0, 0, w, d, '#efe9dc')}
    <polygon points="${PT(0,0,0)} ${PT(w,0,0)} ${PT(w,0,wh)} ${PT(0,0,wh)}" fill="#e7e0d0"/>
    <polygon points="${PT(0,0,0)} ${PT(0,d,0)} ${PT(0,d,wh)} ${PT(0,0,wh)}" fill="#dcd4c2"/>
    <polygon points="${PT(0.3,0,1.1)} ${PT(w-0.3,0,1.1)} ${PT(w-0.3,0,2.1)} ${PT(0.3,0,2.1)}" fill="#a9c4d4" opacity=".75"/>
    <polygon points="${PT(0,0.3,1.1)} ${PT(0,d-0.3,1.1)} ${PT(0,d-0.3,2.1)} ${PT(0,0.3,2.1)}" fill="#96b4c6" opacity=".75"/>`;
}
function hallRoof(w, d, wh, rh) {
  const g = '#b9d3e2', ridge = wh + rh, my = d / 2;
  return `
    <polygon points="${PT(0,0,wh)} ${PT(w,0,wh)} ${PT(w,my,ridge)} ${PT(0,my,ridge)}"
      fill="${g}" opacity=".42" stroke="#8fb0c4" stroke-width="1.2"/>
    <polygon points="${PT(0,my,ridge)} ${PT(w,my,ridge)} ${PT(w,d,wh)} ${PT(0,d,wh)}"
      fill="${g}" opacity=".26" stroke="#8fb0c4" stroke-width="1.2"/>
    <polygon points="${PT(w,0,wh)} ${PT(w,my,ridge)} ${PT(w,d,wh)}" fill="#cfe0ea" opacity=".5" stroke="#8fb0c4" stroke-width="1.2"/>
    <polygon points="${PT(0,0,wh)} ${PT(0,my,ridge)} ${PT(0,d,wh)}" fill="#cfe0ea" opacity=".35" stroke="#8fb0c4" stroke-width="1.2"/>`;
}
/* 천장 크레인 — 참고 그림의 노란 갠트리. 야드에서 라인으로 코일을 옮긴다. */
function gantry(w, d, wh, bx, ty) {
  const h = wh - 0.55;
  return cube(bx, 0, 0.45, 0.45, h, '#e0b64a')
       + cube(bx, d - 0.45, 0.45, 0.45, h, '#e0b64a')
       + cube(bx, 0, 0.45, d, 0.4, '#eec659', h)
       + cube(bx - 0.25, ty, 0.95, 0.95, 0.42, '#4a6fa5', h - 0.42)
       + `<line x1="${IX(bx+0.22,ty+0.48).toFixed(1)}" y1="${IY(bx+0.22,ty+0.48,h-0.42).toFixed(1)}"
                x2="${IX(bx+0.22,ty+0.48).toFixed(1)}" y2="${IY(bx+0.22,ty+0.48,1.5).toFixed(1)}" class="hook"/>`
       + coilP(bx + 0.22, ty + 0.48, 1.2, 8, '#9aa4ad');
}

function factorySVG(s, L) {
  const c = L.c;
  const raw = s.invRaw.reduce((a, l) => a + l.qty, 0);
  const fg = s.invFg.reduce((a, l) => a + l.qty, 0);
  const over = (raw + fg) > CFG.WAREHOUSE_CAP_BASE;

  /* 참고 그림처럼 공장동과 설비를 각각 하나의 아이콘으로 떼어 놓는다.
     한 건물 안에 다 우겨넣으면 작아져서 아무것도 안 보인다.
     위 줄에 공장동과 가공 설비, 아래 줄에 소재 야드와 제품 창고를 둔다. */
  const CX = [300, 592, 812], RY = [132, 306];
  const cap = (x, y, t, v, cls) =>
    `<text x="${x}" y="${y}" class="lbl" style="font-size:12px">${t}</text>` +
    (v ? `<text x="${x}" y="${y + 15}" class="tiny ${cls || ''}">${v}</text>` : '');

  /* --- 바다에 떠 있는 배 = 미착 발주 --- */
  const ships = s.poOpen.reduce((a, p) => {

    : `<text x="40" y="210" class="tiny mid dim">바다에</text>
       <text x="40" y="226" class="tiny mid dim">배가 없습니다</text>`;

  /* --- 공장동: 건물과 천장 크레인. 라인이 몇 개 도는지가 여기 뜬다 --- */
  const HW = 7.6, HD = 6.4, WH = 3.6, RH = 2.3;
  let inside = '';
  for (let i = 0; i < 5; i++) inside += coilP(1.4 + (i % 3) * 1.9, 1.6 + ((i / 3) | 0) * 2.2, 0.95, 12, '#9aa4ad');
  const hall = `<g transform="translate(${CX[0]},${RY[0]})">

  /* --- 가공 설비 세 대를 따로 --- */

  const util = t => {

            : ((L.now.TRAP || 0) + (L.now.DIE || 0)) / Math.max(1, c.BLANK);
    return Math.max(0, Math.min(1, u));
  };
  const machines = SLOT.map(m => {
    const have = s.lines.filter(l => l.type === m.type).length;

      label = `${CFG.LINE[m.type].label}${have > 1 ? ` ×${have}` : ''}`;

  const nRaw = Math.max(0, Math.min(24, Math.round(raw / 1800)));

    ${cap(CX[0] - 84, RY[1] + 118, '소재 야드', `${fmt(raw)}t`, over ? 'warn b' : 'b')}
    ${over ? `<text x="${CX[0] - 84}" y="${RY[1] + 148}" class="tiny warn">야드가 넘쳤습니다 · 동선이 막힙니다</text>` : ''}

    <g transform="translate(${CX[2]},${RY[1]})">${ship}</g>

/* ============================================================
   이번 달 숫자
   ============================================================ */
function look(s) {
  const c = capacityOf(s);
  const now = s.nasi[0] ? s.nasi[0].tons : {};
  const avg = {}, pot = {};
  for (const k of PROC_LIST) {
    const xs = s.nasi.map(n => n.tons[k]), ps = s.nasi.map(n => (n.potential || n.tons)[k]);
    avg[k] = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
    pot[k] = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0;
  }
  const need = Math.min(c.SLIT, avg.SLIT) + Math.min(c.LEVEL, avg.LEVEL)
             + avg.C2C + Math.min(c.BLANK, (avg.TRAP || 0) + (avg.DIE || 0));
  const haveP = s.poOpen.concat(s.invRaw, s.invFg).reduce((a, l) => a + l.qty, 0);
  const isBust = s.market.phase === 'BUST';
  return { c, now, avg, pot, need, haveP, isBust,
    quota: isBust ? (c.SLIT + c.LEVEL + c.BLANK) * CFG.HQ_SPOT.capShareOfCap : 0,
    gapSlit: pot.SLIT - c.SLIT, gapLevel: pot.LEVEL - c.LEVEL };
}

function buildDecision(s, ui) {
  const L = look(s);
  const target = L.need * (CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd + ui.cover);
  const shortfall = Math.max(0, target - L.haveP);
  const plan = Math.max(0, Math.min(L.need + shortfall / 3, L.need * CFG.BUY_MAX_MULT));
  const ceil = L.need * (CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd + CFG.STOCK_CEIL);
  // 카드 배수는 계획 위에 곱하되, 월 소비량의 BUY_HARD_MAX를 넘지 못한다
  const buy = Math.max(0, Math.min(plan * (G ? (G.mult || 1) : 1),
                                   L.need * CFG.BUY_HARD_MAX,
                                   ceil - L.haveP));
  const n = L.now, hasCommon = (s.hqSpotCredit || 0) > 1;
  const idleS = Math.max(0, L.c.SLIT - (n.SLIT || 0)), idleL = Math.max(0, L.c.LEVEL - (n.LEVEL || 0));
  const runS = Math.min(L.c.SLIT, (n.SLIT || 0) + (hasCommon ? idleS : 0));
  const runL = Math.min(L.c.LEVEL, (n.LEVEL || 0) + (hasCommon ? idleL : 0));
  const runT = Math.min(L.c.BLANK * 0.5, n.TRAP || 0), runD = Math.min(L.c.BLANK * 0.5, n.DIE || 0);
  return {
    // beta는 본사 소재 비중. 1이면 전량 본사, 낮추면 그만큼 3자 소재를 쓴다.
    buy: { totalTon: buy, alpha: 1, beta: G ? (G.beta != null ? G.beta : 1) : 1, hqSpotTon: ui.hqTake },
    invest: { addLine: ui.expandPick, newBuilding: s.lines.length >= CFG.MAX_LINES,
              yieldProgram: ui.yieldSpend, salesEffort: 0 },
    options: { overtime: ui.overtime, discount: G ? G.turnDiscount : 0, trimYield: 0 },
    run: { SLIT: runS, LEVEL: runL, TRAP: runT, DIE: runD },
    sell: { C2C: n.C2C || 0, SLIT: runS * CFG.YIELD.SLIT, LEVEL: runL * CFG.YIELD.LEVEL,
            TRAP: runT * CFG.YIELD.TRAP, DIE: runD * CFG.YIELD.DIE },
    _buyTon: buy, _L: L,
  };
}

/* 실적 — 당월, 전월비, 당해 누계, 전년동기비.
   해가 바뀌면 누계는 1월부터 다시 센다. 2년차부터 전년동기가 생긴다. */
function perf(s) {
  const h = s.history;
  if (!h.length) return null;
  const cur = h[h.length - 1], d = ym(cur.turn);
  const prev = h[h.length - 2] || null;
  const yoy  = h[h.length - 13] || null;
  const sum = (arr, k) => arr.reduce((a, x) => a + (x[k] || 0), 0);
  const ytd = h.filter(x => ym(x.turn).y === d.y);
  const ytdPrev = h.filter(x => ym(x.turn).y === d.y - 1 && ym(x.turn).m <= d.m);
  return { cur, prev, yoy, ytd, ytdPrev, sum, year: d.y, month: d.m, hasYoy: d.yi >= 1 };
}


/* ============================================================
   게임 흐름
   ============================================================ */
function newGame() {
  const s = createInitialState({
    seed: (Math.random() * 1e9) | 0,
    equity: START.equity, lines: START.lines,
    country: START.country, companyName: START.name,
  });
  G = { s, ui: { cover: 0.5, hqTake: 0, expandPick: null, overtime: false, yieldSpend: 0 },
        pending: [], seen: {}, deck: [], screen: 'turn',
        mult: 1, beta: 1, turnDiscount: 0, extraFixed: 0, yieldPenalty: 0,
        report: null, feedback: [] };
  dealTurn(); render();
}

// 이번 달 상황 — 카드가 조건을 볼 때와 대사에 숫자를 박을 때 쓴다
function cardCtx(s) {
  const c = capacityOf(s);
  const n = s.nasi[0] ? s.nasi[0].tons : {};
  const load = ((n.SLIT || 0) + (n.LEVEL || 0)) / Math.max(1, c.SLIT + c.LEVEL);
  const h = s.history;
  const stock = inventoryTons(s) + s.poOpen.reduce((a, p) => a + p.qty, 0);
  const L = look(s);
  return { load, phase: s.market.phase,
           pmTrend: h.length > 1 ? h[h.length - 1].pm - h[h.length - 2].pm : 0,
           cover: L.need > 0 ? stock / L.need : 0,
           sellable: Math.round(PROC_LIST.reduce((a, k) => a + (n[k] || 0), 0)) };
}

/* 이번 달 결재판을 짠다.
   루틴 셋은 매달 반드시 올라오고, 그 위에 돌발이 두셋 붙는다.
   본사 스팟과 증설은 해당되는 달에만 돌발 자리에 들어간다. */
function expandableType(s) {
  const L = look(s);
  if (s.lines.length >= CFG.MAX_LINES) return null;
  if ((s.buildQueue || []).length) return null;
  if (s.turn < 13) return null;              // 첫 해에는 그럴 현금이 없다
  if (L.gapSlit > 800) return 'SLIT';
  if (L.gapLevel > 500) return 'LEVEL';
  if (!s.lines.some(l => l.type === 'BLANK')) return 'BLANK';
  return null;
}
function hqSpotCard(s) {
  const L = look(s), q = Math.round(L.quota);
  return { id: 'x-spot', kind: '소재구매', who: 'jung',
    title: '본사가 유통향 물량을 넘기겠답니다',
    text: `본사 공장이 가동 물량을 못 채웠습니다. 일반재를 시세보다 `
        + `${(CFG.HQ_SPOT.discount * 100).toFixed(0)}% 싸게 주겠다고요. 싼 건 맞는데 `
        + `이건 고객이 정해진 물건이 아닙니다. 우리가 알아서 팔아야 합니다. `
        + `배정량은 ${fmt(q)}톤입니다.`,
    opts: [
      { label: '배정량의 절반을 받는다', hint: `${fmt(q * 0.5)}톤 · 본사 기여 ↑ · 재고 위험 ↑`,
        apply: (s2, g) => { g.ui.hqTake = q * 0.5; s2.trust += 2;
          return `유통향 ${fmt(q * 0.5)}톤을 받았습니다. 본사가 가동률을 채웠습니다.`; } },
      { label: '조금만 받는다', hint: `${fmt(q * 0.15)}톤 · 무난함`,
        apply: (s2, g) => { g.ui.hqTake = q * 0.15; s2.trust += 1;
          return `유통향 ${fmt(q * 0.15)}톤만 받았습니다.`; } },
      { label: '받지 않는다', hint: '본사 신뢰 ↓ · 재고는 깨끗',
        apply: (s2, g) => { g.ui.hqTake = 0;
          return '본사 물량을 받지 않았습니다. 본사와의 관계가 상합니다.'; } },
    ] };
}
function expandCardDef(type, s) {
  const capex = CFG.LINE[type].capex, need = CFG.LINE[type].cap * 3 * s.market.pm;
  return { id: 'x-expand', kind: '투자', who: 'gu',
    title: `${CFG.LINE[type].label}를 한 대 더 놓겠습니까`,
    text: `본사가 주고 싶어 하는 물량이 우리 한계를 넘습니다. 설비는 ${K(capex)}천불인데, `
        + `그 설비를 채울 소재값이 석 달치로 ${K(need)}천불입니다. 설비값보다 소재값이 훨씬 큽니다. `
        + `주문해서 도는 데 넉 달 걸립니다.`,
    opts: [
      { label: '짓는다', hint: `${K(capex)}천불 · ${CFG.INSTALL_TURNS}개월 뒤 가동`,
        apply: (s2, g) => { g.ui.expandPick = type;
          return `${CFG.LINE[type].label}를 발주했습니다. ${ymLabel(s2.turn + CFG.INSTALL_TURNS)}부터 돕니다.`; } },
      { label: '이번엔 넘어간다', hint: '현금을 지킵니다',
        apply: () => '증설은 다음 기회에 보기로 했습니다.' },
    ] };
}

function dealTurn() {
  const s = G.s, ctx = cardCtx(s);
  G.mult = 1; G.beta = 1; G.turnDiscount = 0; G.feedback = [];
  Object.assign(G.ui, { hqTake: 0, expandPick: null, overtime: false, yieldSpend: 0 });
  G.deck = ROUTINE.map(c => ({ c, chosen: null }));

  const extra = [];
  const big = BIG.find(b => b.at === s.turn);
  if (big) extra.push(big);
  if (s.market.phase === 'BUST') extra.push(hqSpotCard(s));
  const ex = expandableType(s);
  if (ex) extra.push(expandCardDef(ex, s));

  const want = 2 + (Math.random() < 0.5 ? 1 : 0);
  const pool = EVENTS.filter(c => (!c.when || c.when(s, ctx)) && (s.turn - (G.seen[c.id] || -99)) > 6);
  while (extra.length < want && pool.length) {
    const c = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    G.seen[c.id] = s.turn; extra.push(c);
  }
  for (const c of extra) G.deck.push({ c, chosen: null });
}

/* 결재 확정 — 고른 것을 전부 적용하고 한 달을 넘긴다.
   이번 달 결정이 이번 달 숫자로 바로 나오지는 않는다. 소재는 넉 달 뒤에 오고
   판매대금은 두 달 뒤에 들어온다. 그 시차가 이 게임의 핵심이다. */
function confirmTurn() {
  const s = G.s, fired = [];
  G.feedback = [];
  for (const d of G.deck) {
    const o = d.c.opts[d.chosen];
    const msg = o.apply ? o.apply(s, G) : '';
    if (o.mult) G.mult *= o.mult;
    if (o.beta != null) G.beta = o.beta;
    if (o.ot) G.ui.overtime = true;
    G.feedback.push({ kind: d.c.kind, title: d.c.title, choice: o.label, msg: msg || '' });
  }
  G.pending = G.pending.filter(p => {
    if (p.turn <= s.turn) { const m = p.run(s); if (m) fired.push(m); return false; }
    return true;
  });

  const savedY = {};
  if (G.yieldPenalty > 0) {
    for (const k of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) { savedY[k] = CFG.YIELD[k]; CFG.YIELD[k] -= 0.015; }
    G.yieldPenalty--;
  }
  const savedFC = CFG.FC_BASE;
  if (G.extraFixed) CFG.FC_BASE += G.extraFixed;

  const dec = buildDecision(s, G.ui);
  G.buyTon = dec._buyTon;
  const res = resolveTurn(s, dec);

  CFG.FC_BASE = savedFC;
  for (const k in savedY) CFG.YIELD[k] = savedY[k];

  G.s = res.state;
  fired.forEach(m => res.report.flags.unshift(m));
  G.report = res.report;
  G.screen = 'close';
  render();
}

function nextMonth() {
  if (G.s.over) { G.screen = 'end'; return render(); }
  G.screen = 'turn'; dealTurn(); render();
}


/* ============================================================
   화면
   ============================================================ */
function render() {
  if (!G) return renderIntro();
  if (G.screen === 'end' || (G.s.over && G.screen !== 'close')) return renderEnd();
  if (G.screen === 'close') return renderClose();
  renderTurn();
}

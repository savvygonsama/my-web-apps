<script>
/* ============================================================
   코일센터 경영 시뮬레이터 · 화면
   엔진(손익 계산) 위에 얹는 껍데기. 규칙은 여기서 만들지 않는다.

   화면은 넷뿐이다.
     소개   이 게임이 무엇이고 무엇이 잘하는 경영인가
     부임   넘겨받는 회사의 장부
     결재   이번 달 지표와 결정 — 한 화면에서 전부
     결산   결정의 결과와 그 달 손익
   결정 채널은 하나다. 팝업으로 고르고 다시 다른 화면에서 또 고르게 하지 않는다.
   ============================================================ */

const $ = s => document.querySelector(s);
const app = $('#app');
const fmt = n => Math.round(n).toLocaleString('en-US');
const money = n => (n < 0 ? '−$' : '$') + fmt(Math.abs(n));
const M = n => (n < 0 ? '−$' : '$') + (Math.abs(n) / 1e6).toFixed(1) + 'M';
const K = n => (n < 0 ? '−' : '') + fmt(Math.abs(n) / 1000);        // 천U$
const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '');
const dK = n => Math.abs(n) < 500 ? '0' : sign(n) + fmt(Math.abs(n) / 1000);
const dPct = (a, b) => (!b || !isFinite(a / b)) ? '−' : sign(a / b - 1) + (Math.abs(a / b - 1) * 100).toFixed(1) + '%';
const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';

const CAST = {
  seo:  { face: '📋', name: '서 대리', role: '구매' },
  jung: { face: '📞', name: '정 과장', role: '영업' },
  gu:   { face: '🔧', name: '구 공장장', role: '생산' },
  han:  { face: '🧮', name: '한 대리', role: '경리' },
  oh:   { face: '🔍', name: '오 과장', role: '품질' },
  lin:  { face: '☕', name: '린 매니저', role: '현지' },
};
const COUNTRIES = {
  MX: { name: '멕시코', emoji: '🇲🇽' }, IN: { name: '인도', emoji: '🇮🇳' },
  VN: { name: '베트남', emoji: '🇻🇳' }, ID: { name: '인도네시아', emoji: '🇮🇩' },
  TH: { name: '태국', emoji: '🇹🇭' },   PL: { name: '폴란드', emoji: '🇵🇱' },
};
const START = { name: '코일센터', lines: ['SLIT', 'LEVEL'], equity: CFG.START_EQUITY };

let G = null;

/* ============================================================
   공장 조감도 — 아이소메트릭
   격자 좌표 (x, y, z)를 화면 좌표로 옮겨 그린다. x는 오른쪽 아래로,
   y는 왼쪽 아래로, z는 위로 간다. 그래서 보는 사람 쪽을 향한 면은
   언제나 x+w 면과 y+d 면이고, 나머지 두 면은 뒤로 숨는다.
   ============================================================ */
const U = 16;                                   // 격자 한 칸 (px)
const IX = (x, y) => (x - y) * 0.866 * U;
const IY = (x, y, z = 0) => ((x + y) * 0.5 - z) * U;
const PT = (x, y, z = 0) => `${IX(x, y).toFixed(1)},${IY(x, y, z).toFixed(1)}`;

// 면마다 밝기를 달리해야 입체로 읽힌다
function dim(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.round(Math.min(255, v * f)).toString(16).padStart(2, '0')).join('');
}

// 직육면체 — 윗면 + 앞면 두 장
function cube(x, y, w, d, h, color, z = 0, op) {
  const o = op == null ? '' : ` opacity="${op}"`;
  return `<polygon points="${PT(x,y,z+h)} ${PT(x+w,y,z+h)} ${PT(x+w,y+d,z+h)} ${PT(x,y+d,z+h)}" fill="${color}"${o}/>`
       + `<polygon points="${PT(x,y+d,z+h)} ${PT(x+w,y+d,z+h)} ${PT(x+w,y+d,z)} ${PT(x,y+d,z)}" fill="${dim(color,.80)}"${o}/>`
       + `<polygon points="${PT(x+w,y,z+h)} ${PT(x+w,y+d,z+h)} ${PT(x+w,y+d,z)} ${PT(x+w,y,z)}" fill="${dim(color,.62)}"${o}/>`;
}
// 바닥면 한 장
function pad(x, y, w, d, fill, stroke, z = 0, cls) {
  return `<polygon points="${PT(x,y,z)} ${PT(x+w,y,z)} ${PT(x+w,y+d,z)} ${PT(x,y+d,z)}"`
       + ` fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="1.4"` : ''}${cls ? ` class="${cls}"` : ''}/>`;
}
// 코일 — 참고 그림처럼 단면이 보이게 원으로 그린다
function coilP(x, y, z, r, color) {
  return `<circle cx="${IX(x,y).toFixed(1)}" cy="${IY(x,y,z).toFixed(1)}" r="${r}"`
       + ` fill="${color}" stroke="${dim(color,.66)}" stroke-width="1.3"/>`
       + `<circle cx="${IX(x,y).toFixed(1)}" cy="${IY(x,y,z).toFixed(1)}" r="${(r*.33).toFixed(1)}" fill="#fdfbf6"/>`;
}
// 팔레트에 쌓은 가공 판재
function stackP(x, y, c) {
  return cube(x, y, 2.1, 1.6, 0.22, '#b5814f')
       + cube(x + 0.1, y + 0.1, 1.9, 1.4, 0.5, c, 0.22);
}
function txt(x, y, z, s, cls) {
  return `<text x="${IX(x,y).toFixed(1)}" y="${IY(x,y,z).toFixed(1)}" class="${cls}">${s}</text>`;
}

/* ---- 설비 세 종류. 베이 한 칸(4.2 × 2.6)에 들어간다 ----
   왼쪽에서 원코일이 들어가 오른쪽으로 제품이 나오는 배치로 통일한다.
   그래야 공장동 안을 훑었을 때 흐름이 한눈에 읽힌다. */
function mSlitter(x, y) {
  return cube(x, y, 3.9, 2.4, 0.28, '#e0b64a')                    // 노란 데크
       + coilP(x + 0.6, y + 1.2, 1.15, 9.5, '#9aa4ad')            // 입측 원코일
       + cube(x + 1.6, y + 0.35, 1.0, 1.7, 1.45, '#3f6f9e', 0.28) // 슬리터 본체
       + cube(x + 1.74, y + 0.5, 0.2, 1.4, 1.0, '#d5dde3', 0.5)   // 칼날부
       + coilP(x + 3.3, y + 0.8, 1.05, 6, '#aeb7bf')              // 출측 소폭 코일
       + coilP(x + 3.3, y + 1.7, 1.05, 6, '#aeb7bf');
}
function mLeveler(x, y) {
  return cube(x, y, 3.9, 2.4, 0.28, '#d8cfbc')
       + coilP(x + 0.6, y + 1.2, 1.12, 9, '#9aa4ad')
       + cube(x + 1.5, y + 0.4, 1.4, 1.6, 1.15, '#4f8f6f', 0.28)  // 롤러 하우징
       + stackP(x + 3.0, y + 0.5, '#e6edf1');                     // 나온 평판
}
function mBlank(x, y) {
  return cube(x, y, 3.9, 2.4, 0.28, '#d8cfbc')
       + coilP(x + 0.55, y + 1.2, 1.1, 8.5, '#9aa4ad')
       + cube(x + 1.5, y + 0.3, 0.3, 1.8, 2.3, '#cfc8ba', 0.28)   // 프레스 기둥
       + cube(x + 2.35, y + 0.3, 0.3, 1.8, 2.3, '#cfc8ba', 0.28)
       + cube(x + 1.45, y + 0.3, 1.25, 1.8, 0.45, '#b8443a', 2.1) // 상부 프레스
       + cube(x + 1.5, y + 0.55, 1.15, 1.3, 0.28, '#b8443a', 0.28)
       + stackP(x + 3.05, y + 0.55, '#e6edf1');
}
const MACHINE = { SLIT: mSlitter, LEVEL: mLeveler, BLANK: mBlank };

/* ---- 공장동 ----
   뒤쪽 두 벽만 세우고 앞은 터놓는다. 앞에도 벽을 세우면 안이 안 보인다.
   지붕은 참고 그림처럼 유리로 덮어 설비가 비쳐 보이게 한다. */
function hallShell(w, d, wh, rh) {
  const glass = '#bcd4e0';
  return `
    ${pad(0, 0, w, d, '#EDF1F5')}
    <polygon points="${PT(0,0,0)} ${PT(w,0,0)} ${PT(w,0,wh)} ${PT(0,0,wh)}" fill="#E2E9EF"/>
    <polygon points="${PT(0,0,0)} ${PT(0,d,0)} ${PT(0,d,wh)} ${PT(0,0,wh)}" fill="#D4DDE5"/>
    <polygon points="${PT(0.3,0,1.1)} ${PT(w-0.3,0,1.1)} ${PT(w-0.3,0,2.1)} ${PT(0.3,0,2.1)}" fill="#a9c4d4" opacity=".75"/>
    <polygon points="${PT(0,0.3,1.1)} ${PT(0,d-0.3,1.1)} ${PT(0,d-0.3,2.1)} ${PT(0,0.3,2.1)}" fill="#96b4c6" opacity=".75"/>`;
}
function hallRoof(w, d, wh, rh) {
  const g = '#b9d3e2', ridge = wh + rh, my = d / 2;
  return `
    <polygon points="${PT(0,0,wh)} ${PT(w,0,wh)} ${PT(w,my,ridge)} ${PT(0,my,ridge)}"
      fill="${g}" opacity=".42" stroke="#8fb0c4" stroke-width="1.2"/>
    <polygon points="${PT(0,my,ridge)} ${PT(w,my,ridge)} ${PT(w,d,wh)} ${PT(0,d,wh)}"
      fill="${g}" opacity=".26" stroke="#8fb0c4" stroke-width="1.2"/>
    <polygon points="${PT(w,0,wh)} ${PT(w,my,ridge)} ${PT(w,d,wh)}" fill="#cfe0ea" opacity=".5" stroke="#8fb0c4" stroke-width="1.2"/>
    <polygon points="${PT(0,0,wh)} ${PT(0,my,ridge)} ${PT(0,d,wh)}" fill="#cfe0ea" opacity=".35" stroke="#8fb0c4" stroke-width="1.2"/>`;
}
/* 천장 크레인 — 참고 그림의 노란 갠트리. 야드에서 라인으로 코일을 옮긴다. */
function gantry(w, d, wh, bx, ty) {
  const h = wh - 0.55;
  return cube(bx, 0, 0.45, 0.45, h, '#e0b64a')
       + cube(bx, d - 0.45, 0.45, 0.45, h, '#e0b64a')
       + cube(bx, 0, 0.45, d, 0.4, '#eec659', h)
       + cube(bx - 0.25, ty, 0.95, 0.95, 0.42, '#4a6fa5', h - 0.42)
       + `<line x1="${IX(bx+0.22,ty+0.48).toFixed(1)}" y1="${IY(bx+0.22,ty+0.48,h-0.42).toFixed(1)}"
                x2="${IX(bx+0.22,ty+0.48).toFixed(1)}" y2="${IY(bx+0.22,ty+0.48,1.5).toFixed(1)}" class="hook"/>`
       + coilP(bx + 0.22, ty + 0.48, 1.2, 8, '#9aa4ad');
}

function factorySVG(s, L) {
  const c = L.c;
  const raw = s.invRaw.reduce((a, l) => a + l.qty, 0);
  const fg = s.invFg.reduce((a, l) => a + l.qty, 0);
  const over = (raw + fg) > yardCapOf(s);

  /* 참고 그림처럼 공장동과 설비를 각각 하나의 아이콘으로 떼어 놓는다.
     한 건물 안에 다 우겨넣으면 작아져서 아무것도 안 보인다.
     위 줄에 공장동과 가공 설비, 아래 줄에 소재 야드와 제품 창고를 둔다. */
  const CX = [300, 592, 812], RY = [132, 306];
  const cap = (x, y, t, v, cls) =>
    `<text x="${x}" y="${y}" class="lbl" style="font-size:12px">${t}</text>` +
    (v ? `<text x="${x}" y="${y + 15}" class="tiny ${cls || ''}">${v}</text>` : '');

  /* --- 바다에 떠 있는 배 = 미착 발주 --- */
  const ships = s.poOpen.reduce((a, p) => {
    const k = a.find(x => x.eta === p.etaTurn);
    if (k) k.qty += p.qty; else a.push({ eta: p.etaTurn, qty: p.qty });
    return a;
  }, []).sort((a, b) => a.eta - b.eta).slice(0, 3);
  const sea = ships.length
    ? ships.map((sh, i) => `<g transform="translate(9,${86 + i * 92})">
        <path d="M0 13 L52 13 L45 26 L7 26 Z" fill="#6f8794"/>
        <rect x="16" y="1" width="20" height="12" rx="2" fill="#5d7581"/>
        <circle cx="22" cy="7" r="2" fill="#cfdee6"/><circle cx="30" cy="7" r="2" fill="#cfdee6"/>
        <text x="26" y="41" class="tiny mid b">${sh.eta}월</text>
        <text x="26" y="54" class="tiny mid">${fmt(sh.qty)}t</text></g>`).join('')
    : `<text x="40" y="210" class="tiny mid dim">바다에</text>
       <text x="40" y="226" class="tiny mid dim">배가 없습니다</text>`;

  /* --- 공장동: 건물과 천장 크레인. 라인이 몇 개 도는지가 여기 뜬다 --- */
  const HW = 7.6, HD = 6.4, WH = 3.6, RH = 2.3;
  let inside = '';
  for (let i = 0; i < 5; i++) inside += coilP(1.4 + (i % 3) * 1.9, 1.6 + ((i / 3) | 0) * 2.2, 0.95, 12, '#9aa4ad');
  const hall = `<g transform="translate(${CX[0]},${RY[0]})">
      ${hallShell(HW, HD, WH, RH)}
      ${gantry(HW, HD, WH, 0.25, 4.6)}
      ${inside}
      ${hallRoof(HW, HD, WH, RH)}
    </g>`;

  /* --- 가공 설비 세 대를 따로 --- */
  const SLOT = [
    { type: 'SLIT',  x: CX[1], y: RY[0] },
    { type: 'LEVEL', x: CX[2], y: RY[0] },
    { type: 'BLANK', x: CX[1], y: RY[1] },
  ];
  const util = t => {
    const u = t === 'SLIT' ? (L.now.SLIT || 0) / Math.max(1, c.SLIT)
            : t === 'LEVEL' ? (L.now.LEVEL || 0) / Math.max(1, c.LEVEL)
            : ((L.now.TRAP || 0) + (L.now.DIE || 0)) / Math.max(1, c.BLANK);
    return Math.max(0, Math.min(1, u));
  };
  const machines = SLOT.map(m => {
    const have = s.lines.filter(l => l.type === m.type).length;
    const building = (s.buildQueue || []).find(b => b.type === m.type);
    const lx = m.x - 50, ly = m.y + 86;          // 캡션 자리
    let body, label, sub, cls = '';
    if (have) {
      const u = util(m.type);
      body = pad(0, 0, 5.4, 3.4, '#E7EDF2', '#BCC8D4') + MACHINE[m.type](0.6, 0.45);
      label = `${CFG.LINE[m.type].label}${have > 1 ? ` ×${have}` : ''}`;
      sub = `가동률 ${Math.round(u * 100)}%`;
      body += '';
      var bar = `<rect x="${lx}" y="${ly + 7}" width="96" height="8" rx="4" class="utilbg"/>
                 <rect x="${lx}" y="${ly + 7}" width="${(96 * u).toFixed(1)}" height="8" rx="4"
                   class="util ${u > 0.92 ? 'hot' : ''}"/>`;
    } else if (building) {
      body = pad(0, 0, 5.4, 3.4, 'none', '#A9BAC9', 0, 'slot')
           + cube(1.8, 1.0, 1.9, 1.4, 1.0, '#c3a882');
      label = CFG.LINE[m.type].label; sub = `설치 중 · ${building.readyTurn}월 가동`; cls = 'dim';
      var bar = '';
    } else {
      body = pad(0, 0, 5.4, 3.4, 'none', '#A9BAC9', 0, 'slot');
      label = CFG.LINE[m.type].label; sub = '없음'; cls = 'dim';
      var bar = '';
    }
    return `<g transform="translate(${m.x},${m.y})">${body}</g>`
         + cap(lx, ly, label, sub, cls) + bar;
  }).join('');

  /* --- 소재 야드 --- */
  const nRaw = Math.max(0, Math.min(24, Math.round(raw / 1800)));
  let yard = pad(0, 0, 8.2, 6.0, '#DDE4EB', '#BCC8D4');
  for (let i = 0; i < nRaw; i++) {
    const col = i % 5, row = (i / 5) | 0;
    yard += coilP(1.0 + col * 1.45, 1.1 + (row % 3) * 1.8, 0.95 + ((row / 3) | 0) * 1.4, 12,
                  over ? '#c2857c' : '#9aa4ad');
  }

  /* --- 제품 창고와 출하 --- */
  const nFg = Math.max(0, Math.min(9, Math.round(fg / 1600)));
  let ship = pad(0, 0, 6.0, 4.8, '#DDE4EB', '#BCC8D4');
  for (let i = 0; i < nFg; i++) {
    const col = i % 3, row = (i / 3) | 0;
    ship += stackP(0.45 + col * 1.85, 0.35 + row * 1.5, '#dfe7ec');
  }
  ship += cube(3.5, 3.3, 2.0, 1.1, 0.95, '#b5814f')
        + cube(5.3, 3.46, 0.9, 0.78, 0.7, '#a2723f');

  return `<svg viewBox="0 0 936 470" class="plant">
    <rect width="78" height="470" class="sea"/>
    <rect x="78" width="858" height="470" class="ground"/>
    ${sea}

    ${hall}
    ${cap(CX[0] - 92, RY[0] + 110, '공장동', `${s.lines.length} / ${bayLimit(s)} 라인 가동`)}
    ${machines}

    <g transform="translate(${CX[0]},${RY[1]})">${yard}</g>
    ${cap(CX[0] - 84, RY[1] + 118, '소재 야드', `${fmt(raw)}t`, over ? 'warn b' : 'b')}
    ${over ? `<text x="${CX[0] - 84}" y="${RY[1] + 148}" class="tiny warn">야드가 넘쳤습니다 · 동선이 막힙니다</text>` : ''}

    <g transform="translate(${CX[2]},${RY[1]})">${ship}</g>
    ${cap(CX[2] - 68, RY[1] + 100, '제품 창고 · 출하', `${fmt(fg)}t`, 'b')}
  </svg>`;
}

/* ============================================================
   이번 달 숫자
   ============================================================ */
function look(s) {
  const c = capacityOf(s);
  const now = s.nasi[0] ? s.nasi[0].tons : {};
  const avg = {}, pot = {};
  for (const k of PROC_LIST) {
    const xs = s.nasi.map(n => n.tons[k]), ps = s.nasi.map(n => (n.potential || n.tons)[k]);
    avg[k] = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
    pot[k] = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0;
  }
  let need = Math.min(c.SLIT, avg.SLIT) + Math.min(c.LEVEL, avg.LEVEL)
           + avg.C2C + Math.min(c.BLANK, (avg.TRAP || 0) + (avg.DIE || 0));
  /* 짓고 있는 라인 몫은 미리 사 둬야 한다. 소재도 넉 달, 설비도 넉 달이다.
     준공하고 나서 주문하면 그 라인은 다섯 달을 빈 채로 서 있고,
     그 사이에 못 쳐낸 물량은 결품이 되어 점유율을 영구히 깎는다.
     증설을 결재한 달부터 발주가 커지는 이유가 이것이다. */
  for (const b of (s.buildQueue || [])) {
    if (b.kind && b.kind !== 'LINE') continue;
    let extra = 0;
    for (const k of CFG.LINE[b.type].procs) {
      // 이미 우리 앞에 와 있는데 캐파가 없어 못 받던 물량
      const have = (k === 'TRAP' || k === 'DIE') ? c.BLANK : c[k];
      extra += Math.max(0, (pot[k] || 0) - (have || 0));
      // 아직 열리지 않은 시장(블랭킹)은 내시에 안 잡히니 기저 수요로 어림한다
      if (!procAvailable(s, k))
        extra += DEMAND_BASE[k] * rampOf(s.turn) * Math.min(2, s.myShare / 0.10);
    }
    need += Math.min(CFG.LINE[b.type].cap, extra);
  }
  const haveP = s.poOpen.concat(s.invRaw, s.invFg).reduce((a, l) => a + l.qty, 0);
  const isBust = s.market.phase === 'BUST';
  return { c, now, avg, pot, need, haveP, isBust,
    quota: isBust ? (c.SLIT + c.LEVEL + c.BLANK) * CFG.HQ_SPOT.capShareOfCap : 0,
    gapSlit: pot.SLIT - c.SLIT, gapLevel: pot.LEVEL - c.LEVEL };
}

function buildDecision(s, ui) {
  const L = look(s);
  const target = L.need * (CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd + ui.cover);
  const shortfall = Math.max(0, target - L.haveP);
  const plan = Math.max(0, Math.min(L.need + shortfall / 3, L.need * CFG.BUY_MAX_MULT));
  const ceil = L.need * (CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd + CFG.STOCK_CEIL);
  // 카드 배수는 계획 위에 곱하되, 월 소비량의 BUY_HARD_MAX를 넘지 못한다
  const buy = Math.max(0, Math.min(plan * (G ? (G.mult || 1) : 1),
                                   L.need * CFG.BUY_HARD_MAX,
                                   ceil - L.haveP));
  const n = L.now, hasCommon = (s.hqSpotCredit || 0) > 1;
  const idleS = Math.max(0, L.c.SLIT - (n.SLIT || 0)), idleL = Math.max(0, L.c.LEVEL - (n.LEVEL || 0));
  const runS = Math.min(L.c.SLIT, (n.SLIT || 0) + (hasCommon ? idleS : 0));
  const runL = Math.min(L.c.LEVEL, (n.LEVEL || 0) + (hasCommon ? idleL : 0));
  const runT = Math.min(L.c.BLANK * 0.5, n.TRAP || 0), runD = Math.min(L.c.BLANK * 0.5, n.DIE || 0);
  return {
    // beta는 본사 소재 비중. 1이면 전량 본사, 낮추면 그만큼 3자 소재를 쓴다.
    buy: { totalTon: buy, alpha: 1, beta: G ? (G.beta != null ? G.beta : 1) : 1, hqSpotTon: ui.hqTake },
    invest: { order: ui.investOrder, yieldProgram: ui.yieldSpend, salesEffort: 0 },
    options: { overtime: ui.overtime, discount: G ? G.turnDiscount : 0, trimYield: 0,
               segPriority: (G && G.segPriority) || CFG.SEG_LIST },
    run: { SLIT: runS, LEVEL: runL, TRAP: runT, DIE: runD },
    sell: { C2C: n.C2C || 0, SLIT: runS * CFG.YIELD.SLIT, LEVEL: runL * CFG.YIELD.LEVEL,
            TRAP: runT * CFG.YIELD.TRAP, DIE: runD * CFG.YIELD.DIE },
    _buyTon: buy, _L: L,
  };
}

/* 실적 — 당월, 전월비, 당해 누계, 전년동기비.
   해가 바뀌면 누계는 1월부터 다시 센다. 2년차부터 전년동기가 생긴다. */
function perf(s) {
  const h = s.history;
  if (!h.length) return null;
  const cur = h[h.length - 1], d = ym(cur.turn);
  const prev = h[h.length - 2] || null;
  const yoy  = h[h.length - 13] || null;
  const sum = (arr, k) => arr.reduce((a, x) => a + (x[k] || 0), 0);
  const ytd = h.filter(x => ym(x.turn).y === d.y);
  const ytdPrev = h.filter(x => ym(x.turn).y === d.y - 1 && ym(x.turn).m <= d.m);
  return { cur, prev, yoy, ytd, ytdPrev, sum, year: d.y, month: d.m, hasYoy: d.yi >= 1 };
}


/* ============================================================
   게임 흐름
   ============================================================ */
function newGame() {
  const s = createInitialState({
    seed: (Math.random() * 1e9) | 0,
    equity: START.equity, lines: START.lines,
    country: START.country, companyName: START.name,
  });
  G = { s, ui: { cover: 0.5, hqTake: 0, investOrder: null, overtime: false, yieldSpend: 0 },
        pending: [], seen: {}, deck: [], screen: 'turn',
        mult: 1, beta: 1, turnDiscount: 0, extraFixed: 0, yieldPenalty: 0,
        segPriority: CFG.SEG_LIST.slice(),
        report: null, feedback: [] };
  dealTurn(); render();
}

// 이번 달 상황 — 카드가 조건을 볼 때와 대사에 숫자를 박을 때 쓴다
function cardCtx(s) {
  const c = capacityOf(s);
  const n = s.nasi[0] ? s.nasi[0].tons : {};
  const load = ((n.SLIT || 0) + (n.LEVEL || 0)) / Math.max(1, c.SLIT + c.LEVEL);
  const h = s.history;
  const stock = inventoryTons(s) + s.poOpen.reduce((a, p) => a + p.qty, 0);
  const L = look(s);
  return { load, phase: s.market.phase,
           pmTrend: h.length > 1 ? h[h.length - 1].pm - h[h.length - 2].pm : 0,
           cover: L.need > 0 ? stock / L.need : 0,
           segNow: (s.nasi[0] && s.nasi[0].seg) || {},
           fgTons: Math.round(inventoryTons(s)),
           sellable: Math.round(PROC_LIST.reduce((a, k) => a + (n[k] || 0), 0)) };
}

/* 이번 달 결재판을 짠다.
   루틴 셋은 매달 반드시 올라오고, 그 위에 돌발이 두셋 붙는다.
   본사 스팟과 증설은 해당되는 달에만 돌발 자리에 들어간다. */
function investItems(s) {
  const L = look(s), out = [];
  if ((s.buildQueue || []).length) return out;     // 공사 중에는 새 안건을 안 올린다
  const has = t => s.lines.some(l => l.type === t);
  const stock = inventoryTons(s);
  const bays = bayLimit(s) - s.lines.length;

  if (bays > 0) {
    if (L.gapSlit > 2500)
      out.push({ kind: 'LINE', type: 'SLIT', urgent: true,
        why: `슬리팅 주문이 캐파보다 월 ${fmt(L.gapSlit)}톤 많습니다` });
    if (L.gapLevel > 1500)
      out.push({ kind: 'LINE', type: 'LEVEL', urgent: true,
        why: `레벨링 주문이 캐파보다 월 ${fmt(L.gapLevel)}톤 많습니다` });
    if (!has('BLANK'))
      out.push({ kind: 'LINE', type: 'BLANK',
        why: '블랭킹은 우리가 아직 안 하는 장사입니다' });
  } else if (L.gapSlit > 2500 || L.gapLevel > 1500 || !has('BLANK')) {
    /* 자리가 없다. 그런데 자리를 늘릴 이유가 실제로 있을 때만 올린다.
       채울 물량도 없는데 동을 올리는 건 그냥 돈을 버리는 것이다. */
    out.push({ kind: 'HALL',
      why: `공장동 ${s.buildings}동이 라인 ${s.lines.length}대로 꽉 찼는데 물량은 더 있습니다` });
  }
  if (stock > yardCapOf(s) * 0.85)
    out.push({ kind: 'YARD', urgent: true,
      why: `재고 ${fmt(stock)}톤이 야드 한도 ${fmt(yardCapOf(s))}톤에 닿았습니다` });
  return out.slice(0, 3);
}

/* 투자 안건 한 건을 결재 버튼 한 줄로 만든다.
   설비값은 우리 현금에서 나간다. 모자라면 차입이고, 그 이자는 다음 달부터 문다.
   돌아오는 건 넉 달 뒤(건물은 여덟 달 뒤)다 — 그 시차가 증설 결정의 전부다. */
function investOpt(s, it) {
  /* 투자비의 8할은 본사 보증 시설자금이고 2할이 우리 돈이다.
     매달 나가는 건 원금 1/60과 이자 — 그 부담을 숫자로 보여준다. */
  const own = cx => cx * (1 - CFG.FACILITY_SHARE);
  const mon = cx => cx * CFG.FACILITY_SHARE
                    * (1 / CFG.FACILITY_TERM_M + CFG.FACILITY_RATE_MONTHLY);
  const fin = cx => `자기부담 ${K(own(cx))} · 시설자금 원리금 월 ${K(mon(cx))}천U$`;
  const set = (it2, msg) => (s2, g) => { g.ui.investOrder = it2; return msg; };

  if (it.kind === 'LINE') {
    const cx = CFG.LINE[it.type].capex, cap = CFG.LINE[it.type].cap;
    const lab = CFG.LINE[it.type].label;
    const gain = it.type === 'BLANK'
      ? `없던 시장이 열립니다 · 톤당 가공마진 $${CFG.PROC_MARGIN.TRAP}~${CFG.PROC_MARGIN.DIE}`
      : `가공 캐파 월 +${fmt(cap)}톤`;

function dealTurn() {
  const s = G.s, ctx = cardCtx(s);
  G.mult = 1; G.beta = 1; G.turnDiscount = 0; G.feedback = [];
  G.segPriority = CFG.SEG_LIST.slice();
  Object.assign(G.ui, { hqTake: 0, investOrder: null, overtime: false, yieldSpend: 0 });
  G.deck = ROUTINE.map(f => ({ c: f(s, ctx), chosen: null }));

  const extra = [];
  const big = BIG.find(b => b.at === s.turn);
  if (big) extra.push(big);
  if (s.market.phase === 'BUST') extra.push(hqSpotCard(s));
  /* 투자 안건. 급한 건이 있으면 그 달에 바로 올라오고,
     없어도 분기마다 한 번은 "지금 뭘 지을까"를 묻는다 — 증설 타이밍은 센터장이 잡는다. */
  if (s.turn >= 7) {
    const items = investItems(s);
    if (items.length && (items.some(i => i.urgent) || s.turn % 3 === 1))
      extra.push(investCardDef(s, items));
  }

  const want = 2 + (Math.random() < 0.5 ? 1 : 0);
  const pool = EVENTS.filter(c => (!c.when || c.when(s, ctx)) && (s.turn - (G.seen[c.id] || -99)) > 6);
  while (extra.length < want && pool.length) {
    const c = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    G.seen[c.id] = s.turn; extra.push(c);
  }
  for (const c of extra) G.deck.push({ c, chosen: null });
}

/* 결재 확정 — 고른 것을 전부 적용하고 한 달을 넘긴다.
   이번 달 결정이 이번 달 숫자로 바로 나오지는 않는다. 소재는 넉 달 뒤에 오고
   판매대금은 두 달 뒤에 들어온다. 그 시차가 이 게임의 핵심이다. */
function confirmTurn() {
  const s = G.s, fired = [];
  G.feedback = [];
  for (const d of G.deck) {
    const o = d.c.opts[d.chosen];
    const msg = o.apply ? o.apply(s, G) : '';
    if (o.mult) G.mult *= o.mult;
    if (o.beta != null) G.beta = o.beta;
    if (o.ot) G.ui.overtime = true;
    G.feedback.push({ kind: d.c.kind, title: d.c.title, choice: o.label, msg: msg || '' });
  }
  G.pending = G.pending.filter(p => {
    if (p.turn <= s.turn) { const m = p.run(s); if (m) fired.push(m); return false; }
    return true;
  });

  const savedY = {};
  if (G.yieldPenalty > 0) {
    for (const k of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) { savedY[k] = CFG.YIELD[k]; CFG.YIELD[k] -= 0.015; }
    G.yieldPenalty--;
  }
  const savedFC = CFG.FC_BASE;
  if (G.extraFixed) CFG.FC_BASE += G.extraFixed;

  const dec = buildDecision(s, G.ui);
  G.buyTon = dec._buyTon;
  const res = resolveTurn(s, dec);

  CFG.FC_BASE = savedFC;
  for (const k in savedY) CFG.YIELD[k] = savedY[k];

  G.s = res.state;
  fired.forEach(m => res.report.flags.unshift(m));
  G.report = res.report;
  G.screen = 'close';
  render();
}

function nextMonth() {
  if (G.s.over) { G.screen = 'end'; return render(); }
  G.screen = 'turn'; dealTurn(); render();
}

  if (G.screen === 'end' || (G.s.over && G.screen !== 'close')) return renderEnd();

  renderTurn();
}

function metricRow(s) {
  const canBorrow = s.debt.limit - s.debt.principal;
  const L = look(s);
  const stock = inventoryTons(s) + s.poOpen.reduce((a, p) => a + p.qty, 0);
  const cover = L.need > 0 ? stock / L.need : 0;
  const cell = (k, v, c2) => `<div class="stat"><div class="k">${k}</div><div class="v ${c2 || ''}">${v}</div></div>`;
  return `<div class="hud">
    ${cell('현금 <span style="opacity:.6">천U$</span>', K(s.cash), s.cash < 1e6 ? 'neg' : '')}
    ${cell('차입 / 한도 <span style="opacity:.6">천U$</span>',
           `${K(s.debt.principal)}<span class="muted" style="font-size:12px"> / ${K(s.debt.limit)}</span>`,
           canBorrow < s.debt.limit * 0.15 ? 'neg' : '')}
    ${cell('재고', `${cover.toFixed(1)}<span class="muted" style="font-size:12px">개월</span>`,
           cover < 2.5 ? 'neg' : cover > 6 ? 'neg' : '')}
    ${cell('본사 신뢰', Math.round(s.trust), s.trust < 45 ? 'neg' : s.trust > 75 ? 'pos' : '')}
  </div>`;
}

function perfTable(s) {
  const p = perf(s);
  if (!p) return '';
  const rows = [
    { t: '판매량', k: 'shippedTotal', unit: 't', pct: true },
    ...CFG.SEG_LIST.map(k => ({ t: '　' + CFG.SEGMENT[k].label, seg: k, unit: 't', pct: true, dim: 1 })),
    { t: '매출액', k: 'revenue', pct: true },
    { t: '영업이익', k: 'op' },
    { t: '순이익', k: 'np' },
    { t: '본사 영업이익', k: 'hqMargin', hi: true },
  ];
  const pick = (h, r) => h ? (r.seg ? ((h.shippedSeg && h.shippedSeg[r.seg]) || 0) : (h[r.k] || 0)) : 0;
  const sumR = (arr, r) => arr.reduce((a, h) => a + pick(h, r), 0);
  const body = rows.map(r => {
    const cur = pick(p.cur, r);
    const prev = p.prev ? pick(p.prev, r) : null;
    const ytd = sumR(p.ytd, r);
    const ytdPrev = sumR(p.ytdPrev, r);
    const curTxt = r.unit === 't' ? fmt(cur) + 't' : K(cur);
    const ytdTxt = r.unit === 't' ? fmt(ytd) + 't' : K(ytd);
    const mom = prev === null ? '−' : (r.pct ? dPct(cur, prev) : dK(cur - prev));
    const momC = prev === null ? '' : cls(cur - prev);
    const yoy = (!p.hasYoy || !ytdPrev) ? '−' : (r.pct ? dPct(ytd, ytdPrev) : dK(ytd - ytdPrev));
    const yoyC = (!p.hasYoy || !ytdPrev) ? '' : cls(ytd - ytdPrev);
    return `<tr class="${r.hi ? 'hq' : ''}${r.dim ? ' segrow' : ''}"><td>${r.t}</td>
      <td class="${r.k === 'op' || r.k === 'np' ? cls(cur) : ''}">${curTxt}</td>
      <td class="${momC}">${mom}</td><td>${ytdTxt}</td><td class="${yoyC}">${yoy}</td></tr>`;
  }).join('');
  return `<div class="card">
    <h2>실적 <span class="muted" style="font-weight:400">· 수량 톤 · 금액 천U$</span></h2>
    <table class="perf">
      <tr><th></th><th>${p.month}월</th><th>전월비</th><th>${p.year}년 누계</th>
          <th>${p.hasYoy ? '전년동기비' : '전년동기'}</th></tr>
      ${body}</table>
    <p class="hint">본사 영업이익은 본사(P사)가 우리에게 소재를 팔아 벌어들인 이익입니다.</p>
  </div>`;
}

/* 공사 중인 것. 돈은 이미 나갔고 아직 안 도는 물건이라 화면에 남겨 둔다. */
function buildRow(s) {
  const q = s.buildQueue || [];
  if (!q.length) return '';
  const name = b => b.kind === 'HALL' ? '새 공장동'
                  : b.kind === 'YARD' ? '야드 확장' : CFG.LINE[b.type].label;
  return `<div class="mrow"><span>🏗 ${q.map(b =>
    `${name(b)} 공사 중 · ${ymLabel(b.readyTurn)} 가동`).join(' · ')}</span></div>`;
}

function renderTurn() {
  const s = G.s, d = ym(s.turn), ch = chapterOf(s.turn), cp = capacityOf(s);
  const ready = G.deck.every(x => x.chosen !== null);
  const deckHTML = G.deck.map((x, i) => {
    const c = x.c, who = CAST[c.who];
    const body = typeof c.text === 'function' ? c.text(s, cardCtx(s)) : c.text;
    return `<div class="dec ${x.chosen !== null ? 'done' : ''}">
      <div class="dhead"><span class="tag">${c.kind}</span><b>${c.title}</b></div>
      <div class="say"><div class="face">${who.face}</div><div class="bubble">
        <span class="who">${who.name} · ${who.role}</span>${body}</div></div>
      <div class="opts">${c.opts.map((o, j) => `
        <button data-d="${i}" data-o="${j}" class="${x.chosen === j ? 'on' : ''}">
          <b>${o.label}</b>${o.hint ? `<span>${o.hint}</span>` : ''}</button>`).join('')}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div><b>${d.y}년 ${d.m}월</b>
        <span class="muted">· ${s.turn} / 48개월</span></div>
    </div>

    <div class="plantslot">
      <span class="kicker" style="margin:0">공장 전경</span>
    </div>

    <div class="market ph-${s.market.phase}">
      <div class="mk">
        <span class="mtag">${CFG.PHASE[s.market.phase].label}</span>
        <b>${ch.label}</b>
      </div>
      <p>${ch.brief}</p>
      <div class="mrow">
        <span>소재 시세 <b>$${fmt(s.market.pm)}</b>/톤</span>
        <span>${pmArrow(s)}</span>
        <span>가공 캐파 월 <b>${fmt(cp.SLIT + cp.LEVEL + cp.BLANK)}</b>t · 라인 ${s.lines.length}/${bayLimit(s)}</span>
      </div>
      ${buildRow(s)}
    </div>
    ${metricRow(s)}
    ${perfTable(s)}

    <div class="card deck">
      <h2>이번 달 결재 <span class="muted" style="font-weight:400">· ${G.deck.length}건</span></h2>
      ${deckHTML}
      <div class="center" style="margin-top:18px">
        <button class="primary" id="ok" ${ready ? '' : 'disabled'}>
          ${ready ? '결재 확정' : `아직 ${G.deck.filter(x => x.chosen === null).length}건 남았습니다`}</button>
      </div>
    </div>

    <details class="card fold"><summary>${d.m}월 말 재무상태표</summary>${balanceSheet(s)}</details>`;

  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    G.deck[+b.dataset.d].chosen = +b.dataset.o; renderTurn();
  });
  $('#ok').onclick = () => { if (G.deck.every(x => x.chosen !== null)) confirmTurn(); };
}

/* 월말 재무상태표. 장부를 늘어놓는 대신 회사가 지금 어떤 모양인지 한 장으로 본다.
   자산이 어디에 묶여 있고 그걸 누구 돈으로 받치고 있는지가 이 게임의 전부다. */
function balanceSheet(s) {
  const r = receivables(s);
  const invT = inventoryTons(s);
  const invVal = [...s.invRaw, ...s.invFg].reduce((a, l) => a + l.qty * l.unitCost, 0);
  const transit = s.poOpen.reduce((a, p2) => a + p2.qty * p2.unitPriceFixed, 0);
  const land = s.fa.land, bld = s.fa.buildingNbv;
  const mach = Math.max(0, s.fa.machineCost - s.fa.machineAccDep);
  const cip = cipValue(s);                    // 돈은 나갔는데 아직 안 도는 것
  const assets = s.cash + r.total + invVal + transit + land + bld + mach + cip;
  const ap = s.ap.reduce((a, x) => a + x.amount, 0);
  const debt = s.debt.principal, fac = facilityBalance(s);
  const equity = assets - ap - debt - fac;
  const row = (t, v, c2) => `<tr class="${c2 || ''}"><td>${t}</td><td>${K(v)}</td></tr>`;
  return `<table style="margin-top:10px">
    <tr><th>자산</th><th>천U$</th></tr>
    ${row('현금', s.cash)}
    ${row('매출채권', r.total)}
    ${r.late > 1 ? `<tr class="segrow"><td>　약속일을 넘긴 것</td><td class="neg">${K(r.late)}</td></tr>` : ''}
    ${row(`재고 <span class="muted">${fmt(invT)}t</span>`, invVal)}
    ${row('미착 소재 <span class="muted">바다 위</span>', transit)}
    ${row('토지', land)}
    ${row('건물', bld)}
    ${row('설비', mach)}
    ${cip > 1 ? row('건설중인자산 <span class="muted">공사 중</span>', cip) : ''}
    <tr class="tot"><td>자산 합계</td><td>${K(assets)}</td></tr>
  </table>
  <table style="margin-top:14px">
    <tr><th>부채와 자본</th><th>천U$</th></tr>
    ${row('매입채무 <span class="muted">아직 안 낸 소재값</span>', ap)}
    ${row('운전자금 차입', debt)}
    ${fac > 1 ? row('시설자금 차입 <span class="muted">설비·건물</span>', fac) : ''}
    <tr class="tot"><td>부채 합계</td><td>${K(ap + debt + fac)}</td></tr>
    ${row('자본 <span class="muted">납입 + 누적손익</span>', equity)}
    <tr class="tot"><td>부채와 자본 합계</td><td>${K(ap + debt + fac + equity)}</td></tr>
  </table>
  <p class="hint">차입 여력 ${K(s.debt.limit - s.debt.principal)}천U$ · 소재 시세 $${fmt(s.market.pm)}/톤 · 직원 사기 ${Math.round(s.morale)}</p>
  ${equity < s.paidIn * 0.6 ? `<div class="note bad"><b>자본이 줄고 있습니다.</b>
    납입자본금 ${K(s.paidIn)}천U$ 가운데 ${K(equity)}천U$만 남았습니다.
    이게 0이 되면 회사는 이익을 내든 못 내든 없어집니다.</div>`
   : equity > s.paidIn ? `<p class="hint">납입자본금 ${K(s.paidIn)}천U$에 그동안 번 돈
     ${K(equity - s.paidIn)}천U$가 쌓였습니다.</p>` : ''}`;
}

// 시세가 어느 쪽으로 가고 있는지
function pmArrow(s) {
  const h = s.history;
  if (h.length < 2) return '<span class="muted">지난달 대비 —</span>';
  const d2 = s.market.pm - h[h.length - 1].pm;
  if (Math.abs(d2) < 1) return '<span class="muted">지난달과 같음</span>';
  return `<span class="${d2 > 0 ? 'neg' : 'pos'}">지난달 대비 ${d2 > 0 ? '▲' : '▼'} $${fmt(Math.abs(d2))}</span>`;
}

/* ---- 4. 결산 — 결정의 결과와 그 달 손익 ---- */
function renderClose() {
  const R = G.report, s = G.s, d = ym(R.turn);
  const lines = [...(R.phaseChange ? [R.phaseChange] : []), ...R.flags, ...R.log];
  const buy = G.deck.find(x => x.c.id === 'r-buy');
  const eta = ymLabel(R.turn + CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd);

  app.innerHTML = `
    <div class="topbar"><div><b>${d.y}년 ${d.m}월 결산</b></div></div>

    <div class="card">
      <h2>결재한 것</h2>
      ${G.feedback.map(f => `<div class="fb">
        <div><span class="tag">${f.kind}</span>${f.title}</div>
        <div class="fbc">→ <b>${f.choice}</b></div>
        ${f.msg ? `<div class="fbm">${f.msg}</div>` : ''}</div>`).join('')}
      ${buy ? `<div class="note">이번 달 발주한 소재 <b>${fmt(G.buyTon || 0)}톤</b>은 <b>${eta}</b>에 도착합니다.
        대금은 그 다음 달에 나갑니다 — 이번 달 숫자에는 아직 잡히지 않습니다.</div>` : ''}
    </div>

    <div class="card">
      <h2>${d.m}월 손익 <span class="muted" style="font-weight:400">· 천U$</span></h2>
      <table>
        <tr><td>판매량</td><td>${fmt(R.shippedTotal)}t</td></tr>
        <tr><td class="muted">　통코일 / 가공</td><td class="muted">${fmt(R.shippedC2C)}t / ${fmt(R.shippedProc)}t</td></tr>
        <tr><td>매출액</td><td>${K(R.revenue)}</td></tr>
        <tr><td>매출총이익</td><td>${K(R.gp)}</td></tr>
        <tr><td>고정비 + 변동비</td><td>−${K(R.fixedCost + R.varCost)}</td></tr>
        <tr><td>감가상각</td><td>−${K(R.depreciation)}</td></tr>
        <tr class="tot"><td>영업이익</td><td class="${cls(R.op)}">${K(R.op)}</td></tr>
        ${R.interest > 500 ? `<tr><td>이자</td><td>−${K(R.interest)}</td></tr>` : ''}
        ${R.badDebt > 1 ? `<tr><td>대손</td><td class="neg">−${K(R.badDebt)}</td></tr>` : ''}
        <tr class="tot"><td>순이익</td><td class="${cls(R.np)}">${K(R.np)}</td></tr>
        ${R.facilityRepay > 1 ? `<tr><td class="muted">시설자금 원금 상환 <span class="muted">· 손익이 아니라 현금</span></td>
          <td class="muted">−${K(R.facilityRepay)}</td></tr>` : ''}
      </table>
      <div class="sep"></div>
      <table>
        <tr class="hq"><td>본사 영업이익 <span class="muted">· 본사가 우리에게 소재를 팔아 번 돈</span></td>
          <td class="${cls(R.hqMargin)}">${K(R.hqMargin)}</td></tr></table>
    </div>

    ${lines.length ? `<div class="card"><h2>이 달에 있었던 일</h2>
      ${lines.map(t => `<div class="note ${/결품|넘겼|막혀|모자|대손|떠나|부도|클레임|넘어갔|나갔|털었/.test(t) ? 'bad' : ''}">${t}</div>`).join('')}
      ${R.lineReady ? `<div class="note good">${R.lineReady}</div>` : ''}</div>` : ''}

    <div class="center" style="margin-top:18px">
      <button class="primary" id="nx">${G.s.over ? '4년을 마칩니다' : ymLabel(G.s.turn) + '로'}</button></div>`;
  $('#nx').onclick = nextMonth;
}

/* ---- 5. 성적표 ---- */
function renderEnd() {
  const g = grade(G.s), s = G.s, h = s.history;
  const best = h.reduce((a, x) => x.op > a.op ? x : a, h[0] || { op: 0, turn: 1 });
  const worst = h.reduce((a, x) => x.op < a.op ? x : a, h[0] || { op: 0, turn: 1 });
  const bar = (v, t) => {
    const p = Math.max(0, Math.min(1.2, v / t));
    return `<div class="track" style="height:12px"><div class="fill ${v >= t ? '' : 'over'}"
      style="width:${(p / 1.2 * 100).toFixed(0)}%"></div></div>`;
  };
  app.innerHTML = `
    <div class="card center" style="padding:34px 24px">
      <p class="kicker">${h.length}개월 · ${ymLabel(1)} ~ ${ymLabel(h.length)}</p>
      <div class="big">${g.grade}</div>
      <h1 style="margin:6px 0 14px">${g.title}</h1>
      <p class="sub" style="max-width:540px;margin:0 auto 24px">${g.desc}</p>

      <div style="max-width:460px;margin:0 auto;text-align:left">
        <div class="goalres">
          <div><b>① 본사 기여</b><span class="muted"> · 본사가 우리에게 소재를 팔아 번 영업이익</span></div>
          <div class="gv ${g.hqProfit >= g.hqTarget ? 'pos' : 'neg'}">${K(g.hqProfit)}
            <span class="muted" style="font-size:12px">/ 목표 ${K(g.hqTarget)}천U$</span></div>
          ${bar(g.hqProfit, g.hqTarget)}
        </div>
        <div class="goalres">
          <div><b>② 코일센터 영업이익</b></div>
          <div class="gv ${g.soloOp >= g.soloTarget ? 'pos' : 'neg'}">${K(g.soloOp)}
            <span class="muted" style="font-size:12px">/ 목표 ${K(g.soloTarget)}천U$</span></div>
          ${bar(g.soloOp, g.soloTarget)}
        </div>
      </div>

      <div class="sep" style="max-width:460px;margin:22px auto"></div>
      <table style="max-width:460px;margin:0 auto;text-align:left">
        <tr><td>4년 누적 판매량</td><td>${fmt(g.soldTons)}t</td></tr>
        <tr><td>본사에서 사온 소재</td><td>${fmt(g.hqTons)}t</td></tr>
        <tr><td>제일 좋았던 달</td><td>${ymLabel(best.turn)} · ${K(best.op)}천U$</td></tr>
        <tr><td>제일 나빴던 달</td><td>${ymLabel(worst.turn)} · ${K(worst.op)}천U$</td></tr></table>

      <div style="margin-top:26px"><button class="primary" id="again">다시 하기</button></div>
    </div>`;
  $('#again').onclick = () => { G = null; render(); };
}

render();

</script>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코일센터 경영 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     스틸 그레이드 가챠와 같은 결 — 큐비즘
       · 모서리를 자른 면(clip-path)으로 판을 만든다. 둥근 모서리를 쓰지 않는다
       · 그라데이션은 부드럽게 섞지 않고 각진 면처럼 딱딱 끊는다 (0 40% / 40% 72% / 72% 100%)
       · 차가운 청회색 바탕에 감청색 강조
     ============================================================ */
  :root{
    --bg:#E3E9EF;
    --f1:#F2F5F8; --f2:#E0E7ED; --f3:#D0DAE4; --edge:#BCC8D4;
    --ink:#16202B; --ink-2:#53616F; --ink-3:#8593A2;
    --blue:#1F5C99; --blue-l:#4C8AC4; --deep:#243342;
    --po:#BE473D; --ok:#2E7D53; --amber:#A0722A; --teal:#1A7B83;
    --cut:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* 배경 파편 */
  .facets{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .facets svg{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:1400px;height:1400px;opacity:.55}

  .wrap{max-width:780px;margin:0 auto;padding:22px 16px 60px;position:relative;z-index:1}
  .cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
       calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}

  h1{font-size:clamp(26px,6vw,34px);font-weight:700;letter-spacing:-.03em;margin:0 0 6px;line-height:1.08;
     background:linear-gradient(112deg,#3E7FBF 0 34%,#1F5C99 34% 62%,#123F6E 62% 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:14px;margin:0 0 12px;letter-spacing:-.01em;font-weight:700}
  .kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
  .sub{color:var(--ink-2);font-size:13px;margin:0 0 18px}
  .rule{height:2px;background:linear-gradient(90deg,var(--blue) 0 22%,var(--edge) 22% 100%);margin:12px 0 18px}

  .card{background:var(--f1);border:1px solid var(--edge);padding:16px 18px;margin-bottom:14px}
  .sep{height:1px;background:var(--edge);margin:14px 0}
  .muted{color:var(--ink-3)}
  .hint{font-size:12px;color:var(--ink-3);margin-top:6px}
  .center{text-align:center}

  /* 지표 타일 */
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--edge);
    border:1px solid var(--edge);margin-bottom:14px}
  .stat{background:var(--f1);padding:11px 13px}
  .stat .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    margin-top:3px;font-family:"IBM Plex Mono",ui-monospace,monospace}
  @media(max-width:560px){ .hud{grid-template-columns:repeat(2,1fr)} }
  .v.neg,td.neg,.neg{color:var(--po)} .v.pos,td.pos,.pos{color:var(--ok)}

  /* 시황 배지 */
  .phase{display:inline-block;padding:3px 11px;font-size:11px;font-weight:700;letter-spacing:.02em;
    font-family:"IBM Plex Mono",ui-monospace,monospace;--cut:7px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .ph-BUST{background:#F0DCDA;color:#8F332A}
  .ph-NORMAL{background:var(--f3);color:var(--ink-2)}
  .ph-BOOM{background:#D7E6DC;color:#1F5F40}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
  .topbar b{font-size:20px;letter-spacing:-.025em}

  /* 표 */
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:7px 8px;border-bottom:1px solid var(--edge);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3);font-weight:400}
  tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
  table.perf td:first-child{font-weight:600}
  table.perf tr.hq td{background:var(--f2)}
  td:not(:first-child){font-family:"IBM Plex Mono",ui-monospace,monospace}

  /* 버튼 */
  button{font:inherit;font-family:inherit;cursor:pointer;border:0;transition:filter .1s,transform .08s}
  .primary{width:100%;max-width:340px;padding:16px;font-size:16px;font-weight:700;letter-spacing:-.01em;
    color:#F2F7FB;--cut:16px;
    background:linear-gradient(104deg,#3B82C4 0 40%,#1F5C99 40% 72%,#154270 72% 100%);
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .primary:hover:not(:disabled){filter:brightness(1.08)}
  .primary:active:not(:disabled){transform:translateY(2px)}
  .primary:disabled{background:var(--f2);color:var(--ink-3);cursor:default;
    border:1px solid var(--edge);clip-path:none}

  /* 알림 상자 */
  .note{background:var(--f2);border-left:3px solid var(--blue);padding:11px 13px;
    font-size:13px;margin:11px 0;color:var(--ink-2)}
  .note b{color:var(--ink)}
  .note.bad{background:#F6E6E4;border-left-color:var(--po)}
  .note.good{background:#E1EDE6;border-left-color:var(--ok)}

  /* 등장인물 말 */
  .say{display:flex;gap:11px;align-items:flex-start;margin:0 0 12px}
  .face{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;font-size:17px;
    background:var(--f3);border:1px solid var(--edge)}
  .bubble{background:var(--f2);border:1px solid var(--edge);padding:9px 13px;font-size:13.5px;
    color:var(--ink-2);flex:1}
  .bubble .who{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
    color:var(--ink-3);display:block;margin-bottom:3px;text-transform:uppercase}

  /* 목적 */
  .goal{display:flex;gap:12px;align-items:flex-start;margin:13px 0}
  .goal .gnum{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;
    background:linear-gradient(104deg,#3B82C4 0 45%,#1F5C99 45% 100%);color:#fff;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;font-size:13px}
  .goal b{display:block;font-size:14.5px}
  .goal span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}

  /* 결재 */
  .tag{display:inline-block;background:var(--f3);color:var(--ink-2);padding:2px 8px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;margin-right:7px}
  .dec{border-top:1px solid var(--edge);padding:16px 0 4px}
  .dec:first-of-type{border-top:none;padding-top:4px}
  .dhead{display:flex;gap:6px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
  .dhead b{font-size:15px;letter-spacing:-.015em}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opts button{flex:1 1 190px;text-align:left;padding:11px 13px;line-height:1.4;
    background:var(--f2);border:1px solid var(--edge);color:var(--ink)}
  .opts button b{display:block;font-size:13.5px;font-weight:600}
  .opts button span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .opts button:hover{background:var(--f3)}
  .opts button.on{color:#F2F7FB;border-color:transparent;
    background:linear-gradient(104deg,#3B82C4 0 40%,#1F5C99 40% 72%,#154270 72% 100%)}
  .opts button.on b{font-weight:700}
  .opts button.on span{color:#CFE0EF}
  .dec.done .dhead b{color:var(--ink-3)}

  /* 결산 피드백 */
  .fb{border-top:1px solid var(--edge);padding:11px 0;font-size:13.5px}
  .fb:first-of-type{border-top:none}
  .fbc{margin-top:3px}
  .fbm{font-size:12.5px;color:var(--ink-2);margin-top:3px}

  details.fold{padding:12px 16px}
  details.fold summary{cursor:pointer;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  details.fold[open] summary{margin-bottom:8px}

  /* 성적표 */
  .big{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    background:linear-gradient(112deg,#3E7FBF 0 34%,#1F5C99 34% 62%,#123F6E 62% 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .goalres{margin:0 0 20px}
  .goalres .gv{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:4px 0 7px;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
  .track{height:10px;background:var(--f3);border:1px solid var(--edge);position:relative;overflow:hidden}
  .fill{height:100%;background:linear-gradient(104deg,#3B82C4 0 45%,#1F5C99 45% 100%)}
  .fill.over{background:linear-gradient(104deg,#C86A5E 0 45%,#BE473D 45% 100%)}

  /* 공장 자리 — 나중에 그림이 들어온다 */
  .plantslot{border:1px dashed var(--edge);background:var(--f2);height:132px;
    display:grid;place-items:center;margin-bottom:14px}
  .plantslot .kicker{color:var(--ink-3)}

  /* 시황 — 제일 먼저 눈에 들어와야 한다 */
  .market{border:1px solid var(--edge);border-left:5px solid var(--ink-3);
    background:var(--f1);padding:13px 16px;margin-bottom:14px}
  .market.ph-BOOM{border-left-color:var(--ok);background:linear-gradient(100deg,#E4F0E9 0 42%,#EDF4F0 42% 100%)}
  .market.ph-NORMAL{border-left-color:var(--slate,#7F9DB8);background:var(--f1)}
  .market.ph-BUST{border-left-color:var(--po);background:linear-gradient(100deg,#F6E4E2 0 42%,#F7EDEC 42% 100%)}
  .market .mk{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .market .mk b{font-size:16px;letter-spacing:-.02em}
  .market .mtag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:600;
    letter-spacing:.1em;padding:3px 10px;background:var(--ink);color:#F2F7FB;--cut:6px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .market.ph-BOOM .mtag{background:#1F5F40}
  .market.ph-BUST .mtag{background:#8F332A}
  .market p{margin:7px 0 0;font-size:13px;color:var(--ink-2)}
  .market .mrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:13px;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
  .market .mrow b{font-size:15px;font-weight:600}

  /* 산업군 행 */
  table.perf tr.segrow td{color:var(--ink-2);font-size:12px;padding-top:4px;padding-bottom:4px}
  table.perf tr.segrow td:first-child{font-weight:400}
  tr.segrow td{color:var(--ink-2);font-size:12px}

</style>
<div class="facets" aria-hidden="true">
  <svg viewBox="0 0 1400 1400" preserveAspectRatio="xMidYMin slice">
    <polygon points="0,0 560,0 200,430" fill="#D6DFE8"/>
    <polygon points="560,0 1400,0 1400,260 790,390" fill="#DDE5EC"/>
    <polygon points="0,400 430,250 660,680 150,800" fill="#D9E2EA"/>
    <polygon points="790,340 1400,240 1400,720 930,680" fill="#CFDAE5"/>
    <polygon points="150,790 710,650 930,1140 230,1230" fill="#DFE6ED"/>
    <polygon points="930,680 1400,700 1400,1160 1000,1140" fill="#D4DEE7"/>
    <polygon points="230,1220 1000,1130 1160,1400 0,1400" fill="#DAE3EB"/>
    <g opacity=".5" stroke="#A9BAC9" stroke-width="1.2" fill="none">
      <path d="M200 430 L660 680 L930 1140 L1160 1400"/>
      <path d="M560 0 L790 390 L930 680 L1000 1140"/>
      <path d="M0 400 L430 250 L790 340 L1400 240"/>
    </g>
  </svg>
</div>
<div class="wrap" id="app"></div>
<style>
  /* 공장 조감도 — 아이소메트릭. 면 색은 전부 인라인으로 칠하고
     여기서는 글자와 몇 가지 선만 잡는다. */
  .plant{width:100%;height:auto;display:block;border-radius:10px}
  .plant .sea{fill:#C3D2DF}
  .plant .ground{fill:#DFE6ED}
  .plant .zone{fill:#F2F5F8;stroke:#BCC8D4;stroke-width:1.5}
  .plant .coil{fill:#9aa4ad;stroke:#78828b;stroke-width:1.5}
  .plant .coil.bad{fill:#c98a80;stroke:#a9645a}
  .plant .coil.fgc{fill:#7fa892;stroke:#5f8874}
  .plant .ship{fill:#6f8794}
  .plant .line{fill:#f4efe3;stroke:#d9d0be;stroke-width:1.5}
  .plant .truck{fill:#b5814f}
  .plant .wheel{fill:#4a423a}
  .plant .slot{fill:none;stroke:#A9BAC9;stroke-width:1.6;stroke-dasharray:5 4}
  .plant .rail{stroke:#c9bfa9;stroke-width:1.6}
  .plant .hook{stroke:#7b7268;stroke-width:1.2}
  .plant .utilbg{fill:#D0DAE4}
  .plant .util{fill:#1F5C99}
  .plant .util.hot{fill:#BE473D}
  .plant .cap{font:700 11px ui-sans-serif,system-ui;fill:#16202B;text-anchor:middle}
  .plant .lbl{font:700 13px ui-sans-serif,system-ui;fill:#16202B}
  .plant .lbl.end{text-anchor:end}
  .plant .lbl.dim,.plant .tiny.dim{fill:#8593A2}
  .plant .lbl.warn,.plant .tiny.warn{fill:#BE473D}
  .plant .tiny{font:500 11px ui-sans-serif,system-ui;fill:#53616F}
  .plant .tiny.mid{text-anchor:middle}
  .plant .tiny.b{font-weight:700}
</style>
<script>
/* ============================================================
   코일센터 경영 시뮬레이터 · 경제 엔진
   설계 근거: _workspace/20260912_01/output/4-economy-engine.md (v3)
   1턴 = 1개월. 통화 USD, 물량 톤.
   ============================================================ */

/* ---------- 설정 ---------- */

const CFG = {
  /* ---- 판매 유형별 마진·수율 ----
     톤당 마진에서 변동비·고정비·감가상각·이자·대손이 차례로 빠진다.
     처음 잡았던 값(통코일 $10, 가공 $40)으로는 매출총이익이 톤당 $27밖에 안 나와
     영업이익 $10에 이자 $7.6과 대손 $4.5를 물고 나면 순이익이 구조적으로 적자였다.
     몇 년을 그렇게 두면 자본이 잠식되어 법인이 없어진다 — 그렇게 굴러가는
     코일센터는 없다. 통상 매출 대비 영업이익 2~3%, 순이익 1~1.5% 선이므로
     톤당 매출 $870에 맞춰 영업이익 $20 안팎이 나오도록 잡았다.
     불황이 오면 이 마진에서도 적자가 난다 — 그건 구조가 아니라 시황이다. */
  COIL_MARGIN: 18,                                    // 전 유형 공통 (통코일도 이만큼은 붙는다)
  PROC_MARGIN: { C2C: 0, SLIT: 38, LEVEL: 38, TRAP: 55, DIE: 95 },
  YIELD:       { C2C: 1.00, SLIT: 0.98, LEVEL: 0.98, TRAP: 0.98, DIE: 0.85 },
  VAR_COST:    { C2C: 3, SLIT: 12, LEVEL: 12, TRAP: 25, DIE: 25 }, // 처리톤당

  // 라인 (v3 §2-1)
  LINE: {
    SLIT:  { cap: 8333, capex: 2_000_000, procs: ['SLIT'],          label: '슬리터' },
    LEVEL: { cap: 4167, capex: 2_000_000, procs: ['LEVEL'],         label: '레벨러' },
    BLANK: { cap: 4000, capex: 5_000_000, procs: ['TRAP', 'DIE'],   label: '블랭킹' },
  },
  MAX_LINES: 3,                    // 공장동 한 동이 수용하는 라인 수. 네 대째는 동을 하나 더 올려야 한다

  /* ---- 증설 투자 (센터장이 직접 올리는 안건) ----
     설비만 사면 되는 장사가 아니다. 공장동 한 동에 라인 세 대가 들어가고,
     네 대째를 놓으려면 건물부터 올려야 한다. 그 건물값이 설비값의 몇 배다.
     야드도 같다 — 물량이 늘면 코일 놓을 자리부터 모자라고, 자리가 모자라면
     전략과 무관하게 외부창고비가 톤당 원가에 통째로 얹힌다.
     돈은 결재하는 달에 나가고 물건은 몇 달 뒤에 돈다. 그 사이가 건설중인자산이다. */
  /* 설비투자를 운전자금 한도로 막는 코일센터는 없다. 그렇게 하면 소재 살 돈이
     그대로 설비로 빠져 다음 배를 못 띄운다. 실제로는 본사 지급보증을 끼고
     시설자금 대출을 따로 일으켜 몇 년에 걸쳐 갚는다. 그래서 증설의 진짜 질문은
     "지금 현금이 있는가"가 아니라 "몇 년치 원리금을 감당할 수 있는가"다. */
  FACILITY_SHARE: 0.80,            // 투자비의 80%까지 시설자금으로 조달, 나머지는 자기 돈
  FACILITY_TERM_M: 60,             // 5년 균등분할상환
  FACILITY_RATE_ANNUAL: 0.055,     // 운전자금보다 조금 높다 (장기)
  get FACILITY_RATE_MONTHLY() { return this.FACILITY_RATE_ANNUAL / 12; },
  HALL_TURNS: 8,                   // 공장동 준공까지 (설비는 4개월)
  HALL_FC: 25_000,                 // 동이 늘면 관리·전력·인원도 는다
  YARD: { capex: 2_200_000, add: 30_000, fc: 10_000, turns: 3 },

  /* ---- 투자비 ----
     자본금 $25M으로 시작해 $22M을 설립에 쓴다. 남는 현금은 $3M뿐이다.
       토지        $4M  (비상각)
       공장동     $12M  (20년)
       사무동      $2M  (20년)
       설비 2라인  $4M  (10년)
     이 얇은 현금이 이 게임의 출발점이다. 소재 한 배가 $10M을 넘으니
     첫 발주부터 은행을 끼지 않으면 배를 띄울 수가 없다. */
  INFRA_TOTAL: 18_000_000,         // 토지 4 + 공장동 12 + 사무동 2
  LAND: 4_000_000,                 // 비상각
  BUILDING: 14_000_000,            // 공장동 12 + 사무동 2, 20년 = 240개월
  BUILDING_LIFE_M: 240,
  MACHINE_LIFE_M: 120,             // 10년 정액 (확정)

  /* 수요 변동. 재고가 얇으면 이 진폭에서 결품이 난다.
     자동차강판은 월별 내시 물량이 사전에 나오므로 흔들림이 작다. 이게 3개월(미착 포함)
     이라는 얇은 재고로도 회사가 돌아가는 이유다. 일반재 유통 물량은 그런 게 없다. */
  DEMAND_NOISE_AUTO: 0.05,
  DEMAND_NOISE_COMMON: 0.22,

  INSTALL_TURNS: 4,               // 설비 발주에서 가동까지 (실무자 확인 필요)
  TOTAL_TURNS: 48,
  START_YEAR: 2026,                // 2026년 1월에 부임한다
  /* ---- 부임 시점의 기반 (실무자 확인) ----
     빈 공장을 물려받는 게 아니다. 이미 돌아가던 회사를 넘겨받는다.
     창고에 소재가 있고, 매달 나가는 물량이 있고, 아직 못 받은 대금이 있다.
     이게 없으면 첫 넉 달 동안 판매가 0으로 찍혀 화면이 죽어 있다. */
  OPEN_STOCK_TON: 10_000,          // 넘겨받는 소재 재고 (판매 3개월치쯤)
  OPEN_AR_MONTHS: 2,               // 전임자가 팔고 아직 못 받은 대금 (개월치)
  /* 부임 시점 월 판매는 3,000톤 남짓이고, 여기서부터 키워 나간다.
     캐파(월 12,500톤 가공 + 통코일)를 다 채우는 것이 센터장의 일이다. */
  RAMP_START: 0.11,
  RAMP_TURNS: 18,
  /* 4년 뒤 성적표를 가르는 두 축.
     본사 기여 = 본사(P사)가 우리에게 소재를 팔아 벌어들인 영업이익 누계
     법인 손익 = 코일센터 자체 영업이익 누계
     이 둘은 같이 가지 않는다. 그게 이 게임의 전부다. */
  HQ_PROFIT_TARGET: 44_000_000,
  SOLO_OP_TARGET: 19_000_000,
};

const PROC_LIST = ['C2C', 'SLIT', 'LEVEL', 'TRAP', 'DIE'];

/* ---------- 난수 (시드 고정 가능) ---------- */

function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function rng() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function gauss(rng) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ---------- 톤당 손익 (v3 §1) ---------- */

// 상정 실효소재원가 = P_m × [ 1/y_a − (1/y_a − 1) × r_a ]
function effectiveMaterialCost(pm, y, scrapRate) {
  const inv = 1 / y;
  return pm * (inv - (inv - 1) * scrapRate);
}

// 판가 = 상정 실효소재원가 + 코일마진 + 가공마진
function unitPrice(proc, pmRef, assumedYield, assumedScrapRate, opts = {}) {
  const base = proc === 'C2C'
    ? pmRef
    : effectiveMaterialCost(pmRef, assumedYield, assumedScrapRate);
  return base
    + CFG.COIL_MARGIN
    + CFG.PROC_MARGIN[proc]
    + (opts.gradeMargin || 0)
    - (opts.discount || 0)
    + (opts.spotAdj || 0);
}

// 수율 차익 = P_m × (1 − r) × ( 1/y_a − 1/y_r )   ← 플레이어 실력이 돈이 되는 유일한 레버
function yieldGainPerTon(pm, scrapRate, assumedYield, actualYield) {
  return pm * (1 - scrapRate) * (1 / assumedYield - 1 / actualYield);
}

/* ---------- 초기 상태 ---------- */

function createInitialState(opt = {}) {
  const lines = (opt.lines || ['SLIT', 'LEVEL']).map((t, i) => ({
    id: `L${i + 1}`, type: t, cap: CFG.LINE[t].cap, capex: CFG.LINE[t].capex,
  }));
  const machineCost = lines.reduce((a, l) => a + l.capex, 0);
  const equity = opt.equity ?? CFG.START_EQUITY;

  const st = {
    turn: 1,
    over: false, overReason: null,
    country: opt.country || 'MX',
    companyName: opt.companyName || '무제 코일센터',

    cash: equity - CFG.INFRA_TOTAL - machineCost,
    invRaw: [],          // {qty, unitCost, arrivalTurn, dt}  dt = 'FIRM'|'SPOT'
    invFg: [],           // {proc, qty, unitCost, dt, ya, ra, yActual}
    poOpen: [],          // {qty, unitPriceFixed, etaTurn, dt}
    ar: [],              // {amount, dueTurn}
    ap: [],              // {amount, dueTurn}

    lines,
    fa: { land: CFG.LAND, buildingCost: CFG.BUILDING, buildingNbv: CFG.BUILDING,
          machineCost, machineAccDep: 0 },
    debt: { principal: 0, limit: opt.debtLimit ?? CFG.CREDIT_LINE_BASE,
            facility: [] },      // 시설자금 — {bal, left} 분할상환 중인 건들
    equity,
    paidIn: equity,

    morale: 70, trust: 65, lossStreak: 0,
    myShare: opt.myShare ?? 0.10,
    effortQueue: [],     // 영업 투자 지연 큐

    market: { pm: CFG.P_M_BASE, phase: chapterOf(1).phase, hqRate: 0.065, scrapRate: CFG.SCRAP_RATE },
    hq: { cumMaterialTons: 0, cumHqMargin: 0, cumConsolidated: 0 },

    nasi: [],
    buildQueue: [],          // {kind:'LINE'|'HALL'|'YARD', ...} — 돈은 나갔고 아직 안 도는 것
    hqSpotCredit: 0,
    buildings: 1,
    yardCap: CFG.WAREHOUSE_CAP_BASE,
    history: [],
    rng: opt.seed ?? 12345,
  };

  /* 돌아가던 회사를 넘겨받는다.
     창고의 소재와 아직 못 받은 대금은 그냥 생기는 게 아니라 운전자금 차입으로
     받쳐져 있다. 그래서 차입잔액을 그만큼 얹어 대차를 맞춘다.
       자산  고정자산 22,000 + 재고 + 매출채권 + 현금 3,000
       부채  차입(= 재고 + 매출채권) + 자본금 25,000 */
  const openCost = CFG.P_M_BASE * CFG.GRADE.PREMIUM.pmMult;
  st.invRaw.push({ qty: CFG.OPEN_STOCK_TON, unitCost: openCost,
                   arrivalTurn: 1, dt: 'FIRM', gr: 'PREMIUM' });
  const openTons = DEMAND_BASE.C2C + DEMAND_BASE.SLIT + DEMAND_BASE.LEVEL;
  const openMonthly = openTons * CFG.RAMP_START * 0.9 * (openCost / CFG.YIELD.SLIT + CFG.COIL_MARGIN);
  for (let i = 1; i <= CFG.OPEN_AR_MONTHS; i++)
    st.ar.push({ amount: openMonthly, dueTurn: i });
  st.debt.principal = CFG.OPEN_STOCK_TON * openCost + openMonthly * CFG.OPEN_AR_MONTHS;

  // 내시는 몇 달 앞까지 미리 받아둔다. 센터장은 첫날부터 이 숫자를 보고 발주를 건다.
  const rng = makeRng((opt.seed ?? 12345) + 104729);
  for (let i = 0; i < CFG.NASI_LEAD; i++) st.nasi.push(makeNasi(st, st.turn + i, rng));
  return st;
}

/* ---------- 파생값 ---------- */

/* ---------- 이번 달 슬리팅 배분 ----------
   코일센터에서만 나오는 결정이다. 원코일 폭은 정해져 있고, 고객이 달라는 폭은 제각각이다.
   몇 조각으로 어떻게 나누느냐에 따라 잔폭(트림)이 달라지고, 그게 그대로 수율이 된다.
   같은 판가, 같은 소재값인데 여기서 이익이 갈린다. */
const COIL_WIDTH = 1219;   // 열연 표준 폭 (mm)

function trimOptions(rng) {
  // 이번 달 고객이 달라는 폭 세 가지 [가정]
  const menu = [
    [340, 285, 190], [420, 300, 215], [365, 250, 160],
    [480, 320, 175], [395, 275, 230], [310, 265, 205],
  ];
  const w = menu[Math.floor(rng() * menu.length)];
  const combos = [];
  for (let a = 0; a <= 3; a++) for (let b = 0; b <= 4; b++) for (let c = 0; c <= 6; c++) {
    if (a + b + c === 0) continue;
    const used = a * w[0] + b * w[1] + c * w[2];
    if (used > COIL_WIDTH) continue;
    combos.push({ a, b, c, used, yield: used / COIL_WIDTH });
  }
  combos.sort((x, y) => y.yield - x.yield);
  // 제일 좋은 것, 중간, 나쁜 것 — 셋을 보여준다
  const best = combos[0];
  const mid = combos.find(c => c.yield < best.yield - 0.03) || combos[1];
  const bad = combos.find(c => c.yield < (mid ? mid.yield : 1) - 0.05) || combos[combos.length - 1];
  const pick = [best, mid, bad].filter(Boolean);
  return { widths: w, options: pick.map(o => ({
    cuts: [o.a, o.b, o.c], used: o.used, trim: COIL_WIDTH - o.used, yield: o.yield })) };
}

// 지금이 4년 중 어느 장면인가
function chapterOf(turn) {
  for (const c of CFG.SCENARIO) if (turn <= c.to) return c;
  return CFG.SCENARIO[CFG.SCENARIO.length - 1];
}

/* 재고를 나이별로 갈라 본다. 톤수만 보면 장기재고가 안 보인다.
   같은 18,000톤이라도 전부 한 달짜리인 것과 절반이 열 달짜리인 것은 다른 회사다. */
function inventoryAging(state) {
  const buckets = [
    { label: '1개월 이내', max: 1, qty: 0, cost: 0 },
    { label: '1~3개월',   max: 3, qty: 0, cost: 0 },
    { label: '3~6개월',   max: 6, qty: 0, cost: 0 },
    { label: '6개월 이상', max: 999, qty: 0, cost: 0 },
  ];
  for (const pool of [state.invRaw, state.invFg]) for (const l of pool) {
    const age = state.turn - (l.arrivalTurn ?? l.madeTurn ?? state.turn);
    const b = buckets.find(x => age <= x.max) || buckets[3];
    b.qty += l.qty; b.cost += l.qty * l.unitCost;
  }
  return buckets;
}

/* 장기재고 — 들어온 지 석 달이 넘은 물건. 열화가 시작되는 경계와 같은 선이다.
   총재고만 보면 안 보인다. 이 숫자가 늘면 회사가 물건을 못 팔고 있다는 뜻이다. */
function longInventoryTons(state) {
  let t = 0;
  for (const pool of [state.invRaw, state.invFg]) for (const l of pool) {
    const age = state.turn - (l.arrivalTurn ?? l.madeTurn ?? state.turn);
    if (age > CFG.DEGRADE_FREE_TURNS) t += l.qty;
  }
  return t;
}

// 받을 돈과, 그중 약속한 날을 넘긴 돈
function receivables(state) {
  let total = 0, late = 0;
  for (const a of state.ar) { total += a.amount; if (a.late) late += a.amount; }
  return { total, late };
}

/* 공장동 한 동에 라인 MAX_LINES대. 동을 더 올리면 자리도 그만큼 늘어난다. */
function bayLimit(state) { return (state.buildings || 1) * CFG.MAX_LINES; }
function facilityBalance(state) {
  return (state.debt.facility || []).reduce((a, f) => a + f.bal, 0);
}
/* 투자비를 조달한다. 8할은 시설자금, 2할은 우리 돈. */
function fundCapex(state, capex) {
  const loan = capex * CFG.FACILITY_SHARE;
  state.debt.facility = state.debt.facility || [];
  state.debt.facility.push({ bal: loan, left: CFG.FACILITY_TERM_M });
  state.cash -= capex - loan;
  return loan;
}
function yardCapOf(state) { return state.yardCap || CFG.WAREHOUSE_CAP_BASE; }
function cipValue(state) {
  return (state.buildQueue || []).reduce((a, b) => a + (b.capex || 0), 0);
}

function capacityOf(state) {
  const cap = { SLIT: 0, LEVEL: 0, BLANK: 0 };
  for (const l of state.lines) cap[l.type] += l.cap;
  return cap;
}

/* 기저 수요 (실무자 확인) — 연 25만톤 코일센터.
     가공  슬리터 연 10만톤 + 레벨러 연 5만톤 = 연 15만톤 (설비 캐파가 상한)
     통코일 연 10만톤 — 라인을 안 쓰므로 캐파 상한이 없다
   통코일이 판매의 40%다. 마진은 코일마진 톤당 $18뿐이라 얇지만, 가공을 안 하니
   변동비도 $3뿐이고 수율 손실이 없다. 대신 소재는 똑같이 사와야 하므로
   자금은 가공품과 똑같이 묶인다 — 물량의 절반이 여기 있다는 사실이
   이 회사의 운전자금 규모를 정한다.
   이 값이 게임의 생명선이다. 너무 크면 증설이 무조건 정답이 되어 게임이 죽고,
   너무 작으면 첫 판부터 재고가 쌓여 초보가 무조건 부도난다.
   블랭킹(TRAP/DIE) 연 5만톤은 라인을 놓기 전에는 우리 앞에 오지 않는 수요다.
   안 하던 장사를 여는 것이므로 연 25만톤 밖에 있다 — 증설의 보상이 이것이다. */
const DEMAND_BASE = { C2C: 9800, SLIT: 10600, LEVEL: 5300, TRAP: 2200, DIE: 2000 };

/* 설비가 없으면 그 수요는 애초에 우리 앞에 오지 않는다.
   블랭킹 라인이 없는 코일센터에 블랭킹 내시를 줄 리가 없다.
   이걸 구분하지 않으면 못 만드는 물량까지 "못 쳐낸 내시"로 잡혀 수행률이 눌린다.
   반대로 라인을 넣는 순간 없던 시장이 열린다 — 증설의 진짜 보상이 이것이다. */
function procAvailable(state, proc) {
  if (proc === 'C2C') return true;                       // 통코일 장사는 라인이 필요 없다
  if (proc === 'SLIT' || proc === 'LEVEL') return state.lines.some(l => l.type === proc);
  return state.lines.some(l => l.type === 'BLANK');      // TRAP / DIE
}

function marketDemand(state) {
  const p = CFG.PHASE[state.market.phase];
  const trustCoef = 0.5 + state.trust / 200;
  const out = {};
  for (const k of PROC_LIST) {
    out[k] = procAvailable(state, k)
      ? Math.round(DEMAND_BASE[k] * p.mkt * (state.myShare / 0.10) * trustCoef) : 0;
  }
  return out;
}

/* 내시(內示) — 자동차강판의 월별 확정 물량.
   실무자 확인: 자동차강판은 물량이 매번 안정적이고 내시량을 미리 받아서 예측이 쉽다.
   그래서 이 게임에서 자동차강판 수요는 몇 달 앞까지 플레이어에게 공개된다.
   3개월(미착 포함)이라는 얇은 재고로 회사가 돌아가는 진짜 이유가 이것이다 —
   물량의 70%가 예측이 아니라 확정이면 안전재고를 두껍게 들 필요가 없다.
   반대로 일반재 수요는 그 달이 되어야 알 수 있고, 남는 캐파는 그걸로 메워야 한다. */
/* 본사도 바보가 아니다. 코일센터가 못 소화할 물량을 내시로 주지 않는다.
   그래서 내시량은 그 시점의 캐파에 묶인다 — 이게 증설의 진짜 보상이다.
   라인을 늘리면 내시가 따라 늘고, 안 늘리면 시장이 아무리 커도 내시는 캐파에서 멈춘다.
   다만 이미 나간 내시는 그대로이므로, 증설 효과가 물량으로 돌아오는 데 몇 달이 걸린다. */
function nasiCeiling(state) {
  const c = capacityOf(state);
  const m = CFG.NASI_CAP_MULT;
  return {
    C2C:   Infinity,                                   // 통코일은 라인을 안 쓴다
    SLIT:  c.SLIT * m,
    LEVEL: c.LEVEL * m,
    TRAP:  (c.BLANK / 2) * m,
    DIE:   (c.BLANK / 2) * m,
  };
}

/* 부임 직후에는 물량이 작다. 영업으로 키워야 캐파가 찬다.
   이 곡선이 없으면 첫 달부터 월 2만톤이 쏟아져 '키운다'는 이야기가 사라진다. */
function rampOf(turn) {
  return Math.min(1, CFG.RAMP_START + (1 - CFG.RAMP_START) * (turn - 1) / CFG.RAMP_TURNS);
}

function makeNasi(state, turn, rng) {
  const p = CFG.PHASE[state.market.phase];
  const trustCoef = 0.5 + state.trust / 200;
  const ceil = nasiCeiling(state);
  const tons = {}, potential = {};
  for (const k of PROC_LIST) {
    if (!procAvailable(state, k)) { tons[k] = 0; potential[k] = 0; continue; }
    const v = DEMAND_BASE[k] * CFG.PREMIUM_DEMAND_SHARE * p.mkt * rampOf(turn)
            * (state.myShare / 0.10) * trustCoef * (1 + CFG.DEMAND_NOISE_AUTO * gauss(rng));
    potential[k] = Math.max(0, Math.round(v));          // 본사가 주고 싶어 하는 양
    tons[k] = Math.max(0, Math.round(Math.min(v, ceil[k])));  // 우리 캐파가 받을 수 있는 양
  }
  /* 같은 물량도 어느 산업군에서 오느냐가 매달 다르다. 가전은 들쭉날쭉하고
     자동차는 안정적이다. 이 구성이 흔들리는 것이 배분 결정을 매달 다르게 만든다. */
  const seg = {};
  for (const k of CFG.SEG_LIST) {
    const S = CFG.SEGMENT[k];
    seg[k] = {};
    for (const q of PROC_LIST)
      seg[k][q] = Math.max(0, tons[q] * S.base * (1 + S.noise * gauss(rng)));
  }
  // 둘의 차이가 곧 "지금 증설하면 더 받을 수 있는 물량"이다. 이게 증설 신호다.
  return { turn, tons, potential, seg };
}

/* 유통향에는 "시장 수요"라는 게 따로 없다. 본사가 푼 물량이 곧 팔 수 있는 물량이고,
   그것도 전체 판매의 15%까지다. 그래서 여기서는 손에 쥔 일반재를 그대로 내놓고,
   실제 제동은 아래 commonBudget이 건다. */
function commonDemandNow(state) {
  const out = {};
  for (const k of PROC_LIST) {
    out[k] = state.invFg
      .filter(l => l.proc === k && l.gr !== 'PREMIUM')
      .reduce((a, l) => a + l.qty, 0);
  }
  return out;
}

function inventoryTons(state, dt) {
  const f = l => (dt ? l.dt === dt : true);
  return state.invRaw.filter(f).reduce((a, l) => a + l.qty, 0)
       + state.invFg.filter(f).reduce((a, l) => a + l.qty, 0);
}
function openPoTons(state, dt) {
  return state.poOpen.filter(p => !dt || p.dt === dt).reduce((a, p) => a + p.qty, 0);
}
// 현물 노출액: 소재가 하락 시 그대로 손실이 되는 금액 (v3 §3-2)
function spotExposure(state) {
  return (inventoryTons(state, 'SPOT') + openPoTons(state, 'SPOT')) * state.market.pm;
}

function effectiveYield(base, morale) {
  return base - Math.max(0, 70 - morale) * 0.0004;
}

/* ---------- FIFO 출고 ---------- */

// FIRM/SPOT × 일반재/고급강 조합별로 쪼개서 돌려준다.
// 태그가 여기서 끊기면 α 슬라이더가 죽고, 강종이 끊기면 고급강이 공짜가 된다.
const TAG_KEYS = ['FIRM|COMMON', 'FIRM|PREMIUM', 'SPOT|COMMON', 'SPOT|PREMIUM'];
function lotKey(lot) {
  const dt = lot.dt === 'SPOT' ? 'SPOT' : 'FIRM';
  const gr = lot.gr === 'PREMIUM' ? 'PREMIUM' : 'COMMON';
  return `${dt}|${gr}`;
}
function drawFifo(pool, qty, filter) {
  let need = qty, cost = 0, taken = 0;
  const byTag = {};
  for (const k of TAG_KEYS) byTag[k] = { qty: 0, cost: 0 };
  const lots = filter ? pool.filter(filter) : pool;
  for (const lot of lots) {
    if (need <= 1e-9) break;
    const t = Math.min(lot.qty, need);
    const c = t * lot.unitCost;
    cost += c; taken += t; lot.qty -= t; need -= t;
    const k = lotKey(lot);
    byTag[k].qty += t; byTag[k].cost += c;
  }
  for (let i = pool.length - 1; i >= 0; i--) if (pool[i].qty <= 1e-9) pool.splice(i, 1);
  return { taken, cost, byTag };
}

function mergeDraw(a, b) {
  const out = {};
  for (const k of TAG_KEYS) out[k] = { qty: a.byTag[k].qty + b.byTag[k].qty, cost: a.byTag[k].cost + b.byTag[k].cost };
  return out;
}

/* ============================================================
   턴 결산 (v3 §5-2, 19단계)
   decision = {
     buy:  { totalTon, alpha },
     run:  { SLIT, LEVEL, TRAP, DIE },       // 투입톤
     sell: { C2C, SLIT, LEVEL, TRAP, DIE },  // 판매 희망톤
     invest: { addLine, salesEffort, yieldProgram },
     options: { overtime, discount }
   }
   ============================================================ */

function resolveTurn(state, decision) {
  const s = structuredClone(state);
  const rng = makeRng(s.rng + s.turn * 7919);
  s.rng = Math.floor(rng() * 1e9);

  const d = {
    buy:     { totalTon: 0, alpha: 0.7, beta: 0, hqSpotTon: 0, ...(decision.buy || {}) },
    run:     { SLIT: 0, LEVEL: 0, TRAP: 0, DIE: 0, ...(decision.run || {}) },
    sell:    { C2C: 0, SLIT: 0, LEVEL: 0, TRAP: 0, DIE: 0, ...(decision.sell || {}) },
    invest:  { addLine: null, newBuilding: false, salesEffort: 0, yieldProgram: 0, ...(decision.invest || {}) },
    options: { overtime: false, discount: 0, trimYield: 0, ...(decision.options || {}) },
  };

  const log = [];
  const flags = [];

  /* STEP 0·1은 턴 끝으로 옮겼다 (아래 STEP 20).
     사장은 이번 달 시황과 시세를 보고 결정한다. 결정한 뒤에 시황이 바뀌면
     "불황이니 본사 지시를 받겠다"고 누른 결재가 통상 달에 떨어지는 일이 생긴다.
     그건 게임이 아니라 함정이다. */
  const pm = s.market.pm;
  const scrapPrice = pm * s.market.scrapRate;
  const hqPerTon = pm * s.market.hqRate;

  /* STEP 2. 수요 갱신 — 영업 투자는 3턴 뒤에 효과 */
  {
    s.effortQueue = s.effortQueue.filter(e => { e.turnsLeft--; return true; });
    let gain = 0;
    s.effortQueue = s.effortQueue.filter(e => {
      if (e.turnsLeft <= 0) { gain += e.amount / 100_000 * CFG.SALES_EFFORT_GAIN; return false; }
      return true;
    });
    // 신뢰 효과는 비례식으로 건다. 절대값에 더하면 한두 턴 만에 시장이 사라진다.
    s.myShare *= 1 + (s.trust - 60) * CFG.TRUST_SHARE_COEF;
    s.myShare += gain;
    s.myShare = Math.max(0.02, Math.min(0.60, s.myShare));
    if (gain > 0) log.push(`영업 투자 효과가 나타났습니다. 점유율 +${(gain * 100).toFixed(2)}%p`);
  }
  /* 이번 달 자동차강판 물량은 이미 몇 달 전에 내시로 받아둔 확정 물량이다.
     일반재 물량은 지금 처음 드러난다. 남는 캐파를 그걸로 메울지가 이 게임의 결정이다. */
  let nasiNow = s.nasi.find(n => n.turn === s.turn);
  if (!nasiNow) nasiNow = makeNasi(s, s.turn, rng);
  s.nasi = s.nasi.filter(n => n.turn > s.turn);
  while (s.nasi.length < CFG.NASI_LEAD) {
    const t = s.turn + s.nasi.length + 1;
    s.nasi.push(makeNasi(s, t, rng));
  }
  const demandAuto = nasiNow.tons;
  const demandCommon = commonDemandNow(s);
  const demand = {};
  for (const k of PROC_LIST) demand[k] = demandAuto[k] + demandCommon[k];

  /* STEP 3. 투자 집행 — 설비 · 공장동 · 야드.
     설비는 돈을 낸다고 그 달에 도는 게 아니다. 발주·제작·선적·설치·시운전에 넉 달,
     건물은 여덟 달이다. 호황을 보고 지르면 도착했을 때 호황이 끝나 있다.
     그래서 증설은 지금 숫자가 아니라 넉 달 뒤 숫자를 보고 거는 결정이다. */
  if (d.invest.order) {
    const o = d.invest.order;
    const q = (s.buildQueue = s.buildQueue || []);
    const won = v => Math.round(v / 1000).toLocaleString('en-US');
    if (o.kind === 'LINE') {
      const queued = q.filter(b => b.kind === 'LINE').length;
      const bays = bayLimit(s) + q.filter(b => b.kind === 'HALL').length * CFG.MAX_LINES;
      if (s.lines.length + queued >= bays) {
        flags.push(`공장동 한 동은 라인 ${CFG.MAX_LINES}대가 한계입니다. 동을 먼저 올려야 합니다.`);
      } else {
        const capex = CFG.LINE[o.type].capex;
        const loan = fundCapex(s, capex);
        q.push({ kind: 'LINE', type: o.type, capex, readyTurn: s.turn + CFG.INSTALL_TURNS });
        log.push(`${CFG.LINE[o.type].label} 1기를 발주했습니다. ${won(capex)}천U$ 중 `
               + `${won(loan)}천U$는 본사 보증 시설자금으로 5년에 걸쳐 갚습니다. `
               + `${ymLabel(s.turn + CFG.INSTALL_TURNS)}부터 돕니다.`);
      }
    } else if (o.kind === 'HALL') {
      const loan = fundCapex(s, CFG.INFRA_TOTAL);
      s.fa.land += CFG.LAND;                     // 땅은 사는 즉시 우리 것이고 감가도 안 된다
      q.push({ kind: 'HALL', capex: CFG.BUILDING, readyTurn: s.turn + CFG.HALL_TURNS });
      log.push(`공장동을 한 동 더 올립니다. 토지·건물 ${won(CFG.INFRA_TOTAL)}천U$ 중 `
             + `${won(loan)}천U$는 시설자금입니다. 준공은 ${ymLabel(s.turn + CFG.HALL_TURNS)}, `
             + `원리금은 그 전달부터 나갑니다.`);
    } else if (o.kind === 'YARD') {
      fundCapex(s, CFG.YARD.capex);
      q.push({ kind: 'YARD', capex: CFG.YARD.capex, readyTurn: s.turn + CFG.YARD.turns });
      log.push(`야드를 ${CFG.YARD.add.toLocaleString('en-US')}톤 넓힙니다. ${won(CFG.YARD.capex)}천U$ · `
             + `${ymLabel(s.turn + CFG.YARD.turns)} 완공.`);
    }
  }
  if (d.invest.salesEffort > 0) {
    s.cash -= d.invest.salesEffort;
    s.effortQueue.push({ amount: d.invest.salesEffort, turnsLeft: CFG.SALES_EFFORT_LAG });
  }
  let yieldBonus = 0;
  if (d.invest.yieldProgram > 0) {
    s.cash -= d.invest.yieldProgram;
    yieldBonus = Math.min(0.02, d.invest.yieldProgram / 100_000 * 0.004);
  }

  /* STEP 4. 발주 입고 (입고와 지급은 분리 — 90일 시차가 이 게임의 긴장감) */
  {
    const arrived = s.poOpen.filter(p => p.etaTurn <= s.turn);
    s.poOpen = s.poOpen.filter(p => p.etaTurn > s.turn);
    for (const p of arrived) {
      s.invRaw.push({ qty: p.qty, unitCost: p.unitPriceFixed, arrivalTurn: s.turn, dt: p.dt, gr: p.gr || 'COMMON' });
      s.ap.push({ amount: p.qty * p.unitPriceFixed, dueTurn: s.turn + CFG.DPO_TURNS });
    }
    if (arrived.length) log.push(`소재 ${Math.round(arrived.reduce((a, p) => a + p.qty, 0)).toLocaleString()}톤이 입고되었습니다.`);
  }

  /* STEP 5. 신규 발주 (가격은 발주 시점 확정 — 미착분도 가격 리스크 보유)
     고급강은 소재가가 비싸고 제조공기가 2개월 더 걸린다. 주문하는 순간 5개월을 기다려야 한다. */
  const cap0 = capacityOf(s);
  let lcFee = 0, hqSpotOffer = 0;
  if (d.buy.totalTon > 0) {
    const beta = Math.max(0, Math.min(1, d.buy.beta || 0));
    const alpha = Math.max(0, Math.min(1, d.buy.alpha));
    for (const gr of ['COMMON', 'PREMIUM']) {
      const g = CFG.GRADE[gr];
      const gTon = d.buy.totalTon * (gr === 'PREMIUM' ? beta : 1 - beta);
      if (gTon <= 0.01) continue;
      const price = pm * g.pmMult;
      // 자동차강판은 고객 전용 규격이라 현물로 쟁여둘 수가 없다. 전량 실수요다.
      // 그래서 α(실수요 비율)는 일반재 안에서만 의미를 갖는다.
      const aEff = gr === 'PREMIUM' ? 1 : alpha;
      for (const [qty, dt] of [[gTon * aEff, 'FIRM'], [gTon * (1 - aEff), 'SPOT']]) {
        if (qty <= 0.01) continue;
        s.poOpen.push({
          qty, unitPriceFixed: price, dt, gr,
          etaTurn: s.turn + CFG.LEAD_TURNS + g.leadAdd,
        });
      }
      lcFee += gTon * price * CFG.LC_FEE_RATE;
    }
  }

  /* STEP 5b. 불황기 본사 지시 스팟 — 싸게 주는 대신 재고 리스크는 전부 이쪽이 진다 */
  let hqSpotTon = 0;
  if (CFG.HQ_SPOT.phases.includes(s.market.phase)) {
    const capTon = (cap0.SLIT + cap0.LEVEL + cap0.BLANK) * CFG.HQ_SPOT.capShareOfCap;
    hqSpotOffer = capTon;
    hqSpotTon = Math.max(0, Math.min(d.buy.hqSpotTon || 0, capTon));
    if (hqSpotTon > 0.01) {
      const price = pm * (1 - CFG.HQ_SPOT.discount);
      s.poOpen.push({ qty: hqSpotTon, unitPriceFixed: price, dt: 'SPOT', gr: 'COMMON',
                      src: 'HQ', etaTurn: s.turn + CFG.LEAD_TURNS });
      lcFee += hqSpotTon * price * CFG.LC_FEE_RATE;
      s.trust += 1;
      s.hqSpotCredit = (s.hqSpotCredit || 0) + hqSpotTon;   // 본사가 민 물량은 팔 권한도 같이 준다
      log.push(`본사 지시 유통향 스팟 ${Math.round(hqSpotTon).toLocaleString()}톤을 시세보다 ${(CFG.HQ_SPOT.discount * 100).toFixed(0)}% 싸게 받았습니다.`);
    } else if (hqSpotOffer > 0) {
      s.trust -= CFG.HQ_SPOT.refuseTrustCost;
      flags.push('본사 가동 물량 지시를 받지 않았습니다. 본사와의 관계가 상합니다.');
    }
  }

  /* STEP 5b. 창고 정체 — 재고가 야드를 넘치면 동선이 막혀 가동이 떨어지고 외부창고비가 붙는다 */
  const stockNow = inventoryTons(s);
  const whCap = yardCapOf(s);
  const overTons = Math.max(0, stockNow - whCap);
  let congestionPenalty = 0;
  if (overTons > 0) {
    congestionPenalty = CFG.WAREHOUSE_OVER_CAP_PENALTY;
    flags.push(`재고가 야드 한도를 ${Math.round(overTons).toLocaleString()}톤 넘겼습니다. 동선이 막혀 가동이 떨어집니다.`);
  }

  /* STEP 6. 캐파 검증 */
  const cap = capacityOf(s);
  const mult = (d.options.overtime ? CFG.OT_CAP_MULT : 1) * (1 - congestionPenalty);
  const used = { SLIT: d.run.SLIT, LEVEL: d.run.LEVEL, BLANK: d.run.TRAP + d.run.DIE };
  for (const k of ['SLIT', 'LEVEL', 'BLANK']) {
    const limit = cap[k] * mult;
    if (used[k] > limit + 1e-6) {
      const ratio = limit / used[k];
      if (k === 'BLANK') { d.run.TRAP *= ratio; d.run.DIE *= ratio; }
      else d.run[k] *= ratio;
      flags.push(`${CFG.LINE[k].label} 캐파를 넘겨 가동을 ${Math.round((1 - ratio) * 100)}% 줄였습니다.`);
    }
  }
  if (d.options.overtime) s.morale -= 5;

  /* STEP 7. 소재 출고 (FIFO, FIRM/SPOT 태그 승계) */
  const needTon = d.run.SLIT + d.run.LEVEL + d.run.TRAP + d.run.DIE + d.sell.C2C;
  const rawAvail = s.invRaw.reduce((a, l) => a + l.qty, 0);
  let shortRatio = 1;
  if (needTon > rawAvail + 1e-6) {
    shortRatio = rawAvail / Math.max(needTon, 1e-9);
    for (const k of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) d.run[k] *= shortRatio;
    d.sell.C2C *= shortRatio;
    flags.push(rawAvail < 1 && s.turn <= CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd
      ? '첫 배가 아직 도착하지 않았습니다. 라인은 아직 돌지 않습니다.'
      : '소재가 부족해 가동을 줄였습니다.');
  }

  /* STEP 8. 생산 */
  let scrapTon = 0;
  const produced = {};
  for (const proc of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) {
    const input = d.run[proc];
    if (input <= 0.01) continue;
    /* 슬리팅은 이번 달 배분이 수율을 정한다. 상정 수율(고객과 약속한 98%)보다
       잘 자르면 그 차익이 우리 몫이고, 못 자르면 우리가 문다. */
    const yBase = (proc === 'SLIT' && d.options.trimYield)
      ? d.options.trimYield + yieldBonus
      : CFG.YIELD[proc] + yieldBonus;
    const yEff = Math.min(0.995, effectiveYield(yBase, s.morale));
    // 생산은 수주 잔고에 맞춰 짠다. 창고 앞줄에 있는 코일부터 무작정 태우면
    // 고급강이 2개월 늦게 들어오는 탓에 어떤 달은 고급강만, 어떤 달은 일반재만 나온다.
    // 생산 배분은 창고에 있는 소재의 강종 구성을 따른다
    const rawP = s.invRaw.filter(l => l.gr === 'PREMIUM').reduce((a, l) => a + l.qty, 0);
    const rawAll = s.invRaw.reduce((a, l) => a + l.qty, 0);
    const autoShare = rawAll > 0 ? rawP / rawAll : 1;
    const byTag = mergeDraw(
      drawFifo(s.invRaw, input * (1 - autoShare), l => l.gr !== 'PREMIUM'),
      drawFifo(s.invRaw, input * autoShare, l => l.gr === 'PREMIUM'));
    let taken = TAG_KEYS.reduce((a, k) => a + byTag[k].qty, 0);
    if (taken < input - 1e-6) {   // 한쪽 강종이 바닥나면 남은 강종으로 채운다
      const fill = drawFifo(s.invRaw, input - taken);
      for (const k of TAG_KEYS) { byTag[k].qty += fill.byTag[k].qty; byTag[k].cost += fill.byTag[k].cost; }
      taken = TAG_KEYS.reduce((a, k) => a + byTag[k].qty, 0);
    }
    if (taken <= 1e-9) continue;
    scrapTon += taken * (1 - yEff);
    // 태그·강종별로 제품 lot을 따로 만든다. 섞으면 가격 리스크와 강종 마진 귀속이 틀어진다.
    for (const k of TAG_KEYS) {
      const b = byTag[k];
      if (b.qty <= 1e-9) continue;
      const [tag, gr] = k.split('|');
      const out = b.qty * yEff;
      s.invFg.push({
        proc, qty: out, unitCost: b.cost / out, dt: tag, gr, madeTurn: s.turn,
        ya: CFG.YIELD[proc], ra: s.market.scrapRate, yActual: yEff,
      });
    }
    produced[proc] = (produced[proc] || 0) + taken * yEff;
  }
  /* STEP 8b. 코일 투 코일 (라인 미사용, 수율 100%) */
  if (d.sell.C2C > 0.01) {
    const { taken, byTag } = drawFifo(s.invRaw, d.sell.C2C);
    if (taken > 1e-9) {
      for (const k of TAG_KEYS) {
        const b = byTag[k];
        if (b.qty <= 1e-9) continue;
        const [tag, gr] = k.split('|');
        s.invFg.push({ proc: 'C2C', qty: b.qty, unitCost: b.cost / b.qty, dt: tag, gr, madeTurn: s.turn, ya: 1, ra: 0, yActual: 1 });
      }
      produced.C2C = taken;
    }
  }

  /* STEP 9~10. 판매 — 산업군별로 배분한다.
     물건이 모자라면 센터장이 정한 우선순위대로 채운다. 뒤로 밀린 곳은 결품이 나고,
     결품을 낸 고객은 돌아오지 않는다. 산업군마다 판가도 회수기간도 다르므로,
     같은 톤을 팔아도 어디에 파느냐에 따라 이익과 자금이 갈린다. */
  let revenue = 0, cogs = 0, yieldGainTotal = 0, shippedTotal = 0;
  const shortageEvents = [];
  const shipped = {};
  const shippedSeg = {};
  for (const q of PROC_LIST) shipped[q] = 0;
  for (const k of CFG.SEG_LIST) shippedSeg[k] = 0;
  let autoShippedTurn = 0, commonShippedTurn = 0;
  const autoDemandTurn = PROC_LIST.reduce((a2, k) => a2 + demandAuto[k], 0);
  const segNow = nasiNow.seg || {};
  const segWant = {}, segGot = {};

  /* 유통(일반유통)은 전체 판매의 15%까지만 나간다. 그 한도를 알려면 실수요가
     얼마나 나갈지를 먼저 어림잡아야 하므로, 본사 소재 쪽 계획량을 한 번 훑는다. */
  let firmPlan = 0;
  for (const k of CFG.SEG_LIST) {
    if (CFG.SEGMENT[k].gr !== 'PREMIUM') continue;
    for (const q of PROC_LIST) {
      const avail = s.invFg.filter(l => l.proc === q && l.gr === 'PREMIUM').reduce((x, l) => x + l.qty, 0);
      firmPlan += Math.min((segNow[k] && segNow[k][q]) || 0, avail, d.sell[q] || 0);
    }
  }
  let distBudget = firmPlan * CFG.COMMON_SALES_CAP / (1 - CFG.COMMON_SALES_CAP);

  // 센터장이 정한 배분 우선순위. 안 정했으면 자동차부터.
  const order = (d.options.segPriority && d.options.segPriority.length)
    ? d.options.segPriority : CFG.SEG_LIST;

  for (const segKey of order) {
    const S = CFG.SEGMENT[segKey];
    if (!S) continue;
    for (const proc of PROC_LIST) {
      let want = Math.min((segNow[segKey] && segNow[segKey][proc]) || 0, d.sell[proc] || Infinity);
      if (S.gr === 'COMMON') { want = Math.min(want, distBudget); }
      if (want <= 0.01) continue;

      const pool = s.invFg.filter(l => l.proc === proc && (l.gr || 'COMMON') === S.gr);
      let need = Math.min(want, pool.reduce((x, l) => x + l.qty, 0));
      const got = need;
      let segRevenue = 0;

      for (const lot of pool) {
        if (need <= 1e-9) break;
        const t = Math.min(lot.qty, need);
        const isSpot = lot.dt === 'SPOT';
        const pmRef = isSpot ? pm * CFG.GRADE[S.gr].pmMult : lot.unitCost * CFG.YIELD[proc];
        const price = unitPrice(proc, pmRef, lot.ya, lot.ra, {
          discount: d.options.discount,
          gradeMargin: S.marginAdd,                       // 산업군이 값을 정한다
          spotAdj: isSpot ? CFG.SPOT_MARGIN_ADJ : 0,
        });
        segRevenue += t * price;
        cogs += t * lot.unitCost;
        if (proc !== 'C2C') yieldGainTotal += yieldGainPerTon(pmRef, lot.ra, lot.ya, lot.yActual) * t;
        lot.qty -= t; need -= t;
      }
      for (let i = s.invFg.length - 1; i >= 0; i--) if (s.invFg[i].qty <= 1e-9) s.invFg.splice(i, 1);

      if (got <= 1e-9) continue;
      revenue += segRevenue;
      // 회수기간도 산업군이 정한다. 건재는 넉 달, 가전은 한 달.
      s.ar.push({ amount: segRevenue, dueTurn: s.turn + S.dso, seg: segKey });
      shipped[proc] += got;
      shippedSeg[segKey] += got;
      shippedTotal += got;
      if (S.gr === 'COMMON') { distBudget -= got; commonShippedTurn += got; }
      else autoShippedTurn += got;

      segWant[segKey] = (segWant[segKey] || 0) + want;
      segGot[segKey] = (segGot[segKey] || 0) + got;
    }
  }

  /* 결품은 산업군마다 한 번씩만 따진다. 제품별로 스무 번 물리면 한 달 만에
     점유율이 무너진다. 그리고 유통향은 약속한 물량이 아니라 남는 것을 파는
     자리이므로, 일반재가 없어서 못 판 것은 결품이 아니다. */
  for (const segKey of CFG.SEG_LIST) {
    const S = CFG.SEGMENT[segKey];
    if (S.gr !== 'PREMIUM') continue;
    const want = segWant[segKey] || 0, got = segGot[segKey] || 0;
    const miss = want - got;
    if (miss > want * 0.08 && s.turn > CFG.LEAD_TURNS && want > 1) {
      const sev = Math.min(1, miss / want);
      const weight = segKey === 'AUTO' ? 1 : segKey === 'APPL' ? 0.6 : 0.4;
      s.myShare *= 1 - CFG.SHORTAGE_SHARE_LOSS * sev * weight;
      s.trust -= Math.min(3, sev * 6 * weight);
      shortageEvents.push(S.label);
      flags.push(`${S.label} 쪽 ${Math.round(miss).toLocaleString()}톤을 못 채웠습니다. 그 고객은 돌아오지 않습니다.`);
    }
  }

  // 판 만큼 크레딧에서 깎는다. 본사가 푼 물량을 다 소진하면 유통 판매도 끝난다
  s.hqSpotCredit = Math.max(0, (s.hqSpotCredit || 0) - commonShippedTurn);
  const commonShareOfSales = shippedTotal > 0 ? commonShippedTurn / shippedTotal : 0;

  /* STEP 12. 스크랩 매각 */
  const scrapRevenue = scrapTon * scrapPrice;
  if (scrapRevenue > 0) s.ar.push({ amount: scrapRevenue, dueTurn: s.turn + 1 });

  /* STEP 12b. 재고 열화 — 오래 안고 있으면 녹·백청·스크래치로 상품성을 잃는다.
     현물을 "가격 오를 때까지 들고 있자"는 전략의 진짜 대가가 여기 있다. */
  let degradeLoss = 0, degradeTon = 0;
  for (const pool of [s.invRaw, s.invFg]) {
    for (const lot of pool) {
      const age = s.turn - (lot.arrivalTurn ?? lot.madeTurn ?? s.turn);
      if (age <= CFG.DEGRADE_FREE_TURNS) continue;
      const lossRate = age >= CFG.DEGRADE_DEAD_TURNS
        ? 1.0                                   // 불용재고. 스크랩으로 처분
        : CFG.DEGRADE_RATE * (age - CFG.DEGRADE_FREE_TURNS);
      const lost = lot.qty * Math.min(1, lossRate);
      if (lost <= 1e-9) continue;
      degradeTon += lost;
      degradeLoss += lost * Math.max(0, lot.unitCost - scrapPrice); // 스크랩값은 건진다
      lot.qty -= lost;
    }
  }
  for (const pool of [s.invRaw, s.invFg])
    for (let i = pool.length - 1; i >= 0; i--) if (pool[i].qty <= 1e-9) pool.splice(i, 1);
  if (degradeTon > 1) {
    s.ar.push({ amount: degradeTon * scrapPrice, dueTurn: s.turn + 1 });
    log.push(`오래된 재고 ${Math.round(degradeTon).toLocaleString()}톤이 상품성을 잃어 스크랩 처분했습니다. 손실 $${Math.round(degradeLoss).toLocaleString()}`);
  }

  /* STEP 12c. 현물 사이즈 미스매치 — 물건은 멀쩡한데 그 폭·두께가 아무에게도 안 맞는 경우.
     실무자 확인: "아예 그 사이즈가 안 팔려서 반값 이하로 팔아야 하는 리스크".
     실수요(FIRM)는 고객이 정해져 있으니 이 리스크가 없다. 현물만 문다. */
  let dumpLoss = 0, dumpTon = 0;
  for (const pool of [s.invRaw, s.invFg]) {
    for (const lot of pool) {
      if (lot.dt !== 'SPOT' || lot.qty <= 1e-9) continue;
      const age = s.turn - (lot.arrivalTurn ?? lot.madeTurn ?? s.turn);
      if (age < CFG.DUMP_AGE_TURNS) continue;
      if (rng() >= CFG.DUMP_PROB) continue;
      const recover = lot.unitCost * CFG.DUMP_PRICE_RATE;
      dumpTon += lot.qty;
      dumpLoss += lot.qty * (lot.unitCost - recover);
      s.ar.push({ amount: lot.qty * recover, dueTurn: s.turn + 1 });
      lot.qty = 0;
    }
  }
  for (const pool of [s.invRaw, s.invFg])
    for (let i = pool.length - 1; i >= 0; i--) if (pool[i].qty <= 1e-9) pool.splice(i, 1);
  if (dumpTon > 1) {
    flags.push(`현물 ${Math.round(dumpTon).toLocaleString()}톤이 사이즈가 안 맞아 반값 이하로 넘겼습니다. 손실 $${Math.round(dumpLoss).toLocaleString()}`);
  }

  /* STEP 13. 재고 저가법 평가 — SPOT에만 적용. FIRM은 절대 인식하지 않음 */
  let valuationLoss = 0;
  for (const lot of s.invRaw) {
    if (lot.dt !== 'SPOT') continue;
    if (pm < lot.unitCost) { valuationLoss += lot.qty * (lot.unitCost - pm); lot.unitCost = pm; }
  }
  for (const lot of s.invFg) {
    if (lot.dt !== 'SPOT') continue;
    const mark = pm / CFG.YIELD[lot.proc];
    if (mark < lot.unitCost) { valuationLoss += lot.qty * (lot.unitCost - mark); lot.unitCost = mark; }
  }
  // 미착 발주도 노출된다. 발주 시점에 가격이 확정되므로(A-6), 배가 오기 전에 시세가 빠지면
  // 그 손실은 이미 우리 것이다. 이걸 빼면 현물이 프리미엄만 받는 무적 전략이 된다.
  for (const po of s.poOpen) {
    if (po.dt !== 'SPOT') continue;
    if (pm < po.unitPriceFixed) {
      valuationLoss += po.qty * (po.unitPriceFixed - pm);
      po.unitPriceFixed = pm;
    }
  }
  if (valuationLoss > 0) log.push(`현물 재고에서 평가손 $${Math.round(valuationLoss).toLocaleString()}이 발생했습니다.`);

  /* STEP 14. 비용 */
  const extraLines = Math.max(0, s.lines.length - 2);
  // 증설은 감가상각만 남기는 게 아니다. 동이 늘면 관리비가, 야드가 넓어지면 운영비가 붙는다.
  const extraHalls = Math.max(0, (s.buildings || 1) - 1);
  const extraYards = Math.max(0, (yardCapOf(s) - CFG.WAREHOUSE_CAP_BASE) / CFG.YARD.add);
  const fixedCost = CFG.FC_BASE + extraLines * CFG.FC_PER_EXTRA_LINE
                  + extraHalls * CFG.HALL_FC + extraYards * CFG.YARD.fc
                  + (d.options.overtime ? CFG.OT_COST : 0);
  let varCost = 0;
  for (const proc of ['SLIT', 'LEVEL', 'TRAP', 'DIE']) varCost += d.run[proc] * CFG.VAR_COST[proc];
  varCost += (produced.C2C || 0) * CFG.VAR_COST.C2C;
  // 재고 보유 비용: 보관·보험·핸들링과 초과분 외부창고비만 여기서 받는다.
  // 묶인 자본의 금리 부담은 아래 interest(차입 이자)가 이미 받고 있다. 여기서 또 받으면 이중이다.
  const stockEnd = inventoryTons(s);
  const carryCost = stockEnd * CFG.CARRY_COST_PER_TON
                  + overTons * CFG.WAREHOUSE_OVER_COST;
  varCost += carryCost;
  const depreciation = s.fa.buildingCost / CFG.BUILDING_LIFE_M + s.fa.machineCost / CFG.MACHINE_LIFE_M;
  const interest = s.debt.principal * CFG.DEBT_RATE_MONTHLY
                 + facilityBalance(s) * CFG.FACILITY_RATE_MONTHLY;

  /* STEP 15. 채권 회수 */
  let cashIn = 0, badDebt = 0;
  const arKeep = [];
  for (const a of s.ar) {
    if (a.dueTurn > s.turn) { arKeep.push(a); continue; }
    // 약속한 날에 안 들어온 돈. 한 번 밀리면 그 채권은 계속 '지연'으로 남는다.
    // 화면 맨 위에 이 금액이 뜨는 이유가 있다 — 매출채권 전체보다 이쪽이 먼저 아프다.
    if (rng() < CFG.DELAY_RATE) {
      a.dueTurn += 1; a.late = (a.late || 0) + 1; arKeep.push(a);
    }
    else cashIn += a.amount;
  }
  s.ar = arKeep;

  /* STEP 15b. 대손 — 자동차 고객사가 아니라 가전·건설 쪽에서 몇 년에 한 번 크게 온다.
     매달 0.05%씩 떼이는 회사는 없다. 안 터지다가 어느 달 갑자기 온다. */
  if (rng() < CFG.BAD_DEBT_PROB) {
    const want = CFG.BAD_DEBT_MIN + rng() * (CFG.BAD_DEBT_MAX - CFG.BAD_DEBT_MIN);
    let need = Math.min(want, s.ar.reduce((a, x) => a + x.amount, 0));
    if (need > 1) {
      badDebt = need;
      /* 떼이는 곳은 정해져 있다. 건재가 제일 위험하고 자동차는 거의 안 난다.
         위험한 산업군의 채권부터 턴다 — 어디에 팔았는지가 여기서 청구된다. */
      s.ar.sort((x, y) => (CFG.SEGMENT[y.seg] || { risk: 1 }).risk
                        - (CFG.SEGMENT[x.seg] || { risk: 1 }).risk);
      const hit = {};
      for (const a of s.ar) {
        if (need <= 1e-9) break;
        const t = Math.min(a.amount, need);
        if (t > 1) hit[a.seg || '기타'] = (hit[a.seg || '기타'] || 0) + t;
        a.amount -= t; need -= t;
      }
      s.ar = s.ar.filter(a => a.amount > 1e-9);
      s.trust -= 2;
      const who = Object.keys(hit).map(k => (CFG.SEGMENT[k] || {}).label || '기존').join('·');
      flags.push(`${who} 쪽 고객사가 부도났습니다. 받을 돈 $${Math.round(badDebt).toLocaleString()}을 털었습니다.`);
    }
  }

  /* STEP 16. 채무 지급 */
  let cashOut = 0;
  const apKeep = [];
  for (const p of s.ap) { if (p.dueTurn <= s.turn) cashOut += p.amount; else apKeep.push(p); }
  s.ap = apKeep;

  /* STEP 16b. 차입 한도는 담보를 따라 움직인다.
     운전자본 대출은 자본금이 아니라 재고와 매출채권에 붙는다.
     그래서 장사가 커지면 한도도 같이 커지고, 재고를 털면 한도도 같이 줄어든다.
     불황에 재고가 빠지는 순간 은행 한도까지 같이 빠지는 게 진짜 무서운 지점이다. */
  {
    const base = inventoryTons(s) * pm + s.ar.reduce((a, x) => a + x.amount, 0);
    /* 장사가 커지면 본사에 얘기해 여신을 키운다 (실무자 확인).
       다만 본사가 자동으로 올려주지는 않는다 — 설득해야 한다.
       그 설득력이 곧 본사 신뢰다. 내시를 꼬박꼬박 쳐내고 불황기에 본사 물량을
       받아준 법인은 한도를 키워 받고, 결품 내고 본사 지시를 거절한 법인은
       장사가 아무리 커져도 기본 한도에 묶인다.
       성장이 곧 자금 압박인데, 그 압박을 풀 열쇠를 평소에 쌓아 두는 구조다. */
    const recent = s.history.slice(-3);
    const rev3 = recent.length ? recent.reduce((a, h) => a + h.revenue, 0) / recent.length : 0;
    const persuade = Math.max(0, Math.min(1, (s.trust - CFG.CREDIT_TRUST_FLOOR)
                                            / (CFG.CREDIT_TRUST_FULL - CFG.CREDIT_TRUST_FLOOR)));
    s.debt.limit = Math.max(CFG.CREDIT_LINE_BASE, base * CFG.BORROW_BASE_RATE,
                            rev3 * CFG.CREDIT_MONTHS_OF_SALES * persuade);
  }

  /* STEP 16c. 시설자금 원금 상환. 이자는 손익으로 가고 원금은 현금만 줄인다.
     증설의 진짜 무게가 여기 있다 — 설비는 4년 쓰는데 돈은 5년에 걸쳐 매달 나간다. */
  let facilityRepay = 0;
  if ((s.debt.facility || []).length) {
    for (const f of s.debt.facility) {
      const pay = Math.min(f.bal, f.bal / Math.max(1, f.left));
      f.bal -= pay; f.left -= 1; facilityRepay += pay;
    }
    s.debt.facility = s.debt.facility.filter(f => f.bal > 1 && f.left > 0);
  }

  /* STEP 17. 현금 정산 및 부도 판정 */
  s.cash += cashIn - cashOut - fixedCost - varCost - interest - lcFee - facilityRepay;
  if (s.cash < 0) {
    const need = -s.cash;
    if (s.debt.principal + need <= s.debt.limit) {
      s.debt.principal += need; s.cash = 0;
      flags.push(`자금이 모자라 $${Math.round(need).toLocaleString()}을 차입했습니다.`);
    } else {
      s.over = true; s.overReason = 'INSOLVENT';
    }
  }
  /* 여윳돈이 생기면 먼저 빚부터 갚는다.
     이게 없으면 통장에 현금을 쌓아 둔 채로 그 돈에 이자를 무는 회사가 된다.
     한 달 고정비 정도만 남기고 나머지는 상환한다 — 실제 운전자금 대출이 그렇게 돌아간다. */
  else if (s.cash > CFG.FC_BASE && s.debt.principal > 0) {
    const pay = Math.min(s.cash - CFG.FC_BASE, s.debt.principal);
    s.cash -= pay; s.debt.principal -= pay;
  }

  /* STEP 18. 재무제표 */
  const gp = revenue + scrapRevenue - cogs - valuationLoss - degradeLoss - dumpLoss;
  const ebitda = gp - fixedCost - varCost;
  const op = ebitda - depreciation;
  const np = op - interest - badDebt;
  s.fa.buildingNbv = Math.max(0, s.fa.buildingNbv - s.fa.buildingCost / CFG.BUILDING_LIFE_M);
  s.fa.machineAccDep += s.fa.machineCost / CFG.MACHINE_LIFE_M;
  s.equity += np;

  /* STEP 19. 본사 연결 기여
     모사가 공급할 수 있는 건 자동차강판뿐이다. 일반재는 가격 경쟁이 심해 모사가 못 맞추고,
     코일센터는 3자 소재를 사서 마진만 붙이면 된다 — 그 톤수는 본사에 한 푼도 안 간다.
     코일센터 단독 손익과 본사 실적이 갈라지는 자리가 정확히 여기다. */
  const materialTons = d.buy.totalTon * Math.max(0, Math.min(1, d.buy.beta || 0)) + hqSpotTon;
  const hqMargin = hqPerTon * materialTons;
  const consolidated = op + hqMargin;
  s.hq.cumMaterialTons += materialTons;
  s.hq.cumHqMargin += hqMargin;
  s.hq.cumConsolidated += consolidated;
  // 램프업 구간은 분모에서 뺀다. 배가 아직 안 왔는데 못 쳤다고 탓할 수는 없다.
  if (s.turn > CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd) s.hq.cumAutoDemand = (s.hq.cumAutoDemand || 0) + autoDemandTurn;
  s.hq.cumAutoShipped = (s.hq.cumAutoShipped || 0) + autoShippedTurn;
  s.segTons = s.segTons || {};
  for (const k of CFG.SEG_LIST) s.segTons[k] = (s.segTons[k] || 0) + shippedSeg[k];

  /* 비재무 갱신 — 설계서는 "3턴 연속 적자"일 때만 사기를 깎는다. 회복 경로도 둔다. */
  s.lossStreak = op < 0 ? (s.lossStreak || 0) + 1 : 0;
  if (s.lossStreak >= 3) s.morale -= 3;
  else if (op > 0) s.morale += 1;
  // 약속을 지킨 달은 평판이 회복된다. 바닥에 있을수록 빨리 올라온다 (평균 회귀).
  if (shippedTotal > 0 && shortageEvents.length === 0) s.trust += s.trust < 60 ? 2 : 1;
  s.morale = Math.max(0, Math.min(100, s.morale));
  s.trust = Math.max(0, Math.min(100, s.trust));
  if (s.morale < 30) { flags.push('직원들이 떠나고 있습니다.'); }

  const report = {
    turn: s.turn, phase: s.market.phase, pm, hqPerTon,
    revenue, gp, ebitda, op, np, hqMargin, consolidated,
    fixedCost, varCost, depreciation, interest, valuationLoss, badDebt,
    facilityRepay, facilityBal: facilityBalance(s),
    scrapTon, scrapRevenue, yieldGain: yieldGainTotal,
    degradeLoss, degradeTon, dumpLoss, dumpTon, carryCost, overTons, shortageEvents,
    hqSpotOffer, hqSpotTon,
    shipped, produced, demand, demandAuto, demandCommon, nasi: s.nasi.map(n => ({ turn: n.turn, tons: { ...n.tons }, potential: { ...(n.potential || n.tons) } })), nasiPotential: nasiNow.potential || nasiNow.tons, commonShareOfSales, hqSpotCredit: s.hqSpotCredit, cashIn, cashOut,
    spotExposure: spotExposure(s),
    invTons: inventoryTons(s),
    // 화면 맨 위 스테이터스가 읽는 값들. 판매량은 이번 달 실적,
    // 재고·채권은 이번 달을 닫은 시점의 잔액이다.
    invLong: longInventoryTons(s),
    ar: receivables(s).total,
    arLate: receivables(s).late,
    shippedTotal,
    shippedSeg,
    shippedC2C: shipped.C2C || 0,
    shippedProc: (shipped.SLIT || 0) + (shipped.LEVEL || 0) + (shipped.TRAP || 0) + (shipped.DIE || 0),
    log, flags,
  };
  s.history.push(report);

  /* STEP 20. 다음 달 시황과 시세를 정한다.
     이 상태로 화면이 그려지고, 사장은 그걸 보고 다음 결재를 한다. */
  {
    const nextTurn = s.turn + 1;
    const cur = chapterOf(s.turn), nxt = chapterOf(nextTurn);
    if (nxt.phase !== s.market.phase) {
      report.phaseChange = `${nxt.label}. ${nxt.brief}`;
    } else if (nxt.label !== cur.label) {
      report.phaseChange = `${nxt.label}. ${nxt.brief}`;
    }
    s.market.phase = nxt.phase;
    const ph = CFG.PHASE[nxt.phase];
    s.market.hqRate = ph.hqLo + rng() * (ph.hqHi - ph.hqLo);

    let np = s.market.pm * (1 + (nxt.drift ?? ph.drift) + CFG.PM_SIGMA * gauss(rng));
    if (rng() < CFG.PM_JUMP_PROB) np *= 1 + (rng() < 0.5 ? -CFG.PM_JUMP_SIZE : CFG.PM_JUMP_SIZE);
    s.market.pm = Math.max(400, Math.min(1400, np));   // 750 기준 로그 대칭
    s.market.scrapRate = CFG.SCRAP_RATE;
  }

  /* STEP 21. 설치 중인 설비가 다 됐는가.
     설비는 주문한다고 바로 돌지 않는다. 넉 달 걸린다.
     호황을 보고 지르면 도착했을 때 호황이 끝나 있다. */
  s.buildQueue = (s.buildQueue || []).filter(b => {
    if (b.readyTurn > s.turn + 1) return true;
    if (b.kind === 'YARD') {
      s.yardCap = yardCapOf(s) + CFG.YARD.add;
      report.lineReady = `야드 확장이 끝났습니다. 이제 ${Math.round(s.yardCap).toLocaleString('en-US')}톤까지 받습니다.`;
    } else if (b.kind === 'HALL') {
      s.buildings = (s.buildings || 1) + 1;
      s.fa.buildingCost += CFG.BUILDING;
      s.fa.buildingNbv  += CFG.BUILDING;
      report.lineReady = `새 공장동이 준공됐습니다. 라인을 ${CFG.MAX_LINES}대까지 더 놓을 수 있습니다.`;
    } else {
      s.lines.push({ id: `L${s.lines.length + 1}`, type: b.type,
                     cap: CFG.LINE[b.type].cap, capex: b.capex });
      s.fa.machineCost += b.capex;
      report.lineReady = `${CFG.LINE[b.type].label} 설치가 끝났습니다. 다음 달부터 돕니다.`;
    }
    return false;
  });

  s.turn += 1;
  if (s.turn > CFG.TOTAL_TURNS && !s.over) { s.over = true; s.overReason = 'COMPLETE'; }
  if (s.equity < 0 && !s.over) { s.over = true; s.overReason = 'CAPITAL_ERODED'; }

  return { state: s, report };
}

/* ---------- 등급 판정 (v3 §8-7) ---------- */

/* 본사는 코일센터를 이 순서로 본다 (실무자 확인):
     1순위 — 본사 정책을 얼마나 따랐는가. 즉 본사가 최우선시하는 자동차강판 실수요 판매를
             얼마나 수행해서 본사 판매량과 이익에 기여했는가.
     2순위 — 그러고 나서 법인 자체의 이익과 건전성.
   그래서 이 등급은 가중합이 아니라 사전식(lexicographic)이다. 수행률이 먼저 읽히고,
   법인 손익은 같은 수행률 안에서만 등급을 가른다.
   "본사는 이겼습니다"가 "혼자만 이겼습니다"보다 위에 있는 이유가 이것이다. */
/* 4년 성적표.
   본사는 코일센터를 두 가지로 본다.
     1) 본사(P사)의 판매량과 영업이익에 얼마나 기여했나
     2) 코일센터 자체가 얼마나 벌었나
   둘은 저절로 같이 가지 않는다. 자금 회전을 위해 3자 소재를 늘리면 법인은
   숨통이 트이지만 본사 몫은 한 푼도 안 늘고, 본사 물량을 다 받아주면
   본사는 웃지만 법인 창고에 재고가 눕는다. 그 줄타기가 등급으로 나온다. */
function grade(state) {
  const soloOp = state.history.reduce((a, h) => a + h.op, 0);
  const hqProfit = state.hq.cumHqMargin;
  const hqTons = state.hq.cumMaterialTons;
  const soldTons = state.history.reduce((a, h) => a + (h.shippedTotal || 0), 0);
  const hqT = CFG.HQ_PROFIT_TARGET, soT = CFG.SOLO_OP_TARGET;
  const hqOk = hqProfit >= hqT, soloOk = soloOp >= soT;
  const base = { soloOp, hqProfit, hqTons, soldTons, hqTarget: hqT, soloTarget: soT,
                 consol: soloOp + hqProfit };

  if (state.overReason !== 'COMPLETE' || state.equity <= 0) {
    return { ...base, grade: 'F', title: '버티지 못했습니다',
      desc: state.overReason === 'COMPLETE'
        ? '자본이 잠식되었습니다. 기여를 따지기 전에 회사가 남아 있어야 합니다.'
        : '자금이 끊겼습니다. 본사도 법인도 남은 것이 없습니다.' };
  }
  if (hqOk && soloOk) {
    return { ...base, grade: 'S', title: '둘 다 이겼습니다',
      desc: '본사 판매와 영업이익에 제대로 기여하면서 코일센터도 키웠습니다. 드문 결말입니다.' };
  }
  if (hqOk) {
    return { ...base, grade: 'A', title: '본사는 이겼습니다',
      desc: '본사 소재를 많이 받아 P사 실적에 크게 기여했습니다. 다만 코일센터 자체 이익은 목표에 못 미쳤습니다 — 센터장이 욕먹으며 본사 실적을 만든 경우이고, 현실에서 가장 흔한 결말입니다.' };
  }
  if (soloOk) {
    return { ...base, grade: 'C', title: '혼자만 이겼습니다',
      desc: '코일센터 손익은 지켰습니다. 그런데 본사가 우리를 통해 번 돈은 목표에 못 미칩니다. 본사가 이 법인을 왜 세웠는지를 생각하면 좋은 성적표가 아닙니다.' };
  }
  if (hqProfit >= hqT * 0.75 || soloOp >= soT * 0.75) {
    return { ...base, grade: 'B', title: '무난했습니다',
      desc: '크게 잘못한 것은 없습니다. 다만 본사 기여도 법인 이익도 목표선을 넘지는 못했습니다.' };
  }
  return { ...base, grade: 'D', title: '둘 다 놓쳤습니다',
    desc: '본사 기여도 코일센터 이익도 목표에 한참 못 미칩니다.' };
}

/* 부임은 2026년 1월. 해가 바뀌면 다시 1월부터 센다. */
function ym(turn) {
  const i = turn - 1;
  return { y: CFG.START_YEAR + Math.floor(i / 12), m: (i % 12) + 1, yi: Math.floor(i / 12) };
}
function ymLabel(turn) { const d = ym(turn); return `${d.y}년 ${d.m}월`; }

<script>
/* ============================================================
   의사결정
   매달 두 갈래가 올라온다.
     루틴  영업 · 소재구매 · 생산 — 센터장이 매달 반드시 정하는 것
     돌발  그때그때 터지는 사건 — 매달 2~3건
   opt.mult  이번 달 소재 발주량 배수
   opt.beta  이번 달 본사 소재 비중 (1이면 전량 본사, 낮추면 3자 소재)
   opt.apply 결재 확정 때 실행. 문자열을 돌려주면 결산에 한 줄로 찍힌다.
   card.text 는 문자열 또는 (s, ctx) => 문자열
   ============================================================ */

/* ---- 루틴 셋: 영업 · 소재구매 · 생산 ----
   매달 같은 질문이 올라오면 결재가 아니라 클릭 노동이 된다.
   그래서 각 자리마다 상황별로 다른 카드가 선다 — 시황, 재고, 시세, 가동률을 보고
   그 달에 실제로 고민할 만한 것을 묻는다. 고르는 축(물량이냐 마진이냐,
   지금 사느냐 미루느냐, 돌리느냐 손보느냐)은 같지만 이유와 숫자가 매달 다르다. */

/* 영업 자리 — 이번 달 물건을 어느 산업군부터 채울지.
   물량이 넉넉하면 다 채워지지만, 모자라면 뒤로 밀린 곳에서 결품이 난다.
   산업군마다 값도 회수기간도 위험도 다르므로 이게 매달 진짜 결정이 된다. */
function salesCard(s, c) {
  const seg = c.segNow || {};
  const tons = k => Math.round(CFG.SEG_LIST.includes(k)
    ? PROC_LIST.reduce((a, q) => a + ((seg[k] && seg[k][q]) || 0), 0) : 0);
  const a_ = tons('AUTO'), p_ = tons('APPL'), c_ = tons('CONS'), d_ = tons('DIST');
  const stock = c.fgTons;                 // 창고의 소재 + 제품
  const total = a_ + p_ + c_ + d_;
  const tight = stock < total * 1.05;     // 이번 달 주문을 다 못 채울 만큼 얇은가
  const line = `이번 달 들어온 주문은 자동차 ${fmt(a_)}t · 가전 ${fmt(p_)}t · 건재 ${fmt(c_)}t · 유통 ${fmt(d_)}t입니다.`;
  const opt = (label, hint, order, msg) => ({ label, hint,
    apply: (s2, g) => { g.segPriority = order; return msg; } });

  return { id: 'r-sales', kind: '영업', who: 'jung',
    title: tight ? '물건이 모자랍니다. 어디부터 채울까요' : '이번 달 판매 배분',
    text: line + ' ' + (tight
      ? `창고에 ${fmt(stock)}t뿐입니다. 뒤로 밀린 곳에서는 결품이 납니다.`
      : `창고에 ${fmt(stock)}t이 있어 물량은 됩니다. 그래도 어디부터 실을지에 따라 값과 대금 회수가 달라집니다.`),
    opts: [
      opt('자동차부터', '본사 소재 주력 · 결품을 내면 끝', ['AUTO', 'APPL', 'CONS', 'DIST'],
          '자동차 물량부터 채웠습니다.'),
      opt('가전부터', '톤당 +$14 · 대금 한 달이면 회수', ['APPL', 'AUTO', 'DIST', 'CONS'],
          '값을 잘 쳐주는 가전부터 채웠습니다. 현금도 빨리 돕니다.'),
      opt('건재부터', '물량은 크지만 넉 달 뒤 회수 · 떼일 위험', ['CONS', 'AUTO', 'APPL', 'DIST'],
          '건재 물량부터 채웠습니다. 대금은 넉 달 뒤에 봅니다.'),
    ] };
}

function prodCard(s, c) {

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4342a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROUNDTABLE">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>ROUNDTABLE 영어 쉐도잉</title>
<style>
:root{
  --paper:#f6f2ea; --card:#fffdf8; --line:#e2dacb; --ink:#1a1917; --sub:#6d665c;
  --accent:#a4342a; --accent-soft:#f0dcd8; --blue:#2b4d63; --blue-soft:#dfe7ec;
  --ok:#2f6b4f; --warn:#8a6a1f; --radius:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme="dark"]{
  --paper:#15171a; --card:#1c1f24; --line:#2e333a; --ink:#e9e5dd; --sub:#9a948a;
  --accent:#e0715f; --accent-soft:#3a2320; --blue:#8fb6cd; --blue-soft:#1f2a33;
  --ok:#6fbf94; --warn:#d6b45c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}

.byline{background:var(--paper);border-bottom:1px solid var(--line)}
.bylinein{max-width:860px;margin:0 auto;padding:9px 16px 8px;font-size:12.5px;font-weight:700;
  line-height:1.7;color:var(--accent);letter-spacing:.01em}
.bylinein .c{letter-spacing:.16em;margin-right:8px}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:600}
.brand i{display:block;font-family:var(--sans);font-style:normal;font-size:11px;
  letter-spacing:.02em;color:var(--sub);margin-top:1px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;padding:6px 11px;border-radius:999px;
  cursor:pointer;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.hd{font-family:var(--serif);font-size:22px;margin:26px 0 2px;line-height:1.3}
.hd small{display:block;font-family:var(--sans);font-size:12px;color:var(--sub);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--sub);font-size:13.5px}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.87}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--accent);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--sub)}

.today{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.today h2{font-family:var(--serif);font-size:26px;margin:8px 0 4px;line-height:1.25}
.today .kotitle{color:var(--sub);font-size:14px;margin-bottom:14px}
.streak{display:flex;gap:18px;margin:14px 0 0;flex-wrap:wrap}
.streak div{text-align:center}
.streak b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.streak span{font-size:11.5px;color:var(--sub)}
.dlist{display:grid;gap:8px;margin-top:10px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.ditem:hover{border-color:var(--accent)}
.ditem .num{font-family:var(--serif);font-size:16px;width:26px;color:var(--sub);flex:none}
.ditem .t{flex:1;min-width:0}
.ditem .t b{display:block;font-size:14.5px;font-weight:600}
.ditem .t span{font-size:12px;color:var(--sub)}
.ditem .done{color:var(--ok);font-size:12px;font-weight:700;flex:none}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.past{background:var(--ok)}
.sesshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.clock{font-family:var(--serif);font-size:19px;margin-left:auto;letter-spacing:.04em}
.clock.over{color:var(--accent)}
.stepname{font-size:13px;font-weight:700}
.stepname em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}

.brief li{margin:7px 0}
.keyrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.keyrow:last-child{border:none}
.keyrow b{font-family:var(--serif);font-size:16px;flex:none;min-width:180px}
.keyrow span{font-size:13.5px;color:var(--sub)}
.keyrow .ex{display:block;font-family:var(--serif);font-size:13px;color:var(--sub);font-style:italic;margin-top:2px}

.sline{display:flex;gap:10px;padding:8px 10px;border-radius:9px;margin:2px 0;cursor:pointer}
.sline.now{background:var(--accent-soft)}
.sline .sp{font-family:var(--serif);font-weight:700;flex:none;width:20px;color:var(--accent)}
.sline.b .sp{color:var(--blue)}
.sline .en{font-family:var(--serif);font-size:16px;line-height:1.55}
.sline .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}

.shadowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:12px 0}
.who{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.who.b{color:var(--blue)}
.bigen{font-family:var(--serif);font-size:clamp(19px,4.1vw,27px);line-height:1.55;margin:8px 0 4px}
.chunks{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.chunk{font-family:var(--serif);font-size:clamp(17px,3.4vw,21px);padding:7px 12px;
  border-left:3px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.chunk:hover{background:var(--paper)}
.chunk.on{border-left-color:var(--accent);background:var(--accent-soft)}
.bigko{font-size:14px;color:var(--sub);margin-top:8px}
.blurme{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.blurme.show{filter:none;cursor:auto}
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.note{margin:8px 0;font-size:13.5px}
.note b{font-family:var(--serif);font-size:15px}
.note .k{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--blue-soft);
  color:var(--blue);margin-left:6px;font-weight:700;vertical-align:2px}
.note .tip{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.counter{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.speedbar{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.speedbar button{border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer}
.speedbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.qbox{margin:16px 0}
.qbox .q{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.qbox .hint{font-size:12.5px;color:var(--sub)}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;max-width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:10.5px;color:var(--sub)}
.cal div.done{background:var(--accent);color:#fff;font-weight:700}
.histrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.histrow b{font-family:var(--serif);font-size:15px}
.bankrow{padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow b{font-family:var(--serif);font-size:16px}
.bankrow .m{font-size:13px;color:var(--sub)}
.bankrow .ex{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--sub)}
.star{cursor:pointer;float:right;font-size:15px;opacity:.28}
.star.on{opacity:1}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px;z-index:30;display:none}
.footbar.on{display:block}
.footin{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.credit{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:11.5px;color:var(--sub);
  letter-spacing:.02em;text-align:center;opacity:.8}
.credit b{font-family:var(--serif);font-weight:600;letter-spacing:.06em}
@media(max-width:560px){
  .keyrow{flex-direction:column;gap:2px}
  .keyrow b{min-width:0}
  .brand i{display:none}
}

/* ---- 앱으로 설치하기 ---- */
.instbtn{background:var(--accent);color:var(--paper);border:none;padding:6px 12px;
  border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.instbtn[hidden]{display:none}
@media(max-width:560px){ .instbtn{margin-left:auto} }

#openChrome{position:fixed;inset:auto 12px 12px;max-width:520px;margin:0 auto;z-index:60;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--accent);color:var(--paper);border-radius:14px;padding:16px 18px;
  box-shadow:0 12px 40px -8px rgba(0,0,0,.45)}
#openChrome[hidden]{display:none}   /* display:flex가 hidden 속성을 이기므로 명시한다 */
#openChrome .oc-body{flex:1 1 240px;font-size:13.5px;line-height:1.7}
#openChrome .oc-body b{display:block;font-size:15px;margin-bottom:3px}
#openChrome .oc-body span{opacity:.9}
#openChrome button{border:none;border-radius:9px;padding:10px 16px;cursor:pointer;
  font-weight:700;font-size:14px;background:var(--paper);color:var(--accent)}
#openChrome button.ghost{background:transparent;color:inherit;font-weight:400;opacity:.85;padding:10px 8px}

#installNote{position:fixed;inset:auto 16px 16px;max-width:460px;margin:0 auto;z-index:50;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:0 12px 40px -8px rgba(0,0,0,.4)}
#installNote h5{margin:0 0 10px;font-size:15px}
#installNote p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.8}
#installNote ol{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--sub);line-height:1.95}
#installNote ol li{margin-bottom:3px}
#installNote b{color:var(--ink)}
#installNote button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13.5px}
#installNote .inst-btns{display:flex;gap:8px;flex-wrap:wrap}
#installNote #installNow{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
</style>
<div class="byline"><div class="bylinein"><span class="c">&copy; 2026</span>기획과 구성 by 곤사마</div></div>
<div class="topbar"><div class="topin">
  <div class="brand">ROUNDTABLE<i>데일리 영어 쉐도잉</i></div>
  <nav class="tabs" id="tabs">
    <button data-view="home" class="on">홈</button>
    <button data-view="log">기록</button>
    <button data-view="bank">표현장</button>
    <button data-view="add">자료 추가</button>
  </nav>
  <button class="instbtn" id="installBtn" hidden>📲 설치</button>
</div></div>

<div class="wrap">
  <section id="view-home" class="view on"></section>
  <section id="view-session" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-bank" class="view"></section>
  <section id="view-add" class="view"></section>
</div>
<div class="credit">ROUNDTABLE — 데일리 영어 쉐도잉 &nbsp;·&nbsp; © 2026 <b>곤사마</b> (Gonsama). All rights reserved.</div>
<div class="footbar" id="footbar"><div class="footin" id="footin"></div></div>
<div class="toast" id="toast"></div>

<div id="openChrome" hidden>
  <div class="oc-body">
    <b id="ocApp">지금은 다른 앱 안에서 열려 있습니다.</b>
    <span id="ocMsg"></span>
  </div>
  <button id="ocGo">브라우저로 열기</button>
  <button id="ocCopy" class="ghost">주소 복사</button>
  <button id="ocClose" class="ghost">그냥 보기</button>
</div>

<div id="installNote" hidden>
  <h5 id="installTitle">📲 홈 화면에 설치하기</h5>
  <div id="installSteps"></div>
  <div class="inst-btns">
    <button id="installNow" hidden>지금 설치</button>
    <button id="installNoteClose">알겠습니다</button>
  </div>
</div>

<script>
const CONTENT_BUILTIN = [
{
 id:"w1d1", day:1, cat:"경제", level:"B2+",
 title:"When Money Stops Being Cheap",
 titleKo:"돈이 더는 싸지 않을 때 — 금리와 투자 결정",
 names:{A:"Nora (재무)", B:"Sam (영업·운영)"},
 brief:[
  "기업이 설비 투자를 결정할 때 보는 것은 수요만이 아니라 <b>자본비용(cost of capital)</b>이다. 돈을 빌리는 값이 오르면, 같은 수요·같은 프로젝트라도 승인 기준이 올라간다.",
  "금리 인상의 충격은 즉시 오지 않고 <b>시차를 두고(with a lag)</b> 온다. 낮은 금리로 고정해 둔 기존 부채가 만기를 맞아 <b>차환(roll over)</b>될 때 비로소 이자 부담이 드러나기 때문이다.",
  "그래서 실무에서 쓰는 개념이 <b>hurdle rate(투자 승인 최저 수익률)</b>와 <b>payback period(회수 기간)</b>다. 자본이 비쌀수록 회수 기간이 짧은 안건만 살아남는다.",
  "재고도 마찬가지다. 저금리 시절엔 재고를 쌓아두는 비용이 사실상 공짜에 가까웠지만, 고금리에서는 야적장의 한 톤 한 톤이 <b>빌린 돈</b>이 된다."
 ],
 lines:[
  {s:"A",en:"The board pushed back on the expansion plan again. Honestly, I saw it coming.",
   ko:"이사회가 증설안에 또 제동을 걸었어요. 솔직히 저는 예상하고 있었습니다.",
   notes:[{t:"push back on ~",k:"phrasal",m:"~에 반대하다, 제동을 걸다",tip:"반대할 때 I don't agree 대신 쓰면 톤이 한결 부드러워집니다. The team pushed back on the deadline."},
          {t:"see it coming",k:"idiom",m:"그럴 줄 알았다",tip:"부정형이 더 자주 쓰입니다. I didn't see that coming. = 그건 예상 못 했다."}]},
  {s:"B",en:"Really? The demand numbers looked solid to me last week. So what's the sticking point?",
   ko:"그래요? 지난주엔 수요 숫자가 탄탄해 보이던데요. 그럼 뭐가 걸리는 겁니까?",
   notes:[{t:"solid",k:"collocation",m:"(숫자·근거가) 탄탄한",tip:"solid numbers / solid evidence / solid track record 로 붙습니다."},
          {t:"the sticking point",k:"idiom",m:"합의를 막는 결정적 걸림돌",tip:"The sticking point is the schedule, not the price. 협상에서 그대로 씁니다."}]},
  {s:"A",en:"It isn't demand. It's the cost of capital, and it has quietly doubled.",
   ko:"수요가 아닙니다. 자본비용이고, 그게 조용히 두 배가 됐어요.",
   notes:[{t:"It isn't A. It's B.",k:"grammar",m:"A가 아니라 B다",tip:"원인을 바로잡을 때 쓰는 두 문장짜리 골격입니다. 짧게 끊어 말하면 더 또렷합니다."}]},
  {s:"B",en:"Fair enough, but we've had high rates for a while. Why is it biting now?",
   ko:"일리는 있어요. 그런데 고금리는 한참 겪어 왔잖아요. 왜 지금 와서 타격이 오죠?",
   notes:[{t:"Fair enough, but ~",k:"idiom",m:"일리는 있는데, 다만 ~",tip:"상대를 인정하고 반박으로 넘어가는 다리입니다. 토론 필수 표현."},
          {t:"bite",k:"idiom",m:"(정책·비용이) 실제로 아프게 작용하다",tip:"When do the sanctions start to bite? 처럼 씁니다."}]},
  {s:"A",en:"The old debt was locked in at low rates. It's rolling over now.",
   ko:"예전 부채는 낮은 금리로 고정해 뒀어요. 그게 지금 차환되고 있습니다.",
   notes:[{t:"lock in a rate",k:"phrasal",m:"금리·가격을 고정해 두다",tip:"We locked in the price for two years. 가격 협상에서 그대로 씁니다."},
          {t:"roll over",k:"business",m:"(만기 부채를) 차환하다, 갱신하다",tip:"계약에도 씁니다. The contract rolls over automatically. = 자동 갱신된다."}]},
  {s:"B",en:"Ah, so the pain shows up with a lag. That's the part people miss.",
   ko:"아, 그래서 고통이 시차를 두고 나타나는군요. 사람들이 놓치는 게 그 부분이네요.",
   notes:[{t:"with a lag",k:"business",m:"시차를 두고",tip:"즉시가 아니라 뒤늦게 나타난다는 뜻입니다. The effect comes with a lag."},
          {t:"show up",k:"phrasal",m:"나타나다, 드러나다",tip:"숫자·증상·사람 모두에 씁니다. It shows up in next quarter's numbers."}]},
  {s:"A",en:"Exactly. On paper we look healthy, but the interest bill quietly eats our margin.",
   ko:"맞아요. 서류상으론 멀쩡해 보이지만 이자가 우리 마진을 조용히 갉아먹고 있습니다.",
   notes:[{t:"on paper",k:"idiom",m:"서류상으로는 (실제와 다를 수 있다는 뉘앙스)",tip:"뒤에 but이 따라오는 것이 거의 공식입니다."}]},
  {s:"B",en:"Still, if we sit on our hands, we hand the market to competitors.",
   ko:"그래도 손 놓고 있으면 시장을 경쟁사에 넘겨주는 겁니다.",
   notes:[{t:"sit on one's hands",k:"idiom",m:"손 놓고 아무것도 안 하다",tip:"We can't sit on our hands and hope. 회의에서 결단을 촉구할 때 씁니다."},
          {t:"hand A to B",k:"phrasal",m:"A를 B에게 넘겨주다",tip:"give보다 「그냥 내준다」는 아쉬움이 섞입니다."}]},
  {s:"A",en:"I'd push back on that a little. Not every year is a land-grab year.",
   ko:"그 부분엔 조금 이견이 있어요. 매년이 땅따먹기 하는 해는 아니거든요.",
   notes:[{t:"I'd push back on that",k:"idiom",m:"그 부분엔 이견이 있습니다",tip:"would를 붙이면 단정이 아니라 제안이 되어 각이 서지 않습니다."},
          {t:"a land-grab year",k:"colloquial",m:"점유율을 먼저 차지하고 보는 해",tip:"land grab = 땅따먹기. 시장 선점 경쟁을 가리키는 비유입니다."}]},
  {s:"B",en:"Meaning what, exactly? I'd rather have that argument here than in a memo.",
   ko:"정확히 무슨 뜻이죠? 그 논쟁은 보고서보다 여기서 하는 게 낫겠습니다.",
   notes:[{t:"Meaning what, exactly?",k:"colloquial",m:"그게 정확히 무슨 뜻이죠",tip:"상대 말을 끊지 않고 설명을 요구하는 짧은 되물음입니다."},
          {t:"I'd rather A than B",k:"grammar",m:"B보다 A 하는 편이 낫다",tip:"뒤에 동사원형이 옵니다. I'd rather ask than guess."}]},
  {s:"A",en:"When capital is expensive, the bar goes up and the payback gets shorter.",
   ko:"자본이 비싸지면 통과 기준이 올라가고 회수 기간이 짧아집니다.",
   notes:[{t:"the bar goes up",k:"idiom",m:"통과 기준이 높아지다",tip:"raise the bar = 기준을 올리다. 사람과 안건 양쪽에 씁니다."},
          {t:"payback",k:"business",m:"투자 회수 기간",tip:"payback period 의 줄임입니다. a two-year payback 처럼 씁니다."}]},
  {s:"B",en:"So a project that made sense at two percent stops making sense at six.",
   ko:"그럼 2%에서 말이 되던 안건이 6%에서는 말이 안 되는 거네요.",
   notes:[{t:"stop -ing",k:"grammar",m:"~하기를 그치다",tip:"stop to do(하려고 멈추다)와 뜻이 완전히 다릅니다. 한국인이 가장 자주 틀리는 자리입니다."}]},
  {s:"A",en:"Right. Same project, same demand, same team. The only thing that moved is the hurdle rate.",
   ko:"그렇죠. 같은 프로젝트, 같은 수요, 같은 팀. 움직인 건 승인 기준 하나뿐입니다.",
   notes:[{t:"The only thing that ~ is …",k:"grammar",m:"~한 것은 …뿐이다",tip:"변한 것 하나를 짚어낼 때의 강조 골격입니다. The only thing that matters is delivery."},
          {t:"hurdle rate",k:"business",m:"투자 승인 최저 수익률",tip:"넘어야 할 허들에서 온 말입니다. 사내 심의의 기준선입니다."}]},
  {s:"B",en:"That's a cleaner way to put it than anything I said in the meeting.",
   ko:"제가 회의에서 한 말보다 훨씬 깔끔한 표현이네요.",
   notes:[{t:"put it",k:"collocation",m:"(그렇게) 표현하다",tip:"Let me put it another way. = 다르게 말해 보겠습니다. 회의에서 매우 자주 씁니다."}]},
  {s:"A",en:"The other thing is inventory. Holding stock used to be almost free. Now it isn't.",
   ko:"또 하나는 재고예요. 재고를 쥐고 있는 게 예전엔 거의 공짜였는데, 지금은 아닙니다.",
   notes:[{t:"The other thing is ~",k:"colloquial",m:"또 하나는 ~입니다",tip:"두 번째 논점으로 넘어가는 신호입니다. 발표와 회의에서 그대로 씁니다."},
          {t:"used to be",k:"grammar",m:"예전엔 ~였다 (지금은 아니다)",tip:"뒤에 Now it isn't. 를 붙이면 대비가 또렷해집니다."}]},
  {s:"B",en:"I see. So every ton sitting in the yard is borrowed money nobody invoices.",
   ko:"알겠어요. 그럼 야적장에 놀고 있는 1톤 1톤이 아무도 청구하지 않는 빌린 돈이군요.",
   notes:[{t:"sitting in the yard",k:"collocation",m:"야적장에 놀고 있는",tip:"sit이 「놀고 있다·방치돼 있다」는 뜻으로 쓰였습니다. The stock has been sitting there for months."}]},
  {s:"A",en:"That's the thing. High rates change the day-to-day, not just the big projects.",
   ko:"바로 그게 핵심이에요. 고금리는 큰 프로젝트만이 아니라 일상 운영을 바꿔 놓습니다.",
   notes:[{t:"That's the thing.",k:"colloquial",m:"바로 그게 핵심입니다",tip:"상대가 짚은 것을 받아 논점으로 끌어올리는 한마디입니다."},
          {t:"A, not just B",k:"grammar",m:"B만이 아니라 A도",tip:"범위를 넓힐 때 씁니다. It's a culture problem, not just a process problem."}]},
  {s:"B",en:"So what would you propose? We can't freeze everything and still hold our targets.",
   ko:"그럼 뭘 제안하시겠어요? 전부 동결해 놓고 목표를 지킬 수는 없잖아요.",
   notes:[{t:"What would you propose?",k:"business",m:"무엇을 제안하시겠습니까",tip:"비판을 대안 요구로 돌리는 회의 표현입니다."},
          {t:"hold a target",k:"collocation",m:"목표를 지키다",tip:"hit a target(달성하다)과 다릅니다. hold는 「지켜 낸다」는 뜻입니다."}]},
  {s:"A",en:"Phase it. Build the part that pays back in two years, keep the rest on the shelf.",
   ko:"단계로 나누죠. 2년 안에 회수되는 부분만 짓고 나머지는 보류해 둡니다.",
   notes:[{t:"phase it",k:"business",m:"단계로 나누어 진행하다",tip:"phase in = 단계적으로 도입하다 / phase out = 단계적으로 없애다."},
          {t:"keep ~ on the shelf",k:"idiom",m:"~을 보류해 두다",tip:"버리는 게 아니라 「선반에 올려 둔다」는 뜻입니다. 되살릴 여지를 남깁니다."}]},
  {s:"B",en:"I can sell that upstairs. It sounds disciplined rather than defensive, and the board likes that.",
   ko:"그거라면 윗선에 설득할 수 있겠어요. 방어적이 아니라 절제된 것으로 들리고, 이사회가 그걸 좋아하거든요.",
   notes:[{t:"sell it upstairs",k:"idiom",m:"윗선을 설득하다",tip:"sell = 납득시키다. Can you sell this to the client? 처럼 씁니다."},
          {t:"A rather than B",k:"grammar",m:"B라기보다 A인",tip:"두 인상을 가르는 비교입니다. disciplined rather than defensive 처럼 형용사 짝으로 자주 씁니다."}]}

 keys:[

{
 id:"w1d2", day:2, cat:"신기술", level:"B2+",
 title:"The Part the Machine Can't Sign Off On",
 titleKo:"기계가 결재할 수 없는 부분 — AI와 사무직의 일",
 names:{A:"Ravi (기획)", B:"Elena (현업 팀장)"},
 brief:[
  "AI가 일자리에 미치는 영향은 '직업(job)'이 아니라 <b>작업(task)</b> 단위로 보는 것이 정확하다. 한 직업은 수십 개 작업의 묶음이고, AI는 그중 일부만 잘한다.",
  "그래서 현장에서 실제로 갈리는 기준은 <b>automation(대체)</b>이냐 <b>augmentation(증강)</b>이냐이다. 초안 작성·요약·정리는 증강 쪽, 판단과 책임은 여전히 사람 쪽에 남는다.",
  "핵심 병목은 성능이 아니라 <b>검증 비용(the cost of checking)</b>이다. 결과를 사람이 다시 확인해야 한다면, 절약한 시간의 일부는 되돌아온다.",
  "결국 조직에서 남는 질문은 하나다 — <b>누가 서명하는가(who signs off)</b>. 책임은 위임되지 않기 때문에, 이 지점이 사람의 자리를 정의한다."
 ],
 lines:[
  {s:"A",en:"Everyone asks whether AI will replace these roles. I think that's the wrong question.",
   ko:"다들 AI가 이 직무를 대체할지만 묻습니다. 저는 그게 틀린 질문이라고 봐요.",
   notes:[{t:"ask whether ~",k:"grammar",m:"~인지 아닌지 묻다",tip:"간접의문문이라 뒤에 주어+동사 어순입니다. 의문문 어순으로 쓰지 마세요."},
          {t:"the wrong question",k:"collocation",m:"잘못 설정된 질문",tip:"That's the wrong question to ask. 논의의 틀 자체를 문제 삼을 때 씁니다."}]},
  {s:"B",en:"Go on. If that's the wrong question, what would you put in front of the committee?",
   ko:"계속해 보세요. 그게 틀린 질문이면, 위원회에는 뭘 올리시겠어요?",
   notes:[{t:"Go on.",k:"colloquial",m:"계속해 보세요",tip:"상대에게 발언을 넘기는 짧은 한마디입니다. 재촉이 아니라 관심입니다."},
          {t:"put ~ in front of someone",k:"phrasal",m:"~에게 올리다, 내놓다",tip:"put a proposal in front of the board. 보고 라인을 말할 때 씁니다."}]},
  {s:"A",en:"Which tasks, not which jobs. A job is a bundle of twenty different things.",
   ko:"어떤 직업이냐가 아니라 어떤 작업이냐죠. 직업은 스무 가지 일의 묶음입니다.",
   notes:[{t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"논점을 바로잡는 가장 짧은 형태입니다. 앞에 Which/It's를 붙여 응용합니다."},
          {t:"a bundle of ~",k:"collocation",m:"~의 묶음",tip:"a bundle of tasks / a bundle of rights. 하나로 보이지만 여럿이라는 뜻입니다."}]},
  {s:"B",en:"That tracks with what I see. It drafts fast, but I rewrite the parts that matter.",
   ko:"제가 보는 것과 맞아떨어지네요. 초안은 빨리 뽑지만 중요한 부분은 제가 다시 씁니다.",
   notes:[{t:"That tracks.",k:"colloquial",m:"말이 맞아떨어지네요",tip:"상대 설명이 자기 경험과 들어맞을 때 씁니다. That makes sense보다 요즘 말투입니다."},
          {t:"the parts that matter",k:"idiom",m:"정작 중요한 부분",tip:"the part that matters 로도 씁니다. 나머지는 덜 중요하다는 뜻이 깔립니다."}]},
  {s:"A",en:"Right. That's the whole debate: automation versus augmentation. Most vendors won't draw that distinction.",
   ko:"맞아요. 논쟁 전체가 그겁니다. 대체냐 증강이냐. 공급사 대부분은 그 구분을 긋지 않죠.",
   notes:[{t:"draw a distinction",k:"collocation",m:"구분을 긋다",tip:"draw a line between A and B 로도 씁니다. 회의에서 개념을 가를 때의 정석입니다."}]},
  {s:"B",en:"Augmentation sounds nice. In most plans I've read, it's a polite word for cutting headcount.",
   ko:"증강이란 말은 듣기 좋죠. 제가 본 계획서 대부분에서는 인원 감축의 완곡어였습니다.",
   notes:[{t:"a polite word for ~",k:"idiom",m:"~을 점잖게 돌려 말한 것",tip:"완곡어법을 폭로할 때 씁니다. Restructuring is a polite word for layoffs."},
          {t:"cut headcount",k:"business",m:"인원을 줄이다",tip:"headcount는 「사람 수」입니다. reduce headcount / freeze headcount 로도 씁니다."}]},
  {s:"A",en:"Sometimes. But look at where the time actually goes once a team uses it daily.",
   ko:"때로는 그렇죠. 그래도 팀이 매일 쓰기 시작하면 시간이 실제로 어디로 가는지 보세요.",
   notes:[{t:"where the time goes",k:"collocation",m:"시간이 어디로 새는지",tip:"Let's see where the time goes. 업무 분석의 단골 표현입니다."},
          {t:"once ~",k:"grammar",m:"일단 ~하고 나면",tip:"when보다 「그 시점 이후로는」이 또렷합니다. once가 접속사로 쓰인 자리입니다."}]},
  {s:"B",en:"Let me guess. You save an hour writing and lose forty minutes checking.",
   ko:"맞혀 볼게요. 쓰는 데 한 시간 아끼고 확인하는 데 40분 잃는다.",
   notes:[{t:"Let me guess.",k:"colloquial",m:"맞혀 볼게요",tip:"상대의 결론을 앞질러 말하며 대화를 끌어당기는 표현입니다."},
          {t:"save/lose time -ing",k:"grammar",m:"~하는 데 시간을 아끼다/잃다",tip:"전치사 없이 동명사가 바로 옵니다. spend time -ing도 같은 형태입니다."}]},
  {s:"A",en:"That's exactly it. The bottleneck moves from producing to verifying, and no dashboard records that.",
   ko:"정확히 그겁니다. 병목이 생산에서 검증으로 옮겨 가는데, 어떤 대시보드도 그걸 기록하지 않죠.",
   notes:[{t:"the bottleneck moves",k:"idiom",m:"병목이 옮겨 가다",tip:"문제가 사라진 게 아니라 자리를 옮겼다는 뜻입니다. 개선 논의의 핵심어입니다."},
          {t:"move from A to B",k:"collocation",m:"A에서 B로 옮겨 가다",tip:"shift from A to B 로도 씁니다. 변화의 방향을 명시합니다."}]},
  {s:"B",en:"And verification is harder to measure, so it never shows up on the savings slide.",
   ko:"그리고 검증은 측정이 더 어려우니, 절감 장표에는 절대 안 나타납니다.",
   notes:[{t:"show up on ~",k:"phrasal",m:"~에 나타나다, 잡히다",tip:"It doesn't show up on the P&L. 수치에 잡히지 않는다는 뜻으로 자주 씁니다."}]},
  {s:"A",en:"Fair point. Still, checking a draft you didn't write beats staring at a blank page.",
   ko:"타당한 지적이에요. 그래도 남이 쓴 초안을 확인하는 게 빈 화면을 노려보는 것보단 낫죠.",
   notes:[{t:"Fair point.",k:"colloquial",m:"타당한 지적입니다",tip:"상대 지적을 짧게 인정하고 넘어갈 때 씁니다. 토론의 호흡을 끊지 않습니다."},
          {t:"A beats B",k:"collocation",m:"A가 B보다 낫다",tip:"better than의 구어형입니다. Anything beats doing nothing."}]},
  {s:"B",en:"I'll give you that. The first draft was always the slowest part for my team.",
   ko:"그건 인정할게요. 우리 팀도 첫 초안이 늘 제일 오래 걸렸어요.",
   notes:[{t:"I'll give you that.",k:"idiom",m:"그건 인정합니다",tip:"전부는 아니고 그 한 가지만 인정한다는 뉘앙스입니다. 반박 전에 붙이면 좋습니다."}]},
  {s:"A",en:"So the real risk isn't unemployment. It's people signing off on work they never read.",
   ko:"그래서 진짜 위험은 실업이 아닙니다. 읽지도 않은 문서에 결재하는 사람들이죠.",
   notes:[{t:"sign off on ~",k:"business",m:"~을 승인하다, 결재하다",tip:"서명으로 책임을 지는 행위입니다. Who signed off on this? 는 책임 추궁입니다."}]},
  {s:"B",en:"We've had a near miss with exactly that. A number went out that nobody had traced.",
   ko:"그것 때문에 아찔했던 적이 있어요. 아무도 출처를 되짚지 않은 숫자가 나갔거든요.",
   notes:[{t:"a near miss",k:"business",m:"아차사고 — 크게 날 뻔한 사고",tip:"「거의 놓쳤다」가 아니라 「거의 사고였다」입니다. 뜻을 반대로 잡기 쉽습니다."},
          {t:"go out",k:"phrasal",m:"(문서·제품이) 나가다",tip:"before it goes out = 나가기 전에. 대외 발송을 뜻합니다."}]},
  {s:"A",en:"That's the accountability gap. The tool has no skin in the game; the signer carries it.",
   ko:"그게 책임의 공백입니다. 도구는 걸린 게 없고, 위험은 결재자가 집니다.",
   notes:[{t:"skin in the game",k:"idiom",m:"자기 것이 걸려 있음",tip:"He has no skin in the game. 손해를 함께 지지 않는 사람을 가리킵니다."},
          {t:"carry the risk",k:"collocation",m:"위험을 떠안다",tip:"bear the risk보다 구어적입니다. Who carries the risk here?"}]},
  {s:"B",en:"Then the answer is process, not policy. Somebody's name stays on the document.",
   ko:"그럼 답은 정책이 아니라 프로세스네요. 문서에는 누군가의 이름이 남아야죠.",
   notes:[{t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"답의 성격을 좁힐 때 씁니다. 앞 회차에서도 나온 골격이라 여기서 굳혀 두세요."}]},
  {s:"A",en:"Agreed. We train people to ask where a claim came from, not whether it reads well.",
   ko:"동의합니다. 문장이 매끄러운지가 아니라 그 주장이 어디서 왔는지 묻도록 훈련하는 거죠.",
   notes:[{t:"where ~ came from",k:"grammar",m:"~이 어디서 왔는지",tip:"간접의문문이라 어순이 주어+동사입니다. ask/know/check 뒤에 붙습니다."},
          {t:"read well",k:"collocation",m:"(글이) 잘 읽히다",tip:"It reads well but says nothing. 형식과 내용을 가를 때 씁니다."}]},
  {s:"B",en:"Honestly, we never taught that. We taught people to produce, almost never to audit.",
   ko:"솔직히 그건 가르친 적이 없어요. 생산하는 법은 가르쳤지만 검증하는 법은 거의 안 가르쳤죠.",
   notes:[{t:"audit",k:"business",m:"(자료·과정을) 따져 검증하다",tip:"회계 감사만이 아닙니다. audit the numbers / audit a process 로 널리 씁니다."}]},
  {s:"A",en:"Give it a year. That becomes the difference between two people with the same title.",
   ko:"1년만 지나 보세요. 같은 직급을 단 두 사람을 가르는 차이가 그겁니다.",
   notes:[{t:"Give it a year.",k:"colloquial",m:"1년만 지나 보세요",tip:"시간이 증명할 거라는 뜻입니다. Give it time. 도 같은 계열입니다."},
          {t:"the difference between A and B",k:"collocation",m:"A와 B를 가르는 차이",tip:"between 뒤에 두 대상을 나란히 놓습니다."}]},
  {s:"B",en:"Then let's call it a judgment problem, not a tools problem. Budget owners fund that.",
   ko:"그럼 이걸 도구 문제가 아니라 판단력 문제라고 부릅시다. 예산 쥔 사람들은 그쪽에 돈을 대니까요.",
   notes:[{t:"call it A, not B",k:"grammar",m:"이걸 B가 아니라 A라고 부르자",tip:"문제의 이름을 바꿔 예산을 따내는 화법입니다. 실무에서 매우 유용합니다."},
          {t:"budget owner",k:"business",m:"예산을 쥔 사람",tip:"결정권자를 가리키는 실무어입니다. Who's the budget owner on this?"}]}

{
 id:"w1d3", day:3, cat:"국제정세·안보", level:"B2+",
 title:"Supply Chains Learn to Worry",
 titleKo:"공급망이 불안을 배우다 — 효율에서 회복탄력성으로",
 names:{A:"Julia (구매)", B:"Marc (전략)"},
 brief:[
  "수십 년간 글로벌 공급망의 설계 원칙은 <b>효율(just-in-time)</b>이었다. 재고를 최소화하고, 가장 싼 곳에서 조달하고, 공급처를 하나로 모아 단가를 낮추는 방식이다.",
  "팬데믹과 지정학적 충돌을 겪으며 원칙이 <b>회복탄력성(just-in-case)</b>으로 이동했다. 이중 조달(dual sourcing), 재고 완충, 지역 분산이 다시 비용을 감수할 가치가 있는 것으로 평가된다.",
  "여기에 <b>수출통제(export controls)</b>와 <b>프렌드쇼어링(friend-shoring)</b>이 겹친다. 어디서 만드느냐가 단가 문제가 아니라 <b>정치적 노출(exposure)</b>의 문제가 되었다.",
  "다만 회복탄력성은 공짜가 아니다. 이중화는 규모의 경제를 깎고, 재고는 자금을 묶는다. 실무의 질문은 '분산하느냐'가 아니라 <b>'어디까지 이중화할 것인가'</b>다."
 ],
 lines:[
  {s:"A",en:"Procurement wants to dual-source the alloy. Finance says we're gold-plating a risk that hasn't cost us anything.",
   ko:"구매는 그 합금을 이중 조달하자 하고, 재무는 아직 손해도 안 낸 리스크에 과하게 돈을 쓴다고 합니다.",
   notes:[{t:"dual-source",k:"business",m:"공급처를 둘로 나누어 조달하다",tip:"single-source의 반대입니다. 명사는 dual sourcing."},
          {t:"gold-plate",k:"idiom",m:"필요 이상으로 값비싸게 만들다",tip:"gold-plating the spec = 사양을 과하게 올리다. 비용 논쟁의 단골입니다."}]},
  {s:"B",en:"Both are right inside their own frame. That's why this always ends in a standoff.",
   ko:"각자 자기 틀 안에서는 둘 다 맞아요. 그래서 늘 교착으로 끝나는 겁니다.",
   notes:[{t:"inside one's own frame",k:"collocation",m:"자기 틀 안에서는",tip:"같은 사실을 다르게 보는 이유를 설명할 때 씁니다."},
          {t:"a standoff",k:"business",m:"교착 상태",tip:"We're in a standoff. 어느 쪽도 물러서지 않는 상태입니다."}]},
  {s:"A",en:"For thirty years the rule was simple: squeeze inventory and chase the lowest landed cost.",
   ko:"30년간 규칙은 단순했어요. 재고는 쥐어짜고 도착원가가 가장 낮은 곳을 좇는 것.",
   notes:[{t:"landed cost",k:"business",m:"도착원가 — 운임·관세까지 더한 값",tip:"단가만 보면 안 된다는 뜻으로 씁니다. 구매 협상의 기준선입니다."},
          {t:"squeeze inventory",k:"collocation",m:"재고를 최소로 줄이다",tip:"squeeze the supplier / squeeze margins 로도 씁니다."}]},
  {s:"B",en:"And it worked beautifully until the day it didn't. Every textbook will add that line.",
   ko:"안 통하는 날이 오기 전까지는 훌륭하게 돌아갔죠. 교과서마다 그 문장을 덧붙이게 될 겁니다.",
   notes:[{t:"until the day it didn't",k:"idiom",m:"안 통하는 날이 오기 전까지는",tip:"성공이 갑자기 무너진 이야기를 요약하는 관용구입니다. 통째로 외워 두세요."}]},
  {s:"A",en:"Now the same executives who preached just-in-time want buffer stock, by the end of the quarter.",
   ko:"이제는 적시 생산을 설파하던 그 임원들이 완충 재고를 두라고 합니다. 그것도 분기 안에요.",
   notes:[{t:"just-in-time",k:"business",m:"적시 생산 — 재고를 두지 않는 방식",tip:"JIT로 줄여 씁니다. 반대 개념이 buffer stock입니다."},
          {t:"buffer stock",k:"business",m:"완충 재고",tip:"흔들림을 흡수하려고 두는 재고입니다. safety stock과 거의 같이 씁니다."}]},
  {s:"B",en:"To be fair, the ground shifted under them. Cost isn't the only variable anymore.",
   ko:"공정하게 말하면 그들 발밑의 판이 바뀐 겁니다. 이제 비용만이 변수는 아니죠.",
   notes:[{t:"To be fair, ~",k:"idiom",m:"공정하게 말하자면",tip:"상대편을 변호하며 균형을 잡는 말입니다. 토론에서 신뢰를 줍니다."},
          {t:"the ground shifted",k:"idiom",m:"판이 바뀌었다",tip:"전제 자체가 변했다는 뜻입니다. The ground has shifted under all of us."}]},
  {s:"A",en:"You mean export controls. Where you make something now decides who can buy it.",
   ko:"수출통제 말이군요. 이제는 어디서 만드느냐가 누가 살 수 있는지를 정하죠.",
   notes:[{t:"export controls",k:"business",m:"수출통제",tip:"특정 국가·기업에 팔 수 없게 하는 규제입니다. 복수로 씁니다."},
          {t:"Where you ~ decides who ~",k:"grammar",m:"어디서 ~하느냐가 누가 ~하는지를 정한다",tip:"의문사절을 주어로 세운 형태입니다. 인과를 압축해 말할 때 강력합니다."}]},
  {s:"B",en:"Exactly. Geography used to be a cost question. It's a permission question now.",
   ko:"바로 그겁니다. 지리는 예전엔 비용 문제였어요. 지금은 허가 문제죠.",
   notes:[{t:"used to be A. It's B now.",k:"grammar",m:"예전엔 A였는데 지금은 B다",tip:"두 문장으로 끊어 대비시키는 형태입니다. 한 문장에 밀어 넣지 마세요."}]},
  {s:"A",en:"My counterpart in Nagoya keeps hinting at that, without ever saying it outright.",
   ko:"나고야 쪽 담당자가 계속 그걸 암시해요. 한 번도 대놓고 말하지는 않고요.",
   notes:[{t:"hint at ~",k:"phrasal",m:"~을 넌지시 비치다",tip:"suggest보다 약하고 간접적입니다. He hinted at a delay."},
          {t:"outright",k:"collocation",m:"대놓고, 노골적으로",tip:"say it outright / refuse outright. 직설의 정도를 나타냅니다."}]},
  {s:"B",en:"Nobody in that position says it outright. They ask where your feedstock comes from.",
   ko:"그 자리에 있는 사람은 아무도 대놓고 말 안 해요. 원료가 어디서 오는지 물을 뿐이죠.",
   notes:[{t:"where ~ comes from",k:"grammar",m:"~이 어디서 오는지",tip:"간접의문문입니다. ask 뒤라도 어순은 주어+동사 그대로입니다."},
          {t:"feedstock",k:"business",m:"원료",tip:"제조업에서 투입 원자재를 가리키는 표준어입니다."}]},
  {s:"A",en:"So we're asked to prove a negative. An auditor can never finish that.",
   ko:"결국 없다는 걸 증명하라는 요구네요. 감사인이 절대 끝낼 수 없는 일이죠.",
   notes:[{t:"prove a negative",k:"idiom",m:"없다는 것을 증명하다 (불가능한 요구)",tip:"You can't prove a negative. 부당한 입증 요구를 반박할 때 씁니다."}]},
  {s:"B",en:"It's expensive. But resilience always shows up as a line item somewhere in the end.",
   ko:"비싸죠. 그래도 회복탄력성은 결국 어딘가 비용 항목으로 반드시 나타납니다.",
   notes:[{t:"a line item",k:"business",m:"(예산·청구서의) 개별 항목",tip:"숨은 비용이 결국 장부에 잡힌다는 뜻으로 씁니다."},
          {t:"show up as ~",k:"phrasal",m:"~의 형태로 나타나다",tip:"It shows up as overtime. 원인이 다른 곳에서 드러날 때 씁니다."}]},
  {s:"A",en:"Fine, but redundancy isn't free. Two suppliers means half the volume, and volume is our discount.",
   ko:"좋아요. 그래도 이중화가 공짜는 아닙니다. 공급처가 둘이면 물량이 절반이고, 할인은 물량에서 나오죠.",
   notes:[{t:"redundancy",k:"business",m:"이중화 — 예비를 두는 것",tip:"영국식으로는 「정리해고」라는 다른 뜻도 있으니 문맥에 주의하세요."}]},
  {s:"B",en:"Which kills the leverage you rely on at renewal. I've had that argument twice.",
   ko:"그럼 재계약 때 기대던 협상력이 죽죠. 저도 그 논쟁을 두 번 했습니다.",
   notes:[{t:"leverage",k:"business",m:"협상력, 지렛대",tip:"We lose leverage. 물량·대안·시간이 협상력의 원천입니다."},
          {t:"rely on ~",k:"phrasal",m:"~에 기대다",tip:"depend on보다 「믿고 맡긴다」는 무게가 있습니다."}]},
  {s:"A",en:"So where do you actually draw the line, in a way that survives the first challenge?",
   ko:"그럼 선을 실제로 어디에 긋죠? 첫 반론 앞에서 버틸 수 있는 방식으로요.",
   notes:[{t:"draw the line",k:"idiom",m:"선을 긋다, 기준을 정하다",tip:"Where do you draw the line? 기준을 묻는 정석 질문입니다."}]},
  {s:"B",en:"Only where a single failure stops the whole line. Everything else stays single-sourced.",
   ko:"한 번 끊기면 라인 전체가 멈추는 곳만요. 나머지는 단일 조달로 갑니다.",
   notes:[{t:"single-sourced",k:"business",m:"단일 공급처로 조달되는",tip:"dual-source의 반대입니다. 형용사로 씁니다."}]},
  {s:"A",en:"That I can defend in front of the committee, because anyone can apply that rule.",
   ko:"그거라면 위원회 앞에서 방어할 수 있겠네요. 누구나 적용할 수 있는 규칙이니까요.",
   notes:[{t:"That I can ~",k:"grammar",m:"그거라면 ~할 수 있다",tip:"목적어를 앞으로 뺀 도치입니다. 앞말과 대비를 줄 때 원어민이 즐겨 씁니다."},
          {t:"defend a decision",k:"collocation",m:"결정을 방어하다",tip:"설명이 아니라 「반론을 견딘다」는 뜻입니다."}]},
  {s:"B",en:"And frame it as insurance, not as distrust of a supplier who's never failed us.",
   ko:"그리고 한 번도 우리를 저버린 적 없는 공급사에 대한 불신이 아니라 보험이라고 프레임을 잡으세요.",
   notes:[{t:"frame it as ~",k:"business",m:"~으로 규정해 보이게 하다",tip:"같은 사실도 표현에 따라 받아들여지는 방식이 달라집니다. 사내 설득의 핵심 기술입니다."}]},
  {s:"A",en:"Especially a partner of twenty years who has absorbed more than one of our mistakes.",
   ko:"20년 거래했고 우리 실수까지 여러 번 떠안아 준 파트너라면 더욱 그렇죠.",
   notes:[{t:"absorb a mistake",k:"collocation",m:"(남의) 실수를 떠안아 주다",tip:"absorb the cost / absorb the delay 로도 씁니다."}]},
  {s:"B",en:"Then we're aligned. Let me write it up tonight and send it round before Monday.",
   ko:"그럼 뜻이 맞았네요. 오늘 밤에 정리해서 월요일 전에 돌리겠습니다.",
   notes:[{t:"we're aligned",k:"business",m:"뜻이 맞았다, 방향이 일치한다",tip:"회의를 매듭짓는 표현입니다. Are we aligned? 로 확인도 합니다."},
          {t:"write it up",k:"phrasal",m:"문서로 정리하다",tip:"말로 합의한 것을 글로 옮기는 단계입니다. send it round = 관계자에게 돌리다."}]}
 ],
 keys:[
  {en:"To be fair, ~",ko:"공정하게 말하자면 ~",ex:"To be fair, they warned us in January."},
  {en:"the ground shifted",ko:"판(전제)이 바뀌었다",ex:"The ground shifted when the tariffs came in."},
  {en:"draw the line",ko:"한계를 긋다",ex:"We draw the line at critical components."},
  {en:"landed cost",ko:"도착원가",ex:"Compare landed cost, not list price."},

  {en:"we're aligned",ko:"의견이 일치했습니다",ex:"Good — we're aligned on scope, then."},

 ],
 out:[

{
 id:"w1d4", day:4, cat:"리더십·조직갈등", level:"B2+",
 title:"The Meeting Where Nobody Says Anything",
 titleKo:"아무도 말하지 않는 회의 — 침묵과 갈등의 두 얼굴",
 names:{A:"Priya (팀장)", B:"Tom (동료 팀장)"},
 brief:[
  "조직심리학에서 갈등은 두 종류로 나뉜다. <b>task conflict(과업 갈등)</b>은 '무엇이 옳은가'를 두고 다투는 것이고, <b>relationship conflict(관계 갈등)</b>은 사람 자체를 겨냥한다. 전자는 성과를 높일 수 있지만, 후자는 거의 항상 성과를 깎는다.",
  "문제는 둘이 쉽게 섞인다는 점이다. 과업 갈등이 오래 방치되면 인신공격으로 변질되고, 그때부터 팀은 <b>말을 아끼기(hold back)</b> 시작한다.",
  "에이미 에드먼슨의 <b>psychological safety(심리적 안전감)</b> 연구가 말하는 핵심은 '사이좋은 팀'이 아니라, <b>반대 의견을 냈을 때 벌 받지 않는다는 확신</b>이다. 안전한 팀은 오히려 실수를 더 많이 보고한다.",
  "리더가 쓸 수 있는 가장 값싼 도구는 <b>말하는 순서</b>다. 상급자가 먼저 결론을 말하면 반대 의견은 사라진다(anchoring). 그래서 '리더가 마지막에 말하기'가 실전 처방으로 자주 권장된다."

 lines:[
  {s:"A",en:"Something's off in my team meetings. Everyone agrees, and then nothing actually improves.",
   ko:"우리 팀 회의가 뭔가 이상해요. 다들 동의하는데 정작 나아지는 게 없습니다.",
   notes:[{t:"Something's off.",k:"colloquial",m:"뭔가 이상합니다",tip:"원인은 모르지만 낌새가 이상할 때 씁니다. Something's off with these numbers."}]},
  {s:"B",en:"That's usually not agreement. That's a room waiting for the meeting to end.",
   ko:"그건 보통 동의가 아니에요. 회의가 끝나기만 기다리는 방이죠.",
   notes:[{t:"a room",k:"colloquial",m:"그 자리에 모인 사람들 전체",tip:"read the room = 분위기를 읽다. 사람들을 방으로 대신 가리킵니다."}]},
  {s:"A",en:"Ouch. Fair, though. Silence is easy to mistake for buy-in when you called the meeting.",
   ko:"아프네요. 그래도 맞는 말입니다. 회의를 소집한 사람은 침묵을 동의로 착각하기 쉽죠.",
   notes:[{t:"buy-in",k:"business",m:"(구성원의) 진짜 동의와 참여",tip:"get buy-in from the team. 형식적 승인과 구별되는 말입니다."},
          {t:"mistake A for B",k:"collocation",m:"A를 B로 착각하다",tip:"mistake silence for agreement. 전치사 for가 핵심입니다."}]},
  {s:"B",en:"Can I ask something blunt? Do you speak before or after your team does?",
   ko:"직설적으로 하나 물어도 될까요? 팀원들보다 먼저 말합니까, 나중에 말합니까?",
   notes:[{t:"blunt",k:"colloquial",m:"돌려 말하지 않는, 직설적인",tip:"Can I be blunt? 무례해지기 전에 양해를 구하는 정형입니다."}]},
  {s:"A",en:"Before, obviously. I give direction so nobody spends a week on something I'd reject.",
   ko:"당연히 먼저죠. 제가 반려할 걸 붙잡고 일주일 쓰는 일이 없게 방향을 주는 겁니다.",
   notes:[{t:"give direction",k:"collocation",m:"방향을 제시하다",tip:"give feedback / give guidance와 함께 관리자 어휘로 묶어 두세요."}]},
  {s:"B",en:"Then you anchored the room before it opened. After that, disagreeing costs them something.",
   ko:"그럼 회의가 열리기도 전에 방향을 고정한 겁니다. 그다음부터 반대는 그들에게 대가를 물리죠.",
   notes:[{t:"anchor the room",k:"idiom",m:"먼저 말해 논의를 한쪽에 고정시키다",tip:"anchoring은 협상·심리학 용어입니다. 첫 숫자가 기준이 되는 현상입니다."},
          {t:"cost someone something",k:"collocation",m:"~에게 대가를 치르게 하다",tip:"It cost him his credibility. 돈이 아닌 대가에도 씁니다."}]},
  {s:"A",en:"I hear that often. Doesn't a leader who never states a view look weak?",
   ko:"그런 말 자주 듣습니다. 그런데 의견을 한 번도 안 내는 리더는 약해 보이지 않나요?",
   notes:[{t:"state a view",k:"collocation",m:"의견을 밝히다",tip:"have a view / state a view / hold a view 로 이어 씁니다."}]},
  {s:"B",en:"Lead the question, not the answer. Ask first, decide last. It costs you almost nothing.",
   ko:"답이 아니라 질문을 이끄세요. 먼저 묻고 마지막에 결정하는 겁니다. 잃을 게 거의 없어요.",
   notes:[{t:"Ask first, decide last.",k:"idiom",m:"먼저 묻고 마지막에 결정하라",tip:"회의 운영 원칙을 네 단어로 압축한 말입니다. 그대로 인용해 쓰세요."},
          {t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"명령문 두 개를 대비시켜 원칙을 만듭니다. Lead the question, not the answer."}]},
  {s:"A",en:"And when disagreement finally comes out, it gets personal faster than I can stop it.",
   ko:"그리고 막상 이견이 터져 나오면, 제가 멈추기도 전에 감정 싸움이 됩니다.",
   notes:[{t:"get personal",k:"idiom",m:"인신공격으로 흐르다",tip:"Let's not get personal. 논점과 사람을 가르라는 경고입니다."},
          {t:"come out",k:"phrasal",m:"(숨어 있던 것이) 드러나다",tip:"The real objection came out at the end."}]},
  {s:"B",en:"That's the line to watch. Arguing about the plan is healthy; about the person, never.",

  {s:"A",en:"How do you pull it back once a team has crossed that line?",
   ko:"팀이 이미 그 선을 넘었다면 어떻게 되돌리죠?",

  {s:"A",en:"That feels risky. You're putting the tension on the table in front of everyone.",
   ko:"위험해 보이는데요. 모두 앞에서 긴장을 테이블 위로 올리는 거잖아요.",
   notes:[{t:"put ~ on the table",k:"idiom",m:"~을 공개적으로 꺼내 놓다",tip:"put an offer on the table = 제안을 내놓다. 협상에서도 씁니다."}]},
  {s:"B",en:"It is risky. It's also the only thing that stops it running under everything else.",
   ko:"위험하죠. 하지만 그래야만 그게 다른 모든 일 밑에서 계속 흐르는 걸 멈춥니다.",
   notes:[{t:"It is risky. It's also ~",k:"grammar",m:"위험하죠. 그런데 동시에 ~이기도 합니다",tip:"인정하고 뒤집는 두 문장 골격입니다. 반박이 아니라 보완으로 들립니다."}]},
  {s:"A",en:"My worry is people reading it as me picking a side. Managers don't recover from that.",
   ko:"제 걱정은 사람들이 그걸 제가 편드는 걸로 읽는 겁니다. 관리자는 거기서 회복이 안 되죠.",

          {t:"read A as B",k:"collocation",m:"A를 B로 받아들이다",tip:"They'll read silence as agreement. 의도가 아니라 인상을 말합니다."}]},
  {s:"B",en:"Then describe the behavior, not the character. Late data is a fact; careless is a verdict.",
   ko:"그럼 성격이 아니라 행동을 묘사하세요. 「자료가 늦었다」는 사실이고 「부주의하다」는 판결입니다.",

          {t:"a verdict",k:"collocation",m:"판결 — 사실이 아닌 단정",tip:"deliver a verdict. 상대가 반박할 수 없게 만드는 말이라는 뜻이 깔립니다."}]},
  {s:"A",en:"That distinction alone would have saved me two arguments last quarter, both still costing me.",

   notes:[{t:"would have + 과거분사",k:"grammar",m:"그랬다면 ~했을 텐데",tip:"실제로는 하지 않은 일을 되짚습니다. That would have saved us a week."}]},
  {s:"B",en:"Do one more thing. Thank the first person who disagrees, in front of everyone.",

{
 id:"w1d5", day:5, cat:"에너지", level:"B2+",
 title:"The Grid Is the Bottleneck",
 titleKo:"병목은 전력망이다 — 재생에너지와 산업의 열",
 names:{A:"Hana (설비)", B:"Owen (에너지 담당)"},
 brief:[
  "재생에너지의 근본 과제는 발전 단가가 아니라 <b>간헐성(intermittency)</b>이다. 태양광·풍력은 필요한 시간이 아니라 자연이 허락하는 시간에 발전한다.",
  "그래서 초점이 발전기에서 <b>전력망(grid)</b>과 <b>저장(storage)</b>으로 옮겨간다. 배터리는 시간 단위 이동에는 강하지만, 며칠 단위의 <b>장주기 저장(long-duration storage)</b>은 여전히 어려운 문제다.",
  "송전선 건설은 기술이 아니라 <b>인허가(permitting)</b>와 부지 문제로 지연되는 경우가 많다. 전력 수요지와 발전 적지가 지리적으로 어긋나 있기 때문이다.",
  "제조업의 진짜 난제는 전기가 아니라 <b>고온의 열(industrial heat)</b>이다. 철강의 경우 석탄 대신 수소를 쓰는 <b>수소환원제철(hydrogen-based direct reduction)</b>이 논의되지만, 저렴한 청정 수소와 대규모 전력이 전제 조건이다."
 ],
 lines:[
  {s:"A",en:"The board wants a single number for going green. It isn't a one-slide number.",
   ko:"이사회가 친환경 전환을 숫자 하나로 달라는데, 장표 한 장에 담길 숫자가 아닙니다.",
   notes:[{t:"go green",k:"collocation",m:"친환경으로 전환하다",tip:"go digital / go remote와 같은 형태입니다. go + 형용사로 전환을 나타냅니다."},
          {t:"a one-slide number",k:"colloquial",m:"장표 한 장에 담기는 단순한 숫자",tip:"명사 앞에 하이픈으로 묶어 형용사를 만드는 방식입니다. a two-minute answer."}]},
  {s:"B",en:"It never is. Generation cost is the easy half, and it's the half everybody quotes.",
   ko:"당연히 아니죠. 발전 단가는 쉬운 쪽 절반이고, 다들 그것만 인용합니다.",
   notes:[{t:"the easy half",k:"collocation",m:"쉬운 쪽 절반",tip:"the hard half와 짝으로 씁니다. 문제를 둘로 갈라 보이는 화법입니다."}]},
  {s:"A",en:"Right. Solar is cheap at noon and worth nothing at seven in the evening.",

   notes:[{t:"worth nothing",k:"collocation",m:"아무 값어치가 없는",tip:"worth은 형용사입니다. worth a lot / worth nothing으로 폭을 나타냅니다."}]},
  {s:"B",en:"That's intermittency in one line. The power comes when nature decides, not when we need it.",
   ko:"그게 간헐성을 한 줄로 말한 겁니다. 전기는 우리가 필요할 때가 아니라 자연이 정한 때 나오죠.",
   notes:[{t:"intermittency",k:"business",m:"간헐성 — 있다 없다 하는 성질",tip:"재생에너지 논의의 핵심어입니다. 형용사는 intermittent."},
          {t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"앞뒤에 같은 형태를 놓아 대비시킵니다. when nature decides, not when we need it."}]},
  {s:"A",en:"So we store it. Battery costs have come down a long way, haven't they?",
   ko:"그럼 저장하죠. 배터리 값이 많이 내려오지 않았나요?",

          {t:"~, haven't they?",k:"grammar",m:"부가의문문 — 그렇지 않나요",tip:"앞 문장이 긍정이면 부정으로 되묻습니다. 동의를 청하는 부드러운 확인입니다."}]},
  {s:"B",en:"For a few hours, yes. For a windless week in winter, not even close.",
   ko:"몇 시간짜리는요. 바람 없는 겨울 한 주는 어림도 없습니다.",

  {s:"A",en:"That's the long-duration problem everyone shows on slide one and forgets by the appendix.",
   ko:"그게 다들 첫 장에서 보여 주고 부록에 가서는 잊는 장주기 저장 문제군요.",
   notes:[{t:"long-duration",k:"business",m:"장주기 — 오래 버티는",tip:"long-duration storage. 몇 시간이 아니라 며칠을 버티는 저장을 뜻합니다."}]},

  {s:"A",en:"Transmission. Everyone forgets the boring part, and the boring part decides everything else.",
   ko:"송전이요. 다들 지루한 부분을 잊는데, 나머지를 정하는 게 그 부분입니다.",

  {s:"B",en:"It isn't a technology problem either. It's permitting, land, and local objections.",

          {t:"local objections",k:"collocation",m:"주민 반대",tip:"raise an objection / withdraw an objection으로도 씁니다."}]},
  {s:"A",en:"Which takes a decade, while a plant takes three years. The timelines don't line up.",
   ko:"그건 10년 걸리는데 발전소는 3년이면 됩니다. 일정이 안 맞죠.",

  {s:"B",en:"That mismatch is the whole story, and it never makes it into the headline.",
   ko:"그 불일치가 이야기의 전부인데, 기사 제목에는 절대 안 들어갑니다.",

  {s:"B",en:"That's the harder half. High-temperature heat is where the easy answers run out.",

  {s:"A",en:"Hydrogen keeps coming up in every presentation, usually on a slide nobody defends.",

  {s:"B",en:"It's chemically sound. The catch is that clean hydrogen needs cheap, steady power.",

  {s:"B",en:"Which is why I'd rather spend the meeting on power contracts than on slogans.",

{
 id:"w1d6", day:6, cat:"심리·학습", level:"B2+",
 title:"Why You Forget What You Just Read",
 titleKo:"방금 읽은 걸 잊는 이유 — 기억과 학습의 작동 방식",
 names:{A:"Dan (교육팀)", B:"Mia (인지심리 전공)"},
 brief:[
  "학습 연구에서 가장 반복적으로 확인된 두 가지가 <b>spacing effect(간격 효과)</b>와 <b>retrieval practice(인출 연습)</b>다. 몰아서 보는 것보다 나눠서 보는 것이, 다시 읽는 것보다 <b>기억에서 꺼내 보는 것</b>이 오래간다.",
  "다시 읽기가 인기 있는 이유는 <b>fluency illusion(유창성 착각)</b> 때문이다. 눈에 익어 술술 읽히면 '안다'고 느끼지만, 그 매끄러움은 이해가 아니라 익숙함의 신호일 뿐이다.",
  "그래서 효과적인 학습은 대체로 <b>불편하다</b>. 어렵게 꺼낼수록 기억은 단단해지는데, 이를 <b>desirable difficulty(바람직한 어려움)</b>라고 부른다.",
  "수면은 학습의 마무리 공정에 가깝다. 잠자는 동안 기억이 정리·강화되는 <b>consolidation(공고화)</b>이 일어나므로, 밤을 새워 채워 넣는 방식은 투입 대비 손해가 크다."
 ],
 lines:[

   notes:[{t:"to save my life",k:"idiom",m:"죽었다 깨어나도 (못 한다)",tip:"반드시 부정문에 씁니다. I can't sing to save my life."}]},
  {s:"B",en:"That isn't a memory defect. That's what reading does if you never test yourself.",
   ko:"그건 기억력 결함이 아닙니다. 스스로 시험하지 않으면 읽기가 원래 그래요.",
   notes:[{t:"That's what ~ does",k:"grammar",m:"~이 하는 일이 원래 그렇다",tip:"현상을 정상으로 규정해 상대를 안심시키는 화법입니다."}]},
  {s:"A",en:"But it felt easy while I was reading. Everything made sense on the page.",

  {s:"B",en:"That's the trap. Smooth reading feels like understanding, but you're measuring familiarity.",
   ko:"그게 함정입니다. 매끄럽게 읽히면 이해처럼 느껴지지만 재고 있는 건 익숙함이죠.",
   notes:[{t:"That's the trap.",k:"colloquial",m:"그게 바로 함정입니다",tip:"상대가 빠진 착각을 짚어 줄 때 씁니다."},
          {t:"familiarity",k:"business",m:"익숙함 — 안다는 착각의 원인",tip:"familiar with ~ 에서 온 명사입니다. 이해와 구별해야 할 개념입니다."}]},
  {s:"A",en:"So I should close the file and say it out loud before looking again?",

  {s:"B",en:"That's the whole trick, and it's annoyingly simple. Pull it out instead of putting it in.",

  {s:"A",en:"I've heard that, but rereading feels productive because I get through more pages.",

  {s:"B",en:"Pages aren't the unit that matters. What you can retrieve cold is what counts.",

  {s:"B",en:"By a wide margin, and it's one of the oldest findings we have.",

  {s:"A",en:"Then why does everyone still cram the night before an important review?",

          {t:"drain away",k:"phrasal",m:"서서히 빠져나가다",tip:"Confidence drained away. 물이 빠지듯 사라지는 모습입니다."}]},
  {s:"A",en:"Where does sleep fit in? Most people treat it as time they can borrow.",

  {s:"B",en:"It's closer to the final step. What you learned gets filed while you're out.",
   ko:"수면은 오히려 마지막 공정에 가깝습니다. 자는 동안 배운 게 정리되어 보관되죠.",

  {s:"A",en:"So pulling an all-nighter borrows against the one process that does the filing.",

{
 id:"w1d7", day:7, cat:"문화·트렌드", level:"B2+",
 title:"Where Work Happens Now",
 titleKo:"일은 이제 어디서 일어나는가 — 하이브리드 근무와 도시",
 names:{A:"Sofia (HR)", B:"Ken (현업)"},
 brief:[
  "하이브리드 근무 논쟁이 갈리는 이유는 업무의 성격이 다르기 때문이다. <b>집중 업무(deep work)</b>는 원격이 유리하고, <b>조율·신뢰 형성</b>은 대면이 유리하다는 것이 대체적인 관찰이다.",
  "가장 자주 지적되는 손실은 <b>weak ties(약한 유대)</b>다. 다른 팀 사람과 우연히 마주치는 접점이 사라지면, 정보는 부서 안에서만 돌게 된다.",
  "재택은 도시 구조도 바꿨다. 도심 오피스 상권의 평일 수요가 줄고 주거지 인근 상권이 살아나는 변화가 여러 도시에서 관찰된다.",
  "실무의 결론은 '주 며칠'이 아니라 <b>어떤 일을 위해 모이는가</b>이다. 출근한 날에 각자 헤드폰을 끼고 화상회의만 한다면, 이동 시간만 지불한 셈이 된다."

 lines:[
  {s:"A",en:"Leadership wants everyone back four days a week. I'm not sure that's the question.",

  {s:"A",en:"Not how many days, but what we come in for. Those are different policies.",

          {t:"come in",k:"phrasal",m:"출근하다",tip:"come in on Monday / come into the office. 사무실 기준의 동사입니다."}]},

  {s:"A",en:"Which is the worst of both worlds. You pay the commute and keep the isolation.",

   notes:[{t:"the worst of both worlds",k:"idiom",m:"양쪽의 나쁜 점만 합친 것",tip:"반대는 the best of both worlds입니다. 반드시 짝으로 외우세요."}]},
  {s:"B",en:"Right. But I'd defend the office for one thing: I learn things by accident.",

  {s:"A",en:"That's the weak-tie argument, and it's the strongest one on your side.",

  {s:"B",en:"Explain it the way you'd explain it to my director, who dislikes sociology.",

{
 id:"w2d1", day:8, cat:"품질·리스크", level:"B2+",
 title:"The Recall Nobody Wants to Own",
 titleKo:"아무도 떠안기 싫은 리콜 — 결함과 책임의 경계",
 names:{A:"Grace (품질보증)", B:"Diego (구매·공급망)"},
 brief:[
  "제조 현장에서 결함이 나오면 가장 먼저 정해지는 것은 책임이 아니라 순서다. <b>봉쇄(containment)</b>가 먼저고 <b>시정(corrective action)</b>이 그다음이며, 책임 배분은 마지막이다. 원인을 다 밝히기 전에도 확산은 멈춰야 하기 때문이다.",
  "책임을 가르는 실질적 기준은 <b>입증책임(the burden of proof)</b>이 어디에 놓이느냐다. 공급사는 도면과 규격을 들고 오고, 완성품 업체는 실제 사용 조건을 든다. 계약서의 <b>책임한도(liability cap)</b>가 이 다툼의 상한을 미리 정해 둔다.",
  "리콜의 비용 구조는 <b>확실한 비용 대 불확실한 비용</b>의 대결이다. 지금 회수하면 금액이 확정되고, 미루면 확률은 낮지만 손실이 큰 <b>꼬리위험(tail risk)</b>이 남는다. 둘을 같은 저울에 올리는 순간 판단이 쉬워진다.",
  "그래서 실무에서 진짜로 다투는 것은 「리콜을 하느냐」가 아니라 <b>범위(scope)</b>다. 어느 로트까지, 어느 일련번호까지 포함할 것인가. 이 선을 예산이 아니라 <b>증거</b>로 그어야 나중에 방어할 수 있다."
 ],
 lines:[

   notes:[{t:"trace A to B",k:"collocation",m:"A의 원인을 B까지 되짚다",tip:"trace the fault to a single lot. 원인 조사의 표준 동사입니다."},
          {t:"tolerance",k:"business",m:"공차 — 허용 오차 범위",tip:"tight tolerance = 여유가 적은 공차. 제조 대화의 기본어입니다."}]},
  {s:"B",en:"Hold on. You're already framing this as ours, and the analysis isn't finished.",

  {s:"A",en:"I'm not assigning blame. The burden of proof lands on whoever specified the tolerance.",

  {s:"B",en:"It always does. The supplier will point at our drawing, and we'll be on the hook.",

  {s:"A",en:"So we contain first and argue later. Stop shipments and quarantine the lot today.",

  {s:"B",en:"Containment I can live with. A public recall is a different animal entirely.",

  {s:"A",en:"Agreed. But if it surfaces through a customer instead of us, it comes back to bite us.",

  {s:"B",en:"You're assuming it surfaces at all. Most of that batch will never see a real load.",

  {s:"B",en:"Careful. That cuts the other way. Erring on the side of caution isn't free either.",

{
 id:"w2d2", day:9, cat:"환경·통상", level:"B2+",
 title:"Paying for Carbon at the Border",
 titleKo:"국경에서 탄소값을 치르다 — 배출 규제와 수출 경쟁력",
 names:{A:"Lena (환경·규제 대응)", B:"Hugo (수출영업)"},
 brief:[
  "배출에 값이 매겨지면 원가 구조가 바뀐다. 지금까지 원가는 원료와 에너지였지만, <b>탄소 가격(carbon pricing)</b>이 붙는 순간 배출량 자체가 비용 항목이 된다. 같은 제품, 같은 공정이라도 어디서 어떻게 만들었는지가 값을 가른다.",
  "국경에서 조정이 일어나는 이유는 <b>탄소 누출(carbon leakage)</b> 때문이다. 규제가 강한 나라의 공장이 규제가 약한 나라로 옮겨 가면 배출은 그대로인 채 산업만 빠져나간다. 그래서 수입품에도 같은 값을 물려 <b>공정한 경쟁 조건(a level playing field)</b>을 맞추려 한다.",
  "실무의 난점은 규제가 아니라 <b>측정</b>이다. 한 톤에 들어 있는 배출량(embedded emissions)을 어떻게 셈하느냐에 따라 누가 얼마를 내는지가 달라진다. 그래서 다툼은 늘 방법론에서 벌어지고, <b>검증(verification)</b>을 거친 숫자만 값을 인정받는다.",
  "영업 쪽에서 갈리는 것은 <b>전가(pass-through)</b>다. 늘어난 비용을 가격에 얹을 수 있는 고객이 있고, 얹는 순간 떠나는 고객이 있다. 검증된 데이터가 있으면 <b>친환경 프리미엄(green premium)</b>이 붙지만, 없으면 그냥 값만 오른 제품이 된다."
 ],
 lines:[
  {s:"A",en:"Once emissions carry a price at the border, our cost base includes how we made it.",

   notes:[{t:"carry a price",k:"collocation",m:"값이 붙다",tip:"carry a cost / carry a penalty로도 씁니다. 무언가에 대가가 따른다는 뜻입니다."},
          {t:"cost base",k:"business",m:"원가 구조",tip:"our cost base is rising. 개별 단가가 아니라 전체 구조를 가리킵니다."}]},
  {s:"B",en:"In theory. In practice, nobody agrees on how to measure what's embedded in a ton.",
   ko:"이론상은요. 현실에선 한 톤에 뭐가 들어 있는지 재는 방법부터 합의가 안 됩니다.",
   notes:[{t:"In theory. In practice, ~",k:"idiom",m:"이론상은 그렇죠. 현실에서는 ~",tip:"두 문장으로 끊어 대비시킵니다. 반박의 정석 리듬입니다."},
          {t:"embedded",k:"business",m:"(제품 안에) 내재된",tip:"embedded carbon / embedded cost. 겉으로 안 보이지만 들어 있는 것입니다."}]},
  {s:"A",en:"It's sold as a level playing field, but measurement decides who actually pays.",
   ko:"공정한 경쟁의 장으로 팔리지만, 실제로 누가 낼지는 측정이 정합니다.",
   notes:[{t:"a level playing field",k:"idiom",m:"모두에게 공정한 경쟁 조건",tip:"기울지 않은 운동장에서 온 비유입니다. 통상·규제 논의의 단골 표현입니다."},
          {t:"be sold as ~",k:"collocation",m:"~이라고 내세워지다",tip:"실제와 다를 수 있다는 뉘앙스가 붙습니다. It was sold as a cost saving."}]},
  {s:"B",en:"Meanwhile my customers want a number today, not a methodology paper next year.",

   notes:[{t:"Meanwhile",k:"collocation",m:"그러는 사이",tip:"이론과 현실을 나란히 놓을 때의 접속부사입니다."}]},
  {s:"A",en:"Give them a range and the assumptions behind it. A wrong precise number costs more.",

   notes:[{t:"the assumptions behind it",k:"collocation",m:"그 뒤에 깔린 전제",tip:"숫자를 낼 때 반드시 함께 밝히라는 실무 원칙입니다."}]},
  {s:"B",en:"Try selling a range to a buyer whose boss wants one figure. They price uncertainty.",
   ko:"상사가 숫자 하나를 원하는 구매자한테 구간을 팔아 보세요. 불확실성에 값을 매깁니다.",
   notes:[{t:"Try -ing",k:"grammar",m:"한번 ~해 보세요 (반어)",tip:"Try explaining that to him. 실제 권유가 아니라 「해 보면 알 것」이라는 반박입니다."},
          {t:"price ~",k:"business",m:"~에 값을 매기다",tip:"price the risk / price uncertainty. 명사 price를 동사로 씁니다."}]},
  {s:"A",en:"Then we verify early and get certified. Verification turns a claim into a discount.",
   ko:"그럼 일찍 검증받고 인증을 얻죠. 검증이 주장을 할인으로 바꿔 줍니다.",

  {s:"B",en:"Certification costs money we'd pass through, and thin-margin customers will walk.",

          {t:"walk",k:"colloquial",m:"(거래를) 그만두고 떠나다",tip:"The customer walked. 협상장을 나가는 이미지입니다."}]},
  {s:"A",en:"Some will. Others pay a premium once their own reporting depends on audited numbers.",
   ko:"일부는요. 자기네 보고가 감사받은 숫자에 걸리는 순간 웃돈을 낼 고객도 있습니다.",
   notes:[{t:"pay a premium",k:"collocation",m:"웃돈을 내다",tip:"charge a premium(웃돈을 받다)과 짝으로 외우세요."}]},
  {s:"B",en:"You're betting their regulators move before ours. That's a big assumption.",
   ko:"그쪽 규제가 우리보다 먼저 움직인다는 데 거시는 거죠. 큰 가정입니다.",
   notes:[{t:"That's a big assumption.",k:"colloquial",m:"그건 큰 가정입니다",tip:"상대 논리의 전제를 겨냥하는 짧은 반박입니다. 회의에서 강력합니다."}]},
  {s:"A",en:"It's not a bet on timing. It's a bet that the direction doesn't reverse.",
   ko:"시점에 거는 게 아닙니다. 방향이 되돌아가지 않는다는 데 거는 겁니다.",
   notes:[{t:"It's not a bet on A. It's a bet that B.",k:"grammar",m:"A에 거는 게 아니라 B에 거는 것이다",tip:"같은 명사를 반복해 초점을 옮깁니다. 오해를 바로잡는 형태입니다."}]},
  {s:"B",en:"Fair enough. Still, if we move first we carry the cost alone for years.",

{
 id:"w2d3", day:10, cat:"인구·노동", level:"B2+",
 title:"The Shift Nobody Can Fill",
 titleKo:"채울 수 없는 교대조 — 고령화와 현장의 기술 전수",
 names:{A:"Ines (인사)", B:"Karl (제조 현장 반장)"},
 brief:[
  "숙련 인력의 은퇴는 인원 문제로 보이지만 실제로는 <b>지식 문제</b>다. 사람이 나가면 자리는 채울 수 있어도, 그 사람 머릿속에만 있던 판단은 함께 나간다. 이것을 <b>암묵지(tacit knowledge)</b>라고 부른다.",
  "암묵지가 어려운 이유는 <b>말로 옮겨지지 않기 때문</b>이다. 소리로 이상을 알아채고, 손끝으로 온도를 가늠하는 판단은 매뉴얼에 담기지 않는다. 그래서 전수는 문서가 아니라 <b>같이 서 있는 시간</b>으로만 일어난다.",
  "현장이 이 문제를 미루는 방식은 대개 <b>초과근무</b>다. 당장은 돌아가지만 격차를 감출 뿐 좁히지는 못한다. 이런 임시 대응을 <b>stopgap</b>이라 하고, 반복되면 은퇴가 몰리는 시점에 한꺼번에 터진다.",
  "자동화는 이 문제의 해답이면서 동시에 함정이다. 기계가 공정을 대신해도 <b>결과가 이상할 때 알아채는 판단</b>은 사람에게 남는다. 그래서 채용과 훈련의 기준이 「손」에서 「판단」으로 옮겨 간다."
 ],
 lines:[
  {s:"A",en:"Three of your senior operators retire within a year, and nobody is shadowing them.",
   ko:"숙련 오퍼레이터 세 분이 1년 안에 은퇴하는데, 붙어 배우는 사람이 없습니다.",
   notes:[{t:"shadow someone",k:"business",m:"옆에 붙어 따라다니며 배우다",tip:"job shadowing = 현장 밀착 학습. 명사로도 동사로도 씁니다."}]},
  {s:"B",en:"You can't shadow forty years of feel in twelve months. Anyone who says otherwise hasn't tried.",
   ko:"40년 몸에 밴 감각을 열두 달 붙어서 배울 순 없어요. 된다는 사람은 해 본 적이 없는 겁니다.",
   notes:[{t:"feel",k:"colloquial",m:"(설명 못 하는) 감각, 손맛",tip:"He has a feel for the machine. 경험에서 온 직관을 뜻합니다."},
          {t:"say otherwise",k:"collocation",m:"그렇지 않다고 말하다",tip:"otherwise = 그와 다르게. 반박을 미리 봉쇄하는 정형입니다."}]},
  {s:"A",en:"I know. But if we do nothing, that knowledge walks out the door with them.",
   ko:"압니다. 그런데 아무것도 안 하면 그 지식이 그분들과 함께 걸어 나갑니다.",
   notes:[{t:"walk out the door",k:"idiom",m:"(사람과 함께 지식·고객이) 빠져나가다",tip:"Our best accounts walked out the door with him. 퇴사 리스크의 정석 표현입니다."}]},
  {s:"B",en:"It already is. We papered over the last two retirements with overtime and luck.",
   ko:"이미 그러고 있어요. 지난 두 번의 은퇴는 초과근무와 운으로 덮었습니다.",
   notes:[{t:"paper over the cracks",k:"idiom",m:"균열을 덮어 감추다",tip:"근본 해결이 아니라는 지적입니다. 여기서는 paper over ~ 형태로 쓰였습니다."}]},
  {s:"A",en:"Overtime is a stopgap. It hides the gap from the report instead of closing it.",
   ko:"초과근무는 임시방편입니다. 격차를 좁히는 게 아니라 보고서에서 가리는 거죠.",
   notes:[{t:"a stopgap",k:"business",m:"임시방편",tip:"It's a stopgap, not a plan. 반드시 「해결책이 아니다」와 짝지어 씁니다."}]},
  {s:"B",en:"Then give me apprentices who stay. The last three left for better shifts.",
   ko:"그럼 남아 있을 견습생을 주세요. 지난 세 명은 더 나은 교대조로 떠났습니다.",
   notes:[{t:"apprentice",k:"business",m:"견습생",tip:"apprenticeship = 견습 과정. 제조·기술직에서 널리 씁니다."}]},
  {s:"A",en:"That's a retention problem, and I'll own it. But pay alone won't fix the pipeline.",
   ko:"그건 잔류 문제고 제가 책임지겠습니다. 그래도 급여만으로 파이프라인은 안 고쳐져요.",
   notes:[{t:"retention",k:"business",m:"(직원) 잔류, 이탈 방지",tip:"turnover(이직률)의 반대편 개념입니다. 인사 대화의 기본어입니다."},
          {t:"I'll own it",k:"idiom",m:"제가 책임지겠습니다",tip:"own a problem = 문제를 자기 것으로 떠안다. 회의에서 신뢰를 얻는 말입니다."}]},
  {s:"B",en:"Money helps more than you think when the work is hot, loud, and badly timed.",
   ko:"덥고 시끄럽고 시간대까지 나쁜 일이라면, 돈이 생각보다 훨씬 큽니다.",
   notes:[{t:"more than you think",k:"collocation",m:"생각보다 훨씬",tip:"It matters more than you think. 상대의 과소평가를 바로잡습니다."}]},
  {s:"A",en:"It does, up to a point. Past that, people leave because nobody taught them properly.",
   ko:"어느 선까지는요. 그 선을 넘으면 제대로 가르쳐 준 사람이 없어서 떠납니다.",
   notes:[{t:"up to a point",k:"idiom",m:"어느 선까지는",tip:"부분 동의를 나타냅니다. I agree, up to a point."},
          {t:"past that",k:"collocation",m:"그 선을 넘으면",tip:"앞의 up to a point와 짝을 이루는 표현입니다."}]},
  {s:"B",en:"Fair. Half of what I know I picked up watching a man who never explained anything.",
   ko:"인정합니다. 제가 아는 것의 절반은 아무것도 설명 안 해 주던 사람을 보며 익혔어요.",
   notes:[{t:"pick it up on the job",k:"idiom",m:"일하면서 어깨너머로 익히다",tip:"Nobody trained me; I picked it up on the job."}]},
  {s:"A",en:"That's exactly the problem. Tacit knowledge that nobody wrote down, because it wasn't anyone's job.",
   ko:"바로 그게 문제입니다. 아무도 적어 두지 않은 암묵지죠. 그게 누구의 일도 아니었으니까요.",
   notes:[{t:"tacit knowledge",k:"business",m:"암묵지 — 말로 옮겨지지 않는 지식",tip:"Most of our tacit knowledge sits with five people."}]},
  {s:"B",en:"Some of it can't be written down. You feel a bad weld before the screen shows anything.",
   ko:"그중 일부는 적을 수가 없어요. 화면에 뜨기 전에 불량 용접이 손으로 느껴집니다.",
   notes:[{t:"before ~ shows anything",k:"grammar",m:"~에 뭔가 나타나기도 전에",tip:"경험이 계측을 앞선다는 것을 시간 순서로 보여 줍니다."}]},
  {s:"A",en:"Agreed, but the other half can. Let's capture what's teachable and stop there.",
   ko:"동의합니다. 그래도 나머지 절반은 가능해요. 가르칠 수 있는 것만 담아 두죠.",
   notes:[{t:"what's teachable",k:"grammar",m:"가르칠 수 있는 것",tip:"what절로 범위를 정합니다. capture what matters로도 응용됩니다."}]},
  {s:"B",en:"Fine. Give me protected time on the schedule, not another folder nobody opens.",
   ko:"좋아요. 일정에 보호된 시간을 주세요. 아무도 안 여는 폴더 하나 더 말고요.",
   notes:[{t:"protected time",k:"business",m:"다른 일에 뺏기지 않도록 지정한 시간",tip:"훈련·개선 활동을 지킬 때 쓰는 실무어입니다."}]},
  {s:"A",en:"You'll get it. In exchange, pair each senior with two juniors on the schedule.",
   ko:"드리겠습니다. 대신 숙련자마다 후배 둘씩 일정표에 짝지어 주세요.",
   notes:[{t:"in exchange",k:"collocation",m:"그 대가로",tip:"in exchange for ~ 로 대상을 밝히기도 합니다. 거래를 매듭짓는 말입니다."}]},
  {s:"B",en:"Two is a lot. One learns while the other watches the first one make mistakes.",
   ko:"둘은 많아요. 하나는 배우고 다른 하나는 첫째가 실수하는 걸 구경합니다.",
   notes:[{t:"while",k:"grammar",m:"~하는 동안, ~하는 반면",tip:"동시성과 대비를 함께 나타냅니다. 문맥으로 뜻이 갈립니다."}]},
  {s:"A",en:"That's still learning, and it gives us a backup when one of them moves on.",
   ko:"그것도 배움이고, 둘 중 하나가 떠날 때를 대비한 여유가 생깁니다.",
   notes:[{t:"move on",k:"phrasal",m:"(회사를) 떠나다, 다음으로 가다",tip:"Two of the juniors moved on within a year. 완곡한 퇴사 표현입니다."}]},
  {s:"B",en:"The writing's on the wall anyway. Automation will take some of these stations.",
   ko:"어차피 흐름은 뻔합니다. 자동화가 이 공정 자리 몇 개는 가져갈 거예요.",
   notes:[{t:"The writing's on the wall.",k:"idiom",m:"흐름은 이미 뻔하다",tip:"피할 수 없는 결말이 보인다는 뜻입니다. 성경에서 온 관용구입니다."}]},
  {s:"A",en:"Some, not all. The machines still need somebody who knows when the output looks wrong.",
   ko:"일부지 전부는 아닙니다. 기계도 결과가 이상하다는 걸 아는 사람이 여전히 필요해요.",
   notes:[{t:"Some, not all.",k:"colloquial",m:"일부지 전부는 아닙니다",tip:"과장을 짧게 깎아 내리는 두 단어짜리 반박입니다."}]},
  {s:"B",en:"Then let's train for judgment and stop hiring for a pair of hands.",
   ko:"그럼 판단력을 겨냥해 훈련하고, 손 한 쌍을 뽑는 건 그만두죠.",
   notes:[{t:"train for ~ / hire for ~",k:"collocation",m:"~을 겨냥해 훈련하다 / 채용하다",tip:"목표를 명시하는 전치사 for입니다. train for judgment, hire for attitude."}]}
 ],

{
 id:"w2d4", day:11, cat:"협상·계약", level:"B2+",
 title:"The Price Is Not the Price",
 titleKo:"가격은 가격이 아니다 — 장기계약의 조정 조항과 원가 전가",
 names:{A:"Marta (계약·법무)", B:"Joon (수출영업)"},
 brief:[
  "장기 공급계약에서 표지에 적힌 가격은 실제로 받는 값이 아니다. 몇 년을 묶는 계약에서 원가만 움직이고 값이 고정되어 있으면 한쪽이 반드시 무너진다. 그래서 원가가 움직이면 값도 따라 움직이도록 <b>가격 조정 조항(escalation clause)</b>을 넣어 둔다.",
  "조정의 기준은 대개 공개된 지수다 — <b>지수 연동(index-linked)</b>. 양쪽이 임의로 다투지 않아도 되니 깔끔해 보이지만, 지수는 현실을 몇 주 늦게 반영한다. 그 <b>시차(lag)</b> 동안 벌어진 손실은 계약서에 적힌 대로 누군가가 <b>떠안는다(eat the cost)</b>.",
  "그래서 위험을 나누는 장치가 붙는다. 값이 오를 때의 상한이 <b>cap</b>, 상한과 하한을 함께 두는 것이 <b>collar</b>다. 상한만 주고 하한을 못 받으면 오를 때의 부담은 우리가 지고 내릴 때의 이익은 상대가 가져간다 — 흔히 놓치는 자리다.",
  "물량 쪽의 장치는 <b>take-or-pay</b>다. 안 가져가도 약정한 값은 낸다. 설비 투자를 회수하려면 필요하지만 수요가 꺾이면 분쟁의 씨앗이 된다. 그래서 실무에서는 물량을 조금 풀어 주고 분기마다 차액을 맞추는 <b>정산(true-up)</b>으로 절충한다."
 ],
 lines:[
  {s:"A",en:"Before you sign a three-year deal, tell me what happens when energy costs rise.",
   ko:"3년짜리 계약에 서명하기 전에, 에너지 값이 오르면 어떻게 되는지 말해 주세요.",
   notes:[{t:"Before you ~, tell me ~",k:"grammar",m:"~하기 전에 먼저 ~을 말해 주세요",tip:"순서를 못 박는 형태입니다. 검토를 요구할 때 유용합니다."}]},
  {s:"B",en:"It's index-linked. The quarterly average feeds into the invoice, so we share the swing.",
   ko:"지수 연동입니다. 분기 평균이 청구서에 반영되니 변동분을 나눠 집니다.",
   notes:[{t:"index-linked",k:"business",m:"공개 지수에 연동된",tip:"index-linked pricing으로 한 덩어리처럼 씁니다."},
          {t:"swing",k:"collocation",m:"(값의) 급한 오르내림",tip:"a price swing / a swing in demand로 붙습니다."}]},
  {s:"A",en:"It sounds tidy on paper, but the index lags by weeks. Somebody carries that gap.",
   ko:"서류상으론 깔끔해 보이죠. 그런데 지수는 몇 주 늦습니다. 그 틈은 누군가 집니다.",
   notes:[{t:"on paper",k:"idiom",m:"서류상으로는",tip:"뒤에 but이 따라오는 것이 거의 공식입니다."},
          {t:"lag",k:"business",m:"뒤늦게 따라가다",tip:"with a lag = 시차를 두고. 동사와 명사 둘 다 씁니다."}]},
  {s:"B",en:"Fair enough, but a lagging index beats a fixed price that goes underwater.",
   ko:"일리 있어요. 그래도 늦은 지수가 물에 잠기는 고정가보다는 낫습니다.",
   notes:[{t:"Fair enough, but ~",k:"idiom",m:"일리는 있는데, 다만 ~",tip:"상대를 인정하고 반박으로 넘어가는 다리입니다."},
          {t:"go underwater",k:"idiom",m:"손실 구간에 빠지다",tip:"가격이 원가 아래로 내려간 상태를 뜻합니다."}]},
  {s:"A",en:"My real worry is the cap. You gave them a ceiling with no floor.",
   ko:"진짜 걱정은 상한입니다. 천장은 주고 바닥은 못 받았어요.",
   notes:[{t:"a ceiling with no floor",k:"business",m:"상한만 있고 하한은 없는 구조",tip:"price ceiling / price floor를 짝으로 외우세요."}]},
  {s:"B",en:"The ceiling got the deal done. Their procurement wouldn't budge without it.",
   ko:"그 천장이 있어서 계약이 됐습니다. 상대 구매팀은 그것 없이는 꿈쩍도 안 했어요.",
   notes:[{t:"budge",k:"colloquial",m:"(입장을) 조금이라도 움직이다",tip:"거의 부정문으로만 씁니다. He wouldn't budge."}]},
  {s:"A",en:"Then ask for a collar. A floor costs them nothing today and protects us later.",
   ko:"그럼 collar를 요구하세요. 바닥은 오늘 상대에게 비용이 안 들고 나중에 우리를 지킵니다.",
   notes:[{t:"a cap and a collar",k:"business",m:"상한, 그리고 상하한을 함께 두는 구조",tip:"위험을 나누는 장치입니다. 금융과 구매 계약에서 그대로 씁니다."}]},
  {s:"B",en:"I can raise that, though reopening price now tends to unravel what we settled.",
   ko:"안건으로 올릴 순 있어요. 다만 지금 가격을 다시 열면 정리된 것까지 풀립니다.",
   notes:[{t:"unravel",k:"idiom",m:"(합의가) 실밥 풀리듯 무너지다",tip:"The deal unravelled over one clause."},
          {t:"raise ~",k:"business",m:"(안건을) 꺼내다",tip:"raise a concern / raise it with them. table보다 오해가 없습니다."}]},
  {s:"A",en:"Better to unravel it now than to litigate it in year two.",
   ko:"지금 풀어지는 게 2년 차에 소송으로 가는 것보다 낫습니다.",
   notes:[{t:"Better to A than to B",k:"grammar",m:"B 하느니 A 하는 편이 낫다",tip:"It is를 생략한 구어체입니다. 결단을 촉구할 때 씁니다."}]},
  {s:"B",en:"Point taken. What about volume? They pushed take-or-pay hard and I held out.",
   ko:"인정합니다. 물량은요? 상대가 take-or-pay를 강하게 밀었는데 제가 버텼어요.",
   notes:[{t:"Point taken.",k:"idiom",m:"지적 인정합니다",tip:"짧게 인정하고 넘어가는 말입니다. 어른스럽게 들립니다."},
          {t:"hold out",k:"phrasal",m:"양보하지 않고 버티다",tip:"hold out for a better price = 더 좋은 값을 받으려 버티다."}]},
  {s:"A",en:"How soft? Take-or-pay is how we recover the line investment.",
   ko:"얼마나 무르게요? take-or-pay가 우리가 설비 투자를 회수하는 방법입니다.",
   notes:[{t:"take-or-pay",k:"business",m:"가져가지 않아도 값은 내는 약정",tip:"에너지·원자재 장기계약의 기본 장치입니다."}]},
  {s:"B",en:"Eighty percent of nominated tonnage, with a quarterly true-up. Anything harder and they'd walk.",
   ko:"지정 물량의 80퍼센트에 분기 정산입니다. 더 세게 갔으면 떠났을 거예요.",
   notes:[{t:"a true-up",k:"business",m:"차액 정산",tip:"동사로도 씁니다. true up the numbers at quarter end."},
          {t:"walk",k:"colloquial",m:"협상을 접고 떠나다",tip:"walk away from the table = 협상을 깨고 나가다."}]},
  {s:"A",en:"That's workable, provided the true-up nets against shortfalls each quarter.",
   ko:"그건 됩니다. 단, 정산이 분기마다 부족분과 상계돼야 해요.",
   notes:[{t:"provided (that) ~",k:"grammar",m:"~라는 조건이라면",tip:"if보다 조건을 못 박는 힘이 셉니다. 계약서와 회의 양쪽에서 씁니다."},
          {t:"net against ~",k:"business",m:"~과 상계하다",tip:"net off로도 씁니다. 정산 대화에서 반드시 나옵니다."}]},
  {s:"B",en:"Now you're the one reopening things. Let's write it plainly instead.",
   ko:"이제는 계약을 다시 여는 쪽이 그쪽이네요. 차라리 평이하게 씁시다.",
   notes:[{t:"you're the one ~ing",k:"grammar",m:"정작 ~하는 사람은 당신이다",tip:"가볍게 되받아치는 강조 구문입니다."}]},
  {s:"A",en:"That's my whole job. Most disputes aren't bad faith, they're two honest readings.",
   ko:"그게 제 일 전부입니다. 분쟁 대부분은 악의가 아니라 정직한 두 해석이에요.",
   notes:[{t:"bad faith",k:"business",m:"악의, 신의를 저버린 태도",tip:"반대는 in good faith입니다. 계약서에 그대로 나옵니다."},
          {t:"a reading",k:"business",m:"(문구에 대한) 해석",tip:"That's one reading of the clause. interpretation의 구어형입니다."}]},
  {s:"B",en:"Then let's kill the force majeure boilerplate. It came off a template.",
   ko:"그럼 불가항력 정형 문구는 없앱시다. 템플릿에서 그대로 가져온 거예요.",
   notes:[{t:"boilerplate",k:"business",m:"관행적으로 복사되는 정형 문구",tip:"「읽지도 않고 넣는 조항」이라는 경멸이 섞입니다."}]},
  {s:"A",en:"It has to stay, but I'll narrow it. A clause that excuses everything excuses them.",
   ko:"조항은 남아야 하지만 범위를 좁히겠습니다. 모든 걸 면책하는 조항은 상대를 면책해요.",
   notes:[{t:"narrow a clause",k:"business",m:"조항의 범위를 좁히다",tip:"반대는 broaden입니다. 계약 협상의 동사 쌍입니다."}]},
  {s:"B",en:"Fine. And spell out that verified cost increases pass through within one billing cycle.",
   ko:"좋습니다. 그리고 확인된 원가 상승분이 한 청구 주기 안에 전가된다고 명시해 주세요.",
   notes:[{t:"pass-through",k:"business",m:"원가를 값에 그대로 넘기는 것",tip:"명사는 하이픈, 동사는 pass through로 띄웁니다."},
          {t:"spell out",k:"phrasal",m:"오해 없게 낱낱이 명시하다",tip:"Spell it out for me.는 「알아듣게 풀어 달라」는 뜻도 됩니다."}]},
  {s:"A",en:"That I can draft. Just don't promise a formula you haven't tested on old costs.",
   ko:"그건 제가 초안 잡겠습니다. 다만 예전 원가에 돌려 보지 않은 산식은 약속하지 마세요.",
   notes:[{t:"That I can ~",k:"grammar",m:"그거라면 ~할 수 있다",tip:"목적어를 앞으로 뺀 도치입니다. 앞말과 대비를 줍니다."}]},
  {s:"B",en:"I've tested it. It holds up unless energy and freight spike in the same quarter.",
   ko:"돌려 봤습니다. 에너지와 운임이 같은 분기에 치솟지만 않으면 버팁니다.",
   notes:[{t:"hold up",k:"phrasal",m:"(검증을) 버텨 내다",tip:"The argument holds up. 지연시키다라는 다른 뜻도 있으니 문맥으로 가르세요."},
          {t:"unless ~",k:"grammar",m:"~하지 않는 한",tip:"if not을 한 단어로 줄인 형태입니다. 예외 조건을 붙일 때 씁니다."}]}
 ],

{
 id:"w2d5", day:12, cat:"안전·현장", level:"B2+",
 title:"The Accident That Was Waiting",
 titleKo:"예고되어 있던 사고 — 아차사고와 기준이 무너지는 방식",
 names:{A:"Dana (안전보건)", B:"Victor (생산 관리)"},
 brief:[
  "큰 사고는 어느 날 갑자기 오지 않는다. 그 앞에는 다치지 않고 지나간 <b>아차사고(near miss)</b>가 수없이 있다. 결과만 달랐을 뿐 원인은 같으므로, 아차사고는 값을 치르지 않고 얻는 교훈이다.",
  "기준은 한 번에 무너지지 않고 조금씩 밀린다. 급할 때 한 번 건너뛴 절차가 통하면 다음에도 건너뛰고, 예외가 반복되어 정상이 된다. 이것을 <b>일탈의 일상화(normalization of deviance)</b>라 부른다. 누구도 규칙을 어기기로 결심하지 않았는데 규칙이 사라져 있다.",
  "그래서 안전은 한 겹으로 설계하지 않는다. 방호장치, 절차, 점검, 교육을 <b>여러 겹으로 쌓아(layers of defence)</b> 한 겹에 난 구멍이 다른 겹에 막히게 한다. 사고는 구멍들이 한 줄로 늘어서는 드문 순간에 일어난다.",
  "지표는 둘로 나뉜다. 사고 건수처럼 이미 벌어진 뒤를 세는 <b>후행지표(lagging indicator)</b>와, 점검 이행률이나 아차사고 신고 건수처럼 앞을 내다보는 <b>선행지표(leading indicator)</b>다. 신고가 줄었다고 안전해진 것이 아니다 — 사람들이 말하기를 그만둔 것일 수도 있다."
 ],
 lines:[
  {s:"A",en:"Your line reported zero near misses last quarter. That's the number that worries me.",
   ko:"그쪽 라인은 지난 분기 아차사고 신고가 0건이었습니다. 제일 걱정되는 숫자가 그거예요.",
   notes:[{t:"a near miss",k:"business",m:"아차사고 — 다치지 않고 지나간 사고",tip:"「거의 놓쳤다」가 아니라 「거의 사고였다」입니다. 뜻을 반대로 잡기 쉽습니다."}]},
  {s:"B",en:"Zero is good news. My people are careful and nothing has gone wrong for months.",
   ko:"0건은 좋은 소식이죠. 우리 사람들은 조심하고 몇 달째 아무 일 없습니다.",
   notes:[{t:"go wrong",k:"phrasal",m:"잘못되다, 사고가 나다",tip:"What could go wrong? 은 반어로도 자주 씁니다."}]},
  {s:"A",en:"Or nothing got written down. Crews stop reporting when reporting once cost somebody something.",
   ko:"아니면 아무것도 기록되지 않은 거죠. 한 번 신고했다가 누가 대가를 치르면 작업조는 신고를 그만둡니다.",
   notes:[{t:"get written down",k:"grammar",m:"기록되다",tip:"get + 과거분사는 be동사보다 구어적이고 「어쩌다 그렇게 됐다」는 느낌입니다."}]},
  {s:"B",en:"That's a serious thing to imply. Give me one instance where I punished someone.",
   ko:"무거운 암시네요. 제가 누굴 벌준 사례를 하나만 대 보세요.",
   notes:[{t:"imply",k:"business",m:"에둘러 시사하다",tip:"What are you implying? 반박할 때 자주 나옵니다."}]},
  {s:"A",en:"I'm not accusing you. Pressure doesn't need a villain. It builds when schedules tighten.",
   ko:"탓하는 게 아닙니다. 압박에 악당은 필요 없어요. 일정이 빡빡해지면 저절로 쌓입니다.",
   notes:[{t:"Pressure doesn't need a villain.",k:"colloquial",m:"압박은 나쁜 사람이 있어야 생기는 게 아니다",tip:"구조 문제를 지적하면서 상대를 방어적으로 만들지 않는 화법입니다."}]},
  {s:"B",en:"Fair enough. A near-miss form takes twenty minutes that nobody has during a hot run.",
   ko:"인정합니다. 아차사고 양식은 20분 걸리는데, 조업이 한창일 땐 그 20분이 없어요.",
   notes:[{t:"a hot run",k:"business",m:"쉴 틈 없이 돌아가는 조업 구간",tip:"제조 현장의 구어입니다. 사무직이면 a crunch로 바꿔 씁니다."}]},
  {s:"A",en:"Then the form is the problem. Make it thirty seconds on a phone.",
   ko:"그럼 양식이 문제군요. 휴대폰으로 30초짜리로 만드세요.",
   notes:[{t:"Then ~ is the problem.",k:"colloquial",m:"그렇다면 문제는 ~이군요",tip:"상대의 변명을 그대로 원인 규정으로 돌리는 화법입니다."}]},
  {s:"B",en:"Suppose I do. What do you do with a hundred reports about people being clumsy?",
   ko:"그렇게 한다고 칩시다. 사람이 서툴렀다는 신고 100건을 어떻게 하실 겁니까?",
   notes:[{t:"Suppose I do.",k:"grammar",m:"그렇게 한다고 칩시다",tip:"If I do보다 도전적입니다. 상대에게 공을 넘길 때 씁니다."}]},
  {s:"A",en:"I look for the ones that repeat. A near miss in the same spot is a warning.",
   ko:"반복되는 것을 찾습니다. 같은 자리에서 반복되는 아차사고는 경고예요.",
   notes:[{t:"A is a warning, not B",k:"colloquial",m:"그건 B가 아니라 경고다",tip:"쉼표 뒤 not으로 대비시키는 짧고 강한 반박입니다."}]},
  {s:"B",en:"So you're after patterns, not incidents. That I can work with.",
   ko:"그러니까 개별 사고가 아니라 패턴을 보시겠다는 거군요. 그거라면 같이 갈 수 있습니다.",
   notes:[{t:"be after ~",k:"phrasal",m:"~을 노리다, 찾고 있다",tip:"What are you after? = 원하시는 게 뭡니까."},
          {t:"That I can work with.",k:"grammar",m:"그거라면 해 볼 만합니다",tip:"목적어 도치로 조건부 수용을 나타냅니다."}]},
  {s:"A",en:"It can't become a scoreboard. Once reporting counts against a crew, reports dry up.",
   ko:"점수판이 되면 안 됩니다. 신고가 작업조에 불리해지는 순간 신고는 말라붙어요.",
   notes:[{t:"count against ~",k:"phrasal",m:"~에게 불리하게 작용하다",tip:"반대는 count towards / count in your favour."},
          {t:"dry up",k:"phrasal",m:"(신고·자금이) 말라붙다",tip:"서서히가 아니라 끊기는 느낌입니다."}]},
  {s:"B",en:"Good. The last program rewarded low numbers, and everyone learned what to report.",
   ko:"다행이네요. 지난 제도는 낮은 숫자에 상을 줬고, 다들 뭘 신고해야 하는지 배웠죠.",
   notes:[{t:"reward low numbers",k:"collocation",m:"낮은 수치에 보상하다",tip:"인센티브 설계를 비판할 때의 정석 표현입니다."}]},
  {s:"A",en:"That's the trap. Injury counts are lagging indicators. They tell you what already happened.",
   ko:"그게 함정입니다. 재해 건수는 후행지표예요. 이미 벌어진 일을 알려 줍니다.",
   notes:[{t:"a lagging indicator",k:"business",m:"후행지표 — 이미 벌어진 뒤를 세는 수치",tip:"안전만이 아니라 경영 전반에서 씁니다."}]},
  {s:"B",en:"And the leading ones? Checks and drills that nobody notices until an audit?",
   ko:"그럼 선행지표는요? 감사 전엔 아무도 신경 안 쓰는 점검과 훈련 말입니까?",
   notes:[{t:"a leading indicator",k:"business",m:"선행지표 — 앞을 내다보는 수치",tip:"lagging과 반드시 짝으로 외우세요. 회의에 한 쌍으로 등장합니다."}]},
  {s:"A",en:"Those, but only if they're done rather than signed. A tick in a box protects nobody.",
   ko:"그것들이요. 다만 서명만이 아니라 실제로 할 때만입니다. 체크 표시는 아무도 지켜 주지 않아요.",
   notes:[{t:"a tick in a box",k:"idiom",m:"형식만 채운 확인",tip:"미국식은 a check in a box. tick-box exercise = 요식행위."},
          {t:"done rather than signed",k:"grammar",m:"서명만 한 게 아니라 실제로 이행된",tip:"rather than으로 두 과거분사를 대비시켰습니다."}]},
  {s:"B",en:"Here's what I see. Standards don't collapse, they slip. One shortcut becomes the method.",
   ko:"제가 보는 건 이겁니다. 기준은 무너지는 게 아니라 밀려요. 지름길 하나가 방법이 됩니다.",
   notes:[{t:"Here's what I see.",k:"colloquial",m:"제가 보는 건 이렇습니다",tip:"자기 관찰을 앞세워 발언권을 가져오는 화법입니다."},
          {t:"standards slip",k:"idiom",m:"기준이 조금씩 밀리다",tip:"무너지는 것이 아니라 미끄러진다는 비유입니다."}]},
  {s:"A",en:"That's the whole mechanism, and it has a name: normalization of deviance.",
   ko:"그게 메커니즘 전부이고 이름도 있습니다. 일탈의 일상화입니다.",
   notes:[{t:"normalization of deviance",k:"business",m:"예외가 반복되어 정상이 되는 현상",tip:"안전공학에서 나와 경영 전반으로 퍼진 말입니다."}]},
  {s:"B",en:"Then don't hand me a poster. Give me the authority to stop the line.",
   ko:"그럼 포스터 주지 마세요. 라인을 세울 권한을 주십시오.",
   notes:[{t:"stop the line",k:"business",m:"안전을 위해 생산을 세우다",tip:"the authority to stop the line으로 통째로 씁니다."}]},
  {s:"A",en:"You'll get it in writing, and I'll take the argument upstairs myself.",
   ko:"문서로 드리겠습니다. 그리고 윗선과의 논쟁은 제가 직접 하겠습니다.",
   notes:[{t:"in writing",k:"idiom",m:"구두가 아니라 문서로",tip:"Get it in writing.은 실무 조언의 정석 문장입니다."},
          {t:"take it upstairs",k:"idiom",m:"윗선으로 가져가다",tip:"escalate의 구어형입니다. 회의에서 훨씬 자연스럽습니다."}]},
  {s:"B",en:"Then we're aligned. Just remember that the hour will look expensive and the accident won't.",
   ko:"그럼 뜻이 맞았네요. 다만 그 한 시간은 비싸 보이고 일어나지 않은 사고는 안 보인다는 걸 기억해 주세요.",
   notes:[{t:"we're aligned",k:"business",m:"뜻이 맞았다",tip:"회의를 매듭짓는 표현입니다. Are we aligned? 로 확인도 합니다."}]}
 ],
 keys:[
  {en:"a near miss",ko:"아차사고 — 다치지 않고 지나간 사고",ex:"Every near miss is a lesson you did not have to pay for."},

 ],
 out:[

  {q:"Your director wants to reward the crew with the lowest injury count. Push back.",hint:"a lagging indicator / a scoreboard / what the company wanted to hear"},

 ]

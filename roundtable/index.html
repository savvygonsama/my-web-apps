{
 id:"w2d6", day:13, cat:"조직·성과관리", level:"B2+",
 title:"What Gets Measured Gets Gamed",
 titleKo:"재면 조작된다 — 지표가 목표가 될 때",
 names:{A:"Ruth (성과관리)", B:"Ali (현업 팀장)"},
 brief:[
  "조직은 재지 않으면 관리하지 못한다. 그런데 재기 시작하는 순간 지표는 단순한 관찰이 아니라 <b>목표</b>가 되고, 사람들은 일이 아니라 지표를 향해 움직이기 시작한다.",
  "대부분의 지표는 <b>대리 지표(proxy)</b>다. 정말 보고 싶은 것 — 고객이 만족했는지, 품질이 좋아졌는지 — 은 직접 재기 어려워서, 대신 세기 쉬운 것을 센다. 처리 건수, 응답 시간 같은 것들이다. 대리와 본체가 어긋나기 시작하면 지표는 그때부터 거짓말을 한다.",
  "지표가 목표가 되면 좋은 지표이기를 그친다 — <b>굿하트의 법칙(Goodhart's law)</b>. 여기서 중요한 것은 조작이 대개 부정행위가 아니라는 점이다. 걸린 보상에 대한 합리적인 반응일 뿐이고, 그래서 사람을 바꿔도 되풀이된다.",
  "실무의 해법은 완벽한 지표를 찾는 것이 아니라 <b>여러 지표를 묶어(a basket of measures)</b> 서로를 견제하게 두는 것이다. 처리 건수 옆에 재문의율을, 속도 옆에 재작업률을 놓는다. 하나는 속일 수 있어도 셋을 동시에 속이려면 대개 일을 제대로 하는 편이 빠르다."
 ],
 lines:[
  {s:"A",en:"Your team's closure rate doubled in two months. Either a miracle happened or something moved.",
   ko:"그쪽 팀 처리율이 두 달 만에 두 배가 됐습니다. 기적이거나 뭔가 움직인 거죠.",
   notes:[{t:"Either A or B",k:"grammar",m:"A이거나 B이거나 둘 중 하나다",tip:"가능성을 둘로 좁혀 답을 요구하는 형태입니다."}]},
  {s:"B",en:"You asked for closure rate and you got it. I'd have preferred a better question.",
   ko:"처리율을 달라셔서 드린 겁니다. 저는 더 나은 질문을 원했고요.",
   notes:[{t:"You asked for X and you got X",k:"colloquial",m:"X 달라고 하셔서 X 드린 겁니다",tip:"같은 말을 반복해 「요구가 잘못이었다」를 찌르는 반박입니다."}]},
  {s:"A",en:"That's not an answer. Tell me what changed on the ground.",
   ko:"그건 답이 아닙니다. 현장에서 뭐가 바뀌었는지 말해 주세요.",
   notes:[{t:"on the ground",k:"idiom",m:"현장에서 실제로",tip:"보고서·계획과 대비되는 말입니다. It looks fine on paper, but on the ground ~"}]},
  {s:"B",en:"Tickets get closed and reopened. The same problem comes back under a new number.",
   ko:"티켓이 닫혔다가 다시 열립니다. 같은 문제가 새 번호를 달고 돌아와요.",
   notes:[{t:"come back under a new ~",k:"collocation",m:"새 ~을 달고 되돌아오다",tip:"under로 「이름을 바꿔」를 나타냅니다."}]},
  {s:"A",en:"So we count the same work twice and call it improvement.",
   ko:"그럼 같은 일을 두 번 세고 그걸 개선이라 부르는 거네요.",
   notes:[{t:"call A B",k:"grammar",m:"A를 B라고 부르다",tip:"목적격 보어가 관사 없이 오는 경우가 많습니다. call it improvement."}]},
  {s:"B",en:"Nobody cheated. People did what the target rewarded, as people always do.",
   ko:"아무도 속이지 않았습니다. 목표가 보상하는 대로 했을 뿐이고, 사람은 늘 그렇습니다.",
   notes:[{t:"hang a number on someone",k:"idiom",m:"~에게 수치 목표를 걸다",tip:"목에 걸어 놓는 이미지입니다. 목표 관리의 압박을 말할 때 씁니다."}]},
  {s:"A",en:"I know. The measure stopped describing the work once it became the target.",
   ko:"압니다. 그 지표는 목표가 된 순간 일을 설명하기를 그만뒀어요.",
   notes:[{t:"once ~",k:"grammar",m:"일단 ~하고 나면",tip:"when보다 「그 시점 이후로는」이 또렷합니다."}]},
  {s:"B",en:"There's a name for that, isn't there? A measure stops being good once it's a target.",
   ko:"그거 이름이 있지 않나요? 지표가 목표가 되면 좋은 지표이기를 그친다는.",
   notes:[{t:"stop being ~",k:"grammar",m:"~이기를 그치다",tip:"stop + 동명사입니다. stop to be로 쓰면 뜻이 달라집니다."}]},
  {s:"A",en:"Goodhart's law. It's not about dishonest people. It's about honest people and incentives.",
   ko:"굿하트의 법칙입니다. 부정직한 사람 얘기가 아니라 정직한 사람과 인센티브 얘기예요.",
   notes:[{t:"Goodhart's law",k:"business",m:"지표가 목표가 되면 좋은 지표이기를 그친다는 법칙",tip:"회의에서 이 이름을 정확히 대면 논의의 격이 올라갑니다."}]},
  {s:"B",en:"Then measure whether the customer came back. That's what you actually care about.",
   ko:"그럼 고객이 다시 왔는지를 재세요. 실제로 신경 쓰는 건 그거잖아요.",
   notes:[{t:"care about",k:"phrasal",m:"진짜로 중요하게 여기다",tip:"care for(돌보다)와 다릅니다. 실무 대화에서 헷갈리면 뜻이 어긋납니다."}]},
  {s:"A",en:"I'd love to, but repeat contact is slow and noisy, and half isn't yours.",
   ko:"그러고 싶죠. 그런데 재문의는 느리고 잡음이 많고, 절반은 그쪽 몫이 아닙니다.",
   notes:[{t:"a proxy for ~",k:"business",m:"진짜 대신 재는 대리 지표",tip:"Response time is a proxy for service, and a poor one."}]},
  {s:"B",en:"Everything useful is slow and noisy. Clean numbers are clean because something was removed.",
   ko:"쓸모 있는 건 다 느리고 지저분합니다. 깔끔한 숫자는 뭔가를 걷어냈으니 깔끔한 거고요.",
   notes:[{t:"strip out",k:"phrasal",m:"(요소를) 걷어내다",tip:"strip out the noise / strip out one-off costs. 데이터·회계에서 자주 씁니다."}]},
  {s:"A",en:"Fair enough, but I can't take 'it's complicated' upstairs. I need one page.",
   ko:"일리 있어요. 그래도 「복잡합니다」를 윗선에 가져갈 순 없습니다. 한 장이 필요해요.",
   notes:[{t:"take something upstairs",k:"idiom",m:"윗선에 가져가다",tip:"escalate의 구어형입니다. 회의에서 훨씬 자연스럽습니다."}]},
  {s:"B",en:"Then put three numbers on the page and let them argue with each other.",
   ko:"그럼 한 장에 숫자를 셋 올리고 서로 다투게 두세요.",
   notes:[{t:"let them argue with each other",k:"colloquial",m:"그것들이 서로 다투게 두다",tip:"지표를 사람처럼 말하게 하는 비유입니다. 견제 구조를 설명하는 데 효과적입니다."}]},
  {s:"A",en:"A basket of measures. Closure rate next to reopen rate, volume next to queue length.",
   ko:"지표 묶음이군요. 처리율 옆에 재개율, 처리량 옆에 대기열 길이.",
   notes:[{t:"a basket of measures",k:"business",m:"서로를 견제하는 지표 묶음",tip:"a basket of currencies에서 온 비유입니다. 성과관리의 표준 표현입니다."},
          {t:"A next to B",k:"collocation",m:"A를 B 옆에 나란히",tip:"물리적 위치이자 「대조해 보이다」라는 뜻입니다."}]},
  {s:"B",en:"That's better. Any single number can be gamed. Gaming three usually means working properly.",
   ko:"그게 낫습니다. 숫자 하나는 조작되지만, 셋을 조작하려면 대개 제대로 일하는 게 빠르죠.",
   notes:[{t:"game a metric",k:"business",m:"규칙 안에서 지표를 유리하게 조작하다",tip:"cheat과 다릅니다. 규칙을 어기지 않고 허점을 이용하는 것입니다."}]},
  {s:"A",en:"Usually. Someone will find the seam, and I'd rather hear it from you.",
   ko:"대개는요. 누군가는 허점을 찾아낼 텐데, 저는 그쪽한테서 먼저 듣고 싶습니다.",
   notes:[{t:"find the seam",k:"idiom",m:"허점·이음매를 찾아내다",tip:"옷의 솔기에서 온 비유입니다. loophole보다 구어적입니다."}]},
  {s:"B",en:"You will, if telling you costs me nothing. The last team got blamed for it.",
   ko:"그러시게 될 겁니다, 말하는 게 대가가 없다면요. 지난번 팀은 그 책임을 뒤집어썼거든요.",
   notes:[{t:"flag ~",k:"business",m:"문제를 공식적으로 짚어 알리다",tip:"Let me flag one risk. 이견을 꺼낼 때의 부드러운 도입입니다."},
          {t:"get blamed for ~",k:"collocation",m:"~에 대한 책임을 뒤집어쓰다",tip:"take the blame(스스로 지다)과 달리 억울함이 섞입니다."}]},
  {s:"A",en:"That's on us, and I'll change it. A metric nobody questions is worse than none.",
   ko:"그건 우리 잘못이고 제가 바꾸겠습니다. 아무도 묻지 못하는 지표는 없는 것보다 나빠요.",
   notes:[{t:"That's on us.",k:"colloquial",m:"그건 우리 책임입니다",tip:"That's on me.로 짧게 책임을 인정할 때도 씁니다."}]},
  {s:"B",en:"Then we're getting somewhere. Just don't fall for the new numbers like the old ones.",
   ko:"그럼 진전이 있네요. 다만 예전 숫자처럼 새 숫자에도 홀리지는 마세요.",
   notes:[{t:"we're getting somewhere",k:"idiom",m:"이제 좀 진전이 있다",tip:"논의가 풀리기 시작할 때 쓰는 정형 문장입니다."},
          {t:"fall for ~",k:"phrasal",m:"~에 홀딱 넘어가다",tip:"fall in love with보다 「속았다」는 뉘앙스가 섞입니다."}]}
 ],

{
 id:"w2d7", day:14, cat:"물류·운송", level:"B2+",
 title:"The Box That Waits",
 titleKo:"기다리는 컨테이너 — 체선료와 리드타임이라는 숨은 원가",
 names:{A:"Nadia (물류)", B:"Peter (생산계획)"},
 brief:[
  "운송 원가는 운임만이 아니다. 컨테이너가 항만에 서 있는 동안에도 값이 붙는다 — 터미널 안에 머무는 시간에 붙는 <b>체선료(demurrage)</b>와, 컨테이너를 끌고 나간 뒤 반납이 늦어질 때 붙는 <b>지체료(detention)</b>다.",
  "이 값은 벌금이 아니라 <b>회전율을 강제하는 가격</b>이다. 터미널과 선사는 한정된 자리와 장비가 묶이는 것을 싫어한다. 그래서 <b>무료 기간(free time)</b>을 짧게 두고 그 뒤부터는 시간을 판다. 창고를 빌려주는 것이 아니라, 오래 세워 둘 사람을 값으로 밀어내는 것이다.",
  "공장이 실제로 아파하는 것은 평균 리드타임이 아니라 <b>흔들림(variability)</b>이다. 늘 30일이면 계획이 서지만 20일과 45일을 오가면 그 차이만큼을 재고로 메워야 한다. 그렇게 쌓아 두는 것이 <b>안전재고(safety stock)</b>이고, 그것은 창고에 잠긴 현금이다.",
  "그래서 물류와 생산계획은 같은 돈을 서로 다른 계정에서 본다. 물류는 운임과 체선료를 보고, 생산은 멈춘 라인과 쌓인 재고를 본다. 각자의 예산에서 상대의 숫자가 보이지 않는다는 것 — 이것이 이 다툼의 진짜 뿌리다."
 ],
 lines:[
  {s:"A",en:"The demurrage bill landed on my desk, and it's bigger than the freight we argued about.",
   ko:"체선료 청구서가 제 책상에 올라왔는데, 우리가 다투던 운임보다 큽니다.",
   notes:[{t:"demurrage",k:"business",m:"체선료 — 컨테이너가 터미널에 머문 시간에 붙는 값",tip:"detention(반출 뒤 반납 지연)과 짝으로 외우세요."},
          {t:"land on someone's desk",k:"idiom",m:"~에게 (일·청구서가) 떨어지다",tip:"원치 않게 떠맡게 됐다는 뉘앙스가 붙습니다."}]},
  {s:"B",en:"That's not my line item. I asked for those boxes to sit until we had space.",
   ko:"그건 제 예산 항목이 아닙니다. 자리가 날 때까지 세워 두라고 했을 뿐이에요.",
   notes:[{t:"a line item",k:"business",m:"(예산·청구서의) 개별 항목",tip:"That's not my line item.은 「내 소관이 아니다」라는 실무 관용구입니다."}]},
  {s:"A",en:"The boxes sitting is what you're charged for. Free time ran out and billing started.",
   ko:"세워 둔 것 자체가 청구 사유입니다. 무료 기간이 끝나면서 과금이 시작됐어요.",
   notes:[{t:"free time",k:"business",m:"체선료가 붙지 않는 무료 유치 기간",tip:"「자유 시간」이 아닙니다. 물류 계약서에서는 이 뜻으로만 씁니다."}]},
  {s:"B",en:"Then the free time is too short. Nobody clears a full vessel in that window.",
   ko:"그럼 무료 기간이 너무 짧습니다. 그 시간 안에 배 한 척을 다 비우는 사람은 없어요.",
   notes:[{t:"the window",k:"business",m:"허용된 시간 구간",tip:"a delivery window / a booking window. 창문이 아니라 「기간」입니다."}]},
  {s:"A",en:"It's short on purpose. The terminal isn't renting storage. It's pricing you out.",
   ko:"일부러 짧은 겁니다. 터미널은 창고를 빌려주는 게 아니라 값으로 밀어내는 거예요.",
   notes:[{t:"on purpose",k:"idiom",m:"일부러, 의도적으로",tip:"by accident의 반대입니다. 7일차와 짝지어 외우세요."},
          {t:"price someone out",k:"business",m:"값을 올려 밀어내다",tip:"priced out of the market = 값 때문에 시장에서 밀려난."}]},
  {s:"B",en:"Fair enough, but my yard was full and the line was running. What should I do?",
   ko:"일리 있어요. 그래도 야적장은 꽉 찼고 라인은 돌고 있었습니다. 어쩌란 겁니까?",
   notes:[{t:"the yard",k:"business",m:"야적장, 물류 마당",tip:"the shop floor(생산 현장)와 짝으로 알아 두면 공장 대화가 편합니다."}]},
  {s:"A",en:"You could have told me a week earlier. I can pre-book slots when I know.",
   ko:"일주일 전에만 말해 주셨어도 됐습니다. 알면 자리를 미리 잡을 수 있어요.",
   notes:[{t:"could have + 과거분사",k:"grammar",m:"~할 수도 있었는데 (하지 않았다)",tip:"아쉬움과 가벼운 질책을 함께 담습니다."},
          {t:"pre-book a slot",k:"collocation",m:"자리를 미리 잡아 두다",tip:"a slot은 시간·설비의 「자리」입니다. free up a slot."}]},
  {s:"B",en:"I didn't know. The schedule moved twice because two orders got pulled forward.",
   ko:"저도 몰랐습니다. 주문 두 건이 앞당겨지면서 일정이 두 번 움직였어요.",
   notes:[{t:"pull forward",k:"phrasal",m:"(일정을) 앞당기다",tip:"반대는 push back입니다. 일정 조정의 기본 짝입니다."}]},
  {s:"A",en:"Then that's the real problem, not demurrage. Your plan moves faster than my bookings.",
   ko:"그럼 진짜 문제는 그거고 체선료가 아닙니다. 계획이 제 예약보다 빨리 움직여요.",
   notes:[{t:"the real problem is ~",k:"colloquial",m:"진짜 문제는 ~이다",tip:"증상과 원인을 갈라 놓는 토론의 정석 문형입니다."}]},
  {s:"B",en:"Plans always move. I'd rather move a plan than sit on stock we can't sell.",
   ko:"계획은 늘 움직입니다. 못 팔 재고를 끌어안느니 계획을 움직이겠어요.",
   notes:[{t:"sit on stock",k:"idiom",m:"재고를 끌어안고 있다",tip:"sit on cash / sit on a decision처럼 「쥐고 안 움직인다」는 뜻입니다."}]},
  {s:"A",en:"I understand, but every change costs me. It shows up in my budget, not yours.",

/* ---------- 음성 (TTS) ---------- */
let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const f = VOICES.filter(x=>/female|zira|aria|jenny|samantha|karen|libby|sonia/i.test(x.name));
    const m = VOICES.filter(x=>/male|david|guy|ryan|daniel|alex|mark/i.test(x.name));
    v = who==="B" ? (m[0]||VOICES[1]||VOICES[0]) : (f[0]||VOICES[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.05;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].en, items[i].s, rate, ()=>{ i++; setTimeout(step, 260); });
  })();
}

/* 새 끊어읽기 — 「덩어리 수를 먼저 정하고, 끊어도 되는 자리에서만 끊는다」

   예전 방식은 접속사와 쉼표를 만날 때마다 끊고, 10단어가 넘으면 가운데를 억지로
   갈랐다. 그래서 평균 3.5덩어리가 나왔고, 무엇보다 for a / while now 처럼
   구 한가운데가 잘렸다. 쉐도잉은 숨을 쉬는 자리에서 끊어야 의미가 있다. */
function chunkify(s){
  const toks = String(s).trim().split(/\s+/).filter(Boolean);
  const W = toks.length;
  /* 한 덩어리가 12단어 안팎이 되도록 목표 수를 먼저 정한다. 최대 세 덩어리. */
  const target = Math.min(3, Math.ceil(W / 12));
  if(target <= 1) return [toks.join(" ")];

  const MIN = 4;                                   // 덩어리는 최소 네 단어
  const clean = w => w.replace(/[^\w']/g, "").toLowerCase();
  const SUB  = /^(but|because|so|although|though|while|unless|whereas|since|before|after|until|once|if|whether|provided)$/;
  const REL  = /^(which|that|when|where|who|whose)$/;
  const COORD= /^(and|or|yet)$/;                   // 등위접속 — 마땅한 자리가 없을 때만
  const PREP = /^(in|on|at|of|for|to|with|from|about|into|by|over|under|through|without|against|between)$/;

  /* i번째 단어 앞에서 끊을 때의 점수. 음수면 그 자리에서는 끊지 않는다. */
  function score(i){
    if(i < MIN || W - i < MIN) return -1;
    const prev = toks[i-1], w = clean(toks[i]);
    if(/[.!?]["')\]]?$/.test(prev)) return 100;    // 문장이 끝난 자리
    if(/[;:—]$/.test(prev))         return 90;
    if(/,$/.test(prev))             return 80;     // 쉼표 뒤
    if(SUB.test(w))                 return 60;     // 접속사 앞
    if(REL.test(w))                 return 50;     // 관계사 앞
    if(COORD.test(w))               return 40;     // 등위접속 앞
    /* 전치사구가 시작되는 자리. 앞뒤로 충분히 길 때만 쓴다 —
       마땅한 자리가 없는 긴 문장을 통째로 두지 않기 위한 마지막 수단이다. */
    if(PREP.test(w) && i >= 5 && W - i >= 5) return 30;
    return -1;                                     // 그 밖에는 끊지 않는다
  }

  const cuts = [];
  for(let k = 1; k < target; k++){
    const ideal = Math.round(W * k / target);
    let best = -1, bestVal = 0;
    for(let i = 1; i < W; i++){
      const sc = score(i);
      if(sc < 0) continue;
      if(cuts.some(c => Math.abs(c - i) < MIN)) continue;   // 이미 고른 자리와 너무 붙지 않게
      const val = sc - Math.abs(i - ideal) * 6;             // 고른 자리에 가까울수록 좋다
      if(val > bestVal){ bestVal = val; best = i; }
    }
    if(best > 0) cuts.push(best);
  }
  if(!cuts.length) return [toks.join(" ")];        // 끊을 자리가 마땅찮으면 통째로 둔다

  cuts.sort((a,b)=>a-b);
  const out = []; let prev = 0;
  cuts.concat([W]).forEach(c => { out.push(toks.slice(prev, c).join(" ")); prev = c; });
  return out;
}

];
const SESS_MIN = STEPS.reduce((a,x)=>a+x.m, 0);

/* ---------- 새 회차 자동 반영 ----------
   서비스워커가 새 본문을 받아 두면 여기에 표시해 둔다. 훈련 중이거나
   자료를 붙여넣는 중에 화면을 새로 고치면 하던 것이 날아가므로,
   그 두 자리에서만 기다렸다가 빠져나오는 순간 알아서 갈아 끼운다. */
let pendingUpdate = false;
function applyUpdate(){
  if(!pendingUpdate) return;
  if(cur.view==="session" || cur.view==="add") return;
  pendingUpdate = false;
  location.reload();
}

function startSession(id, resume){
  stopSpeak();
  const sp = (resume && S.spot && S.spot.dayId===id) ? S.spot : null;
  cur.dayId=id; cur.chunk=-1; cur.showKo=S.cfg.showKo;
  cur.step = sp ? Math.max(0, Math.min(sp.step, STEPS.length-1)) : 0;
  cur.line = sp ? Math.max(0, sp.line||0) : 0;
  const dd = dayById(id); if(dd) cur.line = Math.min(cur.line, dd.lines.length-1);
  cur.reps = (S.prog[id]&&S.prog[id].reps) ? S.prog[id].reps : {};
  cur.t0 = Date.now();
  clearInterval(cur.tick); cur.tick = setInterval(updClock, 1000);
  go("session");
}
function elapsedMin(){ return Math.max(0, Math.round((Date.now()-cur.t0)/60000)); }
function updClock(){
  const el = $("#clock"); if(!el) return;
  const s = Math.floor((Date.now()-cur.t0)/1000);
  el.textContent = pad(Math.floor(s/60))+":"+pad(s%60);
  el.classList.toggle("over", s>SESS_MIN*60);
}
function endSession(){ clearInterval(cur.tick); stopSpeak(); }

/* ---------- 라우팅 ---------- */

/* ---------- 홈 ---------- */
function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};
}

/* ---------- 여기까지 하고 저장 ----------
   20분을 한 자리에서 다 내지 못하는 날이 많다. 어디까지 했는지 적어 두고,
   다음에 열면 홈의 「이어서 하기」로 그 단계, 그 문장에서 다시 시작한다.
   따라 읽을 때마다(bumpRep) 불리므로 자리는 늘 최신이다. */
function saveProgress(){
  if(!cur.dayId) return false;
  const p = S.prog[cur.dayId] || {};
  p.reps = cur.reps; p.stepIdx = cur.step;
  S.prog[cur.dayId] = p;
  /* 한 번 끝낸 회차를 다시 볼 때도 자리는 남긴다.
     복습하다 멈추는 일이 오히려 더 잦다. */
  S.spot = { dayId:cur.dayId, step:cur.step, line:cur.line, at:Date.now() };
  save();
  return true;
}
function saveAndExit(){
  /* 저장했다고 말만 하고 안 남으면 다음에 열었을 때 사람만 헛걸음한다.
     실제로 적혔는지 읽어 보고 나서 알린다. */
  const kept = saveProgress() && store.get("spot", null);
  toast(kept ? "여기까지 저장했습니다. 다음에 열면 이어집니다."
             : "저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.");
  go("home");
}
/* 버튼을 누르지 않고 그냥 화면을 덮거나 앱을 내려도 자리를 잃지 않게 한다 */
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && cur.view==="session") saveProgress(); });
window.addEventListener("pagehide", ()=>{ if(cur.view==="session") saveProgress(); });
function finishSession(d){
  const p = S.prog[d.id] || {}; p.reps=cur.reps; p.done=true; p.doneAt=today(); S.prog[d.id]=p;
  /* 끝낸 회차의 자리만 지운다. 다른 회차에 멈춰 둔 자리는 그대로 둔다. */
  if(S.spot && S.spot.dayId===d.id) S.spot=null;
  const t = today(); const prev = S.log[t] || {min:0, lines:0};
  const repLines = Object.keys(cur.reps).filter(k=>cur.reps[k]>0).length;
  S.log[t] = { dayId:d.id, min: prev.min + Math.max(1, elapsedMin()), lines: prev.lines + repLines, ts: Date.now() };
  save(); endSession();
  const info = streakInfo();
  $("#view-session").innerHTML =
    '<div class="hd" style="margin-top:30px"><small>Session complete</small>오늘 훈련 완료</div>'+
    '<div class="card"><div style="font-family:var(--serif);font-size:22px">'+esc(d.title)+'</div>'+
    '<div class="sub" style="margin:6px 0 14px">'+d.titleKo+'</div>'+
    '<div class="streak"><div><b>'+elapsedMin()+'</b><span>오늘 분</span></div><div><b>'+repLines+'</b><span>따라 읽은 문장</span></div>'+
    '<div><b>'+info.streak+'</b><span>연속일</span></div></div>'+
    '<div class="rule"></div><div class="sub">내일 첫 단계에서 오늘 표현 8개를 다시 물어봅니다. 그때 <b>보지 않고</b> 말해 보세요.</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="cHome">홈으로</button>'+
    '<button class="btn ghost" id="cBank">표현장에서 복습</button></div></div>';
  $("#footbar").classList.remove("on");
  $("#cHome").onclick=()=>go("home"); $("#cBank").onclick=()=>go("bank");
}

function lineHTML(l,i){

/* --- step 4 : 쉐도잉 (핵심) --- */
function stepShadow(d){
  const i = cur.line, l = d.lines[i];
  const reps = cur.reps[i]||0, target = S.cfg.reps;
  const chunks = chunkify(l.en);
  let h = '<div class="row" style="margin:10px 0 0"><span class="sub">문장 '+(i+1)+' / '+d.lines.length+'</span>';
  h += '<span style="flex:1"></span>'+speedBar("shSpeed")+'</div>';
  h += '<div class="shadowbox">';
  h +=   '<div class="who '+(l.s==="B"?"b":"")+'">'+(l.s==="B"?esc(d.names.B):esc(d.names.A))+'</div>';
  h +=   '<div class="bigen">'+esc(l.en)+'</div>';
  if(chunks.length>1){
    h += '<div class="sub" style="font-size:12px;margin-top:6px">덩어리로 끊어 읽기 — 각 줄을 눌러 따라 하세요</div>';
    h += '<div class="chunks">'+chunks.map((c,ci)=>'<div class="chunk" data-c="'+ci+'">'+esc(c)+'</div>').join("")+'</div>';
  }
  h +=   '<div class="bigko">'+esc(l.ko)+'</div>';
  h +=   '<div class="rule"></div>';
  h +=   '<div class="row"><button class="btn" id="pLine">듣기 ▶</button>'+
         '<button class="btn ghost sm" id="pSlow">천천히 0.7x</button>'+
         '<button class="btn '+(autoTok?"red":"ghost")+' sm" id="pAuto">'+(autoTok?"■ 자동 정지":"자동 진행 ▶▶")+'</button>'+
         '<span style="flex:1"></span><span class="counter" id="dots">'+
         Array.from({length:target},(_,k)=>'<span class="dot '+(k<reps?"on":"")+'"></span>').join("")+'</span></div>';
  if(l.notes && l.notes.length){
    h += '<div class="notes"><div class="sub" style="font-size:12px;margin-bottom:4px">표현 노트</div>';
    l.notes.forEach(n=>{
      h += '<div class="note"><b>'+esc(n.t)+'</b><span class="k">'+esc(kLabel(n.k))+'</span> — '+esc(n.m)+
           (n.tip?'<span class="tip">'+esc(n.tip)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="row"><button class="btn ghost" id="sPrev">← 앞 문장</button>'+
       '<button class="btn" id="sNext">다음 문장 →</button>'+
       '<span class="sub" style="font-size:12px">스페이스바=듣기, Enter=다음</span></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("shSpeed"); bindBlur();

  const play = (rate)=>{ stopSpeak(); bumpRep(i); speak(l.en, l.s, rate||S.cfg.rate); };
  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.7);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c], l.s, Math.min(S.cfg.rate,0.9));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = t => Math.max(1000, t.split(/\s+/).length * 340);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.en, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.en));
    });
  })(0);
}
function kLabel(k){
  return ({idiom:"관용", colloquial:"구어", phrasal:"구동사", collocation:"연어", business:"실무어", grammar:"문법"})[k] || k;
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.en, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

function exportData(){

    {type:"application/json"});

  a.download = "roundtable-backup-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("백업 파일을 내려받았습니다");
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      ["prog","log","star","out","custom","cfg"].forEach(k=>{ if(o[k]) S[k]=o[k]; });
      rebuild(); save(); toast("복원했습니다"); render();
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };
  r.readAsText(f);
}

let bankQ = "";
function renderBank(){
  const rows=[];
  CONTENT.forEach(d=> d.keys.forEach(k=> rows.push({d, k})));
  const q = bankQ.trim().toLowerCase();
  const filtered = rows.filter(r=> !q || (r.k.en+r.k.ko+r.k.ex).toLowerCase().includes(q));
  let h = '<div class="hd" style="margin-top:20px"><small>Expression bank</small>표현장 <span class="sub" style="font-size:13px">('+rows.length+'개)</span></div>';
  h += '<div class="card"><div class="row"><input type="text" id="bq" placeholder="영어·한국어로 검색" value="'+esc(bankQ)+'" style="flex:1;min-width:180px">'+
       '<button class="btn ghost sm" id="bStar">⭐만 보기</button><button class="btn ghost sm" id="bDrill">랜덤 10개 훈련</button></div></div>';
  h += '<div class="card" id="bankList">';
  filtered.forEach((r,i)=>{
    const on = S.star[r.k.en] ? "on":"";
    h += '<div class="bankrow"><span class="star '+on+'" data-k="'+esc(r.k.en)+'">★</span>'+
         '<b>'+esc(r.k.en)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button>'+
         '<div class="m">'+esc(r.k.ko)+' <span class="sub" style="font-size:11.5px">· DAY '+r.d.day+'</span></div>'+
         '<div class="ex">'+esc(r.k.ex)+'</div></div>';
  });
  if(!filtered.length) h += '<div class="sub">검색 결과가 없습니다.</div>';
  h += '</div>';
  $("#view-bank").innerHTML = h; bindPlay();
  $("#bq").oninput = e=>{ bankQ=e.target.value; const p=e.target.selectionStart; renderBank(); const el=$("#bq"); el.focus(); el.setSelectionRange(p,p); };
  $("#bStar").onclick = ()=>{ bankQ=""; renderBank();
    document.querySelectorAll("#bankList .bankrow").forEach(row=>{
      const s=row.querySelector(".star"); if(!s.classList.contains("on")) row.style.display="none"; }); };
  $("#bDrill").onclick = ()=> drill(rows);
  document.querySelectorAll(".star").forEach(s=> s.onclick = ()=>{
    const k=s.dataset.k; if(S.star[k]) delete S.star[k]; else S.star[k]=1; save(); s.classList.toggle("on"); });
}
function drill(rows){
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 보지 말고 먼저 말하기</div><div class="card">';
  pick.forEach(r=>{
    h += '<div class="keyrow"><b>'+esc(r.k.en)+' <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button></b>'+
         '<span><span class="blurme">'+esc(r.k.ko)+'</span><span class="ex blurme">'+esc(r.k.ex)+'</span></span></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 표현장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

    S.custom.splice(+b.dataset.i,1); save(); rebuild(); renderAdd(); });
}

/* ---------- 설정 ---------- */
function applyTheme(){
  let t = S.cfg.theme;
  if(t!=="dark" && t!=="light")
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
}

/* ---------- 시작 ---------- */
/* 설정 화면을 없앴으므로, 예전에 저장해 둔 화면 설정에 갇히지 않도록 되돌린다.
   앞으로 화면 밝기는 휴대폰 설정을 그대로 따라간다. */
if(S.cfg.theme!=="auto"){ S.cfg.theme="auto"; save(); }
applyTheme();
render();

/* ═══════════ 앱으로 설치하기 ═══════════
   링크를 카카오톡·팀즈로 보내면 대개 그 앱 안의 브라우저로 열린다.
   거기서는 설치도 소리도 되지 않으므로, 그 경우를 가장 먼저 잡아 크롬·사파리로 넘긴다. */
(function(){
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    /* 열 때는 새 본문을 먼저 받으므로 대개 여기까지 오지 않는다.
       느린 곳에서 저장본으로 먼저 열렸을 때만 뒤늦게 도착한다. */
    navigator.serviceWorker.addEventListener("message", e=>{
      if(!e.data || e.data.type!=="update-ready") return;
      pendingUpdate = true;
      if(cur.view==="session" || cur.view==="add") toast("새 회차가 도착했습니다. 이 훈련을 마치면 반영됩니다.");
      applyUpdate();
    });
    /* 설치한 앱은 한 번 열어 두면 다시 불러와도 화면을 새로 받지 않는다.
       그래서 앱을 앞으로 불러올 때마다 새것이 있는지 확인한다. */
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState !== "visible") return;
      applyUpdate();
      if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type:"check-update"});
    });
  }

  const UA = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(UA);
  const isMobile = isIOS || isAndroid;
  /* 앱 안 브라우저 — 카카오톡·팀즈·네이버·라인·밴드·페북·인스타 */
  const inApp = /KAKAOTALK|Teams|MSTeams|NAVER|Line\/|band|DaumApps|Instagram|FB_IAB|FBAN|FBAV|everytime/i.test(UA);
  /* 아이폰은 사파리로, 안드로이드는 크롬으로 넘긴다.
     그 기기에 처음부터 깔려 있는 브라우저라야 아무도 무엇을 설치하지 않는다. */
  const TARGET = isIOS ? "사파리" : "크롬";
  const TO = isIOS ? "사파리로" : "크롬으로";

  function openOutside(){
    const url = location.href;
    /* 카카오톡은 바깥 브라우저로 넘기는 자기 방식이 있다.
       기기의 기본 브라우저가 열리므로 아이폰이면 사파리, 안드로이드면 크롬이다. */
    if(/KAKAOTALK/i.test(UA)){
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      return;
    }
    if(isIOS){
      /* 사파리로 넘기는 전용 방식. 막히면 주소만 복사해 준다. */
      location.href = url.replace(/^https:/, "x-safari-https:").replace(/^http:/, "x-safari-http:");
      setTimeout(()=>{ if(!document.hidden) copyLink(); }, 1200);
      return;
    }
    if(isAndroid){
      location.href = "intent://" + url.replace(/^https?:\/\//, "") +
        "#Intent;scheme=" + location.protocol.replace(":", "") +
        ";package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      return;
    }
    window.open(url, "_blank");
  }

  /* 마지막 수단 — 주소를 복사해 주고 붙여 넣으라고 알린다. */
  function copyLink(){
    const url = location.href;
    const done = ()=> toast("주소를 복사했습니다. " + TARGET + "에 붙여 넣어 주세요.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, done);
    }else{
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }

  if(inApp && isMobile){
    const box = $("#openChrome");
    box.hidden = false;
    $("#ocApp").textContent = /KAKAOTALK/i.test(UA) ? "지금은 카카오톡 안에서 열려 있습니다."
                                                    : "지금은 다른 앱 안에서 열려 있습니다.";
    $("#ocMsg").textContent = "여기서는 영어 발음이 나오지 않고 설치도 되지 않습니다. " +
                              TO + " 열면 소리가 납니다.";
    $("#ocGo").textContent = TO + " 열기";
    $("#ocGo").onclick = openOutside;
    $("#ocCopy").onclick = copyLink;
    $("#ocClose").onclick = ()=>{ box.hidden = true; };
  }

  const btn = $("#installBtn"), note = $("#installNote");
  const title = $("#installTitle"), steps = $("#installSteps"), nowBtn = $("#installNow");

  /* 이미 홈 화면 아이콘으로 열렸으면 설치를 권할 이유가 없다 */
  if(window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return;

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred = e;
    if(!note.hidden) open();     /* 안내가 떠 있는 중에 신호가 오면 버튼과 문구를 함께 고친다 */
  });
  window.addEventListener("appinstalled", ()=>{ btn.hidden = true; hide(); });

  /* 브라우저가 설치 안내를 스스로 띄우지 않는 경우가 많아, 버튼은 늘 보이게 둔다 */
  btn.hidden = false;

  function hide(){ note.hidden = true; }

  function build(){
    if(inApp){
      title.textContent = "📲 먼저 브라우저로 열어 주세요";
      return "<p><b>지금 카카오톡·팀즈 같은 앱 안에서 열려 있습니다.</b> 여기서는 설치가 되지 않습니다.</p>" +
             "<ol>" +
               "<li>화면 <b>오른쪽 위 메뉴</b>(⋯ 또는 ⋮)를 누릅니다</li>" +
               "<li><b>「다른 브라우저로 열기」</b>를 고릅니다" +
                 (isIOS ? " — 아이폰은 <b>Safari</b>" : isAndroid ? " — 안드로이드는 <b>Chrome</b>" : "") + "</li>" +
               "<li>열린 화면에서 이 안내가 다시 나오면 그대로 따라 하시면 됩니다</li>" +
             "</ol>";
    }
    if(isIOS){
      title.textContent = "📲 홈 화면에 추가하기";
      return "<p><b>아이폰 · 아이패드 (Safari)</b></p>" +
             "<ol>" +
               "<li>화면 <b>아래쪽 공유 버튼</b>(□ 위에 화살표)을 누릅니다</li>" +
               "<li>목록을 내려 <b>「홈 화면에 추가」</b>를 고릅니다</li>" +
               "<li>오른쪽 위 <b>「추가」</b>를 누르면 끝입니다</li>" +
             "</ol>";
    }
    if(isAndroid){
      title.textContent = "📲 앱으로 설치하기";
      /* 크롬이 설치 신호를 준 경우에만 버튼을 안내한다. 없는 버튼을 누르라고 하면 그대로 막힌다. */
      return "<p><b>안드로이드 (Chrome)</b></p>" +
             "<ol>" +
               (deferred
                 ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>"
                 : "<li>화면 <b>오른쪽 위 메뉴(⋮)</b>를 누릅니다</li>" +
                   "<li><b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 고릅니다</li>") +
             "</ol>";
    }
    title.textContent = "📲 앱으로 설치하기";
    return "<p><b>컴퓨터 (Chrome · Edge)</b></p>" +
           "<ol>" +
             (deferred ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>" : "") +
             "<li>주소창 오른쪽 끝의 <b>설치 아이콘</b>을 누릅니다</li>" +
             "<li>없으면 메뉴 → <b>「앱 설치」</b></li>" +
           "</ol>";
  }

  function open(){
    steps.innerHTML = build() +
      "<p>설치하면 아이콘을 눌러 주소창 없이 앱처럼 열리고, 인터넷이 끊겨도 계속 쓸 수 있습니다. 지금까지의 기록은 그대로 남습니다.</p>";
    nowBtn.hidden = !deferred;
    note.hidden = false;
  }

  /* 처음 연 사람에게는 한 번 저절로 띄운다. 닫으면 다시 띄우지 않는다. */
  const SEEN = "roundtable-install-seen";
  let seen = false;
  try{ seen = localStorage.getItem(SEEN) === "1"; }catch(e){}
  if(!seen && isMobile && $("#openChrome").hidden)
    setTimeout(()=>{ if(note.hidden) open(); }, 1200);

  btn.onclick = open;

  nowBtn.onclick = async ()=>{
    if(!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    nowBtn.hidden = true;
    if(outcome === "accepted"){ btn.hidden = true; hide(); }
  };

  $("#installNoteClose").onclick = ()=>{
    hide();
    try{ localStorage.setItem(SEEN, "1"); }catch(e){}
  };
})();
</script>

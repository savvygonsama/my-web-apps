<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4342a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROUNDTABLE">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>ROUNDTABLE 영어 쉐도잉</title>
<style>
:root{
  --paper:#f6f2ea; --card:#fffdf8; --line:#e2dacb; --ink:#1a1917; --sub:#6d665c;
  --accent:#a4342a; --accent-soft:#f0dcd8; --blue:#2b4d63; --blue-soft:#dfe7ec;
  --ok:#2f6b4f; --warn:#8a6a1f; --radius:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme="dark"]{
  --paper:#15171a; --card:#1c1f24; --line:#2e333a; --ink:#e9e5dd; --sub:#9a948a;
  --accent:#e0715f; --accent-soft:#3a2320; --blue:#8fb6cd; --blue-soft:#1f2a33;
  --ok:#6fbf94; --warn:#d6b45c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}

.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:600}
.brand i{display:block;font-family:var(--sans);font-style:normal;font-size:11px;
  letter-spacing:.02em;color:var(--sub);margin-top:1px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;padding:6px 11px;border-radius:999px;
  cursor:pointer;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.hd{font-family:var(--serif);font-size:22px;margin:26px 0 2px;line-height:1.3}
.hd small{display:block;font-family:var(--sans);font-size:12px;color:var(--sub);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--sub);font-size:13.5px}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.87}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--accent);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--sub)}

.today{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.today h2{font-family:var(--serif);font-size:26px;margin:8px 0 4px;line-height:1.25}
.today .kotitle{color:var(--sub);font-size:14px;margin-bottom:14px}
.streak{display:flex;gap:18px;margin:14px 0 0;flex-wrap:wrap}
.streak div{text-align:center}
.streak b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.streak span{font-size:11.5px;color:var(--sub)}
.dlist{display:grid;gap:8px;margin-top:10px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.ditem:hover{border-color:var(--accent)}
.ditem .num{font-family:var(--serif);font-size:16px;width:26px;color:var(--sub);flex:none}
.ditem .t{flex:1;min-width:0}
.ditem .t b{display:block;font-size:14.5px;font-weight:600}
.ditem .t span{font-size:12px;color:var(--sub)}
.ditem .done{color:var(--ok);font-size:12px;font-weight:700;flex:none}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.past{background:var(--ok)}
.sesshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.clock{font-family:var(--serif);font-size:19px;margin-left:auto;letter-spacing:.04em}
.clock.over{color:var(--accent)}
.stepname{font-size:13px;font-weight:700}
.stepname em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}

.brief li{margin:7px 0}
.keyrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.keyrow:last-child{border:none}
.keyrow b{font-family:var(--serif);font-size:16px;flex:none;min-width:180px}
.keyrow span{font-size:13.5px;color:var(--sub)}
.keyrow .ex{display:block;font-family:var(--serif);font-size:13px;color:var(--sub);font-style:italic;margin-top:2px}

.sline{display:flex;gap:10px;padding:8px 10px;border-radius:9px;margin:2px 0;cursor:pointer}
.sline.now{background:var(--accent-soft)}
.sline .sp{font-family:var(--serif);font-weight:700;flex:none;width:20px;color:var(--accent)}
.sline.b .sp{color:var(--blue)}
.sline .en{font-family:var(--serif);font-size:16px;line-height:1.55}
.sline .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}

.shadowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:12px 0}
.who{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.who.b{color:var(--blue)}
.bigen{font-family:var(--serif);font-size:clamp(19px,4.1vw,27px);line-height:1.55;margin:8px 0 4px}
.chunks{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.chunk{font-family:var(--serif);font-size:clamp(17px,3.4vw,21px);padding:7px 12px;
  border-left:3px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.chunk:hover{background:var(--paper)}
.chunk.on{border-left-color:var(--accent);background:var(--accent-soft)}
.bigko{font-size:14px;color:var(--sub);margin-top:8px}
.blurme{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.blurme.show{filter:none;cursor:auto}
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.note{margin:8px 0;font-size:13.5px}
.note b{font-family:var(--serif);font-size:15px}
.note .k{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--blue-soft);
  color:var(--blue);margin-left:6px;font-weight:700;vertical-align:2px}
.note .tip{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.counter{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.speedbar{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.speedbar button{border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer}
.speedbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.asr{margin-top:10px;font-size:14px}
.asr .w{padding:1px 3px;border-radius:3px;font-family:var(--serif)}
.asr .w.bad{background:var(--accent-soft);color:var(--accent)}
.asr .w.good{color:var(--ok)}
.score{font-family:var(--serif);font-size:17px}

.qbox{margin:16px 0}
.qbox .q{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.qbox .hint{font-size:12.5px;color:var(--sub)}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;max-width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:10.5px;color:var(--sub)}
.cal div.done{background:var(--accent);color:#fff;font-weight:700}
.histrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.histrow b{font-family:var(--serif);font-size:15px}
.bankrow{padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow b{font-family:var(--serif);font-size:16px}
.bankrow .m{font-size:13px;color:var(--sub)}
.bankrow .ex{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--sub)}
.star{cursor:pointer;float:right;font-size:15px;opacity:.28}
.star.on{opacity:1}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px;z-index:30;display:none}
.footbar.on{display:block}
.footin{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.credit{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:11.5px;color:var(--sub);
  letter-spacing:.02em;text-align:center;opacity:.8}
.credit b{font-family:var(--serif);font-weight:600;letter-spacing:.06em}
@media(max-width:560px){
  .keyrow{flex-direction:column;gap:2px}
  .keyrow b{min-width:0}
  .brand i{display:none}
}

/* ---- 앱으로 설치하기 ---- */
.instbtn{background:var(--accent);color:var(--paper);border:none;padding:6px 12px;
  border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.instbtn[hidden]{display:none}
@media(max-width:560px){ .instbtn{margin-left:auto} }

#openChrome{position:fixed;inset:auto 12px 12px;max-width:520px;margin:0 auto;z-index:60;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--accent);color:var(--paper);border-radius:14px;padding:16px 18px;
  box-shadow:0 12px 40px -8px rgba(0,0,0,.45)}
#openChrome[hidden]{display:none}   /* display:flex가 hidden 속성을 이기므로 명시한다 */
#openChrome .oc-body{flex:1 1 240px;font-size:13.5px;line-height:1.7}
#openChrome .oc-body b{display:block;font-size:15px;margin-bottom:3px}
#openChrome .oc-body span{opacity:.9}
#openChrome button{border:none;border-radius:9px;padding:10px 16px;cursor:pointer;
  font-weight:700;font-size:14px;background:var(--paper);color:var(--accent)}
#openChrome button.ghost{background:transparent;color:inherit;font-weight:400;opacity:.85;padding:10px 8px}

#installNote{position:fixed;inset:auto 16px 16px;max-width:460px;margin:0 auto;z-index:50;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:0 12px 40px -8px rgba(0,0,0,.4)}
#installNote h5{margin:0 0 10px;font-size:15px}
#installNote p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.8}
#installNote ol{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--sub);line-height:1.95}
#installNote ol li{margin-bottom:3px}
#installNote b{color:var(--ink)}
#installNote button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13.5px}
#installNote .inst-btns{display:flex;gap:8px;flex-wrap:wrap}
#installNote #installNow{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
</style>
<div class="topbar"><div class="topin">
  <div class="brand">ROUNDTABLE<i>데일리 영어 쉐도잉</i></div>
  <nav class="tabs" id="tabs">
    <button data-view="home" class="on">홈</button>
    <button data-view="log">기록</button>
    <button data-view="bank">표현장</button>
    <button data-view="add">자료 추가</button>
    <button data-view="settings">설정</button>
  </nav>
  <button class="instbtn" id="installBtn" hidden>📲 설치</button>
</div></div>

<div class="wrap">
  <section id="view-home" class="view on"></section>
  <section id="view-session" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-bank" class="view"></section>
  <section id="view-add" class="view"></section>
  <section id="view-settings" class="view"></section>
</div>
<div class="credit">ROUNDTABLE — 데일리 영어 쉐도잉 &nbsp;·&nbsp; © 2026 <b>곤사마</b> (Gonsama). All rights reserved.</div>
<div class="footbar" id="footbar"><div class="footin" id="footin"></div></div>
<div class="toast" id="toast"></div>

<div id="openChrome" hidden>
  <div class="oc-body">
    <b id="ocApp">지금은 다른 앱 안에서 열려 있습니다.</b>
    <span id="ocMsg"></span>
  </div>
  <button id="ocGo">브라우저로 열기</button>
  <button id="ocCopy" class="ghost">주소 복사</button>
  <button id="ocClose" class="ghost">그냥 보기</button>
</div>

  <h5 id="installTitle">📲 홈 화면에 설치하기</h5>
  <div id="installSteps"></div>

    <button id="installNow" hidden>지금 설치</button>
    <button id="installNoteClose">알겠습니다</button>
  </div>
</div>

<script>
const CONTENT_BUILTIN = [
{
 id:"w1d1", day:1, cat:"경제", level:"B2",
 title:"When Money Stops Being Cheap",
 titleKo:"돈이 더는 싸지 않을 때 — 금리와 투자 결정",
 names:{A:"Nora (재무)", B:"Sam (영업·운영)"},
 brief:[
  "기업이 설비 투자를 결정할 때 보는 것은 수요만이 아니라 <b>자본비용(cost of capital)</b>이다. 돈을 빌리는 값이 오르면, 같은 수요·같은 프로젝트라도 승인 기준이 올라간다.",
  "금리 인상의 충격은 즉시 오지 않고 <b>시차를 두고(with a lag)</b> 온다. 낮은 금리로 고정해 둔 기존 부채가 만기를 맞아 <b>차환(roll over)</b>될 때 비로소 이자 부담이 드러나기 때문이다.",
  "그래서 실무에서 쓰는 개념이 <b>hurdle rate(투자 승인 최저 수익률)</b>와 <b>payback period(회수 기간)</b>다. 자본이 비쌀수록 회수 기간이 짧은 안건만 살아남는다.",
  "재고도 마찬가지다. 저금리 시절엔 재고를 쌓아두는 비용이 사실상 공짜에 가까웠지만, 고금리에서는 야적장의 한 톤 한 톤이 <b>빌린 돈</b>이 된다."
 ],
 lines:[
  {s:"A",en:"So the board pushed back on the expansion plan again. I'm not surprised, honestly.",
   ko:"결국 이사회가 증설안에 또 제동을 걸었어요. 솔직히 놀랍지도 않네요.",
   notes:[{t:"push back on ~",k:"phrasal",m:"~에 반대하다, 제동을 걸다",tip:"reject보다 훨씬 부드럽고 실무적입니다. 회의에서 반대할 때 한국인이 자주 쓰는 'I don't agree'를 이걸로 바꾸면 톤이 좋아집니다."},
          {t:"honestly",k:"colloquial",m:"솔직히 말해서",tip:"문장 끝에 붙이면 '내 개인 의견인데'라는 완충 역할을 합니다."}]},
  {s:"B",en:"Really? The demand numbers looked solid to me. What's the sticking point?",
   ko:"그래요? 수요 숫자는 탄탄해 보이던데요. 걸리는 게 뭔가요?",
   notes:[{t:"the sticking point",k:"idiom",m:"합의를 막는 결정적 걸림돌",tip:"problem이 뭉뚱그린 표현이라면, sticking point는 '논의가 딱 멈춘 지점'을 콕 집습니다."},
          {t:"solid",k:"collocation",m:"(수치가) 탄탄한, 믿을 만한",tip:"solid numbers / solid evidence / solid track record 로 자주 붙습니다."}]},
  {s:"A",en:"It's not demand. It's the cost of capital. Money isn't cheap anymore.",
   ko:"수요가 문제가 아니에요. 자본비용이죠. 이제 돈이 싸지 않으니까요.",
   notes:[{t:"cost of capital",k:"business",m:"자본비용(자금 조달 비용)",tip:"발음은 '코스트 오브 캐피털'에서 of를 거의 /əv/로 흘립니다. 붙여서 한 덩어리로 연습하세요."}]},
  {s:"B",en:"Fair enough, but we've been living with higher rates for a while now. Why is it biting only now?",
   ko:"일리는 있어요. 그런데 고금리는 한참 겪어 왔잖아요. 왜 하필 지금 타격이 오죠?",
   notes:[{t:"Fair enough, but ~",k:"idiom",m:"그 말도 일리는 있는데, 다만 ~",tip:"상대 말을 인정하고 반박으로 넘어가는 가장 자연스러운 다리입니다. 토론 필수 표현."},
          {t:"bite",k:"idiom",m:"(정책·비용이) 실제로 아프게 작용하다",tip:"When do the sanctions start to bite? 처럼 씁니다."}]},
  {s:"A",en:"Because the old debt was locked in at low rates. It's rolling over now, and the new terms are brutal.",
   ko:"예전 부채는 낮은 금리로 고정해 뒀거든요. 그게 지금 차환되는데 새 조건이 가혹해요.",
   notes:[{t:"locked in at ~",k:"phrasal",m:"(금리·가격을) ~로 고정해 둔",tip:"We locked in the price for two years. 가격 협상에서 그대로 씁니다."},
          {t:"roll over",k:"business",m:"(만기 부채를) 차환하다, 연장하다",tip:"계약에도 씁니다. The contract rolls over automatically. = 자동 갱신된다."},
          {t:"brutal",k:"colloquial",m:"(조건이) 가혹한, 살벌한",tip:"very bad의 구어체 강조. The schedule was brutal.도 자주 씁니다."}]},
  {s:"B",en:"Ah, so the pain shows up with a lag. That's the part people always miss.",
   ko:"아, 그래서 고통이 시차를 두고 나타나는군요. 다들 놓치는 부분이 그거죠.",
   notes:[{t:"with a lag",k:"business",m:"시차를 두고",tip:"경제 기사에 대단히 자주 나옵니다. Policy works with a lag."},
          {t:"show up",k:"phrasal",m:"(수치·증상이) 나타나다, 드러나다",tip:"appear보다 훨씬 구어적입니다. It'll show up in next quarter's numbers."}]},
  {s:"A",en:"Exactly. On paper we look fine, but the interest bill quietly eats the margin.",
   ko:"맞아요. 서류상으론 멀쩡해 보이지만, 이자 비용이 조용히 마진을 갉아먹죠.",
   notes:[{t:"on paper",k:"idiom",m:"서류상으로는, 이론상으로는",tip:"뒤에 but이 오는 게 거의 공식입니다. On paper it works, but in practice..."},
          {t:"eat the margin",k:"collocation",m:"마진을 잠식하다",tip:"eat into the margin 형태도 똑같이 많이 씁니다."}]},
  {s:"B",en:"Still, if we sit on our hands, we hand the market to competitors. There's a cost to doing nothing.",
   ko:"그래도 손 놓고 있으면 시장을 경쟁사에 넘겨주는 거예요. 아무것도 안 하는 데도 비용이 있죠.",
   notes:[{t:"sit on our hands",k:"idiom",m:"팔짱 끼고 아무것도 안 하다",tip:"do nothing을 그림으로 바꾼 표현. 회의에서 쓰면 확 살아납니다."},
          {t:"hand ~ to ...",k:"phrasal",m:"~을 …에게 그냥 넘겨주다",tip:"give away의 뉘앙스로, '싸워보지도 않고 내줬다'는 아쉬움이 깔립니다."}]},
  {s:"A",en:"I'd push back on that a little. Not every year is a land-grab year.",
   ko:"그 부분은 조금 반박하고 싶네요. 매년이 땅따먹기 하는 해는 아니잖아요.",
   notes:[{t:"I'd push back on that",k:"idiom",m:"거기엔 이견이 있습니다",tip:"I disagree.(직설)보다 훨씬 안전한 반박. would 덕분에 톤이 눌립니다."},
          {t:"land-grab",k:"colloquial",m:"점유율 확보 경쟁, 땅따먹기",tip:"시장 초기 무리한 확장을 가리킬 때 씁니다."}]},
  {s:"B",en:"Meaning what, exactly?",
   ko:"정확히 무슨 뜻이죠?",
   notes:[{t:"Meaning what, exactly?",k:"colloquial",m:"그게 정확히 무슨 말이죠?",tip:"짧게 되묻는 실전 표현. 공격적이지 않게 하려면 톤을 낮추고 exactly를 부드럽게."}]},
  {s:"A",en:"Meaning when capital is expensive, the bar for a project goes up. Payback has to be shorter.",
   ko:"자본이 비싸지면 프로젝트 통과 기준이 올라간다는 뜻이에요. 회수 기간이 더 짧아야 하죠.",
   notes:[{t:"the bar goes up",k:"idiom",m:"기준(문턱)이 높아지다",tip:"raise the bar / set a high bar 로도 확장됩니다."},
          {t:"payback",k:"business",m:"투자금 회수(기간)",tip:"a two-year payback = 2년 회수. 숫자+year+payback 형태를 통째로 외우세요."}]},
  {s:"B",en:"So a project that made sense at two percent doesn't make sense at six.",
   ko:"그럼 2%에서 말이 되던 안건이 6%에서는 말이 안 된다는 거네요.",
   notes:[{t:"make sense",k:"collocation",m:"타당하다, 말이 되다",tip:"'이해된다'가 아니라 '사업적으로 성립한다'는 뜻으로도 씁니다. Does the math make sense?"}]},
  {s:"A",en:"Right. Same project, same demand, different hurdle rate.",
   ko:"그렇죠. 같은 프로젝트, 같은 수요, 다른 승인 기준이요.",
   notes:[{t:"hurdle rate",k:"business",m:"투자 승인 최저 수익률",tip:"이 정도 수익률은 넘어야 한다는 '허들'. 재무 회의에서 그대로 쓰입니다."}]},
  {s:"B",en:"That's a cleaner way to put it than what I said in the meeting.",
   ko:"제가 회의에서 말한 것보다 훨씬 깔끔한 표현이네요.",
   notes:[{t:"a cleaner way to put it",k:"idiom",m:"더 깔끔하게 표현하는 방식",tip:"put it = 표현하다. To put it simply / Let me put it this way 로 확장됩니다."}]},
  {s:"A",en:"The other thing is inventory. Holding stock used to be almost free. Now it's a financing decision.",
   ko:"또 하나는 재고예요. 재고를 쥐고 있는 게 예전엔 거의 공짜였는데, 지금은 금융 결정이죠.",
   notes:[{t:"The other thing is ~",k:"colloquial",m:"그리고 또 하나는 ~",tip:"논점을 추가할 때 쓰는 자연스러운 신호. Also보다 대화답습니다."},
          {t:"used to be",k:"grammar",m:"예전엔 ~였다 (지금은 아니다)",tip:"변화를 설명할 때 핵심 문법. 발음은 '유스트 비'로 붙여서."}]},
  {s:"B",en:"I hadn't thought of it that way, but yes, every ton sitting in the yard is borrowed money.",
   ko:"그렇게는 생각 못 했는데, 맞네요. 야적장에 있는 1톤 1톤이 다 빌린 돈이죠.",
   notes:[{t:"I hadn't thought of it that way",k:"idiom",m:"그런 식으로는 생각 못 했네요",tip:"상대 논점을 인정하는 고급 리액션. 통째로 외워 두면 토론에서 바로 씁니다."},
          {t:"sitting in the yard",k:"collocation",m:"야적장에 놀고 있는",tip:"sit = (쓰이지 않고) 놀고 있다. Cash sitting in the account 처럼도 씁니다."}]},
  {s:"A",en:"That's the thing. High rates don't just kill projects. They change how you run the day-to-day.",
   ko:"바로 그거예요. 고금리는 프로젝트만 죽이는 게 아니라, 일상 운영 방식 자체를 바꿔요.",
   notes:[{t:"That's the thing.",k:"colloquial",m:"바로 그게 핵심이에요",tip:"상대가 방금 짚은 걸 받아 강조할 때. 원어민 대화에서 매우 빈번합니다."},
          {t:"the day-to-day",k:"colloquial",m:"일상 업무, 매일의 운영",tip:"명사로 씁니다. I'm buried in the day-to-day."}]},
  {s:"B",en:"So what would you actually propose? We can't just freeze everything.",
   ko:"그럼 실제로 뭘 제안하시겠어요? 전부 동결할 수는 없잖아요.",
   notes:[{t:"What would you actually propose?",k:"business",m:"그래서 실제 제안은 뭔가요?",tip:"actually가 '비판만 하지 말고 대안을'이라는 압박을 부드럽게 실어 줍니다."}]},
  {s:"A",en:"Phase it. Build the part with a two-year payback now, and keep the rest on the shelf.",
   ko:"단계로 나누죠. 2년이면 회수되는 부분만 지금 짓고, 나머지는 보류해 두는 거예요.",
   notes:[{t:"phase it",k:"business",m:"단계적으로 나눠 진행하다",tip:"a phased approach / phase in / phase out 세트로 외우면 좋습니다."},
          {t:"keep ~ on the shelf",k:"idiom",m:"~을 서랍에 넣어 두다, 보류하다",tip:"버리는 게 아니라 '언제든 꺼낼 수 있게 대기'라는 뉘앙스입니다."}]},
  {s:"B",en:"I can sell that upstairs. It sounds disciplined rather than defensive.",
   ko:"그거라면 윗선에 설득할 수 있겠어요. 방어적이라기보다 절제된 것처럼 들리니까요.",
   notes:[{t:"sell it upstairs",k:"idiom",m:"윗선(경영진)을 설득하다",tip:"sell = 설득하다. sell an idea to the team 처럼 씁니다."},
          {t:"A rather than B",k:"grammar",m:"B라기보다 A인",tip:"평가를 뒤집을 때 강력합니다. cautious rather than slow 처럼."}]}

{
 id:"w1d2", day:2, cat:"신기술", level:"B2",
 title:"The Part the Machine Can't Sign Off On",
 titleKo:"기계가 결재할 수 없는 부분 — AI와 사무직의 일",
 names:{A:"Ravi (기획)", B:"Elena (현업 팀장)"},
 brief:[
  "AI가 일자리에 미치는 영향은 '직업(job)'이 아니라 <b>작업(task)</b> 단위로 보는 것이 정확하다. 한 직업은 수십 개 작업의 묶음이고, AI는 그중 일부만 잘한다.",
  "그래서 현장에서 실제로 갈리는 기준은 <b>automation(대체)</b>이냐 <b>augmentation(증강)</b>이냐이다. 초안 작성·요약·정리는 증강 쪽, 판단과 책임은 여전히 사람 쪽에 남는다.",
  "핵심 병목은 성능이 아니라 <b>검증 비용(the cost of checking)</b>이다. 결과를 사람이 다시 확인해야 한다면, 절약한 시간의 일부는 되돌아온다.",
  "결국 조직에서 남는 질문은 하나다 — <b>누가 서명하는가(who signs off)</b>. 책임은 위임되지 않기 때문에, 이 지점이 사람의 자리를 정의한다."
 ],
 lines:[
  {s:"A",en:"Everyone keeps asking whether AI will replace these roles. I think that's the wrong question.",
   ko:"다들 AI가 이 직무를 대체할까만 묻는데, 저는 그게 잘못된 질문이라고 봐요.",
   notes:[{t:"keep -ing",k:"grammar",m:"계속 ~하다",tip:"People keep asking / He keeps missing deadlines. 반복에 대한 은근한 짜증이 담깁니다."}]},
  {s:"B",en:"Go on. What would you ask instead?",
   ko:"계속해 보세요. 대신 뭘 물으시겠어요?",
   notes:[{t:"Go on.",k:"colloquial",m:"계속 말해 보세요",tip:"짧지만 매우 자연스러운 맞장구. 억양을 올리면 '설마?'가 되니 평평하게."}]},
  {s:"A",en:"Which tasks, not which jobs. A job is a bundle of twenty things, and the tool is good at maybe six.",
   ko:"어떤 직업이 아니라 어떤 작업이냐죠. 직업은 스무 가지 일의 묶음이고, 도구는 그중 여섯 개쯤 잘해요.",
   notes:[{t:"a bundle of ~",k:"collocation",m:"~의 묶음",tip:"a bundle of tasks / a bundle of rights. 추상적인 '한 덩어리'에 씁니다."},
          {t:"be good at ~",k:"grammar",m:"~을 잘하다",tip:"뒤에는 반드시 명사나 -ing. good at writing drafts."}]},
  {s:"B",en:"That tracks with what I see. It drafts fast, but I still rewrite the parts that matter.",
   ko:"제가 보는 것과 일치하네요. 초안은 빨리 뽑는데, 정작 중요한 부분은 제가 다시 씁니다.",
   notes:[{t:"That tracks.",k:"colloquial",m:"말이 되네요, 제 경험과 맞아요",tip:"최근 구어에서 매우 자주 쓰입니다. That tracks with my experience."},

  {s:"A",en:"Right, and that's the whole debate in one sentence: automation versus augmentation.",
   ko:"맞아요, 그 한 문장에 논쟁 전체가 들어 있죠. 대체냐 증강이냐.",
   notes:[{t:"in one sentence",k:"collocation",m:"한 문장으로 말하면",tip:"발표에서 쓰기 좋습니다. Here's the problem in one sentence."}]},
  {s:"B",en:"Augmentation sounds nice, but it's often a polite word for cutting headcount later.",
   ko:"증강이란 말은 듣기 좋지만, 나중에 인원을 줄이겠다는 말의 완곡한 표현일 때가 많죠.",
   notes:[{t:"a polite word for ~",k:"idiom",m:"~을 완곡하게 돌려 말한 것",tip:"냉소를 담아 비판할 때 유용합니다."},
          {t:"headcount",k:"business",m:"인원수, 정원",tip:"cut headcount / freeze headcount. HR 회의 필수어."}]},
  {s:"A",en:"Sometimes, yes. But look at where the time actually goes when a team adopts it.",
   ko:"때로는 그렇죠. 그런데 팀이 도입했을 때 시간이 실제로 어디로 가는지 보세요.",
   notes:[{t:"where the time goes",k:"idiom",m:"시간이 어디로 새는지",tip:"where the money goes 로도 그대로 씁니다."}]},
  {s:"B",en:"Let me guess. You save an hour writing and lose forty minutes checking.",

  {s:"A",en:"That's exactly it. The bottleneck moves from producing to verifying.",

  {s:"B",en:"And verification is harder to measure, so it never shows up in the savings slide.",

  {s:"A",en:"Fair point. Though I'd argue checking a draft still beats staring at a blank page.",
   ko:"타당한 지적이에요. 그래도 초안을 확인하는 게 빈 화면을 노려보는 것보단 낫다고 봅니다.",
   notes:[{t:"Fair point.",k:"idiom",m:"타당한 지적입니다",tip:"짧게 인정하고 넘어가는 토론 필수 리액션."},
          {t:"A beats B",k:"colloquial",m:"A가 B보다 낫다",tip:"Anything beats doing it manually. 비교급 대신 쓰면 훨씬 생동감 있습니다."},
          {t:"stare at a blank page",k:"idiom",m:"백지 앞에서 막막해하다",tip:"작문·기획 업무의 고통을 그대로 그립니다."}]},
  {s:"B",en:"I'll give you that one. The first draft was always the slowest part for my team.",

  {s:"A",en:"So the real risk isn't unemployment. It's people signing off on work they didn't really read.",
   ko:"그래서 진짜 위험은 실업이 아니라, 제대로 읽지도 않은 문서에 결재하는 거예요.",

  {s:"A",en:"That's the accountability gap. The tool has no skin in the game.",

  {s:"B",en:"Then the answer is process, not policy. Somebody's name has to stay on the document.",

   notes:[{t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"대조를 짧게 찍는 강력한 구조. 말할 때 not 앞에서 살짝 쉬세요."}]},
  {s:"A",en:"Agreed. And train people to ask where a claim came from, not just whether it reads well.",

          {t:"read well",k:"collocation",m:"(글이) 잘 읽히다",tip:"주어가 글입니다. The report reads well."}]},
  {s:"B",en:"That's a skill we never taught, honestly. We taught people to produce, not to audit.",
   ko:"솔직히 우리가 한 번도 안 가르친 능력이죠. 생산하는 법만 가르치고 검증하는 법은 안 가르쳤어요.",
   notes:[{t:"audit",k:"business",m:"검증하다, 따져보다",tip:"회계 감사 외에 '내용을 따져본다'는 넓은 뜻으로도 씁니다."}]},
  {s:"A",en:"Give it a year and that becomes the differentiator between two people with the same title.",
   ko:"1년만 지나면 그게 같은 직급 두 사람을 가르는 차이가 될 거예요.",
   notes:[{t:"Give it a year",k:"colloquial",m:"1년만 지나 보세요",tip:"명령문으로 예측을 말하는 세련된 형태. Give it a month and you'll see."},
          {t:"the differentiator",k:"business",m:"차별화 요소",tip:"What's our differentiator? 마케팅 회의 단골."}]},
  {s:"B",en:"Then let's stop calling it a tools problem and start calling it a judgment problem.",
   ko:"그럼 이걸 도구 문제라 부르지 말고 판단력 문제라고 부르기 시작합시다.",
   notes:[{t:"stop calling it A and start calling it B",k:"collocation",m:"A가 아니라 B라고 부르자",tip:"프레임을 바꾸자고 제안하는 강한 수사입니다."}]}

{
 id:"w1d3", day:3, cat:"국제정세·안보", level:"B2",
 title:"Supply Chains Learn to Worry",
 titleKo:"공급망이 불안을 배우다 — 효율에서 회복탄력성으로",
 names:{A:"Julia (구매)", B:"Marc (전략)"},
 brief:[
  "수십 년간 글로벌 공급망의 설계 원칙은 <b>효율(just-in-time)</b>이었다. 재고를 최소화하고, 가장 싼 곳에서 조달하고, 공급처를 하나로 모아 단가를 낮추는 방식이다.",
  "팬데믹과 지정학적 충돌을 겪으며 원칙이 <b>회복탄력성(just-in-case)</b>으로 이동했다. 이중 조달(dual sourcing), 재고 완충, 지역 분산이 다시 비용을 감수할 가치가 있는 것으로 평가된다.",
  "여기에 <b>수출통제(export controls)</b>와 <b>프렌드쇼어링(friend-shoring)</b>이 겹친다. 어디서 만드느냐가 단가 문제가 아니라 <b>정치적 노출(exposure)</b>의 문제가 되었다.",
  "다만 회복탄력성은 공짜가 아니다. 이중화는 규모의 경제를 깎고, 재고는 자금을 묶는다. 실무의 질문은 '분산하느냐'가 아니라 <b>'어디까지 이중화할 것인가'</b>다."
 ],
 lines:[
  {s:"A",en:"Procurement wants to dual-source the alloy. Finance says we're gold-plating the risk.",
   ko:"구매는 그 합금을 이중 조달하자고 하고, 재무는 리스크에 과하게 돈을 쓴다고 해요.",
   notes:[{t:"dual-source",k:"business",m:"공급처를 둘로 이원화하다",tip:"single-source(단일 조달)의 반대. 명사 dual sourcing으로도 씁니다."},
          {t:"gold-plate",k:"idiom",m:"필요 이상으로 과하게 하다",tip:"원래 '금도금하다'. 사양·비용이 과잉일 때 비판적으로 씁니다."}]},
  {s:"B",en:"Both are right, which is why this always ends in a standoff.",
   ko:"둘 다 맞아요. 그래서 이 논의는 늘 교착으로 끝나죠.",
   notes:[{t:"a standoff",k:"idiom",m:"교착 상태, 대치",tip:"협상·노사·외교 모두에 씁니다. The talks ended in a standoff."}]},
  {s:"A",en:"For thirty years the rule was simple. Squeeze the inventory, chase the lowest landed cost.",
   ko:"30년간 규칙은 단순했어요. 재고는 쥐어짜고, 가장 낮은 도착원가를 좇는 거죠.",
   notes:[{t:"squeeze the inventory",k:"collocation",m:"재고를 최소로 줄이다",tip:"squeeze costs / squeeze margins 로 확장됩니다."},
          {t:"landed cost",k:"business",m:"도착원가(운임·관세 포함 원가)",tip:"무역 실무 필수어. 단순 단가와 구별해서 쓰세요."}]},
  {s:"B",en:"And it worked beautifully until the day it didn't.",
   ko:"그리고 그 방식은 안 통하는 날이 오기 전까지는 훌륭하게 작동했죠.",
   notes:[{t:"until the day it didn't",k:"idiom",m:"안 되기 전까지는 (잘 됐다)",tip:"영어 특유의 냉소적 반전 구문. 통째로 외워 두면 강력합니다."}]},
  {s:"A",en:"Now the same executives who preached just-in-time want buffer stock. Overnight.",
   ko:"이제는 적시 생산을 설파하던 바로 그 임원들이 완충 재고를 원해요. 하룻밤 사이에요.",
   notes:[{t:"preach",k:"colloquial",m:"(주의·방침을) 설파하다",tip:"약간 비꼬는 뉘앙스가 있습니다. He preaches efficiency."},
          {t:"buffer stock",k:"business",m:"완충 재고, 안전 재고",tip:"safety stock과 사실상 같은 뜻으로 쓰입니다."}]},
  {s:"B",en:"To be fair, the ground shifted. Cost isn't the only variable anymore.",
   ko:"공정하게 말하면 판이 바뀌었어요. 이제 비용만 변수인 게 아니니까요.",
   notes:[{t:"To be fair",k:"idiom",m:"공정하게 말하자면",tip:"상대를 변호하며 균형을 잡는 표현. 토론에서 신뢰를 줍니다."},
          {t:"the ground shifted",k:"idiom",m:"전제(판)가 바뀌었다",tip:"the goalposts moved(기준이 바뀌었다)와 짝으로 알아 두세요."}]},
  {s:"A",en:"You mean export controls. Where you make something now decides who can buy it.",
   ko:"수출통제 말이군요. 어디서 만드느냐가 누가 살 수 있는지를 결정하죠.",
   notes:[{t:"export controls",k:"business",m:"수출통제",tip:"보통 복수형. subject to export controls = 수출통제 대상."}]},
  {s:"B",en:"Exactly. Geography used to be a cost question. It's a permission question now.",
   ko:"바로 그거예요. 지리는 예전엔 비용 문제였는데, 지금은 허가 문제죠.",
   notes:[{t:"used to be A, it's B now",k:"grammar",m:"예전엔 A였지만 지금은 B다",tip:"변화 설명의 뼈대 문형. 이 대비 구조를 입에 붙이세요."}]},
  {s:"A",en:"That's what my counterpart in Nagoya keeps hinting at, without ever saying it outright.",
   ko:"나고야 쪽 담당자가 계속 그걸 돌려서 암시해요. 대놓고 말하진 않고요.",
   notes:[{t:"my counterpart",k:"business",m:"(상대 회사의) 같은 직급 담당자",tip:"해외 업무에서 매일 쓰는 단어입니다. your counterpart at the supplier."},
          {t:"hint at",k:"phrasal",m:"~을 넌지시 비치다",tip:"say outright(대놓고 말하다)와 대비해서 기억하세요."}]},
  {s:"B",en:"Nobody says it outright. They just ask where your feedstock comes from.",
   ko:"아무도 대놓고 말 안 하죠. 그냥 원료가 어디서 오는지 물을 뿐이에요.",
   notes:[{t:"feedstock",k:"business",m:"(공정에 투입되는) 원료",tip:"철강·화학 업계 필수어. raw material보다 구체적입니다."}]},
  {s:"A",en:"So we're being asked to prove a negative. That's expensive.",
   ko:"결국 '아니라는 걸 증명하라'는 요구를 받는 셈이죠. 그건 비쌉니다.",
   notes:[{t:"prove a negative",k:"idiom",m:"없다는 것을 증명하다(사실상 불가능한 요구)",tip:"논리학 표현이 실무 회의에 자주 들어옵니다."}]},
  {s:"B",en:"It is, but resilience always shows up as a line item somewhere.",
   ko:"맞아요. 그런데 회복탄력성은 결국 어딘가 비용 항목으로 나타나기 마련이죠.",
   notes:[{t:"a line item",k:"business",m:"(예산·명세의) 개별 항목",tip:"It's a line item in the budget. 예산 논의 필수어."}]},
  {s:"A",en:"Fine, but let's not pretend redundancy is free. Two suppliers means half the volume each.",
   ko:"좋아요. 그래도 이중화가 공짜인 척은 맙시다. 공급처가 둘이면 각각 물량이 절반이잖아요.",
   notes:[{t:"redundancy",k:"business",m:"(안전을 위한) 이중화, 여분",tip:"영국 영어에서는 '정리해고'라는 뜻도 있어 문맥 주의."},
          {t:"let's not pretend ~",k:"idiom",m:"~인 척은 하지 맙시다",tip:"불편한 진실을 꺼낼 때 쓰는 강한 표현."}]},
  {s:"B",en:"Which kills your leverage on price. I know. I've had that argument twice this month.",
   ko:"그럼 가격 협상력이 죽죠. 압니다. 이번 달에만 그 논쟁을 두 번 했어요.",
   notes:[{t:"leverage",k:"business",m:"협상력, 지렛대",tip:"발음 주의: 미국식 /ˈlevərɪdʒ/. lose leverage / gain leverage."}]},
  {s:"A",en:"So where do you actually draw the line?",
   ko:"그럼 선을 실제로 어디에 긋죠?",
   notes:[{t:"draw the line",k:"idiom",m:"선을 긋다, 한계를 정하다",tip:"Where do you draw the line? 은 원칙을 묻는 정석 질문입니다."}]},
  {s:"B",en:"Only where a single failure stops the whole line. Everything else stays single-sourced.",
   ko:"한 번 끊기면 라인 전체가 멈추는 곳만요. 나머지는 단일 조달로 갑니다.",
   notes:[{t:"a single failure",k:"collocation",m:"단일 지점의 고장",tip:"single point of failure(단일 장애점)라는 정식 용어도 함께."}]},
  {s:"A",en:"That I can defend in front of the steering committee.",
   ko:"그거라면 운영위원회 앞에서 방어할 수 있겠네요.",
   notes:[{t:"That I can defend",k:"grammar",m:"그거라면 방어할 수 있다",tip:"목적어를 앞으로 뺀 도치. 강조 효과가 큽니다. That I don't know."},
          {t:"steering committee",k:"business",m:"운영위원회",tip:"프로젝트 의사결정 기구. 회의체 이름은 통째로 외우세요."}]},
  {s:"B",en:"And frame it as insurance, not as distrust of the supplier. Wording matters here.",
   ko:"그리고 공급사 불신이 아니라 보험이라고 프레임을 잡으세요. 여기선 표현이 중요합니다.",
   notes:[{t:"frame it as ~",k:"business",m:"~로 규정하다, 프레임을 잡다",tip:"협상·보고에서 핵심 동사. Let's frame it as an upgrade."},
          {t:"Wording matters.",k:"collocation",m:"표현(문구)이 중요합니다",tip:"계약·공문 협의에서 그대로 씁니다."}]},
  {s:"A",en:"Especially with a partner we've worked with for twenty years.",
   ko:"20년 거래한 파트너라면 더욱 그렇죠.",
   notes:[{t:"work with",k:"collocation",m:"거래하다, 협업하다",tip:"a supplier we've worked with for years. 완료형과 잘 붙습니다."}]},
  {s:"B",en:"Then we're aligned. Let me write it up before someone reopens the whole debate.",
   ko:"그럼 의견이 맞은 거네요. 누가 논의를 다시 열기 전에 정리해서 올릴게요.",
   notes:[{t:"we're aligned",k:"business",m:"의견이 일치했다",tip:"글로벌 기업 회의 최다 빈출. Are we aligned on this?"},
          {t:"write it up",k:"phrasal",m:"문서로 정리하다",tip:"I'll write it up and send it around."},
          {t:"reopen the debate",k:"collocation",m:"논의를 다시 열다",tip:"부정적 뉘앙스가 있습니다. 이미 끝난 걸 되돌린다는 뜻."}]}
 ],
 keys:[
  {en:"To be fair, ~",ko:"공정하게 말하자면 ~",ex:"To be fair, they warned us in January."},
  {en:"the ground shifted",ko:"판(전제)이 바뀌었다",ex:"The ground shifted when the tariffs came in."},
  {en:"draw the line",ko:"한계를 긋다",ex:"We draw the line at critical components."},
  {en:"landed cost",ko:"도착원가",ex:"Compare landed cost, not list price."},
  {en:"leverage",ko:"협상력",ex:"Splitting the order costs us leverage."},
  {en:"frame it as ~",ko:"~로 규정하다",ex:"Frame it as risk management, not as cost."},
  {en:"we're aligned",ko:"의견이 일치했습니다",ex:"Good — we're aligned on scope, then."},
  {en:"write it up",ko:"문서로 정리하다",ex:"I'll write it up before Friday."}
 ],
 out:[
  {q:"Explain one supply risk in your own industry and how you would hedge it.",hint:"dual-source / draw the line / a single failure"},

 ]
},
{
 id:"w1d4", day:4, cat:"리더십·조직갈등", level:"B2",
 title:"The Meeting Where Nobody Says Anything",
 titleKo:"아무도 말하지 않는 회의 — 침묵과 갈등의 두 얼굴",
 names:{A:"Priya (팀장)", B:"Tom (동료 팀장)"},
 brief:[
  "조직심리학에서 갈등은 두 종류로 나뉜다. <b>task conflict(과업 갈등)</b>은 '무엇이 옳은가'를 두고 다투는 것이고, <b>relationship conflict(관계 갈등)</b>은 사람 자체를 겨냥한다. 전자는 성과를 높일 수 있지만, 후자는 거의 항상 성과를 깎는다.",
  "문제는 둘이 쉽게 섞인다는 점이다. 과업 갈등이 오래 방치되면 인신공격으로 변질되고, 그때부터 팀은 <b>말을 아끼기(hold back)</b> 시작한다.",
  "에이미 에드먼슨의 <b>psychological safety(심리적 안전감)</b> 연구가 말하는 핵심은 '사이좋은 팀'이 아니라, <b>반대 의견을 냈을 때 벌 받지 않는다는 확신</b>이다. 안전한 팀은 오히려 실수를 더 많이 보고한다.",
  "리더가 쓸 수 있는 가장 값싼 도구는 <b>말하는 순서</b>다. 상급자가 먼저 결론을 말하면 반대 의견은 사라진다(anchoring). 그래서 '리더가 마지막에 말하기'가 실전 처방으로 자주 권장된다."
 ],
 lines:[
  {s:"A",en:"Something's off in my team meetings. Everyone agrees, and nothing improves.",
   ko:"우리 팀 회의가 뭔가 이상해요. 다들 동의하는데, 나아지는 게 없어요.",
   notes:[{t:"Something's off.",k:"colloquial",m:"뭔가 이상해요",tip:"근거를 못 대지만 감이 이상할 때. wrong보다 훨씬 자연스럽습니다."}]},
  {s:"B",en:"That's usually not agreement. That's people waiting for the meeting to end.",
   ko:"그건 보통 동의가 아니에요. 회의가 끝나기만 기다리는 거죠.",
   notes:[{t:"wait for ~ to end",k:"grammar",m:"~이 끝나기를 기다리다",tip:"wait for + 목적어 + to부정사 구조. 입에 붙여 두세요."}]},
  {s:"A",en:"Ouch. Fair, though. Silence is easy to mistake for buy-in.",
   ko:"아프네요. 그래도 맞는 말이에요. 침묵은 동의로 착각하기 쉽죠.",
   notes:[{t:"Ouch.",k:"colloquial",m:"아, 아프다 (뼈 맞았다)",tip:"뼈아픈 지적을 유머로 받는 리액션. 회의 분위기를 부드럽게 합니다."},
          {t:"buy-in",k:"business",m:"(구성원의) 동의와 지지",tip:"get buy-in from the team. 명사로 씁니다."},
          {t:"mistake A for B",k:"grammar",m:"A를 B로 착각하다",tip:"Don't mistake politeness for agreement."}]},
  {s:"B",en:"Can I ask something blunt? Do you say what you think before or after they do?",
   ko:"직설적으로 하나 물어도 될까요? 팀원들보다 먼저 의견을 말하나요, 나중에 말하나요?",
   notes:[{t:"Can I ask something blunt?",k:"idiom",m:"직설적인 질문 하나 해도 될까요?",tip:"민감한 질문 전에 까는 완충 장치. 매우 유용합니다."},
          {t:"blunt",k:"colloquial",m:"직설적인, 돌직구의",tip:"rude와 다릅니다. 예의는 지키되 돌려 말하지 않는 것."}]},
  {s:"A",en:"Before, obviously. I'm trying to give them direction.",
   ko:"당연히 먼저죠. 방향을 주려는 거니까요.",
   notes:[{t:"give direction",k:"collocation",m:"방향을 제시하다",tip:"give guidance / set direction 도 같이 쓰입니다."}]},
  {s:"B",en:"Then you've already anchored the room. After that, disagreeing costs them something.",

  {s:"A",en:"I hear that a lot, but doesn't a leader have to lead?",

  {s:"B",en:"Lead the question, not the answer. Ask first, decide last.",

          {t:"price signal",k:"business",m:"가격 신호",tip:"경제 용어를 조직 문화에 은유로 쓰는 세련된 화법입니다."}]},

{
 id:"w1d5", day:5, cat:"에너지", level:"B2",
 title:"The Grid Is the Bottleneck",
 titleKo:"병목은 전력망이다 — 재생에너지와 산업의 열",
 names:{A:"Hana (설비)", B:"Owen (에너지 담당)"},
 brief:[
  "재생에너지의 근본 과제는 발전 단가가 아니라 <b>간헐성(intermittency)</b>이다. 태양광·풍력은 필요한 시간이 아니라 자연이 허락하는 시간에 발전한다.",
  "그래서 초점이 발전기에서 <b>전력망(grid)</b>과 <b>저장(storage)</b>으로 옮겨간다. 배터리는 시간 단위 이동에는 강하지만, 며칠 단위의 <b>장주기 저장(long-duration storage)</b>은 여전히 어려운 문제다.",
  "송전선 건설은 기술이 아니라 <b>인허가(permitting)</b>와 부지 문제로 지연되는 경우가 많다. 전력 수요지와 발전 적지가 지리적으로 어긋나 있기 때문이다.",
  "제조업의 진짜 난제는 전기가 아니라 <b>고온의 열(industrial heat)</b>이다. 철강의 경우 석탄 대신 수소를 쓰는 <b>수소환원제철(hydrogen-based direct reduction)</b>이 논의되지만, 저렴한 청정 수소와 대규모 전력이 전제 조건이다."
 ],
 lines:[
  {s:"A",en:"The board wants a number for going green. I keep telling them it isn't one number.",
   ko:"이사회가 친환경 전환 비용을 숫자 하나로 달래요. 하나로 안 나온다고 계속 말하는 중이고요.",
   notes:[{t:"go green",k:"colloquial",m:"친환경으로 전환하다",tip:"가벼운 구어. 공식 문서에서는 decarbonize를 씁니다."}]},
  {s:"B",en:"It never is. The generation cost is the easy half.",
   ko:"당연히 아니죠. 발전 단가는 쉬운 쪽 절반이에요.",
   notes:[{t:"It never is.",k:"colloquial",m:"늘 그렇지 않죠",tip:"앞 문장의 be동사를 받아 짧게 되받는 리듬. 원어민다운 축약입니다."},
          {t:"the easy half",k:"idiom",m:"쉬운 쪽 절반",tip:"the hard part과 짝지어 씁니다."}]},
  {s:"A",en:"Right. Solar is cheap at noon and worth nothing at seven in the evening.",

   notes:[{t:"worth nothing",k:"collocation",m:"아무 가치가 없는",tip:"worthless보다 구어적이고 강조가 됩니다."}]},
  {s:"B",en:"That's intermittency in one line. The power shows up when nature decides, not when we do.",
   ko:"그게 간헐성을 한 줄로 말한 거예요. 전기는 우리가 아니라 자연이 정한 시간에 나오죠.",
   notes:[{t:"intermittency",k:"business",m:"간헐성",tip:"에너지 논의의 핵심어. 형용사는 intermittent."},
          {t:"in one line",k:"collocation",m:"한 줄로 요약하면",tip:"in one sentence와 같은 용법입니다."}]},
  {s:"A",en:"So we store it. Batteries have come down a lot, haven't they?",

  {s:"B",en:"For a few hours, yes. For a windless week in winter, not even close.",

  {s:"A",en:"That's the long-duration problem everyone waves at and nobody solves.",

  {s:"B",en:"And even if we solved it tomorrow, the lines wouldn't be there.",
   ko:"그리고 내일 그걸 풀어도, 송전선이 없을 거예요.",

  {s:"B",en:"It's not a technology problem, either. It's permitting, land, and local objections.",

  {s:"A",en:"Which takes a decade, while a plant takes three years. The timelines don't line up.",

   notes:[{t:"line up",k:"phrasal",m:"(일정·조건이) 맞아떨어지다",tip:"The dates don't line up. 매우 자주 씁니다."}]},
  {s:"B",en:"That mismatch is the whole story, honestly. Not the panels.",
   ko:"솔직히 그 불일치가 이야기의 전부예요. 패널이 아니라요.",
   notes:[{t:"mismatch",k:"business",m:"불일치, 미스매치",tip:"a mismatch between supply and demand."}]},
  {s:"A",en:"Now bring it back to us. Our furnaces don't run on electricity anyway.",
   ko:"이제 우리 얘기로 돌아와 보죠. 어차피 우리 용광로는 전기로 돌지 않잖아요.",
   notes:[{t:"bring it back to ~",k:"phrasal",m:"논의를 ~로 되돌리다",tip:"회의 진행에 유용. Let me bring it back to the agenda."},
          {t:"run on ~",k:"phrasal",m:"~로 작동하다, ~를 연료로 쓰다",tip:"run on gas / run on batteries."}]},
  {s:"B",en:"That's the harder half. High-temperature heat is where the easy answers run out.",

  {s:"B",en:"It's chemically sound. The catch is that clean hydrogen needs cheap, steady power.",
   ko:"화학적으로는 타당해요. 함정은 청정 수소가 싸고 안정적인 전기를 필요로 한다는 거죠.",

 id:"w1d6", day:6, cat:"심리·학습", level:"B2",
 title:"Why You Forget What You Just Read",
 titleKo:"방금 읽은 걸 잊는 이유 — 기억과 학습의 작동 방식",
 names:{A:"Dan (교육팀)", B:"Mia (인지심리 전공)"},
 brief:[
  "학습 연구에서 가장 반복적으로 확인된 두 가지가 <b>spacing effect(간격 효과)</b>와 <b>retrieval practice(인출 연습)</b>다. 몰아서 보는 것보다 나눠서 보는 것이, 다시 읽는 것보다 <b>기억에서 꺼내 보는 것</b>이 오래간다.",
  "다시 읽기가 인기 있는 이유는 <b>fluency illusion(유창성 착각)</b> 때문이다. 눈에 익어 술술 읽히면 '안다'고 느끼지만, 그 매끄러움은 이해가 아니라 익숙함의 신호일 뿐이다.",
  "그래서 효과적인 학습은 대체로 <b>불편하다</b>. 어렵게 꺼낼수록 기억은 단단해지는데, 이를 <b>desirable difficulty(바람직한 어려움)</b>라고 부른다.",
  "수면은 학습의 마무리 공정에 가깝다. 잠자는 동안 기억이 정리·강화되는 <b>consolidation(공고화)</b>이 일어나므로, 밤을 새워 채워 넣는 방식은 투입 대비 손해가 크다."
 ],
 lines:[
  {s:"A",en:"I read a whole report yesterday and today I couldn't summarize it to save my life.",
   ko:"어제 보고서를 통째로 읽었는데, 오늘은 도저히 요약을 못 하겠더라고요.",
   notes:[{t:"to save my life",k:"idiom",m:"죽었다 깨어나도 (못 하다)",tip:"부정문에서만 씁니다. I can't sing to save my life."}]},
  {s:"B",en:"That's not a memory defect. That's what reading does when you never test yourself.",
   ko:"그건 기억력 결함이 아니에요. 스스로 시험해 보지 않은 읽기가 원래 그래요.",
   notes:[{t:"a defect",k:"business",m:"결함",tip:"제조 품질에서 쓰는 단어를 사람에게 은유로 쓴 표현입니다."}]},
  {s:"A",en:"But it felt easy while I was reading. Everything made sense.",
   ko:"그런데 읽을 땐 쉬웠거든요. 다 이해되는 것 같았고요.",
   notes:[{t:"it felt easy",k:"grammar",m:"쉽게 느껴졌다",tip:"feel + 형용사. It feels wrong. 감각동사 뒤에 부사 아님 주의."}]},
  {s:"B",en:"That's the trap. Smooth reading feels like understanding, but it's mostly familiarity.",
   ko:"그게 함정이에요. 매끄럽게 읽히면 이해한 것 같지만, 대개는 익숙함일 뿐이죠.",
   notes:[{t:"That's the trap.",k:"colloquial",m:"바로 그게 함정이에요",tip:"That's the thing. 계열의 짧은 강조 표현."},
          {t:"familiarity",k:"business",m:"익숙함",tip:"understanding과 대비시켜 쓰면 논지가 선명해집니다."}]},
  {s:"A",en:"So the fix is to close the file and try to say it out loud?",
   ko:"그럼 해결책은 파일을 닫고 소리 내어 말해 보는 건가요?",
   notes:[{t:"the fix",k:"colloquial",m:"해결책",tip:"solution의 캐주얼한 대체어. a quick fix = 임시방편."}]},
  {s:"B",en:"That's the whole trick, and it's annoyingly simple. Pull it out instead of putting it back in.",
   ko:"그게 요령의 전부인데, 짜증날 만큼 단순해요. 다시 집어넣지 말고 꺼내 보세요.",
   notes:[{t:"the trick is ~",k:"idiom",m:"요령은 ~이다",tip:"The trick is to start small."},
          {t:"annoyingly simple",k:"colloquial",m:"짜증날 정도로 단순한",tip:"부사+형용사 조합으로 감정을 싣는 원어민식 표현."}]},
  {s:"A",en:"I've heard that, but rereading feels more productive. I get through more pages.",
   ko:"들어는 봤는데, 다시 읽는 게 더 생산적으로 느껴져요. 진도가 더 나가니까요.",
   notes:[{t:"get through",k:"phrasal",m:"(분량을) 해치우다, 끝내다",tip:"I got through half the book."}]},
  {s:"B",en:"Pages aren't the unit that matters. What you can retrieve cold is.",
   ko:"중요한 단위는 페이지가 아니에요. 아무 단서 없이 꺼낼 수 있는 게 중요하죠.",
   notes:[{t:"retrieve",k:"business",m:"(기억에서) 인출하다",tip:"retrieval practice = 인출 연습. 학습 연구의 핵심 용어."},
          {t:"cold",k:"colloquial",m:"준비 없이, 맨몸으로",tip:"go in cold = 준비 없이 들어가다. 면접·발표에 씁니다."}]},
  {s:"A",en:"And spacing it out actually beats one long session?",
   ko:"그리고 나눠서 하는 게 정말 한 번에 몰아서 하는 것보다 낫나요?",
   notes:[{t:"space it out",k:"phrasal",m:"간격을 두고 나누다",tip:"space out the sessions. 학습 계획에 그대로 씁니다."}]},
  {s:"B",en:"By a wide margin, and it's one of the oldest findings we have.",
   ko:"큰 차이로요. 게다가 가장 오래된 연구 결과 중 하나예요.",
   notes:[{t:"by a wide margin",k:"idiom",m:"큰 차이로",tip:"win by a wide margin. 비교를 강조할 때."}]},
  {s:"A",en:"Then why does everyone still cram the night before?",
   ko:"그런데 왜 다들 여전히 전날 밤에 몰아서 할까요?",
   notes:[{t:"cram",k:"colloquial",m:"벼락치기 하다",tip:"cram for an exam. 명사 cramming으로도 씁니다."}]},
  {s:"B",en:"Because cramming works just well enough for tomorrow, and then it drains away.",
   ko:"벼락치기는 딱 내일까지만 통하고, 그 뒤엔 다 빠져나가니까요.",
   notes:[{t:"just well enough",k:"collocation",m:"딱 될 만큼만",tip:"'충분하지만 겨우'라는 뉘앙스를 짧게 실어 줍니다."},
          {t:"drain away",k:"phrasal",m:"서서히 빠져나가다",tip:"Motivation drained away. 비유적으로도 자주."}]},
  {s:"A",en:"Where does sleep fit into all this? People treat it as time they can borrow.",
   ko:"이 안에서 수면은 어디에 들어가죠? 다들 잠을 빌려 쓸 수 있는 시간으로 취급하잖아요.",
   notes:[{t:"fit into",k:"phrasal",m:"~안에 들어맞다, 어디에 해당하다",tip:"How does this fit into the plan?"},
          {t:"time you can borrow",k:"idiom",m:"빌려 쓸 수 있는 시간",tip:"영어권에서 수면 부채를 말할 때 흔한 비유."}]},
  {s:"B",en:"It's closer to the final step of the process. What you learned gets filed while you're out.",
   ko:"수면은 오히려 마지막 공정에 가까워요. 자는 동안 배운 게 정리되어 보관되죠.",
   notes:[{t:"get filed",k:"idiom",m:"정리되어 보관되다",tip:"file = 서류를 철하다. 기억을 서류 정리에 비유한 표현."},
          {t:"while you're out",k:"colloquial",m:"의식이 없는 동안, 자는 동안",tip:"be out = 곯아떨어지다. He was out in five minutes."}]},
  {s:"A",en:"So pulling an all-nighter is borrowing against the thing that does the filing.",
   ko:"그럼 밤샘은 정리를 담당하는 그 기능에서 빚을 내는 셈이네요.",
   notes:[{t:"pull an all-nighter",k:"idiom",m:"밤을 새우다",tip:"완전한 관용구. 동사 pull에 주의하세요."},
          {t:"borrow against ~",k:"business",m:"~을 담보로 빌리다",tip:"금융 용어를 비유로 쓴 세련된 문장입니다."}]},
  {s:"B",en:"Nicely put. And the last piece is that effective study usually feels worse.",
   ko:"잘 표현하셨네요. 그리고 마지막 조각은, 효과적인 공부는 대개 더 불편하게 느껴진다는 거예요.",
   notes:[{t:"Nicely put.",k:"colloquial",m:"표현 좋네요",tip:"Well put.도 같은 뜻. 상대 표현을 칭찬하는 짧은 리액션."}]},
  {s:"A",en:"That's a hard sell to a room full of busy adults.",
   ko:"바쁜 성인들로 가득한 방에서 그건 설득하기 어려운 얘기죠.",
   notes:[{t:"a hard sell",k:"idiom",m:"설득하기 어려운 것",tip:"That's a hard sell to management. 명사구로 씁니다."}]},
  {s:"B",en:"Then don't sell the discomfort. Sell the fact that they'll still have it in March.",
   ko:"그럼 불편함을 팔지 말고, 3월에도 여전히 기억하고 있을 거라는 사실을 파세요.",
   notes:[{t:"sell the fact that ~",k:"idiom",m:"~라는 점을 내세워 설득하다",tip:"sell = 설득하다. 앞선 sell it upstairs와 같은 계열."}]},
  {s:"A",en:"Fine. Twenty minutes a day, out loud, and no rereading.",
   ko:"알겠어요. 하루 20분, 소리 내어, 다시 읽기는 없이요.",
   notes:[{t:"out loud",k:"collocation",m:"소리 내어",tip:"read out loud / say it out loud. aloud보다 구어에서 흔합니다."}]},
  {s:"B",en:"And test yourself before you look. That single habit does most of the work.",
   ko:"그리고 보기 전에 스스로 시험해 보세요. 그 습관 하나가 대부분의 일을 해냅니다.",
   notes:[{t:"does most of the work",k:"idiom",m:"대부분의 효과를 낸다",tip:"One change does most of the work. 강조에 좋습니다."}]}
 ],
 keys:[
  {en:"That's the trap.",ko:"바로 그게 함정입니다",ex:"That's the trap — it looks free at first."},
  {en:"get through",ko:"(분량을) 해치우다",ex:"I got through the deck but remembered nothing."},
  {en:"space it out",ko:"간격을 두고 나누다",ex:"Space it out over four days instead of one."},
  {en:"by a wide margin",ko:"큰 차이로",ex:"Option B won by a wide margin."},
  {en:"pull an all-nighter",ko:"밤을 새우다",ex:"Don't pull an all-nighter before the audit."},
  {en:"a hard sell",ko:"설득하기 어려운 것",ex:"A budget freeze is a hard sell right now."},
  {en:"Nicely put.",ko:"표현이 좋네요",ex:"Nicely put — can I use that line?"},
  {en:"out loud",ko:"소리 내어",ex:"Try saying the summary out loud first."}
 ],
 out:[
  {q:"Describe how you currently study or prepare. Which part is really working?",hint:"get through / That's the trap / out loud"},
  {q:"Convince a busy colleague to stop cramming, in 30 seconds.",hint:"a hard sell / by a wide margin / space it out"},
  {q:"Explain in your own words why rereading feels effective but often isn't.",hint:"familiarity / retrieve / does most of the work"}
 ]
},
{
 id:"w1d7", day:7, cat:"문화·트렌드", level:"B2",
 title:"Where Work Happens Now",
 titleKo:"일은 이제 어디서 일어나는가 — 하이브리드 근무와 도시",
 names:{A:"Sofia (HR)", B:"Ken (현업)"},
 brief:[
  "하이브리드 근무 논쟁이 갈리는 이유는 업무의 성격이 다르기 때문이다. <b>집중 업무(deep work)</b>는 원격이 유리하고, <b>조율·신뢰 형성</b>은 대면이 유리하다는 것이 대체적인 관찰이다.",
  "가장 자주 지적되는 손실은 <b>weak ties(약한 유대)</b>다. 다른 팀 사람과 우연히 마주치는 접점이 사라지면, 정보는 부서 안에서만 돌게 된다.",
  "재택은 도시 구조도 바꿨다. 도심 오피스 상권의 평일 수요가 줄고 주거지 인근 상권이 살아나는 변화가 여러 도시에서 관찰된다.",
  "실무의 결론은 '주 며칠'이 아니라 <b>어떤 일을 위해 모이는가</b>이다. 출근한 날에 각자 헤드폰을 끼고 화상회의만 한다면, 이동 시간만 지불한 셈이 된다."
 ],
 lines:[
  {s:"A",en:"Leadership wants everyone back four days a week. I'm not sure that's the real question.",
   ko:"경영진은 주 4일 출근을 원해요. 저는 그게 진짜 질문인지 모르겠어요.",
   notes:[{t:"back four days a week",k:"collocation",m:"주 4일 사무실 복귀",tip:"return-to-office(RTO)라는 약어도 실무에서 흔합니다."}]},
  {s:"B",en:"What would the real question be, then?",
   ko:"그럼 진짜 질문은 뭔가요?",
   notes:[{t:"then (문미)",k:"colloquial",m:"그럼 (문장 끝에서)",tip:"What is it, then? 억양을 내려 자연스럽게."}]},
  {s:"A",en:"Not how many days, but what we come in for. Those are completely different policies.",
   ko:"며칠이냐가 아니라 뭘 하러 나오느냐죠. 그건 완전히 다른 정책이에요.",
   notes:[{t:"come in",k:"phrasal",m:"출근하다",tip:"Are you coming in tomorrow? go to work보다 사무실 맥락에서 자연스럽습니다."}]},
  {s:"B",en:"Honestly, half my office days are video calls with people in other countries.",
   ko:"솔직히 제 출근일의 절반은 다른 나라 사람들과의 화상회의예요.",
   notes:[{t:"Honestly,",k:"colloquial",m:"솔직히",tip:"문두에 두면 속내를 꺼내는 신호가 됩니다."}]},
  {s:"A",en:"Which is the worst of both worlds. You paid the commute and got the isolation.",
   ko:"그게 양쪽의 나쁜 점만 합친 거죠. 출퇴근은 치르고 고립은 그대로 얻고요.",
   notes:[{t:"the worst of both worlds",k:"idiom",m:"양쪽의 단점만 모은 것",tip:"the best of both worlds의 반대. 통째로 외우세요."},
          {t:"the commute",k:"business",m:"통근",tip:"명사·동사 모두 됩니다. I commute two hours a day."}]},
  {s:"B",en:"Right. But I'd defend the office for one thing: I learn what other teams are doing by accident.",
   ko:"맞아요. 그래도 사무실을 한 가지로는 옹호하겠어요. 다른 팀이 뭘 하는지 우연히 알게 되거든요.",
   notes:[{t:"I'd defend ~ for one thing",k:"idiom",m:"한 가지 이유로는 ~을 옹호하겠다",tip:"부분적 지지를 표하는 균형 잡힌 화법입니다."},
          {t:"by accident",k:"collocation",m:"우연히",tip:"on purpose(의도적으로)의 반대. by chance와 호환."}]},
  {s:"A",en:"That's the weak-tie argument, and it's the strongest one on your side.",
   ko:"그게 약한 유대 논거인데, 그쪽 편에서 가장 강한 주장이에요.",
   notes:[{t:"weak ties",k:"business",m:"약한 유대 관계",tip:"사회학 개념이지만 실무 회의에서도 그대로 쓰입니다."},
          {t:"on your side",k:"collocation",m:"당신 쪽 주장에서",tip:"the argument on your side. 토론 정리에 유용합니다."}]},
  {s:"B",en:"Explain it the way you'd explain it to my director. He'll roll his eyes at the theory.",
   ko:"제 임원한테 설명하듯 말해 주세요. 이론이라고 하면 눈을 굴릴 사람이거든요.",
   notes:[{t:"roll one's eyes",k:"idiom",m:"어이없다는 듯 눈을 굴리다",tip:"신체 동작 관용구. 회의 묘사에 생생함을 더합니다."}]},
  {s:"A",en:"Your close colleagues know what you know. New information tends to come from people you rarely see.",
   ko:"가까운 동료는 당신이 아는 걸 똑같이 알아요. 새 정보는 잘 안 보는 사람들에게서 오는 편이죠.",
   notes:[{t:"tend to ~",k:"grammar",m:"~하는 경향이 있다",tip:"단정 대신 경향을 말해 신뢰를 얻는 표현. 시험에서도 유리합니다."}]},
  {s:"B",en:"That lands. So the office is for bumping into people, not for typing.",
   ko:"그건 와닿네요. 그러니까 사무실은 타이핑이 아니라 사람과 마주치기 위한 곳이군요.",
   notes:[{t:"That lands.",k:"colloquial",m:"그 말 와닿네요",tip:"설득이 먹혔다는 최신 구어. That didn't land.도 씁니다."},
          {t:"bump into ~",k:"phrasal",m:"우연히 마주치다",tip:"I bumped into him at the elevator."}]},
  {s:"A",en:"For that, and for the conversations nobody would schedule a meeting about.",
   ko:"그것과, 아무도 회의를 잡지는 않을 대화들을 위해서죠.",
   notes:[{t:"nobody would schedule a meeting about",k:"collocation",m:"굳이 회의까지 잡지는 않을",tip:"관계절로 개념을 정의하는 세련된 방식입니다."}]},
  {s:"B",en:"Meanwhile my neighborhood has completely changed. The cafes are full on Tuesday mornings.",
   ko:"한편 저희 동네는 완전히 달라졌어요. 화요일 아침에도 카페가 꽉 차요.",
   notes:[{t:"Meanwhile",k:"collocation",m:"한편",tip:"화제를 나란히 붙일 때. 발표에서도 좋은 전환어입니다."}]},
  {s:"A",en:"That shift is real, and it's not going back. The money moved out of the business district.",
   ko:"그 변화는 실재하고, 되돌아가지 않아요. 돈이 업무 지구 밖으로 옮겨 갔죠.",
   notes:[{t:"it's not going back",k:"colloquial",m:"되돌아가지 않는다",tip:"현재진행형으로 미래를 단언하는 자연스러운 어법."}]},
  {s:"B",en:"My parents' generation would find that bizarre. Work was a place you went to.",
   ko:"부모님 세대는 그걸 기이하게 여길 거예요. 일은 가는 장소였으니까요.",
   notes:[{t:"a place you went to",k:"grammar",m:"가던 장소",tip:"관계절 + 전치사가 끝에 남는 구어 어순. 자연스럽습니다."}]},

let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); if(cur.view==="settings") render(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const f = VOICES.filter(x=>/female|zira|aria|jenny|samantha|karen|libby|sonia/i.test(x.name));
    const m = VOICES.filter(x=>/male|david|guy|ryan|daniel|alex|mark/i.test(x.name));
    v = who==="B" ? (m[0]||VOICES[1]||VOICES[0]) : (f[0]||VOICES[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.05;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].en, items[i].s, rate, ()=>{ i++; setTimeout(step, 260); });
  })();
}

/* ---------- 청크 자동 분할 ---------- */
function chunkify(s){
  const sents = (s.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [s]).map(x=>x.trim()).filter(Boolean);
  const brkBefore = /^(but|and|so|because|which|that|when|if|though|although|while|or|then|unless)$/i;
  const prep = /^(in|on|at|of|for|to|with|from|about|into|by|as|over|under|before|after)$/i;
  const clean = w => w.replace(/[^\w']/g,"");
  let out = [];
  sents.forEach(sen=>{
    const toks = sen.split(/\s+/);
    const parts = []; let c = [];
    toks.forEach(w=>{
      if(c.length>=4 && brkBefore.test(clean(w))){ parts.push(c.join(" ")); c=[]; }
      c.push(w);
      if(/[,;:]$/.test(w) && c.length>=3){ parts.push(c.join(" ")); c=[]; }
    });
    if(c.length) parts.push(c.join(" "));
    parts.forEach(p=>{
      let t = p.split(/\s+/);
      while(t.length > 10){
        let cut = -1, mid = Math.floor(t.length/2);
        for(let i=Math.max(3, mid-3); i<Math.min(t.length-3, mid+4); i++){
          if(prep.test(clean(t[i]))){ cut = i; break; }
        }
        if(cut < 0) cut = mid;
        out.push(t.slice(0,cut).join(" ")); t = t.slice(cut);
      }
      out.push(t.join(" "));
    });
  });
  const merged=[];
  out.forEach(c=>{ if(merged.length && c.split(/\s+/).length<3) merged[merged.length-1]+=" "+c; else merged.push(c); });
  return merged;
}

/* ---------- 발음 체크 (음성인식) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function normWords(s){ return s.toLowerCase().replace(/[^a-z0-9'\s]/g," ").split(/\s+/).filter(Boolean); }
function compareSpoken(target, said){
  const t = normWords(target), h = normWords(said);
  const pool = h.slice();
  const marks = t.map(w=>{ const i = pool.indexOf(w); if(i>=0){ pool.splice(i,1); return {w, ok:true}; } return {w, ok:false}; });
  const hit = marks.filter(m=>m.ok).length;
  return { marks, score: t.length ? Math.round(hit/t.length*100) : 0 };
}

function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};

function lineHTML(l,i){

function speedBar(id){

/* --- step 4 : 쉐도잉 (핵심) --- */
function stepShadow(d){
  const i = cur.line, l = d.lines[i];
  const reps = cur.reps[i]||0, target = S.cfg.reps;
  const chunks = chunkify(l.en);
  let h = '<div class="row" style="margin:10px 0 0"><span class="sub">문장 '+(i+1)+' / '+d.lines.length+'</span>';
  h += '<span style="flex:1"></span>'+speedBar("shSpeed")+'</div>';
  h += '<div class="shadowbox">';
  h +=   '<div class="who '+(l.s==="B"?"b":"")+'">'+(l.s==="B"?esc(d.names.B):esc(d.names.A))+'</div>';
  h +=   '<div class="bigen">'+esc(l.en)+'</div>';
  if(chunks.length>1){
    h += '<div class="sub" style="font-size:12px;margin-top:6px">덩어리로 끊어 읽기 — 각 줄을 눌러 따라 하세요</div>';
    h += '<div class="chunks">'+chunks.map((c,ci)=>'<div class="chunk" data-c="'+ci+'">'+esc(c)+'</div>').join("")+'</div>';
  }
  h +=   '<div class="bigko blurme'+(cur.showKo?" show":"")+'">'+esc(l.ko)+'</div>';
  h +=   '<div class="rule"></div>';
  h +=   '<div class="row"><button class="btn" id="pLine">듣기 ▶</button>'+
         '<button class="btn ghost sm" id="pSlow">천천히 0.7x</button>'+
         '<button class="btn '+(autoTok?"red":"ghost")+' sm" id="pAuto">'+(autoTok?"■ 자동 정지":"자동 진행 ▶▶")+'</button>'+
         (SR?'<button class="btn ghost sm" id="pAsr">🎤 발음 체크</button>':'')+
         '<span style="flex:1"></span><span class="counter" id="dots">'+
         Array.from({length:target},(_,k)=>'<span class="dot '+(k<reps?"on":"")+'"></span>').join("")+'</span></div>';
  h +=   '<div id="asrOut"></div>';
  if(l.notes && l.notes.length){
    h += '<div class="notes"><div class="sub" style="font-size:12px;margin-bottom:4px">표현 노트</div>';
    l.notes.forEach(n=>{
      h += '<div class="note"><b>'+esc(n.t)+'</b><span class="k">'+esc(kLabel(n.k))+'</span> — '+esc(n.m)+
           (n.tip?'<span class="tip">'+esc(n.tip)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="row"><button class="btn ghost" id="sPrev">← 앞 문장</button>'+
       '<button class="btn" id="sNext">다음 문장 →</button>'+
       '<span class="sub" style="font-size:12px">스페이스바=듣기, Enter=다음</span></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("shSpeed"); bindBlur();

  const play = (rate)=>{ stopSpeak(); bumpRep(i); speak(l.en, l.s, rate||S.cfg.rate); };
  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.7);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c], l.s, Math.min(S.cfg.rate,0.9));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
  if(SR) $("#pAsr").onclick = ()=> runAsr(l.en);
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = t => Math.max(1000, t.split(/\s+/).length * 340);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.en, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.en));
    });
  })(0);
}
function kLabel(k){
  return ({idiom:"관용", colloquial:"구어", phrasal:"구동사", collocation:"연어", business:"실무어", grammar:"문법"})[k] || k;
}
function runAsr(target){
  const box = $("#asrOut");
  let rec;
  try{ rec = new SR(); }catch(e){ box.innerHTML='<div class="sub">이 브라우저에서는 발음 체크를 쓸 수 없습니다.</div>'; return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
  box.innerHTML = '<div class="asr sub">🎤 듣고 있습니다… 문장을 소리 내어 읽으세요.</div>';
  rec.onresult = e=>{
    const said = e.results[0][0].transcript;
    const r = compareSpoken(target, said);
    box.innerHTML = '<div class="asr"><span class="score">'+r.score+'점</span> <span class="sub">— 인식된 문장: '+esc(said)+'</span><div style="margin-top:6px">'+
      r.marks.map(m=>'<span class="w '+(m.ok?"good":"bad")+'">'+esc(m.w)+'</span>').join(" ")+'</div>'+
      '<div class="sub" style="font-size:12px;margin-top:4px">빨간 단어는 인식되지 않은 부분입니다. 그 단어만 천천히 다시 읽어 보세요.</div></div>';
  };
  rec.onerror = ev=>{ box.innerHTML='<div class="asr sub">인식 실패('+esc(ev.error)+'). 마이크 권한과 인터넷 연결을 확인하세요.</div>'; };
  rec.onend = ()=>{};
  try{ rec.start(); }catch(e){ box.innerHTML='<div class="asr sub">마이크를 시작할 수 없습니다.</div>'; }
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.en, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

function exportData(){
  const blob = new Blob([JSON.stringify({v:1, prog:S.prog, log:S.log, star:S.star, out:S.out, custom:S.custom, cfg:S.cfg}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "roundtable-backup-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("백업 파일을 내려받았습니다");
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      ["prog","log","star","out","custom","cfg"].forEach(k=>{ if(o[k]) S[k]=o[k]; });
      rebuild(); save(); toast("복원했습니다"); render();
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };
  r.readAsText(f);
}

let bankQ = "";
function renderBank(){
  const rows=[];
  CONTENT.forEach(d=> d.keys.forEach(k=> rows.push({d, k})));
  const q = bankQ.trim().toLowerCase();
  const filtered = rows.filter(r=> !q || (r.k.en+r.k.ko+r.k.ex).toLowerCase().includes(q));
  let h = '<div class="hd" style="margin-top:20px"><small>Expression bank</small>표현장 <span class="sub" style="font-size:13px">('+rows.length+'개)</span></div>';
  h += '<div class="card"><div class="row"><input type="text" id="bq" placeholder="영어·한국어로 검색" value="'+esc(bankQ)+'" style="flex:1;min-width:180px">'+
       '<button class="btn ghost sm" id="bStar">⭐만 보기</button><button class="btn ghost sm" id="bDrill">랜덤 10개 훈련</button></div></div>';
  h += '<div class="card" id="bankList">';
  filtered.forEach((r,i)=>{
    const on = S.star[r.k.en] ? "on":"";
    h += '<div class="bankrow"><span class="star '+on+'" data-k="'+esc(r.k.en)+'">★</span>'+
         '<b>'+esc(r.k.en)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button>'+
         '<div class="m">'+esc(r.k.ko)+' <span class="sub" style="font-size:11.5px">· DAY '+r.d.day+'</span></div>'+
         '<div class="ex">'+esc(r.k.ex)+'</div></div>';
  });
  if(!filtered.length) h += '<div class="sub">검색 결과가 없습니다.</div>';
  h += '</div>';
  $("#view-bank").innerHTML = h; bindPlay();
  $("#bq").oninput = e=>{ bankQ=e.target.value; const p=e.target.selectionStart; renderBank(); const el=$("#bq"); el.focus(); el.setSelectionRange(p,p); };
  $("#bStar").onclick = ()=>{ bankQ=""; renderBank();
    document.querySelectorAll("#bankList .bankrow").forEach(row=>{
      const s=row.querySelector(".star"); if(!s.classList.contains("on")) row.style.display="none"; }); };
  $("#bDrill").onclick = ()=> drill(rows);
  document.querySelectorAll(".star").forEach(s=> s.onclick = ()=>{
    const k=s.dataset.k; if(S.star[k]) delete S.star[k]; else S.star[k]=1; save(); s.classList.toggle("on"); });
}
function drill(rows){
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 보지 말고 먼저 말하기</div><div class="card">';
  pick.forEach(r=>{
    h += '<div class="keyrow"><b>'+esc(r.k.en)+' <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button></b>'+
         '<span><span class="blurme">'+esc(r.k.ko)+'</span><span class="ex blurme">'+esc(r.k.ex)+'</span></span></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 표현장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

function renderAdd(){
  let h = '<div class="hd" style="margin-top:20px"><small>Add content</small>새 회화 추가</div>';
  h += '<div class="card"><b>1단계 — 프롬프트 복사</b><div class="sub" style="margin:4px 0 8px">아래 내용을 복사해서 Claude에게 붙여넣고, 원하는 주제를 적으세요.</div>'+
       '<pre class="prompt" id="pmt">'+esc(GEN_PROMPT)+'</pre>'+
       '<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="copyP">프롬프트 복사</button></div></div>';
  h += '<div class="card"><b>2단계 — 받은 JSON 붙여넣기</b><div class="sub" style="margin:4px 0 8px">Claude가 준 JSON을 그대로 붙여넣고 추가를 누르면 커리큘럼 맨 뒤에 붙습니다.</div>'+
       '<textarea id="jin" style="min-height:150px" placeholder="[ { &quot;id&quot;: ... } ]"></textarea>'+
       '<div class="row" style="margin-top:8px"><button class="btn" id="addJ">회차 추가</button>'+
       '<span class="sub" id="addMsg"></span></div></div>';
  if(S.custom.length){
    h += '<div class="card"><b>내가 추가한 회차 ('+S.custom.length+')</b><div class="rule"></div>';
    S.custom.forEach((c,i)=>{ h += '<div class="histrow"><b>'+c.day+'</b><span style="flex:1">'+esc(c.title||"(제목 없음)")+'</span>'+
      '<button class="btn ghost sm delc" data-i="'+i+'">삭제</button></div>'; });
    h += '</div>';
  }
  $("#view-add").innerHTML = h;
  $("#copyP").onclick = ()=>{ navigator.clipboard.writeText(GEN_PROMPT).then(()=>toast("복사했습니다"),()=>{
    const r=document.createRange(); r.selectNode($("#pmt")); getSelection().removeAllRanges(); getSelection().addRange(r);
    toast("직접 복사하세요 (Ctrl+C)"); }); };
  $("#addJ").onclick = ()=>{
    const raw = $("#jin").value.trim(); if(!raw) return;
    try{
      let o = JSON.parse(raw); if(!Array.isArray(o)) o=[o];
      const bad = o.find(x=> !x.id || !Array.isArray(x.lines) || !x.lines.length);
      if(bad) throw new Error("형식");
      o.forEach(x=>{
        x.cat=x.cat||"기타"; x.brief=x.brief||[]; x.keys=x.keys||[]; x.out=x.out||[];
        x.names=x.names||{A:"A",B:"B"}; x.titleKo=x.titleKo||"";
        x.day = x.day || (CONTENT.length+1);
        if(CONTENT.some(c=>c.id===x.id)) x.id = x.id+"-"+Math.random().toString(36).slice(2,6);
        S.custom.push(x);
      });
      save(); rebuild(); toast(o.length+"개 회차를 추가했습니다"); $("#jin").value=""; renderAdd();
    }catch(err){ $("#addMsg").textContent = "JSON 형식이 맞지 않습니다. 대괄호 [ ] 로 시작하는지 확인하세요."; }
  };
  document.querySelectorAll(".delc").forEach(b=> b.onclick = ()=>{
    S.custom.splice(+b.dataset.i,1); save(); rebuild(); renderAdd(); });
}

/* ---------- 설정 ---------- */
function renderSettings(){
  const vopt = who => VOICES.map(v=>'<option value="'+esc(v.name)+'"'+
    ((who==="A"?S.cfg.voiceA:S.cfg.voiceB)===v.name?" selected":"")+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join("");
  let h = '<div class="hd" style="margin-top:20px"><small>Settings</small>설정</div>';
  h += '<div class="card"><b>목소리</b><div class="sub" style="margin:4px 0 10px">A와 B를 다른 목소리로 두면 토론처럼 들립니다. 목록이 비어 있으면 브라우저를 새로고침하세요.</div>'+
    '<div class="row" style="margin-bottom:8px">A(첫 번째 화자) <select id="vA">'+vopt("A")+'</select><button class="btn ghost sm rv" data-t="This is how speaker A sounds.">시험 재생</button></div>'+
    '<div class="row">B(두 번째 화자) <select id="vB">'+vopt("B")+'</select><button class="btn ghost sm" id="tB">시험 재생</button></div></div>';
  h += '<div class="card"><b>훈련 설정</b><div class="rule"></div>'+
    '<div class="row" style="margin-bottom:10px">기본 속도 '+speedBar("stSpeed")+'</div>'+
    '<div class="row" style="margin-bottom:10px">문장당 반복 목표 <select id="rp">'+[2,3,5].map(n=>'<option'+(S.cfg.reps===n?" selected":"")+'>'+n+'</option>').join("")+'</select> 회</div>'+
    '<div class="row"><label><input type="checkbox" id="ko"'+(S.cfg.showKo?" checked":"")+'> 한국어 번역을 처음부터 보이기</label></div></div>';
  h += '<div class="card"><b>화면</b><div class="row" style="margin-top:8px"><button class="btn ghost sm" id="th">'+
    (S.cfg.theme==="dark"?"밝은 화면으로":"어두운 화면으로")+'</button></div></div>';
  h += '<div class="card"><b>기록 초기화</b><div class="sub" style="margin:4px 0 8px">모든 학습 기록과 추가한 회차가 지워집니다. 되돌릴 수 없습니다.</div>'+
    '<button class="btn ghost sm" id="reset" style="color:var(--accent);border-color:var(--accent)">전체 초기화</button></div>';
  h += '<div class="card sub" style="font-size:12.5px"><b>이 앱에 대해</b><br>ROUNDTABLE · 데일리 영어 쉐도잉<br>'+
    '<b>© 2026 곤사마 (Gonsama). All rights reserved.</b><br><br>인터넷 없이 동작하지만, '+
    '음성은 브라우저에 설치된 영어 음성을 사용합니다(일부 고품질 음성은 온라인일 때만 나옵니다). '+
    '발음 체크는 Chrome·Edge에서 마이크 권한과 인터넷이 있을 때 동작합니다.</div>';
  $("#view-settings").innerHTML = h;
  bindSpeed("stSpeed"); bindPlay();
  $("#vA").onchange = e=>{ S.cfg.voiceA=e.target.value; save(); };
  $("#vB").onchange = e=>{ S.cfg.voiceB=e.target.value; save(); };
  $("#tB").onclick = ()=> speak("And this is how speaker B sounds.", "B", S.cfg.rate);
  $("#rp").onchange = e=>{ S.cfg.reps=+e.target.value; save(); };
  $("#ko").onchange = e=>{ S.cfg.showKo=e.target.checked; save(); };
  $("#th").onclick = ()=>{ S.cfg.theme = S.cfg.theme==="dark"?"light":"dark"; save(); applyTheme(); renderSettings(); };
  $("#reset").onclick = ()=>{
    if(confirm("모든 기록을 지웁니다. 계속할까요?")){
      S.prog={}; S.log={}; S.star={}; S.out={}; S.custom=[]; save(); rebuild(); toast("초기화했습니다"); go("home");
    }
  };
}
function applyTheme(){
  let t = S.cfg.theme;
  if(t!=="dark" && t!=="light")
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
}

/* ---------- 시작 ---------- */
applyTheme();
render();

/* ═══════════ 앱으로 설치하기 ═══════════
   링크를 카카오톡·팀즈로 보내면 대개 그 앱 안의 브라우저로 열린다.
   거기서는 설치도 소리도 되지 않으므로, 그 경우를 가장 먼저 잡아 크롬·사파리로 넘긴다. */
(function(){
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    /* 화면은 캐시로 즉시 띄우므로, 새 본문은 뒤에서 받아 둔 뒤에 알린다 */
    navigator.serviceWorker.addEventListener("message", e=>{
      if(e.data && e.data.type==="update-ready") toast("새 내용을 받았습니다. 앱을 다시 열면 반영됩니다.");
    });
  }

  const UA = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(UA);
  const isMobile = isIOS || isAndroid;
  /* 앱 안 브라우저 — 카카오톡·팀즈·네이버·라인·밴드·페북·인스타 */
  const inApp = /KAKAOTALK|Teams|MSTeams|NAVER|Line\/|band|DaumApps|Instagram|FB_IAB|FBAN|FBAV|everytime/i.test(UA);
  /* 아이폰은 사파리로, 안드로이드는 크롬으로 넘긴다.
     그 기기에 처음부터 깔려 있는 브라우저라야 아무도 무엇을 설치하지 않는다. */
  const TARGET = isIOS ? "사파리" : "크롬";
  const TO = isIOS ? "사파리로" : "크롬으로";

  function openOutside(){
    const url = location.href;
    /* 카카오톡은 바깥 브라우저로 넘기는 자기 방식이 있다.
       기기의 기본 브라우저가 열리므로 아이폰이면 사파리, 안드로이드면 크롬이다. */
    if(/KAKAOTALK/i.test(UA)){
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      return;
    }
    if(isIOS){
      /* 사파리로 넘기는 전용 방식. 막히면 주소만 복사해 준다. */
      location.href = url.replace(/^https:/, "x-safari-https:").replace(/^http:/, "x-safari-http:");
      setTimeout(()=>{ if(!document.hidden) copyLink(); }, 1200);
      return;
    }
    if(isAndroid){
      location.href = "intent://" + url.replace(/^https?:\/\//, "") +
        "#Intent;scheme=" + location.protocol.replace(":", "") +
        ";package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      return;
    }
    window.open(url, "_blank");
  }

  /* 마지막 수단 — 주소를 복사해 주고 붙여 넣으라고 알린다. */
  function copyLink(){
    const url = location.href;
    const done = ()=> toast("주소를 복사했습니다. " + TARGET + "에 붙여 넣어 주세요.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, done);
    }else{
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }

  if(inApp && isMobile){
    const box = $("#openChrome");
    box.hidden = false;
    $("#ocApp").textContent = /KAKAOTALK/i.test(UA) ? "지금은 카카오톡 안에서 열려 있습니다."
                                                    : "지금은 다른 앱 안에서 열려 있습니다.";
    $("#ocMsg").textContent = "여기서는 영어 발음이 나오지 않고 설치도 되지 않습니다. " +
                              TO + " 열면 소리가 납니다.";
    $("#ocGo").textContent = TO + " 열기";
    $("#ocGo").onclick = openOutside;
    $("#ocCopy").onclick = copyLink;
    $("#ocClose").onclick = ()=>{ box.hidden = true; };
  }

  const btn = $("#installBtn"), note = $("#installNote");
  const title = $("#installTitle"), steps = $("#installSteps"), nowBtn = $("#installNow");

  /* 이미 홈 화면 아이콘으로 열렸으면 설치를 권할 이유가 없다 */
  if(window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return;

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred = e;
    if(!note.hidden) open();     /* 안내가 떠 있는 중에 신호가 오면 버튼과 문구를 함께 고친다 */
  });
  window.addEventListener("appinstalled", ()=>{ btn.hidden = true; hide(); });

  /* 브라우저가 설치 안내를 스스로 띄우지 않는 경우가 많아, 버튼은 늘 보이게 둔다 */
  btn.hidden = false;

  function hide(){ note.hidden = true; }

  function build(){
    if(inApp){
      title.textContent = "📲 먼저 브라우저로 열어 주세요";
      return "<p><b>지금 카카오톡·팀즈 같은 앱 안에서 열려 있습니다.</b> 여기서는 설치가 되지 않습니다.</p>" +
             "<ol>" +
               "<li>화면 <b>오른쪽 위 메뉴</b>(⋯ 또는 ⋮)를 누릅니다</li>" +
               "<li><b>「다른 브라우저로 열기」</b>를 고릅니다" +
                 (isIOS ? " — 아이폰은 <b>Safari</b>" : isAndroid ? " — 안드로이드는 <b>Chrome</b>" : "") + "</li>" +
               "<li>열린 화면에서 이 안내가 다시 나오면 그대로 따라 하시면 됩니다</li>" +
             "</ol>";
    }
    if(isIOS){
      title.textContent = "📲 홈 화면에 추가하기";
      return "<p><b>아이폰 · 아이패드 (Safari)</b></p>" +
             "<ol>" +
               "<li>화면 <b>아래쪽 공유 버튼</b>(□ 위에 화살표)을 누릅니다</li>" +
               "<li>목록을 내려 <b>「홈 화면에 추가」</b>를 고릅니다</li>" +
               "<li>오른쪽 위 <b>「추가」</b>를 누르면 끝입니다</li>" +
             "</ol>";
    }
    if(isAndroid){
      title.textContent = "📲 앱으로 설치하기";
      /* 크롬이 설치 신호를 준 경우에만 버튼을 안내한다. 없는 버튼을 누르라고 하면 그대로 막힌다. */
      return "<p><b>안드로이드 (Chrome)</b></p>" +
             "<ol>" +
               (deferred
                 ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>"
                 : "<li>화면 <b>오른쪽 위 메뉴(⋮)</b>를 누릅니다</li>" +
                   "<li><b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 고릅니다</li>") +
             "</ol>";
    }
    title.textContent = "📲 앱으로 설치하기";
    return "<p><b>컴퓨터 (Chrome · Edge)</b></p>" +
           "<ol>" +
             (deferred ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>" : "") +
             "<li>주소창 오른쪽 끝의 <b>설치 아이콘</b>을 누릅니다</li>" +
             "<li>없으면 메뉴 → <b>「앱 설치」</b></li>" +
           "</ol>";
  }

  function open(){
    steps.innerHTML = build() +
      "<p>설치하면 아이콘을 눌러 주소창 없이 앱처럼 열리고, 인터넷이 끊겨도 계속 쓸 수 있습니다. 지금까지의 기록은 그대로 남습니다.</p>";
    nowBtn.hidden = !deferred;
    note.hidden = false;
  }

  /* 처음 연 사람에게는 한 번 저절로 띄운다. 닫으면 다시 띄우지 않는다. */
  const SEEN = "roundtable-install-seen";
  let seen = false;
  try{ seen = localStorage.getItem(SEEN) === "1"; }catch(e){}
  if(!seen && isMobile && $("#openChrome").hidden)
    setTimeout(()=>{ if(note.hidden) open(); }, 1200);

  btn.onclick = open;

  nowBtn.onclick = async ()=>{
    if(!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    nowBtn.hidden = true;
    if(outcome === "accepted"){ btn.hidden = true; hide(); }
  };

  $("#installNoteClose").onclick = ()=>{
    hide();
    try{ localStorage.setItem(SEEN, "1"); }catch(e){}
  };
})();
</script>

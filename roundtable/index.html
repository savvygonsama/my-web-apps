   notes:[{t:"connect two facts",k:"collocation",m:"두 사실을 연결하다",tip:"인과나 관련성을 인식하는 것입니다."}]},
  {s:"A",en:"Largely, yes. When good cloth is produced locally, a well-made jacket is no longer unusual.",

  {s:"A",en:"Tailoring also stayed inexpensive, so people repair clothes rather than replacing them.",

  {s:"B",en:"In Seoul, altering a jacket sometimes costs more than the jacket originally cost.",
   ko:"서울에서는 재킷을 고치는 비용이 그 재킷의 원래 가격보다 비쌀 때가 있습니다.",

  {s:"A",en:"Then the habit cannot develop, because the habit depends on repair being affordable.",

  {s:"A",en:"There is a term for it: sprezzatura, which means effort that is deliberately not visible.",

  {s:"B",en:"We have an equivalent here, which is looking as though you did not prepare at all.",
   ko:"여기에도 비슷한 게 있습니다. 전혀 준비하지 않은 것처럼 보이는 것이죠.",

{
 id:"w3d10", day:25, cat:"사상·미래", level:"C1",
 title:"When Abundance Stops Being the Plan",
 titleKo:"풍요가 더 이상 계획이 아닐 때 — 희소성의 정치학",
 names:{A:"Elena (정치철학 연구자)", B:"Tomas (테크 업계)"},
 brief:[
  "전후 70년의 기본 가정은 <b>파이가 계속 커진다</b>는 것이었습니다. 성장하면 나눌 것이 늘고, 그러면 분배 논쟁도 견딜 만해집니다. 민주주의의 여유는 상당 부분 이 가정 위에 있었습니다.",
  "최근 몇 년, 그 가정을 <b>내려놓은 사람들</b>이 눈에 띕니다. 에너지, 인구, 반도체, 물처럼 늘리기 어려운 것들을 앞세우며, 성장이 아니라 <b>확보</b>를 말합니다. 파이가 고정이라면 논리적 귀결은 「내 몫을 지키는 것」입니다.",
  "여기서 한 걸음 더 나간 흐름이 <b>다크 인라이튼먼트</b>로 불리는 사상입니다. 민주적 절차가 느리고 비효율적이니 유능한 소수가 결정해야 한다는 주장입니다. 소수의 견해지만, 영향력 있는 곳에서 인용된다는 점이 논쟁거리입니다.",
  "이 대화의 목적은 편을 정하는 것이 아니라, <b>불편한 사상을 정확하게 요약하고 반박하는 영어</b>를 익히는 것입니다. 「그 논리를 끝까지 밀면 어떻게 되는가」를 묻는 문장들에 특히 주목하세요."
 ],
 lines:[
  {s:"A",en:"For seventy years we could argue about distribution because everyone assumed the economy would grow.",
   ko:"70년 동안 우리는 분배를 두고 다툴 수 있었습니다. 경제가 성장할 거라고 모두가 전제했으니까요.",
   notes:[{t:"distribution",k:"business",m:"분배",tip:"생산된 것을 나누는 방식입니다."},
          {t:"assume",k:"business",m:"전제하다",tip:"증명 없이 사실로 놓는 것입니다."}]},
  {s:"B",en:"A number of people in my industry have stopped making that assumption.",
   ko:"제 업계의 상당수는 그 전제를 놓는 것을 그만뒀습니다.",
   notes:[{t:"make an assumption",k:"business",m:"전제를 놓다",tip:"가정을 세우는 행위입니다."}]},
  {s:"A",en:"On what evidence? Growth has slowed, but it has not stopped in any major economy.",
   ko:"무슨 근거로요? 성장이 둔화되긴 했지만, 주요 경제 어디서도 멈추지는 않았습니다.",
   notes:[{t:"On what evidence?",k:"business",m:"무슨 근거로요",tip:"주장에 증거를 요구하는 짧고 강한 질문입니다."}]},
  {s:"B",en:"Energy, water, semiconductors and people: four inputs you cannot increase by deciding to.",
   ko:"에너지, 물, 반도체, 사람. 마음먹는다고 늘릴 수 없는 네 가지 투입물입니다.",
   notes:[{t:"an input",k:"business",m:"투입물",tip:"생산에 들어가는 자원입니다. output 과 짝입니다."}]},
  {s:"A",en:"Those are real constraints, but a constraint does not make the total permanently fixed.",
   ko:"실제 제약인 건 맞습니다. 다만 제약이 있다고 총량이 영구히 고정되지는 않습니다.",
   notes:[{t:"a constraint",k:"business",m:"제약",tip:"늘릴 수 없는 한계 조건입니다."},
          {t:"permanently fixed",k:"collocation",m:"영구히 고정된",tip:"변하지 않는 상태입니다."}]},
  {s:"B",en:"No, but if you believe it might be fixed, your strategy changes immediately.",
   ko:"아닙니다. 다만 고정일 수도 있다고 믿으면 전략이 즉시 바뀝니다.",
   notes:[{t:"change immediately",k:"collocation",m:"즉시 바뀌다",tip:"믿음이 행동을 바꾸는 속도를 말합니다."}]},
  {s:"A",en:"Changes into what, specifically? I want the actual policy, not the general attitude.",
   ko:"구체적으로 무엇으로 바뀝니까? 일반적인 태도가 아니라 실제 정책을 원합니다.",
   notes:[{t:"Changes into what, specifically?",k:"business",m:"구체적으로 무엇으로 바뀝니까",tip:"추상적인 답을 차단하는 질문입니다."}]},
  {s:"B",en:"Securing supply rather than expanding it, which means buying the input instead of competing for the market.",
   ko:"공급을 늘리기보다 확보하는 것입니다. 시장에서 경쟁하는 대신 투입물을 사들인다는 뜻이죠.",
   notes:[{t:"secure supply",k:"business",m:"공급을 확보하다",tip:"물량을 미리 잡아 두는 것입니다."}]},
  {s:"A",en:"Follow that reasoning to its conclusion and it arrives at a politically difficult position.",
   ko:"그 논리를 끝까지 따라가면 정치적으로 곤란한 입장에 도달합니다.",
   notes:[{t:"follow a reasoning to its conclusion",k:"business",m:"논리를 끝까지 따라가다",tip:"귀결을 검토하라는 요구입니다."}]},
  {s:"B",en:"I know which position you mean. You are referring to the anti-democratic version of the argument.",
   ko:"어떤 입장을 말씀하시는지 압니다. 그 논리의 반민주적인 형태를 가리키시는 거죠.",
   notes:[{t:"refer to ~",k:"phrasal",m:"~ 를 가리키다",tip:"언급 대상을 명시합니다."}]},
  {s:"A",en:"Yes. The claim that capable people should make decisions without going through an election.",
   ko:"그렇습니다. 유능한 사람들이 선거를 거치지 않고 결정을 내려야 한다는 주장입니다.",
   notes:[{t:"a claim",k:"business",m:"주장",tip:"증명되지 않은 진술입니다."},
          {t:"go through an election",k:"collocation",m:"선거를 거치다",tip:"절차를 통과한다는 뜻입니다."}]},
  {s:"B",en:"Very few people state it that plainly, but the same reasoning appears in other forms.",
   ko:"그렇게 평이하게 말하는 사람은 아주 적습니다. 다만 같은 논리가 다른 형태로 나타납니다.",
   notes:[{t:"state it plainly",k:"collocation",m:"평이하게 말하다",tip:"에두르지 않고 직접 말하는 것입니다."}]},
  {s:"A",en:"Then let us examine it on its own terms, beginning with competent by whose measurement.",
   ko:"그럼 그 논리 자체의 기준으로 검토해 봅시다. 누구의 기준으로 유능한가부터요.",
   notes:[{t:"on its own terms",k:"business",m:"그 자체의 기준으로",tip:"상대의 전제를 받아들인 채 검토하는 방식입니다."},
          {t:"by whose measurement",k:"grammar",m:"누구의 기준으로",tip:"평가 기준의 주체를 묻습니다."}]},
  {s:"B",en:"That is the weakest part of the argument, because competent usually describes whoever currently holds power.",
   ko:"그게 그 주장의 가장 약한 부분입니다. 유능하다는 말은 대개 지금 권력을 가진 쪽을 가리키니까요.",
   notes:[{t:"hold power",k:"collocation",m:"권력을 쥐다",tip:"지위를 가진 상태입니다."}]},
  {s:"A",en:"And there is no mechanism to replace them, which is the entire purpose of an election.",
   ko:"게다가 그들을 교체할 장치가 없습니다. 그게 선거의 존재 목적 전부인데요.",
   notes:[{t:"a mechanism",k:"business",m:"장치, 제도적 수단",tip:"목적을 실현하는 구조입니다."},
          {t:"replace someone",k:"business",m:"교체하다",tip:"자리에서 물러나게 하고 다른 사람을 앉히는 것입니다."}]},
  {s:"B",en:"I agree, though what attracts people is not the theory. It is the frustration with slow decisions.",
   ko:"동의합니다. 다만 사람들을 끄는 것은 이론이 아닙니다. 느린 결정에 대한 좌절감입니다.",
   notes:[{t:"what attracts people is ~",k:"grammar",m:"사람들을 끄는 것은 ~ 이다",tip:"진짜 동인을 지목하는 강조 구문입니다."}]},
  {s:"A",en:"The frustration is legitimate. It is not an argument for removing accountability from decision makers.",
   ko:"그 좌절감은 정당합니다. 다만 의사결정자에게서 책임을 없앨 근거는 아닙니다.",
   notes:[{t:"accountability",k:"business",m:"책임 소재",tip:"결정에 대해 답해야 하는 의무입니다."},
          {t:"a decision maker",k:"business",m:"의사결정자",tip:"최종 판단을 내리는 사람입니다."}]},
  {s:"B",en:"Then what would you offer somebody who genuinely believes the process takes too long?",
   ko:"그럼 절차가 정말로 너무 오래 걸린다고 믿는 사람에게 무엇을 제안하시겠습니까?",
   notes:[{t:"take too long",k:"collocation",m:"너무 오래 걸리다",tip:"시간 문제를 평이하게 표현합니다."}]},
  {s:"A",en:"Faster institutions rather than fewer of them, because speed and consent are not in conflict.",
   ko:"제도를 줄이는 게 아니라 더 빠르게 만드는 것입니다. 속도와 동의는 서로 충돌하지 않으니까요.",
   notes:[{t:"A rather than B",k:"grammar",m:"B가 아니라 A",tip:"대안을 정확히 대비하는 형태입니다."},
          {t:"be in conflict",k:"collocation",m:"서로 충돌하다",tip:"양립할 수 없는 관계를 말합니다."}]},
  {s:"B",en:"That is harder to explain in public, but it is the position I would rather defend.",
   ko:"그건 공개적으로 설명하기가 더 어렵습니다. 그래도 제가 변호하고 싶은 입장은 그쪽입니다.",
   notes:[{t:"harder to explain in public",k:"collocation",m:"공개적으로 설명하기 더 어려운",tip:"설득 난이도를 평이하게 표현합니다."}]}
 ],
 keys:[

{
 id:"w4d1", day:26, cat:"도시·주거", level:"B2+",
 title:"Why Housing Never Gets Cheaper",
 titleKo:"집값은 왜 안 내려가는가 — 공급을 막는 것들",
 names:{A:"Nina (도시계획 연구자)", B:"Ethan (개발업체)"},
 brief:[
  "집값 이야기는 대개 <b>수요</b>에서 멈춥니다. 사람이 몰리고 돈이 풀렸다는 설명입니다. 그런데 같은 수요를 받고도 집값이 덜 오르는 도시가 있습니다. 차이는 <b>공급이 얼마나 빨리 따라붙느냐</b>에 있습니다.",
  "공급을 늦추는 것은 대개 기술이 아니라 <b>절차</b>입니다. 인허가에 몇 년이 걸리면 그 기간의 이자와 불확실성이 고스란히 원가가 됩니다. 그리고 절차 비용이 싼 집이나 비싼 집이나 똑같이 든다면, 짓는 쪽은 <b>비싼 집</b>을 짓습니다.",
  "여기서 <b>filtering</b>이라는 개념이 나옵니다. 새 집은 언제나 비싸고, 세월이 지나 다음 세대의 새 집이 생겨야 값이 내려간다는 것입니다. 그래서 「지금 비싼 집을 지어야 30년 뒤 싼 집이 생긴다」는 불편한 결론이 따라옵니다.",
  "마지막 층은 <b>정치</b>입니다. 새 공급으로 이득을 볼 사람은 아직 그 도시에 오지 않았고, 투표하는 사람은 이미 그 자산을 갖고 있습니다. 이 대화는 그 구조를 차분히 짚으면서, <b>절차를 예측 가능하게 만들자</b>는 현실적인 접점까지 갑니다."
 ],
 lines:[
  {s:"A",en:"Every city reports a housing shortage, and every city has rules that make construction slower.",
   ko:"도시마다 주택 부족을 보고하고, 도시마다 건설을 더 느리게 만드는 규정을 갖고 있습니다.",
   notes:[{t:"a housing shortage",k:"business",m:"주택 부족",tip:"수요에 비해 공급이 모자란 상태입니다."}]},
  {s:"B",en:"Homeowners never hear that, because the public debate blames developers for the price.",
   ko:"집주인들은 그 얘기를 듣지 못합니다. 공론은 가격의 책임을 개발업자에게 돌리니까요.",
   notes:[{t:"blame A for B",k:"collocation",m:"B의 책임을 A에게 돌리다",tip:"전치사 for 가 고정입니다."}]},
  {s:"A",en:"I disagree in part, because many developers do hold land and wait for prices to rise.",
   ko:"부분적으로는 동의하지 않습니다. 많은 개발업자가 실제로 땅을 쥐고 값이 오르기를 기다립니다.",
   notes:[{t:"I disagree in part",k:"business",m:"부분적으로 동의하지 않습니다",tip:"반대의 범위를 미리 한정합니다."},
          {t:"hold land",k:"business",m:"토지를 보유하다",tip:"개발하지 않고 갖고 있는 상태입니다."}]},
  {s:"B",en:"We hold land because approval takes four years, and no bank finances a project that may never start.",
   ko:"인허가에 4년이 걸리니까 땅을 쥐고 있는 겁니다. 시작도 못 할 수 있는 사업에 자금을 대는 은행은 없습니다.",
   notes:[{t:"approval",k:"business",m:"인허가, 승인",tip:"건설 전에 받아야 하는 행정 허가입니다."},
          {t:"finance a project",k:"business",m:"사업에 자금을 대다",tip:"동사로 쓰인 finance 입니다."}]},
  {s:"A",en:"So the delay itself becomes a cost, and that cost is added to the selling price.",
   ko:"그럼 지연 자체가 비용이 되고, 그 비용은 판매 가격에 더해집니다.",
   notes:[{t:"be added to the price",k:"business",m:"가격에 더해지다",tip:"원가 전가를 평이하게 표현합니다."}]},
  {s:"B",en:"Correct. Every month of review is interest we pay on land that produces no income.",
   ko:"맞습니다. 심사 한 달 한 달이, 아무 수입도 내지 않는 토지에 내는 이자입니다.",
   notes:[{t:"produce no income",k:"collocation",m:"수입을 내지 않다",tip:"유휴 자산의 상태입니다."}]},
  {s:"A",en:"Then why does almost every proposal only become profitable at the expensive end of the market?",
   ko:"그런데 왜 거의 모든 사업안이 고가 시장에서만 수익이 납니까?",
   notes:[{t:"become profitable",k:"business",m:"수익이 나다",tip:"비용을 넘어 이익이 발생하는 것입니다."},
          {t:"the expensive end of the market",k:"collocation",m:"고가 시장",tip:"the cheap end 와 짝을 이룹니다."}]},
  {s:"B",en:"Because the approval process costs the same for cheap flats and expensive ones.",
   ko:"인허가 절차 비용이 싼 아파트나 비싼 아파트나 똑같이 들기 때문입니다.",
   notes:[{t:"cost the same for A and B",k:"grammar",m:"A와 B에 똑같이 든다",tip:"고정비가 선택을 왜곡하는 구조입니다."}]},
  {s:"A",en:"That explains why filtering takes a generation in most cities rather than a decade.",
   ko:"그래서 대부분의 도시에서 필터링이 10년이 아니라 한 세대가 걸리는 거군요.",
   notes:[{t:"filtering",k:"business",m:"필터링",tip:"새 주택이 노후화되며 저렴해지는 과정입니다."}]},
  {s:"B",en:"Explain filtering. I know the concept, but nobody in construction uses that word.",
   ko:"필터링을 설명해 주세요. 개념은 알지만, 건설업계에서 그 단어를 쓰는 사람은 없습니다.",
   notes:[{t:"use a word",k:"collocation",m:"그 용어를 쓰다",tip:"업계 용어 여부를 확인하는 표현입니다."}]},
  {s:"A",en:"New housing is always expensive. It becomes affordable only as it ages and newer housing appears.",
   ko:"새 주택은 언제나 비쌉니다. 노후화되고 더 새 주택이 나타나야 비로소 감당할 만해집니다.",

{

 brief:[
  "무료로 보는 서비스에서 <b>값을 치르는 것은 돈이 아니라 시간</b>입니다. 그리고 시간을 파는 사업에서 좋은 지표는 하나뿐입니다. 사람들이 <b>얼마나 오래 머무느냐</b>입니다.",
  "여기서 기묘한 일이 벌어집니다. 오래 머물게 하는 감정과 좋은 정보를 주는 감정이 <b>같지 않기</b> 때문입니다. 분노와 불안은 사람을 붙잡아 두고, 차분한 설명은 그렇지 못합니다. 알고리즘은 그 차이를 알아서 학습합니다.",
  "누가 악의를 품은 것도 아닙니다. <b>체류 시간을 최적화하라</b>는 지시 하나가 있었을 뿐입니다. 13회차에서 본 굿하트의 법칙이 여기서 다시 나타납니다. 지표가 목표가 되는 순간 그 지표는 일을 설명하기를 그만둡니다.",
  "이 대화의 핵심은 <b>누구를 탓할 것인가</b>가 아니라 <b>무엇을 측정할 것인가</b>입니다. 「나중에 후회했는가」, 「다시 찾아왔는가」처럼 느리고 지저분한 지표를 쓰자는 제안까지 갑니다."
 ],
 lines:[
  {s:"A",en:"Our most-read article last month was also the article I am least proud of publishing.",

  {s:"B",en:"That is not a coincidence. The system is designed to find exactly that article for you.",

 lines:[

  {s:"A",en:"That is the signalling argument, and it explains more of hiring than employers usually admit.",

{
 id:"w4d4", day:29, cat:"건강·의료", level:"B2+",
 title:"The Test That Finds Too Much",
 titleKo:"너무 많이 찾아내는 검사 — 과잉진단의 역설",
 names:{A:"Jinho (환자, 종합검진 애호가)", B:"Dr. Wen (내과의)"},
 brief:[
  "검사는 많이 할수록 좋다는 생각은 자연스럽습니다. 일찍 찾으면 일찍 고칠 수 있으니까요. 그런데 의학에서 오래 논쟁이 되어 온 사실이 하나 있습니다. <b>찾아낸 것이 전부 병은 아니라는 것</b>입니다.",
  "몸에는 평생 아무 해도 끼치지 않고 지나갈 이상 소견이 적지 않습니다. 검사를 촘촘히 하면 그것들이 걸려 나옵니다. 여기서 <b>과잉진단(overdiagnosis)</b>이 생깁니다. 병을 찾아낸 것이 아니라, <b>병이 되지 않았을 것</b>을 찾아낸 상태입니다.",
  "문제는 찾아낸 뒤입니다. 추가 검사, 조직 검사, 때로는 수술이 이어지고, 각 단계마다 작지만 실재하는 위험이 붙습니다. 그리고 <b>통계는 좋아 보입니다</b>. 해롭지 않았을 사례가 생존자 숫자에 더해지기 때문입니다.",
  "이 대화는 「검사를 하지 말라」는 이야기가 아닙니다. <b>이 검사가 내 결정을 바꾸는가</b>라는 질문을 배우는 자리입니다. 의사와 환자가 쓰는 표현이 함께 나오니, 실제 진료실에서 그대로 써 보실 수 있습니다."
 ],

const K = "rt1-";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(K+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){ toast("저장 공간이 부족합니다"); } }
};
const S = {
  prog:   store.get("prog", {}),      // {dayId:{reps:{},done:true,doneAt,stepIdx}}
  log:    store.get("log", {}),       // {"YYYY-MM-DD":{dayId,min,lines,ts}}
  star:   store.get("star", {}),
  out:    store.get("out", {}),       // {dayId:[답변 텍스트]}
  custom: store.get("custom", []),
  spot:   store.get("spot", null),   // 훈련을 멈춘 자리 {dayId,step,line}
  cfg:    store.get("cfg", {voiceA:"", voiceB:"", rate:0.95, reps:3, showKo:false, theme:"auto"})
};
function save(){ store.set("prog",S.prog); store.set("log",S.log); store.set("star",S.star);
  store.set("out",S.out); store.set("custom",S.custom); store.set("cfg",S.cfg); store.set("spot",S.spot); }

let CONTENT = [];
function rebuild(){ CONTENT = CONTENT_BUILTIN.concat(S.custom); }
rebuild();

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),1900); }
function pad(n){ return n<10?"0"+n:""+n; }
function dayById(id){ return CONTENT.find(d=>d.id===id); }
function isDone(id){ return !!(S.prog[id] && S.prog[id].done); }
function nextUndone(){ return CONTENT.find(d=>!isDone(d.id)) || CONTENT[CONTENT.length-1]; }
/* ---------- 음성 (TTS) ---------- */
let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const f = VOICES.filter(x=>/female|zira|aria|jenny|samantha|karen|libby|sonia/i.test(x.name));
    const m = VOICES.filter(x=>/male|david|guy|ryan|daniel|alex|mark/i.test(x.name));
    v = who==="B" ? (m[0]||VOICES[1]||VOICES[0]) : (f[0]||VOICES[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null;
let rpTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; rpTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.05;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].en, items[i].s, rate, ()=>{ i++; setTimeout(step, 260); });
  })();
}

/* 새 끊어읽기 — 「덩어리 수를 먼저 정하고, 끊어도 되는 자리에서만 끊는다」

   예전 방식은 접속사와 쉼표를 만날 때마다 끊고, 10단어가 넘으면 가운데를 억지로
   갈랐다. 그래서 평균 3.5덩어리가 나왔고, 무엇보다 for a / while now 처럼
   구 한가운데가 잘렸다. 쉐도잉은 숨을 쉬는 자리에서 끊어야 의미가 있다. */
function chunkify(s){
  const toks = String(s).trim().split(/\s+/).filter(Boolean);
  const W = toks.length;
  const MIN = 3, MAX = 15, IDEAL = 10;
  if(W <= MIN * 2) return [toks.join(" ")];

  const clean = w => w.replace(/[^\w']/g, "").toLowerCase();
  const SUB   = /^(but|because|so|although|though|while|unless|whereas|since|before|after|until|once|if|whether|provided|when)$/;
  const REL   = /^(which|who|whom|whose|that|where)$/;
  const COORD = /^(and|or|yet)$/;
  const SUBJ  = /^(i|you|he|she|it|we|they|this|that|these|those|there|the|a|an|my|your|his|her|its|our|their|nobody|everyone|everybody|somebody|someone|people|most)$/;

  /* i번째 단어 앞에서 끊었을 때 그 자리가 얼마나 또렷한 '의미의 매듭'인가.
     0이면 말이 끊기는 자리가 아니므로 아예 후보로 두지 않는다. */
  function strength(i){
    const prev = toks[i-1], w = clean(toks[i]), nx = i + 1 < W ? clean(toks[i+1]) : "";
    if(/[.!?]["')\]]?$/.test(prev)) return 100;               // 문장이 끝난 자리
    if(/[;:—–]$/.test(prev))        return 85;
    if(/,$/.test(prev)) return (SUB.test(w) || REL.test(w) || COORD.test(w)) ? 75 : 65;
    if(SUB.test(w))  return 55;                               // 종속절이 시작되는 자리
    if(REL.test(w))  return 50;                               // 관계절이 시작되는 자리
    if(COORD.test(w) && SUBJ.test(nx)) return 40;             // 절과 절을 잇는 등위접속
    /* 전치사구나 to부정사 앞은 '매듭'이 아니다. 여기서 끊으면 staring / at a blank page 처럼
       한 덩어리로 들어야 할 말이 두 동강 난다. 끊을 자리가 없으면 차라리 길게 이어 읽는다. */
    return 0;
  }

  /* 매듭에서만 끊되, 덩어리 길이가 고르게 나오도록 전체 조합을 한꺼번에 고른다.
     강한 매듭일수록 끊는 값이 싸고, 약한 자리는 비싸서 웬만하면 그냥 이어 읽는다. */
  const cost = new Array(W + 1).fill(Infinity);
  const from = new Array(W + 1).fill(-1);
  cost[0] = 0;
  for(let b = MIN; b <= W; b++){
    if(b < W){
      if(strength(b) === 0) continue;                         // 의미가 끊기는 자리가 아니다
      if(W - b < MIN) continue;                               // 끝 덩어리가 너무 짧아진다
    }
    const cut = b < W ? 45 - strength(b) * 0.6 : 0;
    for(let a = 0; a <= b - MIN; a++){
      if(cost[a] === Infinity) continue;
      const L = b - a;
      let c = cost[a] + Math.abs(L - IDEAL) * 2 + cut;
      if(L > MAX) c += (L - MAX) * 10;
      if(c < cost[b]){ cost[b] = c; from[b] = a; }
    }
  }
  if(cost[W] === Infinity) return [toks.join(" ")];

  const cuts = [];
  for(let b = W; b > 0; b = from[b]) cuts.unshift(b);
  const out = [];
  let prev = 0;
  for(const c of cuts){ out.push(toks.slice(prev, c).join(" ")); prev = c; }
  return out;
}

/* ---------- 새 회차 자동 반영 ----------
   서비스워커가 새 본문을 받아 두면 여기에 표시해 둔다. 훈련 중이거나
   자료를 붙여넣는 중에 화면을 새로 고치면 하던 것이 날아가므로,
   그 두 자리에서만 기다렸다가 빠져나오는 순간 알아서 갈아 끼운다. */
let pendingUpdate = false;
function applyUpdate(){
  if(!pendingUpdate) return;
  if(cur.view==="session" || cur.view==="add") return;
  pendingUpdate = false;
  location.reload();
}

function startSession(id, resume){
  stopSpeak();
  const sp = (resume && S.spot && S.spot.dayId===id) ? S.spot : null;
  cur.dayId=id; cur.chunk=-1; cur.showKo=S.cfg.showKo;
  cur.step = sp ? Math.max(0, Math.min(sp.step, STEPS.length-1)) : 0;
  cur.line = sp ? Math.max(0, sp.line||0) : 0;
  const dd = dayById(id); if(dd) cur.line = Math.min(cur.line, dd.lines.length-1);
  cur.reps = (S.prog[id]&&S.prog[id].reps) ? S.prog[id].reps : {};
  cur.t0 = Date.now();
  clearInterval(cur.tick); cur.tick = setInterval(updClock, 1000);
  go("session");
}
function elapsedMin(){ return Math.max(0, Math.round((Date.now()-cur.t0)/60000)); }
function updClock(){
  const el = $("#clock"); if(!el) return;
  const s = Math.floor((Date.now()-cur.t0)/1000);
  el.textContent = pad(Math.floor(s/60))+":"+pad(s%60);
  el.classList.toggle("over", s>SESS_MIN*60);
}

function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};
}

/* ---------- 여기까지 하고 저장 ----------
   20분을 한 자리에서 다 내지 못하는 날이 많다. 어디까지 했는지 적어 두고,
   다음에 열면 홈의 「이어서 하기」로 그 단계, 그 문장에서 다시 시작한다.
   따라 읽을 때마다(bumpRep) 불리므로 자리는 늘 최신이다. */
function saveProgress(){
  if(!cur.dayId) return false;
  const p = S.prog[cur.dayId] || {};
  p.reps = cur.reps; p.stepIdx = cur.step;
  S.prog[cur.dayId] = p;
  /* 한 번 끝낸 회차를 다시 볼 때도 자리는 남긴다.
     복습하다 멈추는 일이 오히려 더 잦다. */
  S.spot = { dayId:cur.dayId, step:cur.step, line:cur.line, at:Date.now() };
  save();
  return true;
}
function saveAndExit(){
  /* 저장했다고 말만 하고 안 남으면 다음에 열었을 때 사람만 헛걸음한다.
     실제로 적혔는지 읽어 보고 나서 알린다. */
  const kept = saveProgress() && store.get("spot", null);
  toast(kept ? "여기까지 저장했습니다. 다음에 열면 이어집니다."
             : "저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.");
  go("home");
}

function finishSession(d){
  const p = S.prog[d.id] || {}; p.reps=cur.reps; p.done=true; p.doneAt=today(); S.prog[d.id]=p;
  /* 끝낸 회차의 자리만 지운다. 다른 회차에 멈춰 둔 자리는 그대로 둔다. */
  if(S.spot && S.spot.dayId===d.id) S.spot=null;
  const t = today(); const prev = S.log[t] || {min:0, lines:0};
  const repLines = Object.keys(cur.reps).filter(k=>cur.reps[k]>0).length;
  S.log[t] = { dayId:d.id, min: prev.min + Math.max(1, elapsedMin()), lines: prev.lines + repLines, ts: Date.now() };
  save(); endSession();
  const info = streakInfo();

    '<div class="streak"><div><b>'+elapsedMin()+'</b><span>오늘 분</span></div><div><b>'+repLines+'</b><span>따라 읽은 문장</span></div>'+
    '<div><b>'+info.streak+'</b><span>연속일</span></div></div>'+
    '<div class="rule"></div><div class="sub">오늘 표현 8개는 <b>표현장</b>에 쌓여 있습니다. 내일 시작하기 전에 <b>보지 않고</b> 한 번 말해 보세요.</div>'+

  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.7);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c], l.s, Math.min(S.cfg.rate,0.9));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = t => Math.max(1000, t.split(/\s+/).length * 340);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.en, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.en));
    });
  })(0);
}
function kLabel(k){
  return ({idiom:"관용", colloquial:"구어", phrasal:"구동사", collocation:"연어", business:"실무어", grammar:"문법"})[k] || k;
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.en, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

function stepReplay(d){
  const me = S.cfg.myRole || "A";
  const other = me === "A" ? "B" : "A";
  let h = '<div class="card"><b>대화를 처음부터 다시 — 역할극</b>'+
    '<div class="sub" style="margin:4px 0 8px">상대 대사는 앱이 읽어 줍니다. 내 대사 차례에는 그 줄이 표시된 채 잠시 멈추니, 그때 소리 내어 말하세요. '+
    '<b>아무 줄이나 누르면</b> 그 줄만 다시 들을 수 있습니다.</div>'+
    '<div class="row"><span class="sub">내 역할</span>'+
    '<button class="btn '+(me==="A"?"":"ghost")+' sm rrole" data-r="A">A · '+esc(d.names.A)+'</button>'+
    '<button class="btn '+(me==="B"?"":"ghost")+' sm rrole" data-r="B">B · '+esc(d.names.B)+'</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="rpStart">역할극 시작 ▶</button>'+
    '<button class="btn ghost sm" id="rpAll">전체 재생 ▶▶</button>'+
    '<button class="btn ghost sm" id="rpStop">정지 ■</button>'+
    '<button class="btn ghost sm" id="rpHide">내 대사 가리기</button>'+
    speedBar("rpSpeed")+'</div>'+
    '<div class="rule"></div><div id="rpList">'+
    d.lines.map((l,i)=>'<div class="rp '+(l.s==="B"?"b ":"")+(l.s===me?"mine":"")+'" data-i="'+i+'">'+
      '<div class="sp">'+l.s+'</div><div><span class="en">'+esc(l.en)+'</span>'+
      '<span class="ko">'+esc(l.ko)+'</span></div></div>').join("")+'</div></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("rpSpeed");

  document.querySelectorAll(".rrole").forEach(b=> b.onclick = ()=>{
    S.cfg.myRole = b.dataset.r; save(); stopSpeak(); stepReplay(d); });

  /* 내 대사를 가려 두면 한국어만 보고 영어를 만들어 내야 한다. 기본은 보이는 상태다. */
  $("#rpHide").onclick = ()=>{
    const on = !document.querySelector("#rpList .rp.mine .en.blurme");
    document.querySelectorAll("#rpList .rp.mine .en").forEach(x=> x.classList.toggle("blurme", on));
    $("#rpHide").textContent = on ? "내 대사 보기" : "내 대사 가리기";
  };
  $("#rpStop").onclick = ()=> stopSpeak();
  $("#rpStart").onclick = ()=> runRolePlay(d, me, other);
  $("#rpAll").onclick = ()=>{
    stopSpeak();
    speakSeq(d.lines, S.cfg.rate, i=>markRp(i), ()=> toast("전체 재생 완료"));
  };
  document.querySelectorAll("#rpList .rp").forEach(el=> el.onclick = ()=>{
    stopSpeak(); const i = +el.dataset.i; markRp(i);
    speak(d.lines[i].en, d.lines[i].s, S.cfg.rate);
  });
}
function markRp(idx){
  document.querySelectorAll("#rpList .rp").forEach(e=>e.classList.remove("now"));
  const el = document.querySelector('#rpList .rp[data-i="'+idx+'"]');
  if(el){ el.classList.add("now"); el.scrollIntoView({block:"center", behavior:"smooth"}); }
}
function wLen(s){ return String(s).trim().split(/\s+/).filter(Boolean).length; }
function runRolePlay(d, me, other){
  const token = {}; rpTok = token;
  let i = 0;
  (function step(){
    if(rpTok !== token) return;
    if(i >= d.lines.length){ rpTok = null; toast("역할극 끝 — 수고하셨습니다"); return; }
    const l = d.lines[i]; markRp(i);
    if(l.s === other){
      speak(l.en, l.s, S.cfg.rate, ()=>{ i++; setTimeout(step, 300); });
    } else {
      /* 내 차례 — 말할 시간을 준다. 영어는 한 단어에 0.42초쯤으로 잡는다. */
      const wait = Math.max(2000, wLen(l.en) * 420);
      setTimeout(()=>{ if(rpTok !== token) return; i++; step(); }, wait);
    }
  })();
}

         '<b>'+esc(r.k.en)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button>'+

         '<div class="ex">'+esc(r.k.ex)+'</div></div>';
  });

  $("#bStar").onclick = ()=>{ bankQ=""; renderBank();
    document.querySelectorAll("#bankList .bankrow").forEach(row=>{
      const s=row.querySelector(".star"); if(!s.classList.contains("on")) row.style.display="none"; }); };
  $("#bDrill").onclick = ()=> drill(rows);

    const k=s.dataset.k; if(S.star[k]) delete S.star[k]; else S.star[k]=1; save(); s.classList.toggle("on"); });
}
function drill(rows){
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 보지 말고 먼저 말하기</div><div class="card">';
  pick.forEach(r=>{
    h += '<div class="keyrow"><b>'+esc(r.k.en)+' <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button></b>'+
         '<span><span class="blurme">'+esc(r.k.ko)+'</span><span class="ex blurme">'+esc(r.k.ex)+'</span></span></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 표현장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

    window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    /* 열 때는 새 본문을 먼저 받으므로 대개 여기까지 오지 않는다.
       느린 곳에서 저장본으로 먼저 열렸을 때만 뒤늦게 도착한다. */
    navigator.serviceWorker.addEventListener("message", e=>{
      if(!e.data || e.data.type!=="update-ready") return;
      pendingUpdate = true;
      if(cur.view==="session" || cur.view==="add") toast("새 회차가 도착했습니다. 이 훈련을 마치면 반영됩니다.");
      applyUpdate();
    });
    /* 설치한 앱은 한 번 열어 두면 다시 불러와도 화면을 새로 받지 않는다.
       그래서 앱을 앞으로 불러올 때마다 새것이 있는지 확인한다. */
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState !== "visible") return;
      applyUpdate();
      if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type:"check-update"});
    });
  }

  const UA = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(UA);
  const isMobile = isIOS || isAndroid;
  /* 앱 안 브라우저 — 카카오톡·팀즈·네이버·라인·밴드·페북·인스타 */
  const inApp = /KAKAOTALK|Teams|MSTeams|NAVER|Line\/|band|DaumApps|Instagram|FB_IAB|FBAN|FBAV|everytime/i.test(UA);
  /* 아이폰은 사파리로, 안드로이드는 크롬으로 넘긴다.
     그 기기에 처음부터 깔려 있는 브라우저라야 아무도 무엇을 설치하지 않는다. */
  const TARGET = isIOS ? "사파리" : "크롬";
  const TO = isIOS ? "사파리로" : "크롬으로";

  function openOutside(){
    const url = location.href;
    /* 카카오톡은 바깥 브라우저로 넘기는 자기 방식이 있다.
       기기의 기본 브라우저가 열리므로 아이폰이면 사파리, 안드로이드면 크롬이다. */
    if(/KAKAOTALK/i.test(UA)){
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      return;
    }
    if(isIOS){
      /* 사파리로 넘기는 전용 방식. 막히면 주소만 복사해 준다. */
      location.href = url.replace(/^https:/, "x-safari-https:").replace(/^http:/, "x-safari-http:");
      setTimeout(()=>{ if(!document.hidden) copyLink(); }, 1200);
      return;
    }
    if(isAndroid){
      location.href = "intent://" + url.replace(/^https?:\/\//, "") +
        "#Intent;scheme=" + location.protocol.replace(":", "") +
        ";package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      return;
    }
    window.open(url, "_blank");
  }

  /* 마지막 수단 — 주소를 복사해 주고 붙여 넣으라고 알린다. */
  function copyLink(){
    const url = location.href;
    const done = ()=> toast("주소를 복사했습니다. " + TARGET + "에 붙여 넣어 주세요.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, done);
    }else{
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }

  if(inApp && isMobile){
    const box = $("#openChrome");
    box.hidden = false;
    $("#ocApp").textContent = /KAKAOTALK/i.test(UA) ? "지금은 카카오톡 안에서 열려 있습니다."
                                                    : "지금은 다른 앱 안에서 열려 있습니다.";
    $("#ocMsg").textContent = "여기서는 영어 발음이 나오지 않고 설치도 되지 않습니다. " +
                              TO + " 열면 소리가 납니다.";
    $("#ocGo").textContent = TO + " 열기";
    $("#ocGo").onclick = openOutside;
    $("#ocCopy").onclick = copyLink;
    $("#ocClose").onclick = ()=>{ box.hidden = true; };
  }

  const btn = $("#installBtn"), note = $("#installNote");
  const title = $("#installTitle"), steps = $("#installSteps"), nowBtn = $("#installNow");

  /* 이미 홈 화면 아이콘으로 열렸으면 설치를 권할 이유가 없다 */
  if(window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return;

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred = e;
    if(!note.hidden) open();     /* 안내가 떠 있는 중에 신호가 오면 버튼과 문구를 함께 고친다 */
  });
  window.addEventListener("appinstalled", ()=>{ btn.hidden = true; hide(); });

  /* 브라우저가 설치 안내를 스스로 띄우지 않는 경우가 많아, 버튼은 늘 보이게 둔다 */
  btn.hidden = false;

  function hide(){ note.hidden = true; }

  function build(){
    if(inApp){
      title.textContent = "📲 먼저 브라우저로 열어 주세요";
      return "<p><b>지금 카카오톡·팀즈 같은 앱 안에서 열려 있습니다.</b> 여기서는 설치가 되지 않습니다.</p>" +
             "<ol>" +
               "<li>화면 <b>오른쪽 위 메뉴</b>(⋯ 또는 ⋮)를 누릅니다</li>" +
               "<li><b>「다른 브라우저로 열기」</b>를 고릅니다" +
                 (isIOS ? " — 아이폰은 <b>Safari</b>" : isAndroid ? " — 안드로이드는 <b>Chrome</b>" : "") + "</li>" +
               "<li>열린 화면에서 이 안내가 다시 나오면 그대로 따라 하시면 됩니다</li>" +
             "</ol>";
    }
    if(isIOS){
      title.textContent = "📲 홈 화면에 추가하기";
      return "<p><b>아이폰 · 아이패드 (Safari)</b></p>" +
             "<ol>" +
               "<li>화면 <b>아래쪽 공유 버튼</b>(□ 위에 화살표)을 누릅니다</li>" +
               "<li>목록을 내려 <b>「홈 화면에 추가」</b>를 고릅니다</li>" +
               "<li>오른쪽 위 <b>「추가」</b>를 누르면 끝입니다</li>" +
             "</ol>";
    }
    if(isAndroid){
      title.textContent = "📲 앱으로 설치하기";
      /* 크롬이 설치 신호를 준 경우에만 버튼을 안내한다. 없는 버튼을 누르라고 하면 그대로 막힌다. */
      return "<p><b>안드로이드 (Chrome)</b></p>" +
             "<ol>" +
               (deferred
                 ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>"
                 : "<li>화면 <b>오른쪽 위 메뉴(⋮)</b>를 누릅니다</li>" +
                   "<li><b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 고릅니다</li>") +
             "</ol>";
    }
    title.textContent = "📲 앱으로 설치하기";
    return "<p><b>컴퓨터 (Chrome · Edge)</b></p>" +
           "<ol>" +
             (deferred ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>" : "") +
             "<li>주소창 오른쪽 끝의 <b>설치 아이콘</b>을 누릅니다</li>" +
             "<li>없으면 메뉴 → <b>「앱 설치」</b></li>" +
           "</ol>";
  }

  function open(){
    steps.innerHTML = build() +
      "<p>설치하면 아이콘을 눌러 주소창 없이 앱처럼 열리고, 인터넷이 끊겨도 계속 쓸 수 있습니다. 지금까지의 기록은 그대로 남습니다.</p>";
    nowBtn.hidden = !deferred;
    note.hidden = false;
  }

  /* 처음 연 사람에게는 한 번 저절로 띄운다. 닫으면 다시 띄우지 않는다. */
  const SEEN = "roundtable-install-seen";
  let seen = false;
  try{ seen = localStorage.getItem(SEEN) === "1"; }catch(e){}
  if(!seen && isMobile && $("#openChrome").hidden)
    setTimeout(()=>{ if(note.hidden) open(); }, 1200);

  btn.onclick = open;

  nowBtn.onclick = async ()=>{
    if(!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    nowBtn.hidden = true;
    if(outcome === "accepted"){ btn.hidden = true; hide(); }
  };

  $("#installNoteClose").onclick = ()=>{
    hide();
    try{ localStorage.setItem(SEEN, "1"); }catch(e){}
  };
})();
</script>

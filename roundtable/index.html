<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4342a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROUNDTABLE">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>ROUNDTABLE 영어 쉐도잉</title>
<style>
:root{
  --paper:#f6f2ea; --card:#fffdf8; --line:#e2dacb; --ink:#1a1917; --sub:#6d665c;
  --accent:#a4342a; --accent-soft:#f0dcd8; --blue:#2b4d63; --blue-soft:#dfe7ec;
  --ok:#2f6b4f; --warn:#8a6a1f; --radius:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme="dark"]{
  --paper:#15171a; --card:#1c1f24; --line:#2e333a; --ink:#e9e5dd; --sub:#9a948a;
  --accent:#e0715f; --accent-soft:#3a2320; --blue:#8fb6cd; --blue-soft:#1f2a33;
  --ok:#6fbf94; --warn:#d6b45c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}

.byline{background:var(--paper);border-bottom:1px solid var(--line)}
.bylinein{max-width:860px;margin:0 auto;padding:9px 16px 8px;font-size:12.5px;font-weight:700;
  line-height:1.7;color:var(--accent);letter-spacing:.01em}
.bylinein .c{letter-spacing:.16em;margin-right:8px}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:600}
.brand i{display:block;font-family:var(--sans);font-style:normal;font-size:11px;
  letter-spacing:.02em;color:var(--sub);margin-top:1px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;padding:6px 11px;border-radius:999px;
  cursor:pointer;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.hd{font-family:var(--serif);font-size:22px;margin:26px 0 2px;line-height:1.3}
.hd small{display:block;font-family:var(--sans);font-size:12px;color:var(--sub);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--sub);font-size:13.5px}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.87}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--accent);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--sub)}

.today{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.today h2{font-family:var(--serif);font-size:26px;margin:8px 0 4px;line-height:1.25}
.today .kotitle{color:var(--sub);font-size:14px;margin-bottom:14px}
.streak{display:flex;gap:18px;margin:14px 0 0;flex-wrap:wrap}
.streak div{text-align:center}
.streak b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.streak span{font-size:11.5px;color:var(--sub)}
.dlist{display:grid;gap:8px;margin-top:10px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.ditem:hover{border-color:var(--accent)}
.ditem .num{font-family:var(--serif);font-size:16px;width:26px;color:var(--sub);flex:none}
.ditem .t{flex:1;min-width:0}
.ditem .t b{display:block;font-size:14.5px;font-weight:600}
.ditem .t span{font-size:12px;color:var(--sub)}
.ditem .done{color:var(--ok);font-size:12px;font-weight:700;flex:none}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.past{background:var(--ok)}
.sesshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.clock{font-family:var(--serif);font-size:19px;margin-left:auto;letter-spacing:.04em}
.clock.over{color:var(--accent)}
.stepname{font-size:13px;font-weight:700}
.stepname em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}

.brief li{margin:7px 0}
.keyrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.keyrow:last-child{border:none}
.keyrow b{font-family:var(--serif);font-size:16px;flex:none;min-width:180px}
.keyrow span{font-size:13.5px;color:var(--sub)}
.keyrow .ex{display:block;font-family:var(--serif);font-size:13px;color:var(--sub);font-style:italic;margin-top:2px}

.sline{display:flex;gap:10px;padding:8px 10px;border-radius:9px;margin:2px 0;cursor:pointer}
.sline.now{background:var(--accent-soft)}
.sline .sp{font-family:var(--serif);font-weight:700;flex:none;width:20px;color:var(--accent)}
.sline.b .sp{color:var(--blue)}
.sline .en{font-family:var(--serif);font-size:16px;line-height:1.55}
.sline .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}

.shadowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:12px 0}
.who{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.who.b{color:var(--blue)}
.bigen{font-family:var(--serif);font-size:clamp(19px,4.1vw,27px);line-height:1.55;margin:8px 0 4px}
.chunks{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.chunk{font-family:var(--serif);font-size:clamp(17px,3.4vw,21px);padding:7px 12px;
  border-left:3px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.chunk:hover{background:var(--paper)}
.chunk.on{border-left-color:var(--accent);background:var(--accent-soft)}
.bigko{font-size:14px;color:var(--sub);margin-top:8px}
.blurme{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.blurme.show{filter:none;cursor:auto}
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.note{margin:8px 0;font-size:13.5px}
.note b{font-family:var(--serif);font-size:15px}
.note .k{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--blue-soft);
  color:var(--blue);margin-left:6px;font-weight:700;vertical-align:2px}
.note .tip{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.counter{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.speedbar{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.speedbar button{border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer}
.speedbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.qbox{margin:16px 0}
.qbox .q{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.qbox .hint{font-size:12.5px;color:var(--sub)}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;max-width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:10.5px;color:var(--sub)}
.cal div.done{background:var(--accent);color:#fff;font-weight:700}
.histrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.histrow b{font-family:var(--serif);font-size:15px}
.bankrow{padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow b{font-family:var(--serif);font-size:16px}
.bankrow .m{font-size:13px;color:var(--sub)}
.bankrow .ex{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--sub)}
.star{cursor:pointer;float:right;font-size:15px;opacity:.28}
.star.on{opacity:1}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px;z-index:30;display:none}
.footbar.on{display:block}
.footin{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.credit{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:11.5px;color:var(--sub);
  letter-spacing:.02em;text-align:center;opacity:.8}
.credit b{font-family:var(--serif);font-weight:600;letter-spacing:.06em}
@media(max-width:560px){
  .keyrow{flex-direction:column;gap:2px}
  .keyrow b{min-width:0}
  .brand i{display:none}
}

/* ---- 앱으로 설치하기 ---- */
.instbtn{background:var(--accent);color:var(--paper);border:none;padding:6px 12px;
  border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.instbtn[hidden]{display:none}
@media(max-width:560px){ .instbtn{margin-left:auto} }

#openChrome{position:fixed;inset:auto 12px 12px;max-width:520px;margin:0 auto;z-index:60;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--accent);color:var(--paper);border-radius:14px;padding:16px 18px;
  box-shadow:0 12px 40px -8px rgba(0,0,0,.45)}
#openChrome[hidden]{display:none}   /* display:flex가 hidden 속성을 이기므로 명시한다 */
#openChrome .oc-body{flex:1 1 240px;font-size:13.5px;line-height:1.7}
#openChrome .oc-body b{display:block;font-size:15px;margin-bottom:3px}
#openChrome .oc-body span{opacity:.9}
#openChrome button{border:none;border-radius:9px;padding:10px 16px;cursor:pointer;
  font-weight:700;font-size:14px;background:var(--paper);color:var(--accent)}
#openChrome button.ghost{background:transparent;color:inherit;font-weight:400;opacity:.85;padding:10px 8px}

#installNote{position:fixed;inset:auto 16px 16px;max-width:460px;margin:0 auto;z-index:50;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:0 12px 40px -8px rgba(0,0,0,.4)}
#installNote h5{margin:0 0 10px;font-size:15px}
#installNote p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.8}
#installNote ol{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--sub);line-height:1.95}
#installNote ol li{margin-bottom:3px}
#installNote b{color:var(--ink)}
#installNote button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13.5px}
#installNote .inst-btns{display:flex;gap:8px;flex-wrap:wrap}
#installNote #installNow{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
</style>
<div class="byline"><div class="bylinein"><span class="c">&copy; 2026</span>기획과 구성 by 곤사마</div></div>
<div class="topbar"><div class="topin">
  <div class="brand">ROUNDTABLE<i>데일리 영어 쉐도잉</i></div>
  <nav class="tabs" id="tabs">
    <button data-view="home" class="on">홈</button>
    <button data-view="log">기록</button>
    <button data-view="bank">표현장</button>
    <button data-view="add">자료 추가</button>
  </nav>
  <button class="instbtn" id="installBtn" hidden>📲 설치</button>
</div></div>

<div class="wrap">
  <section id="view-home" class="view on"></section>
  <section id="view-session" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-bank" class="view"></section>
  <section id="view-add" class="view"></section>
</div>
<div class="credit">ROUNDTABLE — 데일리 영어 쉐도잉 &nbsp;·&nbsp; © 2026 <b>곤사마</b> (Gonsama). All rights reserved.</div>
<div class="footbar" id="footbar"><div class="footin" id="footin"></div></div>
<div class="toast" id="toast"></div>

<div id="openChrome" hidden>
  <div class="oc-body">
    <b id="ocApp">지금은 다른 앱 안에서 열려 있습니다.</b>
    <span id="ocMsg"></span>
  </div>
  <button id="ocGo">브라우저로 열기</button>
  <button id="ocCopy" class="ghost">주소 복사</button>
  <button id="ocClose" class="ghost">그냥 보기</button>
</div>

<div id="installNote" hidden>
  <h5 id="installTitle">📲 홈 화면에 설치하기</h5>
  <div id="installSteps"></div>
  <div class="inst-btns">
    <button id="installNow" hidden>지금 설치</button>
    <button id="installNoteClose">알겠습니다</button>
  </div>
</div>

<script>
const CONTENT_BUILTIN = [
{
 id:"w1d1", day:1, cat:"경제", level:"B2+",
 title:"When Money Stops Being Cheap",
 titleKo:"돈이 더는 싸지 않을 때 — 금리와 투자 결정",
 names:{A:"Nora (재무)", B:"Sam (영업·운영)"},
 brief:[
  "기업이 설비 투자를 결정할 때 보는 것은 수요만이 아니라 <b>자본비용(cost of capital)</b>이다. 돈을 빌리는 값이 오르면, 같은 수요·같은 프로젝트라도 승인 기준이 올라간다.",
  "금리 인상의 충격은 즉시 오지 않고 <b>시차를 두고(with a lag)</b> 온다. 낮은 금리로 고정해 둔 기존 부채가 만기를 맞아 <b>차환(roll over)</b>될 때 비로소 이자 부담이 드러나기 때문이다.",
  "그래서 실무에서 쓰는 개념이 <b>hurdle rate(투자 승인 최저 수익률)</b>와 <b>payback period(회수 기간)</b>다. 자본이 비쌀수록 회수 기간이 짧은 안건만 살아남는다.",
  "재고도 마찬가지다. 저금리 시절엔 재고를 쌓아두는 비용이 사실상 공짜에 가까웠지만, 고금리에서는 야적장의 한 톤 한 톤이 <b>빌린 돈</b>이 된다."
 ],
 lines:[
  {s:"A",en:"So the board pushed back on the expansion plan again, and honestly, I'm not surprised by a decision that everyone in finance saw coming.",
   ko:"결국 이사회가 증설안에 또 제동을 걸었어요. 솔직히, 재무 쪽 사람이라면 다 예상하던 결정이라 놀랍지도 않네요.",
   notes:[{t:"push back on ~",k:"phrasal",m:"~에 반대하다, 제동을 걸다",tip:"reject보다 훨씬 부드럽고 실무적입니다. 회의에서 반대할 때 한국인이 자주 쓰는 'I don't agree'를 이걸로 바꾸면 톤이 좋아집니다."},
          {t:"a decision that everyone saw coming",k:"grammar",m:"모두가 올 줄 알았던 결정",tip:"관계대명사 that이 decision을 받습니다. see it coming = 미리 낌새를 채다. 통째로 붙여 쓰세요."},
          {t:"honestly",k:"colloquial",m:"솔직히 말해서",tip:"문장 중간에 콤마로 끼워 넣으면 '내 개인 의견인데'라는 완충 역할을 합니다."}]},
  {s:"B",en:"Really? The demand numbers I reviewed last week looked solid to me, so what exactly is the sticking point here?",
   ko:"그래요? 지난주에 제가 검토한 수요 숫자는 탄탄해 보이던데요. 그럼 정확히 뭐가 걸리는 건가요?",
   notes:[{t:"the numbers I reviewed",k:"grammar",m:"내가 검토한 그 숫자들",tip:"관계대명사 that/which를 생략한 접촉절입니다. 원어민 구어에서는 생략형이 훨씬 자연스럽습니다."},
          {t:"the sticking point",k:"idiom",m:"합의를 막는 결정적 걸림돌",tip:"problem이 뭉뚱그린 표현이라면, sticking point는 '논의가 딱 멈춘 지점'을 콕 집습니다."},
          {t:"solid",k:"collocation",m:"(수치가) 탄탄한, 믿을 만한",tip:"solid numbers / solid evidence / solid track record 로 자주 붙습니다."}]},
  {s:"A",en:"It isn't demand that's holding this up; it's the cost of capital, which has quietly doubled since we drew up that plan.",
   ko:"이걸 막고 있는 건 수요가 아니에요. 자본비용이죠. 그 계획을 짤 때보다 조용히 두 배가 됐거든요.",
   notes:[{t:"It isn't A that ~; it's B",k:"grammar",m:"~인 것은 A가 아니라 B다",tip:"강조구문(cleft)입니다. 논점을 바로잡을 때 가장 강력한 문장 골격이니 통째로 익히세요."},
          {t:"cost of capital",k:"business",m:"자본비용(자금 조달 비용)",tip:"발음은 '코스트 오브 캐피털'에서 of를 거의 /əv/로 흘립니다. 붙여서 한 덩어리로 연습하세요."},
          {t:"draw up a plan",k:"phrasal",m:"계획을 작성하다",tip:"draw up a contract / a list / a budget 로 확장됩니다. make보다 격식 있습니다."}]},
  {s:"B",en:"Fair enough, but we've been living with higher rates for a while now, so why is it only biting at the point where we need approval?",
   ko:"일리는 있어요. 그런데 고금리는 한참 겪어 왔잖아요. 왜 하필 승인이 필요한 시점에 와서야 타격이 오죠?",

{

 brief:[
  "수십 년간 글로벌 공급망의 설계 원칙은 <b>효율(just-in-time)</b>이었다. 재고를 최소화하고, 가장 싼 곳에서 조달하고, 공급처를 하나로 모아 단가를 낮추는 방식이다.",
  "팬데믹과 지정학적 충돌을 겪으며 원칙이 <b>회복탄력성(just-in-case)</b>으로 이동했다. 이중 조달(dual sourcing), 재고 완충, 지역 분산이 다시 비용을 감수할 가치가 있는 것으로 평가된다.",
  "여기에 <b>수출통제(export controls)</b>와 <b>프렌드쇼어링(friend-shoring)</b>이 겹친다. 어디서 만드느냐가 단가 문제가 아니라 <b>정치적 노출(exposure)</b>의 문제가 되었다.",
  "다만 회복탄력성은 공짜가 아니다. 이중화는 규모의 경제를 깎고, 재고는 자금을 묶는다. 실무의 질문은 '분산하느냐'가 아니라 <b>'어디까지 이중화할 것인가'</b>다."
 ],
 lines:[
  {s:"A",en:"Procurement wants to dual-source the alloy, while finance insists we're gold-plating a risk that hasn't actually cost us anything yet.",
   ko:"구매는 그 합금을 이중 조달하자고 하고, 재무는 아직 손해를 낸 적도 없는 리스크에 과하게 돈을 쓴다고 우겨요.",
   notes:[{t:"dual-source",k:"business",m:"공급처를 둘로 이원화하다",tip:"single-source(단일 조달)의 반대. 명사 dual sourcing으로도 씁니다."},
          {t:"while ~",k:"grammar",m:"~인 반면에",tip:"시간이 아니라 대조를 나타내는 while입니다. 두 부서의 입장을 한 문장에 나란히 놓을 때 아주 유용합니다."},
          {t:"gold-plate",k:"idiom",m:"필요 이상으로 과하게 하다",tip:"원래 '금도금하다'. 사양·비용이 과잉일 때 비판적으로 씁니다."}]},
  {s:"B",en:"Both of them are right in their own frame, which is exactly why this argument always ends in a standoff nobody wants to own.",
   ko:"각자 자기 틀 안에서는 둘 다 맞아요. 그래서 이 논쟁이 늘 아무도 떠안기 싫어하는 교착으로 끝나는 거고요.",
   notes:[{t:"a standoff",k:"idiom",m:"교착 상태, 대치",tip:"협상·노사·외교 모두에 씁니다. The talks ended in a standoff."},
          {t:", which is exactly why ~",k:"grammar",m:"바로 그래서 ~인 것이다",tip:"앞 문장 전체를 받아 인과로 잇습니다. That's why보다 논증적이고 문장이 끊기지 않습니다."}]},
  {s:"A",en:"For thirty years the rule was simple enough to put on a slide: squeeze the inventory and chase whichever supplier offered the lowest landed cost.",
   ko:"30년간 규칙은 장표 한 장에 담길 만큼 단순했어요. 재고는 쥐어짜고, 도착원가가 가장 낮은 공급사를 좇는 것.",
   notes:[{t:"squeeze the inventory",k:"collocation",m:"재고를 최소로 줄이다",tip:"squeeze costs / squeeze margins 로 확장됩니다."},
          {t:"whichever supplier ~",k:"grammar",m:"~한 공급사가 어디든",tip:"복합관계형용사입니다. any supplier that과 같은 뜻인데 한 단어로 끝나 문장이 단정해집니다."},
          {t:"landed cost",k:"business",m:"도착원가(운임·관세 포함 원가)",tip:"무역 실무 필수어. 단순 단가와 구별해서 쓰세요."}]},
  {s:"B",en:"And it worked beautifully until the day it didn't, which is the sentence every supply chain textbook is going to have to add.",
   ko:"그리고 안 통하는 날이 오기 전까지는 훌륭하게 작동했죠. 공급망 교과서마다 덧붙여야 할 문장이 바로 그거예요.",
   notes:[{t:"until the day it didn't",k:"idiom",m:"안 되기 전까지는 (잘 됐다)",tip:"영어 특유의 냉소적 반전 구문. 통째로 외워 두면 강력합니다."},
          {t:"is going to have to ~",k:"grammar",m:"앞으로 ~해야만 하게 될 것이다",tip:"조동사를 겹친 형태입니다. will have to보다 구어적이고 체념이 섞입니다."}]},
  {s:"A",en:"Now the same executives who spent a decade preaching just-in-time want buffer stock on site, and they want it by the end of the quarter.",
   ko:"이제는 10년간 적시 생산을 설파하던 바로 그 임원들이 현장에 완충 재고를 두라고 해요. 그것도 분기 안에요.",
   notes:[{t:"the same executives who ~",k:"grammar",m:"~하던 바로 그 임원들",tip:"the same + 명사 + who 관계절은 '말 바꾸기'를 꼬집는 정형 구조입니다. 비꼬는 힘이 셉니다."},
          {t:"preach",k:"colloquial",m:"(주의·방침을) 설파하다",tip:"약간 비꼬는 뉘앙스가 있습니다. He preaches efficiency."},
          {t:"buffer stock",k:"business",m:"완충 재고, 안전 재고",tip:"safety stock과 사실상 같은 뜻으로 쓰입니다."}]},
  {s:"B",en:"To be fair, the ground shifted underneath them, and cost stopped being the only variable that anyone upstairs was measured on.",
   ko:"공정하게 말하면 그들 발밑의 판이 바뀐 거예요. 이제 윗선이 평가받는 변수가 비용 하나만은 아니게 됐고요.",
   notes:[{t:"To be fair",k:"idiom",m:"공정하게 말하자면",tip:"상대를 변호하며 균형을 잡는 표현. 토론에서 신뢰를 줍니다."},
          {t:"the ground shifted",k:"idiom",m:"전제(판)가 바뀌었다",tip:"the goalposts moved(기준이 바뀌었다)와 짝으로 알아 두세요."},
          {t:"the only variable that ~ was measured on",k:"grammar",m:"~가 평가받던 유일한 잣대",tip:"관계절 끝에 전치사 on이 남습니다. be measured on ~ = ~으로 평가받다."}]},
  {s:"A",en:"You mean export controls. Where you choose to make something now decides who is allowed to buy it, regardless of what it costs.",
   ko:"수출통제 말이군요. 이제는 어디서 만들기로 했느냐가 누가 살 수 있는지를 정하죠. 값이 얼마든 상관없이요.",
   notes:[{t:"export controls",k:"business",m:"수출통제",tip:"보통 복수형. subject to export controls = 수출통제 대상."},
          {t:"Where you choose to make something decides ~",k:"grammar",m:"어디서 만들지가 ~을 결정한다",tip:"의문사절이 통째로 주어가 된 형태입니다. 주어가 길어도 동사는 단수(decides)라는 점을 놓치지 마세요."}]},
  {s:"B",en:"Exactly. Geography used to be a cost question that procurement settled alone; it's a permission question now, and legal owns half of it.",
   ko:"바로 그거예요. 지리는 예전엔 구매가 혼자 정리하던 비용 문제였는데, 지금은 허가 문제고 절반은 법무 소관이죠.",
   notes:[{t:"used to be A, it's B now",k:"grammar",m:"예전엔 A였지만 지금은 B다",tip:"변화 설명의 뼈대 문형. 이 대비 구조를 입에 붙이세요."},
          {t:"a question that procurement settled alone",k:"grammar",m:"구매가 혼자 정리하던 문제",tip:"관계절로 '누가 결정권을 쥐고 있었는지'를 명사 안에 넣었습니다. 조직 이야기에 잘 맞는 화법입니다."}]},
  {s:"A",en:"That's what my counterpart in Nagoya keeps hinting at in every call, without ever once saying it outright in a way I could quote.",
   ko:"나고야 쪽 담당자가 통화할 때마다 계속 그걸 암시해요. 제가 인용할 수 있을 만큼 대놓고 말한 적은 한 번도 없고요.",
   notes:[{t:"my counterpart",k:"business",m:"(상대 회사의) 같은 직급 담당자",tip:"해외 업무에서 매일 쓰는 단어입니다. your counterpart at the supplier."},
          {t:"hint at",k:"phrasal",m:"~을 넌지시 비치다",tip:"say outright(대놓고 말하다)와 대비해서 기억하세요."},
          {t:"in a way I could quote",k:"grammar",m:"내가 인용할 수 있을 만한 방식으로",tip:"in a way (that) ~ 접촉절입니다. 문장 끝에 붙여 조건을 덧대는 실무 화법입니다."}]},
  {s:"B",en:"Nobody in that position ever says it outright. They simply ask where your feedstock comes from and let you work out the rest.",
   ko:"그 자리에 있는 사람은 아무도 대놓고 말 안 해요. 그냥 원료가 어디서 오는지 묻고, 나머지는 알아서 헤아리게 두죠.",
   notes:[{t:"feedstock",k:"business",m:"(공정에 투입되는) 원료",tip:"철강·화학 업계 필수어. raw material보다 구체적입니다."},
          {t:"let you work out the rest",k:"phrasal",m:"나머지는 알아서 파악하게 두다",tip:"work out = 따져서 알아내다. let + 목적어 + 동사원형 구조입니다."}]},
  {s:"A",en:"So we're being asked to prove a negative, which is the one thing an auditor can never finish and a customer never stops requesting.",
   ko:"결국 없다는 걸 증명하라는 요구를 받는 셈이죠. 감사인은 절대 못 끝내고, 고객은 끊임없이 요구하는 그 한 가지요.",
   notes:[{t:"prove a negative",k:"idiom",m:"없다는 것을 증명하다(사실상 불가능한 요구)",tip:"논리학 표현이 실무 회의에 자주 들어옵니다."},
          {t:"the one thing A can never finish and B never stops requesting",k:"grammar",m:"A는 끝내지 못하고 B는 계속 요구하는 그 한 가지",tip:"관계절 하나에 대조되는 두 절을 매단 형태입니다. 문장 하나로 딜레마를 그립니다."}]},
  {s:"B",en:"It is expensive, but resilience always shows up as a line item somewhere, whether or not anyone has the courage to name it.",
   ko:"비싸죠. 그래도 회복탄력성은 어딘가 비용 항목으로 반드시 나타납니다. 누가 그걸 이름 붙일 배짱이 있든 없든요.",
   notes:[{t:"a line item",k:"business",m:"(예산·명세의) 개별 항목",tip:"It's a line item in the budget. 예산 논의 필수어."},
          {t:"whether or not ~",k:"grammar",m:"~이든 아니든 상관없이",tip:"whether만 써도 되지만 or not을 붙이면 '어느 쪽이든 결과는 같다'가 분명해집니다."}]},
  {s:"A",en:"Fine, but let's not pretend redundancy is free. Two suppliers means half the volume each, and half the volume is where our discount lives.",
   ko:"좋아요. 그래도 이중화가 공짜인 척은 맙시다. 공급처가 둘이면 각각 물량이 절반이고, 우리 할인은 바로 그 물량에 걸려 있잖아요.",
   notes:[{t:"let's not pretend ~",k:"idiom",m:"~인 척은 하지 맙시다",tip:"불편한 진실을 꺼낼 때 쓰는 강한 표현."},
          {t:"redundancy",k:"business",m:"(안전을 위한) 이중화, 여분",tip:"영국 영어에서는 '정리해고'라는 뜻도 있어 문맥 주의."},
          {t:"where our discount lives",k:"grammar",m:"우리 할인이 걸려 있는 곳",tip:"관계부사 where로 추상적인 '지점'을 가리킵니다. live는 '살다'가 아니라 '자리 잡고 있다'는 뜻입니다."}]},
  {s:"B",en:"Which kills the leverage you rely on at renewal. I know — I've had that same argument twice with people who own the number.",
   ko:"그럼 재계약 때 기대던 협상력이 죽죠. 압니다. 그 숫자를 책임지는 사람들과 같은 논쟁을 두 번 했어요.",
   notes:[{t:"leverage",k:"business",m:"협상력, 지렛대",tip:"발음 주의: 미국식 /ˈlevərɪdʒ/. lose leverage / gain leverage."},
          {t:"the leverage you rely on at renewal",k:"grammar",m:"재계약 때 기대는 그 협상력",tip:"접촉절 + 전치사구입니다. rely on의 on이 문장 안에 그대로 남는다는 점을 확인하세요."},
          {t:"people who own the number",k:"business",m:"그 숫자를 책임지는 사람들",tip:"own a number / own a target = 그 지표에 책임이 있다. 글로벌 기업에서 매우 자주 쓰입니다."}]},
  {s:"A",en:"So where do you actually draw the line, in a way that survives the first person who asks you to justify it?",
   ko:"그럼 선을 실제로 어디에 긋죠? 그것도 처음으로 근거를 대라는 사람 앞에서 버틸 수 있는 방식으로요.",
   notes:[{t:"draw the line",k:"idiom",m:"선을 긋다, 한계를 정하다",tip:"Where do you draw the line? 은 원칙을 묻는 정석 질문입니다."},
          {t:"in a way that survives ~",k:"grammar",m:"~ 앞에서도 살아남는 방식으로",tip:"survive를 '견뎌 내다'로 쓰는 감각이 한국인에게 약합니다. The plan survived the review."}]},
  {s:"B",en:"Only where a single failure stops the whole line. Everything else stays single-sourced, however uncomfortable that makes the risk register look.",
   ko:"한 번 끊기면 라인 전체가 멈추는 곳만요. 나머지는 단일 조달로 갑니다. 리스크 대장이 아무리 불편해 보이더라도요.",
   notes:[{t:"a single failure",k:"collocation",m:"단일 지점의 고장",tip:"single point of failure(단일 장애점)라는 정식 용어도 함께."},
          {t:"however + 형용사 + 주어 + 동사",k:"grammar",m:"아무리 ~하더라도",tip:"however uncomfortable it is 형태입니다. 형용사가 however 바로 뒤에 붙는 어순을 꼭 지키세요."}]},
  {s:"A",en:"That I can defend in front of the steering committee, because it's a rule anyone can apply without asking me what I meant.",
   ko:"그거라면 운영위원회 앞에서 방어할 수 있겠네요. 제 의도를 되묻지 않고도 누구나 적용할 수 있는 규칙이니까요.",
   notes:[{t:"That I can defend",k:"grammar",m:"그거라면 방어할 수 있다",tip:"목적어를 앞으로 뺀 도치. 강조 효과가 큽니다. That I don't know."},
          {t:"a rule anyone can apply",k:"grammar",m:"누구나 적용할 수 있는 규칙",tip:"접촉절입니다. 규칙이 좋은지 판단하는 실무 기준을 그대로 문장으로 만든 표현입니다."},
          {t:"steering committee",k:"business",m:"운영위원회",tip:"프로젝트 의사결정 기구. 회의체 이름은 통째로 외우세요."}]},
  {s:"B",en:"And frame it as insurance rather than as distrust of a supplier who has never let us down. Wording matters more than the number here.",
   ko:"그리고 한 번도 우리를 실망시킨 적 없는 공급사를 불신한다는 게 아니라 보험이라고 프레임을 잡으세요. 여기선 숫자보다 표현이 중요합니다.",
   notes:[{t:"frame it as ~",k:"business",m:"~로 규정하다, 프레임을 잡다",tip:"협상·보고에서 핵심 동사. Let's frame it as an upgrade."},
          {t:"a supplier who has never let us down",k:"grammar",m:"한 번도 우리를 저버린 적 없는 공급사",tip:"let someone down = 기대를 저버리다. 현재완료 관계절로 '지금까지 쭉'을 표시합니다."},
          {t:"Wording matters.",k:"collocation",m:"표현(문구)이 중요합니다",tip:"계약·공문 협의에서 그대로 씁니다."}]},
  {s:"A",en:"Especially with a partner we've worked with for twenty years and who has absorbed more than one of our own mistakes.",
   ko:"20년을 거래했고 우리 실수까지 여러 번 떠안아 준 파트너라면 더욱 그렇죠.",
   notes:[{t:"work with",k:"collocation",m:"거래하다, 협업하다",tip:"a supplier we've worked with for years. 완료형과 잘 붙습니다."},
          {t:"a partner we've worked with and who has ~",k:"grammar",m:"우리가 거래해 왔고 또 ~해 온 파트너",tip:"접촉절과 who절을 and로 잇는 형태입니다. 한 명사에 두 가지 이력을 붙일 때 씁니다."},
          {t:"absorb a mistake",k:"collocation",m:"(남의) 실수를 떠안아 주다",tip:"absorb the cost / absorb the impact 로도 씁니다. 비용을 대신 감당한다는 뜻입니다."}]},
  {s:"B",en:"Then we're aligned. Let me write it up tonight and send it round before somebody who missed this conversation reopens the whole debate.",
   ko:"그럼 의견이 맞은 거네요. 오늘 밤에 정리해서 돌릴게요. 이 대화에 없던 누군가가 논의를 다시 열기 전에요.",
   notes:[{t:"we're aligned",k:"business",m:"의견이 일치했다",tip:"글로벌 기업 회의 최다 빈출. Are we aligned on this?"},
          {t:"write it up",k:"phrasal",m:"문서로 정리하다",tip:"I'll write it up and send it around."},
          {t:"somebody who missed this conversation",k:"grammar",m:"이 대화에 없었던 누군가",tip:"miss a conversation = 그 자리에 없어 못 들었다. 회의록을 서둘러 돌리는 이유를 한마디로 표현합니다."},
          {t:"reopen the debate",k:"collocation",m:"논의를 다시 열다",tip:"부정적 뉘앙스가 있습니다. 이미 끝난 걸 되돌린다는 뜻."}]}

 brief:[
  "조직심리학에서 갈등은 두 종류로 나뉜다. <b>task conflict(과업 갈등)</b>은 '무엇이 옳은가'를 두고 다투는 것이고, <b>relationship conflict(관계 갈등)</b>은 사람 자체를 겨냥한다. 전자는 성과를 높일 수 있지만, 후자는 거의 항상 성과를 깎는다.",
  "문제는 둘이 쉽게 섞인다는 점이다. 과업 갈등이 오래 방치되면 인신공격으로 변질되고, 그때부터 팀은 <b>말을 아끼기(hold back)</b> 시작한다.",
  "에이미 에드먼슨의 <b>psychological safety(심리적 안전감)</b> 연구가 말하는 핵심은 '사이좋은 팀'이 아니라, <b>반대 의견을 냈을 때 벌 받지 않는다는 확신</b>이다. 안전한 팀은 오히려 실수를 더 많이 보고한다.",
  "리더가 쓸 수 있는 가장 값싼 도구는 <b>말하는 순서</b>다. 상급자가 먼저 결론을 말하면 반대 의견은 사라진다(anchoring). 그래서 '리더가 마지막에 말하기'가 실전 처방으로 자주 권장된다."
 ],
 lines:[
  {s:"A",en:"Something's off in my team meetings. Everyone agrees with whatever I put on the screen, and then nothing actually improves.",

   notes:[{t:"Something's off.",k:"colloquial",m:"뭔가 이상해요",tip:"근거를 못 대지만 감이 이상할 때. wrong보다 훨씬 자연스럽습니다."},

  {s:"B",en:"Can I ask something blunt? Do you say what you think before or after the people who report to you have spoken?",

  {s:"A",en:"Before, obviously. I'm trying to give them direction so nobody spends a week working on something I'd never approve.",

 title:"The Grid Is the Bottleneck",
 titleKo:"병목은 전력망이다 — 재생에너지와 산업의 열",
 names:{A:"Hana (설비)", B:"Owen (에너지 담당)"},
 brief:[
  "재생에너지의 근본 과제는 발전 단가가 아니라 <b>간헐성(intermittency)</b>이다. 태양광·풍력은 필요한 시간이 아니라 자연이 허락하는 시간에 발전한다.",
  "그래서 초점이 발전기에서 <b>전력망(grid)</b>과 <b>저장(storage)</b>으로 옮겨간다. 배터리는 시간 단위 이동에는 강하지만, 며칠 단위의 <b>장주기 저장(long-duration storage)</b>은 여전히 어려운 문제다.",
  "송전선 건설은 기술이 아니라 <b>인허가(permitting)</b>와 부지 문제로 지연되는 경우가 많다. 전력 수요지와 발전 적지가 지리적으로 어긋나 있기 때문이다.",
  "제조업의 진짜 난제는 전기가 아니라 <b>고온의 열(industrial heat)</b>이다. 철강의 경우 석탄 대신 수소를 쓰는 <b>수소환원제철(hydrogen-based direct reduction)</b>이 논의되지만, 저렴한 청정 수소와 대규모 전력이 전제 조건이다."
 ],
 lines:[
  {s:"A",en:"The board wants a single number for going green, and I keep telling them it isn't a number anyone can put on one slide.",
   ko:"이사회가 친환경 전환을 숫자 하나로 달라는데, 누구도 장표 한 장에 담을 수 있는 숫자가 아니라고 계속 말하고 있어요.",
   notes:[{t:"go green",k:"colloquial",m:"친환경으로 전환하다",tip:"가벼운 구어. 공식 문서에서는 decarbonize를 씁니다."},
          {t:"a number anyone can put on one slide",k:"grammar",m:"누구든 장표 한 장에 담을 수 있는 숫자",tip:"접촉절로 명사를 꾸몄습니다. 요구가 왜 무리인지를 명사 안에 접어 넣는 화법입니다."}]},
  {s:"B",en:"It never is. The generation cost is the easy half, and it's the half that everybody quotes because it's the one that's falling.",
   ko:"당연히 아니죠. 발전 단가는 쉬운 쪽 절반이고, 값이 내려가는 쪽이라 다들 그것만 인용하는 거예요.",
   notes:[{t:"It never is.",k:"colloquial",m:"늘 그렇지 않죠",tip:"앞 문장의 be동사를 받아 짧게 되받는 리듬. 원어민다운 축약입니다."},
          {t:"the easy half",k:"idiom",m:"쉬운 쪽 절반",tip:"the hard part과 짝지어 씁니다."},
          {t:"the one that's falling",k:"grammar",m:"값이 내려가고 있는 그쪽",tip:"the one that ~ 으로 앞 명사를 대신 받습니다. 같은 단어를 세 번 쓰지 않고 문장을 잇는 방법입니다."}]},
  {s:"A",en:"Right. Solar is cheap at noon and worth nothing at seven in the evening, which is exactly when the city wants it.",
   ko:"맞아요. 태양광은 정오엔 싸고 저녁 7시엔 아무 값어치가 없죠. 하필 도시가 전기를 원하는 시간이고요.",
   notes:[{t:"worth nothing",k:"collocation",m:"아무 가치가 없는",tip:"worthless보다 구어적이고 강조가 됩니다."},
          {t:", which is exactly when ~",k:"grammar",m:"바로 그때가 ~하는 시점이다",tip:"앞 문장 전체를 which로 받고 when절로 잇습니다. 아이러니를 짚을 때 아주 잘 듣습니다."}]},
  {s:"B",en:"That's intermittency in one line. The power shows up when nature decides it will, not when the people paying for it need it.",
   ko:"그게 간헐성을 한 줄로 말한 거예요. 전기는 자연이 정한 때 나오지, 돈 내는 사람이 필요한 때 나오지 않죠.",
   notes:[{t:"intermittency",k:"business",m:"간헐성",tip:"에너지 논의의 핵심어. 형용사는 intermittent."},
          {t:"the people paying for it",k:"grammar",m:"그 값을 치르는 사람들",tip:"현재분사로 명사를 꾸민 형태입니다. who are를 줄인 것으로 보면 이해가 쉽습니다."},
          {t:"in one line",k:"collocation",m:"한 줄로 요약하면",tip:"in one sentence와 같은 용법입니다."}]},
  {s:"A",en:"So we store it. Battery costs have come down a long way, haven't they, or is that another number people quote selectively?",
   ko:"그럼 저장하면 되죠. 배터리 값이 많이 내려오지 않았나요? 아니면 그것도 사람들이 골라 인용하는 숫자인가요?",
   notes:[{t:"come down",k:"phrasal",m:"(가격이) 내려가다",tip:"Prices have come down sharply. 부가의문문 haven't they?로 확인 요청."},
          {t:"quote selectively",k:"collocation",m:"유리한 것만 골라 인용하다",tip:"cherry-pick the data와 같은 뜻입니다. 회의에서 자료를 의심할 때 씁니다."}]},
  {s:"B",en:"For a few hours, yes. For a windless week in winter, not even close, and that's the week the grid actually gets tested.",
   ko:"몇 시간짜리는 그래요. 바람 없는 겨울 한 주는 어림도 없고요. 정작 전력망이 시험받는 건 그 한 주죠.",
   notes:[{t:"not even close",k:"colloquial",m:"어림도 없다, 근처에도 못 간다",tip:"강한 부정. Is it enough? Not even close."},
          {t:"the week the grid gets tested",k:"grammar",m:"전력망이 시험받는 그 주",tip:"시간 명사 뒤에 관계부사 when을 생략한 접촉절입니다. the day I met him 과 같은 구조입니다."}]},
  {s:"A",en:"That's the long-duration problem everyone waves at in the opening slide and nobody comes back to in the appendix.",
   ko:"그게 다들 첫 장표에서 손짓만 하고 부록에서는 아무도 되짚지 않는 장주기 저장 문제군요.",
   notes:[{t:"wave at ~",k:"idiom",m:"~을 대충 언급하고 넘어가다",tip:"hand-wave(얼버무리다)와 같은 계열. 비판적 뉘앙스."},
          {t:"everyone waves at ~ and nobody comes back to",k:"grammar",m:"모두가 언급만 하고 아무도 되짚지 않는",tip:"하나의 접촉절 안에 대조되는 두 절을 넣었습니다. 끝에 전치사 at과 to가 각각 남습니다."}]},
  {s:"B",en:"And even if somebody solved it tomorrow, the lines that would have to carry the power simply wouldn't be there.",
   ko:"그리고 내일 누가 그걸 푼다 해도, 그 전기를 실어 나를 송전선이 아예 없을 거예요.",
   notes:[{t:"even if ~",k:"grammar",m:"설령 ~라 해도",tip:"even though(사실)와 구별. even if는 가정입니다."},
          {t:"the lines that would have to carry ~",k:"grammar",m:"그것을 실어 날라야 할 송전선",tip:"관계절 안에 가정법 would가 들어갔습니다. 아직 존재하지 않는 조건을 명사에 붙일 때 씁니다."}]},
  {s:"A",en:"Transmission. Everyone forgets the boring part, which is usually the part that decides whether any of the rest happens.",
   ko:"송전이요. 다들 지루한 부분을 잊는데, 나머지가 실현될지를 정하는 건 대개 그 부분이죠.",
   notes:[{t:"the boring part",k:"colloquial",m:"재미없지만 중요한 부분",tip:"the unglamorous part도 같은 뜻으로 씁니다."},
          {t:"decides whether any of the rest happens",k:"grammar",m:"나머지가 일어날지 말지를 정하다",tip:"decide 뒤의 whether절은 간접의문문이라 주어+동사 어순입니다. 의문문 어순으로 쓰지 마세요."}]},
  {s:"B",en:"It isn't a technology problem either. It's permitting, land, and local objections from people who won't get the electricity.",
   ko:"기술 문제도 아니에요. 인허가, 부지, 그리고 정작 그 전기를 못 받을 주민들의 반대죠.",
   notes:[{t:"permitting",k:"business",m:"인허가 절차",tip:"permitting delays / permitting process. 인프라 기사 필수어."},
          {t:"local objections",k:"collocation",m:"지역 주민 반대",tip:"완곡하지만 정확한 표현입니다."},
          {t:"people who won't get the electricity",k:"grammar",m:"정작 그 전기를 받지 못할 사람들",tip:"관계절 하나로 갈등의 구조를 설명했습니다. 반대의 이유를 비난 없이 전달하는 화법입니다."}]},
  {s:"A",en:"Which takes a decade, whereas a plant takes three years, so the timelines don't line up for anyone trying to plan capital.",
   ko:"그건 10년이 걸리는데 발전소는 3년이면 되죠. 그래서 자본 계획을 짜는 사람 입장에선 일정이 안 맞아요.",
   notes:[{t:"line up",k:"phrasal",m:"(일정·조건이) 맞아떨어지다",tip:"The dates don't line up. 매우 자주 씁니다."},
          {t:"whereas",k:"grammar",m:"~인 반면에",tip:"대조를 선명하게 만드는 접속사입니다. 보고서에서 but보다 격이 있습니다."}]},
  {s:"B",en:"That mismatch is the whole story, honestly, and it's the part that never makes it into the headline about panel prices.",
   ko:"솔직히 그 불일치가 이야기의 전부예요. 그런데 패널 값 기사 제목에는 절대 안 들어가는 부분이죠.",
   notes:[{t:"mismatch",k:"business",m:"불일치, 미스매치",tip:"a mismatch between supply and demand."},
          {t:"make it into ~",k:"phrasal",m:"~에 들어가다, 실리다",tip:"make it into the final / into the report. '어렵게 자리를 얻다'는 뉘앙스입니다."}]},
  {s:"A",en:"Now bring it back to us. Our furnaces don't run on electricity anyway, so most of what we've just discussed doesn't touch them.",
   ko:"이제 우리 얘기로 돌아오죠. 어차피 우리 용광로는 전기로 돌지 않으니, 방금 논의한 것 대부분은 거기 안 닿아요.",
   notes:[{t:"bring it back to ~",k:"phrasal",m:"논의를 ~로 되돌리다",tip:"회의 진행에 유용. Let me bring it back to the agenda."},
          {t:"run on ~",k:"phrasal",m:"~로 작동하다, ~를 연료로 쓰다",tip:"run on gas / run on batteries."},

  {s:"B",en:"That's the harder half. High-temperature heat is where the easy answers run out and where every roadmap I've read gets vague.",

  {s:"A",en:"Hydrogen keeps coming up in every presentation I sit through, usually on a slide that nobody is asked to defend.",
   ko:"제가 앉아 듣는 발표마다 수소가 계속 나와요. 대개는 아무도 근거를 대라고 하지 않는 장표에요.",

  {s:"B",en:"It's chemically sound. The catch is that clean hydrogen needs cheap, steady power, which is the very thing we've just agreed we don't have.",
   ko:"화학적으로는 타당해요. 함정은 청정 수소가 싸고 안정적인 전기를 필요로 한다는 건데, 방금 우리한테 없다고 합의한 바로 그거죠.",
   notes:[{t:"the catch is ~",k:"idiom",m:"함정은 ~라는 점이다",tip:"What's the catch? = 뭐가 문제죠? 협상에서 자주 씁니다."},

          {t:"the very thing we've just agreed we don't have",k:"grammar",m:"우리에게 없다고 방금 합의한 바로 그것",tip:"관계절 안에 또 절이 들어간 이중 구조입니다. very가 '바로 그'라는 강조를 얹습니다."}]},
  {s:"A",en:"So we're back to the grid. Everything we've talked about routes through the same bottleneck, whatever technology we put at the end of it.",
   ko:"결국 다시 전력망이네요. 끝에 무슨 기술을 붙이든, 우리가 얘기한 모든 게 같은 병목을 지나갑니다.",

  {s:"B",en:"Which is why I'd rather we spend the meeting on power contracts than on slogans that don't survive the first hard question.",

{
 id:"w1d6", day:6, cat:"심리·학습", level:"B2+",
 title:"Why You Forget What You Just Read",
 titleKo:"방금 읽은 걸 잊는 이유 — 기억과 학습의 작동 방식",
 names:{A:"Dan (교육팀)", B:"Mia (인지심리 전공)"},
 brief:[
  "학습 연구에서 가장 반복적으로 확인된 두 가지가 <b>spacing effect(간격 효과)</b>와 <b>retrieval practice(인출 연습)</b>다. 몰아서 보는 것보다 나눠서 보는 것이, 다시 읽는 것보다 <b>기억에서 꺼내 보는 것</b>이 오래간다.",
  "다시 읽기가 인기 있는 이유는 <b>fluency illusion(유창성 착각)</b> 때문이다. 눈에 익어 술술 읽히면 '안다'고 느끼지만, 그 매끄러움은 이해가 아니라 익숙함의 신호일 뿐이다.",
  "그래서 효과적인 학습은 대체로 <b>불편하다</b>. 어렵게 꺼낼수록 기억은 단단해지는데, 이를 <b>desirable difficulty(바람직한 어려움)</b>라고 부른다.",
  "수면은 학습의 마무리 공정에 가깝다. 잠자는 동안 기억이 정리·강화되는 <b>consolidation(공고화)</b>이 일어나므로, 밤을 새워 채워 넣는 방식은 투입 대비 손해가 크다."
 ],
 lines:[
  {s:"A",en:"I read a whole report yesterday, and today I couldn't summarize it to save my life, which is not a feeling I enjoy admitting.",
   ko:"어제 보고서를 통째로 읽었는데 오늘은 죽었다 깨어나도 요약이 안 되더라고요. 인정하기 유쾌한 기분은 아니네요.",
   notes:[{t:"to save my life",k:"idiom",m:"죽었다 깨어나도 (못 하다)",tip:"부정문에서만 씁니다. I can't sing to save my life."},
          {t:"a feeling I enjoy admitting",k:"grammar",m:"인정하기 즐거운 기분",tip:"접촉절 안에 enjoy + -ing이 들어갔습니다. enjoy 뒤에는 to부정사가 오지 않습니다."}]},
  {s:"B",en:"That isn't a memory defect. That's what reading does to anyone who never stops to test whether it actually went in.",
   ko:"그건 기억력 결함이 아니에요. 실제로 들어갔는지 멈춰서 확인하지 않는 사람에게 읽기가 하는 일이 원래 그래요.",
   notes:[{t:"a defect",k:"business",m:"결함",tip:"제조 품질에서 쓰는 단어를 사람에게 은유로 쓴 표현입니다."},
          {t:"stop to test",k:"grammar",m:"확인하려고 멈추다",tip:"stop + to부정사는 '~하려고 멈추다', stop + -ing은 '~하던 것을 멈추다'입니다. 뜻이 정반대이니 주의하세요."}]},
  {s:"A",en:"But it felt easy while I was reading it. Everything made sense on the page, which is why I never thought to check.",
   ko:"그런데 읽을 땐 쉬웠어요. 지면에서는 다 이해가 됐고, 그래서 확인할 생각을 아예 못 한 거죠.",
   notes:[{t:"it felt easy",k:"grammar",m:"쉽게 느껴졌다",tip:"feel + 형용사. It feels wrong. 감각동사 뒤에 부사 아님 주의."},
          {t:", which is why ~",k:"grammar",m:"그래서 ~인 것이다",tip:"앞 절 전체를 받아 결과로 잇습니다. So보다 문장이 매끄럽게 이어집니다."}]},
  {s:"B",en:"That's the trap. Smooth reading feels exactly like understanding, but what you're actually measuring is familiarity with the words.",
   ko:"그게 함정이에요. 매끄럽게 읽히면 이해와 똑같이 느껴지지만, 실제로 재고 있는 건 단어에 대한 익숙함이죠.",
   notes:[{t:"That's the trap.",k:"colloquial",m:"바로 그게 함정이에요",tip:"That's the thing. 계열의 짧은 강조 표현."},
          {t:"what you're actually measuring is ~",k:"grammar",m:"실제로 재고 있는 것은 ~이다",tip:"what절을 주어로 세우는 강조구문입니다. 상대의 착각을 바로잡을 때 강력합니다."},
          {t:"familiarity",k:"business",m:"익숙함",tip:"understanding과 대비시켜 쓰면 논지가 선명해집니다."}]},
  {s:"A",en:"So the fix is to close the file and try to say the thing out loud before I let myself look at it again?",
   ko:"그럼 해결책은 파일을 닫고, 다시 들여다보기 전에 소리 내어 말해 보는 건가요?",
   notes:[{t:"the fix",k:"colloquial",m:"해결책",tip:"solution의 캐주얼한 대체어. a quick fix = 임시방편."},
          {t:"let myself look",k:"grammar",m:"내가 보도록 허락하다",tip:"let + 목적어 + 동사원형. 자기 통제를 말할 때 재귀대명사를 목적어로 씁니다."}]},
  {s:"B",en:"That's the whole trick, and it's annoyingly simple: pull it out of your head instead of putting it back in again.",
   ko:"그게 요령의 전부인데, 짜증날 만큼 단순해요. 다시 집어넣지 말고 머릿속에서 꺼내라는 거죠.",
   notes:[{t:"the trick is ~",k:"idiom",m:"요령은 ~이다",tip:"The trick is to start small."},
          {t:"annoyingly simple",k:"colloquial",m:"짜증날 정도로 단순한",tip:"부사+형용사 조합으로 감정을 싣는 원어민식 표현."},
          {t:"instead of -ing",k:"grammar",m:"~하는 대신에",tip:"전치사 of 뒤라 반드시 동명사입니다. instead of to put이라고 쓰지 않습니다."}]},
  {s:"A",en:"I've heard that, but rereading feels far more productive, because I get through more pages and the pages are what I can count.",
   ko:"들어는 봤는데, 다시 읽는 게 훨씬 생산적으로 느껴져요. 진도가 더 나가고, 셀 수 있는 건 그 페이지뿐이니까요.",
   notes:[{t:"get through",k:"phrasal",m:"(분량을) 해치우다, 끝내다",tip:"I got through half the book."},
          {t:"the pages are what I can count",k:"grammar",m:"셀 수 있는 건 그 페이지다",tip:"what절을 보어로 쓴 형태입니다. 왜 잘못된 지표에 끌리는지를 한 문장으로 설명합니다."}]},
  {s:"B",en:"Pages aren't the unit that matters. What you can retrieve cold, with nothing in front of you, is the only thing that counts.",
   ko:"중요한 단위는 페이지가 아니에요. 앞에 아무것도 없이 맨몸으로 꺼낼 수 있는 것, 그것만이 유효합니다.",
   notes:[{t:"retrieve",k:"business",m:"(기억에서) 인출하다",tip:"retrieval practice = 인출 연습. 학습 연구의 핵심 용어."},
          {t:"cold",k:"colloquial",m:"준비 없이, 맨몸으로",tip:"go in cold = 준비 없이 들어가다. 면접·발표에 씁니다."},
          {t:"the only thing that counts",k:"grammar",m:"유일하게 유효한 것",tip:"count를 '중요하다'로 쓰는 자동사 용법입니다. matter와 바꿔 쓸 수 있습니다."}]},
  {s:"A",en:"And spacing it out really does beat one long session, even for material I'd have to relearn from scratch anyway?",
   ko:"그리고 나눠서 하는 게 정말 몰아서 하는 것보다 낫나요? 어차피 처음부터 다시 배워야 할 내용이라도요?",
   notes:[{t:"space it out",k:"phrasal",m:"간격을 두고 나누다",tip:"space out the sessions. 학습 계획에 그대로 씁니다."},
          {t:"from scratch",k:"idiom",m:"맨 처음부터",tip:"build it from scratch / start from scratch. 아주 자주 쓰입니다."}]},
  {s:"B",en:"By a wide margin, and it's one of the oldest findings we have, which is why it's strange how few people act on it.",
   ko:"큰 차이로요. 게다가 가장 오래된 연구 결과 중 하나인데, 정작 실천하는 사람이 이토록 적다는 게 이상하죠.",
   notes:[{t:"by a wide margin",k:"idiom",m:"큰 차이로",tip:"win by a wide margin. 비교를 강조할 때."},
          {t:"how few people act on it",k:"grammar",m:"실천하는 사람이 얼마나 적은지",tip:"how + 형용사/부사 + 주어 + 동사 어순의 간접의문문입니다. act on ~ = ~대로 실행하다."}]},
  {s:"A",en:"Then why does everyone still cram the night before, including the people who could quote that finding back to you?",
   ko:"그럼 왜 다들 여전히 전날 밤에 몰아서 할까요? 그 연구 결과를 당신에게 되읊을 수 있는 사람들까지요.",
   notes:[{t:"cram",k:"colloquial",m:"벼락치기 하다",tip:"cram for an exam. 명사 cramming으로도 씁니다."},
          {t:"quote it back to you",k:"collocation",m:"그걸 당신에게 그대로 되읊다",tip:"'알면서도 안 한다'를 꼬집는 표현입니다. say it back to me 로도 씁니다."}]},
  {s:"B",en:"Because cramming works just well enough for the exam you have tomorrow, and then it drains away before anyone measures the loss.",
   ko:"벼락치기는 내일 있는 시험까지만 딱 통하고, 아무도 손실을 재기 전에 다 빠져나가 버리니까요.",
   notes:[{t:"just well enough",k:"collocation",m:"딱 될 만큼만",tip:"'충분하지만 겨우'라는 뉘앙스를 짧게 실어 줍니다."},
          {t:"drain away",k:"phrasal",m:"서서히 빠져나가다",tip:"Motivation drained away. 비유적으로도 자주."}]},
  {s:"A",en:"Where does sleep fit into all this? Most people I work with treat it as time they can borrow and pay back later.",
   ko:"이 안에서 수면은 어디에 들어가죠? 제가 같이 일하는 사람 대부분은 잠을 빌렸다가 나중에 갚는 시간으로 취급해요.",
   notes:[{t:"fit into",k:"phrasal",m:"~안에 들어맞다, 어디에 해당하다",tip:"How does this fit into the plan?"},
          {t:"time they can borrow and pay back",k:"grammar",m:"빌렸다가 갚을 수 있는 시간",tip:"접촉절 하나가 동사 두 개를 거느립니다. 금융 비유를 그대로 명사에 붙인 표현입니다."}]},
  {s:"B",en:"It's closer to the final step of the process. What you learned gets filed while you're out, and nothing else does that job.",
   ko:"수면은 오히려 마지막 공정에 가까워요. 자는 동안 배운 게 정리되어 보관되고, 그 일을 대신할 건 아무것도 없죠.",
   notes:[{t:"get filed",k:"idiom",m:"정리되어 보관되다",tip:"file = 서류를 철하다. 기억을 서류 정리에 비유한 표현."},
          {t:"while you're out",k:"colloquial",m:"의식이 없는 동안, 자는 동안",tip:"be out = 곯아떨어지다. He was out in five minutes."}]},
  {s:"A",en:"So pulling an all-nighter is borrowing against the one process that does the filing, which is a trade nobody would take deliberately.",
   ko:"그럼 밤샘은 정리를 담당하는 유일한 공정을 담보로 빚을 내는 거네요. 알고서는 아무도 하지 않을 거래고요.",
   notes:[{t:"pull an all-nighter",k:"idiom",m:"밤을 새우다",tip:"완전한 관용구. 동사 pull에 주의하세요."},
          {t:"borrow against ~",k:"business",m:"~을 담보로 빌리다",tip:"금융 용어를 비유로 쓴 세련된 문장입니다."},
          {t:"a trade nobody would take deliberately",k:"grammar",m:"알고서는 아무도 하지 않을 거래",tip:"접촉절 + 가정법 would입니다. 어리석음을 직접 말하지 않고 명사로 판정합니다."}]},
  {s:"B",en:"Nicely put. And the last piece is that the study method which works best is almost always the one that feels worse.",
   ko:"잘 표현하셨네요. 마지막 조각은, 가장 잘 통하는 공부법이 거의 언제나 더 불편하게 느껴지는 쪽이라는 겁니다.",
   notes:[{t:"Nicely put.",k:"colloquial",m:"표현 좋네요",tip:"Well put.도 같은 뜻. 상대 표현을 칭찬하는 짧은 리액션."},
          {t:"the method which works best is the one that feels worse",k:"grammar",m:"가장 잘 통하는 방법이 더 불편하게 느껴지는 쪽이다",tip:"관계절 두 개를 주어와 보어에 각각 달아 대구를 만들었습니다. 역설을 담기에 좋은 틀입니다."}]},
  {s:"A",en:"That's a hard sell to a room full of busy adults who already believe they know how they learn best.",
   ko:"자기가 어떻게 배우는지 안다고 이미 믿는 바쁜 성인들 앞에서 그건 설득하기 어려운 얘기죠.",
   notes:[{t:"a hard sell",k:"idiom",m:"설득하기 어려운 것",tip:"That's a hard sell to management. 명사구로 씁니다."},
          {t:"believe they know how they learn best",k:"grammar",m:"자신이 어떻게 배우는지 안다고 믿다",tip:"절 안에 또 간접의문문이 들어간 삼중 구조입니다. how 뒤 어순이 주어+동사임을 확인하세요."}]},
  {s:"B",en:"Then don't sell the discomfort. Sell the fact that they'll still have it in March, when everyone who crammed has lost it.",
   ko:"그럼 불편함을 팔지 마세요. 벼락치기한 사람들이 다 잊은 3월에도 여전히 갖고 있을 거라는 사실을 파세요.",
   notes:[{t:"sell the fact that ~",k:"idiom",m:"~라는 점을 내세워 설득하다",tip:"sell = 설득하다. 앞선 sell it upstairs와 같은 계열."},
          {t:"in March, when ~",k:"grammar",m:"3월이 되면 그때는 ~한다",tip:"관계부사 when의 계속적 용법입니다. 콤마 뒤에서 시점을 설명으로 풀어 줍니다."}]},
  {s:"A",en:"Fine. Twenty minutes a day, out loud, and no rereading anything I haven't first tried to say from memory.",
   ko:"알겠어요. 하루 20분, 소리 내어, 그리고 기억으로 먼저 말해 보지 않은 건 다시 읽지 않기.",
   notes:[{t:"out loud",k:"collocation",m:"소리 내어",tip:"read out loud / say it out loud. aloud보다 구어에서 흔합니다."},
          {t:"anything I haven't first tried to say",k:"grammar",m:"먼저 말해 보려 하지 않은 그 무엇도",tip:"부정 + 접촉절 + 현재완료의 조합입니다. 규칙을 스스로에게 부과하는 문장 형태입니다."}]},
  {s:"B",en:"And test yourself before you look, not after. That single habit does most of the work that the other advice only promises.",
   ko:"그리고 보고 나서가 아니라 보기 전에 스스로 시험하세요. 다른 조언들이 약속만 하는 일을 그 습관 하나가 대부분 해냅니다.",
   notes:[{t:"does most of the work",k:"idiom",m:"대부분의 효과를 낸다",tip:"One change does most of the work. 강조에 좋습니다."},
          {t:"the work that the other advice only promises",k:"grammar",m:"다른 조언들은 약속만 하는 그 일",tip:"관계절 안의 only가 '말만 하고 해내지는 못한다'는 비판을 실어 줍니다."}]}

{
 id:"w1d7", day:7, cat:"문화·트렌드", level:"B2+",
 title:"Where Work Happens Now",
 titleKo:"일은 이제 어디서 일어나는가 — 하이브리드 근무와 도시",
 names:{A:"Sofia (HR)", B:"Ken (현업)"},
 brief:[
  "하이브리드 근무 논쟁이 갈리는 이유는 업무의 성격이 다르기 때문이다. <b>집중 업무(deep work)</b>는 원격이 유리하고, <b>조율·신뢰 형성</b>은 대면이 유리하다는 것이 대체적인 관찰이다.",
  "가장 자주 지적되는 손실은 <b>weak ties(약한 유대)</b>다. 다른 팀 사람과 우연히 마주치는 접점이 사라지면, 정보는 부서 안에서만 돌게 된다.",
  "재택은 도시 구조도 바꿨다. 도심 오피스 상권의 평일 수요가 줄고 주거지 인근 상권이 살아나는 변화가 여러 도시에서 관찰된다.",
  "실무의 결론은 '주 며칠'이 아니라 <b>어떤 일을 위해 모이는가</b>이다. 출근한 날에 각자 헤드폰을 끼고 화상회의만 한다면, 이동 시간만 지불한 셈이 된다."
 ],
 lines:[
  {s:"A",en:"Leadership wants everyone back four days a week, and I'm not sure that's the question we should be arguing about at all.",
   ko:"경영진은 주 4일 출근을 원하는데, 저는 우리가 다퉈야 할 질문이 그게 맞는지조차 모르겠어요.",
   notes:[{t:"back four days a week",k:"collocation",m:"주 4일 사무실 복귀",tip:"return-to-office(RTO)라는 약어도 실무에서 흔합니다."},
          {t:"the question we should be arguing about",k:"grammar",m:"우리가 다퉈야 할 그 질문",tip:"접촉절 끝에 전치사 about이 남습니다. 진행형 조동사와 붙여 '지금 다투는 중'을 나타냈습니다."}]},
  {s:"B",en:"What would the real question be, then, if it isn't the number of days that people are in the building?",
   ko:"그럼 진짜 질문은 뭔가요? 사람들이 건물에 있는 날수가 아니라면요.",

{
 id:"w2d1", day:8, cat:"품질·리스크", level:"B2+",
 title:"The Recall Nobody Wants to Own",
 titleKo:"아무도 떠안기 싫은 리콜 — 결함과 책임의 경계",
 names:{A:"Grace (품질보증)", B:"Diego (구매·공급망)"},
 brief:[
  "제조 현장에서 결함이 나오면 가장 먼저 정해지는 것은 책임이 아니라 순서다. <b>봉쇄(containment)</b>가 먼저고 <b>시정(corrective action)</b>이 그다음이며, 책임 배분은 마지막이다. 원인을 다 밝히기 전에도 확산은 멈춰야 하기 때문이다.",
  "책임을 가르는 실질적 기준은 <b>입증책임(the burden of proof)</b>이 어디에 놓이느냐다. 공급사는 도면과 규격을 들고 오고, 완성품 업체는 실제 사용 조건을 든다. 계약서의 <b>책임한도(liability cap)</b>가 이 다툼의 상한을 미리 정해 둔다.",
  "리콜의 비용 구조는 <b>확실한 비용 대 불확실한 비용</b>의 대결이다. 지금 회수하면 금액이 확정되고, 미루면 확률은 낮지만 손실이 큰 <b>꼬리위험(tail risk)</b>이 남는다. 둘을 같은 저울에 올리는 순간 판단이 쉬워진다.",
  "그래서 실무에서 진짜로 다투는 것은 「리콜을 하느냐」가 아니라 <b>범위(scope)</b>다. 어느 로트까지, 어느 일련번호까지 포함할 것인가. 이 선을 예산이 아니라 <b>증거</b>로 그어야 나중에 방어할 수 있다."
 ],

          {t:"frame A as B",k:"business",m:"A를 B인 것처럼 규정하다",tip:"프레임을 씌운다는 뜻. Don't frame this as a failure. 논쟁에서 상대의 전제를 걷어낼 때 씁니다."},

  {s:"A",en:"I'm not assigning blame. I'm saying the burden of proof is going to land on whoever specified the tolerance, which was us.",
   ko:"책임을 떠넘기는 게 아니에요. 입증책임이 공차를 지정한 쪽에 떨어질 거라는 말이고, 그게 우리라는 겁니다.",
   notes:[{t:"the burden of proof",k:"business",m:"입증책임",tip:"The burden of proof is on the supplier. 계약·품질 회의의 핵심 단어입니다."},
          {t:"whoever specified ~, which was us",k:"grammar",m:"~을 지정한 사람이 누구든, 그게 우리였다",tip:"복합관계대명사로 열어 두고 which로 정답을 밝히는 2단 구성입니다. 자기 책임을 인정하는 세련된 방식입니다."},
          {t:"land on ~",k:"phrasal",m:"(부담이) ~에게 떨어지다",tip:"The cost landed on our division. 의도치 않게 떠안게 됐다는 뉘앙스."}]},
  {s:"B",en:"It always does. The supplier will point at the drawing we sent them, and we'll be on the hook for a batch we never made.",

          {t:"point at ~",k:"phrasal",m:"~을 (책임 근거로) 들이대다",tip:"point to the contract / point at the drawing. 문서를 근거로 삼는다는 뜻으로 확장됩니다."}]},
  {s:"A",en:"Which is why we contain first and argue later: stop shipments, quarantine the lot, and have the argument once we know what we're arguing about.",
   ko:"그래서 봉쇄가 먼저고 논쟁이 나중인 겁니다. 출하 중단, 로트 격리, 그리고 무엇을 두고 다투는지 알게 된 뒤에 다투는 거죠.",
   notes:[{t:"Which is why ~",k:"grammar",m:"바로 그래서 ~인 겁니다",tip:"앞 문장 전체를 받아 결론으로 잇는 연결어. That's why보다 논증적으로 들립니다."},
          {t:"contain",k:"business",m:"(확산을) 봉쇄하다",tip:"품질 용어로 containment action = 봉쇄 조치. 원인 규명 전에 하는 응급 처치입니다."},

  {s:"B",en:"Containment I can live with. A public recall is a different animal entirely, and it's the one that ends up in the trade press.",
   ko:"봉쇄까지는 받아들일 수 있어요. 공개 리콜은 완전히 다른 이야기고, 업계지에 실리는 건 그쪽이죠.",

          {t:"a different animal",k:"idiom",m:"성격이 전혀 다른 것",tip:"That's a different animal altogether. 규모나 종류가 다르다는 뜻으로 씁니다."},
          {t:"the one that ends up in ~",k:"grammar",m:"결국 ~에 실리게 되는 쪽",tip:"end up in ~ = 결국 ~에 이르다. the one that ~ 으로 둘 중 하나를 지목합니다."}]},
  {s:"A",en:"Agreed, but if we sit on this and it surfaces through a customer rather than through us, it comes back to bite us twice.",

          {t:"come back to bite us",k:"idiom",m:"나중에 부메랑으로 돌아오다",tip:"That shortcut will come back to bite us. 미룬 결정의 대가를 말할 때."},
          {t:"through A rather than through B",k:"grammar",m:"B가 아니라 A를 통해",tip:"전치사를 두 번 반복해 대비를 또렷하게 만들었습니다. 생략하면 문장이 흐려집니다."}]},
  {s:"B",en:"You're assuming it surfaces at all. Most of the parts in that batch will never see a load anywhere near what we tested for.",

  {s:"A",en:"That's a gamble on tail risk. The odds are low, but the downside is large enough to swallow every saving we'd make by waiting.",

  {s:"B",en:"Fair. Still, somebody in this room has to weigh a certain cost against an uncertain one, and that person signs either way.",

  {s:"A",en:"Then let's price both of them honestly, instead of dressing the cheaper option up as prudence and hoping nobody checks the reasoning.",

          {t:"instead of -ing and -ing",k:"grammar",m:"~하고 ~하는 대신에",tip:"전치사 뒤 동명사 두 개를 and로 이었습니다. 두 번째에 of를 다시 붙이지 않습니다."}]},
  {s:"B",en:"Careful. That cuts the other way, because erring on the side of caution isn't free either once you count the lines we'd stop.",

  {s:"A",en:"No, and I'd never pretend it is. But a quiet field fix buys us credibility that we can't purchase any other way.",

          {t:"credibility that we can't purchase any other way",k:"grammar",m:"다른 방법으로는 살 수 없는 신뢰",tip:"buy와 purchase를 한 문장에 나란히 써서 비유를 끝까지 밀고 갔습니다. 영어다운 문장 운용입니다."}]},
  {s:"B",en:"A silent recall, you mean. Regulators have a name for that, and it's the sort of thing that turns a defect into a case.",

  {s:"A",en:"Then we notify properly. My point was never whether we own it; my point is how wide the scope has to be.",

 names:{A:"Lena (환경·규제 대응)", B:"Hugo (수출영업)"},
 brief:[
  "배출에 값이 매겨지면 원가 구조가 바뀐다. 지금까지 원가는 원료와 에너지였지만, <b>탄소 가격(carbon pricing)</b>이 붙는 순간 배출량 자체가 비용 항목이 된다. 같은 제품, 같은 공정이라도 어디서 어떻게 만들었는지가 값을 가른다.",
  "국경에서 조정이 일어나는 이유는 <b>탄소 누출(carbon leakage)</b> 때문이다. 규제가 강한 나라의 공장이 규제가 약한 나라로 옮겨 가면 배출은 그대로인 채 산업만 빠져나간다. 그래서 수입품에도 같은 값을 물려 <b>공정한 경쟁 조건(a level playing field)</b>을 맞추려 한다.",
  "실무의 난점은 규제가 아니라 <b>측정</b>이다. 한 톤에 들어 있는 배출량(embedded emissions)을 어떻게 셈하느냐에 따라 누가 얼마를 내는지가 달라진다. 그래서 다툼은 늘 방법론에서 벌어지고, <b>검증(verification)</b>을 거친 숫자만 값을 인정받는다.",
  "영업 쪽에서 갈리는 것은 <b>전가(pass-through)</b>다. 늘어난 비용을 가격에 얹을 수 있는 고객이 있고, 얹는 순간 떠나는 고객이 있다. 검증된 데이터가 있으면 <b>친환경 프리미엄(green premium)</b>이 붙지만, 없으면 그냥 값만 오른 제품이 된다."
 ],
 lines:[
  {s:"A",en:"Once emissions carry a price at the border, our cost base stops being just steel and energy and starts including how we made it.",
   ko:"국경에서 배출에 값이 붙는 순간, 우리 원가는 철과 에너지만이 아니라 어떻게 만들었느냐까지 포함하게 됩니다.",
   notes:[{t:"carry a price",k:"collocation",m:"값이 매겨지다, 대가가 따르다",tip:"Everything carries a price now. carry a risk / carry a penalty 로도 확장됩니다."},
          {t:"cost base",k:"business",m:"원가 구조, 비용 기반",tip:"lower our cost base = 원가 구조를 낮추다. 경영진 보고의 단골 표현입니다."},
          {t:"stops being A and starts including B",k:"grammar",m:"A이기를 멈추고 B를 포함하기 시작하다",tip:"stop과 start 뒤에 나란히 동명사를 붙여 변화를 한 문장에 담았습니다."}]},
  {s:"B",en:"In theory. In practice, nobody can agree on how to measure what's embedded in a ton, which is where every negotiation stalls.",
   ko:"이론상은요. 현실에선 한 톤에 뭐가 들어 있는지 재는 방법부터 합의가 안 되고, 협상은 늘 거기서 멈춥니다.",
   notes:[{t:"In theory. In practice, ~",k:"idiom",m:"이론상은 그렇고, 현실은 ~",tip:"두 문장으로 끊어 던지는 반박 리듬입니다. 토론에서 아주 강하게 들립니다."},
          {t:"embedded",k:"business",m:"(제품 안에) 내재된",tip:"embedded emissions / embedded cost. 겉으로 안 보이지만 안에 들어 있다는 뜻."},
          {t:"which is where ~ stalls",k:"grammar",m:"바로 거기서 ~이 멈춘다",tip:"앞 절을 which로 받고 관계부사 where로 '지점'을 짚습니다. 병목을 지목하는 세련된 형태입니다."}]},
  {s:"A",en:"That's the whole fight. Measurement decides who pays, so everyone argues about method while pretending to argue about principle.",
   ko:"싸움의 전부가 거기예요. 측정이 누가 낼지를 정하니, 다들 원칙을 두고 다투는 척하면서 방법론을 두고 다투는 거죠.",
   notes:[{t:"That's the whole fight.",k:"colloquial",m:"바로 그 지점이 쟁점의 전부입니다",tip:"That's the whole point. 의 변형. 핵심을 한마디로 못 박을 때 씁니다."},
          {t:"while pretending to ~",k:"grammar",m:"~하는 척하면서",tip:"분사구문입니다. 주어가 같으므로 while 뒤에 주어를 다시 쓰지 않습니다."}]},
  {s:"B",en:"And meanwhile my customers want a number today, not a methodology paper next year that three consultants will disagree with anyway.",
   ko:"그러는 동안 제 고객들은 오늘 숫자를 원해요. 어차피 컨설턴트 셋이 서로 반대할 내년 방법론 보고서가 아니라요.",
   notes:[{t:"And meanwhile ~",k:"colloquial",m:"그러는 사이에 (현실은)",tip:"이상론을 현실로 끌어내릴 때 씁니다. 영업이 기획을 반박하는 전형적인 시작입니다."},
          {t:"a paper that consultants will disagree with",k:"grammar",m:"컨설턴트들이 반대할 보고서",tip:"관계절 끝에 전치사 with가 남습니다. disagree with ~ 의 with가 사라지지 않도록 주의하세요."}]},
  {s:"A",en:"Give them a range and the assumptions behind it. A precise number that turns out to be wrong costs more than an honest range.",
   ko:"구간으로 주고 그 뒤의 전제도 밝히세요. 정밀했다가 틀린 숫자가 정직한 구간보다 비싸게 먹힙니다.",
   notes:[{t:"the assumptions behind it",k:"business",m:"그 숫자가 딛고 선 전제",tip:"What are the assumptions behind this? 는 숫자를 검증할 때 가장 좋은 질문입니다."},
          {t:"a number that turns out to be wrong",k:"grammar",m:"나중에 틀린 것으로 드러나는 숫자",tip:"turn out to be ~ = 결국 ~로 밝혀지다. 관계절 안에 넣으면 위험을 명사에 붙일 수 있습니다."}]},
  {s:"B",en:"Try selling a range to a buyer whose own boss wants one figure. They read uncertainty as risk and price it against us.",
   ko:"자기 상사가 숫자 하나를 원하는 구매자한테 구간을 한번 팔아 보세요. 불확실성을 위험으로 읽고 우리한테 불리하게 값을 매깁니다.",
   notes:[{t:"Try ~ing.",k:"colloquial",m:"(비꼬듯) 그거 한번 해 보시죠",tip:"Try explaining that to a customer. 실현 불가능함을 지적하는 반어법입니다."},
          {t:"a buyer whose own boss wants ~",k:"grammar",m:"자기 상사가 ~을 원하는 구매자",tip:"소유격 관계대명사 whose입니다. 사람의 사정을 한 문장에 접어 넣을 때 매우 유용합니다."},
          {t:"price it against us",k:"business",m:"우리에게 불리하게 가격에 반영하다",tip:"price A in(가격에 반영하다) / price A against B(불리하게 매기다) 를 짝으로 외우세요."}]},
  {s:"A",en:"Then we verify early and get certified, because verification is what turns a claim anyone can make into a discount only we can offer.",
   ko:"그럼 일찍 검증받고 인증까지 받죠. 누구나 할 수 있는 주장을 우리만 줄 수 있는 할인으로 바꾸는 게 검증이니까요.",
   notes:[{t:"turn A into B",k:"phrasal",m:"A를 B로 바꾸다",tip:"What turns a claim into evidence? 처럼 씁니다. 문장을 힘 있게 만드는 골격입니다."},
          {t:"a claim anyone can make / a discount only we can offer",k:"grammar",m:"누구나 할 수 있는 주장 / 우리만 줄 수 있는 할인",tip:"같은 접촉절 구조를 두 번 써서 대구를 만들었습니다. 차별성을 설명하는 데 최적입니다."}]},
  {s:"B",en:"Certification costs money we'd have to pass through, and the thin-margin customers who make up half our volume will simply walk.",
   ko:"인증에는 우리가 전가해야 할 돈이 들고, 물량의 절반을 차지하는 마진 얇은 고객들은 그냥 떠날 겁니다.",
   notes:[{t:"pass ~ through",k:"business",m:"(비용을) 가격에 전가하다",tip:"pass the cost through to customers. 명사형 pass-through도 그대로 씁니다."},
          {t:"customers who make up half our volume",k:"grammar",m:"우리 물량의 절반을 차지하는 고객들",tip:"make up = 구성하다, 차지하다. 관계절로 비중을 밝혀 반박의 무게를 실었습니다."},
          {t:"walk",k:"colloquial",m:"(거래를 접고) 떠나다",tip:"If we raise it, they'll walk. walk away from the deal의 줄임으로 쓰입니다."}]},
  {s:"A",en:"Some will. Others will pay a premium the moment their own reporting depends on numbers that somebody has actually audited.",
   ko:"일부는 떠나겠죠. 하지만 자기네 보고가 누군가 실제로 감사한 숫자에 걸리는 순간, 웃돈을 낼 고객도 있습니다.",
   notes:[{t:"pay a premium",k:"collocation",m:"웃돈을 지불하다",tip:"pay a premium for quality. 반대는 at a discount. 한 세트로 외우세요."},
          {t:"numbers that somebody has actually audited",k:"grammar",m:"누군가 실제로 감사한 숫자",tip:"현재완료 관계절입니다. 검증 여부가 가치를 가른다는 논지를 명사 안에 넣었습니다."}]},
  {s:"B",en:"You're betting their regulators bite before ours do, which is a big assumption to build a capital plan on.",
   ko:"그쪽 규제가 우리 쪽보다 먼저 조여든다는 데 거시는 거죠. 자본 계획을 얹기엔 큰 가정입니다.",
   notes:[{t:"bite",k:"idiom",m:"(규제·정책이) 실제로 아프게 작용하다",tip:"When do the rules start to bite? 발효는 됐지만 아직 체감되지 않을 때 씁니다."},
          {t:"a big assumption to build a plan on",k:"grammar",m:"계획을 얹기에는 큰 가정",tip:"명사 + to부정사 + 문미 전치사 on 구조입니다. build A on B의 on이 그대로 남습니다."}]},
  {s:"A",en:"It's not a bet on timing. It's a bet that a direction which every major buyer is already moving in doesn't reverse.",
   ko:"시점에 거는 게 아니에요. 주요 구매자들이 이미 그쪽으로 움직이고 있는 방향이 되돌아가지 않는다는 데 거는 겁니다.",
   notes:[{t:"It's not A. It's B.",k:"grammar",m:"A가 아니라 B입니다",tip:"상대의 규정을 고쳐 잡는 대조 골격. 짧게 끊어 말할수록 힘이 실립니다."},
          {t:"a direction which everyone is moving in",k:"grammar",m:"모두가 그쪽으로 움직이고 있는 방향",tip:"관계절 끝에 전치사 in이 남습니다. move in a direction의 in을 빠뜨리지 마세요."}]},
  {s:"B",en:"Fair enough. Still, if we move first we carry the cost alone for years while everyone else watches to see what it does to us.",
   ko:"일리 있어요. 그래도 먼저 움직이면 몇 년을 혼자 비용을 짊어지고, 나머지는 우리가 어떻게 되나 구경할 겁니다.",
   notes:[{t:"Fair enough. Still, ~",k:"idiom",m:"일리는 있습니다. 그래도 ~",tip:"인정하고 반박으로 넘어가는 다리. 토론에서 가장 자주 쓰는 전환입니다."},
          {t:"move first",k:"business",m:"선제적으로 나서다",tip:"first mover advantage와 짝. move first / wait and see 가 대립 구도를 만듭니다."},
          {t:"watch to see what it does to us",k:"grammar",m:"그게 우리한테 어떤 결과를 내는지 지켜보다",tip:"watch to see + 의문사절 구조입니다. 관망하는 태도를 정확히 묘사합니다."}]},
  {s:"A",en:"And if we move last we buy the same equipment at panic prices alongside everyone who waited exactly as long as we did.",
   ko:"마지막에 움직이면, 우리만큼 기다린 사람들과 나란히 똑같은 설비를 값이 치솟은 상태로 사게 되죠.",
   notes:[{t:"at panic prices",k:"collocation",m:"수요가 몰려 값이 치솟은 상태로",tip:"buy at panic prices / sell in a panic. 시장 심리를 한 단어로 표현합니다."},
          {t:"everyone who waited exactly as long as we did",k:"grammar",m:"우리만큼 딱 그만큼 기다린 모든 사람",tip:"as long as + 주어 + did 구조입니다. 끝의 did가 waited의 반복을 대신합니다."}]},
  {s:"B",en:"That argument holds water. I just don't want us dressing up a cost as strategy in a deck that somebody quotes back at us later.",
   ko:"그 논리는 설득력이 있네요. 다만 나중에 누가 그대로 되읊을 장표에서 비용을 전략인 척 포장하는 건 원치 않습니다.",
   notes:[{t:"hold water",k:"idiom",m:"(논리가) 말이 되다, 설득력이 있다",tip:"That doesn't hold water. 부정문으로 훨씬 자주 씁니다."},
          {t:"dress up A as B",k:"idiom",m:"A를 B인 것처럼 포장하다",tip:"8일차에도 나온 표현입니다. 비판할 때 반복해서 쓰게 됩니다."},
          {t:"a deck somebody quotes back at us",k:"grammar",m:"누군가 나중에 그대로 들이밀 장표",tip:"quote it back at someone = 남의 말을 그대로 인용해 되받다. 회의에서 흔한 위험입니다."}]},
  {s:"A",en:"Then let's be blunt about it. Part of this spend is compliance we can't avoid, and part is positioning we're choosing to buy.",
   ko:"그럼 솔직하게 말하죠. 이 지출의 일부는 피할 수 없는 규제 대응이고, 일부는 우리가 사기로 선택한 포지셔닝입니다.",
   notes:[{t:"be blunt about it",k:"idiom",m:"에두르지 않고 솔직히 말하다",tip:"Let me be blunt. 로 문장을 열면 '돌직구 갑니다'라는 신호가 됩니다."},
          {t:"compliance we can't avoid / positioning we're choosing to buy",k:"grammar",m:"피할 수 없는 규제 대응 / 사기로 선택한 포지셔닝",tip:"같은 접촉절 구조로 두 항목을 나눴습니다. 예산을 정직하게 쪼개 보이는 화법입니다."}]},
  {s:"B",en:"I can sell that. What I can't sell is a green premium with nothing behind it except a logo and a promise.",
   ko:"그건 팔 수 있어요. 못 파는 건 로고와 약속 말고는 뒷받침이 없는 친환경 프리미엄입니다.",
   notes:[{t:"I can sell that.",k:"idiom",m:"그 정도면 (고객·윗선을) 설득할 수 있습니다",tip:"sell = 설득하다. sell it upstairs / sell it internally 로 확장됩니다."},
          {t:"What I can't sell is ~",k:"grammar",m:"내가 못 파는 것은 ~이다",tip:"what절을 주어로 세운 강조구문입니다. 앞 문장과 대구를 이루며 조건을 분명히 합니다."},
          {t:"with nothing behind it",k:"colloquial",m:"뒷받침할 근거가 없는",tip:"a promise with nothing behind it. 실체 없음을 지적하는 짧은 꼬리표입니다."}]},
  {s:"A",en:"Nobody's asking you to. The premium only sticks if the verified data behind it survives the first customer who audits us.",
   ko:"아무도 그러라고 안 합니다. 프리미엄은 우리를 감사하는 첫 고객 앞에서 그 데이터가 버텨야만 유지돼요.",
   notes:[{t:"stick",k:"idiom",m:"(가격·주장이) 자리를 잡고 유지되다",tip:"The price increase didn't stick. 올렸다가 도로 내렸다는 뜻이 됩니다."},
          {t:"survives the first customer who audits us",k:"grammar",m:"우리를 감사하는 첫 고객 앞에서 버티다",tip:"survive를 '견뎌 내다'로 쓰는 용법입니다. 뒤에 사람이 목적어로 올 수 있다는 점이 포인트입니다."}]},
  {s:"B",en:"Then get me the data early enough to write it into next year's contracts, because after signing it becomes somebody else's problem.",
   ko:"그럼 내년 계약서에 넣을 수 있을 만큼 일찍 데이터를 주세요. 서명하고 나면 그건 다른 사람 문제가 되니까요.",
   notes:[{t:"early enough to ~",k:"grammar",m:"~할 수 있을 만큼 충분히 일찍",tip:"형용사 + enough to 구조. 마감을 압박할 때 부드럽지만 분명합니다."},
          {t:"write it into ~",k:"phrasal",m:"~에 조항으로 넣다",tip:"write it into the contract / into the spec. 구두 합의를 문서로 못 박는다는 뜻."}]},
  {s:"A",en:"Deal. And we should hedge by locking in the low-emission route for the accounts whose own targets depend on ours.",
   ko:"좋습니다. 그리고 자기네 목표가 우리 것에 걸려 있는 거래처부터 저배출 공정을 확보해 두는 식으로 헤지하죠.",
   notes:[{t:"hedge",k:"business",m:"위험을 나눠 걸다",tip:"hedge our bets = 한쪽에 다 걸지 않다. 전략 회의의 필수 동사입니다."},
          {t:"lock in ~",k:"phrasal",m:"~을 미리 확정해 두다",tip:"lock in the price / the capacity. 나중에 바뀌지 않게 묶어 둔다는 뜻입니다."},
          {t:"accounts whose own targets depend on ours",k:"grammar",m:"자기네 목표가 우리 것에 달린 거래처",tip:"소유격 관계대명사 whose로 이해관계의 사슬을 한 문장에 담았습니다."}]},
  {s:"B",en:"That works. Bite the bullet where it counts, and let the rest follow the market once somebody else has paid for the learning.",
   ko:"괜찮네요. 중요한 데서는 감수하고, 나머지는 누가 학습 비용을 대신 치른 뒤에 시장을 따라가게 두죠.",
   notes:[{t:"bite the bullet",k:"idiom",m:"싫지만 감수하고 실행하다",tip:"We had to bite the bullet and raise prices. 통째로 외우는 표현입니다."},
          {t:"where it counts",k:"idiom",m:"정말 중요한 곳에서는",tip:"Spend where it counts. 선택과 집중을 한마디로 표현합니다."},
          {t:"pay for the learning",k:"collocation",m:"시행착오 비용을 치르다",tip:"먼저 움직인 쪽이 치르는 값을 뜻합니다. learning curve와 함께 알아 두세요."}]}

 keys:[

{
 id:"w2d3", day:10, cat:"인구·노동", level:"B2+",
 title:"The Shift Nobody Can Fill",
 titleKo:"채울 수 없는 교대조 — 고령화와 현장의 기술 전수",
 names:{A:"Ines (인사)", B:"Karl (제조 현장 반장)"},
 brief:[
  "숙련 인력의 은퇴는 인원 문제로 보이지만 실제로는 <b>지식 문제</b>다. 사람이 나가면 자리는 채울 수 있어도, 그 사람 머릿속에만 있던 판단은 함께 나간다. 이것을 <b>암묵지(tacit knowledge)</b>라고 부른다.",
  "암묵지가 어려운 이유는 <b>말로 옮겨지지 않기 때문</b>이다. 소리로 이상을 알아채고, 손끝으로 온도를 가늠하는 판단은 매뉴얼에 담기지 않는다. 그래서 전수는 문서가 아니라 <b>같이 서 있는 시간</b>으로만 일어난다.",
  "현장이 이 문제를 미루는 방식은 대개 <b>초과근무</b>다. 당장은 돌아가지만 격차를 감출 뿐 좁히지는 못한다. 이런 임시 대응을 <b>stopgap</b>이라 하고, 반복되면 은퇴가 몰리는 시점에 한꺼번에 터진다.",
  "자동화는 이 문제의 해답이면서 동시에 함정이다. 기계가 공정을 대신해도 <b>결과가 이상할 때 알아채는 판단</b>은 사람에게 남는다. 그래서 채용과 훈련의 기준이 「손」에서 「판단」으로 옮겨 간다."
 ],
 lines:[
  {s:"A",en:"Three of your senior operators retire within a year, and we have nobody shadowing them who could take a shift alone tomorrow.",
   ko:"반장님 쪽 숙련 오퍼레이터 세 분이 1년 안에 은퇴하는데, 내일 혼자 교대를 설 수 있을 만큼 붙어 배우는 사람이 없어요.",
   notes:[{t:"shadow (someone)",k:"business",m:"옆에 붙어 따라다니며 배우다",tip:"job shadowing = 현장 밀착 학습. 명사로도 동사로도 씁니다."},
          {t:"nobody shadowing them who could ~",k:"grammar",m:"~할 수 있을 만큼 붙어 배우는 사람이 아무도 없다",tip:"현재분사와 관계절이 같은 명사에 이어 붙었습니다. 조건을 겹쳐 놓아 부족함을 정확히 규정합니다."}]},
  {s:"B",en:"You can't shadow forty years of feel in twelve months, and anyone who tells you otherwise has never stood on the floor.",

   notes:[{t:"feel",k:"colloquial",m:"(설명 못 하는) 감각, 손맛",tip:"He has a feel for the machine. 명사로 쓰면 경험에서 온 직관을 뜻합니다."},

  {s:"A",en:"I know. But if we do nothing, that knowledge walks out the door with them and there's no version of it left behind.",

   notes:[{t:"walk out the door",k:"idiom",m:"(사람과 함께 지식·고객이) 빠져나가다",tip:"Our best accounts walked out the door with him. 퇴사 리스크를 말할 때의 정석입니다."},
          {t:"there's no version of it left behind",k:"grammar",m:"남겨진 판본이 하나도 없다",tip:"과거분사 left가 명사를 뒤에서 꾸밉니다. leave behind = 남겨 두다."}]},
  {s:"B",en:"It already is. We papered over the last two retirements with overtime and luck, neither of which is a plan I'd write down.",
   ko:"이미 그러고 있어요. 지난 두 번의 은퇴는 초과근무와 운으로 덮었는데, 둘 다 제가 문서로 쓸 만한 계획은 아니죠.",
   notes:[{t:"paper over ~",k:"phrasal",m:"~을 임시로 덮어 감추다",tip:"paper over the cracks = 균열을 벽지로 덮다. 근본 해결이 아님을 지적합니다."},

  {s:"A",en:"Overtime is a stopgap. It hides the gap from anyone reading the report instead of closing it on the floor.",
   ko:"초과근무는 임시방편이에요. 현장에서 격차를 좁히는 게 아니라, 보고서 읽는 사람 눈에서 가리는 거죠.",
   notes:[{t:"a stopgap",k:"business",m:"임시방편, 땜질 처방",tip:"a stopgap measure / a stopgap solution. band-aid solution과 같은 뜻입니다."},
          {t:"close the gap",k:"collocation",m:"격차를 좁히다",tip:"close/narrow/widen the gap 세트로 외우세요. 실적 보고에 매일 나옵니다."},
          {t:"hide A from B instead of -ing",k:"grammar",m:"~하는 대신 A를 B에게서 감추다",tip:"전치사 from과 instead of가 한 문장에 들어갔습니다. 두 행위를 대비시키는 구조입니다."}]},
  {s:"B",en:"Then give me apprentices who stay. The last three picked it up quickly and left for shifts that didn't start at five in the morning.",
   ko:"그럼 남아 있을 견습생을 주세요. 지난 세 명은 빨리 익히고는 새벽 다섯 시에 시작하지 않는 교대조로 떠났어요.",
   notes:[{t:"pick it up",k:"phrasal",m:"(기술을) 어깨너머로 익히다",tip:"He picked it up on the job. 정식 교육 없이 배웠다는 뜻으로 아주 자주 씁니다."},
          {t:"shifts that didn't start at five",k:"grammar",m:"새벽 다섯 시에 시작하지 않는 교대조",tip:"관계절로 이직 사유를 구체적으로 밝혔습니다. 불평을 사실로 바꾸는 화법입니다."}]},
  {s:"A",en:"That's a retention problem, and I'll own it. But pay alone won't fix a pipeline that has been thin for five years.",

  {s:"B",en:"Money helps more than you think when the work is hot, loud, and scheduled at hours that make a family life awkward.",

  {s:"A",en:"It does, up to a point. Past that, people leave because nobody ever taught them properly and they got tired of guessing.",

  {s:"A",en:"That's exactly the problem — tacit knowledge that nobody ever wrote down because writing it down was never anyone's job.",

  {s:"B",en:"Fine. Give me protected time on the schedule for it, not another folder that nobody opens after the first week.",

  {s:"B",en:"Two is a lot. One learns while the other watches the first one make the mistakes that nobody wants repeated.",

let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const f = VOICES.filter(x=>/female|zira|aria|jenny|samantha|karen|libby|sonia/i.test(x.name));
    const m = VOICES.filter(x=>/male|david|guy|ryan|daniel|alex|mark/i.test(x.name));
    v = who==="B" ? (m[0]||VOICES[1]||VOICES[0]) : (f[0]||VOICES[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.05;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].en, items[i].s, rate, ()=>{ i++; setTimeout(step, 260); });
  })();
}

/* ---------- 청크 자동 분할 ---------- */
function chunkify(s){
  const sents = (s.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [s]).map(x=>x.trim()).filter(Boolean);
  const brkBefore = /^(but|and|so|because|which|that|when|if|though|although|while|or|then|unless)$/i;
  const prep = /^(in|on|at|of|for|to|with|from|about|into|by|as|over|under|before|after)$/i;
  const clean = w => w.replace(/[^\w']/g,"");
  let out = [];
  sents.forEach(sen=>{
    const toks = sen.split(/\s+/);
    const parts = []; let c = [];
    toks.forEach(w=>{
      if(c.length>=4 && brkBefore.test(clean(w))){ parts.push(c.join(" ")); c=[]; }
      c.push(w);
      if(/[,;:]$/.test(w) && c.length>=3){ parts.push(c.join(" ")); c=[]; }
    });
    if(c.length) parts.push(c.join(" "));
    parts.forEach(p=>{
      let t = p.split(/\s+/);
      while(t.length > 10){
        let cut = -1, mid = Math.floor(t.length/2);
        for(let i=Math.max(3, mid-3); i<Math.min(t.length-3, mid+4); i++){
          if(prep.test(clean(t[i]))){ cut = i; break; }
        }
        if(cut < 0) cut = mid;
        out.push(t.slice(0,cut).join(" ")); t = t.slice(cut);
      }
      out.push(t.join(" "));
    });
  });
  const merged=[];
  out.forEach(c=>{ if(merged.length && c.split(/\s+/).length<3) merged[merged.length-1]+=" "+c; else merged.push(c); });
  return merged;
}

let pendingUpdate = false;

  if(!pendingUpdate) return;
  if(cur.view==="session" || cur.view==="add") return;

  location.reload();
}

function startSession(id, resume){
  stopSpeak();
  const sp = (resume && S.spot && S.spot.dayId===id) ? S.spot : null;
  cur.dayId=id; cur.chunk=-1; cur.showKo=S.cfg.showKo;
  cur.step = sp ? Math.max(0, Math.min(sp.step, STEPS.length-1)) : 0;
  cur.line = sp ? Math.max(0, sp.line||0) : 0;
  const dd = dayById(id); if(dd) cur.line = Math.min(cur.line, dd.lines.length-1);
  cur.reps = (S.prog[id]&&S.prog[id].reps) ? S.prog[id].reps : {};
  cur.t0 = Date.now();
  clearInterval(cur.tick); cur.tick = setInterval(updClock, 1000);
  go("session");
}
function elapsedMin(){ return Math.max(0, Math.round((Date.now()-cur.t0)/60000)); }
function updClock(){
  const el = $("#clock"); if(!el) return;

function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};
}

function saveProgress(){
  if(!cur.dayId) return;
  const p = S.prog[cur.dayId] || {};
  p.reps = cur.reps; p.stepIdx = cur.step;
  S.prog[cur.dayId] = p;
  if(!p.done) S.spot = { dayId:cur.dayId, step:cur.step, line:cur.line, at:Date.now() };
  save();
}

  saveProgress();
  toast("여기까지 저장했습니다. 다음에 열면 이어집니다.");

}

/* --- step 4 : 쉐도잉 (핵심) --- */
function stepShadow(d){
  const i = cur.line, l = d.lines[i];
  const reps = cur.reps[i]||0, target = S.cfg.reps;
  const chunks = chunkify(l.en);
  let h = '<div class="row" style="margin:10px 0 0"><span class="sub">문장 '+(i+1)+' / '+d.lines.length+'</span>';
  h += '<span style="flex:1"></span>'+speedBar("shSpeed")+'</div>';
  h += '<div class="shadowbox">';
  h +=   '<div class="who '+(l.s==="B"?"b":"")+'">'+(l.s==="B"?esc(d.names.B):esc(d.names.A))+'</div>';
  h +=   '<div class="bigen">'+esc(l.en)+'</div>';
  if(chunks.length>1){
    h += '<div class="sub" style="font-size:12px;margin-top:6px">덩어리로 끊어 읽기 — 각 줄을 눌러 따라 하세요</div>';
    h += '<div class="chunks">'+chunks.map((c,ci)=>'<div class="chunk" data-c="'+ci+'">'+esc(c)+'</div>').join("")+'</div>';
  }
  h +=   '<div class="bigko">'+esc(l.ko)+'</div>';
  h +=   '<div class="rule"></div>';
  h +=   '<div class="row"><button class="btn" id="pLine">듣기 ▶</button>'+
         '<button class="btn ghost sm" id="pSlow">천천히 0.7x</button>'+
         '<button class="btn '+(autoTok?"red":"ghost")+' sm" id="pAuto">'+(autoTok?"■ 자동 정지":"자동 진행 ▶▶")+'</button>'+
         '<span style="flex:1"></span><span class="counter" id="dots">'+
         Array.from({length:target},(_,k)=>'<span class="dot '+(k<reps?"on":"")+'"></span>').join("")+'</span></div>';
  if(l.notes && l.notes.length){
    h += '<div class="notes"><div class="sub" style="font-size:12px;margin-bottom:4px">표현 노트</div>';
    l.notes.forEach(n=>{
      h += '<div class="note"><b>'+esc(n.t)+'</b><span class="k">'+esc(kLabel(n.k))+'</span> — '+esc(n.m)+
           (n.tip?'<span class="tip">'+esc(n.tip)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="row"><button class="btn ghost" id="sPrev">← 앞 문장</button>'+
       '<button class="btn" id="sNext">다음 문장 →</button>'+
       '<span class="sub" style="font-size:12px">스페이스바=듣기, Enter=다음</span></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("shSpeed"); bindBlur();

  const play = (rate)=>{ stopSpeak(); bumpRep(i); speak(l.en, l.s, rate||S.cfg.rate); };
  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.7);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c], l.s, Math.min(S.cfg.rate,0.9));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = t => Math.max(1000, t.split(/\s+/).length * 340);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.en, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.en));
    });
  })(0);
}
function kLabel(k){
  return ({idiom:"관용", colloquial:"구어", phrasal:"구동사", collocation:"연어", business:"실무어", grammar:"문법"})[k] || k;
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.en, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

function importData(e){

      ["prog","log","star","out","custom","cfg"].forEach(k=>{ if(o[k]) S[k]=o[k]; });
      rebuild(); save(); toast("복원했습니다"); render();
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };

}

let bankQ = "";
function renderBank(){
  const rows=[];
  CONTENT.forEach(d=> d.keys.forEach(k=> rows.push({d, k})));
  const q = bankQ.trim().toLowerCase();
  const filtered = rows.filter(r=> !q || (r.k.en+r.k.ko+r.k.ex).toLowerCase().includes(q));
  let h = '<div class="hd" style="margin-top:20px"><small>Expression bank</small>표현장 <span class="sub" style="font-size:13px">('+rows.length+'개)</span></div>';
  h += '<div class="card"><div class="row"><input type="text" id="bq" placeholder="영어·한국어로 검색" value="'+esc(bankQ)+'" style="flex:1;min-width:180px">'+
       '<button class="btn ghost sm" id="bStar">⭐만 보기</button><button class="btn ghost sm" id="bDrill">랜덤 10개 훈련</button></div></div>';
  h += '<div class="card" id="bankList">';
  filtered.forEach((r,i)=>{
    const on = S.star[r.k.en] ? "on":"";
    h += '<div class="bankrow"><span class="star '+on+'" data-k="'+esc(r.k.en)+'">★</span>'+
         '<b>'+esc(r.k.en)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button>'+
         '<div class="m">'+esc(r.k.ko)+' <span class="sub" style="font-size:11.5px">· DAY '+r.d.day+'</span></div>'+
         '<div class="ex">'+esc(r.k.ex)+'</div></div>';
  });
  if(!filtered.length) h += '<div class="sub">검색 결과가 없습니다.</div>';
  h += '</div>';
  $("#view-bank").innerHTML = h; bindPlay();
  $("#bq").oninput = e=>{ bankQ=e.target.value; const p=e.target.selectionStart; renderBank(); const el=$("#bq"); el.focus(); el.setSelectionRange(p,p); };
  $("#bStar").onclick = ()=>{ bankQ=""; renderBank();
    document.querySelectorAll("#bankList .bankrow").forEach(row=>{
      const s=row.querySelector(".star"); if(!s.classList.contains("on")) row.style.display="none"; }); };
  $("#bDrill").onclick = ()=> drill(rows);
  document.querySelectorAll(".star").forEach(s=> s.onclick = ()=>{
    const k=s.dataset.k; if(S.star[k]) delete S.star[k]; else S.star[k]=1; save(); s.classList.toggle("on"); });
}
function drill(rows){
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 보지 말고 먼저 말하기</div><div class="card">';
  pick.forEach(r=>{
    h += '<div class="keyrow"><b>'+esc(r.k.en)+' <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button></b>'+
         '<span><span class="blurme">'+esc(r.k.ko)+'</span><span class="ex blurme">'+esc(r.k.ex)+'</span></span></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 표현장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

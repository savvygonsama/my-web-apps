{
 id:"w2d6", day:13, cat:"조직·성과관리", level:"B2+",
 title:"What Gets Measured Gets Gamed",
 titleKo:"재면 조작된다 — 지표가 목표가 될 때",
 names:{A:"Ruth (성과관리)", B:"Ali (현업 팀장)"},
 brief:[
  "조직은 재지 않으면 관리하지 못한다. 그런데 재기 시작하는 순간 지표는 단순한 관찰이 아니라 <b>목표</b>가 되고, 사람들은 일이 아니라 지표를 향해 움직이기 시작한다.",
  "대부분의 지표는 <b>대리 지표(proxy)</b>다. 정말 보고 싶은 것 — 고객이 만족했는지, 품질이 좋아졌는지 — 은 직접 재기 어려워서, 대신 세기 쉬운 것을 센다. 처리 건수, 응답 시간 같은 것들이다. 대리와 본체가 어긋나기 시작하면 지표는 그때부터 거짓말을 한다.",
  "지표가 목표가 되면 좋은 지표이기를 그친다 — <b>굿하트의 법칙(Goodhart's law)</b>. 여기서 중요한 것은 조작이 대개 부정행위가 아니라는 점이다. 걸린 보상에 대한 합리적인 반응일 뿐이고, 그래서 사람을 바꿔도 되풀이된다.",
  "실무의 해법은 완벽한 지표를 찾는 것이 아니라 <b>여러 지표를 묶어(a basket of measures)</b> 서로를 견제하게 두는 것이다. 처리 건수 옆에 재문의율을, 속도 옆에 재작업률을 놓는다. 하나는 속일 수 있어도 셋을 동시에 속이려면 대개 일을 제대로 하는 편이 빠르다."
 ],
 lines:[
  {s:"A",en:"Your team's closure rate doubled in two months. Either a miracle happened or something moved.",
   ko:"그쪽 팀 처리율이 두 달 만에 두 배가 됐습니다. 기적이거나 뭔가 움직인 거죠.",
   notes:[{t:"Either A or B",k:"grammar",m:"A이거나 B이거나 둘 중 하나다",tip:"가능성을 둘로 좁혀 답을 요구하는 형태입니다."}]},
  {s:"B",en:"You asked for closure rate and you got it. I'd have preferred a better question.",
   ko:"처리율을 달라셔서 드린 겁니다. 저는 더 나은 질문을 원했고요.",
   notes:[{t:"You asked for X and you got X",k:"colloquial",m:"X 달라고 하셔서 X 드린 겁니다",tip:"같은 말을 반복해 「요구가 잘못이었다」를 찌르는 반박입니다."}]},
  {s:"A",en:"That's not an answer. Tell me what changed on the ground.",
   ko:"그건 답이 아닙니다. 현장에서 뭐가 바뀌었는지 말해 주세요.",
   notes:[{t:"on the ground",k:"idiom",m:"현장에서 실제로",tip:"보고서·계획과 대비되는 말입니다. It looks fine on paper, but on the ground ~"}]},
  {s:"B",en:"Tickets get closed and reopened. The same problem comes back under a new number.",
   ko:"티켓이 닫혔다가 다시 열립니다. 같은 문제가 새 번호를 달고 돌아와요.",
   notes:[{t:"come back under a new ~",k:"collocation",m:"새 ~을 달고 되돌아오다",tip:"under로 「이름을 바꿔」를 나타냅니다."}]},
  {s:"A",en:"So we count the same work twice and call it improvement.",
   ko:"그럼 같은 일을 두 번 세고 그걸 개선이라 부르는 거네요.",
   notes:[{t:"call A B",k:"grammar",m:"A를 B라고 부르다",tip:"목적격 보어가 관사 없이 오는 경우가 많습니다. call it improvement."}]},
  {s:"B",en:"Nobody cheated. People did what the target rewarded, as people always do.",
   ko:"아무도 속이지 않았습니다. 목표가 보상하는 대로 했을 뿐이고, 사람은 늘 그렇습니다.",
   notes:[{t:"hang a number on someone",k:"idiom",m:"~에게 수치 목표를 걸다",tip:"목에 걸어 놓는 이미지입니다. 목표 관리의 압박을 말할 때 씁니다."}]},
  {s:"A",en:"I know. The measure stopped describing the work once it became the target.",
   ko:"압니다. 그 지표는 목표가 된 순간 일을 설명하기를 그만뒀어요.",
   notes:[{t:"once ~",k:"grammar",m:"일단 ~하고 나면",tip:"when보다 「그 시점 이후로는」이 또렷합니다."}]},
  {s:"B",en:"There's a name for that, isn't there? A measure stops being good once it's a target.",
   ko:"그거 이름이 있지 않나요? 지표가 목표가 되면 좋은 지표이기를 그친다는.",
   notes:[{t:"stop being ~",k:"grammar",m:"~이기를 그치다",tip:"stop + 동명사입니다. stop to be로 쓰면 뜻이 달라집니다."}]},
  {s:"A",en:"Goodhart's law. It's not about dishonest people. It's about honest people and incentives.",
   ko:"굿하트의 법칙입니다. 부정직한 사람 얘기가 아니라 정직한 사람과 인센티브 얘기예요.",
   notes:[{t:"Goodhart's law",k:"business",m:"지표가 목표가 되면 좋은 지표이기를 그친다는 법칙",tip:"회의에서 이 이름을 정확히 대면 논의의 격이 올라갑니다."}]},
  {s:"B",en:"Then measure whether the customer came back. That's what you actually care about.",
   ko:"그럼 고객이 다시 왔는지를 재세요. 실제로 신경 쓰는 건 그거잖아요.",
   notes:[{t:"care about",k:"phrasal",m:"진짜로 중요하게 여기다",tip:"care for(돌보다)와 다릅니다. 실무 대화에서 헷갈리면 뜻이 어긋납니다."}]},
  {s:"A",en:"I'd love to, but repeat contact is slow and noisy, and half isn't yours.",
   ko:"그러고 싶죠. 그런데 재문의는 느리고 잡음이 많고, 절반은 그쪽 몫이 아닙니다.",
   notes:[{t:"a proxy for ~",k:"business",m:"진짜 대신 재는 대리 지표",tip:"Response time is a proxy for service, and a poor one."}]},
  {s:"B",en:"Everything useful is slow and noisy. Clean numbers are clean because something was removed.",
   ko:"쓸모 있는 건 다 느리고 지저분합니다. 깔끔한 숫자는 뭔가를 걷어냈으니 깔끔한 거고요.",
   notes:[{t:"strip out",k:"phrasal",m:"(요소를) 걷어내다",tip:"strip out the noise / strip out one-off costs. 데이터·회계에서 자주 씁니다."}]},
  {s:"A",en:"Fair enough, but I can't take 'it's complicated' upstairs. I need one page.",
   ko:"일리 있어요. 그래도 「복잡합니다」를 윗선에 가져갈 순 없습니다. 한 장이 필요해요.",
   notes:[{t:"take something upstairs",k:"idiom",m:"윗선에 가져가다",tip:"escalate의 구어형입니다. 회의에서 훨씬 자연스럽습니다."}]},
  {s:"B",en:"Then put three numbers on the page and let them argue with each other.",
   ko:"그럼 한 장에 숫자를 셋 올리고 서로 다투게 두세요.",
   notes:[{t:"let them argue with each other",k:"colloquial",m:"그것들이 서로 다투게 두다",tip:"지표를 사람처럼 말하게 하는 비유입니다. 견제 구조를 설명하는 데 효과적입니다."}]},
  {s:"A",en:"A basket of measures. Closure rate next to reopen rate, volume next to queue length.",
   ko:"지표 묶음이군요. 처리율 옆에 재개율, 처리량 옆에 대기열 길이.",
   notes:[{t:"a basket of measures",k:"business",m:"서로를 견제하는 지표 묶음",tip:"a basket of currencies에서 온 비유입니다. 성과관리의 표준 표현입니다."},
          {t:"A next to B",k:"collocation",m:"A를 B 옆에 나란히",tip:"물리적 위치이자 「대조해 보이다」라는 뜻입니다."}]},
  {s:"B",en:"That's better. Any single number can be gamed. Gaming three usually means working properly.",
   ko:"그게 낫습니다. 숫자 하나는 조작되지만, 셋을 조작하려면 대개 제대로 일하는 게 빠르죠.",
   notes:[{t:"game a metric",k:"business",m:"규칙 안에서 지표를 유리하게 조작하다",tip:"cheat과 다릅니다. 규칙을 어기지 않고 허점을 이용하는 것입니다."}]},
  {s:"A",en:"Usually. Someone will find the seam, and I'd rather hear it from you.",
   ko:"대개는요. 누군가는 허점을 찾아낼 텐데, 저는 그쪽한테서 먼저 듣고 싶습니다.",
   notes:[{t:"find the seam",k:"idiom",m:"허점·이음매를 찾아내다",tip:"옷의 솔기에서 온 비유입니다. loophole보다 구어적입니다."}]},
  {s:"B",en:"You will, if telling you costs me nothing. The last team got blamed for it.",
   ko:"그러시게 될 겁니다, 말하는 게 대가가 없다면요. 지난번 팀은 그 책임을 뒤집어썼거든요.",
   notes:[{t:"flag ~",k:"business",m:"문제를 공식적으로 짚어 알리다",tip:"Let me flag one risk. 이견을 꺼낼 때의 부드러운 도입입니다."},
          {t:"get blamed for ~",k:"collocation",m:"~에 대한 책임을 뒤집어쓰다",tip:"take the blame(스스로 지다)과 달리 억울함이 섞입니다."}]},
  {s:"A",en:"That's on us, and I'll change it. A metric nobody questions is worse than none.",
   ko:"그건 우리 잘못이고 제가 바꾸겠습니다. 아무도 묻지 못하는 지표는 없는 것보다 나빠요.",
   notes:[{t:"That's on us.",k:"colloquial",m:"그건 우리 책임입니다",tip:"That's on me.로 짧게 책임을 인정할 때도 씁니다."}]},
  {s:"B",en:"Then we're getting somewhere. Just don't fall for the new numbers like the old ones.",
   ko:"그럼 진전이 있네요. 다만 예전 숫자처럼 새 숫자에도 홀리지는 마세요.",
   notes:[{t:"we're getting somewhere",k:"idiom",m:"이제 좀 진전이 있다",tip:"논의가 풀리기 시작할 때 쓰는 정형 문장입니다."},
          {t:"fall for ~",k:"phrasal",m:"~에 홀딱 넘어가다",tip:"fall in love with보다 「속았다」는 뉘앙스가 섞입니다."}]}
 ],

{
 id:"w2d7", day:14, cat:"물류·운송", level:"B2+",
 title:"The Box That Waits",
 titleKo:"기다리는 컨테이너 — 체선료와 리드타임이라는 숨은 원가",
 names:{A:"Nadia (물류)", B:"Peter (생산계획)"},
 brief:[
  "운송 원가는 운임만이 아니다. 컨테이너가 항만에 서 있는 동안에도 값이 붙는다 — 터미널 안에 머무는 시간에 붙는 <b>체선료(demurrage)</b>와, 컨테이너를 끌고 나간 뒤 반납이 늦어질 때 붙는 <b>지체료(detention)</b>다.",
  "이 값은 벌금이 아니라 <b>회전율을 강제하는 가격</b>이다. 터미널과 선사는 한정된 자리와 장비가 묶이는 것을 싫어한다. 그래서 <b>무료 기간(free time)</b>을 짧게 두고 그 뒤부터는 시간을 판다. 창고를 빌려주는 것이 아니라, 오래 세워 둘 사람을 값으로 밀어내는 것이다.",
  "공장이 실제로 아파하는 것은 평균 리드타임이 아니라 <b>흔들림(variability)</b>이다. 늘 30일이면 계획이 서지만 20일과 45일을 오가면 그 차이만큼을 재고로 메워야 한다. 그렇게 쌓아 두는 것이 <b>안전재고(safety stock)</b>이고, 그것은 창고에 잠긴 현금이다.",
  "그래서 물류와 생산계획은 같은 돈을 서로 다른 계정에서 본다. 물류는 운임과 체선료를 보고, 생산은 멈춘 라인과 쌓인 재고를 본다. 각자의 예산에서 상대의 숫자가 보이지 않는다는 것 — 이것이 이 다툼의 진짜 뿌리다."
 ],
 lines:[
  {s:"A",en:"The demurrage bill landed on my desk, and it's bigger than the freight we argued about.",
   ko:"체선료 청구서가 제 책상에 올라왔는데, 우리가 다투던 운임보다 큽니다.",
   notes:[{t:"demurrage",k:"business",m:"체선료 — 컨테이너가 터미널에 머문 시간에 붙는 값",tip:"detention(반출 뒤 반납 지연)과 짝으로 외우세요."},
          {t:"land on someone's desk",k:"idiom",m:"~에게 (일·청구서가) 떨어지다",tip:"원치 않게 떠맡게 됐다는 뉘앙스가 붙습니다."}]},
  {s:"B",en:"That's not my line item. I asked for those boxes to sit until we had space.",
   ko:"그건 제 예산 항목이 아닙니다. 자리가 날 때까지 세워 두라고 했을 뿐이에요.",
   notes:[{t:"a line item",k:"business",m:"(예산·청구서의) 개별 항목",tip:"That's not my line item.은 「내 소관이 아니다」라는 실무 관용구입니다."}]},
  {s:"A",en:"The boxes sitting is what you're charged for. Free time ran out and billing started.",
   ko:"세워 둔 것 자체가 청구 사유입니다. 무료 기간이 끝나면서 과금이 시작됐어요.",
   notes:[{t:"free time",k:"business",m:"체선료가 붙지 않는 무료 유치 기간",tip:"「자유 시간」이 아닙니다. 물류 계약서에서는 이 뜻으로만 씁니다."}]},
  {s:"B",en:"Then the free time is too short. Nobody clears a full vessel in that window.",
   ko:"그럼 무료 기간이 너무 짧습니다. 그 시간 안에 배 한 척을 다 비우는 사람은 없어요.",
   notes:[{t:"the window",k:"business",m:"허용된 시간 구간",tip:"a delivery window / a booking window. 창문이 아니라 「기간」입니다."}]},
  {s:"A",en:"It's short on purpose. The terminal isn't renting storage. It's pricing you out.",
   ko:"일부러 짧은 겁니다. 터미널은 창고를 빌려주는 게 아니라 값으로 밀어내는 거예요.",
   notes:[{t:"on purpose",k:"idiom",m:"일부러, 의도적으로",tip:"by accident의 반대입니다. 7일차와 짝지어 외우세요."},
          {t:"price someone out",k:"business",m:"값을 올려 밀어내다",tip:"priced out of the market = 값 때문에 시장에서 밀려난."}]},
  {s:"B",en:"Fair enough, but my yard was full and the line was running. What should I do?",
   ko:"일리 있어요. 그래도 야적장은 꽉 찼고 라인은 돌고 있었습니다. 어쩌란 겁니까?",
   notes:[{t:"the yard",k:"business",m:"야적장, 물류 마당",tip:"the shop floor(생산 현장)와 짝으로 알아 두면 공장 대화가 편합니다."}]},
  {s:"A",en:"You could have told me a week earlier. I can pre-book slots when I know.",
   ko:"일주일 전에만 말해 주셨어도 됐습니다. 알면 자리를 미리 잡을 수 있어요.",
   notes:[{t:"could have + 과거분사",k:"grammar",m:"~할 수도 있었는데 (하지 않았다)",tip:"아쉬움과 가벼운 질책을 함께 담습니다."},
          {t:"pre-book a slot",k:"collocation",m:"자리를 미리 잡아 두다",tip:"a slot은 시간·설비의 「자리」입니다. free up a slot."}]},
  {s:"B",en:"I didn't know. The schedule moved twice because two orders got pulled forward.",
   ko:"저도 몰랐습니다. 주문 두 건이 앞당겨지면서 일정이 두 번 움직였어요.",
   notes:[{t:"pull forward",k:"phrasal",m:"(일정을) 앞당기다",tip:"반대는 push back입니다. 일정 조정의 기본 짝입니다."}]},
  {s:"A",en:"Then that's the real problem, not demurrage. Your plan moves faster than my bookings.",
   ko:"그럼 진짜 문제는 그거고 체선료가 아닙니다. 계획이 제 예약보다 빨리 움직여요.",
   notes:[{t:"the real problem is ~",k:"colloquial",m:"진짜 문제는 ~이다",tip:"증상과 원인을 갈라 놓는 토론의 정석 문형입니다."}]},
  {s:"B",en:"Plans always move. I'd rather move a plan than sit on stock we can't sell.",
   ko:"계획은 늘 움직입니다. 못 팔 재고를 끌어안느니 계획을 움직이겠어요.",
   notes:[{t:"sit on stock",k:"idiom",m:"재고를 끌어안고 있다",tip:"sit on cash / sit on a decision처럼 「쥐고 안 움직인다」는 뜻입니다."}]},
  {s:"A",en:"I understand, but every change costs me. It shows up in my budget, not yours.",
   ko:"이해합니다. 다만 변경마다 제 비용이 됩니다. 그쪽이 아니라 제 예산에 나타나요.",

{

 titleKo:"아무도 끝내지 못하는 프로젝트 — 매몰비용과 멈추는 기술",
 names:{A:"Helen (재무)", B:"Raj (프로젝트 책임)"},
 brief:[
  "이미 쓴 돈은 <b>매몰비용(sunk cost)</b>이다. 무엇을 하든 회수되지 않으므로 앞으로의 판단에 넣어서는 안 된다. 지금 물어야 할 것은 「지금까지 얼마를 썼나」가 아니라 「앞으로 쓸 돈이 값어치를 하는가」뿐이다.",
  "그런데 사람은 쓴 돈이 클수록 그만두기 어려워한다. 계속하는 편이 유리해서가 아니라, 멈추는 순간 그동안의 판단이 틀렸다고 인정하는 일이 되기 때문이다. 이것을 <b>집착의 확대(escalation of commitment)</b>라 부른다.",
  "조직은 이 함정을 개인의 의지로 막지 못한다. 그래서 <b>단계별 관문(stage gate)</b>을 미리 세워 둔다. 다음 단계로 갈 자격을 매번 새로 증명하게 하는 장치이고, 핵심은 기준을 <b>숫자가 나오기 전에</b> 합의해 두는 것이다.",
  "관문이 실제로 작동하려면 <b>멈추는 것이 실패가 아니어야</b> 한다. 중단을 말한 사람이 불이익을 받는 조직에서는 아무도 관문에서 손을 들지 않고, 보고서는 전부 노란불이 되며, 관문은 서명 절차로 전락한다."
 ],
 lines:[
  {s:"A",en:"We're eighteen months into this, and I want to ask whether it should carry on.",

{
 id:"w3d1", day:16, cat:"투자·시장", level:"B2+",
 title:"Why Cheap Stays Cheap",
 titleKo:"싼 주식은 왜 계속 싼가 — 저평가와 밸류 트랩",
 names:{A:"Mina (리서치)", B:"Dohyun (개인 투자자)"},
 brief:[
  "주식이 싸다는 말은 대개 <b>이익 대비 값</b>이 낮다는 뜻입니다. 그것을 재는 가장 흔한 잣대가 주가수익비율(PER)이고, 영어로는 <b>trade at X times earnings</b>라고 말합니다. 「PER이 4배다」가 아니라 「이익의 네 배에 거래된다」고 표현하는 것이 자연스럽습니다.",
  "문제는 싼 데는 대개 이유가 있다는 점입니다. 시장이 그 회사의 이익을 <b>지속되지 않을 이익</b>으로 보거나, 지배구조·배당·업황 주기를 할인 요인으로 잡고 있을 수 있습니다. 싸 보이지만 계속 싼 채로 머무는 주식을 <b>value trap(밸류 트랩)</b>이라 부릅니다.",
  "그래서 던져야 할 질문은 「싼가」가 아니라 <b>What's driving the price?(무엇이 주가를 움직이는가)</b>입니다. 할인의 이유가 사라질 수 있는 것인지, 구조적으로 남는 것인지에 따라 답이 갈립니다.",
  "손실을 말하는 영어도 정해져 있습니다. <b>I'm down forty percent</b>가 가장 자연스럽고, 평가손실을 안고 있다는 뜻으로 <b>sitting on a loss</b>를 씁니다. 팔지 않고 계속 들고 가겠다는 말은 <b>hold on to</b>입니다."
 ],
 lines:[

  {s:"B",en:"I'm down about forty percent. Honestly, I stopped opening the app for a while.",

  {s:"A",en:"That's painful. What's your case for holding on to it from here?",

  {s:"B",en:"It trades at four times earnings. Its American peer trades at thirteen.",

  {s:"A",en:"So on that number it looks cheap. But cheap on its own isn't a thesis.",

  {s:"B",en:"Why not? If the earnings are real, the gap has to close eventually.",

  {s:"B",en:"So how would I tell the two apart before I put more money in?",

{
 id:"w3d2", day:17, cat:"투자·자산배분", level:"B2+",
 title:"The Ten Percent Rule",
 titleKo:"10퍼센트의 규칙 — 헤지와 비중, 그리고 정치",
 names:{A:"Sena (자산배분 담당)", B:"Won (동료)"},
 brief:[
  "헤지는 수익을 노리는 것이 아니라 <b>다른 자산이 무너질 때 버텨 줄 것</b>을 사 두는 일입니다. 그래서 금 이야기를 할 때 「오를까요」가 아니라 「무엇에 대비하는가」를 먼저 묻습니다. 영어로는 <b>hedge against inflation</b>처럼 against 뒤에 대비 대상을 씁니다.",
  "핵심은 <b>비중(position sizing)</b>입니다. 좋은 자산이라도 비중이 과하면 포트폴리오 전체가 그 자산이 되어 버립니다. 「전체의 10퍼센트를 넘기지 않는다」는 <b>account for no more than ten percent</b>로 말합니다.",
  "정치와 시장의 관계도 자주 오르내립니다. 정부가 시장을 인위적으로 떠받친다는 뜻으로 <b>prop up the market</b>을 쓰고, 선거가 끝나면 그럴 <b>유인(incentive)</b>이 줄어든다는 식으로 이어집니다. 다만 이런 이야기는 근거가 약할 때가 많아, 토론에서는 반박을 받습니다.",
  "마지막은 <b>규칙으로 만들기</b>입니다. 예측이 아니라 절차로 정해 두는 것 — 매달 같은 금액을 넣고, 비중이 어긋나면 되돌리는 <b>rebalance</b>가 그것입니다. 감정이 개입할 자리를 미리 줄이는 방법입니다."
 ],
 lines:[
  {s:"A",en:"You said you want to start buying gold again. What are you hedging against?",
   ko:"금을 다시 사기 시작하고 싶다고 하셨죠. 무엇에 대비하시는 겁니까?",
   notes:[{t:"hedge against ~",k:"business",m:"~에 대비해 위험을 덜다",tip:"against 뒤에 대비 대상이 옵니다. hedge against inflation / against a weak won."}]},
  {s:"B",en:"Inflation, mostly. I want something that holds value when cash doesn't.",
   ko:"주로 인플레이션이요. 현금이 값어치를 잃을 때 버텨 줄 게 필요합니다.",
   notes:[{t:"hold value",k:"collocation",m:"값어치를 유지하다",tip:"Gold tends to hold its value. hold up도 비슷하게 씁니다."}]},
  {s:"A",en:"That's a reason, not a target. How much of the portfolio are we talking about?",
   ko:"그건 이유지 목표가 아닙니다. 포트폴리오의 몇 퍼센트를 말씀하시는 거죠?",
   notes:[{t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"짧게 구별을 짚는 형태입니다. 논점을 다시 세울 때 유용합니다."},
          {t:"What are we talking about?",k:"colloquial",m:"어느 정도를 말씀하시는 겁니까",tip:"막연한 말을 숫자로 끌어내는 질문입니다."}]},
  {s:"B",en:"Small. I don't want it to account for more than ten percent.",
   ko:"적게요. 전체의 10퍼센트를 넘기고 싶지 않습니다.",
   notes:[{t:"account for X percent",k:"business",m:"전체의 X퍼센트를 차지하다",tip:"비중을 말하는 표준 표현입니다. take up도 구어로 씁니다."}]},
  {s:"A",en:"Good. Above that it stops being a hedge and becomes a bet.",
   ko:"좋습니다. 그 위로 가면 헤지가 아니라 베팅이 됩니다.",
   notes:[{t:"stop being A and become B",k:"grammar",m:"A이기를 그치고 B가 되다",tip:"경계를 넘는 순간을 묘사하는 형태입니다. 기억에 남는 문장을 만듭니다."}]},
  {s:"B",en:"I sold my last commodities at a loss, so I'd rather go slowly this time.",
   ko:"지난번 원자재는 손해 보고 팔아서, 이번엔 천천히 가고 싶습니다.",
   notes:[{t:"at a loss",k:"business",m:"손해를 보고",tip:"sell at a loss / sell at a profit. 「어찌할 바를 모르다」라는 다른 뜻과 구별하세요."}]},
  {s:"A",en:"Then buy the same amount every month and ignore the price entirely.",
   ko:"그럼 매달 같은 금액을 사고 가격은 아예 무시하세요.",
   notes:[{t:"ignore ~ entirely",k:"collocation",m:"~을 아예 무시하다",tip:"부사를 뒤에 붙여 정도를 못 박습니다. 규칙을 강조할 때 씁니다."}]},
  {s:"B",en:"Doesn't that mean I buy at bad prices too, when it's already expensive?",
   ko:"그럼 비쌀 때도 나쁜 값에 사게 되는 거 아닌가요?",
   notes:[{t:"Doesn't that mean ~?",k:"grammar",m:"그럼 ~라는 뜻 아닌가요",tip:"상대 제안의 결과를 짚어 되묻는 부드러운 반박입니다."}]},
  {s:"A",en:"Yes, and at good ones. The point is that you stop guessing the timing.",

  {s:"B",en:"Fair. Honestly, my timing has been wrong more often than it's been right.",
   ko:"일리 있어요. 솔직히 제 타이밍은 맞은 적보다 틀린 적이 많습니다.",
   notes:[{t:"more often than not",k:"idiom",m:"대체로, 십중팔구",tip:"여기서는 그 구조를 풀어 썼습니다. More often than not, he's right."}]},

   ko:"그럼 규칙을 정하고 일 년에 두 번 비중을 되돌리세요. 결정은 규칙이 하게 두고요.",
   notes:[{t:"rebalance",k:"business",m:"비중을 원래대로 되돌리다",tip:"오른 자산을 팔고 내린 자산을 사는 정기 조정입니다."},
          {t:"let ~ do the deciding",k:"colloquial",m:"결정은 ~이 하게 두다",tip:"사람이 아닌 것을 주어로 세워 감정을 배제한다는 뜻을 냅니다."}]},
  {s:"B",en:"What about equities? Some people expect a drop after the election.",
   ko:"주식은요? 선거 뒤에 하락을 예상하는 사람들이 있던데요.",
   notes:[{t:"equities",k:"business",m:"주식 (자산군으로서)",tip:"stocks의 격식체입니다. equities / bonds / commodities로 묶어 씁니다."}]},
  {s:"A",en:"The argument is that the government props up the market until the vote.",

  {s:"B",en:"And afterwards they'd have less incentive to keep doing it.",

  {s:"A",en:"It's a tidy story. I'd be careful with any thesis that needs a calendar.",

  {s:"B",en:"That's a fair warning. I've lost money on tidy stories before.",

  {s:"A",en:"If you want to act on it, reduce risk gradually instead of calling the top.",

{
 id:"w3d3", day:18, cat:"신기술·훈련", level:"B2+",
 title:"Who Learns to Judge?",
 titleKo:"판단은 누가 배우는가 — 초안을 기계가 쓸 때",
 names:{A:"Hyun (팀장)", B:"Rosa (인재개발)"},
 brief:[
  "초안을 만드는 일이 쉬워지면서 일의 무게중심이 <b>생산에서 검증으로</b> 옮겨 갔습니다. 예전에는 초안을 쓰는 것이 가장 오래 걸리고 가장 중요한 일이었지만, 지금은 나온 것을 따져 보는 능력이 더 값어치 있게 됐습니다.",
  "문제는 <b>그 검증 능력이 어디서 오느냐</b>입니다. 좋은 검토자는 대개 직접 만들어 본 사람입니다. 숫자를 손으로 맞춰 보고, 틀려 보고, 어디가 잘 틀리는지 몸으로 아는 사람이 어디를 봐야 할지 압니다.",
  "그래서 생기는 것이 이 회차의 쟁점입니다. 신입이 초안을 한 번도 만들어 보지 않고 검토자부터 시작하면, <b>무엇을 근거로 판단하는가</b>. 조직은 효율을 얻고 그 대가로 다음 세대의 판단력을 잃을 수 있습니다.",
  "실무의 해법은 대개 둘 중 하나입니다. 일부러 <b>손으로 해 보는 구간(reps)</b>을 남겨 두거나, 검토를 가르치는 훈련을 따로 만드는 것입니다. 어느 쪽이든 <b>그냥 두면 저절로 생기지 않는다</b>는 것이 출발점입니다."
 ],
 lines:[
  {s:"A",en:"Drafting used to be the slow part. Now it takes a junior about ten minutes.",
   ko:"예전엔 초안이 오래 걸리는 부분이었죠. 지금은 신입이 10분이면 끝냅니다.",
   notes:[{t:"used to be ~",k:"grammar",m:"예전엔 ~였다 (지금은 아니다)",tip:"뒤에 Now ~ 를 붙이면 대비가 또렷해집니다."}]},
  {s:"B",en:"So the time moved somewhere else. Where does it go now?",
   ko:"그럼 시간이 다른 데로 옮겨 간 거네요. 지금은 어디로 갑니까?",
   notes:[{t:"Where does the time go?",k:"collocation",m:"시간이 어디로 가는가",tip:"업무 분석에서 자주 쓰는 질문 형태입니다."}]},
  {s:"A",en:"Into checking. And checking is the part nobody ever put on a training plan.",
   ko:"확인으로요. 그리고 확인은 아무도 교육 계획에 넣은 적 없는 부분입니다.",
   notes:[{t:"put ~ on a plan",k:"collocation",m:"~을 계획에 넣다",tip:"It was never on the plan. 의도적으로 다뤄진 적이 없다는 뜻입니다."}]},
  {s:"B",en:"Because it was never the hard part. Producing was the skill we hired for.",
   ko:"어려운 부분이 아니었으니까요. 우리가 뽑을 때 본 능력은 생산이었죠.",
   notes:[{t:"hire for ~",k:"collocation",m:"~을 보고 채용하다",tip:"hire for attitude, train for skill. 전치사 for를 통째로 외우세요."}]},
  {s:"A",en:"Right. And now I have people approving work they couldn't have produced.",
   ko:"맞아요. 그런데 지금은 자기가 만들 수 없었을 결과물을 승인하고 있습니다.",
   notes:[{t:"approve work",k:"collocation",m:"결과물을 승인하다",tip:"sign off on과 비슷하지만 더 일반적인 말입니다."}]},
  {s:"B",en:"Is that a problem, though? Plenty of editors can't write a novel.",
   ko:"그런데 그게 문제인가요? 소설을 못 쓰는 편집자도 많잖아요.",
   notes:[{t:"Is that a problem, though?",k:"colloquial",m:"그런데 그게 문제인가요",tip:"though를 끝에 붙여 부드럽게 반박합니다. 구어에서 매우 흔합니다."}]},
  {s:"A",en:"Editors read thousands of drafts first. That's where the judgment comes from.",
   ko:"편집자는 먼저 초안을 수천 편 읽습니다. 판단력은 거기서 오는 거죠.",
   notes:[{t:"That's where ~ comes from.",k:"grammar",m:"~은 거기서 나온다",tip:"원인의 자리를 짚어 주는 형태입니다. 설명을 매듭지을 때 좋습니다."}]},
  {s:"B",en:"So your worry isn't the tool. It's that nobody builds the reps anymore.",
   ko:"그럼 걱정은 도구가 아니군요. 아무도 반복 경험을 쌓지 않는다는 거네요.",
   notes:[{t:"reps",k:"colloquial",m:"반복 훈련 횟수, 몸으로 쌓은 경험",tip:"운동의 repetition에서 왔습니다. You need more reps."}]},
  {s:"A",en:"Exactly. You learn where things break by breaking them yourself.",
   ko:"정확합니다. 어디가 깨지는지는 직접 깨뜨려 봐야 압니다.",
   notes:[{t:"where things break",k:"collocation",m:"무엇이 어디서 잘못되는지",tip:"실패 지점을 가리키는 표현입니다. 품질·안전 대화에도 씁니다."}]},
  {s:"B",en:"I'll push back a little. We could teach checking directly instead.",
   ko:"조금 반박해 볼게요. 확인하는 법을 직접 가르칠 수도 있잖아요.",
   notes:[{t:"I'll push back a little.",k:"idiom",m:"조금 이견을 내겠습니다",tip:"반대 의견을 예고해 각이 서지 않게 하는 말입니다."}]},
  {s:"A",en:"Teach it with what? A checklist tells you where to look, not what's wrong.",
   ko:"무엇으로 가르치죠? 점검표는 어디를 볼지 알려 주지, 뭐가 틀렸는지는 안 알려 줍니다.",
   notes:[{t:"Teach it with what?",k:"colloquial",m:"무엇으로 가르칩니까",tip:"짧은 되물음으로 상대 제안의 빈 곳을 찌릅니다."}]},
  {s:"B",en:"Fair. Most of my own catches come from having made that mistake before.",
   ko:"일리 있네요. 제가 잡아내는 것 대부분도 전에 그 실수를 해 봤기 때문입니다.",
   notes:[{t:"a catch",k:"business",m:"잡아낸 오류",tip:"Good catch. = 잘 짚으셨습니다. 명사로도 널리 씁니다."}]},
  {s:"A",en:"That's the whole argument. Verification is memory of your own errors.",
   ko:"그게 논지 전부입니다. 검증은 자기 실수에 대한 기억이에요.",
   notes:[{t:"That's the whole argument.",k:"colloquial",m:"그게 논지의 전부입니다",tip:"길게 설명한 뒤 한 문장으로 압축할 때 씁니다."}]},
  {s:"B",en:"Then protect some of the manual work on purpose, even if it's slower.",
   ko:"그럼 느리더라도 손으로 하는 일을 일부러 남겨 두죠.",
   notes:[{t:"on purpose",k:"idiom",m:"일부러, 의도적으로",tip:"by accident의 반대입니다. 비효율을 의도했다는 것을 밝힙니다."}]},
  {s:"A",en:"That's a hard sell upstairs. It reads as choosing to be inefficient.",
   ko:"윗선에는 설득하기 어렵습니다. 일부러 비효율을 택한 걸로 읽히거든요.",
   notes:[{t:"a hard sell",k:"idiom",m:"설득하기 어려운 것",tip:"반대는 an easy sell입니다."},
          {t:"read as ~",k:"collocation",m:"~으로 받아들여지다",tip:"의도가 아니라 전달되는 인상을 말합니다."}]},
  {s:"B",en:"Then don't frame it as training. Frame it as quality control.",
   ko:"그럼 교육이라고 부르지 마세요. 품질 관리라고 부르면 됩니다.",
   notes:[{t:"frame it as ~",k:"business",m:"~으로 규정해 보이게 하다",tip:"같은 지출도 이름에 따라 승인 여부가 갈립니다."}]},
  {s:"A",en:"That might actually work. Nobody argues with fewer errors in a customer report.",
   ko:"그건 통할 수도 있겠네요. 고객 보고서의 오류가 줄어드는 걸 반대할 사람은 없죠.",
   notes:[{t:"Nobody argues with ~",k:"colloquial",m:"~에는 아무도 반대하지 않는다",tip:"합의가 쉬운 근거를 제시할 때 씁니다."}]},
  {s:"B",en:"And it's true. We still miss wrong numbers when the checking is rushed.",
   ko:"사실이기도 하고요. 확인이 급하면 아직도 틀린 숫자를 놓칩니다.",
   notes:[{t:"miss a number",k:"collocation",m:"숫자를 놓치다, 오류를 못 잡다",tip:"a number slipped through로도 씁니다."}]},
  {s:"A",en:"So we keep the speed and buy back some of the judgment.",
   ko:"그럼 속도는 지키고 판단력은 조금 되사는 거네요.",
   notes:[{t:"buy back ~",k:"phrasal",m:"~을 되사다, 되찾다",tip:"buy back time / buy back trust처럼 추상적인 것에도 씁니다."}]},
  {s:"B",en:"That's the trade I'd make. Speed is easy to get back; judgment isn't.",
   ko:"저라면 그 교환을 하겠습니다. 속도는 되찾기 쉽지만 판단력은 아니거든요.",
   notes:[{t:"the trade I'd make",k:"idiom",m:"제가 택할 교환",tip:"선택지를 맞바꾸는 결정을 말할 때 씁니다. It's a trade, not a win."}]}
 ],

{
 id:"w3d4", day:19, cat:"신기술·에이전트", level:"B2+",
 title:"The New Hire Who Never Sleeps",
 titleKo:"잠들지 않는 신입 — AI 에이전트를 데리고 일하기",
 names:{A:"Jae (영업관리)", B:"Claire (업무혁신)"},
 brief:[
  "글을 만들어 주던 도구가 이제 <b>컴퓨터를 직접 쓰는 단계</b>로 넘어왔습니다. 파일을 열고 자료를 읽고 결과물을 만들어 냅니다. 영어로는 이런 것을 <b>an agent</b>라 부르고, 사람을 대신해 실제로 일을 <b>실행한다(carry out)</b>는 점에서 이전과 다릅니다.",
  "그래서 비유가 바뀝니다. 도구가 아니라 <b>아주 유능하지만 맥락을 모르는 신입</b>에 가깝습니다. 신입에게 필요한 것과 똑같은 것이 필요합니다 — 목표, 배경, 판단 기준, 그리고 어디까지 스스로 정해도 되는지의 선.",
  "여기서 <b>지시를 잘 쓰는 일(prompting)</b>과 <b>일이 되게 판을 짜는 일</b>이 갈립니다. 후자는 도구·규칙·검토 절차·피드백까지 포함하는 설계입니다. 사람에게 맡길 때 우리가 늘 하던 일과 다르지 않습니다.",
  "마지막 쟁점은 <b>어디까지 맡길 것인가</b>입니다. 되돌릴 수 있는 일과 되돌릴 수 없는 일을 가르는 것이 실무의 기준선이고, 이것은 신입에게 권한을 주는 방식과 정확히 같습니다."
 ],
 lines:[
  {s:"A",en:"It didn't just write the report. It opened the files and built the slides itself.",
   ko:"보고서를 쓰기만 한 게 아니라, 파일을 열고 장표까지 직접 만들었습니다.",
   notes:[{t:"not just A, but B",k:"grammar",m:"A만이 아니라 B까지",tip:"놀라움을 단계로 쌓아 올리는 형태입니다. 발표에서 효과적입니다."},
          {t:"build slides",k:"collocation",m:"장표를 만들다",tip:"make a deck / put a deck together도 함께 씁니다."}]},
  {s:"B",en:"So it's carrying out the task, not just describing how to do it.",
   ko:"그럼 방법을 설명하는 게 아니라 일을 실제로 수행하는 거네요.",
   notes:[{t:"carry out ~",k:"phrasal",m:"(일을) 실제로 수행하다",tip:"carry out a plan / carry out a test. 실행 단계를 가리킵니다."}]},
  {s:"A",en:"Exactly. Work that would have taken me a week took about fifteen minutes.",
   ko:"정확합니다. 일주일 걸렸을 일이 15분쯤 걸렸어요.",
   notes:[{t:"Work that would have taken ~",k:"grammar",m:"~걸렸을 일",tip:"would have + 과거분사로 실제와 다른 경우를 가정합니다."}]},
  {s:"B",en:"That's the part that changes budgets. But how much of it did you have to fix?",
   ko:"예산을 바꾸는 건 그 부분이죠. 그런데 그중 얼마나 손봐야 했나요?",
   notes:[{t:"That's the part that ~",k:"grammar",m:"바로 그 부분이 ~하는 것이다",tip:"여러 요소 중 하나를 짚어 강조합니다."}]},
  {s:"A",en:"Some of it. It guessed at things I never told it, which is my fault really.",
   ko:"일부는요. 제가 말해 주지 않은 걸 짐작하더군요. 사실 제 잘못이죠.",
   notes:[{t:"guess at ~",k:"phrasal",m:"~을 짐작으로 채우다",tip:"근거 없이 메운다는 뉘앙스입니다. Don't guess at the numbers."}]},
  {s:"B",en:"That sounds familiar. New people do exactly the same thing in week one.",
   ko:"익숙한 얘기네요. 신입도 첫 주에 똑같이 합니다.",
   notes:[{t:"That sounds familiar.",k:"colloquial",m:"익숙한 얘기네요",tip:"상대 경험이 자기 경험과 겹칠 때 쓰는 짧은 공감입니다."}]},
  {s:"A",en:"That's how it feels, honestly. Like hiring someone brilliant with no context.",
   ko:"솔직히 그런 느낌입니다. 맥락이 전혀 없는 똑똑한 사람을 뽑은 것 같아요.",

  {s:"B",en:"Then treat it that way. What would you give a new analyst on day one?",

   notes:[{t:"treat it that way",k:"colloquial",m:"그런 식으로 대하다",tip:"비유를 실제 행동으로 옮기라고 권하는 말입니다."}]},
  {s:"A",en:"The goal, the audience, last quarter's version, and what we got wrong before.",
   ko:"목표, 보고 대상, 지난 분기 판본, 그리고 전에 뭘 틀렸는지요.",
   notes:[{t:"what we got wrong",k:"grammar",m:"우리가 무엇을 틀렸는지",tip:"what절로 실패 경험을 정리해 넘깁니다. 인수인계의 정석입니다."}]},
  {s:"B",en:"Then give it the same. Most bad output is really a briefing problem.",

   notes:[{t:"output",k:"business",m:"산출물, 결과물",tip:"input과 짝입니다. 사람과 기계 양쪽에 씁니다."}]},
  {s:"A",en:"People call that harness engineering now, rather than writing better prompts.",
   ko:"요즘은 그걸 더 나은 지시문 쓰기가 아니라 하네스 엔지니어링이라 부르더군요.",
   notes:[{t:"rather than ~",k:"grammar",m:"~이라기보다",tip:"두 개념을 가를 때의 기본 형태입니다."}]},
  {s:"B",en:"Is that a real distinction, or just a new name for the same thing?",
   ko:"그게 진짜 구분인가요, 아니면 같은 걸 새로 부르는 이름인가요?",
   notes:[{t:"Is that a real distinction?",k:"business",m:"그게 실질적인 구분입니까",tip:"유행어를 만났을 때 던지기 좋은 질문입니다."}]},
  {s:"A",en:"I think it's real. One is what you say; the other is the whole setup around it.",
   ko:"진짜라고 봅니다. 하나는 무엇을 말하느냐고, 다른 하나는 그 주변을 다 짜는 겁니다.",
   notes:[{t:"the setup around it",k:"collocation",m:"그것을 둘러싼 체계",tip:"도구·규칙·절차를 통칭합니다. set it up = 판을 짜다."}]},
  {s:"B",en:"Tools, rules, and somebody checking the result before it goes out.",
   ko:"도구, 규칙, 그리고 나가기 전에 결과를 확인하는 사람이군요.",
   notes:[{t:"go out",k:"phrasal",m:"(문서·결과물이) 나가다",tip:"before it goes out = 대외로 나가기 전에."}]},
  {s:"A",en:"Right. The instruction is maybe a tenth of whether it works.",
   ko:"맞습니다. 지시문은 성패의 10분의 1쯤일 겁니다.",
   notes:[{t:"a tenth of ~",k:"collocation",m:"~의 10분의 1",tip:"a third / a quarter / a tenth로 분수를 말합니다."}]},
  {s:"B",en:"Then where do you draw the line on what it decides by itself?",
   ko:"그럼 스스로 정하게 둘 범위는 어디에 선을 긋죠?",
   notes:[{t:"draw the line on ~",k:"idiom",m:"~에 대해 기준선을 긋다",tip:"Where do you draw the line? 기준을 묻는 정석 질문입니다."}]},
  {s:"A",en:"Anything reversible, it can do. Anything that reaches a customer, I sign.",
   ko:"되돌릴 수 있는 건 맡기고, 고객에게 닿는 건 제가 서명합니다.",
   notes:[{t:"reversible",k:"business",m:"되돌릴 수 있는",tip:"irreversible과 짝으로 씁니다. 권한 위임의 기준으로 매우 유용합니다."}]},
  {s:"B",en:"That's the same rule I'd give a junior, which is probably the point.",
   ko:"신입에게 줄 규칙과 같네요. 아마 그게 요점이겠죠.",
   notes:[{t:"which is probably the point",k:"colloquial",m:"아마 그게 요점이겠죠",tip:"앞말을 받아 결론을 가볍게 던지는 구어입니다."}]},
  {s:"A",en:"It is. The hard part was never the tool. It's knowing what good looks like.",
   ko:"그렇습니다. 어려운 건 도구가 아니었어요. 좋은 게 어떤 건지 아는 겁니다.",
   notes:[{t:"know what good looks like",k:"idiom",m:"좋은 결과가 어떤 것인지 안다",tip:"기준을 가진 사람만 검토할 수 있다는 뜻입니다. 실무에서 자주 인용됩니다."}]},
  {s:"B",en:"And that still lives in people, at least for now.",
   ko:"그리고 그건 아직 사람 안에 있죠. 적어도 지금까지는요.",
   notes:[{t:"live in ~",k:"collocation",m:"(능력·지식이) ~에 자리하다",tip:"The knowledge lives in three people. 조직 대화에서 즐겨 씁니다."}]}

{
 id:"w3d5", day:20, cat:"신기술·기술", level:"B2+",
 title:"Do We Still Need to Code?",
 titleKo:"코딩을 여전히 배워야 하는가 — 번역기 비유의 한계",
 names:{A:"Tae (기획, 비개발자)", B:"Noor (개발자)"},
 brief:[
  "프로그래밍 언어는 결국 <b>기계가 알아듣도록 만든 언어</b>입니다. 그래서 사람의 말을 코드로 옮기는 일을 <b>번역</b>에 비유하는 시각이 자연스럽게 나옵니다. 원하는 것을 말하면 도구가 옮겨 준다는 그림입니다.",
  "이 비유의 강점은 분명합니다. 예전에는 문법을 익히는 데 몇 년이 들었고, 그 문턱 때문에 아이디어가 <b>코드로 옮겨지지 못한 채</b> 사라졌습니다. 이제는 말로 설명하는 것만으로 움직이는 것이 나옵니다.",
  "약점도 분명합니다. 번역은 <b>무엇을 원하는지 아는 사람</b>이 있어야 성립합니다. 그리고 프로그램은 글과 달리 <b>틀리면 조용히 잘못 돌아갑니다</b>. 그때 필요한 것이 디버깅이고, 디버깅은 결국 「기계가 실제로 무엇을 하는가」를 읽는 일입니다.",
  "그래서 쟁점은 「언어를 외울 필요가 있는가」가 아니라 <b>어떤 개념을 알아야 하는가</b>로 옮겨 갑니다. 문법은 덜 중요해졌지만, 자료가 어떻게 흐르고 무엇이 어디서 깨지는지에 대한 감각은 그대로 필요합니다."
 ],
 lines:[
  {s:"A",en:"I've started to think of it as a translator between what I want and code.",
   ko:"저는 이걸 제가 원하는 것과 코드 사이의 번역기로 보게 됐습니다.",
   notes:[{t:"think of A as B",k:"grammar",m:"A를 B로 여기다",tip:"I think of it as a colleague. 비유를 꺼낼 때의 기본 형태입니다."}]},
  {s:"B",en:"That's a fair description of what it does. Where does the metaphor stop working?",
   ko:"하는 일에 대한 설명으로는 타당합니다. 그 비유는 어디서부터 안 맞을까요?",
   notes:[{t:"Where does it stop working?",k:"business",m:"어디서부터 안 맞습니까",tip:"비유나 규칙의 한계를 묻는 좋은 질문입니다."}]},
  {s:"A",en:"I'm not sure it does. A programming language is designed for machines anyway.",
   ko:"안 맞는 데가 있는지 모르겠습니다. 프로그래밍 언어는 어차피 기계용으로 만든 거니까요.",
   notes:[{t:"I'm not sure it does.",k:"colloquial",m:"그런 데가 있는지 모르겠습니다",tip:"앞 문장의 동사를 does로 받는 대동사 용법입니다."}]},
  {s:"B",en:"True. But translation assumes somebody already knows what they want said.",
   ko:"맞습니다. 그런데 번역은 무엇을 말할지 아는 사람이 있다고 전제하죠.",
   notes:[{t:"assume",k:"business",m:"전제하다",tip:"That assumes ~ 는 상대의 숨은 전제를 드러내는 반박 형태입니다."}]},
  {s:"A",en:"Fair enough. Though describing what I want is exactly the part I can do.",
   ko:"일리 있어요. 그래도 원하는 걸 설명하는 건 제가 할 수 있는 부분입니다.",
   notes:[{t:"Fair enough. Though ~",k:"grammar",m:"일리는 있습니다. 다만 ~",tip:"인정하고 단서를 다는 부드러운 반박 리듬입니다."}]},
  {s:"B",en:"Then try describing what should happen when two of your rules disagree.",
   ko:"그럼 규칙 두 개가 서로 어긋날 때 어떻게 되어야 하는지 설명해 보세요.",
   notes:[{t:"disagree",k:"business",m:"(규칙·자료가) 서로 어긋나다",tip:"사람만이 아니라 숫자에도 씁니다. The two reports disagree."}]},
  {s:"A",en:"That's a good example. I wouldn't have thought to specify that.",
   ko:"좋은 예네요. 그건 명시할 생각을 못 했을 겁니다.",
   notes:[{t:"specify",k:"business",m:"명확히 지정하다",tip:"specify the format / specify the conditions. 요건 정의의 동사입니다."}]},
  {s:"B",en:"That's most of programming, honestly. Deciding what happens in the odd cases.",
   ko:"솔직히 프로그래밍 대부분이 그겁니다. 이상한 경우에 어떻게 할지 정하는 것.",
   notes:[{t:"the odd cases",k:"collocation",m:"드물고 이상한 경우",tip:"edge cases와 같은 뜻입니다. 대부분의 버그가 여기서 나옵니다."}]},
  {s:"A",en:"Still, I'd rather describe those in Korean than learn the syntax first.",
   ko:"그래도 문법부터 배우느니 그걸 한국어로 설명하는 편이 낫겠습니다.",
   notes:[{t:"syntax",k:"business",m:"문법, 표기 규칙",tip:"언어의 형태 규칙입니다. semantics(의미)와 짝으로 알아 두세요."}]},
  {s:"B",en:"I agree with that part. The syntax was never the valuable bit.",
   ko:"그 부분은 동의합니다. 문법이 값어치 있던 적은 없어요.",
   notes:[{t:"the valuable bit",k:"colloquial",m:"정작 값어치 있는 부분",tip:"bit는 영국식 구어로 「부분」입니다. the tricky bit / the boring bit."}]},
  {s:"A",en:"So we agree. Nobody needs to memorize a language anymore.",
   ko:"그럼 동의하시는군요. 이제 언어를 외울 필요는 없습니다.",
   notes:[{t:"memorize",k:"collocation",m:"외우다",tip:"learn(익히다)과 구별됩니다. 여기서는 암기의 불필요함을 말합니다."}]},
  {s:"B",en:"Not quite. You don't need the grammar, but you need to read what it built.",
   ko:"꼭 그렇진 않습니다. 문법은 필요 없어도, 만들어진 걸 읽을 줄은 알아야죠.",
   notes:[{t:"Not quite.",k:"colloquial",m:"꼭 그렇지는 않습니다",tip:"전면 부정이 아닌 부분 부정입니다. 부드럽게 반박할 때 씁니다."}]},
  {s:"A",en:"Why, if it works? I can test the result without reading anything.",
   ko:"돌아가면 됐지 왜요? 아무것도 안 읽고 결과만 시험해 볼 수 있는데요.",
   notes:[{t:"Why, if it works?",k:"colloquial",m:"돌아가면 됐지 왜요",tip:"짧게 되받아 근거를 요구하는 구어입니다."}]},
  {s:"B",en:"Because code fails quietly. It keeps running and gives you a wrong number.",
   ko:"코드는 조용히 실패하니까요. 계속 돌면서 틀린 숫자를 내줍니다.",
   notes:[{t:"fail quietly",k:"idiom",m:"티 나지 않게 잘못되다",tip:"오류 메시지 없이 잘못 도는 상태입니다. 실무에서 가장 위험한 실패입니다."}]},
  {s:"A",en:"That's the part that worries me, actually. I'd never know it was wrong.",
   ko:"사실 저를 걱정시키는 게 그겁니다. 틀렸는지 알 길이 없죠.",
   notes:[{t:"That's the part that worries me.",k:"colloquial",m:"저를 걱정시키는 건 그 부분입니다",tip:"여러 쟁점 중 하나를 짚어 앞세우는 말입니다."}]},
  {s:"B",en:"So learn concepts, not languages. How data moves, and where it breaks.",
   ko:"그럼 언어가 아니라 개념을 배우세요. 자료가 어떻게 흐르고 어디서 깨지는지.",
   notes:[{t:"concepts, not languages",k:"collocation",m:"언어가 아니라 개념",tip:"A, not B 형태로 학습의 초점을 옮깁니다."}]},
  {s:"A",en:"That sounds like a much shorter list than I was expecting.",
   ko:"제가 예상했던 것보다 훨씬 짧은 목록 같네요.",
   notes:[{t:"a shorter list than ~",k:"collocation",m:"~보다 짧은 목록",tip:"학습 부담이 줄었다는 것을 구체적으로 표현합니다."}]},
  {s:"B",en:"It is shorter. It just isn't empty, which is what people keep claiming.",
   ko:"짧은 건 맞습니다. 다만 비어 있진 않아요. 사람들이 계속 그렇게 주장하지만요.",
   notes:[{t:"It just isn't empty.",k:"colloquial",m:"다만 아예 없는 건 아닙니다",tip:"과장된 주장을 깎아 내리는 짧은 반박입니다."}]},
  {s:"A",en:"Then I'll keep building things and read enough to argue with the result.",
   ko:"그럼 계속 만들면서, 결과와 다툴 수 있을 만큼은 읽겠습니다.",

  {s:"B",en:"That's the right level. You don't need to write it to question it.",

{
 id:"w3d6", day:21, cat:"공급망·현지화", level:"B2+",
 title:"Make Where You Sell",
 titleKo:"파는 곳에서 만들기 — 현지화는 비용인가 보험인가",
 names:{A:"Hyun (구매 총괄)", B:"Dana (현지 법인장)"},
 brief:[
  "지난 30년의 공급망은 하나의 질문만 물었습니다. <b>어디서 만들면 가장 쌉니까.</b> 그 답을 따라 공장이 옮겨 다녔고, 재고는 얇아졌으며, 배는 정확히 제때 도착한다는 전제 위에 모든 계획이 올라섰습니다.",
  "그 전제가 몇 번 깨졌습니다. 항구가 막히고, 국경이 닫히고, 관세가 하룻밤에 바뀌었습니다. 그래서 요즘 회사들이 던지는 질문이 바뀌었습니다. <b>가장 싼 곳</b>이 아니라 <b>끊겨도 견디는 구조</b>를 묻습니다.",
  "대안은 대체로 셋입니다. 같은 부품을 여러 나라에서 사는 <b>다중 소싱</b>, 파는 시장 안에서 만드는 <b>현지화</b>, 그리고 그냥 재고를 더 쌓는 것. 셋 다 돈이 듭니다. 그래서 논쟁은 「할 것인가」가 아니라 <b>얼마를 보험료로 낼 것인가</b>가 됩니다.",
  "이 대화에서 유용한 것은 결론이 아니라 <b>비용을 보험으로 바꿔 말하는 언어</b>입니다. 「비싸다」를 「무엇에 대한 대가인가」로 되묻는 문장들을 익혀 두면, 어떤 투자 논의에서도 그대로 쓸 수 있습니다."
 ],
 lines:[
  {s:"A",en:"For thirty years we asked one question. Where can we make this cheapest?",
   ko:"30년 동안 우리는 질문 하나만 했습니다. 어디서 만들면 제일 쌀까?",
   notes:[{t:"For thirty years we asked one question.",k:"grammar",m:"30년간 우리는 질문 하나만 던졌습니다",tip:"기간 + 과거형으로 「끝난 시대」를 선언하는 도입부입니다."},
          {t:"make it cheapest",k:"collocation",m:"가장 싸게 만들다",tip:"최상급을 부사처럼 씁니다. build it fastest 도 같은 형태입니다."}]},
  {s:"B",en:"And it worked beautifully, right up until the ships stopped arriving on time.",
   ko:"그리고 통했죠. 배가 제때 도착하지 않기 시작하기 전까지는요.",
   notes:[{t:"It worked, until ~",k:"grammar",m:"통했습니다, ~ 하기 전까지는",tip:"전제가 언제 깨졌는지 짚는 반박 형태입니다."},
          {t:"arrive on time",k:"collocation",m:"제때 도착하다",tip:"on time(정시에)과 in time(늦지 않게)은 다릅니다."}]},
  {s:"A",en:"One bad quarter doesn't undo thirty good years of buying at the lowest price.",
   ko:"나쁜 분기 하나가 싸게 사 온 좋은 30년을 없던 일로 만들지는 않습니다.",
   notes:[{t:"undo",k:"business",m:"없던 일로 만들다, 되돌리다",tip:"One mistake doesn't undo the record. 강한 반박 동사입니다."}]},
  {s:"B",en:"It wasn't one quarter. We missed the season twice in three years.",
   ko:"한 분기가 아니었습니다. 3년에 두 번 시즌을 놓쳤어요.",
   notes:[{t:"miss the season",k:"idiom",m:"성수기를 놓치다",tip:"팔릴 시점에 물건이 없었다는 뜻입니다. 유통에서 최악의 실패입니다."}]},
  {s:"A",en:"Point taken. But making it here costs us about eighteen percent more per unit.",
   ko:"인정합니다. 그래도 여기서 만들면 18퍼센트쯤 더 듭니다.",
   notes:[{t:"Point taken.",k:"colloquial",m:"일리 있습니다, 인정합니다",tip:"상대 지적을 짧게 받아들이고 반론을 이어 가는 말입니다."},
          {t:"cost us X percent more",k:"collocation",m:"우리에게 X퍼센트 더 들다",tip:"증가분을 말할 때의 기본 틀입니다."}]},
  {s:"B",en:"More than what, though? You're comparing it to a year that went well.",
   ko:"그런데 뭐보다 더요? 잘 풀린 해와 비교하고 계시잖아요.",
   notes:[{t:"More than what, though?",k:"colloquial",m:"그런데 뭐에 비해서요?",tip:"비교 대상을 드러내라고 되묻는 짧은 반문입니다."}]},
  {s:"A",en:"Against our normal cost. That's the only number I can budget against.",
   ko:"평상시 원가 대비죠. 제가 예산을 잡을 수 있는 숫자는 그것뿐입니다.",
   notes:[{t:"budget against",k:"business",m:"~을 기준으로 예산을 잡다",tip:"against는 「기준으로 삼아」라는 뜻으로 자주 쓰입니다."}]},
  {s:"B",en:"Then your budget quietly assumes that nothing goes wrong. That's an expensive assumption.",
   ko:"그럼 예산이 아무 일도 안 생긴다고 전제하는 거네요. 비싼 전제입니다.",
   notes:[{t:"an expensive assumption",k:"idiom",m:"대가가 큰 전제",tip:"틀렸을 때 손실이 크다는 뜻입니다. 회의에서 힘이 센 표현입니다."}]},
  {s:"A",en:"So call it insurance. Fine. What am I actually buying for eighteen percent?",
   ko:"그럼 보험이라고 하죠. 좋습니다. 18퍼센트로 제가 사는 게 정확히 뭡니까?",
   notes:[{t:"What am I buying for X?",k:"business",m:"X를 내고 제가 사는 것이 무엇입니까",tip:"비용을 편익으로 되묻는 아주 실용적인 질문입니다."}]},
  {s:"B",en:"Two weeks instead of eleven, and a border that can't close on you.",
   ko:"11주 대신 2주, 그리고 닫힐 수 없는 국경입니다.",
   notes:[{t:"A instead of B",k:"grammar",m:"B 대신 A",tip:"개선을 숫자 대 숫자로 보여 주는 가장 간단한 형태입니다."},
          {t:"a border that can't close on you",k:"idiom",m:"막힐 걱정이 없는 국경",tip:"close on someone은 「누군가에게 불리하게 닫히다」입니다."}]},
  {s:"A",en:"That matters more than I like to admit. Our lead time is the complaint.",
   ko:"인정하기 싫지만 그게 중요하긴 합니다. 우리 리드타임이 늘 불만거리죠.",
   notes:[{t:"more than I like to admit",k:"idiom",m:"인정하고 싶은 것보다 더",tip:"솔직하게 물러설 때 쓰는 부드러운 양보 표현입니다."},
          {t:"lead time",k:"business",m:"주문에서 납품까지 걸리는 시간",tip:"제조와 유통 회의의 핵심 단어입니다."}]},
  {s:"B",en:"Then price the complaint. What does a late shipment cost in lost orders?",
   ko:"그럼 그 불만에 값을 매기세요. 늦은 선적 한 번이 잃은 주문으로 얼마죠?",
   notes:[{t:"price something",k:"business",m:"~에 값을 매기다, 비용을 계산하다",tip:"추상적인 위험을 숫자로 바꾸라는 요구입니다."}]},
  {s:"A",en:"We've never measured that, to be honest. We only measure what we spend.",
   ko:"그건 재 본 적이 없습니다. 우리는 쓰는 돈만 재요.",
   notes:[{t:"We only measure what we spend.",k:"grammar",m:"우리는 쓰는 돈만 측정합니다",tip:"what절을 목적어로 쓰는 형태입니다. 사고의 사각지대를 지적합니다."}]},
  {s:"B",en:"That's why cheap always wins. The other side of the ledger is invisible.",
   ko:"그래서 늘 싼 쪽이 이깁니다. 장부의 반대편이 안 보이니까요.",
   notes:[{t:"the other side of the ledger",k:"idiom",m:"장부의 반대편, 드러나지 않는 쪽",tip:"비용은 보이고 편익은 안 보이는 상황을 가리킵니다."}]},
  {s:"A",en:"I'd rather not move everything at once, though. That's a huge bet.",
   ko:"그래도 전부를 한꺼번에 옮기고 싶진 않습니다. 그건 큰 도박이에요.",
   notes:[{t:"I'd rather not ~",k:"grammar",m:"~ 하지 않는 편이 좋겠습니다",tip:"거절을 부드럽게 만드는 기본 표현입니다."},
          {t:"a huge bet",k:"idiom",m:"큰 도박, 위험한 베팅",tip:"되돌릴 수 없는 결정을 가리킬 때 씁니다."}]},
  {s:"B",en:"Nobody's asking you to move everything. Move only the parts that stop the line.",
   ko:"아무도 그러라고 안 합니다. 라인을 멈추게 하는 부품만 옮기세요.",
   notes:[{t:"Nobody's asking you to move everything.",k:"colloquial",m:"아무도 전부 옮기라고 하지 않습니다",tip:"상대가 과장한 요구를 되돌려 놓는 말입니다."},
          {t:"stop the line",k:"idiom",m:"생산 라인을 멈추게 하다",tip:"없으면 전체가 멈추는 병목 부품을 가리킵니다."}]},
  {s:"A",en:"That's maybe six items out of four hundred. I could defend that.",
   ko:"400개 중 여섯 개쯤이겠네요. 그 정도는 방어할 수 있습니다.",
   notes:[{t:"I could defend that.",k:"business",m:"그 정도면 (윗선에) 설명해 낼 수 있습니다",tip:"승인받을 자신이 있다는 실무 표현입니다."}]},
  {s:"B",en:"Then start there, and after two quarters let the numbers argue for the rest.",
   ko:"그럼 거기서 시작하고, 나머지는 숫자가 대신 말하게 하세요.",
   notes:[{t:"let the numbers argue",k:"idiom",m:"숫자가 대신 설득하게 하다",tip:"작게 시작해 실적으로 확대하자는 제안입니다."}]},
  {s:"A",en:"One thing first. If it turns out cheaper was right, we go back.",
   ko:"먼저 하나만요. 싼 쪽이 맞았다고 판명되면 되돌립니다.",
   notes:[{t:"If it turns out ~",k:"grammar",m:"~ 로 밝혀지면",tip:"결과가 드러난 뒤를 가정하는 형태입니다. turn out = 알고 보니 ~ 이다."}]},
  {s:"B",en:"Agreed, and put a date on that review. Otherwise it never happens.",
   ko:"동의합니다. 그리고 그 검토에 날짜를 박아 두세요. 안 그러면 안 하게 됩니다.",
   notes:[{t:"put a date on it",k:"idiom",m:"날짜를 못 박다",tip:"막연한 합의를 실행 가능한 약속으로 바꾸는 말입니다."},
          {t:"Otherwise it never happens.",k:"colloquial",m:"안 그러면 결국 안 하게 됩니다",tip:"현실적인 경고를 짧게 던지는 마무리입니다."}]}
 ],
 keys:[
  {en:"Point taken.",ko:"일리 있습니다, 인정합니다",ex:"Point taken, but the cost still has to be paid by someone."},
  {en:"an expensive assumption",ko:"대가가 큰 전제",ex:"Assuming the border stays open is an expensive assumption."},
  {en:"lead time",ko:"주문에서 납품까지 걸리는 시간",ex:"We cut lead time from eleven weeks to two."},
  {en:"price something",ko:"~에 값을 매기다",ex:"Nobody has priced what a missed season actually costs us."},
  {en:"the other side of the ledger",ko:"장부의 드러나지 않는 쪽",ex:"Cheap always wins because the other side of the ledger is invisible."},

 ],

 ]

{
 id:"w3d7", day:22, cat:"심리·정체성", level:"B2+",
 title:"The Person You Invent",
 titleKo:"우리가 만들어 내는 또 하나의 나 — 가면과 정체성",
 names:{A:"Ren (작가)", B:"Iris (임상심리 전공)"},
 brief:[
  "「파이트 클럽」이 오래 회자되는 이유는 반전 때문만이 아닙니다. 사람들이 <b>자기가 되고 싶었던 인물을 만들어 내고, 결국 그쪽에 끌려다니는</b> 경험을 어렴풋이 알고 있기 때문입니다.",
  "심리학은 이것을 훨씬 조심스럽게 다룹니다. 임상적 해리 장애는 드물고, 대개 심각한 외상과 연결됩니다. 반면 <b>상황마다 다른 얼굴을 쓰는 것</b>은 병이 아니라 거의 모든 사람이 하는 일입니다.",
  "그래서 흥미로운 질문은 「가면을 쓰는가」가 아닙니다. <b>가면을 벗을 수 있는가</b>, 그리고 <b>여러 얼굴이 서로를 알고 있는가</b>입니다. 회사에서의 나와 집에서의 나가 서로를 부끄러워하기 시작하면 문제가 됩니다.",
  "이 대화는 <b>영화 이야기에서 시작해 자기 이야기로 내려가는</b> 전형적인 영어 대화의 흐름을 담고 있습니다. 소재를 바꿔도 그대로 쓸 수 있는 문장들이 많으니, 흐름 자체를 통째로 익혀 두세요."
 ],
 lines:[
  {s:"A",en:"I rewatched Fight Club last night, and it landed completely differently this time.",
   ko:"어젯밤에 파이트 클럽을 다시 봤는데, 이번엔 완전히 다르게 다가왔어요.",
   notes:[{t:"it landed differently",k:"idiom",m:"다르게 다가왔다, 느낌이 달랐다",tip:"작품이나 말이 받아들여진 방식을 말합니다. That joke didn't land."},
          {t:"rewatch",k:"collocation",m:"다시 보다",tip:"re- 접두사는 read, run, write 등에 자유롭게 붙습니다."}]},
  {s:"B",en:"At twenty it's a fantasy about freedom. Later it reads as a warning.",
   ko:"스무 살에는 자유에 대한 판타지죠. 나중엔 경고문으로 읽힙니다.",
   notes:[{t:"it reads as ~",k:"grammar",m:"~ 로 읽힌다",tip:"작품이나 문서의 인상을 말하는 수동적 표현입니다."},
          {t:"a warning",k:"collocation",m:"경고, 경고 사례",tip:"a cautionary tale 도 같은 맥락에서 자주 쓰입니다."}]},
  {s:"A",en:"What struck me is that he doesn't invent a stranger. He invents himself.",
   ko:"인상 깊었던 건, 그가 낯선 사람을 만든 게 아니라 자기 자신을 만든다는 점이에요.",
   notes:[{t:"What struck me is that ~",k:"grammar",m:"제게 인상 깊었던 건 ~ 라는 점입니다",tip:"감상을 앞세우는 아주 유용한 도입 형태입니다."}]},
  {s:"B",en:"The version he wishes he were. That's what makes it uncomfortable to watch.",
   ko:"자기가 그랬으면 하는 버전이죠. 그래서 보기 불편한 겁니다.",
   notes:[{t:"the version he wishes he were",k:"grammar",m:"그가 그랬으면 하는 버전",tip:"wish + 과거형은 현재의 반대되는 소망입니다."},
          {t:"uncomfortable to watch",k:"collocation",m:"보기 불편한",tip:"hard to watch 보다 조금 더 심리적인 뉘앙스입니다."}]},
  {s:"A",en:"So is that what a split personality actually looks like in real life?",
   ko:"그럼 실제 다중 인격이라는 게 현실에서는 그런 모습인가요?",
   notes:[{t:"Is that what X looks like?",k:"grammar",m:"X가 실제로 그런 모습입니까",tip:"비유를 현실과 대조하며 묻는 형태입니다."}]},
  {s:"B",en:"Not really, no. The clinical version is rare and usually rooted in trauma.",
   ko:"사실은 아닙니다. 임상적인 쪽은 드물고 대개 외상에 뿌리를 두고 있어요.",
   notes:[{t:"Not really, no.",k:"colloquial",m:"사실은 아닙니다",tip:"부드럽게 부정하고 설명을 이어 가는 구어입니다."},
          {t:"rooted in ~",k:"idiom",m:"~ 에 뿌리를 둔",tip:"원인을 깊은 곳에 두는 표현입니다. rooted in fear / in history."}]},
  {s:"A",en:"Then why does everybody recognize something in it? That can't be a coincidence.",
   ko:"그런데 왜 다들 거기서 뭔가를 알아볼까요? 우연일 리는 없잖아요.",
   notes:[{t:"That can't be a coincidence.",k:"colloquial",m:"우연일 리 없습니다",tip:"패턴을 발견했다고 주장할 때의 짧은 문장입니다."}]},
  {s:"B",en:"Because switching faces is ordinary. You're not the same person at work as at home.",
   ko:"얼굴을 바꿔 쓰는 게 평범한 일이니까요. 회사에서의 당신은 같은 사람이 아니죠.",
   notes:[{t:"switch faces",k:"idiom",m:"상황에 따라 다른 얼굴을 쓰다",tip:"가면을 바꾸는 이미지입니다. wear a different hat 도 비슷합니다."},
          {t:"ordinary",k:"business",m:"평범한, 흔한",tip:"normal보다 「특별할 것 없다」는 뉘앙스가 강합니다."}]},
  {s:"A",en:"I'd argue that's just manners, though. Everyone adjusts to the room they're in.",
   ko:"그건 그냥 예의 아닌가요. 다들 그 자리에 맞춰 조절하잖아요.",
   notes:[{t:"I'd argue that ~",k:"business",m:"저라면 ~ 라고 보겠습니다",tip:"단정 대신 자기 견해임을 밝히는 정중한 반박입니다."},
          {t:"adjust to the room",k:"idiom",m:"자리 분위기에 맞추다",tip:"read the room(분위기를 읽다)과 짝으로 익혀 두세요."}]},
  {s:"B",en:"It is, right up to the point where you can't take the mask off.",
   ko:"맞습니다. 가면을 벗을 수 없게 되는 지점 전까지는요.",
   notes:[{t:"right up to the point where ~",k:"grammar",m:"~ 하는 지점 바로 전까지는",tip:"동의한 뒤 한계선을 긋는 강력한 형태입니다."},
          {t:"take the mask off",k:"idiom",m:"가면을 벗다",tip:"put on a mask 와 짝으로 씁니다."}]},
  {s:"A",en:"How would I even notice that, though? It wouldn't feel like a mask.",

 brief:[
  "중년의 위기를 흔히 <b>후회</b>의 문제로 설명합니다. 그러나 겪는 사람들의 말을 들어 보면, 후회보다 자주 나오는 단어는 <b>좁아짐</b>입니다. 예전에는 열려 있던 문들이 하나씩 조용히 닫힙니다.",

  "반대편의 주장도 있습니다. 선택지가 줄어드는 대신 <b>선택의 질</b>이 올라간다는 것입니다. 무엇을 잘하고 무엇을 못하는지 알고, 어떤 사람과 시간을 보내야 하는지 압니다. 스무 살에는 없던 정보입니다.",
  "이 대화는 <b>인생 이야기를 감정적으로 흐르지 않게 말하는 법</b>을 연습하기 좋습니다. 비유(문·방·산수)를 하나 잡고 끝까지 밀고 가는 방식은 영어 대화에서 매우 효과적이니 그대로 가져가 보세요."
 ],

{
 id:"w3d9", day:24, cat:"문화·스타일", level:"B2+",
 title:"Why Italians Dress Well",
 titleKo:"이탈리아 남자들은 왜 옷을 잘 입는가 — 스프레차투라의 경제학",
 names:{A:"Marco (밀라노 출신)", B:"Joon (서울, 패션 무관심)"},
 brief:[
  "「이탈리아 남자는 옷을 잘 입는다」는 말은 흔하지만, 설명은 대개 취향 이야기에서 멈춥니다. 실제 이유의 상당 부분은 <b>산업</b>에 있습니다. 이탈리아 북부는 수백 년 동안 유럽의 직물 생산지였습니다.",
  "좋은 원단이 가까이 있으면 <b>옷값의 구조</b>가 달라집니다. 재단사가 많고, 수선이 싸고, 좋은 옷을 오래 입는 것이 합리적인 선택이 됩니다. 취향은 그 위에서 자랍니다.",
  "여기에 <b>스프레차투라</b>라는 개념이 붙습니다. 애써 노력한 티가 나지 않게 잘 해내는 태도입니다. 옷에서는 「신경 쓴 티 안 나게 신경 쓴」 상태를 뜻합니다. 이 개념 자체가 아주 좋은 영어 대화 소재입니다.",
  "이 대화는 <b>문화적 일반화를 조심스럽게 다루는 법</b>도 함께 연습합니다. 「~ 하는 경향이 있다」, 「그건 과장이다」 같은 표현을 익혀 두면, 국가나 세대를 두고 이야기할 때 훨씬 안전하고 설득력 있게 말할 수 있습니다."

{
 id:"w3d10", day:25, cat:"사상·미래", level:"C1",
 title:"When Abundance Stops Being the Plan",
 titleKo:"풍요가 더 이상 계획이 아닐 때 — 희소성의 정치학",
 names:{A:"Elena (정치철학 연구자)", B:"Tomas (테크 업계)"},
 brief:[
  "전후 70년의 기본 가정은 <b>파이가 계속 커진다</b>는 것이었습니다. 성장하면 나눌 것이 늘고, 그러면 분배 논쟁도 견딜 만해집니다. 민주주의의 여유는 상당 부분 이 가정 위에 있었습니다.",
  "최근 몇 년, 그 가정을 <b>내려놓은 사람들</b>이 눈에 띕니다. 에너지, 인구, 반도체, 물처럼 늘리기 어려운 것들을 앞세우며, 성장이 아니라 <b>확보</b>를 말합니다. 파이가 고정이라면 논리적 귀결은 「내 몫을 지키는 것」입니다.",
  "여기서 한 걸음 더 나간 흐름이 <b>다크 인라이튼먼트</b>로 불리는 사상입니다. 민주적 절차가 느리고 비효율적이니 유능한 소수가 결정해야 한다는 주장입니다. 소수의 견해지만, 영향력 있는 곳에서 인용된다는 점이 논쟁거리입니다.",
  "이 대화의 목적은 편을 정하는 것이 아니라, <b>불편한 사상을 정확하게 요약하고 반박하는 영어</b>를 익히는 것입니다. 「그 논리를 끝까지 밀면 어떻게 되는가」를 묻는 문장들에 특히 주목하세요."
 ],
 lines:[
  {s:"A",en:"For seventy years we argued about distribution because we assumed growth.",

let VOICES = [];
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en(-|_|$)/i.test(v.lang));
  if(!VOICES.length) VOICES = all;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); }; }
function pickVoice(who){
  const want = who==="B" ? S.cfg.voiceB : S.cfg.voiceA;
  let v = VOICES.find(x=>x.name===want);
  if(!v){
    const f = VOICES.filter(x=>/female|zira|aria|jenny|samantha|karen|libby|sonia/i.test(x.name));
    const m = VOICES.filter(x=>/male|david|guy|ryan|daniel|alex|mark/i.test(x.name));
    v = who==="B" ? (m[0]||VOICES[1]||VOICES[0]) : (f[0]||VOICES[0]);
  }
  return v;
}
let speakingSeq = null, autoTok = null;
function stopSpeak(){ speakingSeq=null; autoTok=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
function speak(text, who, rate, cb){
  if(!window.speechSynthesis){ toast("이 브라우저는 음성 재생을 지원하지 않습니다"); cb&&cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
  u.rate = rate || S.cfg.rate; u.pitch = who==="B" ? 0.95 : 1.05;
  u.onend = ()=> cb && cb();
  u.onerror = ()=> cb && cb();
  speechSynthesis.speak(u);
}
function speakSeq(items, rate, onStep, onDone){
  const token = {}; speakingSeq = token;
  let i = 0;
  (function step(){
    if(speakingSeq!==token) return;
    if(i>=items.length){ onDone&&onDone(); return; }
    onStep && onStep(i);
    speak(items[i].en, items[i].s, rate, ()=>{ i++; setTimeout(step, 260); });
  })();
}

/* 새 끊어읽기 — 「덩어리 수를 먼저 정하고, 끊어도 되는 자리에서만 끊는다」

   예전 방식은 접속사와 쉼표를 만날 때마다 끊고, 10단어가 넘으면 가운데를 억지로
   갈랐다. 그래서 평균 3.5덩어리가 나왔고, 무엇보다 for a / while now 처럼
   구 한가운데가 잘렸다. 쉐도잉은 숨을 쉬는 자리에서 끊어야 의미가 있다. */
function chunkify(s){
  const toks = String(s).trim().split(/\s+/).filter(Boolean);
  const W = toks.length;
  /* 한 덩어리가 12단어 안팎이 되도록 목표 수를 먼저 정한다. 최대 세 덩어리. */
  const target = Math.min(3, Math.ceil(W / 12));
  if(target <= 1) return [toks.join(" ")];

  const MIN = 4;                                   // 덩어리는 최소 네 단어
  const clean = w => w.replace(/[^\w']/g, "").toLowerCase();
  const SUB  = /^(but|because|so|although|though|while|unless|whereas|since|before|after|until|once|if|whether|provided)$/;
  const REL  = /^(which|that|when|where|who|whose)$/;
  const COORD= /^(and|or|yet)$/;                   // 등위접속 — 마땅한 자리가 없을 때만
  const PREP = /^(in|on|at|of|for|to|with|from|about|into|by|over|under|through|without|against|between)$/;

  /* i번째 단어 앞에서 끊을 때의 점수. 음수면 그 자리에서는 끊지 않는다. */
  function score(i){
    if(i < MIN || W - i < MIN) return -1;
    const prev = toks[i-1], w = clean(toks[i]);
    if(/[.!?]["')\]]?$/.test(prev)) return 100;    // 문장이 끝난 자리
    if(/[;:—]$/.test(prev))         return 90;
    if(/,$/.test(prev))             return 80;     // 쉼표 뒤
    if(SUB.test(w))                 return 60;     // 접속사 앞
    if(REL.test(w))                 return 50;     // 관계사 앞
    if(COORD.test(w))               return 40;     // 등위접속 앞
    /* 전치사구가 시작되는 자리. 앞뒤로 충분히 길 때만 쓴다 —
       마땅한 자리가 없는 긴 문장을 통째로 두지 않기 위한 마지막 수단이다. */
    if(PREP.test(w) && i >= 5 && W - i >= 5) return 30;
    return -1;                                     // 그 밖에는 끊지 않는다
  }

  const cuts = [];
  for(let k = 1; k < target; k++){
    const ideal = Math.round(W * k / target);
    let best = -1, bestVal = 0;
    for(let i = 1; i < W; i++){
      const sc = score(i);
      if(sc < 0) continue;
      if(cuts.some(c => Math.abs(c - i) < MIN)) continue;   // 이미 고른 자리와 너무 붙지 않게
      const val = sc - Math.abs(i - ideal) * 6;             // 고른 자리에 가까울수록 좋다
      if(val > bestVal){ bestVal = val; best = i; }
    }
    if(best > 0) cuts.push(best);
  }
  if(!cuts.length) return [toks.join(" ")];        // 끊을 자리가 마땅찮으면 통째로 둔다

  cuts.sort((a,b)=>a-b);
  const out = []; let prev = 0;
  cuts.concat([W]).forEach(c => { out.push(toks.slice(prev, c).join(" ")); prev = c; });
  return out;
}

/* ---------- 새 회차 자동 반영 ----------
   서비스워커가 새 본문을 받아 두면 여기에 표시해 둔다. 훈련 중이거나
   자료를 붙여넣는 중에 화면을 새로 고치면 하던 것이 날아가므로,
   그 두 자리에서만 기다렸다가 빠져나오는 순간 알아서 갈아 끼운다. */
let pendingUpdate = false;
function applyUpdate(){
  if(!pendingUpdate) return;
  if(cur.view==="session" || cur.view==="add") return;
  pendingUpdate = false;
  location.reload();
}

function startSession(id, resume){
  stopSpeak();
  const sp = (resume && S.spot && S.spot.dayId===id) ? S.spot : null;
  cur.dayId=id; cur.chunk=-1; cur.showKo=S.cfg.showKo;
  cur.step = sp ? Math.max(0, Math.min(sp.step, STEPS.length-1)) : 0;
  cur.line = sp ? Math.max(0, sp.line||0) : 0;
  const dd = dayById(id); if(dd) cur.line = Math.min(cur.line, dd.lines.length-1);
  cur.reps = (S.prog[id]&&S.prog[id].reps) ? S.prog[id].reps : {};
  cur.t0 = Date.now();
  clearInterval(cur.tick); cur.tick = setInterval(updClock, 1000);
  go("session");
}
function elapsedMin(){ return Math.max(0, Math.round((Date.now()-cur.t0)/60000)); }
function updClock(){
  const el = $("#clock"); if(!el) return;
  const s = Math.floor((Date.now()-cur.t0)/1000);
  el.textContent = pad(Math.floor(s/60))+":"+pad(s%60);
  el.classList.toggle("over", s>SESS_MIN*60);
}
function endSession(){ clearInterval(cur.tick); stopSpeak(); }

function streakInfo(){
  const days = Object.keys(S.log).sort();
  let total=0, mins=0, lines=0;
  days.forEach(d=>{ total++; mins+=S.log[d].min||0; lines+=S.log[d].lines||0; });
  let st=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10);
    if(S.log[key]){ st++; d.setDate(d.getDate()-1); }
    else if(st===0 && key===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(st>999) break;
  }
  return {total, mins, lines, streak:st};
}

       '시간이 없으면 <b>쉐도잉 단계만</b> 해도 효과의 대부분이 나옵니다. '+

  /* 목록에서 골라도, 그 회차가 멈춘 자리라면 그 자리에서 이어 간다 */
  document.querySelectorAll(".ditem").forEach(el=> el.onclick = ()=>
    startSession(el.dataset.id, !!(sp && sp.dayId===el.dataset.id)));

/* ---------- 세션 ---------- */
function renderSession(){
  const d = dayById(cur.dayId); if(!d){ go("home"); return; }
  const st = STEPS[cur.step];
  let h = "";
  h += '<div class="steps">'+STEPS.map((s,i)=>'<div class="'+(i<cur.step?"past":i===cur.step?"on":"")+'"></div>').join("")+'</div>';
  h += '<div class="sesshead"><span class="tag a">DAY '+d.day+'</span><span class="stepname">'+(cur.step+1)+'. '+st.n+'<em>권장 '+st.m+'분 · '+st.d+'</em></span>';
  h += '<span class="clock" id="clock">00:00</span></div>';
  h += '<div id="stepbody"></div>';
  $("#view-session").innerHTML = h;
  updClock();
  ({listen:stepListen, shadow:stepShadow, output:stepOutput})[st.k](d);
  renderFoot(d);
}
function renderFoot(d){
  const last = cur.step===STEPS.length-1;
  let h = '<button class="btn ghost sm" id="fPrev" title="이전 단계">←</button>';
  h += '<span class="sub" style="font-size:12px">'+(cur.step+1)+'/'+STEPS.length+'</span>';
  h += '<span style="flex:1"></span>';
  h += '<button class="btn ghost sm" id="fSave">📌 여기까지 저장</button>';
  h += '<button class="btn '+(last?"red":"")+'" id="fNext">'+(last?"훈련 완료 ✓":"다음 →")+'</button>';
  $("#footin").innerHTML = h;
  $("#fPrev").onclick = ()=>{ if(cur.step>0){ stopSpeak(); cur.step--; renderSession(); } };
  $("#fSave").onclick = saveAndExit;
  $("#fNext").onclick = ()=>{
    stopSpeak();
    if(cur.step<STEPS.length-1){ cur.step++; renderSession(); }
    else finishSession(d);
  };
  $("#fPrev").disabled = cur.step===0;
}
/* ---------- 여기까지 하고 저장 ----------
   20분을 한 자리에서 다 내지 못하는 날이 많다. 어디까지 했는지 적어 두고,
   다음에 열면 홈의 「이어서 하기」로 그 단계, 그 문장에서 다시 시작한다.
   따라 읽을 때마다(bumpRep) 불리므로 자리는 늘 최신이다. */
function saveProgress(){
  if(!cur.dayId) return false;
  const p = S.prog[cur.dayId] || {};
  p.reps = cur.reps; p.stepIdx = cur.step;
  S.prog[cur.dayId] = p;
  /* 한 번 끝낸 회차를 다시 볼 때도 자리는 남긴다.
     복습하다 멈추는 일이 오히려 더 잦다. */
  S.spot = { dayId:cur.dayId, step:cur.step, line:cur.line, at:Date.now() };
  save();
  return true;
}
function saveAndExit(){
  /* 저장했다고 말만 하고 안 남으면 다음에 열었을 때 사람만 헛걸음한다.
     실제로 적혔는지 읽어 보고 나서 알린다. */
  const kept = saveProgress() && store.get("spot", null);
  toast(kept ? "여기까지 저장했습니다. 다음에 열면 이어집니다."
             : "저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.");
  go("home");
}
/* 버튼을 누르지 않고 그냥 화면을 덮거나 앱을 내려도 자리를 잃지 않게 한다 */
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && cur.view==="session") saveProgress(); });
window.addEventListener("pagehide", ()=>{ if(cur.view==="session") saveProgress(); });
function finishSession(d){
  const p = S.prog[d.id] || {}; p.reps=cur.reps; p.done=true; p.doneAt=today(); S.prog[d.id]=p;
  /* 끝낸 회차의 자리만 지운다. 다른 회차에 멈춰 둔 자리는 그대로 둔다. */
  if(S.spot && S.spot.dayId===d.id) S.spot=null;
  const t = today(); const prev = S.log[t] || {min:0, lines:0};
  const repLines = Object.keys(cur.reps).filter(k=>cur.reps[k]>0).length;
  S.log[t] = { dayId:d.id, min: prev.min + Math.max(1, elapsedMin()), lines: prev.lines + repLines, ts: Date.now() };
  save(); endSession();
  const info = streakInfo();
  $("#view-session").innerHTML =
    '<div class="hd" style="margin-top:30px"><small>Session complete</small>오늘 훈련 완료</div>'+
    '<div class="card"><div style="font-family:var(--serif);font-size:22px">'+esc(d.title)+'</div>'+
    '<div class="sub" style="margin:6px 0 14px">'+d.titleKo+'</div>'+
    '<div class="streak"><div><b>'+elapsedMin()+'</b><span>오늘 분</span></div><div><b>'+repLines+'</b><span>따라 읽은 문장</span></div>'+
    '<div><b>'+info.streak+'</b><span>연속일</span></div></div>'+
    '<div class="rule"></div><div class="sub">내일 첫 단계에서 오늘 표현 8개를 다시 물어봅니다. 그때 <b>보지 않고</b> 말해 보세요.</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="cHome">홈으로</button>'+
    '<button class="btn ghost" id="cBank">표현장에서 복습</button></div></div>';
  $("#footbar").classList.remove("on");
  $("#cHome").onclick=()=>go("home"); $("#cBank").onclick=()=>go("bank");
}

}
function bindPlay(){

/* --- step 3 : 통으로 듣기 --- */
function stepListen(d){

function lineHTML(l,i){

    '<div><span class="en">'+esc(l.en)+'</span>'+(cur.showKo?'<span class="ko">'+esc(l.ko)+'</span>':'')+'</div></div>';

function speedBar(id){

function bindSpeed(id){

/* --- step 4 : 쉐도잉 (핵심) --- */
function stepShadow(d){
  const i = cur.line, l = d.lines[i];
  const reps = cur.reps[i]||0, target = S.cfg.reps;
  const chunks = chunkify(l.en);
  let h = '<div class="row" style="margin:10px 0 0"><span class="sub">문장 '+(i+1)+' / '+d.lines.length+'</span>';
  h += '<span style="flex:1"></span>'+speedBar("shSpeed")+'</div>';
  h += '<div class="shadowbox">';
  h +=   '<div class="who '+(l.s==="B"?"b":"")+'">'+(l.s==="B"?esc(d.names.B):esc(d.names.A))+'</div>';
  h +=   '<div class="bigen">'+esc(l.en)+'</div>';
  if(chunks.length>1){
    h += '<div class="sub" style="font-size:12px;margin-top:6px">덩어리로 끊어 읽기 — 각 줄을 눌러 따라 하세요</div>';
    h += '<div class="chunks">'+chunks.map((c,ci)=>'<div class="chunk" data-c="'+ci+'">'+esc(c)+'</div>').join("")+'</div>';
  }
  h +=   '<div class="bigko">'+esc(l.ko)+'</div>';
  h +=   '<div class="rule"></div>';
  h +=   '<div class="row"><button class="btn" id="pLine">듣기 ▶</button>'+
         '<button class="btn ghost sm" id="pSlow">천천히 0.7x</button>'+
         '<button class="btn '+(autoTok?"red":"ghost")+' sm" id="pAuto">'+(autoTok?"■ 자동 정지":"자동 진행 ▶▶")+'</button>'+
         '<span style="flex:1"></span><span class="counter" id="dots">'+
         Array.from({length:target},(_,k)=>'<span class="dot '+(k<reps?"on":"")+'"></span>').join("")+'</span></div>';
  if(l.notes && l.notes.length){
    h += '<div class="notes"><div class="sub" style="font-size:12px;margin-bottom:4px">표현 노트</div>';
    l.notes.forEach(n=>{
      h += '<div class="note"><b>'+esc(n.t)+'</b><span class="k">'+esc(kLabel(n.k))+'</span> — '+esc(n.m)+
           (n.tip?'<span class="tip">'+esc(n.tip)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="row"><button class="btn ghost" id="sPrev">← 앞 문장</button>'+
       '<button class="btn" id="sNext">다음 문장 →</button>'+
       '<span class="sub" style="font-size:12px">스페이스바=듣기, Enter=다음</span></div>';
  $("#stepbody").innerHTML = h;
  bindSpeed("shSpeed"); bindBlur();

  const play = (rate)=>{ stopSpeak(); bumpRep(i); speak(l.en, l.s, rate||S.cfg.rate); };
  $("#pLine").onclick = ()=> play();
  $("#pSlow").onclick = ()=> play(0.7);
  $("#pAuto").onclick = ()=>{ if(autoTok){ stopSpeak(); stepShadow(d); } else autoShadow(d); };
  document.querySelectorAll(".chunk").forEach(el=> el.onclick = ()=>{
    stopSpeak();
    document.querySelectorAll(".chunk").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); speak(chunks[+el.dataset.c], l.s, Math.min(S.cfg.rate,0.9));
  });
  $("#sPrev").onclick = ()=>{ if(cur.line>0){ cur.line--; stopSpeak(); stepShadow(d);} };
  $("#sNext").onclick = ()=>{
    if(cur.line < d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d); }
    else { toast("마지막 문장입니다 — 다음 단계로"); }
  };
}
function bumpRep(i){
  cur.reps[i] = Math.min(S.cfg.reps, (cur.reps[i]||0)+1);
  const dots = $("#dots");
  if(dots) dots.innerHTML = Array.from({length:S.cfg.reps},(_,k)=>'<span class="dot '+(k<cur.reps[i]?"on":"")+'"></span>').join("");
  saveProgress();
}
/* 자동 진행 — 재생 → 따라 읽을 여유 → 재생 … 반복 후 다음 문장 */
function autoShadow(d){
  const token = {}; autoTok = token;
  const gap = t => Math.max(1000, t.split(/\s+/).length * 340);
  stepShadow(d);
  (function run(rep){
    if(autoTok!==token) return;
    const l = d.lines[cur.line];
    speak(l.en, l.s, S.cfg.rate, ()=>{
      if(autoTok!==token) return;
      bumpRep(cur.line);
      setTimeout(()=>{
        if(autoTok!==token) return;
        if(rep+1 < S.cfg.reps) run(rep+1);
        else if(cur.line < d.lines.length-1){ cur.line++; stepShadow(d); setTimeout(()=>run(0), 500); }
        else { autoTok=null; stepShadow(d); toast("마지막 문장까지 끝냈습니다 — 다음 단계로"); }
      }, gap(l.en));
    });
  })(0);
}
function kLabel(k){
  return ({idiom:"관용", colloquial:"구어", phrasal:"구동사", collocation:"연어", business:"실무어", grammar:"문법"})[k] || k;
}
document.addEventListener("keydown", e=>{
  if(cur.view!=="session" || STEPS[cur.step].k!=="shadow") return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const d = dayById(cur.dayId); if(!d) return;
  if(e.code==="Space"){ e.preventDefault(); const l=d.lines[cur.line]; stopSpeak(); bumpRep(cur.line); speak(l.en, l.s, S.cfg.rate); }
  if(e.code==="Enter"){ e.preventDefault(); if(cur.line<d.lines.length-1){ cur.line++; stopSpeak(); stepShadow(d);} }
});

}

function exportData(){
  const blob = new Blob([JSON.stringify({v:1, prog:S.prog, log:S.log, star:S.star, out:S.out, custom:S.custom, cfg:S.cfg}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "roundtable-backup-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("백업 파일을 내려받았습니다");
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      ["prog","log","star","out","custom","cfg"].forEach(k=>{ if(o[k]) S[k]=o[k]; });
      rebuild(); save(); toast("복원했습니다"); render();
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };
  r.readAsText(f);
}

/* ---------- 표현장 ---------- */
let bankQ = "";
function renderBank(){
  const rows=[];
  CONTENT.forEach(d=> d.keys.forEach(k=> rows.push({d, k})));
  const q = bankQ.trim().toLowerCase();
  const filtered = rows.filter(r=> !q || (r.k.en+r.k.ko+r.k.ex).toLowerCase().includes(q));
  let h = '<div class="hd" style="margin-top:20px"><small>Expression bank</small>표현장 <span class="sub" style="font-size:13px">('+rows.length+'개)</span></div>';
  h += '<div class="card"><div class="row"><input type="text" id="bq" placeholder="영어·한국어로 검색" value="'+esc(bankQ)+'" style="flex:1;min-width:180px">'+
       '<button class="btn ghost sm" id="bStar">⭐만 보기</button><button class="btn ghost sm" id="bDrill">랜덤 10개 훈련</button></div></div>';
  h += '<div class="card" id="bankList">';
  filtered.forEach((r,i)=>{
    const on = S.star[r.k.en] ? "on":"";
    h += '<div class="bankrow"><span class="star '+on+'" data-k="'+esc(r.k.en)+'">★</span>'+
         '<b>'+esc(r.k.en)+'</b> <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button>'+
         '<div class="m">'+esc(r.k.ko)+' <span class="sub" style="font-size:11.5px">· DAY '+r.d.day+'</span></div>'+
         '<div class="ex">'+esc(r.k.ex)+'</div></div>';
  });
  if(!filtered.length) h += '<div class="sub">검색 결과가 없습니다.</div>';
  h += '</div>';
  $("#view-bank").innerHTML = h; bindPlay();
  $("#bq").oninput = e=>{ bankQ=e.target.value; const p=e.target.selectionStart; renderBank(); const el=$("#bq"); el.focus(); el.setSelectionRange(p,p); };
  $("#bStar").onclick = ()=>{ bankQ=""; renderBank();
    document.querySelectorAll("#bankList .bankrow").forEach(row=>{
      const s=row.querySelector(".star"); if(!s.classList.contains("on")) row.style.display="none"; }); };
  $("#bDrill").onclick = ()=> drill(rows);
  document.querySelectorAll(".star").forEach(s=> s.onclick = ()=>{
    const k=s.dataset.k; if(S.star[k]) delete S.star[k]; else S.star[k]=1; save(); s.classList.toggle("on"); });
}
function drill(rows){
  const pool = rows.slice(); const pick=[];
  while(pick.length<10 && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let h = '<div class="hd" style="margin-top:20px"><small>Quick drill</small>랜덤 10개 — 보지 말고 먼저 말하기</div><div class="card">';
  pick.forEach(r=>{
    h += '<div class="keyrow"><b>'+esc(r.k.en)+' <button class="btn ghost sm rv" data-t="'+esc(r.k.en)+'">▶</button></b>'+
         '<span><span class="blurme">'+esc(r.k.ko)+'</span><span class="ex blurme">'+esc(r.k.ex)+'</span></span></div>';
  });
  h += '</div><div class="row"><button class="btn ghost" id="bBack">← 표현장으로</button><button class="btn" id="bAgain">다시 뽑기</button></div>';
  $("#view-bank").innerHTML = h; bindBlur(); bindPlay();
  $("#bBack").onclick = ()=> renderBank();
  $("#bAgain").onclick = ()=> drill(rows);
}

/* ---------- 자료 추가 ---------- */
const GEN_PROMPT =
`아래 형식에 맞춰 영어 쉐도잉 회화 1회차를 JSON 배열로 만들어 줘.

[조건]
- 학습자: 한국인 직장인, 토익스피킹 6~7급. 목표는 정확한 표현·자연스러운 구어체.
- 두 사람(A/B)이 한 주제로 토론하는 형태, 문장 20줄(A/B 번갈아), 한 줄 18~26단어. 관계절·분사구·강조구문을 섞어 한 문장이 두 겹 이상이 되게 할 것.
- 소재: (여기에 주제를 적으세요 — 예: 인플레이션, 반도체 규제, 조직문화, 도시화, 우주산업 등)
- 반드시 지킬 것: 지어낸 통계·날짜·인용 금지. 속보성 뉴스 대신 오래 유효한 구조와 메커니즘을 다룰 것.
- 관용어·구동사·구어체·연어를 문장마다 자연스럽게 섞고, notes로 설명할 것.
- notes의 k 값은 idiom / colloquial / phrasal / collocation / business / grammar 중 하나.
- tip에는 한국인이 흔히 틀리는 지점이나 함께 외울 확장 표현을 적을 것.
- 출력은 JSON 배열 하나만. 설명 문장 없이.

[형식]
[{
 "id":"w2d1","day":8,"cat":"주제분류","level":"B2+",
 "title":"영어 제목","titleKo":"한국어 제목 — 부제",
 "names":{"A":"이름 (역할)","B":"이름 (역할)"},
 "brief":["한국어 배경설명 1","2","3","4"],
 "lines":[
   {"s":"A","en":"영어 문장","ko":"한국어 번역",
    "notes":[{"t":"표현","k":"idiom","m":"뜻","tip":"쓰임·주의점"}]}
 ],
 "keys":[{"en":"표현","ko":"뜻","ex":"예문"}],
 "out":[{"q":"영어 질문","hint":"써야 할 표현"}]
}]`;
function renderAdd(){
  let h = '<div class="hd" style="margin-top:20px"><small>Add content</small>새 회화 추가</div>';
  h += '<div class="card"><b>1단계 — 프롬프트 복사</b><div class="sub" style="margin:4px 0 8px">아래 내용을 복사해서 Claude에게 붙여넣고, 원하는 주제를 적으세요.</div>'+
       '<pre class="prompt" id="pmt">'+esc(GEN_PROMPT)+'</pre>'+
       '<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="copyP">프롬프트 복사</button></div></div>';
  h += '<div class="card"><b>2단계 — 받은 JSON 붙여넣기</b><div class="sub" style="margin:4px 0 8px">Claude가 준 JSON을 그대로 붙여넣고 추가를 누르면 커리큘럼 맨 뒤에 붙습니다.</div>'+
       '<textarea id="jin" style="min-height:150px" placeholder="[ { &quot;id&quot;: ... } ]"></textarea>'+
       '<div class="row" style="margin-top:8px"><button class="btn" id="addJ">회차 추가</button>'+
       '<span class="sub" id="addMsg"></span></div></div>';
  if(S.custom.length){
    h += '<div class="card"><b>내가 추가한 회차 ('+S.custom.length+')</b><div class="rule"></div>';
    S.custom.forEach((c,i)=>{ h += '<div class="histrow"><b>'+c.day+'</b><span style="flex:1">'+esc(c.title||"(제목 없음)")+'</span>'+
      '<button class="btn ghost sm delc" data-i="'+i+'">삭제</button></div>'; });
    h += '</div>';
  }
  $("#view-add").innerHTML = h;
  $("#copyP").onclick = ()=>{ navigator.clipboard.writeText(GEN_PROMPT).then(()=>toast("복사했습니다"),()=>{
    const r=document.createRange(); r.selectNode($("#pmt")); getSelection().removeAllRanges(); getSelection().addRange(r);
    toast("직접 복사하세요 (Ctrl+C)"); }); };
  $("#addJ").onclick = ()=>{
    const raw = $("#jin").value.trim(); if(!raw) return;
    try{
      let o = JSON.parse(raw); if(!Array.isArray(o)) o=[o];
      const bad = o.find(x=> !x.id || !Array.isArray(x.lines) || !x.lines.length);
      if(bad) throw new Error("형식");
      o.forEach(x=>{
        x.cat=x.cat||"기타"; x.brief=x.brief||[]; x.keys=x.keys||[]; x.out=x.out||[];
        x.names=x.names||{A:"A",B:"B"}; x.titleKo=x.titleKo||"";
        x.day = x.day || (CONTENT.length+1);
        if(CONTENT.some(c=>c.id===x.id)) x.id = x.id+"-"+Math.random().toString(36).slice(2,6);
        S.custom.push(x);
      });
      save(); rebuild(); toast(o.length+"개 회차를 추가했습니다"); $("#jin").value=""; renderAdd();
    }catch(err){ $("#addMsg").textContent = "JSON 형식이 맞지 않습니다. 대괄호 [ ] 로 시작하는지 확인하세요."; }
  };
  document.querySelectorAll(".delc").forEach(b=> b.onclick = ()=>{
    S.custom.splice(+b.dataset.i,1); save(); rebuild(); renderAdd(); });
}

/* ---------- 설정 ---------- */
function applyTheme(){
  let t = S.cfg.theme;
  if(t!=="dark" && t!=="light")
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
}

/* ---------- 시작 ---------- */
/* 설정 화면을 없앴으므로, 예전에 저장해 둔 화면 설정에 갇히지 않도록 되돌린다.
   앞으로 화면 밝기는 휴대폰 설정을 그대로 따라간다. */
if(S.cfg.theme!=="auto"){ S.cfg.theme="auto"; save(); }
applyTheme();
render();

/* ═══════════ 앱으로 설치하기 ═══════════
   링크를 카카오톡·팀즈로 보내면 대개 그 앱 안의 브라우저로 열린다.
   거기서는 설치도 소리도 되지 않으므로, 그 경우를 가장 먼저 잡아 크롬·사파리로 넘긴다. */
(function(){
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    /* 열 때는 새 본문을 먼저 받으므로 대개 여기까지 오지 않는다.
       느린 곳에서 저장본으로 먼저 열렸을 때만 뒤늦게 도착한다. */
    navigator.serviceWorker.addEventListener("message", e=>{
      if(!e.data || e.data.type!=="update-ready") return;
      pendingUpdate = true;
      if(cur.view==="session" || cur.view==="add") toast("새 회차가 도착했습니다. 이 훈련을 마치면 반영됩니다.");
      applyUpdate();
    });
    /* 설치한 앱은 한 번 열어 두면 다시 불러와도 화면을 새로 받지 않는다.
       그래서 앱을 앞으로 불러올 때마다 새것이 있는지 확인한다. */
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState !== "visible") return;
      applyUpdate();
      if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type:"check-update"});
    });
  }

  const UA = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(UA);
  const isMobile = isIOS || isAndroid;
  /* 앱 안 브라우저 — 카카오톡·팀즈·네이버·라인·밴드·페북·인스타 */
  const inApp = /KAKAOTALK|Teams|MSTeams|NAVER|Line\/|band|DaumApps|Instagram|FB_IAB|FBAN|FBAV|everytime/i.test(UA);
  /* 아이폰은 사파리로, 안드로이드는 크롬으로 넘긴다.
     그 기기에 처음부터 깔려 있는 브라우저라야 아무도 무엇을 설치하지 않는다. */
  const TARGET = isIOS ? "사파리" : "크롬";
  const TO = isIOS ? "사파리로" : "크롬으로";

  function openOutside(){
    const url = location.href;
    /* 카카오톡은 바깥 브라우저로 넘기는 자기 방식이 있다.
       기기의 기본 브라우저가 열리므로 아이폰이면 사파리, 안드로이드면 크롬이다. */
    if(/KAKAOTALK/i.test(UA)){
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      return;
    }
    if(isIOS){
      /* 사파리로 넘기는 전용 방식. 막히면 주소만 복사해 준다. */
      location.href = url.replace(/^https:/, "x-safari-https:").replace(/^http:/, "x-safari-http:");
      setTimeout(()=>{ if(!document.hidden) copyLink(); }, 1200);
      return;
    }
    if(isAndroid){
      location.href = "intent://" + url.replace(/^https?:\/\//, "") +
        "#Intent;scheme=" + location.protocol.replace(":", "") +
        ";package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      return;
    }
    window.open(url, "_blank");
  }

  /* 마지막 수단 — 주소를 복사해 주고 붙여 넣으라고 알린다. */
  function copyLink(){
    const url = location.href;
    const done = ()=> toast("주소를 복사했습니다. " + TARGET + "에 붙여 넣어 주세요.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, done);
    }else{
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }

  if(inApp && isMobile){
    const box = $("#openChrome");
    box.hidden = false;
    $("#ocApp").textContent = /KAKAOTALK/i.test(UA) ? "지금은 카카오톡 안에서 열려 있습니다."
                                                    : "지금은 다른 앱 안에서 열려 있습니다.";
    $("#ocMsg").textContent = "여기서는 영어 발음이 나오지 않고 설치도 되지 않습니다. " +
                              TO + " 열면 소리가 납니다.";
    $("#ocGo").textContent = TO + " 열기";
    $("#ocGo").onclick = openOutside;
    $("#ocCopy").onclick = copyLink;
    $("#ocClose").onclick = ()=>{ box.hidden = true; };
  }

  const btn = $("#installBtn"), note = $("#installNote");
  const title = $("#installTitle"), steps = $("#installSteps"), nowBtn = $("#installNow");

  /* 이미 홈 화면 아이콘으로 열렸으면 설치를 권할 이유가 없다 */
  if(window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return;

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred = e;
    if(!note.hidden) open();     /* 안내가 떠 있는 중에 신호가 오면 버튼과 문구를 함께 고친다 */
  });
  window.addEventListener("appinstalled", ()=>{ btn.hidden = true; hide(); });

  /* 브라우저가 설치 안내를 스스로 띄우지 않는 경우가 많아, 버튼은 늘 보이게 둔다 */
  btn.hidden = false;

  function hide(){ note.hidden = true; }

  function build(){
    if(inApp){
      title.textContent = "📲 먼저 브라우저로 열어 주세요";
      return "<p><b>지금 카카오톡·팀즈 같은 앱 안에서 열려 있습니다.</b> 여기서는 설치가 되지 않습니다.</p>" +
             "<ol>" +
               "<li>화면 <b>오른쪽 위 메뉴</b>(⋯ 또는 ⋮)를 누릅니다</li>" +
               "<li><b>「다른 브라우저로 열기」</b>를 고릅니다" +
                 (isIOS ? " — 아이폰은 <b>Safari</b>" : isAndroid ? " — 안드로이드는 <b>Chrome</b>" : "") + "</li>" +
               "<li>열린 화면에서 이 안내가 다시 나오면 그대로 따라 하시면 됩니다</li>" +
             "</ol>";
    }
    if(isIOS){
      title.textContent = "📲 홈 화면에 추가하기";
      return "<p><b>아이폰 · 아이패드 (Safari)</b></p>" +
             "<ol>" +
               "<li>화면 <b>아래쪽 공유 버튼</b>(□ 위에 화살표)을 누릅니다</li>" +
               "<li>목록을 내려 <b>「홈 화면에 추가」</b>를 고릅니다</li>" +
               "<li>오른쪽 위 <b>「추가」</b>를 누르면 끝입니다</li>" +
             "</ol>";
    }
    if(isAndroid){
      title.textContent = "📲 앱으로 설치하기";
      /* 크롬이 설치 신호를 준 경우에만 버튼을 안내한다. 없는 버튼을 누르라고 하면 그대로 막힌다. */
      return "<p><b>안드로이드 (Chrome)</b></p>" +
             "<ol>" +
               (deferred
                 ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>"
                 : "<li>화면 <b>오른쪽 위 메뉴(⋮)</b>를 누릅니다</li>" +
                   "<li><b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 고릅니다</li>") +
             "</ol>";
    }
    title.textContent = "📲 앱으로 설치하기";
    return "<p><b>컴퓨터 (Chrome · Edge)</b></p>" +
           "<ol>" +
             (deferred ? "<li>아래 <b>「지금 설치」</b> 버튼을 누릅니다</li>" : "") +
             "<li>주소창 오른쪽 끝의 <b>설치 아이콘</b>을 누릅니다</li>" +
             "<li>없으면 메뉴 → <b>「앱 설치」</b></li>" +
           "</ol>";
  }

  function open(){
    steps.innerHTML = build() +
      "<p>설치하면 아이콘을 눌러 주소창 없이 앱처럼 열리고, 인터넷이 끊겨도 계속 쓸 수 있습니다. 지금까지의 기록은 그대로 남습니다.</p>";
    nowBtn.hidden = !deferred;
    note.hidden = false;
  }

  /* 처음 연 사람에게는 한 번 저절로 띄운다. 닫으면 다시 띄우지 않는다. */
  const SEEN = "roundtable-install-seen";
  let seen = false;
  try{ seen = localStorage.getItem(SEEN) === "1"; }catch(e){}
  if(!seen && isMobile && $("#openChrome").hidden)
    setTimeout(()=>{ if(note.hidden) open(); }, 1200);

  btn.onclick = open;

  nowBtn.onclick = async ()=>{
    if(!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    nowBtn.hidden = true;
    if(outcome === "accepted"){ btn.hidden = true; hide(); }
  };

  $("#installNoteClose").onclick = ()=>{
    hide();
    try{ localStorage.setItem(SEEN, "1"); }catch(e){}
  };
})();
</script>

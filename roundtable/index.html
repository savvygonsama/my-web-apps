<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4342a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROUNDTABLE">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>ROUNDTABLE 영어 쉐도잉</title>
<style>
:root{
  --paper:#f6f2ea; --card:#fffdf8; --line:#e2dacb; --ink:#1a1917; --sub:#6d665c;
  --accent:#a4342a; --accent-soft:#f0dcd8; --blue:#2b4d63; --blue-soft:#dfe7ec;
  --ok:#2f6b4f; --warn:#8a6a1f; --radius:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme="dark"]{
  --paper:#15171a; --card:#1c1f24; --line:#2e333a; --ink:#e9e5dd; --sub:#9a948a;
  --accent:#e0715f; --accent-soft:#3a2320; --blue:#8fb6cd; --blue-soft:#1f2a33;
  --ok:#6fbf94; --warn:#d6b45c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}

.byline{background:var(--paper);border-bottom:1px solid var(--line)}
.bylinein{max-width:860px;margin:0 auto;padding:9px 16px 8px;font-size:12.5px;font-weight:700;
  line-height:1.7;color:var(--accent);letter-spacing:.01em}
.bylinein .c{letter-spacing:.16em;margin-right:8px}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:600}
.brand i{display:block;font-family:var(--sans);font-style:normal;font-size:11px;
  letter-spacing:.02em;color:var(--sub);margin-top:1px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;padding:6px 11px;border-radius:999px;
  cursor:pointer;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.hd{font-family:var(--serif);font-size:22px;margin:26px 0 2px;line-height:1.3}
.hd small{display:block;font-family:var(--sans);font-size:12px;color:var(--sub);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.sub{color:var(--sub);font-size:13.5px}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.87}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--accent);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--sub)}

.today{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.today h2{font-family:var(--serif);font-size:26px;margin:8px 0 4px;line-height:1.25}
.today .kotitle{color:var(--sub);font-size:14px;margin-bottom:14px}
.streak{display:flex;gap:18px;margin:14px 0 0;flex-wrap:wrap}
.streak div{text-align:center}
.streak b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.streak span{font-size:11.5px;color:var(--sub)}
.dlist{display:grid;gap:8px;margin-top:10px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.ditem:hover{border-color:var(--accent)}
.ditem .num{font-family:var(--serif);font-size:16px;width:26px;color:var(--sub);flex:none}
.ditem .t{flex:1;min-width:0}
.ditem .t b{display:block;font-size:14.5px;font-weight:600}
.ditem .t span{font-size:12px;color:var(--sub)}
.ditem .done{color:var(--ok);font-size:12px;font-weight:700;flex:none}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.past{background:var(--ok)}
.sesshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.clock{font-family:var(--serif);font-size:19px;margin-left:auto;letter-spacing:.04em}
.clock.over{color:var(--accent)}
.stepname{font-size:13px;font-weight:700}
.stepname em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}

.brief li{margin:7px 0}
.keyrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.keyrow:last-child{border:none}
.keyrow b{font-family:var(--serif);font-size:16px;flex:none;min-width:180px}
.keyrow span{font-size:13.5px;color:var(--sub)}
.keyrow .ex{display:block;font-family:var(--serif);font-size:13px;color:var(--sub);font-style:italic;margin-top:2px}

.sline{display:flex;gap:10px;padding:8px 10px;border-radius:9px;margin:2px 0;cursor:pointer}
.sline.now{background:var(--accent-soft)}
.sline .sp{font-family:var(--serif);font-weight:700;flex:none;width:20px;color:var(--accent)}
.sline.b .sp{color:var(--blue)}
.sline .en{font-family:var(--serif);font-size:16px;line-height:1.55}
.sline .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}

.shadowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:12px 0}
.who{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.who.b{color:var(--blue)}
.bigen{font-family:var(--serif);font-size:clamp(19px,4.1vw,27px);line-height:1.55;margin:8px 0 4px}
.chunks{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.chunk{font-family:var(--serif);font-size:clamp(17px,3.4vw,21px);padding:7px 12px;
  border-left:3px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.chunk:hover{background:var(--paper)}
.chunk.on{border-left-color:var(--accent);background:var(--accent-soft)}
.bigko{font-size:14px;color:var(--sub);margin-top:8px}
.rp{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin:6px 0;align-items:flex-start;cursor:pointer}
.rp.mine{background:var(--accent-soft);border:1px dashed var(--accent)}
.rp.now{outline:2px solid var(--accent)}
.rp .sp{font-family:var(--serif);font-weight:700;flex:none;width:22px;color:var(--accent)}
.rp.b .sp{color:var(--blue)}
.rp .en{font-family:var(--serif);font-size:16px;line-height:1.55}
.rp .ko{display:block;font-size:12.5px;color:var(--sub);margin-top:3px}
.blurme{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.blurme.show{filter:none;cursor:auto}
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.note{margin:8px 0;font-size:13.5px}
.note b{font-family:var(--serif);font-size:15px}
.note .k{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--blue-soft);
  color:var(--blue);margin-left:6px;font-weight:700;vertical-align:2px}
.note .tip{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.counter{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.speedbar{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.speedbar button{border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer}
.speedbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.qbox{margin:16px 0}
.qbox .q{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.qbox .hint{font-size:12.5px;color:var(--sub)}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
input[type=text]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;max-width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:10.5px;color:var(--sub)}
.cal div.done{background:var(--accent);color:#fff;font-weight:700}
.histrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.histrow b{font-family:var(--serif);font-size:15px}
.bankrow{padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow b{font-family:var(--serif);font-size:16px}
.bankrow .m{font-size:13px;color:var(--sub)}
.bankrow .ex{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--sub)}
.star{cursor:pointer;float:right;font-size:15px;opacity:.28}
.star.on{opacity:1}
pre.prompt{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px;z-index:30;display:none}
.footbar.on{display:block}
.footin{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.credit{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:11.5px;color:var(--sub);
  letter-spacing:.02em;text-align:center;opacity:.8}
.credit b{font-family:var(--serif);font-weight:600;letter-spacing:.06em}
@media(max-width:560px){
  .keyrow{flex-direction:column;gap:2px}
  .keyrow b{min-width:0}
  .brand i{display:none}
}

/* ---- 앱으로 설치하기 ---- */
.instbtn{background:var(--accent);color:var(--paper);border:none;padding:6px 12px;
  border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.instbtn[hidden]{display:none}
@media(max-width:560px){ .instbtn{margin-left:auto} }

#openChrome{position:fixed;inset:auto 12px 12px;max-width:520px;margin:0 auto;z-index:60;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--accent);color:var(--paper);border-radius:14px;padding:16px 18px;
  box-shadow:0 12px 40px -8px rgba(0,0,0,.45)}
#openChrome[hidden]{display:none}   /* display:flex가 hidden 속성을 이기므로 명시한다 */
#openChrome .oc-body{flex:1 1 240px;font-size:13.5px;line-height:1.7}
#openChrome .oc-body b{display:block;font-size:15px;margin-bottom:3px}
#openChrome .oc-body span{opacity:.9}
#openChrome button{border:none;border-radius:9px;padding:10px 16px;cursor:pointer;
  font-weight:700;font-size:14px;background:var(--paper);color:var(--accent)}
#openChrome button.ghost{background:transparent;color:inherit;font-weight:400;opacity:.85;padding:10px 8px}

#installNote{position:fixed;inset:auto 16px 16px;max-width:460px;margin:0 auto;z-index:50;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:0 12px 40px -8px rgba(0,0,0,.4)}
#installNote h5{margin:0 0 10px;font-size:15px}
#installNote p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.8}
#installNote ol{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--sub);line-height:1.95}
#installNote ol li{margin-bottom:3px}
#installNote b{color:var(--ink)}
#installNote button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13.5px}
#installNote .inst-btns{display:flex;gap:8px;flex-wrap:wrap}
#installNote #installNow{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
</style>
<div class="byline"><div class="bylinein"><span class="c">&copy; 2026</span>기획과 구성 by 곤사마</div></div>
<div class="topbar"><div class="topin">
  <div class="brand">ROUNDTABLE<i>데일리 영어 쉐도잉</i></div>
  <nav class="tabs" id="tabs">
    <button data-view="home" class="on">홈</button>
    <button data-view="log">기록</button>
    <button data-view="bank">표현장</button>
    <button data-view="add">자료 추가</button>
  </nav>
  <button class="instbtn" id="installBtn" hidden>📲 설치</button>
</div></div>

<div class="wrap">
  <section id="view-home" class="view on"></section>
  <section id="view-session" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-bank" class="view"></section>
  <section id="view-add" class="view"></section>
</div>
<div class="credit">ROUNDTABLE — 데일리 영어 쉐도잉 &nbsp;·&nbsp; © 2026 <b>곤사마</b> (Gonsama). All rights reserved.</div>
<div class="footbar" id="footbar"><div class="footin" id="footin"></div></div>
<div class="toast" id="toast"></div>

<div id="openChrome" hidden>
  <div class="oc-body">
    <b id="ocApp">지금은 다른 앱 안에서 열려 있습니다.</b>
    <span id="ocMsg"></span>
  </div>
  <button id="ocGo">브라우저로 열기</button>
  <button id="ocCopy" class="ghost">주소 복사</button>
  <button id="ocClose" class="ghost">그냥 보기</button>
</div>

<div id="installNote" hidden>
  <h5 id="installTitle">📲 홈 화면에 설치하기</h5>
  <div id="installSteps"></div>
  <div class="inst-btns">
    <button id="installNow" hidden>지금 설치</button>
    <button id="installNoteClose">알겠습니다</button>
  </div>
</div>

<script>
const CONTENT_BUILTIN = [
{
 id:"w1d1", day:1, cat:"경제", level:"B2+",
 title:"When Money Stops Being Cheap",
 titleKo:"돈이 더는 싸지 않을 때 — 금리와 투자 결정",
 names:{A:"Nora (재무)", B:"Sam (영업·운영)"},
 brief:[
  "기업이 설비 투자를 결정할 때 보는 것은 수요만이 아니라 <b>자본비용(cost of capital)</b>이다. 돈을 빌리는 값이 오르면, 같은 수요·같은 프로젝트라도 승인 기준이 올라간다.",
  "금리 인상의 충격은 즉시 오지 않고 <b>시차를 두고(with a lag)</b> 온다. 낮은 금리로 고정해 둔 기존 부채가 만기를 맞아 <b>차환(roll over)</b>될 때 비로소 이자 부담이 드러나기 때문이다.",
  "그래서 실무에서 쓰는 개념이 <b>hurdle rate(투자 승인 최저 수익률)</b>와 <b>payback period(회수 기간)</b>다. 자본이 비쌀수록 회수 기간이 짧은 안건만 살아남는다.",
  "재고도 마찬가지다. 저금리 시절엔 재고를 쌓아두는 비용이 사실상 공짜에 가까웠지만, 고금리에서는 야적장의 한 톤 한 톤이 <b>빌린 돈</b>이 된다."
 ],
 lines:[
  {s:"A",en:"The board raised objections to the expansion plan again, and I expected that as soon as rates rose.",
   ko:"이사회가 증설안에 또 이의를 제기했습니다. 금리가 오르기 시작했을 때부터 저는 그럴 거라고 예상했습니다.",
   notes:[{t:"raise an objection to ~",k:"business",m:"~ 에 이의를 제기하다",tip:"object to 보다 정중하고 회의록에 그대로 쓰는 표현입니다."},
          {t:"as soon as ~",k:"grammar",m:"~ 하자마자",tip:"시점을 정확히 못 박습니다. when 보다 뜻이 분명합니다."}]},
  {s:"B",en:"The demand numbers I saw last week were strong, so I want to know exactly what the objection was.",
   ko:"제가 지난주에 본 수요 숫자는 탄탄했습니다. 그러니 이의가 정확히 무엇이었는지 알고 싶습니다.",
   notes:[{t:"I want to know exactly ~",k:"business",m:"정확히 ~ 을 알고 싶습니다",tip:"막연한 설명을 막고 구체적인 답을 요구하는 틀입니다."}]},
  {s:"A",en:"The objection was not demand but the cost of capital, which has doubled since we drew up the plan.",
   ko:"이의는 수요가 아니라 자본비용이었습니다. 우리가 이 계획을 세운 뒤로 자본비용이 두 배가 됐습니다.",
   notes:[{t:"the cost of capital",k:"business",m:"자본비용",tip:"돈을 빌려 쓰는 값입니다. 투자 승인 기준의 출발점입니다."},
          {t:"not A but B",k:"grammar",m:"A가 아니라 B",tip:"오해를 한 번에 바로잡는 가장 짧은 형태입니다."}]},
  {s:"B",en:"We have had high interest rates for two years, so why is the cost hurting us only now?",
   ko:"고금리는 2년째 겪어 왔습니다. 그런데 왜 그 비용이 하필 지금에서야 우리를 압박합니까?",
   notes:[{t:"why is it only now that ~",k:"grammar",m:"왜 하필 지금에서야 ~ 인가",tip:"시점의 이유를 캐묻는 질문 형태입니다."}]},
  {s:"A",en:"Our old debt was locked in at low rates, and we are rolling it over at current market rates.",
   ko:"예전 부채는 낮은 금리로 고정돼 있었고, 지금 그것을 현재 시장 금리로 차환하고 있습니다.",
   notes:[{t:"lock in a rate",k:"business",m:"금리를 고정해 두다",tip:"계약 시점의 조건을 묶어 두는 것입니다. lock in a price 도 같습니다."},
          {t:"roll over debt",k:"business",m:"부채를 차환하다",tip:"만기가 온 빚을 새 빚으로 갚아 잇는 것입니다."}]},
  {s:"B",en:"So the effect appears with a lag, which explains why our reports looked normal until this quarter.",

   notes:[{t:"a process, not a policy",k:"collocation",m:"정책이 아니라 절차",tip:"선언이 아니라 실행 방식을 바꾸자는 뜻입니다."},

  {s:"A",en:"What I need from you is training that teaches people to ask where a number came from.",
   ko:"제가 필요한 것은, 숫자가 어디서 왔는지 묻도록 가르치는 교육입니다.",
   notes:[{t:"What I need from you is ~",k:"business",m:"제가 당신에게 필요한 것은 ~ 입니다",tip:"요구를 에두르지 않고 정확히 말하는 틀입니다."}]},

  {s:"A",en:"Within a year, that skill becomes the difference between two people who hold the same job title.",

  {s:"B",en:"Then we should present it as a judgment problem, not a tools problem, because budget owners fund judgment.",

   notes:[{t:"present it as ~",k:"business",m:"~ 로 제시하다",tip:"같은 사안을 어떤 범주로 내놓을지 정하는 표현입니다."},

{
 id:"w1d3", day:3, cat:"국제정세·안보", level:"B2+",
 title:"Supply Chains Learn to Worry",
 titleKo:"공급망이 불안을 배우다 — 효율에서 회복탄력성으로",
 names:{A:"Julia (구매)", B:"Marc (전략)"},
 brief:[
  "수십 년간 글로벌 공급망의 설계 원칙은 <b>효율(just-in-time)</b>이었다. 재고를 최소화하고, 가장 싼 곳에서 조달하고, 공급처를 하나로 모아 단가를 낮추는 방식이다.",
  "팬데믹과 지정학적 충돌을 겪으며 원칙이 <b>회복탄력성(just-in-case)</b>으로 이동했다. 이중 조달(dual sourcing), 재고 완충, 지역 분산이 다시 비용을 감수할 가치가 있는 것으로 평가된다.",
  "여기에 <b>수출통제(export controls)</b>와 <b>프렌드쇼어링(friend-shoring)</b>이 겹친다. 어디서 만드느냐가 단가 문제가 아니라 <b>정치적 노출(exposure)</b>의 문제가 되었다.",
  "다만 회복탄력성은 공짜가 아니다. 이중화는 규모의 경제를 깎고, 재고는 자금을 묶는다. 실무의 질문은 '분산하느냐'가 아니라 <b>'어디까지 이중화할 것인가'</b>다."
 ],
 lines:[
  {s:"A",en:"Procurement wants to dual-source the alloy, and finance says we are paying for a risk that never happened.",
   ko:"구매는 그 합금을 이중 조달하자고 하고, 재무는 일어나지도 않은 위험에 돈을 쓰는 거라고 합니다.",
   notes:[{t:"dual-source",k:"business",m:"이중 조달하다",tip:"같은 부품을 공급사 두 곳에서 사는 것입니다. single-source 와 반대입니다."},
          {t:"pay for a risk",k:"collocation",m:"위험에 대비해 비용을 치르다",tip:"보험성 지출을 가리키는 중립적인 표현입니다."}]},
  {s:"B",en:"Both are right, but for different reasons, and that is why this argument ends in deadlock every year.",
   ko:"둘 다 맞습니다, 다만 이유가 다릅니다. 그래서 이 논쟁이 해마다 교착으로 끝납니다.",
   notes:[{t:"Both are right, but for different reasons.",k:"business",m:"둘 다 맞는데 이유가 다릅니다",tip:"양쪽을 인정하면서 논쟁의 구조를 설명하는 문장입니다."},
          {t:"deadlock",k:"business",m:"교착 상태",tip:"양쪽이 물러서지 않아 진전이 없는 상태입니다."}]},
  {s:"A",en:"For thirty years the rule was simple: hold little inventory and buy from whoever offered the lowest landed cost.",
   ko:"30년 동안 규칙은 단순했습니다. 재고는 적게 두고, 도착원가가 가장 낮은 곳에서 사는 것.",
   notes:[{t:"landed cost",k:"business",m:"도착원가",tip:"물건값에 운임·보험·관세를 더해 문 앞까지 온 값입니다."},
          {t:"hold inventory",k:"business",m:"재고를 보유하다",tip:"carry inventory 와 같습니다."}]},
  {s:"B",en:"That rule worked until deliveries stopped being reliable, and every supply chain textbook now adds that qualification.",
   ko:"그 규칙은 납기가 믿을 수 없게 되기 전까지는 통했습니다. 이제 공급망 교과서마다 그 단서를 붙입니다.",
   notes:[{t:"a qualification",k:"business",m:"단서, 조건",tip:"주장에 붙이는 예외나 제한을 뜻합니다."}]},
  {s:"A",en:"Now the same executives who required just-in-time delivery want buffer stock in every warehouse by quarter end.",
   ko:"이제는 적시 납품을 요구하던 그 임원들이 분기 말까지 창고마다 완충 재고를 두라고 합니다.",
   notes:[{t:"just-in-time",k:"business",m:"적시 생산·납품",tip:"필요한 때 필요한 만큼만 받는 방식입니다."},
          {t:"buffer stock",k:"business",m:"완충 재고",tip:"공급이 끊길 때를 대비해 쌓아 두는 여유 재고입니다."}]},
  {s:"B",en:"To be fair, the conditions they planned for no longer hold, and cost is no longer the only variable.",
   ko:"공정하게 말하면, 그들이 전제한 조건이 더는 유효하지 않고 비용도 더 이상 유일한 변수가 아닙니다.",
   notes:[{t:"the conditions no longer hold",k:"business",m:"전제 조건이 더는 성립하지 않는다",tip:"hold 는 「유효하다」는 뜻입니다. The assumption still holds."},
          {t:"a variable",k:"business",m:"변수",tip:"결정에 영향을 주는 요인입니다."}]},
  {s:"A",en:"You mean export controls. Where you manufacture a product now decides who is legally allowed to buy it.",
   ko:"수출통제를 말씀하시는군요. 이제는 어디서 만드느냐가 누가 합법적으로 살 수 있는지를 정합니다.",

  {s:"B",en:"Geography used to be a cost question. It is now a permission question, and permission can be withdrawn quickly.",

  {s:"A",en:"My counterpart in Nagoya raises that point in every call, but he never states it directly.",
   ko:"나고야 쪽 담당자가 통화할 때마다 그 점을 꺼내지만, 한 번도 직접 말하지는 않습니다.",
   notes:[{t:"counterpart",k:"business",m:"상대편 담당자",tip:"같은 역할을 맡은 상대 조직의 사람입니다."},

  {s:"B",en:"Nobody in his position states it directly. He asks where your raw material comes from and then waits.",
   ko:"그 자리에 있는 사람은 아무도 직접 말하지 않습니다. 원자재가 어디서 오는지만 묻고 기다립니다.",

   notes:[{t:"prove a negative",k:"business",m:"없음을 증명하다",tip:"논리적으로 불가능에 가까운 요구를 가리키는 고정 표현입니다."}]},
  {s:"B",en:"Resilience costs money, but it appears as a line item whether or not you planned a budget for it.",
   ko:"회복탄력성에는 돈이 듭니다. 다만 예산을 잡았든 안 잡았든 비용 항목으로 나타납니다.",

  {s:"A",en:"Redundancy is not free either, because two suppliers means half the volume each, and our discount depends on volume.",

          {t:"depend on ~",k:"collocation",m:"~ 에 달려 있다",tip:"조건 관계를 평이하게 표현합니다."}]},
  {s:"B",en:"That removes the leverage you rely on at contract renewal, and I have had that argument twice this year.",
   ko:"그럼 계약 갱신 때 기대던 협상력이 사라집니다. 저도 올해만 그 논쟁을 두 번 했습니다.",

  {s:"A",en:"Where exactly do we draw the line, in a way that survives the first challenge from finance?",

   notes:[{t:"Where exactly do we draw the line?",k:"business",m:"선을 정확히 어디에 긋습니까",tip:"적용 범위를 확정하라고 요구하는 질문입니다."}]},

   ko:"그건 위원회에 설명해 낼 수 있습니다. 그 자리의 누구나 적용할 수 있는 규칙이니까요.",
   notes:[{t:"I can defend that to the committee.",k:"business",m:"그건 위원회에 설명해 낼 수 있습니다",tip:"승인받을 자신이 있다는 실무 표현입니다."}]},

{
 id:"w1d4", day:4, cat:"리더십·조직갈등", level:"B2+",
 title:"The Meeting Where Nobody Says Anything",
 titleKo:"아무도 말하지 않는 회의 — 침묵과 갈등의 두 얼굴",
 names:{A:"Priya (팀장)", B:"Tom (동료 팀장)"},
 brief:[
  "조직심리학에서 갈등은 두 종류로 나뉜다. <b>task conflict(과업 갈등)</b>은 '무엇이 옳은가'를 두고 다투는 것이고, <b>relationship conflict(관계 갈등)</b>은 사람 자체를 겨냥한다. 전자는 성과를 높일 수 있지만, 후자는 거의 항상 성과를 깎는다.",
  "문제는 둘이 쉽게 섞인다는 점이다. 과업 갈등이 오래 방치되면 인신공격으로 변질되고, 그때부터 팀은 <b>말을 아끼기(hold back)</b> 시작한다.",
  "에이미 에드먼슨의 <b>psychological safety(심리적 안전감)</b> 연구가 말하는 핵심은 '사이좋은 팀'이 아니라, <b>반대 의견을 냈을 때 벌 받지 않는다는 확신</b>이다. 안전한 팀은 오히려 실수를 더 많이 보고한다.",
  "리더가 쓸 수 있는 가장 값싼 도구는 <b>말하는 순서</b>다. 상급자가 먼저 결론을 말하면 반대 의견은 사라진다(anchoring). 그래서 '리더가 마지막에 말하기'가 실전 처방으로 자주 권장된다."
 ],
 lines:[
  {s:"A",en:"Something is wrong with my team meetings: everyone agrees in the room and then nothing actually improves.",
   ko:"우리 팀 회의에 문제가 있습니다. 자리에서는 다들 동의하는데 정작 나아지는 게 없습니다.",
   notes:[{t:"Something is wrong with ~",k:"business",m:"~ 에 문제가 있습니다",tip:"증상을 먼저 제시하고 원인을 찾아가는 도입입니다."}]},
  {s:"B",en:"Silence in a meeting is usually not agreement. It usually means people are waiting for the meeting to end.",
   ko:"회의에서의 침묵은 보통 동의가 아닙니다. 대개는 회의가 끝나기를 기다리고 있다는 뜻입니다.",
   notes:[{t:"A is usually not B. It usually means C.",k:"grammar",m:"A는 보통 B가 아니라 C라는 뜻이다",tip:"오해를 교정하고 바로 해석을 주는 두 문장 골격입니다."}]},
  {s:"A",en:"That is fair. Silence is easy to mistake for agreement when you are the person who called the meeting.",
   ko:"타당합니다. 회의를 소집한 사람은 침묵을 동의로 착각하기 쉽습니다.",
   notes:[{t:"mistake A for B",k:"collocation",m:"A를 B로 착각하다",tip:"I mistook him for his brother. 형태가 고정입니다."}]},
  {s:"B",en:"Let me ask something direct: do you state your view before or after the people who work for you?",
   ko:"직접적으로 하나 여쭙겠습니다. 밑에서 일하는 사람들보다 먼저 의견을 말합니까, 나중에 말합니까?",
   notes:[{t:"Let me ask something direct:",k:"business",m:"직접적으로 하나 여쭙겠습니다",tip:"민감한 질문을 예고하고 던지는 완충 표현입니다."},
          {t:"state a view",k:"collocation",m:"의견을 밝히다",tip:"give an opinion 보다 격식 있고 공식적입니다."}]},
  {s:"A",en:"Before, because I give direction so that nobody spends a week on something I would reject anyway.",
   ko:"먼저 말합니다. 어차피 제가 반려할 일에 누가 일주일을 쓰지 않도록 방향을 주는 거니까요.",
   notes:[{t:"give direction",k:"business",m:"방향을 제시하다",tip:"무엇을 어떻게 할지 지침을 내리는 것입니다."}]},
  {s:"B",en:"Then you set the answer before the discussion started, and after that, disagreeing has a cost for them.",
   ko:"그럼 논의가 시작되기 전에 답을 정해 둔 겁니다. 그다음부터 반대에는 그들에게 비용이 따릅니다.",
   notes:[{t:"set the answer before ~",k:"collocation",m:"~ 전에 답을 정해 두다",tip:"논의를 형식적으로 만드는 행위를 평이하게 설명합니다."},
          {t:"have a cost for someone",k:"collocation",m:"~ 에게 비용이 따르다",tip:"불이익이 생긴다는 뜻을 중립적으로 표현합니다."}]},
  {s:"A",en:"I hear that often, but does a leader who never states a view end up looking weak?",
   ko:"그런 말 자주 듣습니다. 그런데 의견을 한 번도 밝히지 않는 리더는 결국 약해 보이지 않습니까?",
   notes:[{t:"end up ~ing",k:"grammar",m:"결국 ~ 하게 되다",tip:"의도하지 않은 결말을 말할 때 씁니다."}]},
  {s:"B",en:"Lead the question, not the answer. Ask first and decide last, and that costs you almost nothing.",
   ko:"답이 아니라 질문을 이끄세요. 먼저 묻고 마지막에 결정하면, 잃는 것이 거의 없습니다.",
   notes:[{t:"Ask first and decide last.",k:"business",m:"먼저 묻고 마지막에 결정하라",tip:"회의 진행의 원칙을 한 문장으로 압축한 말입니다."},
          {t:"lead the question, not the answer",k:"collocation",m:"답이 아니라 질문을 이끌다",tip:"A, not B 로 역할을 재정의합니다."}]},
  {s:"A",en:"When the disagreement finally appears, it becomes personal faster than I can stop it.",
   ko:"이견이 마침내 드러나면, 제가 멈출 수 있는 속도보다 빠르게 감정 싸움이 됩니다.",
   notes:[{t:"become personal",k:"business",m:"인신공격으로 번지다",tip:"사안이 아니라 사람을 겨냥하게 되는 상태입니다."}]},
  {s:"B",en:"There is a boundary to watch: arguing about the plan is useful, and arguing about the person never is.",
   ko:"지켜봐야 할 경계가 있습니다. 계획을 두고 다투는 건 유용하지만, 사람을 두고 다투는 건 결코 아닙니다.",
   notes:[{t:"a boundary to watch",k:"collocation",m:"지켜봐야 할 경계",tip:"넘으면 안 되는 선을 평이하게 표현합니다."}]},
  {s:"A",en:"How do you bring a team back once it has crossed that boundary several times?",
   ko:"팀이 그 경계를 여러 번 넘어 버렸다면 어떻게 되돌립니까?",
   notes:[{t:"bring a team back",k:"business",m:"팀을 원래 상태로 되돌리다",tip:"관계나 분위기를 회복시킨다는 뜻입니다."}]},
  {s:"B",en:"Say it out loud and gently: tell them you are now arguing about trust, not about the schedule.",
   ko:"부드럽게 소리 내어 말하세요. 지금 일정이 아니라 신뢰를 두고 다투고 있다고 알려 주는 겁니다.",
   notes:[{t:"say it out loud",k:"collocation",m:"소리 내어 말하다",tip:"암묵적인 것을 공개적으로 언급한다는 뜻입니다."},
          {t:"A, not B",k:"grammar",m:"B가 아니라 A",tip:"다투는 대상을 정확히 지정합니다."}]},
  {s:"A",en:"That feels risky, because you are naming the tension in front of the whole team at once.",
   ko:"위험해 보입니다. 팀 전체 앞에서 그 긴장에 한꺼번에 이름을 붙이는 거니까요.",
   notes:[{t:"name the tension",k:"business",m:"긴장의 정체를 말로 지목하다",tip:"막연한 분위기를 논의 가능한 사안으로 바꾸는 행위입니다."}]},
  {s:"B",en:"It is risky, and it is also the only way to stop the tension affecting every other discussion.",
   ko:"위험합니다. 그리고 그 긴장이 다른 모든 논의에 영향을 미치는 걸 막는 유일한 방법이기도 합니다.",
   notes:[{t:"the only way to ~",k:"grammar",m:"~ 하는 유일한 방법",tip:"대안이 없다고 단언하는 강한 표현입니다."}]},
  {s:"A",en:"My worry is that people will read it as me taking a side, and managers do not recover from that.",
   ko:"제 걱정은 사람들이 그걸 제가 편드는 걸로 읽는 것입니다. 관리자는 거기서 회복하지 못합니다.",
   notes:[{t:"take a side",k:"collocation",m:"한쪽 편을 들다",tip:"중립을 잃는다는 뜻입니다. take sides 로도 씁니다."},
          {t:"read A as B",k:"collocation",m:"A를 B로 해석하다",tip:"해석의 방향을 말할 때 씁니다."}]},
  {s:"B",en:"Then describe the behavior, not the character, because late data is a fact and careless is a judgment.",
   ko:"그럼 성격이 아니라 행동을 묘사하세요. 「자료가 늦었다」는 사실이고 「부주의하다」는 평가니까요.",
   notes:[{t:"describe the behavior, not the character",k:"business",m:"성격이 아니라 행동을 묘사하라",tip:"피드백의 기본 원칙입니다. 반박 가능성을 없앱니다."},
          {t:"a fact and a judgment",k:"collocation",m:"사실과 평가",tip:"구분해서 말해야 하는 두 가지입니다."}]},
  {s:"A",en:"That distinction alone would have saved me two arguments last quarter, and both still cost me time.",
   ko:"그 구분 하나만으로 지난 분기의 논쟁 두 건은 피했을 겁니다. 둘 다 아직 시간을 잡아먹고 있습니다.",
   notes:[{t:"would have + 과거분사",k:"grammar",m:"~ 했을 것이다",tip:"실제로는 일어나지 않은 과거를 가정합니다."}]},
  {s:"B",en:"Do one more thing: thank the first person who disagrees with you, and do it in front of everyone.",
   ko:"하나 더 하세요. 처음 반대하는 사람에게 고맙다고 하되, 모두 앞에서 하십시오.",
   notes:[{t:"Do one more thing:",k:"business",m:"하나 더 하세요",tip:"조언을 항목으로 나누어 전달하는 신호입니다."},
          {t:"in front of everyone",k:"collocation",m:"모두가 보는 앞에서",tip:"공개적으로 한다는 점이 핵심입니다."}]},
  {s:"A",en:"That tells everyone else whether it is safe to speak up the next time something looks wrong.",
   ko:"그게 다음에 뭔가 잘못돼 보일 때 말해도 안전한지를 나머지 사람들에게 알려 줍니다.",
   notes:[{t:"speak up",k:"phrasal",m:"의견을 내다, 문제를 제기하다",tip:"침묵을 깨고 말한다는 뜻입니다."}]},
  {s:"B",en:"Exactly. Nobody reads the values printed on the wall, but everybody watches what happens to the first person who objects.",
   ko:"정확합니다. 벽에 붙은 가치 선언문은 아무도 읽지 않지만, 처음 반대한 사람이 어떻게 되는지는 모두가 봅니다.",
   notes:[{t:"what happens to ~",k:"grammar",m:"~ 에게 무슨 일이 생기는가",tip:"결과를 관찰 대상으로 삼는 명사절입니다."}]}
 ],
 keys:[

 ],
 out:[

 ]

{
 id:"w1d5", day:5, cat:"에너지", level:"B2+",
 title:"The Grid Is the Bottleneck",
 titleKo:"병목은 전력망이다 — 재생에너지와 산업의 열",
 names:{A:"Hana (설비)", B:"Owen (에너지 담당)"},
 brief:[
  "재생에너지의 근본 과제는 발전 단가가 아니라 <b>간헐성(intermittency)</b>이다. 태양광·풍력은 필요한 시간이 아니라 자연이 허락하는 시간에 발전한다.",
  "그래서 초점이 발전기에서 <b>전력망(grid)</b>과 <b>저장(storage)</b>으로 옮겨간다. 배터리는 시간 단위 이동에는 강하지만, 며칠 단위의 <b>장주기 저장(long-duration storage)</b>은 여전히 어려운 문제다.",
  "송전선 건설은 기술이 아니라 <b>인허가(permitting)</b>와 부지 문제로 지연되는 경우가 많다. 전력 수요지와 발전 적지가 지리적으로 어긋나 있기 때문이다.",
  "제조업의 진짜 난제는 전기가 아니라 <b>고온의 열(industrial heat)</b>이다. 철강의 경우 석탄 대신 수소를 쓰는 <b>수소환원제철(hydrogen-based direct reduction)</b>이 논의되지만, 저렴한 청정 수소와 대규모 전력이 전제 조건이다."
 ],
 lines:[
  {s:"A",en:"The board wants one number for our energy transition, but this cannot be reduced to a single number.",
   ko:"이사회는 에너지 전환을 숫자 하나로 원하지만, 이건 숫자 하나로 줄일 수 있는 문제가 아닙니다.",
   notes:[{t:"reduce A to B",k:"business",m:"A를 B로 축약하다",tip:"복잡한 것을 단순화한다는 뜻입니다. 비판적으로도 씁니다."}]},
  {s:"B",en:"It never can be. Generation cost is the easy half, and it is also the half that everybody quotes.",
   ko:"절대 그럴 수 없습니다. 발전 단가는 쉬운 절반이고, 다들 인용하는 것도 하필 그 절반입니다.",
   notes:[{t:"generation cost",k:"business",m:"발전 단가",tip:"전기를 만드는 데 드는 비용입니다. 송전 비용은 빠져 있습니다."}]},
  {s:"A",en:"Solar power is cheap at noon and worth almost nothing at seven in the evening, when demand peaks.",
   ko:"태양광은 정오에는 싸고, 수요가 가장 높은 저녁 7시에는 거의 값어치가 없습니다.",
   notes:[{t:"demand peaks",k:"collocation",m:"수요가 최고조에 이르다",tip:"peak 는 명사와 동사 둘 다입니다. peak demand 도 함께 외우세요."}]},
  {s:"B",en:"That is intermittency: the power arrives when the weather allows it, not when we need it.",
   ko:"그게 간헐성입니다. 전기는 우리가 필요할 때가 아니라 날씨가 허락할 때 옵니다.",
   notes:[{t:"intermittency",k:"business",m:"간헐성",tip:"공급이 일정하지 않고 끊겼다 이어지는 성질입니다."}]},
  {s:"A",en:"Then we store it. Battery costs have fallen a great deal over the last decade, have they not?",
   ko:"그럼 저장하면 됩니다. 지난 10년 동안 배터리 값이 많이 떨어지지 않았습니까?",
   notes:[{t:"~, have they not?",k:"grammar",m:"~ 하지 않았습니까",tip:"부가의문문입니다. 구어에서는 haven't they 로 줄입니다."}]},
  {s:"B",en:"For a few hours, yes. For a windless week in winter, batteries are nowhere near sufficient.",
   ko:"몇 시간짜리는 그렇습니다. 바람 없는 겨울 한 주에는 배터리가 전혀 충분하지 않습니다.",
   notes:[{t:"nowhere near sufficient",k:"collocation",m:"전혀 충분하지 않다",tip:"nowhere near 는 「~ 에 한참 못 미치는」이라는 강한 부정입니다."}]},
  {s:"A",en:"That is the long-duration storage problem, which every presentation shows early and then never returns to.",
   ko:"그게 장주기 저장 문제입니다. 모든 발표가 앞에서 보여 주고는 다시 돌아오지 않는 문제죠.",
   notes:[{t:"long-duration storage",k:"business",m:"장주기 저장",tip:"며칠에서 몇 주 단위로 전기를 저장하는 기술입니다."}]},
  {s:"B",en:"And even if someone solved storage tomorrow, the transmission lines to carry that power do not exist.",
   ko:"그리고 내일 누가 저장 문제를 푼다 해도, 그 전기를 실어 나를 송전선이 존재하지 않습니다.",
   notes:[{t:"even if ~",k:"grammar",m:"설령 ~ 하더라도",tip:"가정을 인정하고도 결론이 같다고 말할 때 씁니다."}]},
  {s:"A",en:"Transmission is the part everyone forgets, and it is the part that determines everything else.",
   ko:"송전은 모두가 잊는 부분이고, 나머지 전부를 결정하는 부분이기도 합니다.",
   notes:[{t:"transmission",k:"business",m:"송전",tip:"발전소에서 수요지까지 전기를 보내는 설비입니다."},
          {t:"determine",k:"business",m:"결정하다",tip:"decide 보다 격식 있고, 인과 관계를 강조합니다."}]},
  {s:"B",en:"It is not a technology problem either. It is permitting, land purchase and local objections, which take years.",
   ko:"기술 문제도 아닙니다. 인허가와 토지 매입과 주민 반대이고, 이건 몇 년이 걸립니다.",
   notes:[{t:"permitting",k:"business",m:"인허가 절차",tip:"건설 전에 받아야 하는 행정 승인입니다."},
          {t:"local objections",k:"collocation",m:"주민 반대",tip:"지역 주민이 제기하는 반대 의견입니다."}]},
  {s:"A",en:"Permitting takes a decade while a plant takes three years, so the two timelines do not match.",
   ko:"인허가는 10년이 걸리는데 발전소는 3년이면 됩니다. 그래서 두 일정이 맞지 않습니다.",
   notes:[{t:"timelines do not match",k:"collocation",m:"일정이 서로 맞지 않는다",tip:"계획 충돌을 설명하는 평이한 표현입니다."}]},
  {s:"B",en:"That mismatch is the core of the problem, and it is the part that never reaches the headline.",
   ko:"그 불일치가 문제의 핵심이고, 기사 제목에는 절대 닿지 않는 부분입니다.",
   notes:[{t:"a mismatch",k:"business",m:"불일치",tip:"두 가지가 서로 맞지 않는 상태입니다."}]},
  {s:"A",en:"Now apply this to our own plant, because our furnaces do not run on electricity at all.",
   ko:"이제 이걸 우리 공장에 적용해 보죠. 우리 용광로는 애초에 전기로 돌지 않으니까요.",
   notes:[{t:"apply this to ~",k:"business",m:"이것을 ~ 에 적용하다",tip:"일반론을 자기 사례로 가져올 때의 표현입니다."},
          {t:"run on ~",k:"phrasal",m:"~ 로 작동하다",tip:"연료나 동력원을 말합니다. run on gas / run on batteries."}]},
  {s:"B",en:"That is the harder half. High-temperature heat is where the simple answers stop working.",
   ko:"그게 더 어려운 절반입니다. 고온 열은 간단한 답이 통하지 않게 되는 지점입니다.",
   notes:[{t:"stop working",k:"collocation",m:"더는 통하지 않다",tip:"해법이 유효성을 잃는 상태입니다."}]},
  {s:"A",en:"Hydrogen appears in every presentation, usually on a slide that nobody in the room can defend.",
   ko:"발표마다 수소가 등장합니다. 대개는 그 자리 누구도 설명해 내지 못하는 장표에서요.",
   notes:[{t:"defend a slide",k:"business",m:"장표의 내용을 설명해 내다",tip:"질문을 받아 근거를 댄다는 뜻입니다."}]},
  {s:"B",en:"Hydrogen is chemically sound. The problem is that clean hydrogen needs cheap and steady electricity to be viable.",
   ko:"수소는 화학적으로 타당합니다. 문제는 청정 수소가 성립하려면 싸고 안정적인 전기가 필요하다는 것입니다.",

{

 title:"Why You Forget What You Just Read",

 names:{A:"Dan (교육팀)", B:"Mia (인지심리 전공)"},
 brief:[
  "학습 연구에서 가장 반복적으로 확인된 두 가지가 <b>spacing effect(간격 효과)</b>와 <b>retrieval practice(인출 연습)</b>다. 몰아서 보는 것보다 나눠서 보는 것이, 다시 읽는 것보다 <b>기억에서 꺼내 보는 것</b>이 오래간다.",
  "다시 읽기가 인기 있는 이유는 <b>fluency illusion(유창성 착각)</b> 때문이다. 눈에 익어 술술 읽히면 '안다'고 느끼지만, 그 매끄러움은 이해가 아니라 익숙함의 신호일 뿐이다.",
  "그래서 효과적인 학습은 대체로 <b>불편하다</b>. 어렵게 꺼낼수록 기억은 단단해지는데, 이를 <b>desirable difficulty(바람직한 어려움)</b>라고 부른다.",
  "수면은 학습의 마무리 공정에 가깝다. 잠자는 동안 기억이 정리·강화되는 <b>consolidation(공고화)</b>이 일어나므로, 밤을 새워 채워 넣는 방식은 투입 대비 손해가 크다."
 ],
 lines:[

  {s:"B",en:"That is not a memory defect. That is the normal result of reading without testing yourself afterwards.",
   ko:"그건 기억력 결함이 아닙니다. 읽고 나서 스스로 시험하지 않았을 때의 정상적인 결과입니다.",
   notes:[{t:"the normal result of ~",k:"business",m:"~ 의 정상적인 결과",tip:"이상이 아니라 예상된 결과라고 바로잡는 표현입니다."}]},
  {s:"A",en:"But it felt easy while I was reading, and every sentence made sense on the page.",

  {s:"B",en:"Smooth reading feels like understanding, but what you are actually measuring is familiarity with the words.",

   notes:[{t:"familiarity",k:"business",m:"익숙함",tip:"이해와 구별해야 하는 감각입니다. 학습 착각의 핵심 원인입니다."},
          {t:"what you are actually measuring is ~",k:"grammar",m:"실제로 재고 있는 것은 ~ 이다",tip:"착각을 지적하는 강조 구문입니다."}]},
  {s:"A",en:"So I should close the file and say the main points out loud before I look at it again.",

  {s:"B",en:"That is the whole method, and it is simple: retrieve the information instead of rereading it.",

          {t:"A instead of B",k:"grammar",m:"B 대신 A",tip:"두 방법을 직접 대비합니다."}]},
  {s:"A",en:"I have heard that, but rereading feels productive because I cover more pages in the same hour.",

  {s:"B",en:"Yes, by a large margin, and it is one of the oldest and most repeated findings in psychology.",

  {s:"A",en:"Then why does everyone still study everything the night before a review that actually matters?",

{
 id:"w1d7", day:7, cat:"문화·트렌드", level:"B2+",
 title:"Where Work Happens Now",
 titleKo:"일은 이제 어디서 일어나는가 — 하이브리드 근무와 도시",
 names:{A:"Sofia (HR)", B:"Ken (현업)"},
 brief:[
  "하이브리드 근무 논쟁이 갈리는 이유는 업무의 성격이 다르기 때문이다. <b>집중 업무(deep work)</b>는 원격이 유리하고, <b>조율·신뢰 형성</b>은 대면이 유리하다는 것이 대체적인 관찰이다.",
  "가장 자주 지적되는 손실은 <b>weak ties(약한 유대)</b>다. 다른 팀 사람과 우연히 마주치는 접점이 사라지면, 정보는 부서 안에서만 돌게 된다.",

  "실무의 결론은 '주 며칠'이 아니라 <b>어떤 일을 위해 모이는가</b>이다. 출근한 날에 각자 헤드폰을 끼고 화상회의만 한다면, 이동 시간만 지불한 셈이 된다."
 ],
 lines:[
  {s:"A",en:"Leadership wants everyone in the office four days a week, and I think we are asking the wrong question.",

{
 id:"w2d1", day:8, cat:"품질·리스크", level:"B2+",
 title:"The Recall Nobody Wants to Own",
 titleKo:"아무도 떠안기 싫은 리콜 — 결함과 책임의 경계",
 names:{A:"Grace (품질보증)", B:"Diego (구매·공급망)"},
 brief:[
  "제조 현장에서 결함이 나오면 가장 먼저 정해지는 것은 책임이 아니라 순서다. <b>봉쇄(containment)</b>가 먼저고 <b>시정(corrective action)</b>이 그다음이며, 책임 배분은 마지막이다. 원인을 다 밝히기 전에도 확산은 멈춰야 하기 때문이다.",
  "책임을 가르는 실질적 기준은 <b>입증책임(the burden of proof)</b>이 어디에 놓이느냐다. 공급사는 도면과 규격을 들고 오고, 완성품 업체는 실제 사용 조건을 든다. 계약서의 <b>책임한도(liability cap)</b>가 이 다툼의 상한을 미리 정해 둔다.",
  "리콜의 비용 구조는 <b>확실한 비용 대 불확실한 비용</b>의 대결이다. 지금 회수하면 금액이 확정되고, 미루면 확률은 낮지만 손실이 큰 <b>꼬리위험(tail risk)</b>이 남는다. 둘을 같은 저울에 올리는 순간 판단이 쉬워진다.",
  "그래서 실무에서 진짜로 다투는 것은 「리콜을 하느냐」가 아니라 <b>범위(scope)</b>다. 어느 로트까지, 어느 일련번호까지 포함할 것인가. 이 선을 예산이 아니라 <b>증거</b>로 그어야 나중에 방어할 수 있다."
 ],
 lines:[

 brief:[
  "배출에 값이 매겨지면 원가 구조가 바뀐다. 지금까지 원가는 원료와 에너지였지만, <b>탄소 가격(carbon pricing)</b>이 붙는 순간 배출량 자체가 비용 항목이 된다. 같은 제품, 같은 공정이라도 어디서 어떻게 만들었는지가 값을 가른다.",
  "국경에서 조정이 일어나는 이유는 <b>탄소 누출(carbon leakage)</b> 때문이다. 규제가 강한 나라의 공장이 규제가 약한 나라로 옮겨 가면 배출은 그대로인 채 산업만 빠져나간다. 그래서 수입품에도 같은 값을 물려 <b>공정한 경쟁 조건(a level playing field)</b>을 맞추려 한다.",
  "실무의 난점은 규제가 아니라 <b>측정</b>이다. 한 톤에 들어 있는 배출량(embedded emissions)을 어떻게 셈하느냐에 따라 누가 얼마를 내는지가 달라진다. 그래서 다툼은 늘 방법론에서 벌어지고, <b>검증(verification)</b>을 거친 숫자만 값을 인정받는다.",
  "영업 쪽에서 갈리는 것은 <b>전가(pass-through)</b>다. 늘어난 비용을 가격에 얹을 수 있는 고객이 있고, 얹는 순간 떠나는 고객이 있다. 검증된 데이터가 있으면 <b>친환경 프리미엄(green premium)</b>이 붙지만, 없으면 그냥 값만 오른 제품이 된다."

{

 brief:[

  "암묵지가 어려운 이유는 <b>말로 옮겨지지 않기 때문</b>이다. 소리로 이상을 알아채고, 손끝으로 온도를 가늠하는 판단은 매뉴얼에 담기지 않는다. 그래서 전수는 문서가 아니라 <b>같이 서 있는 시간</b>으로만 일어난다.",
  "현장이 이 문제를 미루는 방식은 대개 <b>초과근무</b>다. 당장은 돌아가지만 격차를 감출 뿐 좁히지는 못한다. 이런 임시 대응을 <b>stopgap</b>이라 하고, 반복되면 은퇴가 몰리는 시점에 한꺼번에 터진다.",

{
 id:"w2d4", day:11, cat:"협상·계약", level:"B2+",
 title:"The Price Is Not the Price",
 titleKo:"가격은 가격이 아니다 — 장기계약의 조정 조항과 원가 전가",
 names:{A:"Marta (계약·법무)", B:"Joon (수출영업)"},
 brief:[
  "장기 공급계약에서 표지에 적힌 가격은 실제로 받는 값이 아니다. 몇 년을 묶는 계약에서 원가만 움직이고 값이 고정되어 있으면 한쪽이 반드시 무너진다. 그래서 원가가 움직이면 값도 따라 움직이도록 <b>가격 조정 조항(escalation clause)</b>을 넣어 둔다.",
  "조정의 기준은 대개 공개된 지수다 — <b>지수 연동(index-linked)</b>. 양쪽이 임의로 다투지 않아도 되니 깔끔해 보이지만, 지수는 현실을 몇 주 늦게 반영한다. 그 <b>시차(lag)</b> 동안 벌어진 손실은 계약서에 적힌 대로 누군가가 <b>떠안는다(eat the cost)</b>.",
  "그래서 위험을 나누는 장치가 붙는다. 값이 오를 때의 상한이 <b>cap</b>, 상한과 하한을 함께 두는 것이 <b>collar</b>다. 상한만 주고 하한을 못 받으면 오를 때의 부담은 우리가 지고 내릴 때의 이익은 상대가 가져간다 — 흔히 놓치는 자리다.",
  "물량 쪽의 장치는 <b>take-or-pay</b>다. 안 가져가도 약정한 값은 낸다. 설비 투자를 회수하려면 필요하지만 수요가 꺾이면 분쟁의 씨앗이 된다. 그래서 실무에서는 물량을 조금 풀어 주고 분기마다 차액을 맞추는 <b>정산(true-up)</b>으로 절충한다."
 ],

{
 id:"w2d5", day:12, cat:"안전·현장", level:"B2+",
 title:"The Accident That Was Waiting",
 titleKo:"예고되어 있던 사고 — 아차사고와 기준이 무너지는 방식",
 names:{A:"Dana (안전보건)", B:"Victor (생산 관리)"},
 brief:[
  "큰 사고는 어느 날 갑자기 오지 않는다. 그 앞에는 다치지 않고 지나간 <b>아차사고(near miss)</b>가 수없이 있다. 결과만 달랐을 뿐 원인은 같으므로, 아차사고는 값을 치르지 않고 얻는 교훈이다.",
  "기준은 한 번에 무너지지 않고 조금씩 밀린다. 급할 때 한 번 건너뛴 절차가 통하면 다음에도 건너뛰고, 예외가 반복되어 정상이 된다. 이것을 <b>일탈의 일상화(normalization of deviance)</b>라 부른다. 누구도 규칙을 어기기로 결심하지 않았는데 규칙이 사라져 있다.",
  "그래서 안전은 한 겹으로 설계하지 않는다. 방호장치, 절차, 점검, 교육을 <b>여러 겹으로 쌓아(layers of defence)</b> 한 겹에 난 구멍이 다른 겹에 막히게 한다. 사고는 구멍들이 한 줄로 늘어서는 드문 순간에 일어난다.",
  "지표는 둘로 나뉜다. 사고 건수처럼 이미 벌어진 뒤를 세는 <b>후행지표(lagging indicator)</b>와, 점검 이행률이나 아차사고 신고 건수처럼 앞을 내다보는 <b>선행지표(leading indicator)</b>다. 신고가 줄었다고 안전해진 것이 아니다 — 사람들이 말하기를 그만둔 것일 수도 있다."
 ],
 lines:[
  {s:"A",en:"Your line reported zero near misses last quarter, and that is exactly the number that concerns me.",
   ko:"그쪽 라인은 지난 분기 아차사고 신고가 0건이었습니다. 저를 우려하게 만드는 게 바로 그 숫자입니다.",
   notes:[{t:"a near miss",k:"business",m:"아차사고",tip:"사고로 이어질 뻔했으나 피해가 없었던 사건입니다."},
          {t:"concern someone",k:"business",m:"~ 를 우려하게 만들다",tip:"worry 보다 격식 있고 업무적입니다."}]},
  {s:"B",en:"Zero is good news. My crews are careful and nothing has gone wrong for several months.",
   ko:"0건은 좋은 소식입니다. 우리 작업조는 조심하고, 몇 달째 아무 일도 없었습니다.",
   notes:[{t:"a crew",k:"business",m:"작업조",tip:"현장에서 함께 일하는 인원 단위입니다."}]},
  {s:"A",en:"Or nothing was recorded, because crews stop reporting once a report has cost somebody something.",
   ko:"아니면 아무것도 기록되지 않은 겁니다. 신고가 누군가에게 대가를 치르게 한 뒤로는 작업조가 신고를 멈추니까요.",
   notes:[{t:"stop reporting",k:"collocation",m:"신고를 그만두다",tip:"보고 문화가 무너지는 상태를 말합니다."}]},
  {s:"B",en:"That is a serious accusation, so give me one instance where I punished someone for speaking up.",
   ko:"심각한 지적입니다. 그러니 제가 문제를 제기한 사람을 벌준 사례를 하나만 대 보세요.",
   notes:[{t:"speak up",k:"phrasal",m:"문제를 제기하다",tip:"침묵하지 않고 말하는 것입니다."},
          {t:"give me one instance",k:"business",m:"사례를 하나만 대 보세요",tip:"근거를 요구하는 직접적인 표현입니다."}]},
  {s:"A",en:"I am not accusing you. Pressure does not require a bad manager, because schedules create it on their own.",
   ko:"탓하는 게 아닙니다. 압박에 나쁜 관리자가 필요하지는 않습니다. 일정만으로도 생기니까요.",
   notes:[{t:"I am not accusing you.",k:"business",m:"탓하려는 게 아닙니다",tip:"비난이 아님을 먼저 분명히 하는 문장입니다."}]},
  {s:"B",en:"A near-miss form takes twenty minutes, and nobody has twenty minutes in the middle of production.",
   ko:"아차사고 양식은 20분이 걸리는데, 조업 중에는 아무도 20분이 없습니다.",
   notes:[{t:"in the middle of production",k:"collocation",m:"조업이 한창일 때",tip:"작업이 진행 중인 상황을 가리킵니다."}]},
  {s:"A",en:"Then the form is the problem. Make it thirty seconds on a phone, filled in at the machine.",
   ko:"그럼 양식이 문제입니다. 기계 옆에서 휴대폰으로 30초에 채우게 만드세요.",
   notes:[{t:"fill in a form",k:"collocation",m:"양식을 채우다",tip:"영국식은 fill in, 미국식은 fill out 입니다."}]},
  {s:"B",en:"Suppose I do that. What do you actually do with a hundred reports about people being careless?",
   ko:"그렇게 한다고 칩시다. 사람이 부주의했다는 신고 100건을 실제로 어떻게 하실 겁니까?",
   notes:[{t:"Suppose I do that.",k:"grammar",m:"그렇게 한다고 칩시다",tip:"가정을 받아들이고 다음 문제를 제기하는 형태입니다."}]},
  {s:"A",en:"I look for the reports that repeat, because the same event in the same place is a warning.",

  {s:"B",en:"So you want patterns rather than individual incidents, and I can work with that.",

   notes:[{t:"I can work with that.",k:"business",m:"그거라면 같이 할 수 있습니다",tip:"조건부 수용을 밝히는 실무 표현입니다."}]},
  {s:"A",en:"It must not become a scoreboard, because once reports count against a crew, the reports stop.",
   ko:"그게 점수판이 되어서는 안 됩니다. 신고가 작업조에 불리하게 계산되는 순간 신고가 멈추니까요.",
   notes:[{t:"count against ~",k:"phrasal",m:"~ 에게 불리하게 작용하다",tip:"평가에서 감점 요인이 되는 것입니다."}]},
  {s:"B",en:"Good, because the last program rewarded low numbers and everyone learned which events to report.",
   ko:"다행입니다. 지난 제도는 낮은 숫자에 상을 줬고, 다들 어떤 사건을 신고해야 하는지 배웠거든요.",
   notes:[{t:"reward low numbers",k:"collocation",m:"낮은 숫자에 보상하다",tip:"지표를 왜곡시키는 전형적인 설계 오류입니다."}]},
  {s:"A",en:"Injury counts are lagging indicators, which means they only tell you what has already happened.",
   ko:"재해 건수는 후행지표입니다. 이미 벌어진 일만 알려 준다는 뜻이죠.",
   notes:[{t:"a lagging indicator",k:"business",m:"후행지표",tip:"결과가 나온 뒤에야 움직이는 지표입니다."}]},
  {s:"B",en:"And the leading indicators are the inspections and drills that nobody notices until an audit?",
   ko:"그럼 선행지표는 감사가 오기 전까지 아무도 신경 쓰지 않는 점검과 훈련입니까?",
   notes:[{t:"a leading indicator",k:"business",m:"선행지표",tip:"결과보다 먼저 움직여 예측에 쓰이는 지표입니다."},
          {t:"a drill",k:"business",m:"훈련, 모의 연습",tip:"실제 상황을 가정해 반복하는 연습입니다."}]},
  {s:"A",en:"Those, but only if they are actually performed rather than signed, because a signature protects nobody.",
   ko:"그것들입니다. 다만 서명만 하는 게 아니라 실제로 수행될 때만입니다. 서명은 아무도 지켜 주지 않으니까요.",
   notes:[{t:"performed rather than signed",k:"collocation",m:"서명만 하는 게 아니라 실제로 수행되는",tip:"형식과 실질을 가르는 대비입니다."}]},
  {s:"B",en:"Standards do not collapse suddenly. They decline slowly, until one shortcut becomes the normal method.",
   ko:"기준은 갑자기 무너지지 않습니다. 천천히 낮아지다가, 지름길 하나가 정상적인 방법이 됩니다.",
   notes:[{t:"decline slowly",k:"collocation",m:"서서히 낮아지다",tip:"점진적 악화를 표현합니다."},
          {t:"a shortcut",k:"business",m:"지름길, 편법",tip:"규정된 절차를 건너뛰는 방식입니다."}]},
  {s:"A",en:"That process has a name: normalization of deviance, where an exception gradually becomes the standard.",
   ko:"그 과정에는 이름이 있습니다. 일탈의 일상화죠. 예외가 점차 기준이 되는 현상입니다.",
   notes:[{t:"normalization of deviance",k:"business",m:"일탈의 일상화",tip:"반복된 예외가 정상으로 받아들여지는 현상입니다."}]},
  {s:"B",en:"Then do not give me another poster. Give me the authority to stop the line without calling anyone.",

          {t:"authority",k:"business",m:"권한",tip:"결정을 내릴 수 있는 공식적 자격입니다."}]},

{
 id:"w2d6", day:13, cat:"조직·성과관리", level:"B2+",
 title:"What Gets Measured Gets Gamed",
 titleKo:"재면 조작된다 — 지표가 목표가 될 때",
 names:{A:"Ruth (성과관리)", B:"Ali (현업 팀장)"},
 brief:[
  "조직은 재지 않으면 관리하지 못한다. 그런데 재기 시작하는 순간 지표는 단순한 관찰이 아니라 <b>목표</b>가 되고, 사람들은 일이 아니라 지표를 향해 움직이기 시작한다.",
  "대부분의 지표는 <b>대리 지표(proxy)</b>다. 정말 보고 싶은 것 — 고객이 만족했는지, 품질이 좋아졌는지 — 은 직접 재기 어려워서, 대신 세기 쉬운 것을 센다. 처리 건수, 응답 시간 같은 것들이다. 대리와 본체가 어긋나기 시작하면 지표는 그때부터 거짓말을 한다.",
  "지표가 목표가 되면 좋은 지표이기를 그친다 — <b>굿하트의 법칙(Goodhart's law)</b>. 여기서 중요한 것은 조작이 대개 부정행위가 아니라는 점이다. 걸린 보상에 대한 합리적인 반응일 뿐이고, 그래서 사람을 바꿔도 되풀이된다.",
  "실무의 해법은 완벽한 지표를 찾는 것이 아니라 <b>여러 지표를 묶어(a basket of measures)</b> 서로를 견제하게 두는 것이다. 처리 건수 옆에 재문의율을, 속도 옆에 재작업률을 놓는다. 하나는 속일 수 있어도 셋을 동시에 속이려면 대개 일을 제대로 하는 편이 빠르다."
 ],
 lines:[
  {s:"A",en:"Your team's closure rate doubled in two months, so either something extraordinary happened or the definition changed.",
   ko:"그쪽 팀 처리율이 두 달 만에 두 배가 됐습니다. 대단한 일이 일어났거나, 정의가 바뀐 겁니다.",
   notes:[{t:"either A or B",k:"grammar",m:"A이거나 B이거나",tip:"두 가지 가능성만 남기는 형태입니다."},
          {t:"closure rate",k:"business",m:"처리율, 종결률",tip:"접수된 건 중 종결 처리된 비율입니다."}]},
  {s:"B",en:"You asked for closure rate and you received closure rate. I would have preferred a better question.",
   ko:"처리율을 요구하셨고 처리율을 받으셨습니다. 저는 더 나은 질문을 받고 싶었습니다.",
   notes:[{t:"I would have preferred ~",k:"grammar",m:"저는 ~ 를 더 원했을 겁니다",tip:"실제와 다른 과거의 선호를 말합니다."}]},
  {s:"A",en:"That is not an answer. Tell me what changed in the actual work your team does.",
   ko:"그건 답이 아닙니다. 팀이 실제로 하는 일에서 무엇이 바뀌었는지 말해 주세요.",
   notes:[{t:"the actual work",k:"collocation",m:"실제 업무",tip:"보고된 숫자와 대비되는 현실의 작업입니다."}]},
  {s:"B",en:"Tickets are closed and then reopened, so the same problem returns under a new number each week.",
   ko:"티켓을 닫았다가 다시 엽니다. 그래서 같은 문제가 매주 새 번호로 돌아옵니다.",
   notes:[{t:"reopen",k:"business",m:"다시 열다",tip:"종결된 건을 재개하는 것입니다."}]},
  {s:"A",en:"So we count the same work twice and then report the result as an improvement.",
   ko:"그럼 같은 일을 두 번 세고, 그 결과를 개선으로 보고하는 겁니다.",
   notes:[{t:"report A as B",k:"business",m:"A를 B로 보고하다",tip:"해석을 붙여 상부에 올리는 행위입니다."}]},
  {s:"B",en:"Nobody cheated. You attached a target to people, and they did what the target rewarded.",
   ko:"아무도 속이지 않았습니다. 사람들에게 목표를 붙여 두셨고, 그 목표가 보상하는 대로 한 것입니다.",
   notes:[{t:"attach a target to ~",k:"business",m:"~ 에게 목표를 부과하다",tip:"평가 지표를 사람에게 연결하는 것입니다."}]},
  {s:"A",en:"I know. The measure stopped describing the work as soon as it became the target.",
   ko:"압니다. 그 지표는 목표가 되는 순간 일을 설명하기를 멈췄습니다.",
   notes:[{t:"as soon as ~",k:"grammar",m:"~ 하는 순간",tip:"전환 시점을 정확히 지정합니다."}]},
  {s:"B",en:"There is a name for this. A measure stops being a good measure once it becomes a target.",
   ko:"이 현상에는 이름이 있습니다. 지표는 목표가 되는 순간 좋은 지표이기를 멈춥니다.",
   notes:[{t:"There is a name for this.",k:"business",m:"이 현상에는 이름이 있습니다",tip:"개념을 소개하는 도입 문장입니다."}]},
  {s:"A",en:"Goodhart's law. It is not about dishonest people. It is about honest people responding to incentives.",
   ko:"굿하트의 법칙입니다. 부정직한 사람에 관한 것이 아니라, 인센티브에 반응하는 정직한 사람에 관한 것입니다.",
   notes:[{t:"Goodhart's law",k:"business",m:"굿하트의 법칙",tip:"지표가 목표가 되면 지표로서의 기능을 잃는다는 법칙입니다."},
          {t:"respond to incentives",k:"business",m:"유인에 반응하다",tip:"보상 구조에 따라 행동이 바뀌는 것입니다."}]},
  {s:"B",en:"Then measure whether the customer returned, because that is what the company actually cares about.",

  {s:"A",en:"Repeat contact is a slow and noisy proxy for satisfaction, and half of it is outside your control.",

  {s:"A",en:"A basket of measures, then: closure rate beside reopen rate, and volume beside queue length.",

{
 id:"w2d7", day:14, cat:"물류·운송", level:"B2+",
 title:"The Box That Waits",
 titleKo:"기다리는 컨테이너 — 체선료와 리드타임이라는 숨은 원가",
 names:{A:"Nadia (물류)", B:"Peter (생산계획)"},
 brief:[
  "운송 원가는 운임만이 아니다. 컨테이너가 항만에 서 있는 동안에도 값이 붙는다 — 터미널 안에 머무는 시간에 붙는 <b>체선료(demurrage)</b>와, 컨테이너를 끌고 나간 뒤 반납이 늦어질 때 붙는 <b>지체료(detention)</b>다.",
  "이 값은 벌금이 아니라 <b>회전율을 강제하는 가격</b>이다. 터미널과 선사는 한정된 자리와 장비가 묶이는 것을 싫어한다. 그래서 <b>무료 기간(free time)</b>을 짧게 두고 그 뒤부터는 시간을 판다. 창고를 빌려주는 것이 아니라, 오래 세워 둘 사람을 값으로 밀어내는 것이다.",
  "공장이 실제로 아파하는 것은 평균 리드타임이 아니라 <b>흔들림(variability)</b>이다. 늘 30일이면 계획이 서지만 20일과 45일을 오가면 그 차이만큼을 재고로 메워야 한다. 그렇게 쌓아 두는 것이 <b>안전재고(safety stock)</b>이고, 그것은 창고에 잠긴 현금이다.",
  "그래서 물류와 생산계획은 같은 돈을 서로 다른 계정에서 본다. 물류는 운임과 체선료를 보고, 생산은 멈춘 라인과 쌓인 재고를 본다. 각자의 예산에서 상대의 숫자가 보이지 않는다는 것 — 이것이 이 다툼의 진짜 뿌리다."
 ],
 lines:[

   notes:[{t:"demurrage",k:"business",m:"체선료",tip:"무료 기간을 넘겨 컨테이너를 붙잡아 둘 때 내는 비용입니다."}]},
  {s:"B",en:"That is not my budget line. I only asked for those containers to wait until we had space.",

  {s:"B",en:"My yard was full and the line was still running, so tell me what I should have done instead.",
   ko:"야적장은 꽉 찼고 라인은 계속 돌고 있었습니다. 그럼 대신 무엇을 했어야 하는지 말해 주세요.",

  {s:"A",en:"You could have told me a week earlier, because I can reserve slots when I know in advance.",

   notes:[{t:"the real problem is A, not B",k:"business",m:"진짜 문제는 B가 아니라 A입니다",tip:"원인을 재지정하는 문장입니다."}]},
  {s:"B",en:"Plans always move. I would rather change a plan than hold stock that we cannot sell.",

  {s:"A",en:"I understand, but every change costs money, and that cost appears in my budget rather than yours.",

  {s:"B",en:"That is the whole problem in one sentence: we both reduce our own costs and the company pays twice.",
   ko:"그게 문제 전부를 한 문장으로 말한 겁니다. 둘 다 각자의 비용을 줄이고, 회사는 두 번 냅니다.",

{
 id:"w2d8", day:15, cat:"의사결정", level:"B2+",
 title:"The Project Nobody Will Kill",
 titleKo:"아무도 끝내지 못하는 프로젝트 — 매몰비용과 멈추는 기술",
 names:{A:"Helen (재무)", B:"Raj (프로젝트 책임)"},
 brief:[
  "이미 쓴 돈은 <b>매몰비용(sunk cost)</b>이다. 무엇을 하든 회수되지 않으므로 앞으로의 판단에 넣어서는 안 된다. 지금 물어야 할 것은 「지금까지 얼마를 썼나」가 아니라 「앞으로 쓸 돈이 값어치를 하는가」뿐이다.",
  "그런데 사람은 쓴 돈이 클수록 그만두기 어려워한다. 계속하는 편이 유리해서가 아니라, 멈추는 순간 그동안의 판단이 틀렸다고 인정하는 일이 되기 때문이다. 이것을 <b>집착의 확대(escalation of commitment)</b>라 부른다.",
  "조직은 이 함정을 개인의 의지로 막지 못한다. 그래서 <b>단계별 관문(stage gate)</b>을 미리 세워 둔다. 다음 단계로 갈 자격을 매번 새로 증명하게 하는 장치이고, 핵심은 기준을 <b>숫자가 나오기 전에</b> 합의해 두는 것이다.",
  "관문이 실제로 작동하려면 <b>멈추는 것이 실패가 아니어야</b> 한다. 중단을 말한 사람이 불이익을 받는 조직에서는 아무도 관문에서 손을 들지 않고, 보고서는 전부 노란불이 되며, 관문은 서명 절차로 전락한다."
 ],
 lines:[
  {s:"A",en:"We are eighteen months into this project, and I want to ask whether it should continue.",
   ko:"이 프로젝트에 들어온 지 열여덟 달입니다. 계속해야 하는지 묻고 싶습니다.",
   notes:[{t:"be ~ into a project",k:"grammar",m:"프로젝트에 ~ 만큼 들어와 있다",tip:"경과 기간을 말하는 형태입니다."}]},
  {s:"B",en:"We have completed two thirds of it, so stopping now discards everything we have already spent.",
   ko:"3분의 2를 마쳤습니다. 지금 멈추면 지금까지 쓴 것을 전부 버리게 됩니다.",
   notes:[{t:"discard",k:"business",m:"버리다, 폐기하다",tip:"throw away 보다 격식 있습니다."}]},
  {s:"A",en:"That money is a sunk cost and it is gone in both cases. The question is whether the next year is worth it.",
   ko:"그 돈은 매몰비용이고 어느 쪽이든 이미 나갔습니다. 질문은 앞으로의 1년이 값어치가 있느냐입니다.",
   notes:[{t:"a sunk cost",k:"business",m:"매몰비용",tip:"이미 지출되어 회수할 수 없는 비용입니다. 의사결정에서 제외해야 합니다."},
          {t:"in both cases",k:"collocation",m:"어느 쪽이든",tip:"두 선택지 모두에서 결과가 같다는 뜻입니다."}]},
  {s:"B",en:"That is simple to say from finance, when my team has worked on nothing else for a year.",
   ko:"우리 팀은 1년 동안 다른 일을 하지 않았는데, 재무에서는 말하기 쉬운 얘기입니다.",
   notes:[{t:"work on nothing else",k:"collocation",m:"다른 일은 하지 않다",tip:"전념했다는 것을 강조하는 표현입니다."}]},
  {s:"A",en:"I am not calling the work wasted. I am saying the reason we started has changed and nobody checked.",
   ko:"그 일이 헛되다는 게 아닙니다. 시작한 이유가 바뀌었는데 아무도 확인하지 않았다는 얘기입니다.",
   notes:[{t:"I am not A. I am B.",k:"grammar",m:"저는 A가 아니라 B라고 말하는 겁니다",tip:"오해를 즉시 바로잡는 두 문장 골격입니다."}]},
  {s:"B",en:"That is correct. The business case was built on volumes that never materialized.",
   ko:"맞습니다. 사업 근거는 끝내 실현되지 않은 물량 위에 세워졌습니다.",
   notes:[{t:"a business case",k:"business",m:"사업 타당성 근거",tip:"왜 이 투자를 해야 하는지를 정리한 문서입니다."},
          {t:"materialize",k:"business",m:"실현되다",tip:"예상한 일이 실제로 일어나는 것입니다."}]},
  {s:"A",en:"That is what I needed to hear, because your status reports have been amber for four consecutive quarters.",
   ko:"그 말을 들어야 했습니다. 보고서가 네 분기 연속 노란색이었거든요.",
   notes:[{t:"amber",k:"business",m:"황색 경고 상태",tip:"녹색은 정상, 적색은 위험, 황색은 주의입니다."},
          {t:"consecutive",k:"business",m:"연속된",tip:"four consecutive quarters = 네 분기 연속."}]},
  {s:"B",en:"People write amber because red produces a meeting like this one and green produces no attention.",
   ko:"사람들이 노란색을 쓰는 이유는, 빨간색은 이런 회의를 부르고 초록색은 관심을 못 받기 때문입니다.",
   notes:[{t:"produce attention",k:"collocation",m:"관심을 불러오다",tip:"결과를 만들어 낸다는 뜻의 중립적 동사입니다."}]},
  {s:"A",en:"Then the reporting system is broken, and I would rather fix that than argue from bad information.",
   ko:"그럼 보고 체계가 망가진 겁니다. 나쁜 정보 위에서 다투느니 그걸 고치겠습니다.",
   notes:[{t:"argue from bad information",k:"collocation",m:"잘못된 정보를 근거로 다투다",tip:"전제가 틀린 논쟁을 가리킵니다."}]},
  {s:"B",en:"Fix it by making red a safe thing to report, because at the moment stopping is treated as failure.",
   ko:"빨간색을 보고해도 안전하게 만들어서 고치세요. 지금은 멈추는 것이 실패로 취급됩니다.",
   notes:[{t:"a safe thing to report",k:"collocation",m:"보고해도 안전한 것",tip:"심리적 안전의 조건을 평이하게 표현합니다."}]},
  {s:"A",en:"Agreed, and that is the company's failure, because ending a project early should count as good judgment.",
   ko:"동의합니다. 그건 회사의 잘못입니다. 프로젝트를 일찍 끝내는 건 좋은 판단으로 인정돼야 하니까요.",
   notes:[{t:"count as ~",k:"phrasal",m:"~ 로 인정되다, ~ 로 간주되다",tip:"평가 기준을 말합니다."}]},
  {s:"B",en:"Then say that in the meeting, because everyone saw what happened to the last person who stopped one.",
   ko:"그럼 회의에서 그렇게 말해 주세요. 지난번에 프로젝트를 멈춘 사람이 어떻게 됐는지 다들 봤으니까요.",
   notes:[{t:"say that in the meeting",k:"collocation",m:"회의에서 그렇게 말하다",tip:"공개적으로 밝히는 것이 핵심입니다."}]},
  {s:"A",en:"I will, but I still need a decision, and I would rather get it from you than from a spreadsheet.",
   ko:"그러겠습니다. 다만 결정은 여전히 필요하고, 스프레드시트보다 그쪽에게서 듣고 싶습니다.",
   notes:[{t:"get a decision from ~",k:"collocation",m:"~ 에게서 결정을 받다",tip:"책임 있는 판단을 요구하는 것입니다."}]},
  {s:"B",en:"Give me a stage gate with real criteria and I will accept the outcome, whatever it is.",
   ko:"진짜 기준이 있는 단계 관문을 주시면, 결과가 무엇이든 받아들이겠습니다.",
   notes:[{t:"a stage gate",k:"business",m:"단계 관문",tip:"다음 단계로 넘어갈지 판정하는 공식 심사 지점입니다."},
          {t:"criteria",k:"business",m:"판정 기준",tip:"criterion 의 복수형입니다."}]},
  {s:"A",en:"That is reasonable. Three conditions, measured at quarter end, and all agreed in advance of the quarter.",
   ko:"합리적입니다. 조건 셋, 분기 말에 측정, 그리고 전부 분기에 앞서 사전 합의.",
   notes:[{t:"agreed in advance",k:"collocation",m:"사전에 합의된",tip:"나중에 바꿀 수 없다는 점이 핵심입니다."}]},
  {s:"B",en:"Agreeing in advance is the part that matters, because criteria written afterwards only justify a decision already made.",
   ko:"사전 합의가 핵심입니다. 나중에 쓴 기준은 이미 내려진 결정을 정당화할 뿐이니까요.",
   notes:[{t:"justify a decision",k:"business",m:"결정을 정당화하다",tip:"사후에 근거를 붙이는 것을 가리킵니다."}]},
  {s:"A",en:"You will have them in writing this week, and if the project passes, the funding continues automatically.",
   ko:"이번 주에 문서로 드리겠습니다. 통과하면 예산은 자동으로 이어집니다.",
   notes:[{t:"funding",k:"business",m:"예산 지원",tip:"프로젝트에 배정된 자금입니다."}]},
  {s:"B",en:"And if it does not pass, I want to reassign the team quickly rather than leave them waiting.",
   ko:"통과하지 못하면, 팀을 기다리게 두지 말고 빨리 재배치하고 싶습니다.",
   notes:[{t:"reassign",k:"business",m:"재배치하다",tip:"다른 업무로 인력을 옮기는 것입니다."}]},
  {s:"A",en:"I can promise that, because the worst part of stopping a project is the silence that follows.",
   ko:"그건 약속할 수 있습니다. 프로젝트를 멈출 때 최악은 그 뒤에 이어지는 침묵이니까요.",
   notes:[{t:"the worst part of ~",k:"grammar",m:"~ 에서 가장 나쁜 점",tip:"문제의 핵심을 지목하는 형태입니다."}]},
  {s:"B",en:"Then let us put it in writing, because I would rather be judged on criteria than on impressions.",
   ko:"그럼 문서로 남깁시다. 저는 인상보다 기준으로 평가받는 편이 낫습니다.",
   notes:[{t:"be judged on ~",k:"grammar",m:"~ 를 기준으로 평가받다",tip:"평가의 근거를 지정합니다."},
          {t:"an impression",k:"business",m:"인상, 주관적 느낌",tip:"criteria 와 대비되는 판단 근거입니다."}]}
 ],

{
 id:"w3d1", day:16, cat:"투자·시장", level:"B2+",
 title:"Why Cheap Stays Cheap",
 titleKo:"싼 주식은 왜 계속 싼가 — 저평가와 밸류 트랩",
 names:{A:"Mina (리서치)", B:"Dohyun (개인 투자자)"},
 brief:[
  "주식이 싸다는 말은 대개 <b>이익 대비 값</b>이 낮다는 뜻입니다. 그것을 재는 가장 흔한 잣대가 주가수익비율(PER)이고, 영어로는 <b>trade at X times earnings</b>라고 말합니다. 「PER이 4배다」가 아니라 「이익의 네 배에 거래된다」고 표현하는 것이 자연스럽습니다.",
  "문제는 싼 데는 대개 이유가 있다는 점입니다. 시장이 그 회사의 이익을 <b>지속되지 않을 이익</b>으로 보거나, 지배구조·배당·업황 주기를 할인 요인으로 잡고 있을 수 있습니다. 싸 보이지만 계속 싼 채로 머무는 주식을 <b>value trap(밸류 트랩)</b>이라 부릅니다.",
  "그래서 던져야 할 질문은 「싼가」가 아니라 <b>What's driving the price?(무엇이 주가를 움직이는가)</b>입니다. 할인의 이유가 사라질 수 있는 것인지, 구조적으로 남는 것인지에 따라 답이 갈립니다.",
  "손실을 말하는 영어도 정해져 있습니다. <b>I'm down forty percent</b>가 가장 자연스럽고, 평가손실을 안고 있다는 뜻으로 <b>sitting on a loss</b>를 씁니다. 팔지 않고 계속 들고 가겠다는 말은 <b>hold on to</b>입니다."
 ],
 lines:[

   notes:[{t:"hold a position",k:"business",m:"포지션을 보유하다",tip:"주식이나 자산을 들고 있는 상태입니다."},
          {t:"an entry price",k:"business",m:"매수가, 진입 가격",tip:"처음 산 가격입니다. exit price 와 짝입니다."}]},
  {s:"B",en:"About forty percent down, and I stopped opening the application for a couple of months.",
   ko:"40퍼센트쯤 내려와 있고, 두어 달은 앱을 열지 않았습니다.",
   notes:[{t:"be forty percent down",k:"business",m:"40퍼센트 하락한 상태다",tip:"손실 폭을 말하는 표준 표현입니다."}]},
  {s:"A",en:"What is your reason for holding it from today's price, rather than from the price you paid?",

   notes:[{t:"from today's price",k:"collocation",m:"오늘 가격을 기준으로",tip:"매몰비용을 배제하고 판단하라는 요구입니다."}]},
  {s:"B",en:"It trades at four times earnings, while the American company doing the same work trades at thirteen.",

   notes:[{t:"trade at X times earnings",k:"business",m:"이익의 X배에 거래되다",tip:"PER 을 말하는 실무 표현입니다."}]},
  {s:"A",en:"On that single number it looks cheap, but a low price alone is not an investment reason.",

  {s:"B",en:"Why not? If the earnings are genuine, the gap between the two should close eventually.",

   notes:[{t:"close a gap",k:"collocation",m:"격차가 좁혀지다",tip:"narrow the gap 도 같은 뜻입니다."}]},
  {s:"A",en:"Only if the market believes those earnings will continue, and it may be pricing in a downturn.",
   ko:"그 이익이 계속된다고 시장이 믿을 때만입니다. 시장은 경기 하강을 가격에 반영하고 있을 수도 있습니다.",
   notes:[{t:"price in ~",k:"business",m:"~ 를 가격에 미리 반영하다",tip:"시장이 예상을 주가에 넣어 두는 것입니다."},
          {t:"a downturn",k:"business",m:"경기 하강",tip:"upturn(경기 상승)과 반대입니다."}]},
  {s:"B",en:"You are saying the earnings I am looking at are near the peak of the business cycle.",
   ko:"제가 보고 있는 이익이 경기 순환의 정점 근처라는 말씀이군요.",
   notes:[{t:"the business cycle",k:"business",m:"경기 순환",tip:"확장과 수축을 반복하는 경제의 주기입니다."}]},
  {s:"A",en:"That is one interpretation. Cyclical earnings appear cheapest immediately before they decline.",

  {s:"B",en:"The discount has been there for several years, through more than one complete cycle.",
   ko:"그 할인은 몇 년째 있었습니다. 완전한 순환을 한 번 이상 지나는 동안에도요.",
   notes:[{t:"a discount",k:"business",m:"할인, 저평가 폭",tip:"동종 기업 대비 낮게 평가된 정도입니다."}]},
  {s:"A",en:"Then the cause is not the cycle. Something structural is keeping the price down permanently.",
   ko:"그럼 원인은 순환이 아닙니다. 구조적인 무언가가 주가를 계속 눌러 두고 있습니다.",
   notes:[{t:"structural",k:"business",m:"구조적인",tip:"일시적이 아니라 근본적인 원인을 가리킵니다."}]},
  {s:"B",en:"Such as what? Governance, the dividend policy, or the fact that no analyst covers the company?",
   ko:"예를 들면 무엇입니까? 지배구조, 배당 정책, 아니면 어떤 애널리스트도 분석하지 않는다는 사실?",
   notes:[{t:"governance",k:"business",m:"지배구조",tip:"경영진과 주주의 관계, 의사결정 구조입니다."},
          {t:"cover a company",k:"business",m:"기업을 분석하다",tip:"증권사가 정기적으로 보고서를 내는 것입니다."}]},
  {s:"A",en:"Any of those. A discount with a permanent cause is a value trap, not a buying opportunity.",
   ko:"그중 무엇이든요. 원인이 영구적인 할인은 매수 기회가 아니라 가치 함정입니다.",
   notes:[{t:"a value trap",k:"business",m:"가치 함정",tip:"싸 보이지만 영원히 싼 채로 남는 주식입니다."}]},

{
 id:"w3d2", day:17, cat:"투자·자산배분", level:"B2+",
 title:"The Ten Percent Rule",
 titleKo:"10퍼센트의 규칙 — 헤지와 비중, 그리고 정치",
 names:{A:"Sena (자산배분 담당)", B:"Won (동료)"},
 brief:[
  "헤지는 수익을 노리는 것이 아니라 <b>다른 자산이 무너질 때 버텨 줄 것</b>을 사 두는 일입니다. 그래서 금 이야기를 할 때 「오를까요」가 아니라 「무엇에 대비하는가」를 먼저 묻습니다. 영어로는 <b>hedge against inflation</b>처럼 against 뒤에 대비 대상을 씁니다.",
  "핵심은 <b>비중(position sizing)</b>입니다. 좋은 자산이라도 비중이 과하면 포트폴리오 전체가 그 자산이 되어 버립니다. 「전체의 10퍼센트를 넘기지 않는다」는 <b>account for no more than ten percent</b>로 말합니다.",
  "정치와 시장의 관계도 자주 오르내립니다. 정부가 시장을 인위적으로 떠받친다는 뜻으로 <b>prop up the market</b>을 쓰고, 선거가 끝나면 그럴 <b>유인(incentive)</b>이 줄어든다는 식으로 이어집니다. 다만 이런 이야기는 근거가 약할 때가 많아, 토론에서는 반박을 받습니다.",
  "마지막은 <b>규칙으로 만들기</b>입니다. 예측이 아니라 절차로 정해 두는 것 — 매달 같은 금액을 넣고, 비중이 어긋나면 되돌리는 <b>rebalance</b>가 그것입니다. 감정이 개입할 자리를 미리 줄이는 방법입니다."
 ],
 lines:[
  {s:"A",en:"You said you want to buy gold again, so tell me exactly what risk you are protecting against.",
   ko:"금을 다시 사고 싶다고 하셨는데, 정확히 어떤 위험에 대비하려는 건지 말해 주세요.",
   notes:[{t:"protect against a risk",k:"business",m:"위험에 대비하다",tip:"hedge against 의 평이한 표현입니다."}]},
  {s:"B",en:"Inflation, mainly. I want an asset that holds its value when cash loses purchasing power.",
   ko:"주로 인플레이션입니다. 현금이 구매력을 잃을 때 값어치를 유지하는 자산을 원합니다.",
   notes:[{t:"purchasing power",k:"business",m:"구매력",tip:"같은 돈으로 살 수 있는 양입니다."},
          {t:"hold its value",k:"collocation",m:"값어치를 유지하다",tip:"가격이 크게 떨어지지 않는다는 뜻입니다."}]},
  {s:"A",en:"That is a reason, not a target. What percentage of the portfolio are you actually proposing?",
   ko:"그건 이유지 목표가 아닙니다. 포트폴리오의 몇 퍼센트를 제안하시는 겁니까?",
   notes:[{t:"That is a reason, not a target.",k:"business",m:"그건 이유지 목표가 아닙니다",tip:"동기와 수치를 구분하라고 요구하는 문장입니다."}]},
  {s:"B",en:"Something small. I do not want it to account for more than ten percent of the total.",
   ko:"적게요. 전체의 10퍼센트를 넘게 차지하는 건 원치 않습니다.",
   notes:[{t:"account for X percent",k:"business",m:"X퍼센트를 차지하다",tip:"구성 비중을 말하는 표준 표현입니다."}]},
  {s:"A",en:"Good, because above ten percent it stops being protection and becomes a position with its own risk.",
   ko:"좋습니다. 10퍼센트를 넘으면 그건 보호 수단이 아니라 그 자체로 위험을 가진 포지션이 됩니다.",
   notes:[{t:"stop being A and become B",k:"grammar",m:"A이기를 멈추고 B가 되다",tip:"성격이 바뀌는 지점을 표시합니다."}]},
  {s:"B",en:"I sold my last commodity position at a loss, so I would prefer to build it gradually.",
   ko:"지난번 원자재 포지션은 손실로 정리했습니다. 그래서 이번에는 천천히 쌓고 싶습니다.",
   notes:[{t:"sell at a loss",k:"business",m:"손실을 보고 매도하다",tip:"sell at a profit 과 반대입니다."},
          {t:"build a position gradually",k:"business",m:"비중을 점차 늘려 가다",tip:"한 번에 사지 않고 나누어 사는 방식입니다."}]},
  {s:"A",en:"Then buy the same amount every month and ignore the price on the day you buy.",
   ko:"그럼 매달 같은 금액을 사고, 사는 날의 가격은 무시하세요.",
   notes:[{t:"ignore the price",k:"collocation",m:"가격을 무시하다",tip:"시점 판단을 배제한다는 뜻입니다."}]},
  {s:"B",en:"That means I also buy in months when the price is already high, which seems inefficient.",
   ko:"그럼 가격이 이미 높은 달에도 사게 된다는 뜻인데, 비효율적으로 보입니다.",
   notes:[{t:"inefficient",k:"business",m:"비효율적인",tip:"자원을 낭비하는 상태입니다."}]},
  {s:"A",en:"You also buy in the months when it is low. The purpose is to remove timing from the decision.",
   ko:"낮은 달에도 삽니다. 목적은 결정에서 시점 판단을 제거하는 것입니다.",
   notes:[{t:"remove A from B",k:"collocation",m:"B에서 A를 제거하다",tip:"변수를 없애 단순화하는 것입니다."}]},
  {s:"B",en:"My timing has been wrong more often than right, so I accept that reasoning.",
   ko:"제 시점 판단은 맞은 것보다 틀린 적이 많았으니, 그 논리는 받아들입니다.",
   notes:[{t:"more often than right",k:"collocation",m:"맞은 것보다 자주",tip:"빈도를 비교하는 자연스러운 표현입니다."}]},
  {s:"A",en:"Then set a written rule and rebalance twice a year, and let the rule make the decision.",
   ko:"그럼 규칙을 문서로 정하고 1년에 두 번 리밸런싱하세요. 결정은 그 규칙이 하게 두고요.",
   notes:[{t:"rebalance",k:"business",m:"비중을 원래대로 되돌리다",tip:"오른 자산을 팔고 내린 자산을 사서 비율을 맞추는 것입니다."},
          {t:"a written rule",k:"business",m:"문서로 정한 규칙",tip:"즉흥적 판단을 막기 위한 장치입니다."}]},
  {s:"B",en:"What about equities? Several people expect prices to fall in the months after the election.",
   ko:"주식은요? 선거 뒤 몇 달 안에 가격이 떨어질 거라고 보는 사람이 여럿입니다.",
   notes:[{t:"equities",k:"business",m:"주식",tip:"주식 자산 전체를 가리키는 금융 용어입니다."}]},
  {s:"A",en:"The argument is that the government supports the market until the vote and then stops.",
   ko:"논리는 정부가 투표 때까지 시장을 떠받치다가 그 뒤에 멈춘다는 것입니다.",
   notes:[{t:"support the market",k:"business",m:"시장을 떠받치다",tip:"정책으로 가격 하락을 막는 것입니다."}]},
  {s:"B",en:"And after the vote they have much less incentive to continue, which is when prices fall.",
   ko:"그리고 투표 뒤에는 계속할 유인이 훨씬 줄어들고, 그때 가격이 떨어진다는 거죠.",
   notes:[{t:"an incentive to ~",k:"business",m:"~ 할 유인",tip:"행동을 유발하는 동기입니다."}]},
  {s:"A",en:"It is a neat explanation, and I am cautious about any thesis that depends on a specific date.",
   ko:"깔끔한 설명입니다. 저는 특정 날짜에 의존하는 논리라면 무엇이든 조심합니다.",
   notes:[{t:"depend on a specific date",k:"collocation",m:"특정 날짜에 의존하다",tip:"시점이 틀리면 전체가 무너지는 논리입니다."},

  {s:"B",en:"That is a fair warning. I have lost money on neat explanations more than once.",
   ko:"타당한 경고입니다. 깔끔한 설명 때문에 돈을 잃은 적이 한 번이 아닙니다.",

  {s:"A",en:"If you want to act on it, reduce risk gradually rather than trying to sell at the peak.",

{
 id:"w3d3", day:18, cat:"신기술·훈련", level:"B2+",
 title:"Who Learns to Judge?",
 titleKo:"판단은 누가 배우는가 — 초안을 기계가 쓸 때",
 names:{A:"Hyun (팀장)", B:"Rosa (인재개발)"},
 brief:[
  "초안을 만드는 일이 쉬워지면서 일의 무게중심이 <b>생산에서 검증으로</b> 옮겨 갔습니다. 예전에는 초안을 쓰는 것이 가장 오래 걸리고 가장 중요한 일이었지만, 지금은 나온 것을 따져 보는 능력이 더 값어치 있게 됐습니다.",
  "문제는 <b>그 검증 능력이 어디서 오느냐</b>입니다. 좋은 검토자는 대개 직접 만들어 본 사람입니다. 숫자를 손으로 맞춰 보고, 틀려 보고, 어디가 잘 틀리는지 몸으로 아는 사람이 어디를 봐야 할지 압니다.",
  "그래서 생기는 것이 이 회차의 쟁점입니다. 신입이 초안을 한 번도 만들어 보지 않고 검토자부터 시작하면, <b>무엇을 근거로 판단하는가</b>. 조직은 효율을 얻고 그 대가로 다음 세대의 판단력을 잃을 수 있습니다.",
  "실무의 해법은 대개 둘 중 하나입니다. 일부러 <b>손으로 해 보는 구간(reps)</b>을 남겨 두거나, 검토를 가르치는 훈련을 따로 만드는 것입니다. 어느 쪽이든 <b>그냥 두면 저절로 생기지 않는다</b>는 것이 출발점입니다."
 ],
 lines:[

{

 title:"The New Hire Who Never Sleeps",
 titleKo:"잠들지 않는 신입 — AI 에이전트를 데리고 일하기",

 brief:[
  "글을 만들어 주던 도구가 이제 <b>컴퓨터를 직접 쓰는 단계</b>로 넘어왔습니다. 파일을 열고 자료를 읽고 결과물을 만들어 냅니다. 영어로는 이런 것을 <b>an agent</b>라 부르고, 사람을 대신해 실제로 일을 <b>실행한다(carry out)</b>는 점에서 이전과 다릅니다.",
  "그래서 비유가 바뀝니다. 도구가 아니라 <b>아주 유능하지만 맥락을 모르는 신입</b>에 가깝습니다. 신입에게 필요한 것과 똑같은 것이 필요합니다 — 목표, 배경, 판단 기준, 그리고 어디까지 스스로 정해도 되는지의 선.",
  "여기서 <b>지시를 잘 쓰는 일(prompting)</b>과 <b>일이 되게 판을 짜는 일</b>이 갈립니다. 후자는 도구·규칙·검토 절차·피드백까지 포함하는 설계입니다. 사람에게 맡길 때 우리가 늘 하던 일과 다르지 않습니다.",
  "마지막 쟁점은 <b>어디까지 맡길 것인가</b>입니다. 되돌릴 수 있는 일과 되돌릴 수 없는 일을 가르는 것이 실무의 기준선이고, 이것은 신입에게 권한을 주는 방식과 정확히 같습니다."
 ],
 lines:[

 title:"Do We Still Need to Code?",

 names:{A:"Tae (기획, 비개발자)", B:"Noor (개발자)"},
 brief:[
  "프로그래밍 언어는 결국 <b>기계가 알아듣도록 만든 언어</b>입니다. 그래서 사람의 말을 코드로 옮기는 일을 <b>번역</b>에 비유하는 시각이 자연스럽게 나옵니다. 원하는 것을 말하면 도구가 옮겨 준다는 그림입니다.",
  "이 비유의 강점은 분명합니다. 예전에는 문법을 익히는 데 몇 년이 들었고, 그 문턱 때문에 아이디어가 <b>코드로 옮겨지지 못한 채</b> 사라졌습니다. 이제는 말로 설명하는 것만으로 움직이는 것이 나옵니다.",
  "약점도 분명합니다. 번역은 <b>무엇을 원하는지 아는 사람</b>이 있어야 성립합니다. 그리고 프로그램은 글과 달리 <b>틀리면 조용히 잘못 돌아갑니다</b>. 그때 필요한 것이 디버깅이고, 디버깅은 결국 「기계가 실제로 무엇을 하는가」를 읽는 일입니다.",
  "그래서 쟁점은 「언어를 외울 필요가 있는가」가 아니라 <b>어떤 개념을 알아야 하는가</b>로 옮겨 갑니다. 문법은 덜 중요해졌지만, 자료가 어떻게 흐르고 무엇이 어디서 깨지는지에 대한 감각은 그대로 필요합니다."
 ],
 lines:[
  {s:"A",en:"I have started to describe it as a translator between what I want and the code.",
   ko:"저는 이걸 제가 원하는 것과 코드 사이의 번역기라고 설명하기 시작했습니다.",
   notes:[{t:"describe A as B",k:"business",m:"A를 B라고 설명하다",tip:"비유나 정의를 제시하는 동사입니다."}]},
  {s:"B",en:"That describes what it does. At what point does the comparison stop being accurate?",
   ko:"하는 일에 대한 설명으로는 맞습니다. 그 비교는 어느 지점부터 정확하지 않게 됩니까?",
   notes:[{t:"At what point does ~ ?",k:"business",m:"어느 지점부터 ~ 합니까",tip:"한계가 시작되는 경계를 묻는 질문입니다."}]},
  {s:"A",en:"I am not sure it does, because a programming language was designed for machines to read.",
   ko:"정확하지 않게 되는 지점이 있는지 모르겠습니다. 프로그래밍 언어는 기계가 읽으라고 만든 거니까요.",
   notes:[{t:"be designed for ~",k:"grammar",m:"~ 를 위해 설계되다",tip:"목적을 명시하는 수동 표현입니다."}]},
  {s:"B",en:"True, but translation requires somebody who already knows what they want to say.",
   ko:"맞습니다. 다만 번역에는 무엇을 말하고 싶은지 이미 아는 사람이 필요합니다.",
   notes:[{t:"require",k:"business",m:"필요로 하다",tip:"need 보다 격식 있고 조건을 강조합니다."}]},
  {s:"A",en:"Describing what I want is the part I am confident about, so that requirement is met.",
   ko:"원하는 것을 설명하는 건 제가 자신 있는 부분이니, 그 조건은 충족됩니다.",
   notes:[{t:"a requirement is met",k:"business",m:"요건이 충족되다",tip:"조건을 만족시켰다는 뜻입니다."}]},
  {s:"B",en:"Then describe what should happen when two rules you wrote produce conflicting results.",
   ko:"그럼 직접 쓴 규칙 두 개가 서로 모순된 결과를 낼 때 어떻게 되어야 하는지 설명해 보세요.",
   notes:[{t:"conflicting results",k:"collocation",m:"서로 모순되는 결과",tip:"둘이 동시에 성립할 수 없는 상태입니다."}]},
  {s:"A",en:"That is a good example, and I would not have thought to specify that case myself.",
   ko:"좋은 예입니다. 그 경우를 제가 직접 명시할 생각은 못 했을 겁니다.",
   notes:[{t:"specify",k:"business",m:"명시하다, 구체적으로 지정하다",tip:"요건 정의의 핵심 동사입니다. specify the format / the conditions."}]},
  {s:"B",en:"That is most of programming: deciding what happens in the cases nobody thinks about.",
   ko:"그게 프로그래밍의 대부분입니다. 아무도 생각하지 않는 경우에 어떻게 할지 정하는 것.",
   notes:[{t:"the cases nobody thinks about",k:"collocation",m:"아무도 생각하지 않는 경우들",tip:"edge case 를 평이하게 표현한 것입니다."}]},
  {s:"A",en:"I would still rather describe those cases in Korean than learn the syntax first.",
   ko:"그래도 저는 문법을 먼저 배우느니 그 경우들을 한국어로 설명하겠습니다.",
   notes:[{t:"syntax",k:"business",m:"문법, 표기 규칙",tip:"언어의 형태 규칙입니다. semantics(의미)와 짝입니다."}]},
  {s:"B",en:"I agree, because syntax was never the valuable part of programming as a skill.",
   ko:"동의합니다. 문법이 프로그래밍이라는 능력에서 값어치 있는 부분이었던 적은 없으니까요.",
   notes:[{t:"the valuable part of ~",k:"collocation",m:"~ 에서 값어치 있는 부분",tip:"핵심 역량이 무엇인지 지목합니다."}]},
  {s:"A",en:"So we agree that memorizing a language is no longer necessary for someone in my role.",
   ko:"그럼 제 위치에 있는 사람에게 언어 암기가 더는 필요하지 않다는 데 동의하시는군요.",
   notes:[{t:"no longer necessary",k:"collocation",m:"더는 필요하지 않은",tip:"과거와 달라진 조건을 말합니다."}]},
  {s:"B",en:"Only partly. You do not need the grammar, but you do need to read what it produced.",
   ko:"일부만 그렇습니다. 문법은 필요 없지만, 그것이 만들어 낸 것을 읽을 줄은 알아야 합니다.",
   notes:[{t:"Only partly.",k:"business",m:"일부만 그렇습니다",tip:"전면 동의를 피하는 정확한 부분 부정입니다."}]},
  {s:"A",en:"Why, if it works? I can test the output without reading a single line of the code.",
   ko:"돌아가면 됐지 왜요? 코드를 한 줄도 읽지 않고 결과를 시험할 수 있는데요.",
   notes:[{t:"test the output",k:"business",m:"결과물을 시험하다",tip:"의도대로 동작하는지 확인하는 것입니다."}]},
  {s:"B",en:"Because code can fail without any error message, and it will keep producing wrong numbers.",
   ko:"코드는 오류 메시지 없이 실패할 수 있고, 계속 틀린 숫자를 만들어 내기 때문입니다.",
   notes:[{t:"fail without an error message",k:"collocation",m:"오류 메시지 없이 실패하다",tip:"가장 발견하기 어려운 실패 유형입니다."}]},
  {s:"A",en:"That is the part that concerns me, because I would have no way of knowing it was wrong.",
   ko:"저를 우려하게 하는 게 그 부분입니다. 틀렸다는 걸 알 방법이 없으니까요.",
   notes:[{t:"have no way of ~ing",k:"grammar",m:"~ 할 방법이 없다",tip:"불가능을 분명히 말하는 형태입니다."}]},
  {s:"B",en:"So learn concepts rather than languages: how data moves, and where it usually breaks.",
   ko:"그럼 언어가 아니라 개념을 배우세요. 자료가 어떻게 흐르고 주로 어디서 깨지는지.",
   notes:[{t:"concepts rather than languages",k:"collocation",m:"언어가 아니라 개념",tip:"학습의 초점을 옮기는 대비 표현입니다."}]},
  {s:"A",en:"That is a shorter list of things to learn than the one I was expecting.",
   ko:"제가 예상했던 것보다 배울 것의 목록이 짧습니다.",
   notes:[{t:"a list of things to learn",k:"collocation",m:"배울 것의 목록",tip:"학습 범위를 가리킵니다."}]},
  {s:"B",en:"It is shorter, but it is not empty, and many people claim that it is.",
   ko:"짧습니다. 다만 비어 있지는 않은데, 많은 사람이 비어 있다고 주장합니다.",
   notes:[{t:"claim that ~",k:"business",m:"~ 라고 주장하다",tip:"근거 없이 말한다는 함의가 약간 있습니다."}]},
  {s:"A",en:"Then I will keep building things and read enough code to question the result it gives me.",
   ko:"그럼 계속 만들면서, 그것이 주는 결과에 의문을 제기할 만큼만 코드를 읽겠습니다.",
   notes:[{t:"question a result",k:"business",m:"결과에 의문을 제기하다",tip:"그대로 받아들이지 않는 태도입니다."}]},
  {s:"B",en:"That is the right level, because you do not need to write code in order to check it.",
   ko:"그게 적절한 수준입니다. 코드를 확인하기 위해 직접 쓸 필요는 없으니까요.",
   notes:[{t:"You do not need to A to B",k:"grammar",m:"B 하려고 A 할 필요는 없다",tip:"필요 조건을 부정하는 형태입니다."}]}
 ],

{
 id:"w3d6", day:21, cat:"공급망·현지화", level:"B2+",
 title:"Make Where You Sell",
 titleKo:"파는 곳에서 만들기 — 현지화는 비용인가 보험인가",
 names:{A:"Hyun (구매 총괄)", B:"Dana (현지 법인장)"},
 brief:[
  "지난 30년의 공급망은 하나의 질문만 물었습니다. <b>어디서 만들면 가장 쌉니까.</b> 그 답을 따라 공장이 옮겨 다녔고, 재고는 얇아졌으며, 배는 정확히 제때 도착한다는 전제 위에 모든 계획이 올라섰습니다.",
  "그 전제가 몇 번 깨졌습니다. 항구가 막히고, 국경이 닫히고, 관세가 하룻밤에 바뀌었습니다. 그래서 요즘 회사들이 던지는 질문이 바뀌었습니다. <b>가장 싼 곳</b>이 아니라 <b>끊겨도 견디는 구조</b>를 묻습니다.",
  "대안은 대체로 셋입니다. 같은 부품을 여러 나라에서 사는 <b>다중 소싱</b>, 파는 시장 안에서 만드는 <b>현지화</b>, 그리고 그냥 재고를 더 쌓는 것. 셋 다 돈이 듭니다. 그래서 논쟁은 「할 것인가」가 아니라 <b>얼마를 보험료로 낼 것인가</b>가 됩니다.",
  "이 대화에서 유용한 것은 결론이 아니라 <b>비용을 보험으로 바꿔 말하는 언어</b>입니다. 「비싸다」를 「무엇에 대한 대가인가」로 되묻는 문장들을 익혀 두면, 어떤 투자 논의에서도 그대로 쓸 수 있습니다."
 ],
 lines:[
  {s:"A",en:"For thirty years we asked only one question: where can we manufacture this at the lowest cost?",
   ko:"30년 동안 우리는 질문 하나만 했습니다. 어디서 만들면 원가가 가장 낮은가?",
   notes:[{t:"at the lowest cost",k:"collocation",m:"가장 낮은 원가로",tip:"비용 기준의 의사결정을 표현합니다."}]},
  {s:"B",en:"That worked until the shipments stopped arriving on the dates we had planned for.",
   ko:"그건 선적이 우리가 계획한 날짜에 도착하지 않게 되기 전까지는 통했습니다.",
   notes:[{t:"arrive on the planned date",k:"collocation",m:"계획한 날짜에 도착하다",tip:"납기 준수를 평이하게 표현합니다."}]},
  {s:"A",en:"One difficult quarter does not cancel thirty years of buying at the lowest available price.",
   ko:"어려운 분기 하나가 가장 싼 값에 사 온 30년을 없던 일로 만들지는 않습니다.",
   notes:[{t:"cancel",k:"business",m:"무효로 만들다, 상쇄하다",tip:"앞선 성과를 지운다는 뜻입니다."}]},
  {s:"B",en:"It was not one quarter. We missed the selling season twice within three years.",
   ko:"한 분기가 아니었습니다. 3년 안에 판매 성수기를 두 번 놓쳤습니다.",
   notes:[{t:"the selling season",k:"business",m:"판매 성수기",tip:"수요가 집중되는 기간입니다."}]},
  {s:"A",en:"I accept that, but manufacturing here costs about eighteen percent more on every unit.",
   ko:"그건 인정합니다. 다만 여기서 만들면 개당 18퍼센트쯤 더 듭니다.",
   notes:[{t:"per unit",k:"business",m:"단위당, 개당",tip:"원가를 비교하는 표준 기준입니다."}]},
  {s:"B",en:"Eighteen percent more than what? You are comparing it to a year in which nothing went wrong.",
   ko:"무엇보다 18퍼센트 더입니까? 아무 일도 일어나지 않은 해와 비교하고 계십니다.",
   notes:[{t:"X more than what?",k:"business",m:"무엇보다 X 더입니까",tip:"비교 대상을 드러내라고 요구하는 반문입니다."}]},
  {s:"A",en:"More than our normal cost, because that is the only figure I can build a budget on.",
   ko:"평상시 원가보다입니다. 제가 예산을 세울 수 있는 유일한 수치가 그것이니까요.",
   notes:[{t:"build a budget on ~",k:"business",m:"~ 를 기준으로 예산을 세우다",tip:"계획의 근거 수치를 말합니다."}]},
  {s:"B",en:"Then your budget assumes that nothing goes wrong, and that assumption has a cost of its own.",
   ko:"그럼 예산이 아무 일도 일어나지 않는다고 전제하는 겁니다. 그 전제에는 그 자체의 비용이 있습니다.",
   notes:[{t:"an assumption has a cost",k:"business",m:"전제에 비용이 따른다",tip:"틀렸을 때의 손실을 가리킵니다."}]},
  {s:"A",en:"Then treat it as insurance. What exactly do I receive in return for eighteen percent?",
   ko:"그럼 보험으로 취급합시다. 18퍼센트의 대가로 제가 정확히 무엇을 받습니까?",
   notes:[{t:"in return for ~",k:"collocation",m:"~ 의 대가로",tip:"교환 관계를 명시합니다."}]},
  {s:"B",en:"Two weeks of lead time instead of eleven, and a supply route that a border cannot close.",
   ko:"리드타임이 11주가 아니라 2주가 되고, 국경이 막을 수 없는 공급 경로가 생깁니다.",
   notes:[{t:"a supply route",k:"business",m:"공급 경로",tip:"원재료나 제품이 이동하는 길입니다."}]},
  {s:"A",en:"That matters more than I want to admit, because lead time is what customers complain about.",
   ko:"인정하고 싶은 것보다 중요합니다. 고객이 불평하는 게 리드타임이니까요.",
   notes:[{t:"lead time",k:"business",m:"리드타임",tip:"주문에서 납품까지 걸리는 시간입니다."}]},
  {s:"B",en:"Then calculate the cost of that complaint. What does one late shipment cost in lost orders?",
   ko:"그럼 그 불평의 비용을 계산하세요. 늦은 선적 한 번이 잃은 주문으로 얼마입니까?",
   notes:[{t:"calculate the cost of ~",k:"business",m:"~ 의 비용을 계산하다",tip:"막연한 손실을 숫자로 바꾸는 요구입니다."},
          {t:"lost orders",k:"business",m:"놓친 주문",tip:"받지 못한 매출을 가리킵니다."}]},
  {s:"A",en:"We have never measured that, because we measure what we spend and not what we fail to earn.",
   ko:"그건 재 본 적이 없습니다. 우리는 쓰는 돈을 재지, 벌지 못한 것을 재지는 않으니까요.",
   notes:[{t:"fail to earn",k:"collocation",m:"벌지 못하다",tip:"기회 손실을 표현하는 방식입니다."}]},
  {s:"B",en:"That is why the cheapest option always wins: only one side of the comparison is measured.",
   ko:"그래서 가장 싼 선택지가 늘 이깁니다. 비교의 한쪽만 측정되니까요.",
   notes:[{t:"one side of the comparison",k:"collocation",m:"비교의 한쪽",tip:"양쪽을 다 보지 않는 상태를 지적합니다."}]},
  {s:"A",en:"I would prefer not to move everything at once, because that is a large and irreversible decision.",
   ko:"전부를 한꺼번에 옮기고 싶지는 않습니다. 그건 크고 되돌릴 수 없는 결정이니까요.",
   notes:[{t:"irreversible",k:"business",m:"되돌릴 수 없는",tip:"한 번 하면 원상 복구가 어려운 결정입니다."}]},
  {s:"B",en:"Nobody is proposing that. Move only the parts that stop production when they arrive late.",
   ko:"아무도 그걸 제안하지 않습니다. 늦게 도착하면 생산을 멈추게 하는 부품만 옮기세요.",
   notes:[{t:"stop production",k:"business",m:"생산을 멈추다",tip:"라인이 정지하는 상황입니다."}]},
  {s:"A",en:"That is perhaps six items out of four hundred, which is a proposal I could defend.",
   ko:"그건 400개 중 여섯 개쯤이고, 그 정도라면 제가 방어할 수 있는 제안입니다.",
   notes:[{t:"a proposal I could defend",k:"business",m:"제가 방어할 수 있는 제안",tip:"승인 심사를 통과시킬 자신이 있다는 뜻입니다."}]},
  {s:"B",en:"Start with those six, and after two quarters the results will make the case for the rest.",

{

 brief:[
  "「파이트 클럽」이 오래 회자되는 이유는 반전 때문만이 아닙니다. 사람들이 <b>자기가 되고 싶었던 인물을 만들어 내고, 결국 그쪽에 끌려다니는</b> 경험을 어렴풋이 알고 있기 때문입니다.",
  "심리학은 이것을 훨씬 조심스럽게 다룹니다. 임상적 해리 장애는 드물고, 대개 심각한 외상과 연결됩니다. 반면 <b>상황마다 다른 얼굴을 쓰는 것</b>은 병이 아니라 거의 모든 사람이 하는 일입니다.",
  "그래서 흥미로운 질문은 「가면을 쓰는가」가 아닙니다. <b>가면을 벗을 수 있는가</b>, 그리고 <b>여러 얼굴이 서로를 알고 있는가</b>입니다. 회사에서의 나와 집에서의 나가 서로를 부끄러워하기 시작하면 문제가 됩니다.",
  "이 대화는 <b>영화 이야기에서 시작해 자기 이야기로 내려가는</b> 전형적인 영어 대화의 흐름을 담고 있습니다. 소재를 바꿔도 그대로 쓸 수 있는 문장들이 많으니, 흐름 자체를 통째로 익혀 두세요."
 ],
 lines:[
  {s:"A",en:"I watched Fight Club again last night, and it affected me very differently from the first time.",

  {s:"A",en:"Is that an accurate picture of dissociative identity disorder as clinicians actually see it?",

  {s:"A",en:"Then why do so many people recognize something familiar in it? That cannot be accidental.",

 id:"w3d8", day:23, cat:"인생·중년", level:"B2+",

 brief:[
  "중년의 위기를 흔히 <b>후회</b>의 문제로 설명합니다. 그러나 겪는 사람들의 말을 들어 보면, 후회보다 자주 나오는 단어는 <b>좁아짐</b>입니다. 예전에는 열려 있던 문들이 하나씩 조용히 닫힙니다.",

 lines:[

  {s:"A",en:"I eliminated some of those options myself when I chose this company and this city.",

{
 id:"w3d9", day:24, cat:"문화·스타일", level:"B2+",
 title:"Why Italians Dress Well",
 titleKo:"이탈리아 남자들은 왜 옷을 잘 입는가 — 스프레차투라의 경제학",
 names:{A:"Marco (밀라노 출신)", B:"Joon (서울, 패션 무관심)"},
 brief:[
  "「이탈리아 남자는 옷을 잘 입는다」는 말은 흔하지만, 설명은 대개 취향 이야기에서 멈춥니다. 실제 이유의 상당 부분은 <b>산업</b>에 있습니다. 이탈리아 북부는 수백 년 동안 유럽의 직물 생산지였습니다.",
  "좋은 원단이 가까이 있으면 <b>옷값의 구조</b>가 달라집니다. 재단사가 많고, 수선이 싸고, 좋은 옷을 오래 입는 것이 합리적인 선택이 됩니다. 취향은 그 위에서 자랍니다.",
  "여기에 <b>스프레차투라</b>라는 개념이 붙습니다. 애써 노력한 티가 나지 않게 잘 해내는 태도입니다. 옷에서는 「신경 쓴 티 안 나게 신경 쓴」 상태를 뜻합니다. 이 개념 자체가 아주 좋은 영어 대화 소재입니다.",
  "이 대화는 <b>문화적 일반화를 조심스럽게 다루는 법</b>도 함께 연습합니다. 「~ 하는 경향이 있다」, 「그건 과장이다」 같은 표현을 익혀 두면, 국가나 세대를 두고 이야기할 때 훨씬 안전하고 설득력 있게 말할 수 있습니다."
 ],
 lines:[
  {s:"A",en:"You keep saying that Italian men dress well, and I think that is a generalization.",
   ko:"이탈리아 남자들이 옷을 잘 입는다고 계속 말씀하시는데, 저는 그게 일반화라고 봅니다.",

  {s:"B",en:"Generalizations usually have a cause. What produced this particular one?",

  {s:"A",en:"The cause is the textile industry, because northern Italy has produced cloth for six hundred years.",
